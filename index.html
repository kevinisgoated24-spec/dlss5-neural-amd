<!doctype html><html><head>
<meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1">
<title>P10 isolated</title>
<style>body{background:#0a0a0a;color:#e4e4e4;font:13px monospace;padding:16px}
#o{background:#111;border:1px solid #333;border-radius:8px;padding:14px;height:80vh;overflow-y:auto;white-space:pre-wrap;margin-top:10px}
button{background:#ff453a;color:#fff;border:none;padding:12px 20px;border-radius:8px;cursor:pointer;margin:4px}
.g{color:#32d74b}.d{color:#666}.r{color:#ff453a}
</style></head><body>
<button onclick="run(10)">▶ 10 iters</button>
<button onclick="run(50)">▶ 50 iters</button>
<button onclick="run(200)">▶ 200 iters</button>
<div id="o"></div>
<script>
function log(s,c){const d=document.getElementById('o'),e=document.createElement('span');if(c)e.className=c;e.textContent=s+'\n';d.appendChild(e);d.scrollTop=d.scrollHeight;}
async function run(n){
    document.getElementById('o').textContent='';
    log('[*] P10 × '+n+' iters starting...','d');
    for(let i=0;i<n;i++){
        const canvases=[];
        for(let k=0;k<100;k++){
            const oc=new OffscreenCanvas(64,64);
            oc.getContext('2d').fillRect(0,0,64,64);
            canvases.push(oc);
        }
        canvases.splice(0,50);
        for(const oc of canvases){
            const bm=await oc.transferToImageBitmap();
            bm.close();
        }
        log('[*] iter '+i+' done','d');
    }
    log('[+] Completed '+n+' iters — no crash','g');
}
</script></body></html>
