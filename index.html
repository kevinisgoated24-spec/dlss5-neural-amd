<script>
var NS='http://www.w3.org/2000/svg';
var _fb=new ArrayBuffer(8);
var _dv=new Float64Array(_fb);
var _uv=new Uint32Array(_fb);

function f64hex(f){
  if(f===null||f===undefined)return'null';
  _dv[0]=+f;
  return'0x'+_uv[1].toString(16).padStart(8,'0')+'_'+_uv[0].toString(16).padStart(8,'0');
}
function classifyPtr(v){
  if(v===null||v===undefined||typeof v!=='number'||isNaN(v)||!isFinite(v))return null;
  _dv[0]=v; var hi=_uv[1],lo=_uv[0];
  if(hi===0x00000001&&lo>0x1000)return{type:'arm64_tagged',hi,lo};
  if(hi>=0x00000002&&hi<=0x0000ffff&&lo>0x1000)return{type:'native_heap',hi,lo};
  if(hi>=0x00010000&&hi<=0x0001ffff)return{type:'jsc_cell',hi,lo};
  if(hi>=0x00100000&&hi<=0x001fffff)return{type:'pac_ptr',hi,lo};
  if(hi>=0xffff0000)return{type:'kernel',hi,lo};
  return null;
}
function isWeird(v){
  if(typeof v!=='number'||!isFinite(v)||isNaN(v))return false;
  return Math.abs(v)>=16777216;
}
function log(m,c){
  var d=document.getElementById('out'),e=document.createElement('div');
  e.className='result '+(c||'purple'); e.textContent=m;
  d.appendChild(e); e.scrollIntoView({block:'nearest'});
}
function R(m){log(m,'red');}
function B(m){log(m,'blue');}
function P(m){log(m,'purple');}
function hdr(m){log(m,'hdr');}
function prog(m){document.getElementById('progress').textContent=m;}
function clearOut(){document.getElementById('out').innerHTML='';prog('');}
function copyAll(){
  var lines=[];
  document.querySelectorAll('#out .result').forEach(function(e){lines.push(e.textContent);});
  navigator.clipboard&&navigator.clipboard.writeText(lines.join('\n'));
}
function go(s){clearOut();window['run'+s]();}
function runAll(){
  clearOut();
  runIA();
  setTimeout(runIB,300);
  setTimeout(runIC,600);
  setTimeout(runID,900);
  setTimeout(runIE,1200);
  setTimeout(runIF,1500);
}

function mkSVG(w,h,extra){
  var s=document.createElementNS(NS,'svg');
  s.setAttribute('width',w||200); s.setAttribute('height',h||200);
  if(extra)Object.keys(extra).forEach(function(k){s.setAttribute(k,extra[k]);});
  s.style.cssText='position:fixed;left:0;top:0;width:'+(w||200)+'px;height:'+(h||200)+'px;opacity:0.001;pointer-events:none';
  document.body.appendChild(s); return s;
}
function mkEl(p,tag,attrs){
  var e=document.createElementNS(NS,tag);
  if(attrs)Object.keys(attrs).forEach(function(k){e.setAttribute(k,attrs[k]);});
  p.appendChild(e); return e;
}
function probeVal(label,v){
  var p=classifyPtr(v),w=isWeird(v);
  if(p){R(label+'='+f64hex(v)+' POINTER! type='+p.type);}
  else if(w){B(label+'='+f64hex(v)+' weird='+v);}
  else{P(label+'='+v);}
}

// ════════════════════════════════════════════════════════════════════════
// IA — HB[3] deep dive: SVGLength percentage resolution
// In v43: 50% of SVG width=1e9 → 500000000 (correct)
//         100% of SVG width=1e9 → 1 (WRONG — should be 1e9)
// Hypothesis: the SVG width=1e9 is clamped in internal layout
// but the % resolution uses a mix of internal (clamped) and DOM (unclamped)
// The "1" might mean internal LayoutUnit(1e9) → clamped LayoutUnit → 1px
// then 100% * 1px = 1? OR it's an overflow/wraparound
// DEEP PROBE: test many % values, many SVG widths, find the crossover
// ════════════════════════════════════════════════════════════════════════
function runIA(){
  hdr('IA: HB[3] pct=1 anomaly — 100% of SVG width=1e9 deep dive');

  // IA[1]: reproduce the exact anomaly and verify
  hdr('IA[1]: exact reproduce — 100% pct of SVG width=1e9');
  var svg=mkSVG(1,1);
  svg.setAttribute('width','1000000000');
  svg.setAttribute('height','1000000000');
  var rect=mkEl(svg,'rect',{x:'0',y:'0',width:'50',height:'50',fill:'red'});
  var xl=rect.x.baseVal;
  // set 50% first (like v43 did)
  xl.newValueSpecifiedUnits(2,50);
  probeVal('IA[1]: first: 50% SVG-w=1e9',xl.value);
  // now 100%
  xl.newValueSpecifiedUnits(2,100);
  probeVal('IA[1]: then: 100% SVG-w=1e9',xl.value);
  // 100% without prior 50%?
  var rect2=mkEl(svg,'rect',{x:'0',y:'0',width:'50',height:'50',fill:'blue'});
  var xl2=rect2.x.baseVal;
  xl2.newValueSpecifiedUnits(2,100);
  probeVal('IA[1]: fresh rect: 100% SVG-w=1e9',xl2.value);
  // 200%
  xl2.newValueSpecifiedUnits(2,200);
  probeVal('IA[1]: 200% SVG-w=1e9',xl2.value);
  // 1%
  xl2.newValueSpecifiedUnits(2,1);
  probeVal('IA[1]: 1% SVG-w=1e9',xl2.value);
  // 0.001%
  xl2.newValueSpecifiedUnits(2,0.001);
  probeVal('IA[1]: 0.001% SVG-w=1e9',xl2.value);
  svg.remove();

  // IA[2]: sweep SVG widths — find crossover where pct starts glitching
  hdr('IA[2]: pct=100% across SVG widths — find crossover');
  var widths=[100,10000,1000000,10000000,33554428,33554429,100000000,
    2147483647,2147483648,4294967296,1000000000,1000000000000];
  widths.forEach(function(w){
    var s=mkSVG(1,1);
    s.setAttribute('width',w);
    s.setAttribute('height',w);
    var r=mkEl(s,'rect',{x:'0',y:'0',width:'50',height:'50',fill:'red'});
    var xln=r.x.baseVal;
    xln.newValueSpecifiedUnits(2,100); // 100%
    var v=xln.value;
    var p=classifyPtr(v),ww=isWeird(v);
    if(p){R('IA[2]: SVG-w='+w+' 100%='+f64hex(v)+' POINTER!');}
    else if(ww){B('IA[2]: SVG-w='+w+' 100%='+f64hex(v)+' weird='+v);}
    else{P('IA[2]: SVG-w='+w+' 100%='+v+' (expect '+w+')');}
    s.remove();
  });

  // IA[3]: pct resolution on rect.width vs rect.x — different internals?
  hdr('IA[3]: pct on rect.width vs rect.x vs rect.height — different paths?');
  var svg3=mkSVG(1,1);
  svg3.setAttribute('width','1000000000');
  svg3.setAttribute('height','1000000000');
  var rect3=mkEl(svg3,'rect',{x:'0',y:'0',width:'50',height:'50',fill:'red'});
  ['x','y','width','height'].forEach(function(attr){
    [1,10,50,100,200].forEach(function(pct){
      var ln=rect3[attr].baseVal;
      ln.newValueSpecifiedUnits(2,pct);
      probeVal('IA[3]: '+attr+' '+pct+'% of 1e9',ln.value);
    });
  });
  svg3.remove();

  // IA[4]: pct on SVG circle cx/cy/r
  hdr('IA[4]: pct on circle cx/cy/r — different resolution paths');
  var svg4=mkSVG(1,1);
  svg4.setAttribute('width','1000000000');
  svg4.setAttribute('height','1000000000');
  var circ=mkEl(svg4,'circle',{cx:'0',cy:'0',r:'50',fill:'blue'});
  ['cx','cy','r'].forEach(function(attr){
    [50,100].forEach(function(pct){
      var ln=circ[attr].baseVal;
      ln.newValueSpecifiedUnits(2,pct);
      probeVal('IA[4]: circle.'+attr+' '+pct+'% of 1e9',ln.value);
    });
  });
  svg4.remove();

  // IA[5]: createSVGLength on SVG with matching CSS size (not 1px)
  hdr('IA[5]: createSVGLength pct — SVG width attr matches CSS width');
  var svg5=document.createElementNS(NS,'svg');
  svg5.setAttribute('width','1000000000');
  svg5.setAttribute('height','200');
  // give it real CSS size so pct resolves against SVG attr not CSS layout
  svg5.style.cssText='position:fixed;left:0;top:0;width:1000000000px;height:200px;opacity:0.001;pointer-events:none';
  document.body.appendChild(svg5);
  var ln5=svg5.createSVGLength();
  [1,50,100,200].forEach(function(pct){
    try{
      ln5.newValueSpecifiedUnits(2,pct);
      probeVal('IA[5]: createSVGLength '+pct+'% css-w=1e9',ln5.value);
    }catch(e){P('IA[5]: '+pct+'% threw: '+e.name);}
  });
  svg5.remove();

  prog('IA done');
}

// ════════════════════════════════════════════════════════════════════════
// IB — SVGSVGElement.currentScale / currentTranslate
// These are root SVG viewport transform properties.
// currentScale is a float, currentTranslate is SVGPoint
// Setting extreme values: does the engine expose internal state?
// Also: SVGSVGElement.getEnclosureList / checkIntersection / checkEnclosure
// ════════════════════════════════════════════════════════════════════════
function runIB(){
  hdr('IB: SVGSVGElement.currentScale / currentTranslate extreme probe');
  var svg=mkSVG(400,400);

  // IB[1]: currentScale extreme values
  hdr('IB[1]: svg.currentScale at extreme values');
  P('IB[1]: initial currentScale='+svg.currentScale);
  [1e6, 1e9, 1e12, 2147483648, 4294967296, 1e15].forEach(function(v){
    try{
      svg.currentScale=v;
      var rb=svg.currentScale;
      probeVal('IB[1]: set='+v+' readback',rb);
    }catch(e){P('IB[1]: set='+v+' threw: '+e.name);}
  });
  svg.currentScale=1; // reset

  // IB[2]: currentTranslate (SVGPoint) extreme
  hdr('IB[2]: svg.currentTranslate.x at extreme values');
  try{
    var ct=svg.currentTranslate;
    P('IB[2]: initial currentTranslate=('+ct.x+','+ct.y+')');
    [1e9, 1e12, 1e15, 2147483648].forEach(function(v){
      ct.x=v;
      probeVal('IB[2]: set x='+v+' readback',ct.x);
    });
    ct.x=0;
  }catch(e){P('IB[2]: threw: '+e.name);}

  // IB[3]: SVGSVGElement.createSVGMatrix — fresh SVGMatrix from root
  hdr('IB[3]: svg.createSVGMatrix() — read initial values of a fresh matrix');
  var freshMx=svg.createSVGMatrix();
  ['a','b','c','d','e','f'].forEach(function(k){
    var v=freshMx[k];
    var p=classifyPtr(v),w=isWeird(v);
    if(p){R('IB[3]: fresh SVGMatrix.'+k+'='+f64hex(v)+' POINTER!');}
    else if(w){B('IB[3]: fresh SVGMatrix.'+k+'='+f64hex(v)+' weird='+v);}
    else{P('IB[3]: fresh SVGMatrix.'+k+'='+v);}
  });

  // IB[4]: getScreenCTM after currentScale change
  hdr('IB[4]: rect.getScreenCTM after svg.currentScale=1e6');
  var rect=mkEl(svg,'rect',{x:'10',y:'10',width:'50',height:'50',fill:'red'});
  svg.currentScale=1000000;
  var ctm=null;
  try{ctm=rect.getScreenCTM();}catch(e){}
  if(ctm){
    ['a','b','c','d','e','f'].forEach(function(k){
      probeVal('IB[4]: currentScale=1e6 CTM.'+k,ctm[k]);
    });
  }
  svg.currentScale=1;

  // IB[5]: SVGSVGElement.getViewboxToViewportTransform (if exists)
  hdr('IB[5]: SVGSVGElement viewport transform methods');
  ['getViewboxToViewportTransform','getTransformToElement','getCTM'].forEach(function(m){
    if(typeof svg[m]==='function'){
      var result=null;
      try{result=svg[m]();}catch(e){P('IB[5]: '+m+'() threw: '+e.name);}
      P('IB[5]: '+m+' exists, result type='+(result?typeof result:'null'));
    } else {
      P('IB[5]: '+m+' not available');
    }
  });

  svg.remove();
  prog('IB done');
}

// ════════════════════════════════════════════════════════════════════════
// IC — SVGUseElement href swap / referencing changes
// <use> elements maintain a shadow tree referencing the original element.
// Swapping the href while the original is being animated:
// does the internal ref-counting / shadow update path expose state?
// Also: use referencing an element that gets detached/reattached
// ════════════════════════════════════════════════════════════════════════
function runIC(){
  hdr('IC: SVGUseElement href swap / shadow tree probe');
  var svg=mkSVG(400,400);
  var defs=mkEl(svg,'defs');

  // IC[1]: use element href swap — read CTM before and after swap
  hdr('IC[1]: use href swap — CTM probe before/after');
  // create two elements in defs
  var sym1=mkEl(defs,'symbol',{id:'icsym1',overflow:'visible'});
  var r1=mkEl(sym1,'rect',{x:'0',y:'0',width:'50',height:'50',fill:'red'});
  var sym2=mkEl(defs,'symbol',{id:'icsym2',overflow:'visible'});
  var r2=mkEl(sym2,'rect',{x:'0',y:'0',width:'30',height:'30',fill:'blue'});

  var useEl=mkEl(svg,'use',{href:'#icsym1',x:'10',y:'10',width:'100',height:'100'});

  // read CTM before swap
  var ctm1=null;
  try{ctm1=r1.getScreenCTM();}catch(e){}
  P('IC[1]: before swap CTM.e='+(ctm1?ctm1.e:'null'));

  // swap href to sym2
  useEl.setAttribute('href','#icsym2');

  // immediately read CTM of original r1 (now detached from use shadow)
  var ctm1_after=null;
  try{ctm1_after=r1.getScreenCTM();}catch(e){P('IC[1]: r1 CTM after swap threw: '+e.name);}
  if(ctm1_after){probeVal('IC[1]: r1 CTM.e after href swap',ctm1_after.e);}

  // read CTM of r2 (now in use shadow)
  var ctm2=null;
  try{ctm2=r2.getScreenCTM();}catch(e){P('IC[1]: r2 CTM threw: '+e.name);}
  if(ctm2){probeVal('IC[1]: r2 CTM.e after href swap',ctm2.e);}

  // IC[2]: use referencing element with active animation — mid-animation swap
  hdr('IC[2]: use href swap DURING active animation');
  var sym3=mkEl(defs,'symbol',{id:'icsym3',overflow:'visible'});
  var r3=mkEl(sym3,'rect',{x:'0',y:'0',width:'50',height:'50',fill:'green'});
  mkEl(r3,'animateTransform',{
    attributeName:'transform',type:'translate',
    from:'0 0',to:'1000000000 0',
    dur:'5s',repeatCount:'indefinite'
  });

  var useEl2=mkEl(svg,'use',{href:'#icsym3',x:'0',y:'0',width:'200',height:'200'});

  setTimeout(function(){
    // mid-animation: read animVal CTM of r3
    var ctm3_before=null;
    try{ctm3_before=r3.getScreenCTM();}catch(e){}
    P('IC[2]: r3 CTM.e before swap='+(ctm3_before?ctm3_before.e.toFixed(0):'null'));

    // swap href away
    useEl2.setAttribute('href','#icsym1');

    // immediately read CTM of r3 (animation still running internally?)
    var ctm3_after=null;
    try{ctm3_after=r3.getScreenCTM();}catch(e){P('IC[2]: r3 CTM after swap threw: '+e.name);}
    if(ctm3_after){
      var e_=ctm3_after.e;
      var p=classifyPtr(e_),w=isWeird(e_);
      if(p){R('IC[2]: r3 CTM.e after href swap='+f64hex(e_)+' POINTER!');}
      else if(w){B('IC[2]: r3 CTM.e after href swap='+f64hex(e_)+' weird='+e_);}
      else{P('IC[2]: r3 CTM.e after href swap='+e_);}
    }
  },300);

  // IC[3]: use element with no matching href — what does CTM return?
  hdr('IC[3]: use with non-existent href → CTM probe');
  var useEl3=mkEl(svg,'use',{href:'#does_not_exist_xyz',x:'50',y:'50'});
  var ctm_bad=null;
  try{ctm_bad=useEl3.getScreenCTM();}catch(e){P('IC[3]: useEl3 CTM threw: '+e.name);}
  if(ctm_bad){
    ['a','b','c','d','e','f'].forEach(function(k){
      probeVal('IC[3]: bad-href use CTM.'+k,ctm_bad[k]);
    });
  }

  // IC[4]: rapid href cycle — 10 swaps only (safe)
  hdr('IC[4]: rapid href cycle — 10 swaps');
  var ids=['#icsym1','#icsym2','#icsym3'];
  for(var i=0;i<10;i++){
    useEl.setAttribute('href',ids[i%ids.length]);
  }
  var ctm_spray=null;
  try{ctm_spray=r1.getScreenCTM();}catch(e){}
  if(ctm_spray){probeVal('IC[4]: r1 CTM.e after 10 swaps',ctm_spray.e);}
  try{ctm_spray=r2.getScreenCTM();}catch(e){}
  if(ctm_spray){probeVal('IC[4]: r2 CTM.e after 10 swaps',ctm_spray.e);}

  svg.remove();
  prog('IC done');
}

// ════════════════════════════════════════════════════════════════════════
// ID — SVGFilterElement filterUnits / primitiveUnits extremes
// When filterUnits="userSpaceOnUse", the filter region uses SVG user coords
// If the SVG element is at an extreme translate, the filter region coords
// are also extreme — does the filter processing expose internal values?
// Also: feImage with data URI + filtered element CTM probe
// Also: SVGFilterElement.{x,y,width,height}.baseVal at extreme
// ════════════════════════════════════════════════════════════════════════
function runID(){
  hdr('ID: SVGFilterElement filterUnits / extremes + feImage probe');
  var svg=mkSVG(200,200);
  var defs=mkEl(svg,'defs');

  // ID[1]: filter region at extreme user space coords
  hdr('ID[1]: SVGFilter x/y/width/height baseVal at extreme (filterUnits=userSpaceOnUse)');
  var filter=mkEl(defs,'filter',{id:'idf1',
    filterUnits:'userSpaceOnUse',
    x:'-1000000000',y:'-1000000000',
    width:'2000000000',height:'2000000000'
  });
  mkEl(filter,'feFlood',{'flood-color':'red','flood-opacity':'1'});

  // probe the filter element's x/y/width/height
  ['x','y','width','height'].forEach(function(attr){
    try{
      var bv=filter[attr].baseVal;
      probeVal('ID[1]: filter.'+attr+'.baseVal.value',bv.value);
    }catch(e){P('ID[1]: filter.'+attr+' threw: '+e.name);}
  });

  // ID[2]: apply extreme filter to element at extreme transform
  hdr('ID[2]: apply extreme filter + extreme element transform → CTM/BCR');
  var filter2=mkEl(defs,'filter',{id:'idf2',filterUnits:'userSpaceOnUse',
    x:'0',y:'0',width:'100',height:'100'});
  mkEl(filter2,'feGaussianBlur',{stdDeviation:'2'});

  var rect=mkEl(svg,'rect',{x:'0',y:'0',width:'50',height:'50',fill:'red',filter:'url(#idf2)'});
  var tl=rect.transform.baseVal;
  var xf=svg.createSVGTransform();
  xf.setTranslate(1e9,0);
  tl.appendItem(xf);

  var ctm=null;
  try{ctm=rect.getScreenCTM();}catch(e){}
  if(ctm){
    ['e','f'].forEach(function(k){probeVal('ID[2]: filtered rect CTM.'+k,ctm[k]);});
  }

  // ID[3]: feImage with data URI — does image loading expose internal addresses?
  hdr('ID[3]: feImage with data URI in filter — internal image object probe');
  var filter3=mkEl(defs,'filter',{id:'idf3'});
  var feImg=mkEl(filter3,'feImage',{
    href:'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==',
    result:'img',preserveAspectRatio:'none',
    x:'0',y:'0',width:'1',height:'1'
  });
  var rect3=mkEl(svg,'rect',{x:'0',y:'0',width:'50',height:'50',fill:'red',filter:'url(#idf3)'});
  // sync probe — no wait
  var ctm3=null;
  try{ctm3=rect3.getScreenCTM();}catch(e){}
  if(ctm3){probeVal('ID[3]: feImage filtered CTM.e',ctm3.e);}
  try{
    var imgX=feImg.x.baseVal;
    probeVal('ID[3]: feImage.x.baseVal',imgX.value);
  }catch(e){P('ID[3]: feImage.x threw: '+e.name);}

  // ID[4]: SVGFilterPrimitiveStandardAttributes x/y with extreme pct
  hdr('ID[4]: filter primitive region as pct of extreme filter region');
  var filter4=mkEl(defs,'filter',{id:'idf4',
    filterUnits:'objectBoundingBox',
    primitiveUnits:'userSpaceOnUse',
    x:'0%',y:'0%',width:'100%',height:'100%'
  });
  var feBlur=mkEl(filter4,'feGaussianBlur',{
    stdDeviation:'0',
    x:'-1000000000',y:'-1000000000',width:'2000000000',height:'2000000000'
  });
  try{
    // probe the primitive subregion
    ['x','y','width','height'].forEach(function(attr){
      var bv=feBlur[attr].baseVal;
      probeVal('ID[4]: feGaussianBlur.'+attr+'.baseVal',bv.value);
    });
  }catch(e){P('ID[4]: threw: '+e.name);}

  svg.remove();
  prog('ID done');
}

// ════════════════════════════════════════════════════════════════════════
// IE — SVGTextElement / SVGTSpanElement getCharNumAtPosition / getExtentOfChar
// Text layout goes through a completely different internal path (Core Text on iOS)
// getExtentOfChar returns a DOMRect for each character's bounding box
// getStartPositionOfChar / getEndPositionOfChar return SVGPoints
// At extreme font sizes, do text layout positions expose internal values?
// ════════════════════════════════════════════════════════════════════════
function runIE(){
  hdr('IE: SVGTextElement getExtentOfChar / getStartPositionOfChar extreme font');
  var svg=mkSVG(400,400);

  // IE[1]: getExtentOfChar at extreme font size
  hdr('IE[1]: SVGText getExtentOfChar at extreme font size');
  var text=mkEl(svg,'text',{
    x:'0',y:'200',
    'font-size':'1000000',
    'font-family':'sans-serif',
    fill:'white'
  });
  text.textContent='A';

  // force layout sync — no setTimeout
  var extent=null;
  try{extent=text.getExtentOfChar(0);}catch(e){P('IE[1]: getExtentOfChar threw: '+e.name);}
  if(extent){
    ['x','y','width','height'].forEach(function(k){
      probeVal('IE[1]: font=1e6 getExtentOfChar.'+k,extent[k]);
    });
  }

  var startPt=null;
  try{startPt=text.getStartPositionOfChar(0);}catch(e){}
  if(startPt){
    probeVal('IE[1]: font=1e6 getStartPositionOfChar.x',startPt.x);
    probeVal('IE[1]: font=1e6 getStartPositionOfChar.y',startPt.y);
  }

  // IE[2]: getExtentOfChar on text with extreme translate
  hdr('IE[2]: SVGText getExtentOfChar after extreme translate');
  var tl=text.transform.baseVal;
  var xf=svg.createSVGTransform();
  xf.setTranslate(1e9,0);
  tl.appendItem(xf);

  var extent2=null;
  try{extent2=text.getExtentOfChar(0);}catch(e){P('IE[2]: threw: '+e.name);}
  if(extent2){
    ['x','y','width','height'].forEach(function(k){
      probeVal('IE[2]: font=1e6 tx=1e9 getExtentOfChar.'+k,extent2[k]);
    });
  }

  // IE[3]: getComputedTextLength at extreme font size
  hdr('IE[3]: getComputedTextLength at extreme font size');
  var ctl=null;
  try{ctl=text.getComputedTextLength();}catch(e){}
  probeVal('IE[3]: font=1e6 getComputedTextLength',ctl);

  // IE[4]: getCharNumAtPosition with extreme SVGPoint
  hdr('IE[4]: getCharNumAtPosition with extreme SVGPoint');
  var pt=svg.createSVGPoint();
  pt.x=1e15; pt.y=1e15;
  var charNum=null;
  try{charNum=text.getCharNumAtPosition(pt);}catch(e){P('IE[4]: threw: '+e.name);}
  P('IE[4]: charNum at (1e15,1e15)='+charNum);

  svg.remove();
  prog('IE done');
}

// ════════════════════════════════════════════════════════════════════════
// IF — SVGAnimationElement timing: begin/end values + computedTiming
// Web Animations API on SMIL elements: element.getAnimations()
// computedTiming.currentTime / localTime during active animation
// Also: SVGSVGElement.getCurrentTime() — the SVG document clock
// Also: SVGAnimationElement.getCurrentTime() vs startTime
// ════════════════════════════════════════════════════════════════════════
function runIF(){
  hdr('IF: SVGAnimation timing / computedTiming / Web Animations probe');
  var svg=mkSVG(400,400);
  var rect=mkEl(svg,'rect',{x:'0',y:'0',width:'50',height:'50',fill:'red'});

  // create animation with extreme begin/dur
  var anim=mkEl(rect,'animateTransform',{
    attributeName:'transform',type:'translate',
    from:'0 0',to:'1000000000000 0',
    dur:'1000000s',
    repeatCount:'indefinite'
  });

  // IF[1]: SVGSVGElement.getCurrentTime()
  hdr('IF[1]: svg.getCurrentTime() — SVG document clock');
  var svgTime=null;
  try{svgTime=svg.getCurrentTime();}catch(e){P('IF[1]: threw: '+e.name);}
  P('IF[1]: getCurrentTime()='+svgTime);

  // IF[2]: SVGAnimationElement timing attributes
  hdr('IF[2]: anim.getStartTime() / getCurrentTime()');
  var startT=null,curT=null;
  try{startT=anim.getStartTime();}catch(e){P('IF[2]: getStartTime threw: '+e.name);}
  try{curT=anim.getCurrentTime();}catch(e){P('IF[2]: getCurrentTime threw: '+e.name);}
  probeVal('IF[2]: anim.getStartTime()',startT);
  probeVal('IF[2]: anim.getCurrentTime()',curT);

  // IF[3]: Web Animations API getAnimations()
  hdr('IF[3]: rect.getAnimations() — Web Animations API');
  var anims=[];
  try{anims=rect.getAnimations();}catch(e){P('IF[3]: getAnimations threw: '+e.name);}
  P('IF[3]: getAnimations().length='+anims.length);
  anims.forEach(function(a,i){
    P('IF[3]: anim['+i+'] type='+a.constructor.name);
    // probe effect timing
    if(a.effect){
      var ct=null;
      try{ct=a.effect.getComputedTiming();}catch(e){}
      if(ct){
        ['currentIteration','progress','localTime','activeDuration','endTime'].forEach(function(k){
          if(ct[k]!==undefined&&ct[k]!==null){
            probeVal('IF[3]: computedTiming.'+k,+ct[k]);
          }
        });
      }
    }
    // probe animation.currentTime
    var curTime=null;
    try{curTime=a.currentTime;}catch(e){}
    probeVal('IF[3]: anim.currentTime',+curTime);
  });

  // IF[4]: setCurrentTime to extreme value → read CTM
  hdr('IF[4]: svg.setCurrentTime(extreme) → rect CTM probe');
  [1e6, 1e9, 2147483648, 1e12].forEach(function(t){
    try{
      svg.setCurrentTime(t);
      var ctm=null;
      try{ctm=rect.getScreenCTM();}catch(e){}
      if(ctm){
        probeVal('IF[4]: setCurrentTime='+t+' CTM.e',ctm.e);
      }
    }catch(e){P('IF[4]: setCurrentTime='+t+' threw: '+e.name);}
  });

  // IF[5]: animateTransform with extreme begin time offset
  hdr('IF[5]: animateTransform with negative/extreme begin → CTM');
  var anim2=mkEl(rect,'animateTransform',{
    attributeName:'transform',type:'translate',
    from:'0 0',to:'999999999999 0',
    begin:'-999999s',  // start in the past — animation is far advanced
    dur:'1000000s',
    repeatCount:'1',
    fill:'freeze',
    additive:'replace'
  });
  var ctm_neg=null;
  try{ctm_neg=rect.getScreenCTM();}catch(e){}
  if(ctm_neg){probeVal('IF[5]: begin=-999999s CTM.e',ctm_neg.e);}

  svg.remove();
  prog('IF done — v44 complete');
}
</script>
