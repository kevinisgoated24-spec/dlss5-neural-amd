<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVG v28 — Path Branch Race + Layout Confusion</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#ccc;font-family:monospace;font-size:11px;padding:12px}
h1{color:#fff;font-size:13px;margin-bottom:3px}
h2{color:#555;font-size:9px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}
.suite{background:#111;border:1px solid #1e1e1e;border-radius:4px;padding:10px;margin-bottom:8px}
.result{padding:4px 8px;border-radius:2px;margin-bottom:2px;font-size:11px;word-break:break-all}
.pass{background:#081208;border-left:3px solid #0c0;color:#0c0}
.fail{background:#120808;border-left:3px solid #f00;color:#f44}
.warn{background:#121000;border-left:3px solid #aa0;color:#cc0}
.info{background:#0c0c0c;border-left:2px solid #2a2a2a;color:#666}
.star{background:#08081a;border-left:3px solid #66f;color:#99f}
.crit{background:#160a00;border-left:3px solid #f80;color:#fc8;font-weight:bold}
.uaf{background:#1a0000;border-left:4px solid #f00;color:#ff3333;font-weight:bold;font-size:12px;padding:6px 10px}
.hdr{color:#444;font-size:9px;text-transform:uppercase;letter-spacing:.08em;padding:2px 0 4px;border-bottom:1px solid #1a1a1a;margin-bottom:6px}
button{background:#0e0e0e;color:#0d0;border:1px solid #0d0;padding:4px 10px;font-family:monospace;font-size:10px;cursor:pointer;border-radius:2px;margin:0 3px 4px 0}
button:active{background:#0d0;color:#000}
#btn-all{border-color:#cc0;color:#cc0}
#btn-copy{border-color:#888;color:#888}
</style>
</head>
<body>
<h1>SVG v28 — Two-Path Branch Race + Layout Confusion</h1>
<h2>iOS 26.5.2 · BRC / LAY / ANM / MUT / STK / CTM</h2>

<div class="suite">
<button id="btn-all" onclick="runAll()">▶ ALL</button>
<button onclick="go('BRC')">BRC</button>
<button onclick="go('LAY')">LAY</button>
<button onclick="go('ANM')">ANM</button>
<button onclick="go('MUT')">MUT</button>
<button onclick="go('STK')">STK</button>
<button onclick="go('CTM')">CTM</button>
<button id="btn-copy" onclick="copyAll()">⎘ Copy</button>
<button onclick="clearOut()">✕</button>
</div>
<div class="suite"><div id="out"></div></div>

<script>
var NS='http://www.w3.org/2000/svg';
var LU_MAX=33554432;
var INT32_MAX=2147483647;
var INT32_OVF=2147483648;

function log(m,c){
  var d=document.getElementById('out');
  var e=document.createElement('div');
  e.className='result '+(c||'info');
  e.textContent=m;
  d.appendChild(e);
}
function hdr(m){log(m,'hdr');}
function clearOut(){document.getElementById('out').innerHTML='';}
function copyAll(){
  var lines=[];
  document.querySelectorAll('#out .result').forEach(function(e){lines.push(e.textContent);});
  navigator.clipboard&&navigator.clipboard.writeText(lines.join('\n'));
}
function go(s){clearOut();window['run'+s]();}
function runAll(){
  clearOut();
  runBRC();
  setTimeout(function(){runLAY();},500);
  setTimeout(function(){runANM();},1000);
  setTimeout(function(){runMUT();},1500);
  setTimeout(function(){runSTK();},2000);
  setTimeout(function(){runCTM();},2500);
}

var _fb=new ArrayBuffer(8);
var _dv=new Float64Array(_fb);
var _uv=new Uint32Array(_fb);
function f64hex(f){_dv[0]=f;return'0x'+_uv[1].toString(16).padStart(8,'0')+'_'+_uv[0].toString(16).padStart(8,'0');}

function mkSVG(w,h,vb){
  var s=document.createElementNS(NS,'svg');
  s.setAttribute('width',w||100);s.setAttribute('height',h||100);
  if(vb)s.setAttribute('viewBox',vb);
  s.style.cssText='position:absolute;left:-9999px;top:-9999px';
  document.body.appendChild(s);
  return s;
}
function mkRect(parent,x,y,w,h){
  var r=document.createElementNS(NS,'rect');
  r.setAttribute('x',x||0);r.setAttribute('y',y||0);
  r.setAttribute('width',w||10);r.setAttribute('height',h||10);
  parent.appendChild(r);
  return r;
}
function getMX(el){
  el.setAttribute('transform','matrix(1 0 0 1 0 0)');
  return el.transform.baseVal.getItem(0).matrix;
}
function bcr(el){try{return el.getBoundingClientRect();}catch(e){return null;}}
function ctm(el){try{return el.getScreenCTM();}catch(e){return null;}}

// ════════════════════════════════════════════════════════════════════════
// BRC — branch confusion: rapid flip across the 2^31 threshold
// The matrix path switches code at mx.e = 2^31 (v26/v27 confirmed).
// Flip rapidly between INT32_MAX (LU path) and INT32_OVF (other path)
// while reading BCR/CTM — look for any inconsistency, leaked state, or
// values that don't match either path cleanly.
// ════════════════════════════════════════════════════════════════════════
function runBRC(){
  hdr('BRC: rapid flip across 2^31 branch threshold');
  var svg=mkSVG(100,100);
  var r=mkRect(svg,0,0,10,10);
  var mx=getMX(r);
  svg.removeChild(r);

  // BRC[1]: alternating reads — does the BCR ever return a "confused" value?
  hdr('BRC[1]: alternating INT32_MAX / INT32_OVF — look for non-canonical BCR values');
  var anomalies=[];
  for(var i=0;i<200;i++){
    // Alternate between the two path-triggering values
    var useOvf=(i%2===0);
    mx.e=useOvf?INT32_OVF:INT32_MAX;
    svg.appendChild(r);
    var b=bcr(r);
    svg.removeChild(r);
    var bx=b?b.x:null;
    // Canonical: INT32_MAX → 33544432 (LU_MAX path), INT32_OVF → 2147473664 (other path)
    var canonical_max=33544432;
    var canonical_ovf=2147473664;
    var expected=useOvf?canonical_ovf:canonical_max;
    if(bx!==null&&bx!==expected){
      anomalies.push({i:i,input:useOvf?'INT32_OVF':'INT32_MAX',expected:expected,got:bx});
      log('BRC[1]: iter='+i+' input='+mx.e+' expected='+expected+' got='+bx+' ANOMALY!',
        (bx<0?'uaf — NEGATIVE FROM BRANCH RACE!':
         bx>canonical_ovf?'uaf — ABOVE EXPECTED MAX! '+bx:
         'crit — WRONG VALUE: '+bx));
    }
  }
  log('BRC[1]: 200 iters done. anomalies='+anomalies.length,anomalies.length>0?'crit':'pass');

  // BRC[2]: write INT32_MAX, force layout, then switch to INT32_OVF before layout completes
  hdr('BRC[2]: write→read interleaved with forced reflow');
  var results2=[];
  for(var j=0;j<50;j++){
    mx.e=INT32_MAX;  // LU clamp path
    svg.appendChild(r);
    // Force partial layout by reading offsetParent (triggers style recalc)
    var _ = r.ownerSVGElement ? r.ownerSVGElement.parentNode : null;
    mx.e=INT32_OVF;  // switch to other path BEFORE getBCR
    var b2=bcr(r);
    svg.removeChild(r);
    results2.push(b2?b2.x:null);
  }
  // check if any result is between canonical values (confused state)
  var between=results2.filter(function(v){return v!==null&&v>33544432&&v<2147473664;});
  var below=results2.filter(function(v){return v!==null&&v<0;});
  log('BRC[2]: 50 iters. between-paths='+between.length+' negative='+below.length,
    (below.length>0?'uaf — NEGATIVE BCR IN INTERLEAVED READ!':
     between.length>0?'crit — VALUE BETWEEN PATHS: '+between[0]:
     'pass — consistent'));
  if(between.length>0)log('BRC[2]: between-path values: '+between.slice(0,5).join(', '),'crit');

  // BRC[3]: write to mx.e while element is being measured by requestAnimationFrame
  hdr('BRC[3]: rAF-timed switch — mutate matrix during frame boundary');
  var rafResults=[];
  var rafDone=false;
  mx.e=INT32_MAX;
  svg.appendChild(r);
  var rafCount=0;
  function rafFlip(){
    if(rafCount>=30){
      rafDone=true;
      var neg=rafResults.filter(function(v){return v<0;});
      var anom=rafResults.filter(function(v){return v>0&&v!==33544432&&v!==2147473664&&v!==2147483648;});
      log('BRC[3]: 30 rAF iters. negative='+neg.length+' anomalous='+anom.length,
        (neg.length>0?'uaf — NEGATIVE IN rAF RACE!':
         anom.length>0?'crit — ANOMALOUS IN rAF: '+anom[0]:
         'pass'));
      svg.removeChild(r);
      svg.remove();
      return;
    }
    // Flip between the two threshold values each frame
    mx.e=(rafCount%2===0)?INT32_OVF:INT32_MAX;
    var rb=bcr(r);
    rafResults.push(rb?rb.x:null);
    rafCount++;
    requestAnimationFrame(rafFlip);
  }
  requestAnimationFrame(rafFlip);
}

// ════════════════════════════════════════════════════════════════════════
// LAY — layout tree confusion: two elements sharing a matrix, one on each path
// Can we get the layout engine to compute one element's position using
// another element's (wrong) branch?
// ════════════════════════════════════════════════════════════════════════
function runLAY(){
  hdr('LAY: shared transform list — two elements, both paths simultaneously');
  var svg=mkSVG(100,100);

  // LAY[1]: two rects share a transform, set one to LU path, one to overflow path
  // In SVG, each element has its own transform list, can't truly share
  // But: <g> parent transform affects children — can we confuse via group
  var g=document.createElementNS(NS,'g');
  g.setAttribute('transform','matrix(1 0 0 1 0 0)');
  svg.appendChild(g);
  var mxG=g.transform.baseVal.getItem(0).matrix;

  var r1=mkRect(g,0,0,10,10);
  var r2=mkRect(g,5,0,10,10);

  // Set group transform to LU path
  mxG.e=INT32_MAX;  // → LU clamp (33.5M)
  var b1a=bcr(r1);var b2a=bcr(r2);
  log('LAY[1]: group e=INT32_MAX: r1.x='+( b1a?b1a.x:null)+' r2.x='+(b2a?b2a.x:null),'info');

  // Switch group to overflow path
  mxG.e=INT32_OVF;  // → float path (2.147B)
  var b1b=bcr(r1);var b2b=bcr(r2);
  log('LAY[1]: group e=INT32_OVF: r1.x='+(b1b?b1b.x:null)+' r2.x='+(b2b?b2b.x:null),'info');

  // Now: set r1 to have its own LU-path transform WHILE group is on OVF path
  r1.setAttribute('transform','matrix(1 0 0 1 0 0)');
  var mxR1=r1.transform.baseVal.getItem(0).matrix;
  mxR1.e=INT32_MAX;  // local: LU path
  // group: INT32_OVF (overflow path)
  // total transform = group * local. Does the combination confuse the branch?
  var b1c=bcr(r1);
  log('LAY[1]: combined (group OVF + local LU): r1.x='+(b1c?b1c.x:null),
    (b1c&&b1c.x<0?'uaf — NEGATIVE IN COMBINED TRANSFORM!':
     b1c&&b1c.x>INT32_OVF?'uaf — PAST 2^31 IN COMBINED!':
     'info'));

  // LAY[2]: deeply nested — each level at the threshold, compound effect
  hdr('LAY[2]: 4-deep nested groups each at INT32_OVF — does compound confuse?');
  var g1=document.createElementNS(NS,'g');g1.setAttribute('transform','matrix(1 0 0 1 0 0)');svg.appendChild(g1);
  var g2=document.createElementNS(NS,'g');g2.setAttribute('transform','matrix(1 0 0 1 0 0)');g1.appendChild(g2);
  var g3=document.createElementNS(NS,'g');g3.setAttribute('transform','matrix(1 0 0 1 0 0)');g2.appendChild(g3);
  var r3=mkRect(g3,0,0,10,10);

  var mx1=g1.transform.baseVal.getItem(0).matrix;
  var mx2=g2.transform.baseVal.getItem(0).matrix;
  var mx3=g3.transform.baseVal.getItem(0).matrix;

  // all at INT32_OVF — the multiplied result would be astronomical
  mx1.e=0;mx2.e=0;mx3.e=0;  // baseline
  var b3base=bcr(r3);
  log('LAY[2]: baseline: r3.x='+(b3base?b3base.x:null),'info');

  mx1.e=INT32_OVF;
  var b3one=bcr(r3);
  log('LAY[2]: g1 at INT32_OVF: r3.x='+(b3one?b3one.x:null),'info');

  mx2.e=INT32_OVF;
  var b3two=bcr(r3);
  log('LAY[2]: g1+g2 at INT32_OVF: r3.x='+(b3two?b3two.x:null),
    (b3two&&b3two.x<0?'uaf — NEGATIVE FROM NESTED OVF TRANSFORMS!':'info'));

  mx3.e=INT32_OVF;
  var b3three=bcr(r3);
  log('LAY[2]: all 3 groups at INT32_OVF: r3.x='+(b3three?b3three.x:null),
    (b3three&&b3three.x<0?'uaf — NEGATIVE FROM TRIPLE NESTED!':'info'));

  // what does CTM say?
  var ctm3=ctm(r3);
  log('LAY[2]: getScreenCTM with triple nest: e='+(ctm3?ctm3.e:null),
    (ctm3&&ctm3.e<0?'uaf — CTM NEGATIVE FROM NESTED OVF!':
     ctm3&&ctm3.e>INT32_OVF?'star — CTM past 2^31 in nested: '+ctm3.e:'info'));

  svg.remove();
}

// ════════════════════════════════════════════════════════════════════════
// ANM — animation path: can SMIL or CSS animation flip the matrix
// through the branch point at a moment the layout engine isn't expecting?
// ════════════════════════════════════════════════════════════════════════
function runANM(){
  hdr('ANM: animation through the branch threshold');
  var svg=mkSVG(100,100);
  var r=mkRect(svg,0,0,10,10);
  r.setAttribute('transform','matrix(1 0 0 1 0 0)');

  // ANM[1]: CSS animation on transform — does it cross the branch threshold mid-animation?
  hdr('ANM[1]: CSS keyframe animation crossing INT32_MAX→INT32_OVF boundary');
  // Can't animate matrix.e directly via CSS on SVG easily
  // But: use JS requestAnimationFrame to simulate, capture every frame's BCR
  var mx=r.transform.baseVal.getItem(0).matrix;
  var frames=[];
  var frameCount=0;
  var maxFrames=60;

  function animFrame(){
    if(frameCount>=maxFrames){
      // analyze
      var crossing=frames.filter(function(f){return f.bx>LU_MAX&&f.bx<2147473664;});
      var negative=frames.filter(function(f){return f.bx<0;});
      log('ANM[1]: '+maxFrames+' frames sampled. crossing='+crossing.length+' negative='+negative.length,
        (negative.length>0?'uaf — NEGATIVE BCR DURING ANIMATION!':
         crossing.length>0?'crit — VALUE IN NO-MAN ZONE DURING ANIM: '+crossing[0].bx:
         'info — clean transition'));
      if(crossing.length>0){
        crossing.slice(0,3).forEach(function(f){
          log('ANM[1]:   frame '+f.i+' e='+f.e+' BCR.x='+f.bx,'crit');
        });
      }
      svg.remove();
      return;
    }
    // linear interpolation from INT32_MAX-1000 through INT32_OVF+1000
    var t=frameCount/maxFrames;
    var eVal=INT32_MAX-1000 + t*(INT32_OVF+1000 - (INT32_MAX-1000));
    mx.e=eVal;
    var b=bcr(r);
    frames.push({i:frameCount,e:eVal,bx:b?b.x:null});
    frameCount++;
    requestAnimationFrame(animFrame);
  }
  requestAnimationFrame(animFrame);

  // ANM[2]: SMIL animate element crossing threshold
  hdr('ANM[2]: SMIL animateTransform across INT32 boundary');
  var svg2=mkSVG(100,100);
  var r2=mkRect(svg2,0,0,10,10);
  var anim=document.createElementNS(NS,'animateTransform');
  anim.setAttribute('attributeName','transform');
  anim.setAttribute('type','translate');
  anim.setAttribute('from',INT32_MAX+' 0');
  anim.setAttribute('to',(INT32_OVF+1000)+' 0');
  anim.setAttribute('dur','0.5s');
  anim.setAttribute('repeatCount','3');
  r2.appendChild(anim);

  var smilFrames=[];
  var smilCount=0;
  function smilSample(){
    if(smilCount>=30){
      var neg=smilFrames.filter(function(v){return v<0;});
      var anom=smilFrames.filter(function(v){return v!==null&&v>LU_MAX&&v<2147473664;});
      log('ANM[2]: SMIL 30 samples. negative='+neg.length+' anomalous='+anom.length,
        (neg.length>0?'uaf — NEGATIVE IN SMIL ANIM!':
         anom.length>0?'crit — ANOMALOUS IN SMIL: '+anom[0]:
         'info'));
      svg2.remove();
      return;
    }
    var b2=bcr(r2);
    smilFrames.push(b2?b2.x:null);
    smilCount++;
    setTimeout(smilSample,16);
  }
  smilSample();
}

// ════════════════════════════════════════════════════════════════════════
// MUT — mutation during layout: modify matrix.e from a MutationObserver
// or ResizeObserver callback — these fire during the style/layout phase
// ════════════════════════════════════════════════════════════════════════
function runMUT(){
  hdr('MUT: mutation during layout phase via observer callbacks');
  var svg=mkSVG(100,100);

  // MUT[1]: ResizeObserver fires during layout — mutate matrix.e inside it
  hdr('MUT[1]: ResizeObserver callback — mutate to INT32_OVF during layout');
  var r=mkRect(svg,0,0,10,10);
  r.setAttribute('transform','matrix(1 0 0 1 0 0)');
  var mx=r.transform.baseVal.getItem(0).matrix;
  mx.e=INT32_MAX;  // start on LU path

  var roFired=false;
  var roBCR=null;
  var roE=null;
  if(typeof ResizeObserver!=='undefined'){
    var ro=new ResizeObserver(function(entries){
      if(!roFired){
        roFired=true;
        // Switch to overflow path INSIDE the layout callback
        mx.e=INT32_OVF;
        roE=mx.e;
        roBCR=bcr(r);
        ro.disconnect();
        log('MUT[1]: ResizeObserver fired. e='+roE+' BCR.x='+(roBCR?roBCR.x:null),
          (roBCR&&roBCR.x<0?'uaf — NEGATIVE BCR IN ResizeObserver!':
           roBCR&&roBCR.x>LU_MAX&&roBCR.x<2147473664?'crit — NO-MAN ZONE IN ResizeObserver: '+roBCR.x:
           'info'));
        // After observer: what does a fresh BCR say?
        var freshBCR=bcr(r);
        log('MUT[1]: fresh BCR after RO mutation: '+( freshBCR?freshBCR.x:null),
          (freshBCR&&freshBCR.x<0?'uaf':'info'));
      }
    });
    ro.observe(r);
    // Trigger resize by changing width
    r.setAttribute('width','20');
  } else {
    log('MUT[1]: ResizeObserver not available','warn');
  }

  // MUT[2]: MutationObserver on the transform attribute — mutate inside callback
  hdr('MUT[2]: MutationObserver on transform attr — flip matrix during callback');
  var r2=mkRect(svg,0,0,10,10);
  r2.setAttribute('transform','matrix(1 0 0 1 0 0)');
  var mx2=r2.transform.baseVal.getItem(0).matrix;
  var moFired=0;
  var moBCRs=[];

  var mo=new MutationObserver(function(mutations){
    moFired++;
    if(moFired<=5){
      // flip to overflow path inside MutationObserver callback
      var old=mx2.e;
      mx2.e=(mx2.e===INT32_MAX?INT32_OVF:INT32_MAX);
      var mb=bcr(r2);
      moBCRs.push({old:old,new_e:mx2.e,bx:mb?mb.x:null});
      if(moFired===5){
        mo.disconnect();
        var neg=moBCRs.filter(function(v){return v.bx<0;});
        var anom=moBCRs.filter(function(v){
          return v.bx!==null&&v.bx!==33544432&&v.bx!==2147473664&&v.bx!==2147483648&&v.bx>0;
        });
        log('MUT[2]: 5 MO callbacks. negative='+neg.length+' anomalous='+anom.length,
          (neg.length>0?'uaf — NEGATIVE BCR IN MO CALLBACK!':
           anom.length>0?'crit — ANOMALOUS IN MO: '+anom[0].bx:
           'info'));
        moBCRs.forEach(function(v,i){
          log('MUT[2]:   flip '+i+': old='+v.old+' new='+v.new_e+' BCR.x='+v.bx,'info');
        });
      }
    }
  });
  mo.observe(r2,{attributes:true,attributeFilter:['transform']});

  // Trigger the observer by changing transform attribute
  setTimeout(function(){mx2.e=INT32_MAX;},50);
  setTimeout(function(){mx2.e=INT32_OVF;},100);
  setTimeout(function(){mx2.e=INT32_MAX;},150);

  svg.remove();
}

// ════════════════════════════════════════════════════════════════════════
// STK — stacking context race: create/destroy stacking contexts while
// matrix is at the threshold — can the paint layer snapshot a confused value?
// ════════════════════════════════════════════════════════════════════════
function runSTK(){
  hdr('STK: stacking context creation/destruction at branch threshold');
  var svg=mkSVG(100,100);
  var r=mkRect(svg,0,0,10,10);
  r.setAttribute('transform','matrix(1 0 0 1 0 0)');
  var mx=r.transform.baseVal.getItem(0).matrix;

  // STK[1]: add/remove will-change while at threshold
  hdr('STK[1]: will-change:transform at INT32_OVF vs INT32_MAX');
  var results=[];
  for(var i=0;i<20;i++){
    var onOvf=(i%2===0);
    mx.e=onOvf?INT32_OVF:INT32_MAX;
    // Force new stacking context
    r.style.willChange='transform';
    var b1=bcr(r);
    // Destroy stacking context
    r.style.willChange='auto';
    var b2=bcr(r);
    if(b1&&b2&&b1.x!==b2.x){
      log('STK[1]: iter='+i+' will-change='+b1.x+' auto='+b2.x+' DIFF!',
        (b1.x<0||b2.x<0?'uaf — NEGATIVE IN STACKING CTX!':'crit — DIFF: '+b1.x+' vs '+b2.x));
    }
    results.push({wc:b1?b1.x:null,auto:b2?b2.x:null});
  }
  var diffs=results.filter(function(r){return r.wc!==r.auto;});
  log('STK[1]: 20 iters. stacking-ctx diffs='+diffs.length,diffs.length>0?'crit':'pass');

  // STK[2]: opacity triggers stacking context — add/remove during threshold
  hdr('STK[2]: opacity<1 stacking ctx at branch threshold');
  var opResults=[];
  for(var j=0;j<20;j++){
    mx.e=(j%2===0)?INT32_OVF:INT32_MAX;
    r.style.opacity='0.99';  // creates stacking context
    var bo1=bcr(r);
    r.style.opacity='1';     // removes it
    var bo2=bcr(r);
    opResults.push({op:bo1?bo1.x:null,norm:bo2?bo2.x:null});
  }
  var opDiffs=opResults.filter(function(r){return r.op!==r.norm;});
  var opNegs=opResults.filter(function(r){return r.op<0||r.norm<0;});
  log('STK[2]: 20 iters. diffs='+opDiffs.length+' negatives='+opNegs.length,
    (opNegs.length>0?'uaf — NEGATIVE IN OPACITY STACKING!':opDiffs.length>0?'crit':'pass'));

  // STK[3]: filter creates stacking context — extreme filter + threshold matrix
  hdr('STK[3]: SVG filter (stacking ctx) + branch threshold matrix');
  var defs=document.createElementNS(NS,'defs');
  var filt=document.createElementNS(NS,'filter');
  filt.setAttribute('id','v28filt');
  var feBlur=document.createElementNS(NS,'feGaussianBlur');
  feBlur.setAttribute('stdDeviation','0.1');
  filt.appendChild(feBlur);
  defs.appendChild(filt);
  svg.appendChild(defs);

  var filtResults=[];
  for(var k=0;k<10;k++){
    mx.e=(k%2===0)?INT32_OVF:INT32_MAX;
    r.setAttribute('filter','url(#v28filt)');
    var bf1=bcr(r);
    r.removeAttribute('filter');
    var bf2=bcr(r);
    filtResults.push({filt:bf1?bf1.x:null,no:bf2?bf2.x:null});
  }
  var filtDiffs=filtResults.filter(function(v){return v.filt!==v.no;});
  var filtNegs=filtResults.filter(function(v){return v.filt<0||v.no<0;});
  log('STK[3]: 10 iters. filter diffs='+filtDiffs.length+' negatives='+filtNegs.length,
    (filtNegs.length>0?'uaf — NEGATIVE WITH FILTER STACKING!':filtDiffs.length>0?'crit':'pass'));
  if(filtDiffs.length>0)log('STK[3]: diff sample: filter='+filtDiffs[0].filt+' no-filter='+filtDiffs[0].no,'crit');

  svg.remove();
}

// ════════════════════════════════════════════════════════════════════════
// CTM — deep CTM read primitive: now that we know CTM tracks past 2^31
// while BCR is frozen, can we use CTM to detect different code paths
// and find any path that returns a negative/wrapped value?
// ════════════════════════════════════════════════════════════════════════
function runCTM(){
  hdr('CTM: deep read primitive — hunting for CTM values that differ from BCR pattern');
  var svg=mkSVG(100,100);
  var r=mkRect(svg,0,0,10,10);
  r.setAttribute('transform','matrix(1 0 0 1 0 0)');
  var mx=r.transform.baseVal.getItem(0).matrix;

  // CTM[1]: does CTM also saturate eventually, or does it track forever?
  hdr('CTM[1]: CTM tracking range — where does CTM.e stop tracking linearly?');
  var ctmTests=[
    INT32_OVF, INT32_OVF*2, INT32_OVF*4,
    1e10, 1e11, 1e12, 1e13, 1e14, 1e15,
    1e20, 1e30, 1e38, 1e100, 1e200, 1e300,
    Number.MAX_VALUE,
    Number.MAX_SAFE_INTEGER,
  ];
  var prevCTM=null;
  for(var i=0;i<ctmTests.length;i++){
    mx.e=ctmTests[i];
    var c=ctm(r);
    var ce=c?c.e:null;
    var b=bcr(r);
    var bx=b?b.x:null;
    var ctmLinear=(prevCTM===null||ce>prevCTM);  // is it still going up?
    log('CTM[1]: e='+ctmTests[i].toExponential(3)+' CTM.e='+ce+' BCR.x='+bx,
      (ce!==null&&ce<0&&ctmTests[i]>0?'uaf — CTM NEGATIVE! overflow in CTM pipeline!':
       ce!==null&&ce===bx?'info — CTM==BCR':
       ce!==null&&ce!==bx&&Math.abs(ctmTests[i])>LU_MAX?'star — CTM≠BCR: CTM='+ce+' BCR='+bx:
       'info'));
    prevCTM=ce;
  }

  // CTM[2]: combine viewBox + matrix — does CTM compound them differently than BCR?
  hdr('CTM[2]: viewBox amplification + matrix translate — CTM vs BCR compound behavior');
  var svg2=mkSVG(100,100,'0 0 0.01 0.01');  // 1 unit = 10000px
  var r2=mkRect(svg2,0,0,0.1,0.1);
  r2.setAttribute('transform','matrix(1 0 0 1 0 0)');
  var mx2=r2.transform.baseVal.getItem(0).matrix;

  // Matrix translate in SVG user space + viewBox amplification
  // If mx2.e = 1000 SVG units, and viewBox makes 1 SVG unit = 10000px
  // then screen translation = 10M px
  var vbMXTests=[
    {t:0, note:'baseline'},
    {t:100, note:'100 units → 1M px'},
    {t:3355, note:'3355 units → 33.55M px (LU zone)'},
    {t:3356, note:'3356 units → just past LU_MAX'},
    {t:10000, note:'10K units → 100M px'},
    {t:100000, note:'100K units → 1B px'},
    {t:214748, note:'214748 → 2.14B px (near INT32)'},
    {t:214749, note:'214749 → just past INT32 threshold'},
    {t:215000, note:'215K → well past INT32'},
    {t:1000000, note:'1M units → 10B px'},
  ];
  for(var j=0;j<vbMXTests.length;j++){
    var vt=vbMXTests[j];
    mx2.e=vt.t;
    var c2=ctm(r2);
    var b2=bcr(r2);
    var ce2=c2?c2.e:null;
    var bx2=b2?b2.x:null;
    var expPx=vt.t*10000;
    log('CTM[2]: ['+vt.note+']\n  exp='+expPx.toExponential(3)+' CTM.e='+ce2+' BCR.x='+bx2,
      (ce2!==null&&ce2<0&&expPx>0?'uaf — CTM NEGATIVE IN VIEWBOX+MX!':
       ce2!==null&&bx2!==null&&ce2>bx2&&bx2===INT32_OVF?'star — CTM PAST 2^31 WHILE BCR FROZEN: CTM='+ce2:
       ce2!==null&&bx2!==null&&Math.round(ce2)!==bx2&&expPx>LU_MAX?'star — CTM≠BCR discrepancy: CTM='+ce2+' BCR='+bx2:
       'info'));
  }

  // CTM[3]: negative matrix translate in viewBox space — does CTM track negative past -2^31?
  hdr('CTM[3]: negative translate in viewBox space — CTM tracking range');
  var negVBTests=[-100,-3355,-3356,-10000,-214748,-214749,-1000000];
  for(var k=0;k<negVBTests.length;k++){
    mx2.e=negVBTests[k];
    var c3=ctm(r2);
    var b3=bcr(r2);
    log('CTM[3]: mx.e='+negVBTests[k]+' exp='+(negVBTests[k]*10000).toExponential(3)+' CTM.e='+(c3?c3.e:null)+' BCR.x='+(b3?b3.x:null),
      (c3&&c3.e>0&&negVBTests[k]<0?'uaf — CTM POSITIVE FROM NEGATIVE! WRAP!':
       c3&&c3.e<-INT32_OVF?'star — CTM past -2^31: '+c3.e:'info'));
  }

  svg.remove();svg2.remove();
}
</script>
