<script>
var NS='http://www.w3.org/2000/svg';
var _fb=new ArrayBuffer(8);
var _dv=new Float64Array(_fb);
var _uv=new Uint32Array(_fb);

function f64hex(f){
  if(f===null||f===undefined)return'null';
  _dv[0]=+f;
  return'0x'+_uv[1].toString(16).padStart(8,'0')+'_'+_uv[0].toString(16).padStart(8,'0');
}
function classifyPtr(v){
  if(v===null||v===undefined||typeof v!=='number'||isNaN(v)||!isFinite(v))return null;
  _dv[0]=v; var hi=_uv[1],lo=_uv[0];
  if(hi===0x00000001&&lo>0x1000)return{type:'arm64_tagged',hi,lo};
  if(hi>=0x00000002&&hi<=0x0000ffff&&lo>0x1000)return{type:'native_heap',hi,lo};
  if(hi>=0x00010000&&hi<=0x0001ffff)return{type:'jsc_cell',hi,lo};
  if(hi>=0x00100000&&hi<=0x001fffff)return{type:'pac_ptr',hi,lo};
  if(hi>=0xffff0000)return{type:'kernel',hi,lo};
  return null;
}
function isWeird(v){
  if(typeof v!=='number'||!isFinite(v)||isNaN(v))return false;
  return Math.abs(v)>=16777216;
}
function log(m,c){
  var d=document.getElementById('out'),e=document.createElement('div');
  e.className='result '+(c||'purple'); e.textContent=m;
  d.appendChild(e); e.scrollIntoView({block:'nearest'});
}
function R(m){log(m,'red');}
function B(m){log(m,'blue');}
function P(m){log(m,'purple');}
function logV(label,v){
  var h=f64hex(v);
  var w=isWeird(v)?'weird='+v:'';
  var c=classifyPtr(v);
  var cls='purple';
  if(c)cls='red';
  else if(isWeird(v))cls='blue';
  log(label+'='+h+(w?' '+w:'')+(c?' PTR:'+c.type:''),cls);
}
function mkSVG(w,h){
  var s=document.createElementNS(NS,'svg');
  s.setAttribute('width',w); s.setAttribute('height',h);
  s.style.position='absolute';s.style.left='-9999px';s.style.top='-9999px';
  document.body.appendChild(s);
  return s;
}
function mkEl(p,tag,attrs){
  var e=document.createElementNS(NS,tag);
  if(attrs)Object.keys(attrs).forEach(function(k){e.setAttribute(k,attrs[k]);});
  p.appendChild(e); return e;
}
function rm(el){if(el&&el.parentNode)el.parentNode.removeChild(el);}

// --- KA: CSS Anchor Positioning ---
function KA(){
  P('KA: CSS Anchor Positioning — anchor-name / anchor() function');

  // KA[1]: CSS.supports for anchor positioning
  P('KA[1]: anchor-name CSS support check');
  var supAnchor=false;
  try{
    supAnchor=CSS.supports('anchor-name','--foo');
    P('KA[1]: anchor-name supported='+supAnchor);
    supAnchor=supAnchor||CSS.supports('position-anchor','--foo');
    P('KA[1]: position-anchor supported='+CSS.supports('position-anchor','--foo'));
  }catch(e){P('KA[1]: check error: '+e.message);}

  // KA[2]: Create an anchor element at extreme position and read the anchored element's computed position
  P('KA[2]: anchor at extreme position → anchored element computed position');
  try{
    // We need a positioned container for anchor context
    var container=document.createElement('div');
    container.style.cssText='position:relative;width:1px;height:1px;overflow:visible;';
    document.body.appendChild(container);

    var anchor=document.createElement('div');
    anchor.style.cssText='position:absolute;left:1000000000px;top:0;width:1px;height:1px;anchor-name:--kanchor;';
    container.appendChild(anchor);

    var anchored=document.createElement('div');
    // Try anchor() function in left property
    anchored.style.cssText='position:absolute;left:anchor(--kanchor left,0px);top:0;width:1px;height:1px;';
    container.appendChild(anchored);

    // Force layout
    var dummy=anchored.offsetLeft;
    var cs=getComputedStyle(anchored);
    B('KA[2]: anchored offsetLeft='+anchored.offsetLeft);
    B('KA[2]: anchored computed left='+cs.left);
    // Try getBoundingClientRect
    var bcr=anchored.getBoundingClientRect();
    logV('KA[2]: anchored BCR.left',bcr.left);

    // The anchor element is at 1e9px. If anchor() resolves to that position,
    // we might see 1e9 in the computed position
    B('KA[2]: anchor element offsetLeft='+anchor.offsetLeft);

    rm(container);
  }catch(e){P('KA[2]: anchor positioning error: '+e.message);}

  // KA[3]: @position-try and anchor-size() function
  P('KA[3]: anchor-size() function readback');
  try{
    var c3=document.createElement('div');
    c3.style.cssText='position:relative;width:1px;height:1px;';
    document.body.appendChild(c3);

    var anch3=document.createElement('div');
    // Set the anchor to an extreme size
    anch3.style.cssText='position:absolute;width:1000000000px;height:1px;anchor-name:--ksize;';
    c3.appendChild(anch3);

    var anch3b=document.createElement('div');
    // Try to read anchor-size(--ksize width)
    anch3b.style.cssText='position:absolute;width:anchor-size(--ksize width,0px);height:1px;top:0;left:0;';
    c3.appendChild(anch3b);

    var dummy2=anch3b.offsetWidth;
    B('KA[3]: anchor-size resolved width='+anch3b.offsetWidth);
    logV('KA[3]: anchor-size BCR.width',anch3b.getBoundingClientRect().width);

    rm(c3);
  }catch(e){P('KA[3]: anchor-size error: '+e.message);}

  // KA[4]: SVG element as CSS anchor — does SVG layout box feed into anchor
  P('KA[4]: SVG element as CSS anchor source at extreme position');
  try{
    var c4=document.createElement('div');
    c4.style.cssText='position:relative;width:1px;height:1px;';
    document.body.appendChild(c4);

    var svg4=document.createElementNS(NS,'svg');
    svg4.style.cssText='position:absolute;left:1000000000px;top:0;width:50px;height:50px;anchor-name:--ksvg;';
    c4.appendChild(svg4);

    var target4=document.createElement('div');
    target4.style.cssText='position:absolute;left:anchor(--ksvg left,0px);top:0;width:1px;height:1px;';
    c4.appendChild(target4);

    var dummy3=target4.offsetLeft;
    logV('KA[4]: SVG anchor BCR.left',target4.getBoundingClientRect().left);
    B('KA[4]: SVG as anchor: target offsetLeft='+target4.offsetLeft);

    rm(c4);
  }catch(e){P('KA[4]: SVG anchor error: '+e.message);}

  // KA[5]: CSS anchor with SVG transform — does the transform feed into anchor position?
  P('KA[5]: CSS anchor with SVG transform attribute position');
  try{
    var c5=document.createElement('div');
    c5.style.cssText='position:relative;width:1px;height:1px;';
    document.body.appendChild(c5);

    // SVG with a child rect that has an extreme transform
    var svg5=document.createElementNS(NS,'svg');
    svg5.style.cssText='position:absolute;left:0;top:0;width:50px;height:50px;overflow:visible;';
    c5.appendChild(svg5);

    var rect5=document.createElementNS(NS,'rect');
    rect5.setAttribute('x','0'); rect5.setAttribute('y','0');
    rect5.setAttribute('width','10'); rect5.setAttribute('height','10');
    rect5.setAttribute('transform','translate(1000000000,0)');
    // Set anchor-name on the SVG rect via style
    rect5.style.cssText='anchor-name:--krect;';
    svg5.appendChild(rect5);

    var target5=document.createElement('div');
    target5.style.cssText='position:absolute;left:anchor(--krect left,0px);top:0;width:1px;height:1px;';
    c5.appendChild(target5);

    var dummy4=target5.offsetLeft;
    logV('KA[5]: SVG rect anchor (transform=1e9) target BCR.left',target5.getBoundingClientRect().left);
    B('KA[5]: target offsetLeft='+target5.offsetLeft);

    rm(c5);
  }catch(e){P('KA[5]: SVG rect anchor error: '+e.message);}
}

// --- KB: CSS individual transform properties ---
function KB(){
  P('KB: CSS individual transform properties — translate/rotate/scale (separate from transform shorthand)');

  // KB[1]: translate property (not transform:translateX)
  P('KB[1]: translate property at extreme values → getScreenCTM');
  var s=mkSVG(1,1);
  var r=mkEl(s,'rect',{x:'0',y:'0',width:'5',height:'5',fill:'red'});
  [100, 1000000000, 2147483648, 33554428, 33554432, 33554433].forEach(function(tx){
    r.style.translate=tx+'px 0px';
    var ctm=r.getScreenCTM();
    logV('KB[1]: translate='+tx+'px CTM.e',ctm?ctm.e:null);
  });
  r.style.translate='';
  rm(s);

  // KB[2]: translate on HTML div → computed style
  P('KB[2]: translate property on HTML div → computed style readback');
  var d=document.createElement('div');
  d.style.position='absolute';
  document.body.appendChild(d);
  [1000000000, 2147483648, 33554432, 1e15].forEach(function(tx){
    d.style.translate=tx+'px 0px';
    var cs=getComputedStyle(d);
    B('KB[2]: translate='+tx+'px computed translate='+cs.translate);
    // Also check transform matrix
    var txm=cs.transform;
    if(txm&&txm!=='none'){
      var m=txm.match(/matrix\(([^)]+)\)/);
      if(m){ logV('KB[2]: parsed CTM.e from computed transform',parseFloat(m[1].split(',')[4])); }
    }
  });
  rm(d);

  // KB[3]: rotate property at extreme angles
  P('KB[3]: rotate property — extreme angle values');
  var s3=mkSVG(1,1);
  var r3=mkEl(s3,'rect',{x:'0',y:'0',width:'5',height:'5',fill:'red'});
  [0, 45, 90, 180, 360, 720, 1000000, 2147483648].forEach(function(deg){
    r3.style.rotate=deg+'deg';
    var ctm=r3.getScreenCTM();
    if(ctm){
      logV('KB[3]: rotate='+deg+'deg CTM.a',ctm.a);
      logV('KB[3]: rotate='+deg+'deg CTM.b',ctm.b);
    }
  });
  r3.style.rotate='';
  rm(s3);

  // KB[4]: scale property (CSS individual)
  P('KB[4]: scale property at extreme values');
  var s4=mkSVG(1,1);
  var r4=mkEl(s4,'rect',{x:'0',y:'0',width:'5',height:'5',fill:'red'});
  [1, 1000, 1000000, 1e9, 2147483648].forEach(function(sc){
    r4.style.scale=sc;
    var ctm=r4.getScreenCTM();
    logV('KB[4]: scale='+sc+' CTM.a',ctm?ctm.a:null);
  });
  r4.style.scale='';
  rm(s4);

  // KB[5]: combine individual transforms — does interaction create overflow?
  P('KB[5]: translate+scale combined — overflow interaction probe');
  var s5=mkSVG(1,1);
  var r5=mkEl(s5,'rect',{x:'0',y:'0',width:'5',height:'5',fill:'red'});
  // translate(33554428) + scale(2) → effective tx in world = 2×33554428 = 67108856
  // but through individual transforms this might go through different C++ path
  r5.style.translate='33554428px 0px';
  r5.style.scale='2';
  var ctm5=r5.getScreenCTM();
  logV('KB[5]: translate=33554428+scale=2 CTM.e',ctm5?ctm5.e:null);
  logV('KB[5]: translate=33554428+scale=2 CTM.a',ctm5?ctm5.a:null);
  // Try pushing past the boundary with the scale multiplier
  r5.style.translate='33554432px 0px';
  r5.style.scale='2';
  var ctm5b=r5.getScreenCTM();
  logV('KB[5]: translate=33554432+scale=2 CTM.e',ctm5b?ctm5b.e:null);
  r5.style.translate=''; r5.style.scale='';
  rm(s5);
}

// --- KC: WASM fixed bytecode ---
function KC(){
  P('KC: WebAssembly — fixed bytecode (f64 passthrough + memory bit access)');

  if(typeof WebAssembly === 'undefined'){ P('KC: no WebAssembly'); return; }

  // KC[1]: correct WAT for f64 identity function
  // (module (type (func (param f64) (result f64))) (func (type 0) local.get 0) (export "f64id" (func 0)))
  P('KC[1]: f64 identity WASM — correct encoding');
  // Hand-verified WAT:
  // (module
  //   (type $t0 (func (param f64) (result f64)))
  //   (func $f0 (type $t0) local.get 0)
  //   (export "f64id" (func 0))
  // )
  var w1=new Uint8Array([
    0x00,0x61,0x73,0x6d, // magic "\0asm"
    0x01,0x00,0x00,0x00, // version 1
    // type section (id=1)
    0x01, // section id
    0x05, // section size = 5 bytes
    0x01, // vec length = 1 type
    0x60, // functype tag
    0x01,0x7c, // 1 param: f64 (0x7c)
    0x01,0x7c, // 1 result: f64
    // function section (id=3)
    0x03,
    0x02, // size 2
    0x01, // 1 function
    0x00, // type index 0
    // export section (id=7)
    0x07,
    0x09, // size 9
    0x01, // 1 export
    0x05, // name length 5
    0x66,0x36,0x34,0x69,0x64, // "f64id"
    0x00, // export kind: func
    0x00, // func index 0
    // code section (id=10)
    0x0a,
    0x06, // section size 6
    0x01, // 1 function body
    0x04, // body size 4
    0x00, // local decl count 0
    0x20,0x00, // local.get 0
    0x0b  // end
  ]);

  WebAssembly.instantiate(w1).then(function(r){
    var f=r.instance.exports.f64id;
    B('KC[1]: f64id function available='+!!f);
    if(f){
      // Test: pass f64 bit patterns that look like heap pointers
      // JSC cell range: hi=0x00010000..0x0001ffff
      // We construct these as f64 values: float whose bytes encode pointer patterns
      var testPairs=[
        // [hi, lo] → f64 bit pattern
        [0x00000000, 0x00000000], // 0.0
        [0x3ff00000, 0x00000000], // 1.0
        [0x41cdcd65, 0x00000000], // 1e9 (arithmetic)
        // JSC cell shaped
        [0x00010000, 0x00000000], // hi=0x00010000 → jsc_cell range
        [0x00010000, 0x00001000], // typical JSCell with valid lo
        [0x00018000, 0x00001000], // mid jsc_cell range
        [0x0001ffff, 0x00001000], // top jsc_cell range
        // native heap shaped
        [0x00000002, 0x00001000],
        [0x00007fff, 0x00001000],
        // arm64 tagged
        [0x00000001, 0x00001000],
        [0x00000001, 0x0040a000], // plausible tagged ptr
      ];
      testPairs.forEach(function(pair){
        _uv[1]=pair[0]; _uv[0]=pair[1];
        var v=_dv[0];
        var r2=f(v);
        logV('KC[1]: f64id('+pair[0].toString(16)+':'+pair[1].toString(16)+')',r2);
        var c=classifyPtr(r2);
        if(c) R('KC[1]: PTR PASSTHROUGH in WASM: '+c.type+' hi=0x'+pair[0].toString(16));
      });
    }
  }).catch(function(e){P('KC[1]: WASM error: '+e.message);});

  // KC[2]: WASM with linear memory — write f64, read as 2×i32
  P('KC[2]: WASM memory — f64 bit splitter');
  // WAT:
  // (module
  //   (memory 1)
  //   (func (export "poke") (param f64) f64.const 0 drop (i32.const 0) (local.get 0) f64.store)
  //   Actually simpler:
  //   (func (export "poke") (param f64) (i32.const 0) (local.get 0) (f64.store))
  //   (func (export "peek_lo") (result i32) (i32.const 0) (i32.load))
  //   (func (export "peek_hi") (result i32) (i32.const 4) (i32.load))
  //   (export "mem" (memory 0))
  // )
  var w2=new Uint8Array([
    0x00,0x61,0x73,0x6d,0x01,0x00,0x00,0x00,
    // type section: 3 types
    0x01,0x0e,0x03,
    0x60,0x01,0x7c,0x00,       // type0: (f64)->()   poke
    0x60,0x00,0x01,0x7f,       // type1: ()->(i32)   peek_lo, peek_hi
    0x60,0x00,0x01,0x7f,       // type2: ()->(i32)
    // function section: 3 funcs
    0x03,0x04,0x03,0x00,0x01,0x01,
    // memory section: 1 page
    0x05,0x03,0x01,0x00,0x01,
    // export section
    0x07,0x24,0x04,
    // export "poke" func 0
    0x04,0x70,0x6f,0x6b,0x65,0x00,0x00,
    // export "peek_lo" func 1
    0x07,0x70,0x65,0x65,0x6b,0x5f,0x6c,0x6f,0x00,0x01,
    // export "peek_hi" func 2
    0x07,0x70,0x65,0x65,0x6b,0x5f,0x68,0x69,0x00,0x02,
    // export "mem" memory 0
    0x03,0x6d,0x65,0x6d,0x02,0x00,
    // code section
    0x0a,0x14,0x03,
    // func 0: poke(f64) — (i32.const 0) (local.get 0) (f64.store)
    0x07,0x00,
    0x41,0x00,       // i32.const 0
    0x20,0x00,       // local.get 0
    0x39,0x03,0x00,  // f64.store align=8 offset=0
    0x0b,
    // func 1: peek_lo — (i32.const 0) (i32.load)
    0x05,0x00,
    0x41,0x00,       // i32.const 0
    0x28,0x02,0x00,  // i32.load align=4 offset=0
    0x0b,
    // func 2: peek_hi — (i32.const 4) (i32.load)
    0x05,0x00,
    0x41,0x04,       // i32.const 4
    0x28,0x02,0x00,  // i32.load align=4 offset=0  (but actually need align that fits: use 0x02=4bytes ok)
    0x0b
  ]);

  WebAssembly.instantiate(w2).then(function(r2){
    var ex=r2.instance.exports;
    B('KC[2]: mem module: poke='+!!ex.poke+' peek_lo='+!!ex.peek_lo+' peek_hi='+!!ex.peek_hi);
    if(ex.poke&&ex.peek_lo&&ex.peek_hi){
      // Verify with known values
      ex.poke(1.0);
      var lo1=ex.peek_lo()>>>0, hi1=ex.peek_hi()>>>0;
      B('KC[2]: poke(1.0) → lo=0x'+lo1.toString(16)+' hi=0x'+hi1.toString(16)+' (expect 0x00000000 0x3ff00000)');

      ex.poke(1000000000.0);
      var lo2=ex.peek_lo()>>>0, hi2=ex.peek_hi()>>>0;
      B('KC[2]: poke(1e9) → lo=0x'+lo2.toString(16)+' hi=0x'+hi2.toString(16)+' (expect 0x00000000 0x41cdcd65)');

      // Now: use the WASM memory as a live view of JS ArrayBuffer
      // We can also do it another way: share the WASM memory back to JS
      var memBuf=ex.mem?ex.mem.buffer:null;
      if(memBuf){
        var memU32=new Uint32Array(memBuf);
        ex.poke(2147483648.0);
        B('KC[2]: poke(2^31) via shared mem lo=0x'+memU32[0].toString(16)+' hi=0x'+memU32[1].toString(16));
        R('KC[2]: WASM memory shared — can read/write arbitrary f64 bit patterns from JS');
      }
    }
  }).catch(function(e){P('KC[2]: mem WASM error: '+e.message);});

  // KC[3]: WASM — reinterpret f64 as i64 (requires 64-bit)
  P('KC[3]: WASM i64 reinterpret probe');
  // Check if i64 operations work (they should on 64-bit iOS)
  var w3=new Uint8Array([
    0x00,0x61,0x73,0x6d,0x01,0x00,0x00,0x00,
    // type: (f64)->(i64)
    0x01,0x05,0x01,0x60,0x01,0x7c,0x01,0x7e,
    // function
    0x03,0x02,0x01,0x00,
    // export "reinterpret"
    0x07,0x0d,0x01,0x0b,
    0x72,0x65,0x69,0x6e,0x74,0x65,0x72,0x70,0x72,0x65,0x74, // "reinterpret"
    0x00,0x00,
    // code: i64.reinterpret_f64 (local.get 0)
    0x0a,0x06,0x01,
    0x04,0x00,
    0x20,0x00,       // local.get 0
    0xbd,            // i64.reinterpret_f64
    0x0b
  ]);
  WebAssembly.instantiate(w3).then(function(r3){
    var reint=r3.instance.exports.reinterpret;
    B('KC[3]: i64.reinterpret_f64 available='+!!reint);
    if(reint){
      // i64 comes back as BigInt in JS
      var v1=reint(1.0);
      R('KC[3]: reinterpret(1.0)='+v1.toString(16)+' (expect 3ff0000000000000)');
      var v2=reint(1000000000.0);
      B('KC[3]: reinterpret(1e9)='+v2.toString(16));
      // Test with a getScreenCTM value
      // First get a live CTM value
      var s=mkSVG(1,1);
      var rect=mkEl(s,'rect',{x:'0',y:'0',width:'5',height:'5',fill:'red'});
      rect.setAttribute('transform','translate(1000000000,0)');
      var ctm=rect.getScreenCTM();
      if(ctm){
        var ctmE=ctm.e;
        var v3=reint(ctmE);
        B('KC[3]: reinterpret(CTM.e='+ctmE+')='+v3.toString(16));
      }
      rm(s);
    }
  }).catch(function(e){P('KC[3]: i64 reinterpret: '+e.message);});
}

// --- KD: CSS scroll-driven animation timeline ---
function KD(){
  P('KD: CSS scroll-driven animations — scroll-timeline / animation-timeline');

  // KD[1]: basic scroll-driven animation probe
  P('KD[1]: scroll-timeline availability');
  try{
    var supScroll=CSS.supports('animation-timeline','scroll()');
    P('KD[1]: animation-timeline:scroll() supported='+supScroll);
    var supView=CSS.supports('animation-timeline','view()');
    P('KD[1]: animation-timeline:view() supported='+supView);
  }catch(e){P('KD[1]: support check: '+e.message);}

  // KD[2]: create a scroll container with extreme scroll range → driven animation
  P('KD[2]: scroll-driven animation with extreme scroll range → CTM probe');
  try{
    // Create a scroll container
    var scroller=document.createElement('div');
    scroller.style.cssText='position:absolute;left:-9999px;top:0;width:1px;height:1px;overflow:scroll;scroll-timeline-name:--kscroll;scroll-timeline-axis:block;';
    // Make the content extremely tall to get a huge scroll range
    var content=document.createElement('div');
    content.style.cssText='width:1px;height:1000000000px;';
    scroller.appendChild(content);
    document.body.appendChild(scroller);

    // Create an SVG that animates based on the scroll position
    var svg=document.createElementNS(NS,'svg');
    svg.style.cssText='position:absolute;left:-9998px;top:0;width:1px;height:1px;overflow:visible;';
    document.body.appendChild(svg);

    var rect=document.createElementNS(NS,'rect');
    rect.setAttribute('x','0'); rect.setAttribute('y','0');
    rect.setAttribute('width','5'); rect.setAttribute('height','5');
    rect.style.cssText='animation:kd-anim 1s linear forwards;animation-timeline:--kscroll;animation-fill-mode:both;';
    svg.appendChild(rect);

    // Inject keyframes
    var style=document.createElement('style');
    style.textContent='@keyframes kd-anim{from{transform:translateX(0px)}to{transform:translateX(1000000000px)}}';
    document.head.appendChild(style);

    // Set scroll position to various points and read CTM
    [0, 0.25, 0.5, 0.75, 1.0].forEach(function(progress){
      var scrollPos=Math.floor(progress*(1000000000-1));
      scroller.scrollTop=scrollPos;
      // Force layout
      var dummy=rect.getScreenCTM();
      var ctm=rect.getScreenCTM();
      B('KD[2]: scroll='+(progress*100)+'% (pos='+scrollPos+') CTM.e='+(ctm?ctm.e:null));
      if(ctm) logV('KD[2]: CTM.e at '+progress*100+'%',ctm.e);
    });

    rm(scroller); rm(svg); rm(style);
  }catch(e){P('KD[2]: scroll-driven anim: '+e.message);}

  // KD[3]: view() timeline — element entering viewport
  P('KD[3]: view() timeline with SVG element at extreme position');
  try{
    var svg3=document.createElementNS(NS,'svg');
    svg3.style.cssText='position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;';
    document.body.appendChild(svg3);

    var rect3=document.createElementNS(NS,'rect');
    rect3.setAttribute('x','0'); rect3.setAttribute('y','0');
    rect3.setAttribute('width','1000000000'); rect3.setAttribute('height','1');
    rect3.style.cssText='animation:kd3-anim 1s linear forwards;animation-timeline:view();animation-fill-mode:both;';
    svg3.appendChild(rect3);

    var style3=document.createElement('style');
    style3.textContent='@keyframes kd3-anim{from{opacity:1}to{opacity:0}}';
    document.head.appendChild(style3);

    // Check if the animation created a timeline
    var anims=rect3.getAnimations?rect3.getAnimations():[];
    B('KD[3]: getAnimations().length='+anims.length);
    if(anims.length>0){
      var anim=anims[0];
      B('KD[3]: timeline type='+anim.timeline);
      B('KD[3]: currentTime='+anim.currentTime);
      if(anim.timeline&&anim.timeline.currentTime!==undefined){
        B('KD[3]: timeline.currentTime='+anim.timeline.currentTime);
      }
    }

    rm(svg3); rm(style3);
  }catch(e){P('KD[3]: view timeline: '+e.message);}

  // KD[4]: read animation.currentTime on scroll-driven animation
  P('KD[4]: scroll-driven animation.currentTime as float probe');
  try{
    var scr4=document.createElement('div');
    scr4.style.cssText='position:absolute;left:-9999px;top:0;width:1px;height:200px;overflow:scroll;';
    var cont4=document.createElement('div');
    cont4.style.cssText='width:1px;height:1000000000px;';
    scr4.appendChild(cont4);
    document.body.appendChild(scr4);

    var d4=document.createElement('div');
    d4.style.cssText='position:absolute;left:0;top:0;width:1px;height:1px;animation:kd4 1s linear;animation-timeline:--kscroll4;scroll-timeline-name:--kscroll4;';
    scr4.appendChild(d4);

    var style4=document.createElement('style');
    style4.textContent='@keyframes kd4{from{left:0}to{left:1000000000px}}';
    document.head.appendChild(style4);

    var anims4=d4.getAnimations?d4.getAnimations():[];
    B('KD[4]: anims count='+anims4.length);
    if(anims4.length>0){
      // Set extreme scroll position
      scr4.scrollTop=999999800;
      var t=anims4[0].currentTime;
      logV('KD[4]: currentTime at extreme scroll',t);
      B('KD[4]: currentTime='+t);
    }

    rm(scr4); rm(style4);
  }catch(e){P('KD[4]: anim currentTime: '+e.message);}
}

// --- KE: SVGPathElement.getPathData / getTotalLength extreme ---
function KE(){
  P('KE: SVGPathElement extreme path data / getTotalLength');

  // KE[1]: getPathData availability
  P('KE[1]: SVGPathElement.getPathData availability');
  var s=mkSVG(1,1);
  var path=mkEl(s,'path',{d:'M 0 0 L 10 0'});
  P('KE[1]: getPathData='+!!path.getPathData);
  P('KE[1]: getTotalLength='+!!path.getTotalLength);
  P('KE[1]: getPointAtLength='+!!path.getPointAtLength);

  // KE[2]: extreme path coordinates → getTotalLength
  P('KE[2]: extreme path coords → getTotalLength');
  var extremeCoords=[
    'M 0 0 L 1000000000 0',
    'M 0 0 L 2147483648 0',
    'M 0 0 L 1e15 0',
    'M 0 0 Q 1000000000 0 2000000000 0',
    'M 0 0 C 1e9 0 2e9 0 3e9 0',
  ];
  extremeCoords.forEach(function(d){
    path.setAttribute('d',d);
    try{
      var len=path.getTotalLength();
      logV('KE[2]: getTotalLength("'+d.slice(0,20)+'...")',len);
    }catch(e){P('KE[2]: error for "'+d.slice(0,20)+'": '+e.message);}
  });

  // KE[3]: getPointAtLength at extreme length → returned point coordinates
  P('KE[3]: getPointAtLength at extreme length values');
  path.setAttribute('d','M 0 0 L 1000000000 0');
  [0, 500000000, 999999999, 1000000000, 2000000000, 1e15].forEach(function(l){
    try{
      var pt=path.getPointAtLength(l);
      logV('KE[3]: getPointAtLength('+l+').x',pt.x);
      logV('KE[3]: getPointAtLength('+l+').y',pt.y);
    }catch(e){P('KE[3]: error at l='+l+': '+e.message);}
  });

  // KE[4]: path with extreme cubic bezier control points
  P('KE[4]: cubic bezier with extreme control points');
  var extremeBezier=[
    ['M 0 0 C 1e15 0 1e15 0 1e15 0', 'max ctrl'],
    ['M 0 0 C -1e15 0 -1e15 0 1 0', 'extreme neg ctrl'],
    ['M 0 0 C 1e9 1e9 2e9 2e9 3e9 3e9', 'diagonal extreme'],
  ];
  extremeBezier.forEach(function(pair){
    path.setAttribute('d',pair[0]);
    try{
      var len=path.getTotalLength();
      logV('KE[4]: bezier "'+pair[1]+'" length',len);
      var mid=path.getPointAtLength(len/2);
      logV('KE[4]: midpoint.x',mid.x);
      logV('KE[4]: midpoint.y',mid.y);
    }catch(e){P('KE[4]: bezier "'+pair[1]+'": '+e.message);}
  });

  // KE[5]: SVGPathElement pathLength attribute interaction
  P('KE[5]: pathLength attribute with extreme value');
  path.setAttribute('d','M 0 0 L 100 0');
  [1000000000, 2147483648, 4294967296, 1e15].forEach(function(pl){
    path.setAttribute('pathLength',pl);
    var tl=path.getTotalLength();
    logV('KE[5]: pathLength='+pl+' getTotalLength()',tl);
  });

  rm(s);
}

// --- KF: ResizeObserver + MutationObserver internal state leak ---
function KF(){
  P('KF: ResizeObserver / IntersectionObserver internal geometry state probe');

  // KF[1]: ResizeObserver on SVG with extreme size
  P('KF[1]: ResizeObserver on SVG with extreme width');
  try{
    var svg=mkSVG(1,1);
    var observed=[];
    var ro=new ResizeObserver(function(entries){
      entries.forEach(function(entry){
        var bs=entry.borderBoxSize&&entry.borderBoxSize[0];
        var cs2=entry.contentBoxSize&&entry.contentBoxSize[0];
        observed.push({
          w:entry.contentRect.width,
          h:entry.contentRect.height,
          inW:bs?bs.inlineSize:null,
          inH:bs?bs.blockSize:null,
        });
      });
    });
    ro.observe(svg);
    // Set extreme size
    svg.style.width='1000000000px';
    svg.style.height='1px';
    // Force layout via getBoundingClientRect
    svg.getBoundingClientRect();
    // Give the observer a tick
    setTimeout(function(){
      ro.disconnect();
      observed.forEach(function(o,i){
        logV('KF[1]: RO entry['+i+'] contentRect.width',o.w);
        logV('KF[1]: RO entry['+i+'] borderBoxSize.inlineSize',o.inW);
      });
      if(observed.length===0) P('KF[1]: no ResizeObserver entries fired');
      rm(svg);
    },50);
  }catch(e){P('KF[1]: ResizeObserver: '+e.message);}

  // KF[2]: IntersectionObserver with extreme threshold
  P('KF[2]: IntersectionObserver on extreme-position element');
  try{
    var d=document.createElement('div');
    d.style.cssText='position:absolute;left:1000000000px;top:0;width:1px;height:1px;';
    document.body.appendChild(d);

    var intersections=[];
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        intersections.push({
          ratio:entry.intersectionRatio,
          brLeft:entry.boundingClientRect.left,
          irLeft:entry.intersectionRect.left,
          rootLeft:entry.rootBounds?entry.rootBounds.left:null,
        });
      });
    },{threshold:[0,0.5,1.0]});
    io.observe(d);

    setTimeout(function(){
      io.disconnect();
      intersections.forEach(function(o,i){
        logV('KF[2]: IO entry['+i+'] boundingClientRect.left',o.brLeft);
        logV('KF[2]: IO entry['+i+'] intersectionRect.left',o.irLeft);
        P('KF[2]: IO entry['+i+'] intersectionRatio='+o.ratio);
      });
      if(intersections.length===0) P('KF[2]: no IntersectionObserver entries');
      rm(d);
    },50);
  }catch(e){P('KF[2]: IntersectionObserver: '+e.message);}

  // KF[3]: MutationObserver on SVG attribute changes at extreme values
  P('KF[3]: MutationObserver attribute change probe');
  try{
    var s3=mkSVG(1,1);
    var r3=mkEl(s3,'rect',{x:'0',y:'0',width:'5',height:'5',fill:'red'});
    var mutations=[];
    var mo=new MutationObserver(function(muts){
      muts.forEach(function(mut){
        mutations.push({attr:mut.attributeName,old:mut.oldValue});
      });
    });
    mo.observe(r3,{attributes:true,attributeOldValue:true});

    // Make attribute changes with extreme values
    r3.setAttribute('x','1000000000');
    r3.setAttribute('width','2147483648');
    r3.setAttribute('transform','translate(33554432,0)');

    // MutationObserver is sync, check immediately
    mo.disconnect();
    mutations.forEach(function(m){
      P('KF[3]: mutation attr='+m.attr+' oldValue='+m.old);
    });

    // Now read the actual values back
    logV('KF[3]: rect.x.baseVal after set=1e9',r3.x.baseVal.value);
    logV('KF[3]: rect.width.baseVal after set=2^31',r3.width.baseVal.value);
    var ctm3=r3.getScreenCTM();
    logV('KF[3]: CTM.e after transform=translate(33554432,0)',ctm3?ctm3.e:null);

    rm(s3);
  }catch(e){P('KF[3]: MutationObserver: '+e.message);}

  // KF[4]: SVGAnimatedLength.animVal during CSS animation — timing race
  P('KF[4]: animVal during CSS keyframe animation — capture mid-animation');
  try{
    var s4=mkSVG(1,1);
    var r4=mkEl(s4,'rect',{x:'0',y:'0',width:'5',height:'5',fill:'red'});
    // CSS animation on SVG presentation attribute
    var style4=document.createElement('style');
    style4.textContent='@keyframes kf4{from{x:0}to{x:1000000000}}#kf4rect{animation:kf4 10s linear forwards;}';
    document.head.appendChild(style4);
    r4.id='kf4rect';

    // Capture animVal at multiple rAF frames
    var captures=[];
    var frameCount=0;
    function captureFrame(){
      var bv=r4.x.baseVal.value;
      var av=r4.x.animVal.value;
      captures.push({bv:bv,av:av,frame:frameCount});
      frameCount++;
      if(frameCount<5) requestAnimationFrame(captureFrame);
      else{
        captures.forEach(function(c){
          logV('KF[4]: frame['+c.frame+'] baseVal',c.bv);
          logV('KF[4]: frame['+c.frame+'] animVal',c.av);
          if(c.av!==c.bv) R('KF[4]: baseVal !== animVal at frame '+c.frame+' — race possible');
        });
        rm(s4); rm(style4);
      }
    }
    requestAnimationFrame(captureFrame);
  }catch(e){P('KF[4]: animVal race: '+e.message);}

  // KF[5]: SVGElement.ownerSVGElement / viewportElement — object identity probe
  P('KF[5]: SVGElement object identity — ownerSVGElement reference probe');
  try{
    var s5=mkSVG(1,1);
    var r5=mkEl(s5,'rect',{x:'0',y:'0',width:'5',height:'5',fill:'red'});
    // Check if any numeric property of these gives us a pointer
    var owner=r5.ownerSVGElement;
    var viewport=r5.viewportElement;
    B('KF[5]: ownerSVGElement===svg: '+(owner===s5));
    B('KF[5]: viewportElement===svg: '+(viewport===s5));
    // The numeric id of the DOM object — not directly accessible in JS
    // But check if there's a way to get object identity through numeric means
    // Try: does the object have a hidden numeric identifier we can read?
    P('KF[5]: Symbol.toPrimitive probe');
    try{
      var numHint=+(r5); // triggers valueOf/Symbol.toPrimitive
      logV('KF[5]: +(rect) valueOf',numHint);
    }catch(e2){P('KF[5]: +(rect) error: '+e2.message);}
    rm(s5);
  }catch(e){P('KF[5]: identity probe: '+e.message);}
}

// runner
var SUITES={KA,KB,KC,KD,KE,KF};
var suiteKeys=['KA','KB','KC','KD','KE','KF'];
function go(s){
  document.getElementById('progress').textContent='Running '+s+'...';
  log('=== '+s+' ===','purple');
  try{SUITES[s]();}catch(e){log('SUITE CRASH: '+e.message+' @ '+e.stack,'red');}
  document.getElementById('progress').textContent=s+' done.';
}
var allIdx=0;
function runAll(){
  allIdx=0;
  document.getElementById('out').innerHTML='';
  function next(){
    if(allIdx>=suiteKeys.length){
      document.getElementById('progress').textContent='ALL DONE';
      return;
    }
    var k=suiteKeys[allIdx++];
    document.getElementById('progress').textContent='Running '+k+' ('+allIdx+'/'+suiteKeys.length+')...';
    log('=== '+k+' ===','purple');
    try{SUITES[k]();}catch(e){log('SUITE CRASH: '+e.message,'red');}
    setTimeout(next,400);
  }
  next();
}
function copyAll(){
  var items=document.querySelectorAll('#out .result');
  var txt=Array.from(items).map(function(e){return e.textContent;}).join('\n');
  navigator.clipboard.writeText(txt).catch(function(){});
}
function clearOut(){
  document.getElementById('out').innerHTML='';
  document.getElementById('progress').textContent='';
}
