<script>
var NS='http://www.w3.org/2000/svg';
var _fb=new ArrayBuffer(8);
var _dv=new Float64Array(_fb);
var _uv=new Uint32Array(_fb);

function f64hex(f){
  if(f===null||f===undefined)return'null';
  _dv[0]=+f;
  return'0x'+_uv[1].toString(16).padStart(8,'0')+'_'+_uv[0].toString(16).padStart(8,'0');
}
function classifyPtr(v){
  if(v===null||v===undefined||typeof v!=='number'||isNaN(v)||!isFinite(v))return null;
  _dv[0]=v; var hi=_uv[1],lo=_uv[0];
  if(hi===0x00000001&&lo>0x1000)return{type:'arm64_tagged',hi,lo};
  if(hi>=0x00000002&&hi<=0x0000ffff&&lo>0x1000)return{type:'native_heap',hi,lo};
  if(hi>=0x00010000&&hi<=0x0001ffff)return{type:'jsc_cell',hi,lo};
  if(hi>=0x00100000&&hi<=0x001fffff)return{type:'pac_ptr',hi,lo};
  if(hi>=0xffff0000)return{type:'kernel',hi,lo};
  return null;
}
function isWeird(v){
  if(typeof v!=='number'||!isFinite(v)||isNaN(v))return false;
  return Math.abs(v)>=16777216;
}

function log(m,c){
  var d=document.getElementById('out'),e=document.createElement('div');
  e.className='result '+(c||'purple'); e.textContent=m;
  d.appendChild(e); e.scrollIntoView({block:'nearest'});
}
function R(m){log(m,'red');}
function B(m){log(m,'blue');}
function P(m){log(m,'purple');}
function hdr(m){log(m,'hdr');}
function prog(m){document.getElementById('progress').textContent=m;}
function clearOut(){document.getElementById('out').innerHTML='';prog('');}
function copyAll(){
  var lines=[];
  document.querySelectorAll('#out .result').forEach(function(e){lines.push(e.textContent);});
  navigator.clipboard&&navigator.clipboard.writeText(lines.join('\n'));
}
function go(s){clearOut();window['run'+s]();}
function runAll(){
  clearOut();
  runHA();
  setTimeout(runHB,500);
  setTimeout(runHC,1000);
  setTimeout(runHD,1500);
  setTimeout(runHE,2000);
  setTimeout(runHF,2500);
}

function mkSVG(w,h){
  var s=document.createElementNS(NS,'svg');
  s.setAttribute('width',w||200); s.setAttribute('height',h||200);
  s.style.cssText='position:fixed;left:0;top:0;width:'+(w||200)+'px;height:'+(h||200)+'px;opacity:0.001;pointer-events:none';
  document.body.appendChild(s); return s;
}
function mkEl(p,tag,attrs){
  var e=document.createElementNS(NS,tag);
  if(attrs)Object.keys(attrs).forEach(function(k){e.setAttribute(k,attrs[k]);});
  p.appendChild(e); return e;
}
function probeVal(label,v){
  var p=classifyPtr(v),w=isWeird(v);
  if(p){R(label+'='+f64hex(v)+' POINTER! type='+p.type);}
  else if(w){B(label+'='+f64hex(v)+' weird='+v);}
  else{P(label+'='+v);}
}
function probeDOMMatrix(label,m){
  if(!m){P(label+' null');return;}
  ['m11','m12','m13','m14','m21','m22','m23','m24',
   'm31','m32','m33','m34','m41','m42','m43','m44'].forEach(function(k){
    var v=m[k];
    var p=classifyPtr(v),w=isWeird(v);
    if(p){R(label+'.'+k+'='+f64hex(v)+' POINTER! type='+p.type);}
    else if(w){B(label+'.'+k+'='+f64hex(v)+' weird='+v);}
    // only log non-identity / non-zero to save space
    else if(v!==0&&v!==1){P(label+'.'+k+'='+v);}
  });
}

// ════════════════════════════════════════════════════════════════════════
// HA — SVGAnimatedTransformList animVal vs baseVal during active SMIL animation
// Key question: mid-animation, animVal.getItem(0).matrix reads the COMPOSED
// animated value. Does the SMIL interpolation engine expose internal state?
// Also: animVal during a paused animation (beginElementAt then pause)
// ════════════════════════════════════════════════════════════════════════
function runHA(){
  hdr('HA: SVGAnimatedTransformList animVal mid-anim probe');

  // HA[1]: read animVal during running animation at multiple frames
  hdr('HA[1]: animVal.getItem(0).matrix during active translateX animation');
  var svg=mkSVG(400,400);
  var rect=mkEl(svg,'rect',{x:'0',y:'0',width:'50',height:'50',fill:'red'});
  var anim=mkEl(rect,'animateTransform',{
    attributeName:'transform',
    type:'translate',
    from:'0 0',
    to:'1000000000 0',  // 1e9 endpoint
    dur:'10s',
    repeatCount:'indefinite'
  });

  // sample animVal at multiple requestAnimationFrame ticks
  var samples=[];
  var maxSamples=12;
  var startTime=performance.now();

  function sampleAnimVal(){
    var tl=rect.transform.animVal;
    var mx=null;
    try{
      if(tl.numberOfItems>0){mx=tl.getItem(0).matrix;}
    }catch(e){}
    var t=performance.now()-startTime;
    if(mx){
      var e_=mx.e;
      var p=classifyPtr(e_),w=isWeird(e_);
      if(p){R('HA[1]: t='+t.toFixed(0)+'ms animVal.matrix.e='+f64hex(e_)+' POINTER!');}
      else if(w){B('HA[1]: t='+t.toFixed(0)+'ms animVal.matrix.e='+f64hex(e_)+' weird='+e_);}
      else{P('HA[1]: t='+t.toFixed(0)+'ms animVal.matrix.e='+e_.toFixed(2));}
    } else {
      P('HA[1]: t='+t.toFixed(0)+'ms animVal items='+tl.numberOfItems);
    }
    samples.push(t);
    if(samples.length<maxSamples){requestAnimationFrame(sampleAnimVal);}
    else{
      svg.remove();
      B('HA[1]: sampling done, '+samples.length+' samples');
    }
  }
  requestAnimationFrame(sampleAnimVal);

  // HA[2]: animVal vs baseVal divergence during animation
  hdr('HA[2]: animVal vs baseVal divergence mid-animation');
  var svg2=mkSVG(200,200);
  var rect2=mkEl(svg2,'rect',{x:'0',y:'0',width:'50',height:'50',fill:'blue'});
  // set baseVal to known large value
  var tl2=rect2.transform.baseVal;
  var xf2=svg2.createSVGTransform();
  xf2.setTranslate(1e9, 0);
  tl2.appendItem(xf2);
  // start animation that changes from 0 to 1e12
  var anim2=mkEl(rect2,'animateTransform',{
    attributeName:'transform',
    type:'translate',
    from:'0 0',
    to:'1000000000000 0',
    dur:'5s',
    repeatCount:'indefinite',
    additive:'replace'
  });
  // read both animVal and baseVal in same frame
  var frameCount=0;
  function compareAnimBase(){
    var bv=rect2.transform.baseVal;
    var av=rect2.transform.animVal;
    var bv_e=bv.numberOfItems>0?bv.getItem(0).matrix.e:null;
    var av_e=null;
    try{av_e=av.numberOfItems>0?av.getItem(0).matrix.e:null;}catch(e){}
    if(av_e!==null&&bv_e!==null){
      var pA=classifyPtr(av_e),wA=isWeird(av_e);
      if(pA){R('HA[2]: frame '+frameCount+' animVal.e='+f64hex(av_e)+' POINTER!');}
      else if(wA){B('HA[2]: frame '+frameCount+' baseVal.e='+bv_e+' animVal.e='+f64hex(av_e)+' weird='+av_e);}
      else{P('HA[2]: frame '+frameCount+' baseVal.e='+bv_e+' animVal.e='+av_e.toFixed(2));}
    } else {
      P('HA[2]: frame '+frameCount+' av_e='+av_e+' bv_e='+bv_e);
    }
    frameCount++;
    if(frameCount<8){requestAnimationFrame(compareAnimBase);}
    else{svg2.remove();}
  }
  setTimeout(function(){requestAnimationFrame(compareAnimBase);},100);

  // HA[3]: SVGAnimateTransform with calc-mode=spline at extreme endpoint
  hdr('HA[3]: calcMode=spline animation to 1e12');
  var svg3=mkSVG(200,200);
  var rect3=mkEl(svg3,'rect',{x:'0',y:'0',width:'20',height:'20',fill:'green'});
  mkEl(rect3,'animateTransform',{
    attributeName:'transform',
    type:'translate',
    values:'0,0;1000000000000,0',
    keyTimes:'0;1',
    calcMode:'spline',
    keySplines:'0.5 0 0.5 1',
    dur:'8s',
    repeatCount:'indefinite'
  });
  setTimeout(function(){
    var av3=rect3.transform.animVal;
    var mx3=null;
    try{if(av3.numberOfItems>0)mx3=av3.getItem(0).matrix;}catch(e){}
    if(mx3){
      probeVal('HA[3]: spline animVal.e mid-anim',mx3.e);
    } else {
      P('HA[3]: no animVal items');
    }
    svg3.remove();
  },200);

  prog('HA running (rAF samples)...');
}

// ════════════════════════════════════════════════════════════════════════
// HB — SVGLength with EM/EX/VWVH units — font metrics path
// SVGLength with SVG_LENGTHTYPE_EMS internally references the element's
// computed font size. When reading .value (px), the engine converts
// em→px using the element's font metrics. Does this expose font object ptr?
// Also: SVG_LENGTHTYPE_PERCENTAGE with extreme SVG viewport
// ════════════════════════════════════════════════════════════════════════
function runHB(){
  hdr('HB: SVGLength em/ex/vw/vh units → internal font metrics path');

  // HB[1]: SVGLength set to em units, read .value (requires font metrics)
  hdr('HB[1]: SVGLength set to em units → .value px conversion');
  var svg=mkSVG(400,400);
  svg.style.fontSize='16px'; // base font size

  // Create rect with x set via length in em units
  var rect=mkEl(svg,'rect',{x:'0',y:'0',width:'100',height:'100',fill:'red'});
  var xLen=rect.x.baseVal;

  // Set to various em values using newValueSpecifiedUnits
  // SVG_LENGTHTYPE_EMS = 3, SVG_LENGTHTYPE_EXS = 4
  // SVG_LENGTHTYPE_PX = 5, SVG_LENGTHTYPE_CM = 6
  // SVG_LENGTHTYPE_MM = 7, SVG_LENGTHTYPE_IN = 8
  // SVG_LENGTHTYPE_PT = 9, SVG_LENGTHTYPE_PC = 10
  // SVG_LENGTHTYPE_PERCENTAGE = 2
  var unitTypes={EMS:3,EXS:4,PX:5,CM:6,MM:7,IN:8,PT:9,PC:10,PCT:2};

  Object.keys(unitTypes).forEach(function(name){
    var ut=unitTypes[name];
    [1, 1000, 1e6, 1e8, 1e9, 1e12].forEach(function(v){
      try{
        xLen.newValueSpecifiedUnits(ut,v);
        var pxVal=xLen.value;
        var visuVal=xLen.valueInSpecifiedUnits;
        var p=classifyPtr(pxVal),w=isWeird(pxVal);
        if(p){R('HB[1]: unit='+name+' spec='+v+' .value='+f64hex(pxVal)+' POINTER!');}
        else if(w){B('HB[1]: unit='+name+' spec='+v+' .value='+f64hex(pxVal)+' weird='+pxVal);}
        else if(v>=1e6){P('HB[1]: unit='+name+' spec='+v+' .value='+pxVal+' visu='+visuVal);}
      }catch(e){P('HB[1]: unit='+name+' spec='+v+' threw: '+e.name);}
    });
  });

  // HB[2]: SVGLength in em units, element has extreme computed font size
  hdr('HB[2]: SVGLength in em units on element with extreme font-size');
  var div=document.createElement('div');
  div.style.cssText='position:fixed;left:0;top:0;font-size:1000000px;opacity:0.001';
  document.body.appendChild(div);
  var svg2=document.createElementNS(NS,'svg');
  svg2.setAttribute('width','100'); svg2.setAttribute('height','100');
  div.appendChild(svg2);
  var rect2=mkEl(svg2,'rect',{x:'0',y:'0',width:'50',height:'50',fill:'blue'});
  var xLen2=rect2.x.baseVal;
  try{
    xLen2.newValueSpecifiedUnits(3,1); // 1em
    var pxFromEm=xLen2.value;
    probeVal('HB[2]: 1em on font-size=1e6px element .value',pxFromEm);
  }catch(e){P('HB[2]: threw: '+e.name);}
  div.remove();

  // HB[3]: SVGLength percentage of extreme SVG viewport
  hdr('HB[3]: SVGLength percentage of extreme SVG viewport size');
  var svg3=mkSVG(1,1);
  svg3.setAttribute('width','1000000000');
  svg3.setAttribute('height','1000000000');
  var rect3=mkEl(svg3,'rect',{x:'0',y:'0',width:'50',height:'50',fill:'green'});
  var xLen3=rect3.x.baseVal;
  try{
    xLen3.newValueSpecifiedUnits(2,50); // 50%
    var pxFromPct=xLen3.value;
    probeVal('HB[3]: 50% of SVG width=1e9 .value',pxFromPct);
    xLen3.newValueSpecifiedUnits(2,100);
    probeVal('HB[3]: 100% of SVG width=1e9 .value',xLen3.value);
  }catch(e){P('HB[3]: threw: '+e.name);}
  svg3.remove();

  // HB[4]: SVGLength convertToSpecifiedUnits between all unit types at extremes
  hdr('HB[4]: SVGLength convertToSpecifiedUnits chain: mm→em→px at extreme');
  var svg4=mkSVG(200,200);
  var rect4=mkEl(svg4,'rect',{x:'0',y:'0',width:'50',height:'50',fill:'red'});
  var xl4=rect4.x.baseVal;
  try{
    // set a huge mm value
    xl4.newValueSpecifiedUnits(7,1e9); // 1e9mm
    var pxFromMm=xl4.value;
    probeVal('HB[4]: 1e9mm → .value (px)',pxFromMm);
    // now convertToSpecifiedUnits to em
    xl4.convertToSpecifiedUnits(3); // convert to EMS
    probeVal('HB[4]: after convertToSpecifiedUnits(EMS) .value (px)',xl4.value);
    probeVal('HB[4]: after convertToSpecifiedUnits(EMS) .valueInSpecifiedUnits',xl4.valueInSpecifiedUnits);
  }catch(e){P('HB[4]: threw: '+e.name);}
  svg4.remove();

  prog('HB done');
}

// ════════════════════════════════════════════════════════════════════════
// HC — DOMMatrix / WebKitCSSMatrix conversion from SVGMatrix
// DOMMatrix is a newer CSS/geometry API, different internal code path
// WebKitCSSMatrix (window.WebKitCSSMatrix) is the older prefixed version
// Both have .m41/.m42 (4x4 matrix translation components)
// fromMatrix, fromFloat64Array, multiply — different internal path
// ════════════════════════════════════════════════════════════════════════
function runHC(){
  hdr('HC: DOMMatrix / WebKitCSSMatrix from SVGMatrix extreme values');

  // HC[1]: DOMMatrix.fromMatrix with extreme SVGMatrix
  hdr('HC[1]: DOMMatrix.fromMatrix(svgMatrix with e=1e15)');
  var svg=mkSVG(200,200);
  var rect=mkEl(svg,'rect',{x:'0',y:'0',width:'50',height:'50',fill:'red'});
  var tl=rect.transform.baseVal;
  var xf=svg.createSVGTransform();

  [1e9, 1e12, 1e15, 1e18, Number.MAX_SAFE_INTEGER].forEach(function(v){
    xf.setTranslate(v,0);
    var svgMx=xf.matrix;
    var dm=null;
    try{dm=DOMMatrix.fromMatrix(svgMx);}catch(e){P('HC[1]: v='+v+' DOMMatrix.fromMatrix threw: '+e.name); return;}
    if(dm){
      ['m41','m42','m43','m44'].forEach(function(k){
        var kv=dm[k];
        var p=classifyPtr(kv),w=isWeird(kv);
        if(p){R('HC[1]: v='+v+' DOMMatrix.'+k+'='+f64hex(kv)+' POINTER! type='+p.type);}
        else if(w){B('HC[1]: v='+v+' DOMMatrix.'+k+'='+f64hex(kv)+' weird='+kv);}
        else if(kv!==0&&kv!==1){P('HC[1]: v='+v+' DOMMatrix.'+k+'='+kv);}
      });
    }
  });

  // HC[2]: DOMMatrix.fromFloat64Array — bypass SVGMatrix, raw f64 array
  hdr('HC[2]: DOMMatrix.fromFloat64Array with extreme translation values');
  // 4x4 column-major: [a,b,0,0, c,d,0,0, 0,0,1,0, tx,ty,0,1]
  var arr=new Float64Array(16);
  arr[0]=1; arr[5]=1; arr[10]=1; arr[15]=1; // identity diagonal
  [1e9, 1e12, 1e15].forEach(function(v){
    arr[12]=v; arr[13]=0; // m41=v
    var dm=null;
    try{dm=DOMMatrix.fromFloat64Array(arr);}catch(e){P('HC[2]: v='+v+' threw: '+e.name); return;}
    if(dm){
      var p=classifyPtr(dm.m41),w=isWeird(dm.m41);
      if(p){R('HC[2]: v='+v+' DOMMatrix.m41='+f64hex(dm.m41)+' POINTER!');}
      else if(w){B('HC[2]: v='+v+' DOMMatrix.m41='+f64hex(dm.m41)+' weird='+dm.m41);}
      else{P('HC[2]: v='+v+' DOMMatrix.m41='+dm.m41);}
    }
  });

  // HC[3]: WebKitCSSMatrix (if available)
  hdr('HC[3]: WebKitCSSMatrix / CSSMatrix probe');
  var WKM=window.WebKitCSSMatrix||window.CSSMatrix||window.MSCSSMatrix;
  if(WKM){
    [1e9, 1e12, 1e15].forEach(function(v){
      var wkm=null;
      try{wkm=new WKM('matrix(1,0,0,1,'+v+',0)');}catch(e){P('HC[3]: threw: '+e.name);}
      if(wkm){
        probeVal('HC[3]: v='+v+' WKM.m41',wkm.m41||wkm.e);
        probeVal('HC[3]: v='+v+' WKM.e',wkm.e);
      }
    });
  } else {
    P('HC[3]: WebKitCSSMatrix / CSSMatrix not available');
  }

  // HC[4]: DOMMatrix multiply chain — does multiply of two extreme matrices
  // go through a different code path that might expose internal state?
  hdr('HC[4]: DOMMatrix.multiply of two extreme matrices');
  [
    {tx:1e9, label:'1e9'},
    {tx:1e12, label:'1e12'},
    {tx:1e15, label:'1e15'}
  ].forEach(function(spec){
    var dmA=new DOMMatrix([1,0,0,1,spec.tx,0]);
    var dmB=new DOMMatrix([1,0,0,1,spec.tx,0]);
    var prod=null;
    try{prod=dmA.multiply(dmB);}catch(e){P('HC[4]: '+spec.label+' multiply threw: '+e.name); return;}
    if(prod){
      probeVal('HC[4]: ('+spec.label+')^2 DOMMatrix product.m41',prod.m41);
      probeVal('HC[4]: ('+spec.label+')^2 DOMMatrix product.m42',prod.m42);
    }
  });

  // HC[5]: DOMMatrix.inverse of extreme matrix
  hdr('HC[5]: DOMMatrix.inverse of extreme translation');
  [1e9, 1e12, 1e15].forEach(function(v){
    var dm=new DOMMatrix([1,0,0,1,v,0]);
    var inv=null;
    try{inv=dm.inverse();}catch(e){P('HC[5]: v='+v+' inverse threw: '+e.name); return;}
    if(inv){
      probeVal('HC[5]: v='+v+' inverse.m41',inv.m41);
    }
  });

  svg.remove();
  prog('HC done');
}

// ════════════════════════════════════════════════════════════════════════
// HD — Canvas 2D context transform matrix — getTransform()
// canvas.getTransform() returns a DOMMatrix reflecting the canvas CTM
// canvas.setTransform with extreme values → getTransform → DOMMatrix
// canvas.transform with extreme values accumulated
// Also: canvas.measureText on extreme font size → TextMetrics
// ════════════════════════════════════════════════════════════════════════
function runHD(){
  hdr('HD: Canvas 2D getTransform / setTransform → DOMMatrix + TextMetrics');
  var canvas=document.createElement('canvas');
  canvas.width=200; canvas.height=200;
  canvas.style.cssText='position:fixed;left:0;top:0;opacity:0.001;pointer-events:none';
  document.body.appendChild(canvas);
  var ctx=canvas.getContext('2d');

  // HD[1]: canvas.setTransform with extreme translation → getTransform
  hdr('HD[1]: canvas.setTransform(1,0,0,1,extreme,0) → ctx.getTransform()');
  [1e6, 1e9, 2147483648, 1e12, 1e15].forEach(function(v){
    try{
      ctx.setTransform(1,0,0,1,v,0);
      var dm=ctx.getTransform();
      if(dm){
        ['m41','m42','e','f'].forEach(function(k){
          if(dm[k]!==undefined){
            var kv=dm[k];
            var p=classifyPtr(kv),w=isWeird(kv);
            if(p){R('HD[1]: v='+v+' getTransform.'+k+'='+f64hex(kv)+' POINTER!');}
            else if(w){B('HD[1]: v='+v+' getTransform.'+k+'='+f64hex(kv)+' weird='+kv);}
            else if(kv!==0&&kv!==1){P('HD[1]: v='+v+' getTransform.'+k+'='+kv);}
          }
        });
      }
    }catch(e){P('HD[1]: v='+v+' threw: '+e.name);}
    ctx.resetTransform();
  });

  // HD[2]: accumulated canvas.translate — does overflow wrap?
  hdr('HD[2]: accumulated canvas.translate(1e9,0) repeated → getTransform');
  ctx.resetTransform();
  var N=20;
  for(var i=0;i<N;i++){
    try{ctx.translate(1e9,0);}catch(e){break;}
  }
  try{
    var dm2=ctx.getTransform();
    probeVal('HD[2]: after '+N+'x translate(1e9) getTransform.m41',dm2.m41||dm2.e);
  }catch(e){P('HD[2]: getTransform threw: '+e.name);}
  ctx.resetTransform();

  // HD[3]: canvas.measureText on element with extreme font size
  hdr('HD[3]: canvas.measureText with extreme font-size → TextMetrics');
  ['1000000px', '1e9px', '999999999px'].forEach(function(fs){
    try{
      ctx.font=fs+' sans-serif';
      var actualFont=ctx.font; // what did it actually set?
      var tm=ctx.measureText('A');
      var props=['width','actualBoundingBoxLeft','actualBoundingBoxRight',
        'actualBoundingBoxAscent','actualBoundingBoxDescent',
        'fontBoundingBoxAscent','fontBoundingBoxDescent'];
      props.forEach(function(k){
        if(tm[k]!==undefined){
          var kv=tm[k];
          var p=classifyPtr(kv),w=isWeird(kv);
          if(p){R('HD[3]: font='+fs+' tm.'+k+'='+f64hex(kv)+' POINTER!');}
          else if(w){B('HD[3]: font='+fs+' tm.'+k+'='+f64hex(kv)+' weird='+kv);}
          else if(kv!==0){P('HD[3]: font='+fs+' tm.'+k+'='+kv);}
        }
      });
    }catch(e){P('HD[3]: font='+fs+' threw: '+e.name);}
  });

  canvas.remove();
  prog('HD done');
}

// ════════════════════════════════════════════════════════════════════════
// HE — SVGGeometryElement.getTotalLength / getPointAtLength on
//       COMBINED extreme viewBox + path coords
// When an SVG has a tiny viewBox (e.g. viewBox="0 0 0.001 0.001") and the
// path uses coords near 1, the internal path coordinates after CTM multiply
// become 1e3+ per SVG unit. Does path parameterization then overflow?
// Also: SVGGraphicsElement.getBBox() after extreme transform
// ════════════════════════════════════════════════════════════════════════
function runHE(){
  hdr('HE: extreme viewBox + path coords combined → path geometry ops');
  var svg=mkSVG(400,400);

  // HE[1]: tiny viewBox + path at scale=1 (but internal coords are huge)
  hdr('HE[1]: SVG viewBox=0 0 0.001 0.001 width=400 → path coords at [0,1]');
  svg.setAttribute('viewBox','0 0 0.001 0.001'); // amplifier: 1 unit = 400000px
  var path=mkEl(svg,'path',{d:'M 0 0 L 0.001 0',fill:'none',stroke:'red','stroke-width':'0.0001'});
  var tl=null,pt=null;
  try{tl=path.getTotalLength();}catch(e){P('HE[1]: getTotalLength threw: '+e.name);}
  try{pt=path.getPointAtLength(0.0005);}catch(e){}
  B('HE[1]: viewBox=0.001 getTotalLength='+tl);
  if(pt){probeVal('HE[1]: getPointAtLength(0.0005) pt.x',pt.x);}

  // HE[2]: even tinier viewBox amplifier
  svg.setAttribute('viewBox','0 0 1e-9 1e-9');
  path.setAttribute('d','M 0 0 L 1e-9 0');
  var tl2=null;
  try{tl2=path.getTotalLength();}catch(e){P('HE[2]: threw: '+e.name);}
  B('HE[2]: viewBox=1e-9 getTotalLength='+tl2);
  if(tl2){
    var pt2=null;
    try{pt2=path.getPointAtLength(5e-10);}catch(e){}
    if(pt2){probeVal('HE[2]: getPointAtLength(5e-10) pt.x',pt2.x);}
  }

  // HE[3]: extreme viewBox + getBBox — does getBBox use pre-CTM or post-CTM?
  hdr('HE[3]: getBBox() after extreme viewBox amplification');
  svg.setAttribute('viewBox','0 0 0.001 0.001');
  path.setAttribute('d','M 0 0 L 0.001 0');
  var bbox=null;
  try{bbox=path.getBBox();}catch(e){P('HE[3]: getBBox threw: '+e.name);}
  if(bbox){
    ['x','y','width','height'].forEach(function(k){
      probeVal('HE[3]: bbox.'+k,bbox[k]);
    });
  }

  // HE[4]: getBBox with large scale transform + extreme path
  hdr('HE[4]: getBBox with large SVGTransform scale + extreme path coords');
  svg.setAttribute('viewBox','0 0 400 400');
  var rect2=mkEl(svg,'rect',{x:'0',y:'0',width:'50',height:'50',fill:'blue'});
  var tl_rect=rect2.transform.baseVal;
  var scaleXF=svg.createSVGTransform();
  scaleXF.setScale(1e9,1e9);
  tl_rect.appendItem(scaleXF);
  var bbox2=null;
  try{bbox2=rect2.getBBox();}catch(e){}
  if(bbox2){
    ['x','y','width','height'].forEach(function(k){
      probeVal('HE[4]: rect(scale=1e9).getBBox().'+k,bbox2[k]);
    });
  }

  // HE[5]: getScreenCTM after nested extreme viewBox
  hdr('HE[5]: nested SVG with extreme viewBox → inner element getScreenCTM');
  svg.setAttribute('viewBox','0 0 400 400');
  var innerSvg=mkEl(svg,'svg',{x:'0',y:'0',width:'400',height:'400',
    viewBox:'0 0 0.000001 0.000001'}); // 1 unit = 4e8px
  var innerRect=mkEl(innerSvg,'rect',{x:'0',y:'0',width:'0.000001',height:'0.000001',fill:'red'});
  var ctm=null;
  try{ctm=innerRect.getScreenCTM();}catch(e){}
  if(ctm){
    ['a','b','c','d','e','f'].forEach(function(k){
      probeVal('HE[5]: nested vb CTM.'+k,ctm[k]);
    });
  }

  svg.remove();
  prog('HE done');
}

// ════════════════════════════════════════════════════════════════════════
// HF — ResizeObserver / IntersectionObserver with SVG off-screen
//       layout geometry at extreme positions
// ResizeObserver.callback receives DOMRectReadOnly for each observed element
// IntersectionObserver.callback receives IntersectionObserverEntry
// boundingClientRect on an element at extreme position (via SVG transform)
// Also: element.getBoundingClientRect() during SMIL animation (live BCR)
// ════════════════════════════════════════════════════════════════════════
function runHF(){
  hdr('HF: ResizeObserver / IntersectionObserver geometry at extreme SVG positions');

  // HF[1]: ResizeObserver on SVG element with extreme translate
  hdr('HF[1]: ResizeObserver contentRect on SVG rect with 1e9 translate');
  var svg=mkSVG(400,400);
  var rect=mkEl(svg,'rect',{x:'0',y:'0',width:'50',height:'50',fill:'red'});
  // apply extreme translate
  var tl=rect.transform.baseVal;
  var xf=svg.createSVGTransform();
  xf.setTranslate(1e9,0);
  tl.appendItem(xf);

  if(typeof ResizeObserver!=='undefined'){
    var ro=new ResizeObserver(function(entries){
      entries.forEach(function(e){
        var cr=e.contentRect||e.contentBoxSize;
        // probe contentRect values
        if(e.contentRect){
          ['x','y','width','height','top','left','bottom','right'].forEach(function(k){
            if(e.contentRect[k]!==undefined){
              var v=e.contentRect[k];
              var p=classifyPtr(v),w=isWeird(v);
              if(p){R('HF[1]: ResizeObserver contentRect.'+k+'='+f64hex(v)+' POINTER!');}
              else if(w){B('HF[1]: ResizeObserver contentRect.'+k+'='+f64hex(v)+' weird='+v);}
              else if(v!==0){P('HF[1]: ResizeObserver contentRect.'+k+'='+v);}
            }
          });
        }
        ro.disconnect();
        svg.remove();
      });
    });
    ro.observe(rect);
  } else {
    P('HF[1]: ResizeObserver not available');
    svg.remove();
  }

  // HF[2]: IntersectionObserver on element at extreme SVG translate
  hdr('HF[2]: IntersectionObserver on element at extreme SVG position');
  var svg2=mkSVG(400,400);
  var rect2=mkEl(svg2,'rect',{x:'0',y:'0',width:'50',height:'50',fill:'blue'});
  var tl2=rect2.transform.baseVal;
  var xf2=svg2.createSVGTransform();
  xf2.setTranslate(1e9,0);
  tl2.appendItem(xf2);

  if(typeof IntersectionObserver!=='undefined'){
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        ['boundingClientRect','rootBounds','intersectionRect'].forEach(function(rectName){
          var r=e[rectName];
          if(r){
            ['x','y','width','height','top','left','bottom','right'].forEach(function(k){
              var v=r[k];
              if(v===null||v===undefined)return;
              var p=classifyPtr(v),w=isWeird(v);
              if(p){R('HF[2]: IO '+rectName+'.'+k+'='+f64hex(v)+' POINTER!');}
              else if(w){B('HF[2]: IO '+rectName+'.'+k+'='+f64hex(v)+' weird='+v);}
            });
          }
        });
        io.disconnect();
        svg2.remove();
      });
    });
    io.observe(rect2);
  } else {
    P('HF[2]: IntersectionObserver not available');
    svg2.remove();
  }

  // HF[3]: live getBoundingClientRect during SVGAnimateTransform
  hdr('HF[3]: BCR during active animateTransform → 1e9 endpoint');
  var svg3=mkSVG(400,400);
  var rect3=mkEl(svg3,'rect',{x:'0',y:'0',width:'50',height:'50',fill:'green'});
  mkEl(rect3,'animateTransform',{
    attributeName:'transform',type:'translate',
    from:'0 0',to:'1000000000 0',
    dur:'5s',repeatCount:'indefinite'
  });
  var bcrSamples=0;
  function sampleBCR(){
    var bcr=rect3.getBoundingClientRect();
    ['x','y','width','height','top','left','right','bottom'].forEach(function(k){
      var v=bcr[k];
      var p=classifyPtr(v),w=isWeird(v);
      if(p){R('HF[3]: live BCR.'+k+'='+f64hex(v)+' POINTER!');}
      else if(w){B('HF[3]: live BCR.'+k+'='+f64hex(v)+' weird='+v);}
    });
    bcrSamples++;
    if(bcrSamples<5){setTimeout(sampleBCR,100);}
    else{svg3.remove();}
  }
  setTimeout(sampleBCR,50);

  // HF[4]: Element.getClientRects() on SVG with extreme CTM
  hdr('HF[4]: getClientRects() on SVG element at extreme position');
  var svg4=mkSVG(400,400);
  var rect4=mkEl(svg4,'rect',{x:'0',y:'0',width:'100',height:'100',fill:'red'});
  var tl4=rect4.transform.baseVal;
  var xf4=svg4.createSVGTransform();
  xf4.setTranslate(1e9,0);
  tl4.appendItem(xf4);
  var rects=rect4.getClientRects();
  P('HF[4]: getClientRects length='+rects.length);
  for(var i=0;i<rects.length;i++){
    var r=rects[i];
    ['x','y','width','height','left','top','right','bottom'].forEach(function(k){
      var v=r[k];
      var p=classifyPtr(v),w=isWeird(v);
      if(p){R('HF[4]: rect['+i+'].'+k+'='+f64hex(v)+' POINTER!');}
      else if(w){B('HF[4]: rect['+i+'].'+k+'='+f64hex(v)+' weird='+v);}
    });
  }
  svg4.remove();

  prog('HF done — v43 complete');
}
</script>
