<body>
<h1>▓ SVG v39 — TEXT / FONT / CLIP / FOREIGN / MARKER</h1>
<h2>getStartPositionOfChar · textPath · canvas font metrics · clip-path polygon · foreignObject · marker BCR · iOS 26.5.2 / A16 arm64e</h2>
<div class="suite">
<div class="legend">
  <span class="leg leg-r">🔴 holy shit</span>
  <span class="leg leg-b">🔵 alright</span>
  <span class="leg leg-p">🩷 useless</span>
</div>
<button id="btn-all" onclick="runAll()">★ RUN ALL</button>
<button onclick="go('TX')">TX</button>
<button onclick="go('TP')">TP</button>
<button onclick="go('CF')">CF</button>
<button onclick="go('CP')">CP</button>
<button onclick="go('FO')">FO</button>
<button onclick="go('MK')">MK</button>

<button onclick="clearOut()">✕</button>
</div>
<div class="suite"><div id="progress"></div><div id="out"></div></div>

<script>
var NS='http://www.w3.org/2000/svg';
var _fb=new ArrayBuffer(8);
var _dv=new Float64Array(_fb);
var _uv=new Uint32Array(_fb);

function f64hex(f){
  if(f===null||f===undefined)return'null';
  if(typeof f==='string')return f;
  _dv[0]=f; return'0x'+_uv[1].toString(16).padStart(8,'0')+'_'+_uv[0].toString(16).padStart(8,'0');
}
function fromHiLo(hi,lo){_uv[1]=hi>>>0;_uv[0]=lo>>>0;return _dv[0];}

function classifyPtr(v){
  if(v===null||v===undefined||isNaN(v)||!isFinite(v))return null;
  _dv[0]=v; var hi=_uv[1],lo=_uv[0];
  if(hi===0x00000001)return{type:'arm64_user',hi,lo};
  if(hi>=0x00000002&&hi<=0x0000ffff&&lo>0x1000)return{type:'native_heap',hi,lo};
  if(hi>=0x00010000&&hi<=0x0001ffff)return{type:'jsc_cell',hi,lo};
  if(hi>=0x00100000&&hi<=0x001fffff)return{type:'pac_ptr',hi,lo};
  if(hi>=0xffff0000)return{type:'kernel',hi,lo};
  return null;
}
function isWeird(v){
  if(!isFinite(v)||isNaN(v)||v===0||v===1||v===-1)return false;
  _dv[0]=v; var hi=_uv[1];
  // skip normal layout float ranges
  if(hi>=0x3f000000&&hi<=0x43400000)return false;
  if(hi>=0xbf000000&&hi<=0xc3400000)return false;
  return true;
}

function log(m,c){
  var d=document.getElementById('out'),e=document.createElement('div');
  e.className='result '+(c||'pink'); e.textContent=m;
  d.appendChild(e); e.scrollIntoView({block:'nearest'});
}
function R(m){log(m,'red');}
function B(m){log(m,'blue');}
function P(m){log(m,'pink');}
function hdr(m){log(m,'hdr');}
function prog(m){document.getElementById('progress').textContent=m;}
function clearOut(){document.getElementById('out').innerHTML='';prog('');}
function copyAll(){
  var lines=[];
  document.querySelectorAll('#out .result').forEach(function(e){lines.push(e.textContent);});
  navigator.clipboard&&navigator.clipboard.writeText(lines.join('\n'));
}
function go(s){clearOut();window['run'+s]();}
function runAll(){
  clearOut();
  runTX();
  setTimeout(function(){runTP();},2000);
  setTimeout(function(){runCF();},4000);
  setTimeout(function(){runCP();},6000);
  setTimeout(function(){runFO();},8000);
  setTimeout(function(){runMK();},10000);
}

function mkSVG(w,h){
  var s=document.createElementNS(NS,'svg');
  s.setAttribute('width',w||400); s.setAttribute('height',h||200);
  s.style.cssText='position:fixed;left:0;top:0;width:'+(w||400)+'px;height:'+(h||200)+'px;opacity:0.001;pointer-events:none';
  document.body.appendChild(s); return s;
}
function mkEl(p,tag,attrs){
  var e=document.createElementNS(NS,tag);
  if(attrs)Object.keys(attrs).forEach(function(k){e.setAttribute(k,attrs[k]);});
  p.appendChild(e); return e;
}
function probePoint(label,pt){
  if(!pt){P(label+': null point'); return;}
  var xp=classifyPtr(pt.x), yp=classifyPtr(pt.y);
  var xw=isWeird(pt.x), yw=isWeird(pt.y);
  if(xp||yp){
    R(label+': POINTER! x='+f64hex(pt.x)+' y='+f64hex(pt.y)+
      ' x_type='+(xp?xp.type:'clean')+' y_type='+(yp?yp.type:'clean'));
  } else if(xw||yw){
    B(label+': weird coords x='+f64hex(pt.x)+' y='+f64hex(pt.y));
  } else {
    P(label+': x='+pt.x.toFixed(4)+' y='+pt.y.toFixed(4));
  }
}

// ════════════════════════════════════════════════════════════════════════
// TX — SVGTextElement.getStartPositionOfChar / getEndPositionOfChar
// text layout is completely separate from transform pipeline
// char positions come from font shaper → glyph advance cache → SVGPoint
// getExtentOfChar returns SVGRect — 4 fields instead of 2
// ════════════════════════════════════════════════════════════════════════
function runTX(){
  hdr('TX: SVGTextElement char position probe');
  var svg=mkSVG(600,200);

  // TX[1]: basic getStartPositionOfChar
  hdr('TX[1]: getStartPositionOfChar — ASCII text');
  var t1=mkEl(svg,'text',{x:'10',y:'50','font-size':'24','font-family':'monospace'});
  t1.textContent='AAAAAAAAAA';
  for(var i=0;i<10;i++){
    var pt=null;
    try{pt=t1.getStartPositionOfChar(i);}catch(e){P('TX[1]: char '+i+' threw: '+e.name); break;}
    probePoint('TX[1]: char['+i+']',pt);
  }

  // TX[2]: getEndPositionOfChar — returns a NEW SVGPoint
  hdr('TX[2]: getEndPositionOfChar');
  for(var i=0;i<5;i++){
    var pt=null;
    try{pt=t1.getEndPositionOfChar(i);}catch(e){break;}
    probePoint('TX[2]: end['+i+']',pt);
  }

  // TX[3]: getExtentOfChar — returns SVGRect (4 fields)
  hdr('TX[3]: getExtentOfChar — SVGRect probe (4 fields)');
  for(var i=0;i<5;i++){
    var rect=null;
    try{rect=t1.getExtentOfChar(i);}catch(e){P('TX[3]: char '+i+' threw: '+e.name); break;}
    if(!rect){P('TX[3]: char '+i+': null'); continue;}
    ['x','y','width','height'].forEach(function(f){
      var v=rect[f];
      var p=classifyPtr(v);
      if(p){R('TX[3]: char['+i+'].'+f+'='+f64hex(v)+' POINTER type='+p.type);}
      else if(isWeird(v)){B('TX[3]: char['+i+'].'+f+'='+f64hex(v)+' weird');}
      else{P('TX[3]: char['+i+'].'+f+'='+v.toFixed(4));}
    });
  }

  // TX[4]: Unicode/emoji/RTL text — different shaper path
  hdr('TX[4]: Unicode/RTL/emoji char positions');
  var texts=[
    {label:'RTL Arabic',text:'مرحبا'},
    {label:'CJK',text:'中文文字'},
    {label:'Emoji',text:'😀😁😂'},
    {label:'Math',text:'αβγδε'},
  ];
  texts.forEach(function(spec){
    var t=mkEl(svg,'text',{x:'10',y:'100','font-size':'24'});
    t.textContent=spec.text;
    var pt=null;
    try{pt=t.getStartPositionOfChar(0);}catch(e){P('TX[4]: '+spec.label+' threw: '+e.name); return;}
    probePoint('TX[4]: '+spec.label+' char[0]',pt);
    var ext=null;
    try{ext=t.getExtentOfChar(0);}catch(e){}
    if(ext){
      ['x','y','width','height'].forEach(function(f){
        var v=ext[f];
        if(classifyPtr(v)||isWeird(v)){
          classifyPtr(v)?R('TX[4]: '+spec.label+' extent.'+f+'='+f64hex(v)+' POINTER!'):
          B('TX[4]: '+spec.label+' extent.'+f+'='+f64hex(v));
        }
      });
    }
  });

  // TX[5]: getCharNumAtPosition — reverse lookup
  hdr('TX[5]: getCharNumAtPosition with extreme coords');
  var extremePt=svg.createSVGPoint();
  extremePt.x=1e15; extremePt.y=1e15;
  var charNum=null;
  try{charNum=t1.getCharNumAtPosition(extremePt);}catch(e){charNum='THROWS: '+e.name;}
  P('TX[5]: getCharNumAtPosition(1e15,1e15)='+charNum);

  // TX[6]: selectSubString — may touch internal selection struct
  hdr('TX[6]: selectSubString probe');
  try{t1.selectSubString(0,5);}catch(e){P('TX[6]: selectSubString threw: '+e.name);}
  // read positions after selection
  var selPt=null;
  try{selPt=t1.getStartPositionOfChar(2);}catch(e){}
  probePoint('TX[6]: char[2] after selectSubString',selPt);

  svg.remove();
  prog('TX done');
}

// ════════════════════════════════════════════════════════════════════════
// TP — SVGTextPathElement — text on a path
// combines path geometry engine + text layout engine
// char positions are computed from path parameterization
// getStartPositionOfChar on textPath element
// ════════════════════════════════════════════════════════════════════════
function runTP(){
  hdr('TP: SVGTextPathElement — text on path char positions');
  var svg=mkSVG(600,300);
  var defs=mkEl(svg,'defs');

  // TP[1]: circular path textPath
  hdr('TP[1]: text on circular arc path');
  var circ=mkEl(defs,'path',{
    id:'tp_circ',
    d:'M 150 150 m -100 0 a 100 100 0 1 1 200 0 a 100 100 0 1 1 -200 0'
  });
  var txt1=mkEl(svg,'text',{'font-size':'16','font-family':'monospace'});
  var tp1=mkEl(txt1,'textPath',{href:'#tp_circ'});
  tp1.textContent='ABCDEFGHIJ';

  for(var i=0;i<10;i++){
    var pt=null;
    try{pt=txt1.getStartPositionOfChar(i);}catch(e){P('TP[1]: char '+i+' threw: '+e.name); break;}
    probePoint('TP[1]: circ['+i+']',pt);
  }

  // TP[2]: extreme-coord path
  hdr('TP[2]: textPath on extreme-coord path');
  var extPath=mkEl(defs,'path',{id:'tp_ext',d:'M 0 0 L 1e9 0'});
  var txt2=mkEl(svg,'text',{'font-size':'16'});
  var tp2=mkEl(txt2,'textPath',{href:'#tp_ext'});
  tp2.textContent='HELLO';
  for(var i=0;i<5;i++){
    var pt=null;
    try{pt=txt2.getStartPositionOfChar(i);}catch(e){P('TP[2]: char '+i+' threw: '+e.name); break;}
    probePoint('TP[2]: extreme['+i+']',pt);
  }

  // TP[3]: getExtentOfChar on textPath chars — combines two engines
  hdr('TP[3]: getExtentOfChar on textPath element');
  for(var i=0;i<5;i++){
    var rect=null;
    try{rect=txt1.getExtentOfChar(i);}catch(e){P('TP[3]: threw: '+e.name); break;}
    if(rect){
      ['x','y','width','height'].forEach(function(f){
        var v=rect[f];
        if(classifyPtr(v)||isWeird(v)){
          classifyPtr(v)?R('TP[3]: textPath extent['+i+'].'+f+'='+f64hex(v)+' POINTER!'):
          B('TP[3]: textPath extent['+i+'].'+f+'='+f64hex(v)+' weird');
        }
      });
    }
  }

  svg.remove();
  prog('TP done');
}

// ════════════════════════════════════════════════════════════════════════
// CF — Canvas font metrics leak
// CanvasRenderingContext2D.measureText → TextMetrics
// 12 fields: width, actualBoundingBox*, fontBoundingBox*, etc.
// all go through CoreText font shaper → different internal pipeline
// ════════════════════════════════════════════════════════════════════════
function runCF(){
  hdr('CF: Canvas font metrics leak probe');
  var canvas=document.createElement('canvas');
  canvas.width=800; canvas.height=200;
  canvas.style.cssText='position:fixed;left:0;top:0;opacity:0.001;pointer-events:none';
  document.body.appendChild(canvas);
  var ctx=canvas.getContext('2d');

  var tmFields=[
    'width','actualBoundingBoxLeft','actualBoundingBoxRight',
    'fontBoundingBoxAscent','fontBoundingBoxDescent',
    'actualBoundingBoxAscent','actualBoundingBoxDescent',
    'emHeightAscent','emHeightDescent','hangingBaseline',
    'alphabeticBaseline','ideographicBaseline'
  ];

  function probeMetrics(label,text,font){
    ctx.font=font;
    var tm=ctx.measureText(text);
    tmFields.forEach(function(f){
      var v=tm[f];
      if(v===undefined||v===null)return;
      var p=classifyPtr(v);
      if(p){R('CF: '+label+' .'+f+'='+f64hex(v)+' POINTER! type='+p.type);}
      else if(isWeird(v)){B('CF: '+label+' .'+f+'='+f64hex(v)+' weird='+v);}
    });
    P('CF: '+label+' width='+( tm.width?tm.width.toFixed(4):'null'));
  }

  // CF[1]: system font fallback chain — different shaper per font
  hdr('CF[1]: system font metrics — various fonts');
  ['10px monospace','10px serif','10px sans-serif',
   '10px -apple-system','10px Arial','10px Helvetica',
   '1px monospace','0.001px monospace','1000px monospace'].forEach(function(font){
    probeMetrics(font,'AAAA',font);
  });

  // CF[2]: unusual Unicode through CoreText shaper
  hdr('CF[2]: Unicode/emoji/RTL through CoreText');
  [
    ['مرحبا','16px Arial','Arabic'],
    ['中文','16px PingFang SC','CJK'],
    ['😀','32px Arial','Emoji'],
    ['Ω∫∂','16px serif','Math'],
    ['‮ HELLO','16px monospace','RTL override'],
  ].forEach(function(spec){
    probeMetrics(spec[2],spec[0],spec[1]);
  });

  // CF[3]: very long strings — buffer sizing
  hdr('CF[3]: long string metrics — internal buffer sizing');
  probeMetrics('1000-char string','A'.repeat(1000),'12px monospace');
  probeMetrics('10000-char string','A'.repeat(10000),'12px monospace');

  // CF[4]: font size extremes
  hdr('CF[4]: extreme font sizes');
  ['0.0001px monospace','1e10px monospace','1e15px monospace'].forEach(function(font){
    try{probeMetrics(font,'A',font);}catch(e){P('CF[4]: '+font+' threw: '+e);}
  });

  canvas.remove();
  prog('CF done');
}

// ════════════════════════════════════════════════════════════════════════
// CP — CSS clip-path polygon() with extreme coords
// clip-path goes through GeometryUtilities / Path::apply
// different pipeline from SVG transform — no LayoutUnit in some paths
// BCR on clipped element may expose clip region geometry
// ════════════════════════════════════════════════════════════════════════
function runCP(){
  hdr('CP: CSS clip-path polygon extreme coords');

  // CP[1]: clip-path with 1e15 coords on SVG element
  hdr('CP[1]: SVG element with clip-path polygon(1e15)');
  var svg=mkSVG(400,400);
  var r=mkEl(svg,'rect',{x:'0',y:'0',width:'100',height:'100',fill:'red'});
  r.style.clipPath='polygon(0px 0px, 1e9px 0px, 1e9px 1e9px)';

  var b=r.getBoundingClientRect();
  ['x','y','width','height','right','bottom'].forEach(function(f){
    var v=b[f];
    var p=classifyPtr(v);
    if(p){R('CP[1]: clip-path BCR.'+f+'='+f64hex(v)+' POINTER! type='+p.type);}
    else if(isWeird(v)){B('CP[1]: clip-path BCR.'+f+'='+f64hex(v)+' weird='+v);}
    else{P('CP[1]: BCR.'+f+'='+v);}
  });

  // CP[2]: clip-path on HTML div — HTML renderer path
  hdr('CP[2]: HTML div clip-path polygon extreme');
  var div=document.createElement('div');
  div.style.cssText='position:fixed;left:0;top:0;width:200px;height:200px;background:red';
  div.style.clipPath='polygon(0px 0px, 999999999px 0px, 0px 999999999px)';
  document.body.appendChild(div);
  var db=div.getBoundingClientRect();
  ['x','y','width','height'].forEach(function(f){
    var v=db[f];
    var p=classifyPtr(v);
    if(p){R('CP[2]: div clip-path BCR.'+f+'='+f64hex(v)+' POINTER! type='+p.type);}
    else if(isWeird(v)){B('CP[2]: div clip-path BCR.'+f+'='+f64hex(v)+' weird='+v);}
    else{P('CP[2]: div BCR.'+f+'='+v);}
  });
  div.remove();

  // CP[3]: SVG clipPath element with extreme coords
  hdr('CP[3]: SVG <clipPath> element with 1e9 coords');
  var defs=mkEl(svg,'defs');
  var clipEl=mkEl(defs,'clipPath',{id:'cp3'});
  mkEl(clipEl,'rect',{x:'0',y:'0',width:'1000000000',height:'1000000000'});
  var r3=mkEl(svg,'rect',{x:'0',y:'0',width:'100',height:'100',fill:'blue','clip-path':'url(#cp3)'});
  var b3=r3.getBoundingClientRect();
  ['x','y','width','height'].forEach(function(f){
    var v=b3[f];
    var p=classifyPtr(v);
    if(p){R('CP[3]: SVG clipPath BCR.'+f+'='+f64hex(v)+' POINTER!');}
    else if(isWeird(v)){B('CP[3]: SVG clipPath BCR.'+f+'='+f64hex(v)+' weird');}
    else{P('CP[3]: SVG clipPath BCR.'+f+'='+v);}
  });

  // CP[4]: getScreenCTM on element with clip-path
  hdr('CP[4]: getScreenCTM on clip-path element');
  var c4=null;
  try{c4=r3.getScreenCTM();}catch(e){}
  if(c4){
    ['a','b','c','d','e','f'].forEach(function(f){
      var v=c4[f];
      var p=classifyPtr(v);
      if(p){R('CP[4]: CTM.'+f+'='+f64hex(v)+' POINTER! type='+p.type);}
      else if(isWeird(v)){B('CP[4]: CTM.'+f+'='+f64hex(v)+' weird');}
    });
    P('CP[4]: CTM.e='+c4.e+' f='+c4.f);
  }

  svg.remove();
  prog('CP done');
}

// ════════════════════════════════════════════════════════════════════════
// FO — SVGForeignObjectElement
// creates mixed renderer boundary: SVG renderer + HTML renderer
// BCR and CTM at the boundary may expose internal compositor coords
// ════════════════════════════════════════════════════════════════════════
function runFO(){
  hdr('FO: SVGForeignObjectElement renderer boundary probe');
  var svg=mkSVG(400,400);

  // FO[1]: basic foreignObject BCR
  hdr('FO[1]: foreignObject BCR and CTM at renderer boundary');
  var fo=mkEl(svg,'foreignObject',{x:'10',y:'10',width:'100',height:'100'});
  var div=document.createElementNS('http://www.w3.org/1999/xhtml','div');
  div.style.cssText='width:100px;height:100px;background:red;';
  fo.appendChild(div);

  var fb=fo.getBoundingClientRect();
  ['x','y','width','height'].forEach(function(f){
    var v=fb[f];
    var p=classifyPtr(v);
    if(p){R('FO[1]: fo BCR.'+f+'='+f64hex(v)+' POINTER!');}
    else if(isWeird(v)){B('FO[1]: fo BCR.'+f+'='+f64hex(v)+' weird');}
    else{P('FO[1]: fo BCR.'+f+'='+v);}
  });

  var fc=null;
  try{fc=fo.getScreenCTM();}catch(e){}
  if(fc){
    ['a','b','c','d','e','f'].forEach(function(f){
      var v=fc[f];
      var p=classifyPtr(v);
      if(p){R('FO[1]: fo CTM.'+f+'='+f64hex(v)+' POINTER! type='+p.type);}
      else if(isWeird(v)){B('FO[1]: fo CTM.'+f+'='+f64hex(v)+' weird');}
    });
  }

  // FO[2]: inner HTML div BCR — does it inherit SVG coordinate space?
  hdr('FO[2]: inner HTML element BCR inside foreignObject');
  var innerDiv=document.createElementNS('http://www.w3.org/1999/xhtml','div');
  innerDiv.style.cssText='width:50px;height:50px;position:absolute;left:1000000px;top:0';
  fo.appendChild(innerDiv);
  var idb=innerDiv.getBoundingClientRect();
  ['x','y','width','height'].forEach(function(f){
    var v=idb[f];
    var p=classifyPtr(v);
    if(p){R('FO[2]: inner div BCR.'+f+'='+f64hex(v)+' POINTER! type='+p.type);}
    else if(isWeird(v)){B('FO[2]: inner div BCR.'+f+'='+f64hex(v)+' weird='+v);}
    else{P('FO[2]: inner div BCR.'+f+'='+v);}
  });

  // FO[3]: apply transform to foreignObject, read inner element BCR
  hdr('FO[3]: transformed foreignObject — inner element BCR');
  fo.setAttribute('transform','matrix(1 0 0 1 999999 0)');
  var idb3=innerDiv.getBoundingClientRect();
  ['x','y'].forEach(function(f){
    var v=idb3[f];
    var p=classifyPtr(v);
    if(p){R('FO[3]: transformed inner BCR.'+f+'='+f64hex(v)+' POINTER! type='+p.type);}
    else if(isWeird(v)){B('FO[3]: transformed inner BCR.'+f+'='+f64hex(v)+' weird='+v);}
    else{P('FO[3]: transformed inner BCR.'+f+'='+v);}
  });

  // FO[4]: getScreenCTM on inner HTML element inside foreignObject
  hdr('FO[4]: getScreenCTM on inner HTML element');
  // only SVG elements have getScreenCTM — create nested SVG inside foreignObject
  var innerSVG=document.createElementNS(NS,'svg');
  innerSVG.setAttribute('width','50'); innerSVG.setAttribute('height','50');
  fo.appendChild(innerSVG);
  var innerRect=mkEl(innerSVG,'rect',{x:'0',y:'0',width:'10',height:'10',fill:'green'});
  var irCTM=null;
  try{irCTM=innerRect.getScreenCTM();}catch(e){}
  if(irCTM){
    ['a','b','c','d','e','f'].forEach(function(f){
      var v=irCTM[f];
      var p=classifyPtr(v);
      if(p){R('FO[4]: nested SVG in foreignObject CTM.'+f+'='+f64hex(v)+' POINTER! type='+p.type);}
      else if(isWeird(v)){B('FO[4]: nested SVG CTM.'+f+'='+f64hex(v)+' weird');}
    });
    P('FO[4]: nested SVG CTM: e='+irCTM.e+' f='+irCTM.f);
  }

  svg.remove();
  prog('FO done');
}

// ════════════════════════════════════════════════════════════════════════
// MK — SVGMarkerElement BCR during animation
// markers are recomputed per stroke point, per frame
// marker has its own coordinate system (markerWidth/Height/viewBox)
// BCR on marker element during active path stroke animation
// ════════════════════════════════════════════════════════════════════════
function runMK(){
  hdr('MK: SVGMarkerElement BCR during animated stroke');
  var svg=mkSVG(400,400);
  var defs=mkEl(svg,'defs');

  // MK[1]: basic marker BCR
  hdr('MK[1]: marker element BCR — static');
  var marker=mkEl(defs,'marker',{
    id:'mk1',markerWidth:'10',markerHeight:'10',
    refX:'5',refY:'5',orient:'auto'
  });
  var markerCircle=mkEl(marker,'circle',{cx:'5',cy:'5',r:'4',fill:'red'});

  var mb=marker.getBoundingClientRect();
  ['x','y','width','height'].forEach(function(f){
    var v=mb[f];
    var p=classifyPtr(v);
    if(p){R('MK[1]: marker BCR.'+f+'='+f64hex(v)+' POINTER! type='+p.type);}
    else if(isWeird(v)){B('MK[1]: marker BCR.'+f+'='+f64hex(v)+' weird='+v);}
    else{P('MK[1]: marker BCR.'+f+'='+v);}
  });

  // MK[2]: path with marker-start/mid/end + animation
  hdr('MK[2]: animated path with markers — BCR during animation');
  var path=mkEl(svg,'path',{
    d:'M 50 100 L 350 100',
    stroke:'blue','stroke-width':'2',fill:'none',
    'marker-start':'url(#mk1)',
    'marker-mid':'url(#mk1)',
    'marker-end':'url(#mk1)'
  });
  mkEl(path,'animate',{
    attributeName:'d',
    from:'M 50 100 L 350 100',
    to:'M 50 50 L 350 350',
    dur:'1s', repeatCount:'indefinite'
  });

  // read BCR on marker element during animation
  var mkSamples=[];
  var mkStart=performance.now();

  function mkFrame(){
    var elapsed=performance.now()-mkStart;
    if(elapsed>1000){
      hdr('MK[2]: '+mkSamples.length+' marker BCR samples during animation');
      var weird=mkSamples.filter(function(s){return s.weird||s.ptr;});
      B('MK[2]: total='+mkSamples.length+' weird/ptr='+weird.length);
      weird.forEach(function(s){
        s.ptr?R('MK[2]: t='+s.t.toFixed(0)+'ms field='+s.f+' val='+f64hex(s.v)+' type='+s.ptr.type):
        B('MK[2]: t='+s.t.toFixed(0)+'ms field='+s.f+' val='+f64hex(s.v)+' weird');
      });
      if(weird.length===0)P('MK[2]: no weird values in marker BCR during animation');

      // MK[3]: getScreenCTM on the marker circle during animation
      hdr('MK[3]: getScreenCTM on marker child element during animation');
      var mc=null;
      try{mc=markerCircle.getScreenCTM();}catch(e){}
      if(mc){
        ['a','b','c','d','e','f'].forEach(function(f){
          var v=mc[f];
          var p=classifyPtr(v);
          if(p){R('MK[3]: marker child CTM.'+f+'='+f64hex(v)+' POINTER! type='+p.type);}
          else if(isWeird(v)){B('MK[3]: marker child CTM.'+f+'='+f64hex(v)+' weird');}
          else{P('MK[3]: marker CTM.'+f+'='+v);}
        });
      }

      svg.remove();
      prog('MK done — v39 complete');
      return;
    }

    // sample marker BCR
    var mb2=marker.getBoundingClientRect();
    ['x','y','width','height','right','bottom'].forEach(function(f){
      var v=mb2[f];
      var p=classifyPtr(v);
      var w=isWeird(v);
      if(p||w)mkSamples.push({t:elapsed,f:f,v:v,ptr:p,weird:w});
    });
    requestAnimationFrame(mkFrame);
  }
  setTimeout(function(){requestAnimationFrame(mkFrame);},50);
}
</script>
