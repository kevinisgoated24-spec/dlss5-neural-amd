var SVG_NS='http://www.w3.org/2000/svg';

function timeWrite(writeFn,label,ITER){
  ITER=ITER||500;
  var t0=performance.now();
  for(var i=0;i<ITER;i++) writeFn(i);
  var t1=performance.now();
  var ms=(t1-t0).toFixed(2);
  var us=((t1-t0)*1000/ITER).toFixed(1);
  L(label+': '+ms+'ms ('+us+'µs/write)','info');
  return t1-t0;
}

// ═══════════════════════════════════════════════════════════════
// ADR101 — SVGTransformList stale TearOff probe
//
// SVGTransformList is the animatedTransformList for <g transform="...">.
// Each item is an SVGTransform, NOT an SVGNumber.
// SVGTransform.setMatrix(SVGMatrix m) modifies all 6 floats at once.
// SVGTransform.setTranslate(x, y), setScale(sx, sy), etc.
//
// The key question: does SVGTransformList.removeItem() null the
// TearOff context of the removed item? Or does it follow the same
// pattern as SVGNumberList (where removeItem uniquely survives)?
//
// Since SVGTransformList uses SVGListPropertyTearOff<SVGTransformList>
// which is a DIFFERENT C++ template instantiation, the behavior might differ.
//
// If removeItem on SVGTransformList ALSO keeps context alive:
// → We have a second property type with live stale TearOff
// → SVGTransform has 6 floats + a type (matrix, translate, rotate, etc.)
// → More write surface per item
//
// Probe: same ADR88 approach — time all operations, look for survivors.
// Operations: setAttributeNS, removeAttribute, g.remove(), svg.remove(),
//             removeItem(0), clear(), replaceItem
//
// Write via stale: T_tr.setTranslate(x, y) — uses 2 floats instead of 1
// Measure: timing of write through stale TearOff after each operation
// ═══════════════════════════════════════════════════════════════
suites['ADR101']=function(){
  L('ADR101: SVGTransformList stale TearOff — all operations probe','info');
  var N=10;// SVGTransformList doesn't need 20 items
  var ITER=500;

  function makeG(n){
    var svg=document.createElementNS(SVG_NS,'svg');document.body.appendChild(svg);
    var g=document.createElementNS(SVG_NS,'g');
    // Build a transform list by setting multiple transform functions
    // SVGTransformList from transform attribute
    var transforms=[];
    for(var i=0;i<n;i++) transforms.push('translate('+(i*10)+','+(i*5)+')');
    g.setAttribute('transform',transforms.join(' '));
    svg.appendChild(g);
    return{svg:svg,g:g};
  }

  function getTransformList(g){return g.transform.baseVal;}

  // Baseline: live TearOff write
  var oBase=makeG(N);
  var TL_base=getTransformList(oBase.g);
  var T_base=TL_base.getItem(0);
  var tBase=timeWrite(function(i){T_base.setTranslate(i,i*2);},'  BASELINE live SVGTransform write',ITER);
  L('ADR101: baseline='+tBase.toFixed(2)+'ms','info');
  oBase.svg.remove();

  // A: setAttributeNS
  var oA=makeG(N);
  var TL_A=getTransformList(oA.g);
  var T_A=TL_A.getItem(0);
  oA.g.setAttributeNS(null,'transform','scale(2)');
  var tA=timeWrite(function(i){T_A.setTranslate(i,i);},'  A: setAttributeNS stale SVGTransform',ITER);
  L('ADR101 A: '+tA.toFixed(2)+'ms'+(tA>0.5?' ★ALIVE':''),'info');
  oA.svg.remove();

  // B: removeAttribute
  var oB=makeG(N);
  var TL_B=getTransformList(oB.g);
  var T_B=TL_B.getItem(0);
  oB.g.removeAttribute('transform');
  var tB=timeWrite(function(i){T_B.setTranslate(i,i);},'  B: removeAttribute stale SVGTransform',ITER);
  L('ADR101 B: '+tB.toFixed(2)+'ms'+(tB>0.5?' ★ALIVE':''),'info');
  oB.svg.remove();

  // C: g.remove() (element out of DOM)
  var oC=makeG(N);
  var TL_C=getTransformList(oC.g);
  var T_C=TL_C.getItem(0);
  oC.g.remove();
  var tC=timeWrite(function(i){T_C.setTranslate(i,i);},'  C: g.remove() stale SVGTransform',ITER);
  L('ADR101 C: '+tC.toFixed(2)+'ms'+(tC>0.5?' ★ALIVE':''),'info');
  oC.svg.remove();

  // D: svg.remove()
  var oD=makeG(N);
  var TL_D=getTransformList(oD.g);
  var T_D=TL_D.getItem(0);
  oD.svg.remove();
  var tD=timeWrite(function(i){T_D.setTranslate(i,i);},'  D: svg.remove() stale SVGTransform',ITER);
  L('ADR101 D: '+tD.toFixed(2)+'ms'+(tD>0.5?' ★ALIVE':''),'info');

  // E: removeItem(0) — THE KEY TEST
  var oE=makeG(N);
  var TL_E=getTransformList(oE.g);
  var T_E=TL_E.getItem(0);
  var preRemoveVal=[T_E.matrix.a,T_E.matrix.e,T_E.matrix.f];
  TL_E.removeItem(0);
  L('ADR101: after removeItem(0): listLength='+TL_E.numberOfItems,'info');
  var tE=timeWrite(function(i){T_E.setTranslate(i*1.5,i*0.5);},'  E: removeItem(0) stale SVGTransform',ITER);
  L('ADR101 E: '+tE.toFixed(2)+'ms'+(tE>0.5?' ★★★ALIVE':''),'info');
  if(tE>0.5){
    L('★★★ ADR101: SVGTransformList removeItem SURVIVED! Notification fires!','hit');
    // Check if remaining items were corrupted
    for(var i=0;i<TL_E.numberOfItems;i++){
      var item=TL_E.getItem(i);
      L('  item['+i+']: tx='+item.matrix.e.toFixed(2)+' ty='+item.matrix.f.toFixed(2),'info');
    }
  }
  oE.svg.remove();

  // F: clear()
  var oF=makeG(N);
  var TL_F=getTransformList(oF.g);
  var T_F=TL_F.getItem(0);
  TL_F.clear();
  var tF=timeWrite(function(i){T_F.setTranslate(i,i);},'  F: clear() stale SVGTransform',ITER);
  L('ADR101 F: '+tF.toFixed(2)+'ms'+(tF>0.5?' ★ALIVE':''),'info');
  oF.svg.remove();

  // G: replaceItem — old item stale after replace
  var oG=makeG(N);
  var TL_G=getTransformList(oG.g);
  var T_G_old=TL_G.getItem(0);
  var T_G_new=TL_G.getItem(1);
  TL_G.replaceItem(T_G_new,0);
  var tG=timeWrite(function(i){T_G_old.setTranslate(i,i);},'  G: replaceItem stale SVGTransform',ITER);
  L('ADR101 G: '+tG.toFixed(2)+'ms'+(tG>0.5?' ★ALIVE':''),'info');
  oG.svg.remove();

  L('ADR101: summary: base='+tBase.toFixed(2)+' A='+tA.toFixed(2)+' B='+tB.toFixed(2)+' C='+tC.toFixed(2)+' D='+tD.toFixed(2)+' E='+tE.toFixed(2)+' F='+tF.toFixed(2)+' G='+tG.toFixed(2),'info');
  if(tE>0.5) L('★★★ ADR101: E (removeItem) SURVIVED → new attack surface!','hit');
  else L('ADR101: all operations null context. SVGTransformList = same as SVGNumberList.','info');
};

// ═══════════════════════════════════════════════════════════════
// ADR102 — SVGPointList stale SVGPoint TearOff probe
//
// SVGPointList is the animatedPoints attribute of <polygon> and <polyline>.
// Each point has .x and .y properties.
// SVGPoint is simpler than SVGTransform (just 2 floats).
//
// SVGPointList uses SVGListPropertyTearOff<SVGPointList> — yet another
// C++ template instantiation. Different codepath.
//
// Key: polygon.points.baseVal.removeItem(0) — does the removed SVGPoint's
// TearOff keep context alive?
//
// Also: can we do TearOff writes via .x and .y properties separately?
// SVGPoint.x and SVGPoint.y might each have their own TearOff?
// Or: SVGPoint itself is the TearOff (no sub-TearOffs for x/y).
//
// Write test: after removeItem, write to T_pt.x and T_pt.y.
// ═══════════════════════════════════════════════════════════════
suites['ADR102']=function(){
  L('ADR102: SVGPointList stale SVGPoint TearOff — removeItem probe','info');
  var N=20;
  var ITER=500;

  function makePoly(n){
    var svg=document.createElementNS(SVG_NS,'svg');document.body.appendChild(svg);
    var poly=document.createElementNS(SVG_NS,'polygon');
    var pts=[];
    for(var i=0;i<n;i++) pts.push((i*10)+','+(i*5));
    poly.setAttribute('points',pts.join(' '));
    svg.appendChild(poly);
    return{svg:svg,poly:poly};
  }

  // Baseline: live SVGPoint write
  var oBase=makePoly(N);
  var PL_base=oBase.poly.points;
  var P_base=PL_base.getItem(0);
  var tBase=timeWrite(function(i){P_base.x=i;P_base.y=i*2;},'  BASELINE live SVGPoint.x write',ITER);
  L('ADR102: baseline='+tBase.toFixed(2)+'ms','info');
  oBase.svg.remove();

  // A: setAttributeNS
  var oA=makePoly(N);
  var PL_A=oA.poly.points;
  var P_A=PL_A.getItem(0);
  oA.poly.setAttributeNS(null,'points','0,0');
  var tA=timeWrite(function(i){P_A.x=i;P_A.y=i;},'  A: setAttributeNS stale SVGPoint',ITER);
  L('ADR102 A: '+tA.toFixed(2)+'ms'+(tA>0.5?' ★ALIVE':''),'info');
  oA.svg.remove();

  // B: poly.remove()
  var oB=makePoly(N);
  var PL_B=oB.poly.points;
  var P_B=PL_B.getItem(0);
  oB.poly.remove();
  var tB=timeWrite(function(i){P_B.x=i;P_B.y=i;},'  B: poly.remove() stale SVGPoint',ITER);
  L('ADR102 B: '+tB.toFixed(2)+'ms'+(tB>0.5?' ★ALIVE':''),'info');
  oB.svg.remove();

  // C: svg.remove()
  var oC=makePoly(N);
  var PL_C=oC.poly.points;
  var P_C=PL_C.getItem(0);
  oC.svg.remove();
  var tC=timeWrite(function(i){P_C.x=i;P_C.y=i;},'  C: svg.remove() stale SVGPoint',ITER);
  L('ADR102 C: '+tC.toFixed(2)+'ms'+(tC>0.5?' ★ALIVE':''),'info');

  // D: removeItem(0) — THE KEY TEST
  var oD=makePoly(N);
  var PL_D=oD.poly.points;
  var P_D=PL_D.getItem(0);
  var P_D1=PL_D.getItem(1);// grab item[1] too (will become item[0] after remove)
  var pre_D=[P_D.x,P_D.y];
  var pre_D1=[P_D1.x,P_D1.y];
  L('ADR102: P_D[0]=('+pre_D+') P_D1[1]=('+pre_D1+')','info');
  PL_D.removeItem(0);
  L('ADR102: after removeItem(0): listLength='+PL_D.numberOfItems,'info');
  var tD_x=timeWrite(function(i){P_D.x=i*0.5+100;},'  D: removeItem(0) stale SVGPoint.x',ITER);
  var tD_y=timeWrite(function(i){P_D.y=i*0.5+200;},'  D: removeItem(0) stale SVGPoint.y',ITER);
  L('ADR102 D: x='+tD_x.toFixed(2)+'ms y='+tD_y.toFixed(2)+'ms'+(tD_x>0.5||tD_y>0.5?' ★★★ALIVE':''),'info');
  if(tD_x>0.5||tD_y>0.5){
    L('★★★ ADR102: SVGPointList removeItem SURVIVED! Notification fires!','hit');
    // Check corruption
    var newPt0=PL_D.getItem(0);
    L('  post-stale-write item[0]: x='+newPt0.x+' y='+newPt0.y+' (expected '+pre_D1+')','info');
    if(Math.abs(newPt0.x-pre_D1[0])>1||Math.abs(newPt0.y-pre_D1[1])>1){
      L('★★★ ADR102: CORRUPTION! item[0] changed from '+pre_D1+' to ('+newPt0.x+','+newPt0.y+')','hit');
    }
  }
  // Check items for stale write effects
  var pts_after=[];
  for(var i=0;i<PL_D.numberOfItems;i++) pts_after.push('('+PL_D.getItem(i).x+','+PL_D.getItem(i).y+')');
  L('ADR102: points after stale write: '+pts_after.slice(0,5).join(' '),'info');
  L('ADR102: getAttribute: '+oD.poly.getAttribute('points').substring(0,60),'info');
  oD.svg.remove();

  // E: clear()
  var oE=makePoly(N);
  var PL_E=oE.poly.points;
  var P_E=PL_E.getItem(0);
  PL_E.clear();
  var tE=timeWrite(function(i){P_E.x=i;P_E.y=i;},'  E: clear() stale SVGPoint',ITER);
  L('ADR102 E: '+tE.toFixed(2)+'ms'+(tE>0.5?' ★ALIVE':''),'info');
  oE.svg.remove();

  // F: replaceItem
  var oF=makePoly(N);
  var PL_F=oF.poly.points;
  var P_F_old=PL_F.getItem(0);
  var newPt=oF.svg.createSVGPoint();newPt.x=999;newPt.y=888;
  PL_F.replaceItem(newPt,0);
  var tF=timeWrite(function(i){P_F_old.x=i;P_F_old.y=i;},'  F: replaceItem stale SVGPoint',ITER);
  L('ADR102 F: '+tF.toFixed(2)+'ms'+(tF>0.5?' ★ALIVE':''),'info');
  oF.svg.remove();

  L('ADR102: summary: base='+tBase.toFixed(2)+' A='+tA.toFixed(2)+' B='+tB.toFixed(2)+' C='+tC.toFixed(2)+' D=('+tD_x.toFixed(2)+','+tD_y.toFixed(2)+') E='+tE.toFixed(2)+' F='+tF.toFixed(2),'info');
};

// ═══════════════════════════════════════════════════════════════
// ADR103 — SVGLengthList stale SVGLength TearOff probe
//
// SVGLengthList is used for x, y, dx, dy attributes of <text> elements.
// SVGLength has: value, valueInSpecifiedUnits, unitType, valueAsString.
// SVGLength with unitType=SVG_LENGTHTYPE_NUMBER is a plain float.
//
// SVGLengthList is yet another different C++ template instantiation.
// Does removeItem null context or survive?
//
// Also: SVGLength has more interface surface (unit conversion).
// A stale SVGLength TearOff with live context could expose unit conversion bugs.
// ═══════════════════════════════════════════════════════════════
suites['ADR103']=function(){
  L('ADR103: SVGLengthList stale SVGLength TearOff — removeItem probe','info');
  var N=10;
  var ITER=500;

  function makeText(n){
    var svg=document.createElementNS(SVG_NS,'svg');document.body.appendChild(svg);
    var text=document.createElementNS(SVG_NS,'text');
    var xVals=[];
    for(var i=0;i<n;i++) xVals.push((i*20));
    text.setAttribute('x',xVals.join(' '));
    text.setAttribute('y','100');
    text.textContent='abcdefghij'.substring(0,n);
    svg.appendChild(text);
    return{svg:svg,text:text};
  }

  // Baseline: live SVGLength write
  var oBase=makeText(N);
  var LL_base=oBase.text.x.baseVal;
  var L_base=LL_base.getItem(0);
  var tBase=timeWrite(function(i){L_base.value=i*2;},'  BASELINE live SVGLength.value write',ITER);
  L('ADR103: baseline='+tBase.toFixed(2)+'ms','info');
  oBase.svg.remove();

  // A: setAttributeNS
  var oA=makeText(N);
  var LL_A=oA.text.x.baseVal;
  var L_A=LL_A.getItem(0);
  oA.text.setAttributeNS(null,'x','0');
  var tA=timeWrite(function(i){L_A.value=i*2;},'  A: setAttributeNS stale SVGLength',ITER);
  L('ADR103 A: '+tA.toFixed(2)+'ms'+(tA>0.5?' ★ALIVE':''),'info');
  oA.svg.remove();

  // B: text.remove()
  var oB=makeText(N);
  var LL_B=oB.text.x.baseVal;
  var L_B=LL_B.getItem(0);
  oB.text.remove();
  var tB=timeWrite(function(i){L_B.value=i*2;},'  B: text.remove() stale SVGLength',ITER);
  L('ADR103 B: '+tB.toFixed(2)+'ms'+(tB>0.5?' ★ALIVE':''),'info');
  oB.svg.remove();

  // C: removeItem(0) — THE KEY TEST
  var oC=makeText(N);
  var LL_C=oC.text.x.baseVal;
  var L_C=LL_C.getItem(0);
  var L_C1=LL_C.getItem(1);
  var pre_C=L_C.value;
  var pre_C1=L_C1.value;
  L('ADR103: L_C[0]='+pre_C+' L_C1[1]='+pre_C1,'info');
  LL_C.removeItem(0);
  L('ADR103: after removeItem(0): listLength='+LL_C.numberOfItems,'info');
  var tC=timeWrite(function(i){L_C.value=i*1.5+500;},'  C: removeItem(0) stale SVGLength.value',ITER);
  L('ADR103 C: '+tC.toFixed(2)+'ms'+(tC>0.5?' ★★★ALIVE':''),'info');
  if(tC>0.5){
    L('★★★ ADR103: SVGLengthList removeItem SURVIVED! Notification fires!','hit');
    var newL0=LL_C.getItem(0);
    L('  post-stale-write item[0]: value='+newL0.value+' (was item[1]='+pre_C1+')','info');
    if(Math.abs(newL0.value-pre_C1)>1){
      L('★★★ ADR103: CORRUPTION! item[0] changed!','hit');
    }
  }
  L('ADR103: getAttribute x after stale: '+oC.text.getAttribute('x'),'info');
  oC.svg.remove();

  // D: clear()
  var oD=makeText(N);
  var LL_D=oD.text.x.baseVal;
  var L_D=LL_D.getItem(0);
  LL_D.clear();
  var tD=timeWrite(function(i){L_D.value=i*2;},'  D: clear() stale SVGLength',ITER);
  L('ADR103 D: '+tD.toFixed(2)+'ms'+(tD>0.5?' ★ALIVE':''),'info');
  oD.svg.remove();

  L('ADR103: summary: base='+tBase.toFixed(2)+' A='+tA.toFixed(2)+' B='+tB.toFixed(2)+' C='+tC.toFixed(2)+' D='+tD.toFixed(2),'info');
};

// ═══════════════════════════════════════════════════════════════
// ADR104 — SVGTransformList + SMIL additive animation + removeItem
//
// SMIL transform animation with addTo type="translate" accumulates.
// With additive="sum" the SMIL animated transform is ADDED to the baseVal.
// This is different from feColorMatrix's simple lerp.
//
// Race: removeItem from baseVal during additive SMIL animation.
// Does SMIL's additive engine try to access the removed baseVal item?
// Can we get animVal to show OOB values?
//
// Also test: type="rotate" animation — has cx, cy parameters.
// The rotation TearOff has extra data (angle, cx, cy).
// ═══════════════════════════════════════════════════════════════
suites['ADR104']=function(){
  L('ADR104: SVGTransformList SMIL additive animation + removeItem race','info');
  var svg=document.createElementNS(SVG_NS,'svg');document.body.appendChild(svg);
  var g=document.createElementNS(SVG_NS,'g');
  // Set up 3 translate transforms on the group
  g.setAttribute('transform','translate(100,0) translate(200,0) translate(300,0)');
  svg.appendChild(g);
  // Add SMIL animation: additive translate
  var anim=document.createElementNS(SVG_NS,'animateTransform');
  anim.setAttribute('attributeName','transform');
  anim.setAttribute('type','translate');
  anim.setAttribute('from','0,0');
  anim.setAttribute('to','1000,0');
  anim.setAttribute('dur','5s');
  anim.setAttribute('repeatCount','indefinite');
  anim.setAttribute('additive','sum');
  g.appendChild(anim);

  var frameCount=0;
  var oobFound=[];
  function frame(){
    var bvN=g.transform.baseVal.numberOfItems;
    var avN=g.transform.animVal.numberOfItems;
    // Check ALL animVal items for OOB
    for(var i=0;i<Math.max(avN,4);i++){
      try{
        var t=g.transform.animVal.getItem(i);
        var tx=t.matrix.e;
        var ty=t.matrix.f;
        if(Math.abs(tx)>5000||Math.abs(ty)>5000){
          oobFound.push({f:frameCount,i:i,tx:tx,ty:ty});
          L('★★★ ADR104: animVal['+i+'] tx='+tx+' ty='+ty+' OOB!','hit');
        }
      }catch(e){
        if(i<avN) L('ADR104: animVal['+i+'] unexpected throw: '+e.message,'miss');
      }
    }
    if(frameCount===2){
      L('ADR104: frame 2 → removeItem(0) during additive SMIL','warn');
      try{g.transform.baseVal.removeItem(0);}catch(e){L('removeItem err: '+e,'miss');}
      L('ADR104: bvN='+g.transform.baseVal.numberOfItems+' avN='+g.transform.animVal.numberOfItems,'info');
    }
    if(frameCount<=4){
      var av0=null;
      try{av0=g.transform.animVal.getItem(0);}catch(e){av0=null;}
      L('ADR104 f'+frameCount+': bv='+bvN+' av='+avN+' av[0].tx='+(av0?av0.matrix.e.toFixed(2):'ERR'),'info');
    }
    frameCount++;
    if(frameCount<10)requestAnimationFrame(frame);
    else{
      L('ADR104: done. OOB events: '+oobFound.length,'info');
      svg.remove();
    }
  }
  requestAnimationFrame(frame);
};

// ═══════════════════════════════════════════════════════════════
// ADR105 — SVGPathElement intrinsic length API with pathLength
//
// SVGPathElement has:
// - getTotalLength() → computed path length
// - getPointAtLength(len) → SVGPoint at that length along path
// - pathLength attribute → overrides computed length for getPointAtLength
//
// The pathLength attribute scales the input to getPointAtLength.
// If pathLength is set incorrectly, getPointAtLength might:
// - Divide by zero
// - Return extreme values
// - Access freed path segment data
//
// Additionally: SVGPathElement.pathSegList was removed from modern WebKit.
// But getTotalLength/getPointAtLength still work.
//
// Test:
// 1. Create path with known geometry
// 2. Set pathLength to extreme values (0, negative, very large)
// 3. Call getPointAtLength with various inputs
// 4. Does WebKit crash/corrupt anything?
//
// Also: SVGGeometryElement.isPointInFill(SVGPoint) — might process
// the point against the path geometry with unusual coordinate values.
// ═══════════════════════════════════════════════════════════════
suites['ADR105']=function(){
  L('ADR105: SVGPathElement getTotalLength/getPointAtLength + extreme pathLength','info');
  var svg=document.createElementNS(SVG_NS,'svg');svg.setAttribute('width','100');svg.setAttribute('height','100');document.body.appendChild(svg);
  var path=document.createElementNS(SVG_NS,'path');
  path.setAttribute('d','M 0 0 L 100 0 L 100 100 L 0 100 Z');
  svg.appendChild(path);
  var totalLen=path.getTotalLength();
  L('ADR105: normal path. getTotalLength()='+totalLen,'info');
  var pt=path.getPointAtLength(50);
  L('ADR105: getPointAtLength(50)=('+pt.x.toFixed(2)+','+pt.y.toFixed(2)+')','info');

  // Set pathLength=0 (division by zero in the scaling?)
  path.setAttribute('pathLength','0');
  try{
    var len0=path.getTotalLength();
    L('ADR105: pathLength=0, getTotalLength()='+len0,'info');
    var pt0=path.getPointAtLength(50);
    L('ADR105: pathLength=0, getPointAtLength(50)=('+pt0.x.toFixed(2)+','+pt0.y.toFixed(2)+')','info');
    if(isNaN(pt0.x)||isNaN(pt0.y)||Math.abs(pt0.x)>1e6||Math.abs(pt0.y)>1e6){
      L('★★★ ADR105: pathLength=0 caused OOB/NaN in getPointAtLength!','hit');
    }
  }catch(e){L('ADR105: pathLength=0 threw: '+e.message,'warn');}

  // Set pathLength to very large
  path.setAttribute('pathLength','1e38');
  try{
    var ptLarge=path.getPointAtLength(50);
    L('ADR105: pathLength=1e38, getPointAtLength(50)=('+ptLarge.x.toFixed(4)+','+ptLarge.y.toFixed(4)+')','info');
  }catch(e){L('ADR105: pathLength=1e38 threw: '+e.message,'warn');}

  // Set pathLength to negative
  path.setAttribute('pathLength','-1');
  try{
    var ptNeg=path.getPointAtLength(50);
    L('ADR105: pathLength=-1, getPointAtLength(50)=('+ptNeg.x.toFixed(4)+','+ptNeg.y.toFixed(4)+')','info');
  }catch(e){L('ADR105: pathLength=-1 threw: '+e.message,'warn');}

  // Extreme getPointAtLength argument
  path.removeAttribute('pathLength');
  try{
    var ptBig=path.getPointAtLength(1e38);
    L('ADR105: getPointAtLength(1e38)=('+ptBig.x.toFixed(4)+','+ptBig.y.toFixed(4)+')','info');
  }catch(e){L('ADR105: getPointAtLength(1e38) threw: '+e.message,'warn');}

  // NaN
  try{
    var ptNaN=path.getPointAtLength(NaN);
    L('ADR105: getPointAtLength(NaN)=('+ptNaN.x+','+ptNaN.y+')','info');
  }catch(e){L('ADR105: getPointAtLength(NaN) threw: '+e.message,'warn');}

  svg.remove();
  L('ADR105: no crashes. path geometry API is range-checked.','info');
};

// ═══════════════════════════════════════════════════════════════
// ADR106 — Web Animations API: getAnimations() + cancel() TearOff lifetime
//
// Web Animations API (WAAPI) is separate from SMIL.
// element.animate() creates a CSS/JS animation.
// element.getAnimations() returns live Animation objects.
//
// Can we get a TearOff/reference to an animation's internal state
// that outlives the animation?
//
// Test:
// 1. element.animate({transform:...}) → create animation
// 2. Grab reference to animation object and its keyframe values
// 3. animation.cancel() → frees animation internals
// 4. Access animation properties after cancel
//
// Also: SVGElement.style vs SVGElement.attributeStyleMap — CSSOM bridge.
// ═══════════════════════════════════════════════════════════════
suites['ADR106']=function(){
  L('ADR106: Web Animations API — animation.cancel() then access','info');
  var svg=document.createElementNS(SVG_NS,'svg');document.body.appendChild(svg);
  var rect=document.createElementNS(SVG_NS,'rect');
  rect.setAttribute('width','10');rect.setAttribute('height','10');svg.appendChild(rect);

  // Create animation via WAAPI
  var anim;
  try{
    anim=rect.animate([
      {transform:'translateX(0px)'},
      {transform:'translateX(100px)'}
    ],{duration:1000,iterations:Infinity});
    L('ADR106: animation created. playState='+anim.playState,'info');
    L('ADR106: currentTime='+anim.currentTime,'info');
  }catch(e){L('ADR106: animate() threw: '+e.message,'miss');svg.remove();return;}

  // Grab reference to effect and its timing
  var effect=anim.effect;
  L('ADR106: effect='+effect,'info');
  if(effect){
    try{
      var timing=effect.getTiming();
      L('ADR106: timing.duration='+timing.duration+' timing.iterations='+timing.iterations,'info');
      // Cancel animation
      anim.cancel();
      L('ADR106: animation.cancel() called.','info');
      // Access effect after cancel
      var timing2=effect.getTiming();
      L('ADR106: timing2.duration='+timing2.duration+' (after cancel)','info');
      // Does the effect still report valid values?
      if(isNaN(timing2.duration)||timing2.duration<0){
        L('★★★ ADR106: effect.getTiming() OOB after cancel!','hit');
      }
    }catch(e){L('ADR106: effect.getTiming after cancel threw: '+e.message,'warn');}
  }

  // Try reading computed style-based value during animation vs after cancel
  try{
    anim=rect.animate([
      {opacity:0},{opacity:1}
    ],{duration:1000,iterations:Infinity,fill:'forwards'});
    var compStyle=window.getComputedStyle(rect);
    var opBefore=compStyle.opacity;
    L('ADR106: opacity during anim='+opBefore,'info');
    anim.cancel();
    var opAfter=compStyle.getPropertyValue('opacity');
    L('ADR106: opacity after cancel='+opAfter,'info');
  }catch(e){L('ADR106: opacity test threw: '+e.message,'warn');}

  svg.remove();
  L('ADR106: WAAPI lifecycle behaves normally.','info');
};
