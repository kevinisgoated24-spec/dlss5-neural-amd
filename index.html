var SVG_NS='http://www.w3.org/2000/svg';
function L(s,cls){var d=document.getElementById('out');var p=document.createElement('pre');if(cls)p.className=cls;p.textContent=s;d.appendChild(p);d.scrollTop=d.scrollHeight;}

}
function fb(text,toast){var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;top:-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast.style.opacity='1';setTimeout(function(){toast.style.opacity='0';},1500);}catch(e){}document.body.removeChild(ta);}

// ═══════════════════════════════════════════════════════════════
// ADR141 — TOCTOU: extreme TearOff write + forced layout (tight loop)
//
// The exploit hypothesis:
// WebKit's layout pipeline reads SVG geometry attributes at layout time.
// If we can write an extreme value via TearOff BETWEEN two layout reads,
// the first read sees valid data and the second sees garbage.
//
// More concretely:
// - WebKit stores SVGLength value as a double in the C++ SVGLength object
// - When computing layout, it converts to LayoutUnit (fixed point, max ~33M)
// - If the raw double is read BEFORE clamping: potential overflow/UB
//
// Test: write extreme x/width values via TearOff in a tight loop
// while forcing layout recalc each iteration. Look for:
// 1. getBoundingClientRect returning anomalous values
// 2. getScreenCTM returning NaN or Infinity
// 3. The tab crashing (TOCTOU crash)
// 4. DOM attribute diverging from computed layout value
//
// Also: the ADR139 finding that getAttribute stores raw value but
// getBBox clamps — what happens if we write a value just ABOVE the
// clamp point? The attribute says X but layout computes Y.
// If code downstream reads the attribute string and parses it back
// as a number (instead of reading the LayoutUnit), it gets X.
// ═══════════════════════════════════════════════════════════════
suites['ADR141']=function(){
  L('ADR141: TOCTOU extreme write + layout force tight loop','info');
  var container=document.createElement('div');
  container.style.cssText='width:400px;height:400px;position:relative';
  document.body.appendChild(container);

  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('width','400');svg.setAttribute('height','400');
  svg.setAttribute('viewBox','0 0 1000 1000');
  container.appendChild(svg);

  var rect=document.createElementNS(SVG_NS,'rect');
  rect.setAttribute('x','0');rect.setAttribute('y','0');
  rect.setAttribute('width','100');rect.setAttribute('height','100');
  svg.appendChild(rect);

  var RX=rect.x.baseVal;
  var RW=rect.width.baseVal;

  // Test 1: extreme write + getBoundingClientRect in tight loop
  var anomalies=[];
  for(var i=0;i<200;i++){
    // Alternate between huge and normal values
    if(i%2===0){
      RX.value=1e10;
      RW.value=1e10;
    }else{
      RX.value=0;
      RW.value=100;
    }
    var bb=rect.getBoundingClientRect();
    if(!isFinite(bb.x)||isNaN(bb.x)||Math.abs(bb.x)>1e6){
      anomalies.push({i:i,x:bb.x,w:bb.width,attrX:rect.getAttribute('x')});
    }
  }
  L('ADR141[T1]: 200 tight-loop iterations complete. anomalies='+anomalies.length,'info');
  if(anomalies.length>0){
    L('★★★ ADR141[T1]: ANOMALOUS getBoundingClientRect values!','hit');
    for(var j=0;j<Math.min(3,anomalies.length);j++){
      L('ADR141[T1]['+anomalies[j].i+']: x='+anomalies[j].x+' w='+anomalies[j].w+' attr='+anomalies[j].attrX,'warn');
    }
  }

  // Test 2: getScreenCTM in tight loop while writing extreme viewBox
  var VB=svg.viewBox.baseVal;
  var ctmAnomalies=[];
  for(var i=0;i<200;i++){
    if(i%2===0){VB.width=1e-5;VB.height=1e-5;}// tiny → huge scale
    else{VB.width=1000;VB.height=1000;}// normal
    var ctm=rect.getScreenCTM();
    if(!isFinite(ctm.a)||isNaN(ctm.a)||Math.abs(ctm.a)>1e8){
      ctmAnomalies.push({i:i,a:ctm.a,e:ctm.e});
    }
  }
  L('ADR141[T2]: 200 viewBox tight-loop. CTM anomalies='+ctmAnomalies.length,'info');
  if(ctmAnomalies.length>0){
    L('★★★ ADR141[T2]: ANOMALOUS getScreenCTM during tight loop!','hit');
    for(var j=0;j<Math.min(3,ctmAnomalies.length);j++){
      L('ADR141[T2]['+ctmAnomalies[j].i+']: CTM.a='+ctmAnomalies[j].a+' e='+ctmAnomalies[j].e,'warn');
    }
  }

  // Test 3: attribute divergence — write just above clamp
  // Clamp point ≈ 32975842. Write 32975843.
  var JUST_ABOVE_CLAMP=32975843;
  RX.value=JUST_ABOVE_CLAMP;
  var attrVal=parseInt(rect.getAttribute('x'));
  var bbX=rect.getBoundingClientRect().x;
  var bboxX=rect.getBBox().x;
  L('ADR141[T3]: wrote x='+JUST_ABOVE_CLAMP+' (just above clamp)','info');
  L('ADR141[T3]: getAttribute(x)='+attrVal,'info');
  L('ADR141[T3]: getBoundingClientRect().x='+bbX.toFixed(2),'info');
  L('ADR141[T3]: getBBox().x='+bboxX,'info');
  L('ADR141[T3]: getScreenCTM().e='+rect.getScreenCTM().e.toFixed(2),'info');
  if(attrVal!==bboxX){
    L('★★★ ADR141[T3]: DIVERGENCE! getAttribute='+attrVal+' getBBox='+bboxX,'hit');
  }

  // Test 4: write 1e15 (float max that WebKit accepts per ADR123)
  VB.width=1000;VB.height=1000;// reset viewBox
  RX.value=1e15;RW.value=1e15;
  L('ADR141[T4]: wrote x=1e15 w=1e15 via TearOff','info');
  L('ADR141[T4]: getAttribute(x)='+rect.getAttribute('x'),'info');
  L('ADR141[T4]: getAttribute(width)='+rect.getAttribute('width'),'info');
  try{
    var bb4=rect.getBBox();
    L('ADR141[T4]: getBBox: x='+bb4.x+' w='+bb4.width,'info');
    var bb4r=rect.getBoundingClientRect();
    L('ADR141[T4]: getBCR: x='+bb4r.x+' w='+bb4r.width,'info');
    var ctm4=rect.getScreenCTM();
    L('ADR141[T4]: CTM: a='+ctm4.a+' e='+ctm4.e,'info');
  }catch(e){L('ADR141[T4]: threw: '+e.message,'warn');}

  container.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR142 — CSS calc(attr(width)*1px) injection via TearOff
//
// CSS `attr()` function reads HTML attributes as CSS values.
// Standard syntax: `width: attr(data-w px)` — reads data-w as px length.
// For SVG elements: the 'width' attribute is a presentation attribute.
//
// If WebKit resolves `attr(width)` by reading the DOM attribute string
// (which TearOff updates), then a TearOff write of width=1e10 would
// cause CSS to try to lay out an element at 1e10px width.
//
// LayoutUnit::max() ≈ 33M. A CSS width of 1e10px would overflow
// LayoutUnit. WebKit should clamp, but does it?
//
// Also: CSS `width: attr(width px)` on a foreignObject inside SVG —
// the foreignObject has a CSS layout context (HTML box model inside SVG).
// If foreignObject's width CSS comes from attr(width), and we write
// a huge value via TearOff, does the HTML layout inside it crash?
//
// Note: `attr()` in CSS is limited in support. Alternative:
// CSS custom properties via setAttribute vs the calc path.
// ═══════════════════════════════════════════════════════════════
suites['ADR142']=function(){
  L('ADR142: CSS attr() + foreignObject layout overflow via TearOff','info');

  // Test 1: basic CSS attr() on SVG element
  var style=document.createElement('style');
  style.textContent=
    '.test-attr-width { width: attr(data-w px, 100px); height: 50px; background: blue }'+
    'foreignObject.fo-test { overflow: visible }';
  document.head.appendChild(style);

  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('width','400');svg.setAttribute('height','400');
  svg.setAttribute('viewBox','0 0 400 400');
  document.body.appendChild(svg);

  // foreignObject with HTML layout inside SVG
  var fo=document.createElementNS(SVG_NS,'foreignObject');
  fo.setAttribute('x','0');fo.setAttribute('y','0');
  fo.setAttribute('width','200');fo.setAttribute('height','200');
  fo.classList.add('fo-test');
  svg.appendChild(fo);

  var div=document.createElement('div');
  div.style.cssText='width:100%;height:100%;background:rgba(0,255,0,0.3);overflow:hidden';
  fo.appendChild(div);

  // Baseline
  var foW0=fo.getBoundingClientRect().width;
  var divW0=div.getBoundingClientRect().width;
  L('ADR142: baseline foW='+foW0.toFixed(1)+' divW='+divW0.toFixed(1),'info');

  // Write extreme width via TearOff
  var FOW=fo.width.baseVal;
  FOW.value=1e10;
  L('ADR142: wrote fo.width=1e10 via TearOff','info');
  L('ADR142: getAttribute(width)='+fo.getAttribute('width'),'info');

  // Force layout and check
  try{
    var foW1=fo.getBoundingClientRect().width;
    var divW1=div.getBoundingClientRect().width;
    L('ADR142: after TearOff: foW='+foW1+' divW='+divW1,'info');
    if(!isFinite(foW1)||isNaN(foW1)||Math.abs(foW1)>1e7){
      L('★★★ ADR142: EXTREME foreignObject width after TearOff!','hit');
    }
    if(!isFinite(divW1)||isNaN(divW1)||Math.abs(divW1)>1e7){
      L('★★★ ADR142: EXTREME div width after TearOff (HTML layout inside SVG)!','hit');
    }
    // Check if div overflowed beyond fo
    if(divW1>foW0*2){L('★★★ ADR142: div WIDTH exceeds expected fo bounds!','hit');}
  }catch(e){L('ADR142: getBCR threw: '+e.message,'warn');}

  // Test 2: write negative width to foreignObject
  FOW.value=-1;
  L('ADR142: wrote fo.width=-1 via TearOff','info');
  try{
    var foW2=fo.getBoundingClientRect().width;
    var divW2=div.getBoundingClientRect().width;
    L('ADR142: negative: foW='+foW2+' divW='+divW2,'info');
  }catch(e){L('ADR142: negative getBCR threw: '+e.message,'warn');}

  // Test 3: write 0 to foreignObject
  FOW.value=0;
  L('ADR142: wrote fo.width=0 via TearOff','info');
  try{
    var foW3=fo.getBoundingClientRect().width;
    var divW3=div.getBoundingClientRect().width;
    L('ADR142: zero: foW='+foW3+' divW='+divW3,'info');
  }catch(e){L('ADR142: zero getBCR threw: '+e.message,'warn');}

  // Test 4: write huge X to foreignObject (does HTML inside offset?)
  FOW.value=200;
  var FOX=fo.x.baseVal;
  FOX.value=1e10;
  L('ADR142: wrote fo.x=1e10 via TearOff','info');
  try{
    var foX4=fo.getBoundingClientRect().x;
    var divX4=div.getBoundingClientRect().x;
    L('ADR142: huge x: fo.x='+foX4+' div.x='+divX4,'info');
    if(!isFinite(foX4)||isNaN(foX4)){L('★★★ ADR142: EXTREME fo.x after TearOff!','hit');}
    if(!isFinite(divX4)||isNaN(divX4)){L('★★★ ADR142: EXTREME div.x (HTML inside SVG) after TearOff!','hit');}
    if(Math.abs(foX4-divX4)>10){
      L('★★★ ADR142: fo.x ('+foX4+') diverges from div.x ('+divX4+') — coordinate mismatch!','hit');
    }
  }catch(e){L('ADR142: huge x getBCR threw: '+e.message,'warn');}

  style.remove();
  svg.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR143 — animVal vs baseVal divergence via TearOff
//
// SVGAnimatedLength has baseVal and animVal.
// In normal operation: animVal = baseVal (no animation running).
// During a SMIL animation: animVal = animated value, baseVal = authored value.
//
// From ADR126: animVal TearOff is read-only (throws on direct write).
// But: when SMIL animation is running, animVal is set by the SMIL engine.
// The SMIL engine writes directly to the C++ SVGAnimatedLength.
//
// Q: If we write to baseVal via TearOff while a SMIL animation is
// running on that attribute, what happens to animVal?
// - Does the animation "win" and reset baseVal on next frame?
// - Does our TearOff write to baseVal corrupt the animation?
// - Is there a window where animVal and baseVal diverge with our value in animVal?
//
// Also: SVGAnimatedLength.baseVal.value vs SVGAnimatedLength.animVal.value
// right after a TearOff write — do they immediately diverge?
//
// The critical test: if baseVal TearOff write is NOT reflected in animVal,
// then the rendering engine uses baseVal (no animation) but our write is
// only in baseVal. If the rendering uses animVal when an animation exists
// and baseVal otherwise, we need to know which path.
// ═══════════════════════════════════════════════════════════════
suites['ADR143']=function(){
  L('ADR143: animVal vs baseVal divergence — TearOff write during animation','info');
  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('width','400');svg.setAttribute('height','400');
  svg.setAttribute('viewBox','0 0 1000 1000');
  document.body.appendChild(svg);

  // Test 1: no animation — check baseVal vs animVal sync
  var rect=document.createElementNS(SVG_NS,'rect');
  rect.setAttribute('x','0');rect.setAttribute('y','0');
  rect.setAttribute('width','100');rect.setAttribute('height','100');
  svg.appendChild(rect);

  var RW=rect.width;// SVGAnimatedLength (not .baseVal)
  L('ADR143[T1]: no anim: baseVal='+RW.baseVal.value+' animVal='+RW.animVal.value,'info');
  L('ADR143[T1]: are same object? '+(RW.baseVal===RW.animVal),'info');

  // Write via baseVal TearOff
  RW.baseVal.value=555;
  L('ADR143[T1]: after TearOff write(555): baseVal='+RW.baseVal.value+' animVal='+RW.animVal.value,'info');
  if(RW.baseVal.value!==RW.animVal.value){
    L('★★★ ADR143[T1]: baseVal/animVal DIVERGED without animation!','hit');
  }

  // Test 2: SMIL animate on width, then TearOff write to baseVal
  var animate=document.createElementNS(SVG_NS,'animate');
  animate.setAttribute('attributeName','width');
  animate.setAttribute('from','100');
  animate.setAttribute('to','900');
  animate.setAttribute('dur','10s');
  animate.setAttribute('begin','0s');
  animate.setAttribute('fill','freeze');
  rect.appendChild(animate);

  L('ADR143[T2]: SMIL animate added (100→900, 10s)','info');

  // Sample animVal right after animation starts
  setTimeout(function(){
    var bv=rect.width.baseVal.value;
    var av=rect.width.animVal.value;
    L('ADR143[T2]: after 50ms: baseVal='+bv.toFixed(1)+' animVal='+av.toFixed(1),'info');
    if(bv!==av){L('★★★ ADR143[T2]: animVal differs from baseVal during SMIL!','hit');}

    // Write to baseVal via TearOff during animation
    rect.width.baseVal.value=99999;
    var bv2=rect.width.baseVal.value;
    var av2=rect.width.animVal.value;
    L('ADR143[T2]: after TearOff write(99999) during anim: baseVal='+bv2+' animVal='+av2.toFixed(1),'info');
    if(bv2!==av2){
      L('★★★ ADR143[T2]: DIVERGENCE! TearOff write to baseVal didnt affect animVal!','hit');
      L('★★★ ADR143[T2]: animVal='+av2.toFixed(1)+' rendering uses animVal → our write invisible to renderer','hit');
    }else{
      L('ADR143[T2]: TearOff write overwrote animation value (animVal='+av2.toFixed(1)+')','info');
    }

    // Check what the renderer sees
    var attr2=rect.getAttribute('width');
    L('ADR143[T2]: getAttribute(width) after TearOff='+attr2,'info');
  },50);

  // Test 3: SMIL on viewBox, TearOff on viewBox
  var svg2=document.createElementNS(SVG_NS,'svg');
  svg2.setAttribute('width','200');svg2.setAttribute('height','200');
  svg2.setAttribute('viewBox','0 0 1000 1000');
  document.body.appendChild(svg2);

  var animVB=document.createElementNS(SVG_NS,'animate');
  animVB.setAttribute('attributeName','viewBox');
  animVB.setAttribute('from','0 0 1000 1000');
  animVB.setAttribute('to','0 0 100 100');
  animVB.setAttribute('dur','5s');
  animVB.setAttribute('begin','0s');
  svg2.appendChild(animVB);

  setTimeout(function(){
    var vb0=svg2.getAttribute('viewBox');
    L('ADR143[T3]: viewBox during SMIL: '+vb0,'info');
    // Write via TearOff
    svg2.viewBox.baseVal.width=55555;
    svg2.viewBox.baseVal.height=55555;
    var vb1=svg2.getAttribute('viewBox');
    L('ADR143[T3]: after TearOff write(55555): getAttribute='+vb1,'info');
    svg2.remove();
  },100);
};

// ═══════════════════════════════════════════════════════════════
// ADR144 — TearOff write → clipPath geometry corruption
//
// From ADR138: TearOff writes fire CSS style invalidation.
// CSS clip regions (clip-path) use SVG geometry.
//
// If an SVG <rect> is used as a <clipPath> source, and we write
// to that rect's width/height via TearOff, does the clip region
// update? If yes → arbitrary clip region corruption.
//
// More interesting: clip the rect ITSELF using a clipPath based on
// another shape whose TearOff we hold. Write extreme values to
// the clip shape's TearOff → does the visible area of the clipped
// element go to 0, to the full screen, or produce a crash?
//
// Also: filter with feOffset dx/dy — do SVGAnimatedLength values
// on feOffset elements have live TearOffs?
// ═══════════════════════════════════════════════════════════════
suites['ADR144']=function(){
  L('ADR144: TearOff write → clipPath geometry corruption','info');
  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('width','400');svg.setAttribute('height','400');
  svg.setAttribute('viewBox','0 0 400 400');
  document.body.appendChild(svg);

  var defs=document.createElementNS(SVG_NS,'defs');
  svg.appendChild(defs);

  // Create clipPath with a rect inside
  var clip=document.createElementNS(SVG_NS,'clipPath');
  clip.setAttribute('id','testClip');
  defs.appendChild(clip);

  var clipRect=document.createElementNS(SVG_NS,'rect');
  clipRect.setAttribute('x','50');clipRect.setAttribute('y','50');
  clipRect.setAttribute('width','100');clipRect.setAttribute('height','100');
  clip.appendChild(clipRect);

  // Create a large rect clipped by the above clipPath
  var target=document.createElementNS(SVG_NS,'rect');
  target.setAttribute('x','0');target.setAttribute('y','0');
  target.setAttribute('width','400');target.setAttribute('height','400');
  target.setAttribute('fill','#00ff88');
  target.setAttribute('clip-path','url(#testClip)');
  svg.appendChild(target);

  var CRW=clipRect.width.baseVal;
  var CRX=clipRect.x.baseVal;
  L('ADR144: initial clip rect: x='+CRX.value+' w='+CRW.value,'info');

  // Baseline getBoundingClientRect of target
  var bb0=target.getBoundingClientRect();
  L('ADR144: target BCR: x='+bb0.x.toFixed(1)+' y='+bb0.y.toFixed(1)+' w='+bb0.width.toFixed(1)+' h='+bb0.height.toFixed(1),'info');

  // Write extreme clip rect width via TearOff
  CRW.value=1e10;
  L('ADR144: wrote clipRect.width=1e10 via TearOff','info');
  L('ADR144: getAttribute(width)='+clipRect.getAttribute('width'),'info');

  var bb1=target.getBoundingClientRect();
  L('ADR144: target BCR after clip corrupt: x='+bb1.x.toFixed(1)+' y='+bb1.y.toFixed(1)+' w='+bb1.width.toFixed(1)+' h='+bb1.height.toFixed(1),'info');
  if(Math.abs(bb1.width-bb0.width)>10){
    L('★★★ ADR144: Clip region CHANGED after TearOff write to clipRect!','hit');
  }

// ═══════════════════════════════════════════════════════════════
// ADR146 — ADR134[T1] state inconsistency exploit:
//          rect removed from svg (svg in DOM) → TearOff becomes "not supported"
//
// From ADR134[T1]: when rect is removed from svg (svg stays in DOM),
// convertToSpecifiedUnits throws "not supported".
// But from ADR140: rect.width.baseVal TearOff is ALIVE after removal.
// These two things seem contradictory.
//
// Hypothesis: the TearOff is alive for VALUE WRITES but not for
// UNIT CONVERSION. The conversion throws but the value write succeeds.
// This means after the throw, the TearOff has a "broken" unit state.
//
// Attack:
// 1. rect with width="50%" (unitType=2, PERCENTAGE)
// 2. Remove rect from svg (svg in DOM)
// 3. convertToSpecifiedUnits(PX) → throws "not supported"
// 4. Now: the TearOff is in PERCENTAGE unitType still
// 5. Write a large value via TearOff: tf.value = 99999
//    - value setter when unitType=PERCENTAGE: what does this do?
//    - It should set valueInSpecifiedUnits = 99999 / refLength * 100
//    - But refLength is now 0 or invalid...
// 6. Re-attach rect to svg — what does it render?
//
// The goal: can we create a state where the TearOff holds a
// "percentage" value of 99999% but the element thinks the viewport
// width is some garbage value?
// ═══════════════════════════════════════════════════════════════
suites['ADR146']=function(){
  L('ADR146: ADR134[T1] "not supported" state — post-throw TearOff exploit','info');
  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('width','400');svg.setAttribute('height','300');
  document.body.appendChild(svg);

  var rect=document.createElementNS(SVG_NS,'rect');
  rect.setAttribute('width','50%');rect.setAttribute('height','25%');
  rect.setAttribute('x','0');rect.setAttribute('y','0');
  svg.appendChild(rect);

  var RW=rect.width.baseVal;
  L('ADR146: initial: unitType='+RW.unitType+' value='+RW.value+' vis='+RW.valueInSpecifiedUnits,'info');

  // Remove rect (svg stays in DOM) → convertToSpecifiedUnits should throw
  svg.removeChild(rect);
  L('ADR146: rect removed (svg in DOM)','info');

  // Attempt conversion — will throw
  var threw=false;
  try{RW.convertToSpecifiedUnits(5/*PX*/);} // throws "not supported"
  catch(e){threw=true;L('ADR146: convertToSpecifiedUnits threw (expected): '+e.message,'info');}

  // State AFTER the throw — what is the TearOff state?
  L('ADR146: post-throw state: unitType='+RW.unitType+' value='+RW.value+' vis='+RW.valueInSpecifiedUnits,'info');

  // Now write a value via .value setter (this goes through DIFFERENT code path than convert)
  RW.value=99999;
  L('ADR146: after .value=99999: unitType='+RW.unitType+' value='+RW.value+' vis='+RW.valueInSpecifiedUnits,'info');
  L('ADR146: getAttribute(width)='+rect.getAttribute('width'),'info');

  // Re-attach rect to svg — what renders?
  svg.appendChild(rect);
  var ctm=rect.getScreenCTM();
  L('ADR146: after re-attach: CTM.a='+ctm.a+' e='+ctm.e,'info');
  L('ADR146: re-attached getAttribute(width)='+rect.getAttribute('width'),'info');
  var bb=rect.getBBox();
  L('ADR146: getBBox: x='+bb.x+' w='+bb.width,'info');

  // Try newValueSpecifiedUnits with PERCENTAGE while detached (set vis directly)
  svg.removeChild(rect);
  RW.newValueSpecifiedUnits(2/*PERCENTAGE*/, 9999);// 9999% of 400 = 39996px
  L('ADR146: newValueSpecifiedUnits(%, 9999): unitType='+RW.unitType+' value='+RW.value+' vis='+RW.valueInSpecifiedUnits,'info');
  L('ADR146: getAttribute after % set: '+rect.getAttribute('width'),'info');

  // Re-attach again
  svg.appendChild(rect);
  var bb2=rect.getBBox();
  L('ADR146: re-attach with 9999%: getBBox.w='+bb2.width,'info');
  var ctm2=rect.getScreenCTM();
  L('ADR146: getScreenCTM: a='+ctm2.a,'info');

  svg.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR147 — TearOff write while SMIL animate targets same attr
//
// SMIL animations work by writing to the SVGAnimatedLength's
// animVal on each animation frame. At every rAF:
//   animVal = lerp(from, to, t/dur)
//
// If we ALSO write to baseVal via TearOff at the same time,
// what happens? Are there two concurrent writers to the same
// SVGAnimatedLength object?
//
// In WebKit C++, SVGAnimatedLength has:
//   - m_baseValue (SVGLength, authored value)
//   - m_currentValue (SVGLength, current animated value)
//
// baseVal TearOff writes to m_baseValue.
// SMIL engine writes to m_currentValue on each frame.
//
// If WebKit doesn't lock between these two writers, and the
// SMIL engine is mid-way through writing (e.g., it's read
// m_baseValue and is computing the lerp), and we write to
// m_baseValue via TearOff at that exact moment — that could
// be a race condition in the SMIL animation system.
//
// We can't control true threading in JS, but we can:
// 1. Set up a fast SMIL animation
// 2. Write to baseVal via TearOff on every rAF
// 3. Check for anomalous animVal values
// 4. Check for anomalous rendered CTM values
// ═══════════════════════════════════════════════════════════════
suites['ADR147']=function(){
  L('ADR147: TearOff write racing SMIL animation on same attribute','info');
  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('width','200');svg.setAttribute('height','200');
  svg.setAttribute('viewBox','0 0 1000 1000');
  document.body.appendChild(svg);

  var rect=document.createElementNS(SVG_NS,'rect');
  rect.setAttribute('x','0');rect.setAttribute('y','0');
  rect.setAttribute('width','100');rect.setAttribute('height','100');
  svg.appendChild(rect);

  // Start SMIL animation on width (100→900, fast)
  var anim=document.createElementNS(SVG_NS,'animate');
  anim.setAttribute('attributeName','width');
  anim.setAttribute('from','100');
  anim.setAttribute('to','900');
  anim.setAttribute('dur','0.5s');
  anim.setAttribute('repeatCount','indefinite');
  rect.appendChild(anim);

  var anomalies=[];
  var frameCount=0;
  var FRAMES=60;

  // Race: write to baseVal TearOff on every rAF while SMIL runs
  var RW=rect.width;
  function raceFrame(){
    frameCount++;
    // Write extreme value to baseVal during SMIL
    RW.baseVal.value=99999;
    var bv=RW.baseVal.value;
    var av=RW.animVal.value;
    var attrW=rect.getAttribute('width');
    // Check for anomalies
    if(!isFinite(av)||isNaN(av)||Math.abs(av-bv)>100&&av!==Math.round(av)){
      anomalies.push({f:frameCount,bv:bv,av:av,attr:attrW});
    }
    if(frameCount<FRAMES){requestAnimationFrame(raceFrame);}
    else{
      L('ADR147: '+FRAMES+' frames complete. anomalies='+anomalies.length,'info');
      if(anomalies.length>0){
        L('★★★ ADR147: ANOMALOUS animVal during TearOff race!','hit');
        for(var j=0;j<Math.min(3,anomalies.length);j++){
          L('ADR147['+anomalies[j].f+']: bv='+anomalies[j].bv+' av='+anomalies[j].av+' attr='+anomalies[j].attr,'warn');
        }
      }
      // Final state
      L('ADR147: final: baseVal='+RW.baseVal.value+' animVal='+RW.animVal.value.toFixed(1),'info');
      L('ADR147: getAttribute(width)='+rect.getAttribute('width'),'info');
      svg.remove();
    }
  }
  requestAnimationFrame(raceFrame);
};
