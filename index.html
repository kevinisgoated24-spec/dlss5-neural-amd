<!doctype html>
<html>
<head>
<meta charset=utf8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SVG Filter Fuzzer (Mega-Chaos + Structural Thrash)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#0c0c0c;--surf:#161616;--card:#1e1e1e;--border:#2a2a2a;--text:#e4e4e4;--muted:#888;--dim:#444;--red:#ff453a;--amber:#ff9f0a;--green:#32d74b;--red-dim:rgba(255,69,58,.12);--amber-dim:rgba(255,159,10,.1);--green-dim:rgba(50,215,75,.1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.6;padding:16px;min-height:100%}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:18px;font-weight:700;color:var(--red)}
.sub{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:4px}
.card{background:var(--surf);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.card-head{padding:10px 14px;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0}
.dot.red{background:var(--red)}.dot.amber{background:var(--amber)}.dot.green{background:var(--green);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.log{padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.9;min-height:200px;max-height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.log-line{display:flex;gap:8px}
.log-line .p{color:var(--dim);flex-shrink:0}
.log-line .m{word-break:break-word}
.ok .m{color:var(--green)}.err .m{color:var(--red)}.warn .m{color:var(--amber)}.dim .m{color:var(--muted)}
.btn-row{padding:12px 14px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--border)}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;padding:7px 14px;border-radius:6px;border:none;cursor:pointer;transition:opacity .15s}
.btn:active{opacity:.7}.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-red{background:var(--red);color:#fff}
.btn-dark{background:var(--card);border:1px solid var(--border);color:var(--text)}
.status{padding:10px 14px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;display:flex;align-items:center;gap:8px}
.status.idle{background:var(--amber-dim);border:1px solid rgba(255,159,10,.25);color:var(--amber)}
.status.running{background:var(--green-dim);border:1px solid rgba(50,215,75,.25);color:var(--green)}
.status.crashed{background:var(--red-dim);border:1px solid rgba(255,69,58,.5);color:var(--red)}
</style>
</head>
<body>
<div class="wrap">

  <div>
    <h1>🔺 SVG Filter Fuzzer (Mega-Chaos + Structural Thrash)</h1>
    <div class="sub">Simultaneous Attribute Mutation & Node Destruction Under Load</div>
  </div>

  <div class="status idle" id="statusBar">
    <span>◆</span><span id="statusTxt">READY — COMBINED MODE</span>
  </div>

  <div class="card">
    <div class="card-head"><span class="dot green"></span>Live Log</div>
    <div class="log" id="log"></div>
    <div class="btn-row">
      <button class="btn btn-red" id="megaBtn" onclick="runMegaChaosTest()">🔥 Start Combined Mega-Chaos</button>
      <button class="btn btn-dark" onclick="clearLog()">🗑 Clear</button>
    </div>
  </div>

</div>

<div id="svgPayload" style="position:fixed;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;opacity:0.001"></div>

<script>
'use strict';

function log(msg,cls=''){
    const el=document.getElementById('log');
    const d=document.createElement('div');
    d.className='log-line '+cls;
    const ts=new Date().toTimeString().slice(0,8);
    d.innerHTML='<span class="p">'+ts+'</span><span class="m">'+msg+'</span>';
    el.appendChild(d);el.scrollTop=el.scrollHeight;
}
function clearLog(){document.getElementById('log').innerHTML=''}
function setStatus(t,k){
    document.getElementById('statusBar').className='status '+k;
    document.getElementById('statusTxt').textContent=t;
}

const payload = document.getElementById('svgPayload');

async function runMegaChaosTest(){
    const btn=document.getElementById('megaBtn');
    btn.disabled=true;
    clearLog();
    setStatus('RUNNING MEGA-CHAOS...','running');

    log('=== Initializing Combined Chaos & Structural Graph ===','ok');
    
    const count = 1024; // Balanced count to allow intense frame-by-frame JS evaluation
    let defs = '<defs id="mainDefs">';
    for(let i = 0; i < count; i++) {
        const targetRef = Math.abs((i * 37) % count);
        defs += `<filter id="mega${i}">
            <feGaussianBlur stdDeviation="${(i % 4) + 0.5}" result="blur${i}"/>
            <feComposite in="blur${i}" in2="blur${targetRef}" operator="over" result="comp${i}"/>
        </filter>`;
    }
    defs += '</defs>';

    payload.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
        ${defs}
        <rect id="targetRect" width="200" height="200" filter="url(#mega${count - 1})" fill="purple"/>
    </svg>`;

    log(`[+] Injected ${count} cross-referencing nodes. Starting dual-vector loop...`,'dim');

    let frames = 0;
    const maxFrames = 400;
    const rect = payload.querySelector('#targetRect');
    const mainDefs = payload.querySelector('#mainDefs');

    return new Promise((resolve) => {
        function megaFrame() {
            if(frames >= maxFrames) {
                payload.innerHTML = '';
                log('[*] Combined mega-chaos test completed safely without crash.','ok');
                setStatus('DONE — CHECK ANALYTICS DATA','idle');
                btn.disabled = false;
                resolve();
                return;
            }

            try {
                // Vector 1: Mutate attributes across random filter nodes
                const allFilters = mainDefs.querySelectorAll('filter');
                if (allFilters.length > 0) {
                    const randFilter = allFilters[Math.floor(Math.random() * allFilters.length)];
                    const blurChild = randFilter.querySelector('feGaussianBlur');
                    if (blurChild) {
                        blurChild.setAttribute('stdDeviation', (Math.random() * 20).toFixed(1));
                    }
                }

                // Vector 2: Structural DOM thrashing (tearing down and adding child primitives on the fly)
                const targetFilter = allFilters[frames % allFilters.length];
                if (targetFilter) {
                    if (frames % 2 === 0) {
                        const extraNode = document.createElementNS("http://www.w3.org/2000/svg", "feOffset");
                        extraNode.setAttribute("dx", (frames % 10));
                        extraNode.setAttribute("dy", (frames % 10));
                        targetFilter.appendChild(extraNode);
                    } else {
                        while (targetFilter.children.length > 2) {
                            targetFilter.removeChild(targetFilter.lastChild);
                        }
                    }
                }

                // Force layout sync mid-operation
                rect.getBoundingClientRect();

                frames++;
                requestAnimationFrame(megaFrame);
            } catch(e) {
                log(`[!] Mega-chaos exception at frame ${frames}: ${e.message}`, 'err');
                setStatus('EXCEPTION CAUGHT — CHECK ANALYTICS','crashed');
                btn.disabled = false;
                resolve();
            }
        }

        requestAnimationFrame(megaFrame);
    });
}

setStatus('READY — COMBINED MODE','idle');
log('Mega-Chaos Fuzzer loaded','ok');
</script>
</body>
</html>
