<script>
var NS='http://www.w3.org/2000/svg';
var XNS='http://www.w3.org/1999/xhtml';
var _fb=new ArrayBuffer(8);
var _dv=new Float64Array(_fb);
var _uv=new Uint32Array(_fb);

function f64hex(f){
  if(f===null||f===undefined)return'null';
  _dv[0]=f;
  return'0x'+_uv[1].toString(16).padStart(8,'0')+'_'+_uv[0].toString(16).padStart(8,'0');
}
function fromHiLo(hi,lo){_uv[1]=hi>>>0;_uv[0]=lo>>>0;return _dv[0];}

function classifyPtr(v){
  if(v===null||v===undefined||isNaN(v)||!isFinite(v))return null;
  _dv[0]=v;
  var hi=_uv[1],lo=_uv[0];
  if(hi===0x00000001&&lo>0x1000)return{type:'arm64_tagged',hi,lo};
  if(hi>=0x00000002&&hi<=0x0000ffff&&lo>0x1000)return{type:'native_heap',hi,lo};
  if(hi>=0x00010000&&hi<=0x0001ffff)return{type:'jsc_cell',hi,lo};
  if(hi>=0x00100000&&hi<=0x001fffff)return{type:'pac_ptr',hi,lo};
  if(hi>=0xffff0000)return{type:'kernel',hi,lo};
  return null;
}
function isWeird(v){
  if(!isFinite(v)||isNaN(v)||v===0||v===1||v===-1)return false;
  _dv[0]=v; var hi=_uv[1];
  // skip normal layout ranges: [-2^24, 2^24]
  if(Math.abs(v)<16777216)return false;
  // skip values that are exactly our test constants
  if(v===1000010||v===2000009||v===2000008)return false;
  return true;
}

function log(m,c){
  var d=document.getElementById('out'),e=document.createElement('div');
  e.className='result '+(c||'pink'); e.textContent=m;
  d.appendChild(e); e.scrollIntoView({block:'nearest'});
}
function R(m){log(m,'red');}
function B(m){log(m,'blue');}
function P(m){log(m,'pink');}
function hdr(m){log(m,'hdr');}
function prog(m){document.getElementById('progress').textContent=m;}
function clearOut(){document.getElementById('out').innerHTML='';prog('');}
function copyAll(){
  var lines=[];
  document.querySelectorAll('#out .result').forEach(function(e){lines.push(e.textContent);});
  navigator.clipboard&&navigator.clipboard.writeText(lines.join('\n'));
}
function go(s){clearOut();window['run'+s]();}
function runAll(){
  clearOut();
  runFA();
  setTimeout(function(){runFB();},1500);
  setTimeout(function(){runFC();},3000);
  setTimeout(function(){runFD();},4500);
  setTimeout(function(){runFE();},6000);
  setTimeout(function(){runFF();},9000);
}

function mkSVG(w,h){
  var s=document.createElementNS(NS,'svg');
  s.setAttribute('width',w||400); s.setAttribute('height',h||200);
  s.style.cssText='position:fixed;left:0;top:0;width:'+(w||400)+'px;height:'+(h||200)+'px;opacity:0.001;pointer-events:none';
  document.body.appendChild(s); return s;
}
function mkEl(p,tag,attrs){
  var ns=tag==='div'||tag==='span'?XNS:NS;
  var e=document.createElementNS(ns,tag);
  if(attrs)Object.keys(attrs).forEach(function(k){e.setAttribute(k,attrs[k]);});
  p.appendChild(e); return e;
}
function mkHTMLEl(p,tag,attrs){
  var e=document.createElementNS(XNS,tag);
  if(attrs)Object.keys(attrs).forEach(function(k){e.setAttribute(k,attrs[k]);});
  p.appendChild(e); return e;
}

function probeBCR(label,el){
  var b=el.getBoundingClientRect();
  ['x','y','width','height','right','bottom'].forEach(function(f){
    var v=b[f];
    var p=classifyPtr(v);
    var w=isWeird(v);
    if(p){R(label+' BCR.'+f+'='+f64hex(v)+' POINTER! type='+p.type);}
    else if(w){B(label+' BCR.'+f+'='+f64hex(v)+' weird='+v);}
    else{P(label+' BCR.'+f+'='+v);}
  });
}
function probeCTM(label,el){
  var c=null;
  try{c=el.getScreenCTM();}catch(e){P(label+' CTM: threw '+e.name); return;}
  if(!c){P(label+' CTM: null'); return;}
  ['a','b','c','d','e','f'].forEach(function(f){
    var v=c[f];
    var p=classifyPtr(v);
    var w=isWeird(v);
    if(p){R(label+' CTM.'+f+'='+f64hex(v)+' POINTER! type='+p.type);}
    else if(w){B(label+' CTM.'+f+'='+f64hex(v)+' weird='+v);}
    else{P(label+' CTM.'+f+'='+v);}
  });
}

// ════════════════════════════════════════════════════════════════════════
// FA — inner CSS left value overflow sweep
// push inner HTML element's left past 2^31, 2^32, MAX_SAFE_INT
// foreignObject boundary: does BCR wrap, saturate, or stay linear?
// ════════════════════════════════════════════════════════════════════════
function runFA(){
  hdr('FA: inner div CSS left overflow sweep through foreignObject boundary');
  var svg=mkSVG(400,400);
  var fo=mkEl(svg,'foreignObject',{x:'0',y:'0',width:'400',height:'400'});

  var testVals=[
    1e6, 1e7, 1e8, 1e9,
    0x7fffffff,       // 2^31-1 = 2147483647
    0x80000000,       // 2^31   = 2147483648
    0x100000000,      // 2^32   = 4294967296
    Number.MAX_SAFE_INTEGER,  // 2^53-1
    1e15, 1e16, 1e17, 1e18, 1e20,
  ];

  testVals.forEach(function(leftVal){
    var div=document.createElementNS(XNS,'div');
    div.style.cssText='position:absolute;left:'+leftVal+'px;top:0;width:10px;height:10px;background:red';
    fo.appendChild(div);
    var b=div.getBoundingClientRect();
    var x=b.x;
    var p=classifyPtr(x);
    var w=isWeird(x);
    if(p){R('FA: left='+leftVal+' BCR.x='+f64hex(x)+' POINTER! type='+p.type);}
    else if(w){B('FA: left='+leftVal+' BCR.x='+f64hex(x)+' (weird, expected '+leftVal+')');}
    else{P('FA: left='+leftVal+' BCR.x='+x);}
    fo.removeChild(div);
  });

  // FA[2]: check if BCR.x is clamped at 2^31
  hdr('FA[2]: fine sweep around 2^31 boundary');
  var JUST_BEFORE=2147483646;
  var AT=2147483648;
  var JUST_AFTER=2147483650;
  [JUST_BEFORE, AT, JUST_AFTER, AT*2, AT*4].forEach(function(v){
    var div=document.createElementNS(XNS,'div');
    div.style.cssText='position:absolute;left:'+v+'px;top:0;width:10px;height:10px;background:red';
    fo.appendChild(div);
    var b=div.getBoundingClientRect();
    var x=b.x;
    P('FA[2]: left='+v+' BCR.x='+x+' hex='+f64hex(x));
    fo.removeChild(div);
  });

  svg.remove();
  prog('FA done');
}

// ════════════════════════════════════════════════════════════════════════
// FB — foreignObject transform stacking sweep
// stack transform="matrix(1 0 0 1 TX 0)" on foreignObject
// inner element has fixed CSS left=100px
// probe: does stacked tx accumulate past 2^31?
// ════════════════════════════════════════════════════════════════════════
function runFB(){
  hdr('FB: foreignObject transform stacking — sweep TX past 2^31');
  var svg=mkSVG(400,400);

  var txVals=[
    1e6, 1e8,
    2147483646,  // 2^31-2
    2147483648,  // 2^31
    2147483650,  // 2^31+2
    4294967296,  // 2^32
    1e12, 1e15,
  ];

  txVals.forEach(function(tx){
    var fo=mkEl(svg,'foreignObject',{
      x:'0',y:'0',width:'400',height:'400',
      transform:'matrix(1 0 0 1 '+tx+' 0)'
    });
    var div=document.createElementNS(XNS,'div');
    div.style.cssText='position:absolute;left:100px;top:0;width:10px;height:10px;background:red';
    fo.appendChild(div);

    var b=div.getBoundingClientRect();
    var x=b.x;
    var p=classifyPtr(x);
    var w=isWeird(x);
    if(p){R('FB: fo_tx='+tx+' div BCR.x='+f64hex(x)+' POINTER! type='+p.type);}
    else if(w){B('FB: fo_tx='+tx+' div BCR.x='+f64hex(x)+' weird='+x);}
    else{P('FB: fo_tx='+tx+' div BCR.x='+x);}

    // also probe nested SVG CTM
    var innerSVG=document.createElementNS(NS,'svg');
    innerSVG.setAttribute('width','10'); innerSVG.setAttribute('height','10');
    fo.appendChild(innerSVG);
    var innerR=mkEl(innerSVG,'rect',{x:'0',y:'0',width:'10',height:'10'});
    var c=null;
    try{c=innerR.getScreenCTM();}catch(e){}
    if(c){
      var e_=c.e;
      var pp=classifyPtr(e_);
      var ww=isWeird(e_);
      if(pp){R('FB: fo_tx='+tx+' nested CTM.e='+f64hex(e_)+' POINTER! type='+pp.type);}
      else if(ww){B('FB: fo_tx='+tx+' nested CTM.e='+f64hex(e_)+' weird='+e_);}
      else{P('FB: fo_tx='+tx+' nested CTM.e='+e_);}
    }

    svg.removeChild(fo);
  });

  svg.remove();
  prog('FB done');
}

// ════════════════════════════════════════════════════════════════════════
// FC — viewBox amplification + foreignObject
// confirmed: viewBox tiny values bypass LayoutUnit for CTM
// combine: outer SVG viewBox amplification + foreignObject + nested SVG CTM
// does the amplification propagate through the boundary?
// ════════════════════════════════════════════════════════════════════════
function runFC(){
  hdr('FC: viewBox amplification through foreignObject boundary');

  // FC[1]: outer SVG with viewBox amplification, foreignObject inside
  hdr('FC[1]: viewBox amplified SVG with foreignObject — nested SVG CTM');
  // viewBox="0 0 0.0001 0.0001" width="400" height="400"
  // means 1 user unit = 400/0.0001 = 4,000,000px
  var vbScales=[
    {vb:'0 0 0.001 0.001',  label:'scale=400000x'},
    {vb:'0 0 0.0001 0.0001',label:'scale=4000000x'},
    {vb:'0 0 0.00001 0.00001',label:'scale=40000000x'},
    {vb:'0 0 1e-7 1e-7',    label:'scale=4e9x'},
    {vb:'0 0 1e-9 1e-9',    label:'scale=4e11x'},
    {vb:'0 0 1e-12 1e-12',  label:'scale=4e14x'},
  ];

  vbScales.forEach(function(spec){
    var svg=document.createElementNS(NS,'svg');
    svg.setAttribute('width','400'); svg.setAttribute('height','400');
    svg.setAttribute('viewBox',spec.vb);
    svg.style.cssText='position:fixed;left:0;top:0;width:400px;height:400px;opacity:0.001;pointer-events:none';
    document.body.appendChild(svg);

    // foreignObject in viewBox coords (tiny)
    var fo=mkEl(svg,'foreignObject',{x:'0',y:'0',width:'0.00001',height:'0.00001'});
    var innerSVG=document.createElementNS(NS,'svg');
    innerSVG.setAttribute('width','100'); innerSVG.setAttribute('height','100');
    fo.appendChild(innerSVG);
    var r=mkEl(innerSVG,'rect',{x:'1',y:'0',width:'1',height:'1'});

    var c=null;
    try{c=r.getScreenCTM();}catch(e){P('FC[1]: '+spec.label+' threw: '+e.name); svg.remove(); return;}
    if(c){
      ['e','f','a','d'].forEach(function(f){
        var v=c[f];
        var p=classifyPtr(v);
        var w=isWeird(v);
        if(p){R('FC[1]: '+spec.label+' CTM.'+f+'='+f64hex(v)+' POINTER! type='+p.type);}
        else if(w){B('FC[1]: '+spec.label+' CTM.'+f+'='+f64hex(v)+' weird='+v);}
        else{P('FC[1]: '+spec.label+' CTM.'+f+'='+v);}
      });
    }

    svg.remove();
  });

  // FC[2]: foreignObject x in viewBox coords — does tiny x amplify through boundary?
  hdr('FC[2]: foreignObject x offset in amplified viewBox coords');
  var svg2=document.createElementNS(NS,'svg');
  svg2.setAttribute('width','400'); svg2.setAttribute('height','400');
  svg2.setAttribute('viewBox','0 0 0.0001 0.0001');
  svg2.style.cssText='position:fixed;left:0;top:0;width:400px;height:400px;opacity:0.001;pointer-events:none';
  document.body.appendChild(svg2);

  // x=0.00001 in viewBox coords = 0.00001 * (400/0.0001) = 40px in screen coords
  // push x so that x * scale > 2^31
  // need x * 4e6 > 2^31 = 2147483648 → x > 536.87
  // but we're in viewBox 0.0001 total width, so x > viewBox width is clipped
  // try: separate viewBox that gives big scale AND allows large x
  var fo2=mkEl(svg2,'foreignObject',{x:'0.00001',y:'0',width:'0.00001',height:'0.00001'});
  var div2=document.createElementNS(XNS,'div');
  div2.style.cssText='position:absolute;left:0;top:0;width:10px;height:10px;background:red';
  fo2.appendChild(div2);

  var b2=div2.getBoundingClientRect();
  P('FC[2]: amplified fo x offset BCR.x='+b2.x+' y='+b2.y);

  // FC[3]: SVG translate inside foreignObject, nested SVG CTM
  hdr('FC[3]: SVG g translate inside foreignObject nested SVG CTM');
  var fo3=mkEl(svg2,'foreignObject',{x:'0',y:'0',width:'0.0001',height:'0.0001'});
  var innerSVG3=document.createElementNS(NS,'svg');
  innerSVG3.setAttribute('width','400'); innerSVG3.setAttribute('height','400');
  fo3.appendChild(innerSVG3);
  var g3=mkEl(innerSVG3,'g',{transform:'translate(999999,0)'});
  var r3=mkEl(g3,'rect',{x:'0',y:'0',width:'10',height:'10'});
  var c3=null;
  try{c3=r3.getScreenCTM();}catch(e){}
  if(c3){
    ['e','f'].forEach(function(f){
      var v=c3[f];
      var p=classifyPtr(v);
      var w=isWeird(v);
      if(p){R('FC[3]: inner translate+fo CTM.'+f+'='+f64hex(v)+' POINTER! type='+p.type);}
      else if(w){B('FC[3]: inner translate+fo CTM.'+f+'='+f64hex(v)+' weird='+v);}
      else{P('FC[3]: inner translate+fo CTM.'+f+'='+v);}
    });
  }

  svg2.remove();
  prog('FC done');
}

// ════════════════════════════════════════════════════════════════════════
// FD — animated foreignObject — mid-frame pipeline desync probe
// animate foreignObject x from 0 to 2^31 over 1s
// sample BCR of inner element every rAF frame
// look for frames where SVG pipeline and HTML layout pipeline disagree
// ════════════════════════════════════════════════════════════════════════
function runFD(){
  hdr('FD: animated foreignObject x sweep — mid-frame desync probe');
  var svg=mkSVG(600,400);

  var fo=mkEl(svg,'foreignObject',{x:'0',y:'0',width:'600',height:'400'});
  mkEl(fo,'animate',{
    attributeName:'x',
    from:'0', to:'2200000000',
    dur:'2s', repeatCount:'1', fill:'freeze'
  });

  var div=document.createElementNS(XNS,'div');
  div.style.cssText='position:absolute;left:100px;top:50px;width:10px;height:10px;background:red';
  fo.appendChild(div);

  var innerSVG=document.createElementNS(NS,'svg');
  innerSVG.setAttribute('width','50'); innerSVG.setAttribute('height','50');
  fo.appendChild(innerSVG);
  var innerR=mkEl(innerSVG,'rect',{x:'0',y:'0',width:'10',height:'10'});

  var samples=[];
  var weirdSamples=[];
  var start=performance.now();
  var frameCount=0;

  function fdFrame(){
    var elapsed=performance.now()-start;
    frameCount++;

    // sample both BCR (HTML pipeline) and CTM (SVG pipeline)
    var bx=div.getBoundingClientRect().x;
    var ctm=null;
    try{ctm=innerR.getScreenCTM();}catch(e){}
    var ce=ctm?ctm.e:null;

    var bp=classifyPtr(bx), cp=classifyPtr(ce);
    var bw=isWeird(bx), cw=isWeird(ce);

    // check pipeline desync: if BCR and CTM disagree significantly
    var desync=(ce!==null&&bx!==null)?(Math.abs(bx-ce)>10):false;

    if(bp||cp){
      R('FD: t='+elapsed.toFixed(0)+'ms BCR.x='+f64hex(bx)+' CTM.e='+f64hex(ce)+'  POINTER!');
      weirdSamples.push({t:elapsed,bx,ce,type:'ptr'});
    } else if(bw||cw){
      B('FD: t='+elapsed.toFixed(0)+'ms BCR.x='+f64hex(bx)+' CTM.e='+(ce?f64hex(ce):'null')+' weird');
      weirdSamples.push({t:elapsed,bx,ce,type:'weird'});
    } else if(desync){
      B('FD: t='+elapsed.toFixed(0)+'ms DESYNC BCR.x='+bx.toFixed(0)+' CTM.e='+ce.toFixed(0)+' delta='+(bx-ce).toFixed(0));
      weirdSamples.push({t:elapsed,bx,ce,type:'desync'});
    }

    if(elapsed<2200){
      requestAnimationFrame(fdFrame);
    } else {
      B('FD: animation complete. frames='+frameCount+' weird/ptr/desync='+weirdSamples.length);
      if(weirdSamples.length===0){P('FD: no weird values or desync during animated foreignObject x sweep');}
      svg.remove();
      prog('FD done');
    }
  }

  setTimeout(function(){requestAnimationFrame(fdFrame);},50);
}

// ════════════════════════════════════════════════════════════════════════
// FE — nested foreignObject chain
// SVG → foreignObject → nested SVG → foreignObject → nested SVG → rect
// each boundary transition may accumulate float precision errors
// or expose a different integer overflow path
// ════════════════════════════════════════════════════════════════════════
function runFE(){
  hdr('FE: nested foreignObject chain — boundary accumulation probe');
  var svg=mkSVG(400,400);

  // FE[1]: double nested foreignObject — SVG→FO→SVG→FO→SVG
  hdr('FE[1]: double nested foreignObject — CTM at each level');
  var fo1=mkEl(svg,'foreignObject',{x:'100',y:'100',width:'200',height:'200'});
  var svg2=document.createElementNS(NS,'svg');
  svg2.setAttribute('width','200'); svg2.setAttribute('height','200');
  fo1.appendChild(svg2);

  var fo2=mkEl(svg2,'foreignObject',{x:'50',y:'50',width:'100',height:'100'});
  var svg3=document.createElementNS(NS,'svg');
  svg3.setAttribute('width','100'); svg3.setAttribute('height','100');
  fo2.appendChild(svg3);

  var r3=mkEl(svg3,'rect',{x:'10',y:'10',width:'10',height:'10'});
  probeCTM('FE[1]: depth-2 nested rect',r3);
  probeBCR('FE[1]: depth-1 foreignObject',fo1);
  probeBCR('FE[1]: depth-2 foreignObject',fo2);

  // FE[2]: apply large transforms at each boundary level
  hdr('FE[2]: transformed nested foreignObjects');
  fo1.setAttribute('transform','matrix(1 0 0 1 10000 0)');
  var inner_div=document.createElementNS(XNS,'div');
  inner_div.style.cssText='position:absolute;left:10000px;top:0;width:10px;height:10px;background:red';
  fo2.appendChild(inner_div);

  var bd2=inner_div.getBoundingClientRect();
  var x2=bd2.x;
  var p2=classifyPtr(x2);
  if(p2){R('FE[2]: double fo + 10000 inner div BCR.x='+f64hex(x2)+' POINTER! type='+p2.type);}
  else if(isWeird(x2)){B('FE[2]: double fo BCR.x='+f64hex(x2)+' weird='+x2);}
  else{P('FE[2]: double fo inner div BCR.x='+x2);}

  // FE[3]: extreme nested transform chain
  hdr('FE[3]: extreme translate chain through nested boundary');
  fo1.setAttribute('transform','matrix(1 0 0 1 999999 0)');
  fo2.setAttribute('transform','matrix(1 0 0 1 999999 0)');
  inner_div.style.left='999999px';

  var bd3=inner_div.getBoundingClientRect();
  var x3=bd3.x;
  var p3=classifyPtr(x3);
  if(p3){R('FE[3]: triple 999999 stacked BCR.x='+f64hex(x3)+' POINTER! type='+p3.type);}
  else if(isWeird(x3)){B('FE[3]: triple 999999 stacked BCR.x='+f64hex(x3)+' weird='+x3);}
  else{P('FE[3]: triple 999999 stacked BCR.x='+x3);}

  probeCTM('FE[3]: depth-2 nested rect after extreme transforms',r3);

  svg.remove();
  prog('FE done');
}

// ════════════════════════════════════════════════════════════════════════
// FF — foreignObject + getBBox + getComputedStyle integer overflow
// getBBox is SVG-internal; on a foreignObject it bridges to HTML layout
// getComputedStyle on element inside foreignObject — does it expose internal coords?
// also: SVGForeignObjectElement.width.baseVal.value at extreme values
// ════════════════════════════════════════════════════════════════════════
function runFF(){
  hdr('FF: foreignObject getBBox / getComputedStyle / baseVal overflow');
  var svg=mkSVG(400,400);

  // FF[1]: getBBox on foreignObject at extreme x
  hdr('FF[1]: getBBox on foreignObject with extreme x attribute');
  var xVals=[1e6, 2147483648, 4294967296, 1e12, 1e15];
  xVals.forEach(function(x){
    var fo=mkEl(svg,'foreignObject',{x:x,y:'0',width:'100',height:'100'});
    var div=document.createElementNS(XNS,'div');
    div.style.cssText='width:50px;height:50px;background:red';
    fo.appendChild(div);

    var bb=null;
    try{bb=fo.getBBox();}catch(e){P('FF[1]: x='+x+' getBBox threw: '+e.name); svg.removeChild(fo); return;}
    if(bb){
      ['x','y','width','height'].forEach(function(f){
        var v=bb[f];
        var p=classifyPtr(v);
        var w=isWeird(v);
        if(p){R('FF[1]: fo_x='+x+' getBBox.'+f+'='+f64hex(v)+' POINTER! type='+p.type);}
        else if(w){B('FF[1]: fo_x='+x+' getBBox.'+f+'='+f64hex(v)+' weird='+v);}
        else{P('FF[1]: fo_x='+x+' getBBox.'+f+'='+v);}
      });
    }
    svg.removeChild(fo);
  });

  // FF[2]: getComputedStyle on element inside foreignObject
  hdr('FF[2]: getComputedStyle on inner element in transformed foreignObject');
  var fo2=mkEl(svg,'foreignObject',{x:'0',y:'0',width:'400',height:'400',
    transform:'matrix(1 0 0 1 2000000 0)'});
  var div2=document.createElementNS(XNS,'div');
  div2.style.cssText='position:absolute;left:1000000px;top:0;width:50px;height:50px;background:red';
  fo2.appendChild(div2);

  var cs=window.getComputedStyle(div2);
  ['left','top','width','height','transform'].forEach(function(prop){
    var v=cs[prop];
    P('FF[2]: getComputedStyle.'+prop+'='+v);
    // parse px value
    var num=parseFloat(v);
    if(!isNaN(num)){
      var p=classifyPtr(num);
      var w=isWeird(num);
      if(p){R('FF[2]: getComputedStyle.'+prop+' parsed='+f64hex(num)+' POINTER! type='+p.type);}
      else if(w){B('FF[2]: getComputedStyle.'+prop+' parsed='+f64hex(num)+' weird='+num);}
    }
  });

  // FF[3]: foreignObject width/height baseVal at extreme values
  hdr('FF[3]: foreignObject width.baseVal.value at extreme attr values');
  [2147483648, 4294967296, 1e12, 1e15].forEach(function(w){
    var fo3=mkEl(svg,'foreignObject',{x:'0',y:'0',width:w,height:'100'});
    var div3=document.createElementNS(XNS,'div');
    div3.style.cssText='width:100%;height:100%;background:red';
    fo3.appendChild(div3);

    var bv=null;
    try{bv=fo3.width.baseVal.value;}catch(e){}
    P('FF[3]: attr_width='+w+' width.baseVal.value='+bv);

    var db=div3.getBoundingClientRect();
    var dw=db.width;
    var p=classifyPtr(dw);
    var ww=isWeird(dw);
    if(p){R('FF[3]: attr_width='+w+' inner BCR.width='+f64hex(dw)+' POINTER! type='+p.type);}
    else if(ww){B('FF[3]: attr_width='+w+' inner BCR.width='+f64hex(dw)+' weird='+dw);}
    else{P('FF[3]: attr_width='+w+' inner BCR.width='+dw);}

    svg.removeChild(fo3);
  });

  // FF[4]: foreignObject.x.baseVal mutation — does setting to 2^31 overflow internally?
  hdr('FF[4]: foreignObject.x.baseVal.value mutation overflow probe');
  var fo4=mkEl(svg,'foreignObject',{x:'0',y:'0',width:'100',height:'100'});
  var div4=document.createElementNS(XNS,'div');
  div4.style.cssText='width:50px;height:50px;position:absolute;left:0;top:0;background:red';
  fo4.appendChild(div4);

  [0, 1e6, 2147483648, 4294967296, 1e12].forEach(function(val){
    try{fo4.x.baseVal.value=val;}catch(e){P('FF[4]: setting x='+val+' threw: '+e.name); return;}
    var actual=fo4.x.baseVal.value;
    var b=div4.getBoundingClientRect();
    var bx=b.x;
    var p=classifyPtr(bx);
    var w=isWeird(bx);
    if(p){R('FF[4]: set_x='+val+' actual_x='+actual+' div BCR.x='+f64hex(bx)+' POINTER! type='+p.type);}
    else if(w){B('FF[4]: set_x='+val+' actual_x='+actual+' div BCR.x='+f64hex(bx)+' weird='+bx);}
    else{P('FF[4]: set_x='+val+' actual_x='+actual+' div BCR.x='+bx);}
  });

  svg.remove();
  prog('FF done — v40 complete');
}
</script>
