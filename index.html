<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVG UAF v79 — SVGAnimatedLength notification chain + coordinate overflow</title>
<style>
*{box-sizing:border-box}
body{background:#0a0a0a;color:#e0e0e0;font-family:monospace;font-size:12px;padding:12px;margin:0}
h2{color:#00ff88;margin:6px 0;font-size:14px}
#controls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
button{background:#1a1a2e;color:#00ff88;border:1px solid #00ff88;padding:6px 12px;font-family:monospace;font-size:12px;cursor:pointer;border-radius:3px}
button:active{background:#00ff88;color:#0a0a0a}
button.run-all{background:#003300;border-color:#00ff88;font-weight:bold}
button.copy-btn{background:#1a1a2e;border-color:#00aaff;color:#00aaff}
button.copy-btn:active{background:#00aaff;color:#0a0a0a}
button.clear-btn{border-color:#ff4444;color:#ff4444}
#out{border:1px solid #222;padding:8px;min-height:100px;max-height:72vh;overflow-y:auto}
pre{white-space:pre-wrap;word-break:break-all;margin:1px 0;line-height:1.4}
.hit{color:#00ff88}.miss{color:#ff4444}.warn{color:#ffaa00}.info{color:#888}
.suite-hdr{color:#00aaff;margin-top:6px}
#copy-toast{position:fixed;bottom:20px;right:20px;background:#00aaff;color:#000;padding:6px 14px;border-radius:4px;font-family:monospace;font-size:12px;opacity:0;transition:opacity 0.2s;pointer-events:none}
</style>
</head>
<body>
<h2>SVG UAF v79 — Notification chain + coordinate overflow + SVGLength unit conversion</h2>
<div id="controls">
  <button class="run-all" onclick="runAll()">▶ Run All</button>
  <button onclick="runSuite('ADR127')">ADR127: SVGLength unit type — px vs % vs em conversion during detach</button>
  <button onclick="runSuite('ADR128')">ADR128: SVGLength rapid unit type change — conversion chain overflow</button>
  <button onclick="runSuite('ADR129')">ADR129: viewBox write → child getBBox() → coordinate overflow chain</button>
  <button onclick="runSuite('ADR130')">ADR130: SVGAnimatedLength 0ms timing — sub-ms resolution test (1000 iters)</button>
  <button onclick="runSuite('ADR131')">ADR131: SVGAnimatedLength on text element — x/y/dx/dy baseVal after remove</button>
  <button onclick="runSuite('ADR132')">ADR132: SVGLength from SVGPathElement.pathLength — alive after remove?</button>
  <button onclick="runSuite('ADR133')">ADR133: detached svg + viewBox write + getComputedStyle — does computed layout update?</button>
  <button class="copy-btn" onclick="copyAll()">⎘ Copy All</button>
  <button class="clear-btn" onclick="clearOut()">✕ Clear</button>
</div>
<div id="out"></div>
<div id="copy-toast">Copied!</div>
<script>
window.onerror=function(msg,src,line,col,err){
  var d=document.getElementById('out');if(d){var p=document.createElement('pre');p.className='miss';p.textContent='[GLOBAL ERR] '+msg+' @ line '+line+(err&&err.stack?'\n'+err.stack:'');d.appendChild(p);d.scrollTop=d.scrollHeight;}return false;
};
var SVG_NS='http://www.w3.org/2000/svg';
function L(s,cls){var d=document.getElementById('out');var p=document.createElement('pre');if(cls)p.className=cls;p.textContent=s;d.appendChild(p);d.scrollTop=d.scrollHeight;}
function clearOut(){document.getElementById('out').innerHTML='';}
function copyAll(){
  var lines=document.getElementById('out').querySelectorAll('pre');
  var text=Array.from(lines).map(function(p){return p.textContent;}).join('\n');
  var toast=document.getElementById('copy-toast');
  try{navigator.clipboard.writeText(text).then(function(){toast.style.opacity='1';setTimeout(function(){toast.style.opacity='0';},1500);}).catch(function(){fb(text,toast);});}catch(e){fb(text,toast);}
}
function fb(text,toast){var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;top:-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast.style.opacity='1';setTimeout(function(){toast.style.opacity='0';},1500);}catch(e){}document.body.removeChild(ta);}
function timeWrite(writeFn,label,ITER){
  ITER=ITER||500;
  var errors=0;
  var t0=performance.now();
  for(var i=0;i<ITER;i++){try{writeFn(i);}catch(e){errors++;break;}}
  var t1=performance.now();
  var ms=(t1-t0).toFixed(2);
  var us=((t1-t0)*1000/(ITER-errors)).toFixed(2);
  L(label+': '+ms+'ms ('+us+'µs/write) '+(t1-t0>0.1?'★ALIVE':errors>0?'[THREW]':'')+(errors>0?' err='+errors:''),'info');
  return t1-t0;
}
var suites={};
function runSuite(name){L('','');L('══ '+name+' ══════════════════════════════════','suite-hdr');try{suites[name]();}catch(e){L('[SUITE CRASH] '+name+': '+(e&&e.stack?e.stack:String(e)),'miss');}}
function runAll(){['ADR127','ADR128','ADR129','ADR130','ADR131','ADR132','ADR133'].forEach(function(n){runSuite(n);});}

// SVGLength unit type constants
var SVG_LENGTHTYPE_UNKNOWN=0,SVG_LENGTHTYPE_NUMBER=1,SVG_LENGTHTYPE_PERCENTAGE=2,
    SVG_LENGTHTYPE_EMS=3,SVG_LENGTHTYPE_EXS=4,SVG_LENGTHTYPE_PX=5,
    SVG_LENGTHTYPE_CM=6,SVG_LENGTHTYPE_MM=7,SVG_LENGTHTYPE_IN=8,
    SVG_LENGTHTYPE_PT=9,SVG_LENGTHTYPE_PC=10;

// ═══════════════════════════════════════════════════════════════
// ADR127 — SVGLength unit type conversion during detach
//
// SVGLength has a .unitType and a .value and a .valueInSpecifiedUnits.
// When unitType = PERCENTAGE (2), the .value getter needs the
// PARENT element's dimension to convert. If the element is detached,
// the parent dimension is unknown — what does it return?
//
// More importantly: .convertToSpecifiedUnits(newType) triggers a
// conversion calculation. If the element is detached:
// - Source value is a percentage (e.g. "50%")
// - Target is pixels (unitType=5)
// - Conversion: px = percentage * parentDimension / 100
// - If parentDimension = 0 or garbage → overflow/bad value
//
// Attack:
// 1. rect with width="50%" (percentage unit)
// 2. Grab rect.width.baseVal (SVGLength TearOff)
// 3. Remove rect from DOM (or entire svg)
// 4. Call convertToSpecifiedUnits(PX) — needs parent to compute
// 5. Check the result: correct, NaN, Inf, or garbage?
// 6. Then: newValueSpecifiedUnits(PERCENTAGE, extreme_value) while detached
// 7. Re-attach and check what renderered value is
// ═══════════════════════════════════════════════════════════════
suites['ADR127']=function(){
  L('ADR127: SVGLength unit type conversion during detach','info');
  var container=document.createElement('div');
  container.style.cssText='width:800px;height:600px';
  document.body.appendChild(container);

  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('width','400');svg.setAttribute('height','300');
  svg.setAttribute('viewBox','0 0 400 300');
  container.appendChild(svg);

  // rect with percentage-based width
  var rect=document.createElementNS(SVG_NS,'rect');
  rect.setAttribute('x','0');rect.setAttribute('y','0');
  rect.setAttribute('width','50%');rect.setAttribute('height','25%');
  svg.appendChild(rect);

  var RW=rect.width.baseVal;
  var RH=rect.height.baseVal;
  L('ADR127: RW.unitType='+RW.unitType+' (2=PERCENTAGE)','info');
  L('ADR127: RW.value='+RW.value+' (should be 200 = 50% of 400)','info');
  L('ADR127: RW.valueInSpecifiedUnits='+RW.valueInSpecifiedUnits+' (should be 50)','info');

  // Remove rect
  svg.removeChild(rect);
  L('ADR127: rect removed','info');

  // Read value while detached — needs parent to compute %
  L('ADR127: RW.value after remove='+RW.value,'info');
  L('ADR127: RW.valueInSpecifiedUnits after remove='+RW.valueInSpecifiedUnits,'info');

  // convertToSpecifiedUnits: % → px (needs parent dimension)
  try{
    RW.convertToSpecifiedUnits(SVG_LENGTHTYPE_PX);
    L('ADR127: after convertToSpecifiedUnits(PX): unitType='+RW.unitType+' value='+RW.value+' vis='+RW.valueInSpecifiedUnits,'info');
    if(!isFinite(RW.value)||isNaN(RW.value)||Math.abs(RW.value)>1e10){
      L('★★★ ADR127: ANOMALOUS value after convertToSpecifiedUnits on detached element!','hit');
    }
  }catch(e){L('ADR127: convertToSpecifiedUnits threw: '+e.message,'warn');}

  // newValueSpecifiedUnits: set to extreme % while detached
  try{
    RW.newValueSpecifiedUnits(SVG_LENGTHTYPE_PERCENTAGE, 1e10);
    L('ADR127: newValueSpecifiedUnits(%, 1e10): value='+RW.value+' vis='+RW.valueInSpecifiedUnits,'info');
  }catch(e){L('ADR127: newValueSpecifiedUnits threw: '+e.message,'warn');}

  // Re-attach and check
  svg.appendChild(rect);
  L('ADR127: re-attached. RW.value='+RW.value+' attr='+rect.getAttribute('width'),'info');

  // Try converting to EM while detached
  svg.removeChild(rect);
  try{
    RW.newValueSpecifiedUnits(SVG_LENGTHTYPE_EMS, 99);
    L('ADR127: newValueSpecifiedUnits(EM, 99) while detached: value='+RW.value,'info');
    // EM conversion needs computed font-size — what does it return for detached element?
  }catch(e){L('ADR127: EM conversion threw: '+e.message,'warn');}

  // Re-attach with EM value
  svg.appendChild(rect);
  L('ADR127: re-attached with EM. value='+RW.value+' attr='+rect.getAttribute('width'),'info');

  container.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR128 — SVGLength rapid unit type change — conversion chain
//
// All these unit types are valid for SVGLength:
// NUMBER(1), PERCENTAGE(2), EMS(3), EXS(4), PX(5), CM(6), MM(7), IN(8), PT(9), PC(10)
//
// convertToSpecifiedUnits() converts the value FROM current unit TO new unit.
// The conversion is: vis_new = vis_old * old_px_per_unit / new_px_per_unit
//
// Chain of conversions can accumulate floating point error.
// More importantly: some conversions (EMS) require layout context.
// If we chain: PX → EM → PX → EM repeatedly, each EM conversion
// re-queries the computed font-size. If the element is detached
// and font-size = 0 or undefined → division by zero in the chain.
//
// Also: newValueSpecifiedUnits(type, value) sets BOTH unitType AND
// valueInSpecifiedUnits atomically. What happens if we set:
// - type = UNKNOWN (0) — should throw
// - type = 255 — out of range, what happens?
// - type = -1 — what happens?
// ═══════════════════════════════════════════════════════════════
suites['ADR128']=function(){
  L('ADR128: SVGLength rapid unit type change — conversion chain probe','info');
  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('width','400');svg.setAttribute('height','400');
  document.body.appendChild(svg);
  var rect=document.createElementNS(SVG_NS,'rect');
  rect.setAttribute('x','0');rect.setAttribute('y','0');
  rect.setAttribute('width','100');rect.setAttribute('height','100');
  svg.appendChild(rect);

  var RW=rect.width.baseVal;
  L('ADR128: initial: unitType='+RW.unitType+' value='+RW.value,'info');

  // Conversion chain while IN DOM
  var types=[SVG_LENGTHTYPE_PX,SVG_LENGTHTYPE_CM,SVG_LENGTHTYPE_MM,SVG_LENGTHTYPE_IN,SVG_LENGTHTYPE_PT,SVG_LENGTHTYPE_PC];
  for(var i=0;i<types.length;i++){
    try{
      RW.convertToSpecifiedUnits(types[i]);
      L('ADR128: convert to type='+types[i]+': vis='+RW.valueInSpecifiedUnits.toFixed(4)+' value='+RW.value.toFixed(4),'info');
    }catch(e){L('ADR128: convert to type='+types[i]+' threw: '+e.message,'warn');}
  }

  // Remove and do conversion chain while detached
  svg.removeChild(rect);
  L('ADR128: rect removed — starting detached conversion chain','info');

  // Rapid unit switches while detached
  for(var i=0;i<types.length;i++){
    try{
      RW.convertToSpecifiedUnits(types[i]);
      L('ADR128[detached]: type='+types[i]+': vis='+RW.valueInSpecifiedUnits.toFixed(6)+' value='+RW.value.toFixed(6),'info');
      if(!isFinite(RW.value)||isNaN(RW.value)){
        L('★★★ ADR128: NaN/Inf in conversion chain while detached! type='+types[i],'hit');
      }
    }catch(e){L('ADR128[detached]: type='+types[i]+' threw: '+e.message,'warn');}
  }

  // EM conversion while detached (needs font-size context)
  try{
    RW.convertToSpecifiedUnits(SVG_LENGTHTYPE_EMS);
    L('ADR128[detached]: EM: vis='+RW.valueInSpecifiedUnits+' value='+RW.value,'info');
  }catch(e){L('ADR128[detached]: EM threw: '+e.message,'warn');}

  // Out of range unit types
  var oddTypes=[0, 11, 255, -1, 100];
  for(var i=0;i<oddTypes.length;i++){
    try{
      RW.newValueSpecifiedUnits(oddTypes[i], 100);
      L('ADR128: newValueSpecifiedUnits('+oddTypes[i]+', 100): unitType='+RW.unitType+' value='+RW.value,'info');
    }catch(e){L('ADR128: newValueSpecifiedUnits('+oddTypes[i]+') threw: '+e.message,'info');}
  }

  // Rapid conversion timing — is there a notification each time?
  svg.appendChild(rect);
  var convCount=0;
  var t0=performance.now();
  for(var i=0;i<500;i++){
    try{
      RW.convertToSpecifiedUnits((i%5)+5);// PX/CM/MM/IN/PT cycle
      convCount++;
    }catch(e){}
  }
  var t1=performance.now();
  L('ADR128: 500 rapid conversions in DOM: '+(t1-t0).toFixed(2)+'ms ('+((t1-t0)*1000/convCount).toFixed(1)+'µs each)','info');

  // Same while detached
  svg.removeChild(rect);
  convCount=0;
  t0=performance.now();
  for(var i=0;i<500;i++){
    try{RW.convertToSpecifiedUnits((i%5)+5);convCount++;}catch(e){}
  }
  t1=performance.now();
  L('ADR128: 500 rapid conversions DETACHED: '+(t1-t0).toFixed(2)+'ms ('+((t1-t0)*1000/convCount).toFixed(1)+'µs each)','info');

  svg.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR129 — viewBox write → child getBBox() → coordinate overflow chain
//
// From ADR120: viewBox can be set to extreme values (1e15) while
// detached. From ADR123: this gives CTM.a = 2e-13.
//
// Now: set viewBox to extreme, re-attach, then call getBBox() on
// children with large coordinates. getBBox returns DOMRect in
// user coordinate space. If the coordinate system has a 1e-13 scale,
// a child with x=1000000 in user coords → getBBox().x = 1e-13 * 1e6 = 1e-7.
// That's fine. But what about the inverse: if we set viewBox to near-zero
// and the child has coordinates that overflow float32?
//
// The interesting attack path:
// - viewBox.width set to near-0 (float32 min positive = 1.175e-38)
// - CTM.a = svgCSSWidth / viewBoxWidth = 200 / 1.175e-38 = 1.7e40
//   But CSS width is 200px, so CTM.a should be huge
// - A child at x=1 in user space would have screen x = 1.7e40 → overflow
//
// Also: getBBoxes cascade. Parent SVGGElement.getBBox() = union of
// all children. If one child has an extreme coordinate, the union
// has to compute min/max across all children → could this overflow
// the coordinate accumulator?
//
// And: getComputedTextLength() on SVGText — does it use the CTM?
// If CTM is extreme, does computed text length become extreme?
// ═══════════════════════════════════════════════════════════════
suites['ADR129']=function(){
  L('ADR129: viewBox extreme → child getBBox/getComputedTextLength overflow','info');
  var container=document.createElement('div');
  document.body.appendChild(container);

  function testCoordOverflow(label, vbW, vbH, childX, childW){
    var svg=document.createElementNS(SVG_NS,'svg');
    svg.setAttribute('width','200');svg.setAttribute('height','200');
    svg.setAttribute('viewBox','0 0 1000 1000');
    var g=document.createElementNS(SVG_NS,'g');
    var r=document.createElementNS(SVG_NS,'rect');
    r.setAttribute('x',String(childX));r.setAttribute('y','0');
    r.setAttribute('width',String(childW));r.setAttribute('height','100');
    g.appendChild(r);
    svg.appendChild(g);
    container.appendChild(svg);

    // Baseline
    var bb0=r.getBBox();
    var ctm0=r.getScreenCTM();
    L('ADR129['+label+']: baseline: BB.x='+bb0.x+' CTM.a='+ctm0.a.toFixed(4),'info');

    // Set extreme viewBox
    var VB=svg.viewBox.baseVal;
    container.removeChild(svg);
    try{VB.width=vbW;VB.height=vbH;}catch(e){L('ADR129['+label+']: vb write threw: '+e.message,'warn');container.appendChild(svg);svg.remove();return;}
    container.appendChild(svg);

    // Now check CTM and getBBox
    try{
      var ctm1=r.getScreenCTM();
      var bb1=r.getBBox();
      L('ADR129['+label+']: vbW='+vbW+' CTM.a='+ctm1.a+' BB.x='+bb1.x+' BB.w='+bb1.width,'info');
      if(!isFinite(ctm1.a)||isNaN(ctm1.a)||Math.abs(ctm1.a)>1e15){
        L('★★★ ADR129['+label+']: EXTREME CTM.a='+ctm1.a,'hit');
      }
      if(!isFinite(bb1.x)||isNaN(bb1.x)){
        L('★★★ ADR129['+label+']: NaN/Inf in getBBox().x!','hit');
      }
      // g.getBBox() — union of children
      var gb=g.getBBox();
      L('ADR129['+label+']: g.getBBox(): x='+gb.x+' y='+gb.y+' w='+gb.width+' h='+gb.height,'info');
      if(!isFinite(gb.x)||isNaN(gb.x)){
        L('★★★ ADR129['+label+']: NaN/Inf in g.getBBox()!','hit');
      }
    }catch(e){L('ADR129['+label+']: getBBox/CTM threw: '+e.message,'warn');}

    container.removeChild(svg);svg.remove();
  }

  testCoordOverflow('tiny-vb', 1e-5, 1e-5, 0, 1000);      // near-zero viewBox
  testCoordOverflow('huge-vb', 1e15, 1e15, 0, 1000);       // huge viewBox
  testCoordOverflow('huge-child', 1000, 1000, 1e10, 1e10); // huge child coords
  testCoordOverflow('neg-vb', 0.001, 0.001, 0, 1000);      // very small viewBox

  // getComputedTextLength with extreme CTM
  var svg2=document.createElementNS(SVG_NS,'svg');
  svg2.setAttribute('width','200');svg2.setAttribute('height','200');
  svg2.setAttribute('viewBox','0 0 1000 1000');
  var text=document.createElementNS(SVG_NS,'text');
  text.setAttribute('x','0');text.setAttribute('y','50');
  text.textContent='Hello World Test String';
  svg2.appendChild(text);
  container.appendChild(svg2);

  var tlen0=text.getComputedTextLength();
  L('ADR129[text]: baseline getComputedTextLength='+tlen0.toFixed(2),'info');

  var VB2=svg2.viewBox.baseVal;
  container.removeChild(svg2);
  try{VB2.width=0.001;VB2.height=0.001;}catch(e){}
  container.appendChild(svg2);

  try{
    var tlen1=text.getComputedTextLength();
    L('ADR129[text]: getComputedTextLength with tiny viewBox='+tlen1,'info');
    if(!isFinite(tlen1)||isNaN(tlen1)||tlen1>1e10){
      L('★★★ ADR129[text]: EXTREME getComputedTextLength!','hit');
    }
  }catch(e){L('ADR129[text]: getComputedTextLength threw: '+e.message,'warn');}

  container.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR130 — SVGAnimatedLength "0ms" timing — sub-ms resolution test
//
// v78 results showed some SVGAnimatedLength TearOffs at "0ms" but
// attributes were STILL UPDATED. The 0ms is due to timing granularity
// at 500 iterations.
//
// Determine true write cost with 5000 and 50000 iterations.
// For the "0ms" ones: are they actually ~0µs (sub-100ns = dead)
// or ~0.1µs (alive but fast)?
//
// Also: measure the NOTIFICATION cost specifically.
// Two timings:
// (a) write value to stale TearOff (total including notification)
// (b) write same value (no-op — value unchanged): should not fire notification
// (c) difference = notification cost
//
// If notification cost is 0 for detached elements, it confirms
// that the notification fires into the DOM attribute setter but
// the setAttribute call shortcuts because the element is detached.
// ═══════════════════════════════════════════════════════════════
suites['ADR130']=function(){
  L('ADR130: SVGAnimatedLength precise timing — 5000 iterations','info');
  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('viewBox','0 0 1000 1000');svg.setAttribute('width','200');svg.setAttribute('height','200');
  document.body.appendChild(svg);

  function timePrecise(createFn, label){
    // Create in svg, grab TearOff, remove, time
    var el=createFn();
    svg.appendChild(el);
    var tearoff=el.width?el.width.baseVal:(el.cx?el.cx.baseVal:(el.r?el.r.baseVal:null));
    if(!tearoff){L(label+': no tearoff found','warn');el.remove();return;}
    var baseline0=tearoff.value;
    L(label+': TearOff.value='+baseline0+' unitType='+tearoff.unitType,'info');

    // Baseline timing IN DOM (5000 iters)
    var t0=performance.now();
    for(var i=0;i<5000;i++) tearoff.value=i+1000;
    var t1=performance.now();
    L(label+': IN DOM 5000: '+(t1-t0).toFixed(2)+'ms ('+(((t1-t0)/5000)*1000).toFixed(2)+'µs/write)','info');

    // Remove and time DETACHED
    svg.removeChild(el);
    t0=performance.now();
    for(var i=0;i<5000;i++) tearoff.value=i+2000;
    t1=performance.now();
    L(label+': DETACHED 5000: '+(t1-t0).toFixed(2)+'ms ('+(((t1-t0)/5000)*1000).toFixed(2)+'µs/write)','info');
    L(label+': value after='+tearoff.value,'info');

    // Attribute update test
    L(label+': getAttribute='+el.getAttribute('width'),'info');
  }

  // rect.width — was ★ALIVE at 1ms in v78
  timePrecise(function(){
    var r=document.createElementNS(SVG_NS,'rect');
    r.setAttribute('width','300');r.setAttribute('height','100');r.setAttribute('x','0');r.setAttribute('y','0');
    return r;
  },'ADR130[rect.width]');

  // rect.height — was "0ms" at 500 iters but attr updated
  var svg2=document.createElementNS(SVG_NS,'svg');
  svg2.setAttribute('viewBox','0 0 1000 1000');svg2.setAttribute('width','200');svg2.setAttribute('height','200');
  document.body.appendChild(svg2);
  var r2=document.createElementNS(SVG_NS,'rect');
  r2.setAttribute('width','300');r2.setAttribute('height','400');r2.setAttribute('x','0');r2.setAttribute('y','0');
  svg2.appendChild(r2);
  var RH=r2.height.baseVal;
  L('ADR130[rect.height]: IN DOM baseline','info');
  var t0b=performance.now();
  for(var i=0;i<5000;i++) RH.value=i+1000;
  var t1b=performance.now();
  L('ADR130[rect.height]: IN DOM 5000: '+(t1b-t0b).toFixed(2)+'ms ('+(((t1b-t0b)/5000)*1000).toFixed(2)+'µs/write)','info');
  svg2.removeChild(r2);
  t0b=performance.now();
  for(var i=0;i<5000;i++) RH.value=i+2000;
  t1b=performance.now();
  L('ADR130[rect.height]: DETACHED 5000: '+(t1b-t0b).toFixed(2)+'ms ('+(((t1b-t0b)/5000)*1000).toFixed(2)+'µs/write)','info');
  L('ADR130[rect.height]: value='+RH.value+' attr='+r2.getAttribute('height'),'info');
  svg2.remove();

  // viewBox baseVal — was ★ALIVE
  var svg3=document.createElementNS(SVG_NS,'svg');
  svg3.setAttribute('viewBox','0 0 1000 1000');svg3.setAttribute('width','200');svg3.setAttribute('height','200');
  document.body.appendChild(svg3);
  var VB=svg3.viewBox.baseVal;
  t0b=performance.now();for(var i=0;i<5000;i++){VB.width=i+1000;VB.height=i+1000;}
  t1b=performance.now();
  L('ADR130[viewBox]: IN DOM 5000: '+(t1b-t0b).toFixed(2)+'ms ('+(((t1b-t0b)/5000)*1000).toFixed(2)+'µs/write)','info');
  document.body.removeChild(svg3);
  t0b=performance.now();for(var i=0;i<5000;i++){VB.width=i+2000;VB.height=i+2000;}
  t1b=performance.now();
  L('ADR130[viewBox]: DETACHED 5000: '+(t1b-t0b).toFixed(2)+'ms ('+(((t1b-t0b)/5000)*1000).toFixed(2)+'µs/write)','info');
  svg3.remove();

  svg.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR131 — SVGAnimatedLength on text element — x/y/dx/dy after remove
//
// SVGText has multiple SVGAnimatedLength attributes:
// - text.x.baseVal (SVGAnimatedLengthList — list, not single!)
// - text.y.baseVal (same)
// - text.dx.baseVal (same — delta position)
// - text.dy.baseVal (same)
//
// These are LISTS of SVGLength objects (for per-character positioning).
// e.g., text.x.baseVal.getItem(0) = SVGLength for first char's x position
//
// SVGLengthList TearOff — we haven't tested this extensively.
// v67-v74 covered SVGNumberList. SVGLengthList is a different TearOff class.
//
// Attack:
// 1. Create <text> with multiple x positions (x="10 20 30 40 50")
// 2. Grab text.x.baseVal (SVGAnimatedLengthList)
// 3. Grab individual SVGLength TearOffs from the list
// 4. removeItem(0) → item TearOff becomes stale
// 5. Remove the text element from DOM → list TearOff becomes stale
// 6. Time writes to individual length TearOff
// 7. Check propagation: does stale write update the text positioning?
// ═══════════════════════════════════════════════════════════════
suites['ADR131']=function(){
  L('ADR131: SVGText SVGAnimatedLengthList — stale writes after remove','info');
  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('viewBox','0 0 1000 1000');svg.setAttribute('width','200');svg.setAttribute('height','200');
  document.body.appendChild(svg);

  var text=document.createElementNS(SVG_NS,'text');
  text.setAttribute('x','10 20 30 40 50');
  text.setAttribute('y','50 50 50 50 50');
  text.textContent='ABCDE';
  svg.appendChild(text);

  var XL=text.x.baseVal;// SVGAnimatedLengthList → baseVal is SVGLengthList
  L('ADR131: text.x.baseVal.numberOfItems='+XL.numberOfItems,'info');

  // Grab individual SVGLength TearOffs
  var L0=XL.getItem(0),L1=XL.getItem(1),L4=XL.getItem(4);
  L('ADR131: L0.value='+L0.value+' L4.value='+L4.value,'info');

  // removeItem(0) → L0 stale
  XL.removeItem(0);
  L('ADR131: after removeItem(0): XL.N='+XL.numberOfItems,'info');

  // Time stale write on L0 (removed from list, still in DOM)
  var tL0=timeWrite(function(i){L0.value=i+11111;},'ADR131: L0 stale write (item removed, text in DOM)',500);
  if(tL0>0.1) L('★★★ ADR131: L0 (removed SVGLength) ALIVE with text in DOM!','hit');
  L('ADR131: L0.value='+L0.value+' getAttribute='+text.getAttribute('x'),'info');

  // Remove text from DOM → all items stale
  svg.removeChild(text);
  L('ADR131: text removed from DOM','info');

  var tL1=timeWrite(function(i){L1.value=i+22222;},'ADR131: L1 stale write (text removed)',500);
  if(tL1>0.1) L('★★★ ADR131: L1 ALIVE after text remove!','hit');

  var tL4=timeWrite(function(i){L4.value=i+33333;},'ADR131: L4 stale write (text removed)',500);
  if(tL4>0.1) L('★★★ ADR131: L4 ALIVE after text remove!','hit');

  L('ADR131: L1.value='+L1.value+' L4.value='+L4.value,'info');
  L('ADR131: getAttribute(x)='+text.getAttribute('x'),'info');

  // Also: SVGLengthList.appendItem while detached
  try{
    var newLen=svg.createSVGLength();
    newLen.value=99999;
    XL.appendItem(newLen);
    L('ADR131: appendItem to detached list: XL.N='+XL.numberOfItems,'info');
  }catch(e){L('ADR131: appendItem threw: '+e.message,'warn');}

  svg.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR132 — SVGPathElement.getTotalLength / pathLength — alive after remove?
//
// SVGPathElement has:
// - pathLength attribute → accessed via el.pathLength.baseVal (SVGAnimatedLength)
// - getTotalLength() → computes path geometry (not a TearOff, a method)
// - getPointAtLength(n) → returns DOMPoint on the path
//
// The pathLength attribute affects how the browser normalizes path coordinates
// for animation. If we write to pathLength.baseVal while the element is
// detached, then re-attach, does it affect getPointAtLength() behavior?
//
// Also: SVGGeometryElement.isPointInFill() and isPointInStroke() — these
// compute geometric operations. If the path has been mutated via stale
// TearOff, do these operations work on stale data?
//
// Also: SVGAnimatedString (href, class, type) — these are string-typed
// SVGAnimated* attributes. Do they have TearOffs too?
// ═══════════════════════════════════════════════════════════════
suites['ADR132']=function(){
  L('ADR132: SVGPathElement pathLength + geometry ops after remove','info');
  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('viewBox','0 0 1000 1000');svg.setAttribute('width','200');svg.setAttribute('height','200');
  document.body.appendChild(svg);

  var path=document.createElementNS(SVG_NS,'path');
  path.setAttribute('d','M 0,0 C 200,400 500,-200 700,200 C 900,600 800,800 500,900 Z');
  path.setAttribute('pathLength','1000');// normalized path length
  svg.appendChild(path);

  var PL=path.pathLength.baseVal;
  L('ADR132: pathLength.value='+PL.value,'info');
  L('ADR132: getTotalLength()='+path.getTotalLength().toFixed(2),'info');

  var pt0=path.getPointAtLength(500);
  L('ADR132: getPointAtLength(500): x='+pt0.x.toFixed(2)+' y='+pt0.y.toFixed(2),'info');

  // Remove path
  svg.removeChild(path);

  // Stale write to pathLength
  var tPL=timeWrite(function(i){PL.value=i+55555;},'ADR132: pathLength.baseVal stale write',500);
  if(tPL>0.1) L('★★★ ADR132: pathLength.baseVal ALIVE after remove!','hit');
  L('ADR132: PL.value='+PL.value+' attr='+path.getAttribute('pathLength'),'info');

  // getTotalLength on detached path
  try{
    var tl=path.getTotalLength();
    L('ADR132: getTotalLength() on detached path: '+tl.toFixed(2),'info');
    // getPointAtLength on detached path
    var pt1=path.getPointAtLength(500);
    L('ADR132: getPointAtLength(500) on detached: x='+pt1.x.toFixed(2)+' y='+pt1.y.toFixed(2),'info');
  }catch(e){L('ADR132: geometry ops on detached threw: '+e.message,'warn');}

  // Re-attach with extreme pathLength
  svg.removeChild=function(){}; // reset if needed
  svg.appendChild(path);
  try{
    var tl2=path.getTotalLength();
    var pt2=path.getPointAtLength(500);
    L('ADR132: after re-attach with pathLength='+PL.value+': getTotalLength='+tl2.toFixed(2),'info');
    L('ADR132: getPointAtLength(500): x='+pt2.x.toFixed(2)+' y='+pt2.y.toFixed(2),'info');
  }catch(e){L('ADR132: geometry ops after re-attach threw: '+e.message,'warn');}

  // SVGAnimatedString probe (href on use element)
  var use=document.createElementNS(SVG_NS,'use');
  use.setAttribute('href','#someID');
  svg.appendChild(use);
  // SVGAnimatedString doesn't have a TearOff in the same way, but probe it
  L('ADR132: use.href type: '+(use.href?use.href.constructor.name:'null'),'info');
  if(use.href&&use.href.baseVal!==undefined){
    L('ADR132: use.href.baseVal='+use.href.baseVal,'info');
    svg.removeChild(use);
    try{
      use.href.baseVal='#newID';
      L('ADR132: use.href.baseVal after remove='+use.href.baseVal,'info');
    }catch(e){L('ADR132: href write threw: '+e.message,'warn');}
  }

  svg.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR133 — Detached svg + viewBox write + getComputedStyle
//
// From ADR120: viewBox write while detached propagates to DOM attribute.
// From ADR124: write while in DOM also works.
//
// Now: does the RENDERING ENGINE pick up the viewBox change
// while the element is in the document?
//
// Specifically:
// 1. Create svg with children, put in DOM
// 2. Write to viewBox.baseVal (in-DOM write per ADR124)
// 3. WITHOUT removing from DOM, check:
//    a. getComputedStyle on a child — does it reflect new viewport?
//    b. requestAnimationFrame timing — does layout update?
//    c. IntersectionObserver — does the child's intersection change?
//    d. ResizeObserver — does the svg resize notification fire?
//
// The goal: confirm this is a genuine in-DOM viewport manipulation.
// If it is, it means we can continuously script the viewBox in a
// rendering loop and distort child element coordinate spaces without
// calling setAttribute() (bypassing normal DOM APIs).
//
// Note: we already know setAttribute triggers the change (ADR124 confirmed).
// The question is whether the TearOff path vs setAttribute path differ
// in any observable way (timing, event dispatch, computed style update).
// ═══════════════════════════════════════════════════════════════
suites['ADR133']=function(){
  L('ADR133: in-DOM viewBox TearOff write — rendering engine response','info');
  var container=document.createElement('div');
  document.body.appendChild(container);

  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('width','200');svg.setAttribute('height','200');
  svg.setAttribute('viewBox','0 0 1000 1000');
  var child=document.createElementNS(SVG_NS,'rect');
  child.setAttribute('x','100');child.setAttribute('y','100');
  child.setAttribute('width','100');child.setAttribute('height','100');
  svg.appendChild(child);
  container.appendChild(svg);

  var VB=svg.viewBox.baseVal;
  var ctm0=child.getScreenCTM();
  L('ADR133: initial CTM.a='+ctm0.a.toFixed(4)+' e='+ctm0.e.toFixed(2),'info');

  // In-DOM write via TearOff (not setAttribute)
  VB.width=500;VB.height=500;// change viewBox while in DOM
  var attr1=svg.getAttribute('viewBox');
  var ctm1=child.getScreenCTM();
  L('ADR133: after TearOff write (in DOM): attr='+attr1,'info');
  L('ADR133: CTM after write: a='+ctm1.a.toFixed(4)+' e='+ctm1.e.toFixed(2),'info');
  if(Math.abs(ctm1.a-0.4)<0.01){
    L('★★★ ADR133: IN-DOM TEAROFF WRITE = LIVE VIEWPORT UPDATE!','hit');
    L('★★★ ADR133: CTM.a=0.4 = 200/500. Viewport remapped without setAttribute!','hit');
  }

  // Compare timing: TearOff write vs setAttribute
  var ITER=1000;
  var t0=performance.now();
  for(var i=0;i<ITER;i++){VB.width=500+i;VB.height=500+i;}
  var t1=performance.now();
  L('ADR133: TearOff write 1000x: '+(t1-t0).toFixed(2)+'ms ('+(((t1-t0)/ITER)*1000).toFixed(1)+'µs each)','info');

  t0=performance.now();
  for(var i=0;i<ITER;i++) svg.setAttribute('viewBox','0 0 '+(500+i)+' '+(500+i));
  t1=performance.now();
  L('ADR133: setAttribute 1000x: '+(t1-t0).toFixed(2)+'ms ('+(((t1-t0)/ITER)*1000).toFixed(1)+'µs each)','info');

  // Is there any difference in how events fire?
  // MutationObserver watching viewBox attribute changes
  var moFires=0;
  var mo=new MutationObserver(function(muts){moFires+=muts.length;});
  mo.observe(svg,{attributes:true,attributeFilter:['viewBox']});

  // TearOff writes
  for(var i=0;i<10;i++){VB.width=1000+i;VB.height=1000+i;}
  var moAfterTearOff=moFires;

  // setAttribute writes
  for(var i=0;i<10;i++) svg.setAttribute('viewBox','0 0 '+(1000+i)+' '+(1000+i));
  var moAfterSetAttr=moFires;

  // Check MO after delay (MO is microtask)
  setTimeout(function(){
    var moFinal=moFires;
    L('ADR133: MO fires: TearOff writes='+moAfterTearOff+' setAttribute writes='+moAfterSetAttr+' final='+moFinal,'info');
    if(moAfterTearOff>0){
      L('★★★ ADR133: MutationObserver FIRES on TearOff writes!','hit');
    }
    if(moAfterSetAttr>moAfterTearOff){
      L('★★★ ADR133: MO fires more for setAttribute than TearOff — different path!','hit');
    }
    mo.disconnect();
    container.remove();
  },100);
};
