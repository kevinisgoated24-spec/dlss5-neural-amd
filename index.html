};
var SVG_NS='http://www.w3.org/2000/svg';
function L(s,cls){var d=document.getElementById('out');var p=document.createElement('pre');if(cls)p.className=cls;p.textContent=s;d.appendChild(p);d.scrollTop=d.scrollHeight;}

}
function fb(text,toast){var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;top:-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast.style.opacity='1';setTimeout(function(){toast.style.opacity='0';},1500);}catch(e){}document.body.removeChild(ta);}
var suites={};
function runSuite(name){L('','');L('══ '+name+' ══════════════════════════════════','suite-hdr');try{suites[name]();}catch(e){L('[SUITE CRASH] '+name+': '+(e&&e.stack?e.stack:String(e)),'miss');}}
function runAll(){['ADR148','ADR149','ADR150','ADR151','ADR152','ADR153','ADR154'].forEach(function(n){runSuite(n);});}

// ═══════════════════════════════════════════════════════════════
// ADR148 — foreignObject INT32 overflow — threshold binary search
//
// v81 confirmed: fo.width=1e10 → getBCR.width=2147483648 (2^31)
// Now find the exact overflow threshold.
//
// Hypothesis: WebKit's foreignObject width layout code does:
//   int32_t w = (int32_t)svgWidth;
// where svgWidth is a CSS pixel value (double).
// - For svgWidth < 2^31: (int32_t)svgWidth works fine
// - For svgWidth >= 2^31 (2147483648): UB → 0x80000000 on ARM64
//   (which is INT_MIN = -2147483648, but getBCR returns abs value)
//
// OR: LayoutUnit is capped at max=33554431, but foreignObject bypasses
// this and uses a different int type.
//
// Key values to test:
//   33554432 = 2^25 (LayoutUnit max in px)
//   33554433 = LayoutUnit max + 1
//   2^26, 2^27, 2^28, 2^29, 2^30, 2^31-1, 2^31, 2^31+1
//
// Expected: some threshold T where:
//   fo.width < T → getBCR.width = fo.width (no overflow)
//   fo.width >= T → getBCR.width = some overflowed value
//
// Also: does the overflow happen at the getBCR reporting level
// (float->int32 in the measurement code)?
// Or does it happen in the actual layout?
// Test: write fo.width=2^31, then check getBCR of a div INSIDE fo
// that's 100% width. If divW=2^31 too → overflow is in actual layout.
// If divW=LayoutUnit::max → overflow is only in the reported value.
// ═══════════════════════════════════════════════════════════════
suites['ADR148']=function(){
  L('ADR148: foreignObject INT32 overflow — threshold binary search','info');
  var container=document.createElement('div');
  container.style.cssText='position:fixed;top:-9999px;left:-9999px;width:400px;height:400px;overflow:visible';
  document.body.appendChild(container);

  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('width','400');svg.setAttribute('height','400');
  svg.setAttribute('viewBox','0 0 400 400');
  container.appendChild(svg);

  var fo=document.createElementNS(SVG_NS,'foreignObject');
  fo.setAttribute('x','0');fo.setAttribute('y','0');
  fo.setAttribute('width','200');fo.setAttribute('height','200');
  svg.appendChild(fo);

  var div=document.createElement('div');
  div.style.cssText='width:100%;height:100%;background:green;overflow:visible';
  fo.appendChild(div);

  var FOW=fo.width.baseVal;

  // Probe specific power-of-2 boundaries
  var probes=[
    33554431,   // LayoutUnit max
    33554432,   // LayoutUnit max + 1 = 2^25
    33554433,
    67108864,   // 2^26
    134217728,  // 2^27
    268435456,  // 2^28
    536870912,  // 2^29
    1073741824, // 2^30
    2147483647, // INT32_MAX
    2147483648, // INT32_MAX + 1 = 2^31 (our overflow point)
    2147483649,
    4294967295, // UINT32_MAX
    4294967296, // 2^32
    1e10,       // our known overflow trigger
    1e15        // extreme
  ];

  for(var i=0;i<probes.length;i++){
    var v=probes[i];
    try{
      FOW.value=v;
      var foW=fo.getBoundingClientRect().width;
      var divW=div.getBoundingClientRect().width;
      var attr=fo.getAttribute('width');
      var overflow=(foW!==v&&foW>1e7)?'★OVERFLOW':'';
      L('ADR148: fo.w='+v+' → foW='+foW+' divW='+divW+' attr='+attr+' '+overflow,
        overflow?'hit':'info');
    }catch(e){L('ADR148: v='+v+' threw: '+e.message,'warn');}
  }

  // Binary search for exact overflow threshold
  L('ADR148: binary search for overflow threshold...','info');
  var lo=33554432;// LayoutUnit max
  var hi=2147483648;// known overflow
  var lastGood=lo;
  var lastBad=hi;
  for(var step=0;step<40&&hi-lo>1;step++){
    var mid=Math.floor((lo+hi)/2);
    FOW.value=mid;
    var w=fo.getBoundingClientRect().width;
    if(w===2147483648||w<0||!isFinite(w)||w>1e9){
      // overflow triggered
      lastBad=mid;
      hi=mid;
    }else{
      lastGood=mid;
      lo=mid;
    }
  }
  L('ADR148: overflow threshold: lastGood='+lastGood+' lastBad='+lastBad,'warn');
  L('ADR148: threshold ≈ '+lastBad+' (0x'+lastBad.toString(16)+')','warn');

  // At the threshold: check if div inside ALSO overflows
  FOW.value=lastBad;
  var foWfinal=fo.getBoundingClientRect().width;
  var divWfinal=div.getBoundingClientRect().width;
  L('ADR148: at threshold '+lastBad+': foW='+foWfinal+' divW='+divWfinal,'info');
  if(divWfinal>1e9){
    L('★★★ ADR148: div INSIDE fo also overflows! overflow is in layout, not just reporting','hit');
  }else{
    L('ADR148: div inside is clamped ('+divWfinal+') — overflow only in fo container reporting','info');
  }

  // Check if offsetWidth/offsetHeight sees the overflow too (integer property)
  FOW.value=1e10;
  L('ADR148: fo.offsetWidth type check','info');
  // offsetWidth is defined on HTML elements not SVG
  // But the div inside:
  L('ADR148: div.offsetWidth='+div.offsetWidth+' (expect 2^31 if overflow in layout)','info');
  L('ADR148: div.scrollWidth='+div.scrollWidth,'info');
  L('ADR148: div.clientWidth='+div.clientWidth,'info');

  container.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR149 — ADR146 crash isolation
//
// After convertToSpecifiedUnits throws "not supported" on a
// detached %-unit SVGLength, accessing any property on the TearOff
// crashed the suite.
//
// Isolate WHICH property access crashes:
//   RW.unitType
//   RW.value
//   RW.valueInSpecifiedUnits
//   RW.valueAsString
//
// Also: does .value assignment after the throw crash?
// Does convertToSpecifiedUnits itself crash, or only the subsequent read?
//
// The throw from convertToSpecifiedUnits may leave the C++ SVGLength
// object in a partial-write state. If the converter had already
// started writing the unit type before throwing, the length object
// holds inconsistent data (partially-converted unit type, no value).
//
// Test each property access independently with individual try/catch.
// ═══════════════════════════════════════════════════════════════
suites['ADR149']=function(){
  L('ADR149: ADR146 crash isolation — property access after throw','info');
  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('width','400');svg.setAttribute('height','400');
  document.body.appendChild(svg);

  function makeDetachedPctTearOff(){
    var rect=document.createElementNS(SVG_NS,'rect');
    rect.setAttribute('width','50%');rect.setAttribute('height','25%');
    svg.appendChild(rect);
    var tf=rect.width.baseVal;
    L('ADR149: initial: unitType='+tf.unitType+' value='+tf.value,'info');
    svg.removeChild(rect);// detach rect (svg stays in DOM)
    // Now try to convert
    var convertOk=false;
    try{tf.convertToSpecifiedUnits(5/*PX*/);convertOk=true;}
    catch(e){L('ADR149: convertToSpecifiedUnits threw: '+e.message,'info');}
    if(convertOk){L('ADR149: convert succeeded (unexpected)','warn');}
    return tf;
  }

  // Test 1: read unitType after throw
  L('ADR149[T1]: reading .unitType after throw...','info');
  try{
    var tf1=makeDetachedPctTearOff();
    var ut=tf1.unitType;
    L('ADR149[T1]: .unitType OK: '+ut,'info');
  }catch(e){L('ADR149[T1]: .unitType CRASHED: '+e.message,'miss');}

  // Test 2: read value after throw
  L('ADR149[T2]: reading .value after throw...','info');
  try{
    var tf2=makeDetachedPctTearOff();
    var v=tf2.value;
    L('ADR149[T2]: .value OK: '+v,'info');
  }catch(e){L('ADR149[T2]: .value CRASHED: '+e.message,'miss');}

  // Test 3: read valueInSpecifiedUnits after throw
  L('ADR149[T3]: reading .valueInSpecifiedUnits after throw...','info');
  try{
    var tf3=makeDetachedPctTearOff();
    var vis=tf3.valueInSpecifiedUnits;
    L('ADR149[T3]: .valueInSpecifiedUnits OK: '+vis,'info');
  }catch(e){L('ADR149[T3]: .valueInSpecifiedUnits CRASHED: '+e.message,'miss');}

  // Test 4: read valueAsString after throw
  L('ADR149[T4]: reading .valueAsString after throw...','info');
  try{
    var tf4=makeDetachedPctTearOff();
    var vas=tf4.valueAsString;
    L('ADR149[T4]: .valueAsString OK: '+vas,'info');
  }catch(e){L('ADR149[T4]: .valueAsString CRASHED: '+e.message,'miss');}

  // Test 5: write .value after throw
  L('ADR149[T5]: writing .value=100 after throw...','info');
  try{
    var tf5=makeDetachedPctTearOff();
    tf5.value=100;
    L('ADR149[T5]: .value=100 write OK. readback='+tf5.value,'info');
  }catch(e){L('ADR149[T5]: .value write CRASHED: '+e.message,'miss');}

  // Test 6: write .valueInSpecifiedUnits after throw
  L('ADR149[T6]: writing .valueInSpecifiedUnits=100 after throw...','info');
  try{
    var tf6=makeDetachedPctTearOff();
    tf6.valueInSpecifiedUnits=100;
    L('ADR149[T6]: .valueInSpecifiedUnits=100 write OK','info');
  }catch(e){L('ADR149[T6]: .valueInSpecifiedUnits write CRASHED: '+e.message,'miss');}

  // Test 7: newValueSpecifiedUnits after throw
  L('ADR149[T7]: newValueSpecifiedUnits(PX,100) after throw...','info');
  try{
    var tf7=makeDetachedPctTearOff();
    tf7.newValueSpecifiedUnits(5/*PX*/,100);
    L('ADR149[T7]: newValueSpecifiedUnits OK. value='+tf7.value,'info');
  }catch(e){L('ADR149[T7]: newValueSpecifiedUnits CRASHED: '+e.message,'miss');}

  // Test 8: convert to different type (not PX) after throw — e.g. convert to CM
  L('ADR149[T8]: convertToSpecifiedUnits(CM=6) after throw...','info');
  try{
    var tf8=makeDetachedPctTearOff();
    tf8.convertToSpecifiedUnits(6/*CM*/);
    L('ADR149[T8]: convert(CM) OK. value='+tf8.value,'info');
  }catch(e){L('ADR149[T8]: convert(CM) CRASHED: '+e.message,'miss');}

  // Test 9: call convertToSpecifiedUnits TWICE (second call after first throw)
  L('ADR149[T9]: convert twice on same TearOff...','info');
  try{
    var tf9=makeDetachedPctTearOff();
    // tf9 already threw once in makeDetachedPctTearOff
    // Try again:
    try{tf9.convertToSpecifiedUnits(5/*PX*/);}catch(e2){}
    L('ADR149[T9]: second convert also threw (or silently ok). checking value...','info');
    L('ADR149[T9]: unitType='+tf9.unitType,'info');
  }catch(e){L('ADR149[T9]: CRASHED on second convert: '+e.message,'miss');}

  svg.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR150 — filter.x/width/height with PX unit (not %)
//
// v81: filter.x was DEAD because attr="-10%" (% unit).
// The TearOff for %-unit SVGAnimatedLength may be dead on detached elements.
// But PX-unit TearOffs are alive (ADR130 confirmed).
//
// Set filter attributes as PX values, then test TearOff.
// Also: SVGFilterElement has primitiveUnits and filterUnits as SVGAnimatedEnumeration
// (not SVGAnimatedLength) — skip those, focus on x/y/width/height.
//
// Also: feGaussianBlur.stdDeviation — is it SVGAnimatedNumber? test it.
// Also: feOffset.dx/dy — SVGAnimatedNumber (not Length), but test alive.
// ═══════════════════════════════════════════════════════════════
suites['ADR150']=function(){
  L('ADR150: filter.x/width/height with PX unit — alive after remove?','info');
  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('width','400');svg.setAttribute('height','400');
  document.body.appendChild(svg);
  var defs=document.createElementNS(SVG_NS,'defs');
  svg.appendChild(defs);

  function testLen(label,el,getTF,attrName){
    defs.appendChild(el);
    var tf;try{tf=getTF(el);}catch(e){L(label+': getTF threw: '+e.message,'warn');el.remove();return;}
    if(!tf||typeof tf.value==='undefined'){L(label+': no .value (type: '+(tf?tf.constructor.name:'null')+')','info');el.remove();return;}
    var v0=tf.value;
    defs.removeChild(el);
    var t0=performance.now();
    for(var i=0;i<5000;i++){try{tf.value=100+i;}catch(e){break;}}
    var t1=performance.now();
    var ms=(t1-t0).toFixed(2);
    var attrV=attrName?el.getAttribute(attrName):'n/a';
    L(label+': '+ms+'ms '+(parseFloat(ms)>0.1?'★ALIVE ':'     ')+'attr='+attrV,
      parseFloat(ms)>0.1?'hit':'info');
  }

  function testNum(label,el,getTF,attrName){
    defs.appendChild(el);
    var tf;try{tf=getTF(el);}catch(e){L(label+': getTF threw: '+e.message,'warn');el.remove();return;}
    if(tf===undefined||tf===null){L(label+': property is null/undefined','info');el.remove();return;}
    if(typeof tf==='object'&&tf.baseVal!==undefined){
      // SVGAnimatedNumber
      var v0=tf.baseVal;
      defs.removeChild(el);
      var t0=performance.now();
      for(var i=0;i<5000;i++){try{tf.baseVal=100+i;}catch(e){break;}}
      var t1=performance.now();
      var ms=(t1-t0).toFixed(2);
      var attrV=attrName?el.getAttribute(attrName):'n/a';
      L(label+' (AnimNum): '+ms+'ms '+(parseFloat(ms)>0.1?'★ALIVE ':'     ')+'attr='+attrV,
        parseFloat(ms)>0.1?'hit':'info');
    }else{
      L(label+': type='+typeof tf+' val='+tf,'info');
      el.remove();
    }
  }

  // SVGFilterElement with PX values
  var fPX1=document.createElementNS(SVG_NS,'filter');
  fPX1.setAttribute('id','fPX1');fPX1.setAttribute('x','-50');fPX1.setAttribute('y','-50');
  fPX1.setAttribute('width','500');fPX1.setAttribute('height','500');
  fPX1.setAttribute('filterUnits','userSpaceOnUse');
  testLen('filter.x(px)',     fPX1,function(e){return e.x.baseVal;},     'x');

  var fPX2=document.createElementNS(SVG_NS,'filter');
  fPX2.setAttribute('id','fPX2');fPX2.setAttribute('width','500');fPX2.setAttribute('height','500');
  fPX2.setAttribute('filterUnits','userSpaceOnUse');
  testLen('filter.width(px)', fPX2,function(e){return e.width.baseVal;}, 'width');

  var fPX3=document.createElementNS(SVG_NS,'filter');
  fPX3.setAttribute('id','fPX3');fPX3.setAttribute('width','500');fPX3.setAttribute('height','500');
  fPX3.setAttribute('filterUnits','userSpaceOnUse');
  testLen('filter.height(px)',fPX3,function(e){return e.height.baseVal;},'height');

  // mask with PX values
  var mPX1=document.createElementNS(SVG_NS,'mask');
  mPX1.setAttribute('id','mPX1');mPX1.setAttribute('x','0');mPX1.setAttribute('y','0');
  mPX1.setAttribute('width','400');mPX1.setAttribute('height','400');
  mPX1.setAttribute('maskUnits','userSpaceOnUse');
  testLen('mask.x(px)',      mPX1,function(e){return e.x.baseVal;},     'x');

  var mPX2=document.createElementNS(SVG_NS,'mask');
  mPX2.setAttribute('id','mPX2');mPX2.setAttribute('width','400');mPX2.setAttribute('height','400');
  mPX2.setAttribute('maskUnits','userSpaceOnUse');
  testLen('mask.width(px)',  mPX2,function(e){return e.width.baseVal;}, 'width');

  // feGaussianBlur.stdDeviation — SVGAnimatedNumber? SVGAnimatedNumberList?
  var fGauss=document.createElementNS(SVG_NS,'filter');
  fGauss.setAttribute('id','fG1');
  defs.appendChild(fGauss);
  var gauss=document.createElementNS(SVG_NS,'feGaussianBlur');
  gauss.setAttribute('stdDeviation','5');
  fGauss.appendChild(gauss);
  L('ADR150: feGaussianBlur.stdDeviation type: '+(gauss.stdDeviation?gauss.stdDeviation.constructor.name:'undefined'),'info');
  if(gauss.stdDeviation&&gauss.stdDeviation.baseVal!==undefined){
    var gSD=gauss.stdDeviation;
    defs.removeChild(fGauss);
    var t0=performance.now();
    for(var i=0;i<5000;i++){try{gSD.baseVal=5+i;}catch(e){break;}}
    var t1=performance.now();
    L('ADR150: feGaussianBlur.stdDeviation: '+(t1-t0).toFixed(2)+'ms attr='+gauss.getAttribute('stdDeviation'),
      (t1-t0)>0.1?'hit':'info');
  }else{
    defs.removeChild(fGauss);
  }

  // feOffset.dx — SVGAnimatedNumber
  var fOff=document.createElementNS(SVG_NS,'filter');
  fOff.setAttribute('id','fO1');
  defs.appendChild(fOff);
  var feOff=document.createElementNS(SVG_NS,'feOffset');
  feOff.setAttribute('dx','10');feOff.setAttribute('dy','10');
  fOff.appendChild(feOff);
  L('ADR150: feOffset.dx type: '+(feOff.dx?feOff.dx.constructor.name:'undefined'),'info');
  if(feOff.dx&&typeof feOff.dx.baseVal==='number'){
    var dxRef=feOff.dx;
    defs.removeChild(fOff);
    var t0=performance.now();
    for(var i=0;i<5000;i++){try{dxRef.baseVal=10+i;}catch(e){break;}}
    var t1=performance.now();
    L('ADR150: feOffset.dx: '+(t1-t0).toFixed(2)+'ms attr='+feOff.getAttribute('dx'),
      (t1-t0)>0.1?'hit':'info');
  }else{
    defs.removeChild(fOff);
  }

  svg.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR151 — pattern tile corruption via TearOff
//
// pattern.width/height are ALIVE (v81).
// If pattern.width = 1e10, the tile is theoretically 1e10 user units wide.
// For a rect with fill="url(#p)", the pattern would be drawn starting
// at (0,0) with a 1e10-unit-wide tile → effectively the whole rect
// shows only the part of the pattern that overlaps the rect's bounds.
//
// More interesting: pattern.width = 0 or -1 → what happens?
//   width=0: pattern tile is 0 wide → division by zero? crash?
//   width=-1: negative tile width → infinite loop? undefined behavior?
//
// Also: pattern.width=1 (tiny tile) → pattern renders with 1px tiles
// (heavy GPU load). Then immediately write pattern.width=1e10 →
// does the rendering engine use the old allocation size with new geometry?
// ═══════════════════════════════════════════════════════════════
suites['ADR151']=function(){
  L('ADR151: pattern tile corruption via TearOff write','info');
  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('width','300');svg.setAttribute('height','300');
  document.body.appendChild(svg);
  var defs=document.createElementNS(SVG_NS,'defs');
  svg.appendChild(defs);

  var pat=document.createElementNS(SVG_NS,'pattern');
  pat.setAttribute('id','testPat');pat.setAttribute('x','0');pat.setAttribute('y','0');
  pat.setAttribute('width','20');pat.setAttribute('height','20');
  pat.setAttribute('patternUnits','userSpaceOnUse');
  defs.appendChild(pat);

  var patRect=document.createElementNS(SVG_NS,'rect');
  patRect.setAttribute('x','0');patRect.setAttribute('y','0');
  patRect.setAttribute('width','20');patRect.setAttribute('height','10');
  patRect.setAttribute('fill','#00ff88');

  // Target rect filled with pattern
  var target=document.createElementNS(SVG_NS,'rect');
  target.setAttribute('x','0');target.setAttribute('y','0');
  target.setAttribute('width','300');target.setAttribute('height','300');
  target.setAttribute('fill','url(#testPat)');
  svg.appendChild(target);

  var PW=pat.width.baseVal;
  var PH=pat.height.baseVal;

  L('ADR151: initial pattern size: '+PW.value+'x'+PH.value,'info');

  // Remove pattern from defs, hold TearOff
  defs.removeChild(pat);
  L('ADR151: pattern removed from defs — writing via TearOff','info');

  // Write extreme values
  PW.value=1e10;PH.value=1e10;
  L('ADR151: wrote pattern.width=1e10 height=1e10','info');
  L('ADR151: getAttribute(width)='+pat.getAttribute('width'),'info');

  // Write zero
  PW.value=0;PH.value=0;
  L('ADR151: wrote pattern.width=0 height=0','info');
  L('ADR151: getAttribute after zero: w='+pat.getAttribute('width'),'info');

  // Write negative
  try{
    PW.value=-1;PH.value=-1;
    L('ADR151: wrote pattern.width=-1 height=-1','info');
    L('ADR151: getAttribute after negative: w='+pat.getAttribute('width'),'info');
  }catch(e){L('ADR151: negative write threw: '+e.message,'warn');}

  // Re-attach pattern to defs and check rendering
  PW.value=1;PH.value=1;// 1px tiles
  defs.appendChild(pat);
  L('ADR151: pattern re-attached with 1x1 tiles','info');
  L('ADR151: target getBCR: w='+target.getBoundingClientRect().width.toFixed(1),'info');

  // Now write extreme via TearOff while pattern is back in defs
  PW.value=1e10;
  L('ADR151: wrote pattern.width=1e10 WHILE IN DEFS','info');
  L('ADR151: getAttribute after in-defs write: w='+pat.getAttribute('width'),'info');

  // Write to pattern tile inner rect TearOff
  var PR_W=patRect.width.baseVal;
  L('ADR151: patRect inner: TearOff alive? writing 9999...','info');
  PR_W.value=9999;
  L('ADR151: patRect getAttribute(width)='+patRect.getAttribute('width'),'info');

  svg.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR152 — setAttribute vs TearOff for fo.width=1e10
//
// v81 showed: TearOff fo.width=1e10 → foW=2147483648 (INT32 overflow)
//
// Does setAttribute('width','1e10') produce the same overflow?
// If NOT → the TearOff path does something setAttribute doesn't:
//   - TearOff writes a raw double into the SVGLength object
//   - setAttribute parses the string "1e10" → then also sets the SVGLength
// These should be the same at the C++ SVGLength level.
//
// But: TearOff bypasses MutationObserver (confirmed v80).
// Does setAttribute also bypass the LayoutUnit clamp in foreignObject layout?
//
// Also: if setAttribute overflows the same way, then the overflow is in
// the LAYOUT code (foreignObject box model), not in the TearOff write path.
// This would mean ANY way of setting fo.width to a large value overflows.
// ═══════════════════════════════════════════════════════════════
suites['ADR152']=function(){
  L('ADR152: setAttribute vs TearOff for fo.width overflow comparison','info');
  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('width','400');svg.setAttribute('height','400');
  svg.setAttribute('viewBox','0 0 400 400');
  document.body.appendChild(svg);

  var fo=document.createElementNS(SVG_NS,'foreignObject');
  fo.setAttribute('x','0');fo.setAttribute('y','0');
  fo.setAttribute('width','200');fo.setAttribute('height','200');
  svg.appendChild(fo);
  var div=document.createElement('div');
  div.style.cssText='width:100%;height:100%';
  fo.appendChild(div);

  // Baseline
  L('ADR152: baseline foW='+fo.getBoundingClientRect().width.toFixed(1),'info');

  // Test 1: setAttribute with string "10000000000"
  fo.setAttribute('width','10000000000');
  var foW_SA=fo.getBoundingClientRect().width;
  var divW_SA=div.getBoundingClientRect().width;
  L('ADR152[setAttribute]: foW='+foW_SA+' divW='+divW_SA,'info');
  if(foW_SA>1e9){L('★★★ ADR152[setAttribute]: ALSO OVERFLOWS via setAttribute!','hit');}

  // Test 2: TearOff
  fo.setAttribute('width','200');// reset
  var FOW=fo.width.baseVal;
  FOW.value=1e10;
  var foW_TF=fo.getBoundingClientRect().width;
  var divW_TF=div.getBoundingClientRect().width;
  L('ADR152[TearOff]: foW='+foW_TF+' divW='+divW_TF,'info');

  // Compare
  if(foW_SA===foW_TF){
    L('ADR152: setAttribute and TearOff produce IDENTICAL overflow value','info');
    L('ADR152: overflow is in LAYOUT CODE (not TearOff-specific)','info');
  }else{
    L('★★★ ADR152: DIFFERENT overflow values! setAttribute='+foW_SA+' TearOff='+foW_TF,'hit');
    L('★★★ ADR152: TearOff-specific code path produces different overflow','hit');
  }

  // Test 3: try CSS width on the fo's HTML wrapper — not the SVG attribute
  fo.setAttribute('width','200');
  fo.style.width='10000000000px';// CSS inline style
  var foW_CSS=fo.getBoundingClientRect().width;
  var divW_CSS=div.getBoundingClientRect().width;
  L('ADR152[CSS style]: foW='+foW_CSS+' divW='+divW_CSS,'info');
  fo.style.width='';

  // Test 4: fo.width=2^31-1 (just below overflow) vs 2^31 (overflow)
  var INT32_MAX=2147483647;
  FOW.value=INT32_MAX;
  var foW_below=fo.getBoundingClientRect().width;
  L('ADR152[2^31-1]: foW='+foW_below,'info');

  FOW.value=2147483648;
  var foW_at=fo.getBoundingClientRect().width;
  L('ADR152[2^31]: foW='+foW_at,'info');
  if(foW_below!==foW_at&&foW_at>foW_below){L('ADR152: discrete jump at 2^31','info');}
  if(foW_at===0||foW_at<0){L('★★★ ADR152: WRAPPED TO ZERO/NEGATIVE at 2^31!','hit');}

  svg.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR153 — hit-test corruption at 2^31 position
//
// v81: fo.x=1e10 → getBCR.x=2147483648 (2^31)
// This means the layout engine thinks the foreignObject is at x=2^31.
//
// If hit-testing uses the same overflowed integer coordinate,
// then clicking at screen coordinates (0,0) might match the
// foreignObject (whose layout x coordinate = 2^31 = 0 in int32).
//
// Test: place fo at x=1e10 (will overflow to 2^31).
// Put a button inside. Check if document.elementFromPoint(0, y)
// returns the foreignObject or its children.
//
// Also: elementFromPoint with negative coordinates / huge coordinates.
// ═══════════════════════════════════════════════════════════════
suites['ADR153']=function(){
  L('ADR153: hit-test corruption at INT32 overflow position','info');
  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('width','400');svg.setAttribute('height','400');
  svg.setAttribute('viewBox','0 0 400 400');
  // Position svg at a known location
  svg.style.cssText='position:fixed;top:0;left:0';

  var fo=document.createElementNS(SVG_NS,'foreignObject');

  fo.setAttribute('width','200');fo.setAttribute('height','200');

  var inner=document.createElement('div');
  inner.id='hitTest153';
  inner.style.cssText='width:200px;height:200px;background:rgba(255,0,0,0.5);position:relative';
  inner.textContent='HIT TARGET';
  fo.appendChild(inner);

  // Baseline: elementFromPoint at (100,100) should find the div
  var el0=document.elementFromPoint(100,100);
  L('ADR153: baseline elementFromPoint(100,100)='+
    (el0?el0.tagName+(el0.id?'#'+el0.id:''):'null'),'info');

  // Now move fo to x=1e10 via TearOff (will overflow to 2^31)
  var FOX=fo.x.baseVal;
  FOX.value=1e10;
  L('ADR153: moved fo.x=1e10 via TearOff','info');
  L('ADR153: getAttribute(x)='+fo.getAttribute('x'),'info');
  var foX=fo.getBoundingClientRect().x;
  L('ADR153: getBCR.x='+foX+' (expected 2147483648?)','info');

  // Check if elementFromPoint at (100,100) still finds the inner div
  var el1=document.elementFromPoint(100,100);
  L('ADR153: after overflow, elementFromPoint(100,100)='+
    (el1?el1.tagName+(el1.id?'#'+el1.id:''):'null'),'info');
  if(el1&&(el1===inner||el1.id==='hitTest153')){
    L('★★★ ADR153: HIT TEST FOUND inner div at (100,100) even though fo.x=2^31!','hit');
    L('★★★ ADR153: hit-test uses OVERFLOWED coordinate → ghost click at (100,100)','hit');
  }

  // Try elementFromPoint at INT32 coordinates
  var el2=document.elementFromPoint(-2147483648,100);
  L('ADR153: elementFromPoint(-2^31,100)='+
    (el2?el2.tagName+(el2.id?'#'+el2.id:''):'null'),'info');

  // Try elementFromPoint at 0,0

    (el3?el3.tagName+(el3.id?'#'+el3.id:''):'null'),'info');

// ═══════════════════════════════════════════════════════════════
// ADR154 — right-edge wrap: x + width = 2^32 = 0?
//
// If fo.x = 2^31 (from TearOff x=1e10) and fo.width = 2^31 (from TearOff width=1e10),
// then in int32 arithmetic: right = x + width = 2^31 + 2^31 = 2^32 → wraps to 0.
//
// This means the right edge of the foreignObject layout box = 0.
// In WebKit, layout boxes compute: right = x + width. If both x and width
// overflow to 2^31 each, and right = (int32)(2^31 + 2^31) = 0.
//
// This creates a layout box where:
//   left  = 2^31 (or -2^31 in signed)
//   right = 0
//   width = 0 - 2^31 = -2^31 (negative width!)
//
// Or alternatively: if WebKit uses unsigned 32-bit internally for coordinates,
//   left  = 0x80000000
//   right = 0x00000000 (overflow wraps)
//   width = 0x80000000 (huge)
//
// Test: set both fo.x AND fo.width to 1e10 via TearOff.
// Check if getBCR.right wraps in an interesting way.
// Check if div inside has a right edge at position 0.
// ═══════════════════════════════════════════════════════════════
suites['ADR154']=function(){
  L('ADR154: right-edge wrap — fo.x=1e10 + fo.width=1e10 → right=2^32=0?','info');
  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('width','400');svg.setAttribute('height','400');
  svg.setAttribute('viewBox','0 0 400 400');
  document.body.appendChild(svg);

  var fo=document.createElementNS(SVG_NS,'foreignObject');
  fo.setAttribute('x','0');fo.setAttribute('y','0');
  fo.setAttribute('width','200');fo.setAttribute('height','200');
  svg.appendChild(fo);

  var div=document.createElement('div');
  div.style.cssText='width:100%;height:100%;background:blue';
  fo.appendChild(div);

  // Baseline
  var bb0=fo.getBoundingClientRect();
  L('ADR154: baseline: x='+bb0.x+' w='+bb0.width+' right='+bb0.right,'info');

  var FOX=fo.x.baseVal;
  var FOW=fo.width.baseVal;

  // Set both to 1e10
  FOX.value=1e10;
  FOW.value=1e10;
  L('ADR154: wrote fo.x=1e10, fo.width=1e10 via TearOff','info');

  var bb1=fo.getBoundingClientRect();
  var dbcr=div.getBoundingClientRect();
  L('ADR154: fo BCR: x='+bb1.x+' w='+bb1.width+' right='+bb1.right,'info');
  L('ADR154: div BCR: x='+dbcr.x+' w='+dbcr.width+' right='+dbcr.right,'info');

  // Is the right = 0?
  if(bb1.right===0||bb1.right<bb1.x){
    L('★★★ ADR154: RIGHT EDGE WRAP! right='+bb1.right+' (wraps past zero)','hit');
  }

  // Is the right = 2^32 = 4294967296?
  if(Math.abs(bb1.right-4294967296)<1000){
    L('★★★ ADR154: right≈2^32 (unsigned wrap)', 'hit');
  }

  // What if we set only x to 1e10, width to normal?
  FOX.value=1e10;FOW.value=200;
  var bb2=fo.getBoundingClientRect();
  L('ADR154: x=1e10 w=200: x='+bb2.x+' w='+bb2.width+' right='+bb2.right,'info');

  // What if x=0 and we set only width to 1e10?
  FOX.value=0;FOW.value=1e10;
  var bb3=fo.getBoundingClientRect();
  L('ADR154: x=0 w=1e10: x='+bb3.x+' w='+bb3.width+' right='+bb3.right,'info');

  // Try x=2^31-1 (INT32_MAX), width=1 → right = 2^31 → overflows?
  FOX.value=2147483647;FOW.value=1;
  var bb4=fo.getBoundingClientRect();
  L('ADR154: x=INT32_MAX w=1: x='+bb4.x+' w='+bb4.width+' right='+bb4.right,'info');

  // Try x=2^30, width=2^30 → right = 2^31 → at the exact overflow boundary
  FOX.value=1073741824;FOW.value=1073741824;
  var bb5=fo.getBoundingClientRect();
  L('ADR154: x=2^30 w=2^30: x='+bb5.x+' w='+bb5.width+' right='+bb5.right,'info');
  if(bb5.right<0||bb5.right===0){L('★★★ ADR154: right wraps at x+w=2^31!','hit');}

  svg.remove();
};
