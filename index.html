<!DOCTYPE html>

<title>SVG UAF v80 — ADR127 crash isolation + ADR133 bypass deep probe</title>
<style>
*{box-sizing:border-box}
body{background:#0a0a0a;color:#e0e0e0;font-family:monospace;font-size:12px;padding:12px;margin:0}

<body>
<h2>SVG UAF v80 — ADR127 crash isolation + observer bypass deep probe</h2>
<div id="controls">
  <button class="run-all" onclick="runAll()">▶ Run All</button>
  <button onclick="runSuite('ADR134')">ADR134: convertToSpecifiedUnits crash — exact conditions + recovery</button>
  <button onclick="runSuite('ADR135')">ADR135: % SVGLength chain — all unit types that need context</button>
  <button onclick="runSuite('ADR136')">ADR136: TearOff bypass — ResizeObserver, custom element callback</button>
  <button onclick="runSuite('ADR137')">ADR137: TearOff bypass — attributeChangedCallback on custom SVG element</button>
  <button onclick="runSuite('ADR138')">ADR138: TearOff bypass — :attr() CSS selector response</button>
  <button onclick="runSuite('ADR139')">ADR139: huge-child float32 clamping — 33554432 boundary probe</button>
  <button onclick="runSuite('ADR140')">ADR140: all SVGAnimatedLength TearOffs — full alive map (5000 iters)</button>
  <button class="copy-btn" onclick="copyAll()">⎘ Copy All</button>
  <button class="clear-btn" onclick="clearOut()">✕ Clear</button>
</div>
<div id="out"></div>
<div id="copy-toast">Copied!</div>
<script>
window.onerror=function(msg,src,line,col,err){
  var d=document.getElementById('out');if(d){var p=document.createElement('pre');p.className='miss';p.textContent='[GLOBAL ERR] '+msg+' @ line '+line+(err&&err.stack?'\n'+err.stack:'');d.appendChild(p);d.scrollTop=d.scrollHeight;}return false;
};
var SVG_NS='http://www.w3.org/2000/svg';
function L(s,cls){var d=document.getElementById('out');var p=document.createElement('pre');if(cls)p.className=cls;p.textContent=s;d.appendChild(p);d.scrollTop=d.scrollHeight;}
function clearOut(){document.getElementById('out').innerHTML='';}
function copyAll(){
  var lines=document.getElementById('out').querySelectorAll('pre');
  var text=Array.from(lines).map(function(p){return p.textContent;}).join('\n');
  var toast=document.getElementById('copy-toast');
  try{navigator.clipboard.writeText(text).then(function(){toast.style.opacity='1';setTimeout(function(){toast.style.opacity='0';},1500);}).catch(function(){fb(text,toast);});}catch(e){fb(text,toast);}
}
function fb(text,toast){var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;top:-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast.style.opacity='1';setTimeout(function(){toast.style.opacity='0';},1500);}catch(e){}document.body.removeChild(ta);}
var suites={};
function runSuite(name){L('','');L('══ '+name+' ══════════════════════════════════','suite-hdr');try{suites[name]();}catch(e){L('[SUITE CRASH] '+name+': '+(e&&e.stack?e.stack:String(e)),'miss');}}
function runAll(){['ADR134','ADR135','ADR136','ADR137','ADR138','ADR139','ADR140'].forEach(function(n){runSuite(n);});}

// SVGLength unit type constants
var SVG_LENGTHTYPE_UNKNOWN=0,SVG_LENGTHTYPE_NUMBER=1,SVG_LENGTHTYPE_PERCENTAGE=2,
    SVG_LENGTHTYPE_EMS=3,SVG_LENGTHTYPE_EXS=4,SVG_LENGTHTYPE_PX=5,
    SVG_LENGTHTYPE_CM=6,SVG_LENGTHTYPE_MM=7,SVG_LENGTHTYPE_IN=8,
    SVG_LENGTHTYPE_PT=9,SVG_LENGTHTYPE_PC=10;

// ═══════════════════════════════════════════════════════════════
// ADR134 — convertToSpecifiedUnits CRASH isolation
//
// v79 ADR127 crashed at the `convertToSpecifiedUnits(PX)` call on a
// detached element whose SVGLength was in PERCENTAGE unit type.
//
// The crash happened because:
//   %→px conversion = value_in_percent * referenceLength / 100
//   referenceLength comes from the SVG viewport
//   When element is detached, the viewport context is null or dead
//   WebKit accesses a null pointer → crash
//
// Now we need to precisely characterize:
// 1. WHICH removal triggers it? removeChild(rect) vs removeChild(svg)?
// 2. Does moving rect to another svg help?
// 3. Can we catch it with try/catch (is it a JS exception or a real crash)?
// 4. Does the crash produce a bad value we can read before it throws?
// 5. Is it reproducible? (try 10 times in a row)
// 6. Does a % width SVGLength on an INNER svg crash when outer svg is removed?
// 7. What about PERCENTAGE for non-width attributes (cx, cy as %, rx as %)?
// ═══════════════════════════════════════════════════════════════
suites['ADR134']=function(){
  L('ADR134: convertToSpecifiedUnits crash — isolation + reproducibility','info');

  // Test 1: rect removed from svg, but svg stays in DOM
  (function(){
    var svg=document.createElementNS(SVG_NS,'svg');
    svg.setAttribute('width','400');svg.setAttribute('height','300');
    document.body.appendChild(svg);
    var rect=document.createElementNS(SVG_NS,'rect');
    rect.setAttribute('width','50%');rect.setAttribute('height','25%');
    rect.setAttribute('x','0');rect.setAttribute('y','0');
    svg.appendChild(rect);
    var RW=rect.width.baseVal;
    L('ADR134[T1]: RW.unitType='+RW.unitType+' value='+RW.value,'info');
    svg.removeChild(rect);// rect detached but svg still in DOM
    L('ADR134[T1]: rect removed (svg in DOM)','info');
    try{
      RW.convertToSpecifiedUnits(SVG_LENGTHTYPE_PX);
      L('ADR134[T1]: convert(%→PX) OK: unitType='+RW.unitType+' vis='+RW.valueInSpecifiedUnits+' value='+RW.value,'info');
      if(!isFinite(RW.value)||isNaN(RW.value)){
        L('★★★ ADR134[T1]: GARBAGE VALUE after convert: value='+RW.value,'hit');
      }
    }catch(e){
      L('ADR134[T1]: convert threw: '+e.message,'warn');
      if(e.message===''){L('★★★ ADR134[T1]: EMPTY ERROR — likely null deref caught as JS exception','hit');}
    }
    svg.remove();
  })();

  // Test 2: entire svg removed from DOM (same as v79 scenario)
  (function(){
    var svg=document.createElementNS(SVG_NS,'svg');
    svg.setAttribute('width','400');svg.setAttribute('height','300');
    document.body.appendChild(svg);
    var rect=document.createElementNS(SVG_NS,'rect');
    rect.setAttribute('width','50%');rect.setAttribute('height','25%');
    rect.setAttribute('x','0');rect.setAttribute('y','0');
    svg.appendChild(rect);
    var RW=rect.width.baseVal;
    document.body.removeChild(svg);// entire svg removed
    L('ADR134[T2]: svg removed from body','info');
    try{
      RW.convertToSpecifiedUnits(SVG_LENGTHTYPE_PX);
      L('ADR134[T2]: convert(%→PX) OK: unitType='+RW.unitType+' vis='+RW.valueInSpecifiedUnits+' value='+RW.value,'info');
      if(!isFinite(RW.value)||isNaN(RW.value)){
        L('★★★ ADR134[T2]: GARBAGE VALUE: value='+RW.value,'hit');
      }
    }catch(e){
      L('ADR134[T2]: convert threw: '+e.message,'warn');
    }
    svg.remove();
  })();

  // Test 3: value before convert — read the % value BEFORE attempting PX convert
  // Does reading .value itself crash? Or only convertToSpecifiedUnits?
  (function(){
    var svg=document.createElementNS(SVG_NS,'svg');
    svg.setAttribute('width','400');svg.setAttribute('height','300');
    document.body.appendChild(svg);
    var rect=document.createElementNS(SVG_NS,'rect');
    rect.setAttribute('width','75%');rect.setAttribute('height','10%');
    svg.appendChild(rect);
    var RW=rect.width.baseVal;
    document.body.removeChild(svg);
    L('ADR134[T3]: RW.value after detach (still %): '+RW.value,'info');// does reading .value crash?
    L('ADR134[T3]: RW.valueInSpecifiedUnits='+RW.valueInSpecifiedUnits,'info');// vis stays at 75
    L('ADR134[T3]: RW.unitType='+RW.unitType,'info');// still 2?
    // Now write a new % value (no conversion, just store new %)
    try{
      RW.newValueSpecifiedUnits(SVG_LENGTHTYPE_PERCENTAGE, 999);
      L('ADR134[T3]: newValueSpecifiedUnits(%, 999): vis='+RW.valueInSpecifiedUnits+' value='+RW.value,'info');
    }catch(e){L('ADR134[T3]: newValueSpecifiedUnits threw: '+e.message,'warn');}
    svg.remove();
  })();

  // Test 4: repeatability — crash 10x, does it always crash or sometimes return garbage?
  var crashes=0,goodVals=0,badVals=0;
  for(var i=0;i<10;i++){
    var svg=document.createElementNS(SVG_NS,'svg');
    svg.setAttribute('width','400');svg.setAttribute('height','300');
    document.body.appendChild(svg);
    var rect=document.createElementNS(SVG_NS,'rect');
    rect.setAttribute('width','50%');rect.setAttribute('height','25%');
    svg.appendChild(rect);
    var RW=rect.width.baseVal;
    document.body.removeChild(svg);
    try{
      RW.convertToSpecifiedUnits(SVG_LENGTHTYPE_PX);
      if(isFinite(RW.value)&&!isNaN(RW.value)&&Math.abs(RW.value-200)<1){
        goodVals++;// returned correct 200px value
      }else{
        badVals++;
        L('ADR134[T4]['+i+']: unexpected value='+RW.value,'warn');
      }
    }catch(e){crashes++;}
    svg.remove();
  }
  L('ADR134[T4]: 10x results — crashes='+crashes+' goodVals='+goodVals+' badVals='+badVals,'info');
  if(badVals>0){L('★★★ ADR134[T4]: GARBAGE VALUES from convert on detached!','hit');}
  if(goodVals>0){L('★★★ ADR134[T4]: WORKED cleanly (no crash) — maybe context survives?','hit');}

  // Test 5: % on circle cx (percentage of viewport width)
  (function(){
    var svg=document.createElementNS(SVG_NS,'svg');
    svg.setAttribute('width','400');svg.setAttribute('height','300');
    svg.setAttribute('viewBox','0 0 400 300');
    document.body.appendChild(svg);
    var circle=document.createElementNS(SVG_NS,'circle');
    circle.setAttribute('cx','50%');circle.setAttribute('cy','50%');circle.setAttribute('r','25%');
    svg.appendChild(circle);
    var CX=circle.cx.baseVal;
    L('ADR134[T5]: circle.cx.baseVal.unitType='+CX.unitType+' value='+CX.value,'info');
    document.body.removeChild(svg);
    try{
      CX.convertToSpecifiedUnits(SVG_LENGTHTYPE_PX);
      L('ADR134[T5]: circle.cx convert(%→PX): vis='+CX.valueInSpecifiedUnits+' value='+CX.value,'info');
    }catch(e){L('ADR134[T5]: circle.cx convert threw: '+e.message,'warn');}
    svg.remove();
  })();

  // Test 6: move rect to a different svg BEFORE converting
  (function(){
    var svg1=document.createElementNS(SVG_NS,'svg');
    svg1.setAttribute('width','400');svg1.setAttribute('height','300');
    document.body.appendChild(svg1);
    var svg2=document.createElementNS(SVG_NS,'svg');
    svg2.setAttribute('width','800');svg2.setAttribute('height','600');
    document.body.appendChild(svg2);
    var rect=document.createElementNS(SVG_NS,'rect');
    rect.setAttribute('width','50%');rect.setAttribute('height','25%');
    svg1.appendChild(rect);
    var RW=rect.width.baseVal;// grab TearOff while in svg1 (50% of 400 = 200)
    // Move rect to svg2 (50% of 800 = 400) — does the TearOff update?
    svg2.appendChild(rect);// adoptNode implicitly
    L('ADR134[T6]: moved rect to svg2. RW.value='+RW.value,'info');// should be 400 now?
    try{
      RW.convertToSpecifiedUnits(SVG_LENGTHTYPE_PX);
      L('ADR134[T6]: convert in svg2: vis='+RW.valueInSpecifiedUnits+' value='+RW.value,'info');
    }catch(e){L('ADR134[T6]: convert in svg2 threw: '+e.message,'warn');}
    svg1.remove();svg2.remove();
  })();
};

// ═══════════════════════════════════════════════════════════════
// ADR135 — % SVGLength chain — all unit types that need context
//
// From ADR134 we know % → PX conversion on detached crashes.
// Now: what about the REVERSE? Set value to PX while detached,
// then convertToSpecifiedUnits(PERCENTAGE). % conversion also
// needs the viewport reference length. Does it crash too?
//
// Also test: % → CM, % → MM, % → IN (all these ultimately
// need to know the px value first, which needs the viewport).
//
// And: if we START with a PX unitType (not %) and then try
// to convert while detached, does that crash?
// (PX → PX = no-op, PX → CM = uses fixed factor, should be safe)
//
// The full crash condition map: what's the minimal set of
// (unitType, targetType) pairs that crash on detached element?
// ═══════════════════════════════════════════════════════════════
suites['ADR135']=function(){
  L('ADR135: % SVGLength conversion crash map — all direction combos','info');

  function testConvert(initialAttr, srcType, dstType, label){
    var svg=document.createElementNS(SVG_NS,'svg');
    svg.setAttribute('width','400');svg.setAttribute('height','300');
    document.body.appendChild(svg);
    var rect=document.createElementNS(SVG_NS,'rect');
    rect.setAttribute('width',initialAttr);rect.setAttribute('height','100');
    svg.appendChild(rect);
    var RW=rect.width.baseVal;
    var v0=RW.value,vis0=RW.valueInSpecifiedUnits;
    document.body.removeChild(svg);
    var result='';
    try{
      RW.convertToSpecifiedUnits(dstType);
      result='OK: vis='+RW.valueInSpecifiedUnits.toFixed(4)+' value='+RW.value.toFixed(4);
      if(!isFinite(RW.value)||isNaN(RW.value)){result='★GARBAGE: value='+RW.value;}
    }catch(e){result='THREW: '+e.message;}
    L('ADR135['+label+']: src='+srcType+'('+initialAttr+') dst='+dstType+' → '+result,'info');
    svg.remove();
  }

  // PX-based conversions (no context needed): safe
  testConvert('200','PX',SVG_LENGTHTYPE_PX,'PX→PX');
  testConvert('200','PX',SVG_LENGTHTYPE_CM,'PX→CM');
  testConvert('200','PX',SVG_LENGTHTYPE_MM,'PX→MM');
  testConvert('200','PX',SVG_LENGTHTYPE_IN,'PX→IN');
  testConvert('200','PX',SVG_LENGTHTYPE_PT,'PX→PT');
  testConvert('200','PX',SVG_LENGTHTYPE_PC,'PX→PC');

  // % source conversions (need viewport context): these may crash
  testConvert('50%','%',SVG_LENGTHTYPE_PX,'%→PX ★');
  testConvert('50%','%',SVG_LENGTHTYPE_CM,'%→CM ★');
  testConvert('50%','%',SVG_LENGTHTYPE_MM,'%→MM ★');
  testConvert('50%','%',SVG_LENGTHTYPE_IN,'%→IN ★');
  testConvert('50%','%',SVG_LENGTHTYPE_PT,'%→PT ★');
  testConvert('50%','%',SVG_LENGTHTYPE_PC,'%→PC ★');
  testConvert('50%','%',SVG_LENGTHTYPE_PERCENTAGE,'%→% (self)');

  // NUMBER source (unitless = px?) converting to %
  testConvert('200','NUMBER',SVG_LENGTHTYPE_PERCENTAGE,'NUMBER→% ★');

  // CM source converting to %
  testConvert('5cm','CM',SVG_LENGTHTYPE_PERCENTAGE,'CM→% ★');

  // reading .value on a %-based TearOff while detached (without converting)
  (function(){
    var svg=document.createElementNS(SVG_NS,'svg');
    svg.setAttribute('width','400');svg.setAttribute('height','300');
    document.body.appendChild(svg);
    var rect=document.createElementNS(SVG_NS,'rect');
    rect.setAttribute('width','50%');rect.setAttribute('height','100');
    svg.appendChild(rect);
    var RW=rect.width.baseVal;
    var inDomValue=RW.value;// read while in DOM → should be 200
    document.body.removeChild(svg);
    var detachedValue;
    try{detachedValue=RW.value;}catch(e){detachedValue='THREW:'+e.message;}
    L('ADR135[readOnly]: inDOM.value='+inDomValue+' detached.value='+detachedValue,'info');
    if(typeof detachedValue==='number'&&detachedValue!==inDomValue){
      L('★★★ ADR135[readOnly]: VALUE CHANGED on detach! in='+inDomValue+' out='+detachedValue,'hit');
    }
    svg.remove();
  })();
};

// ═══════════════════════════════════════════════════════════════
// ADR136 — TearOff bypass: ResizeObserver + IntersectionObserver
//
// ADR133 confirmed: TearOff writes bypass MutationObserver.
// The write still updates getAttribute() but doesn't fire MO.
//
// Now: what about ResizeObserver? If we write to viewBox via TearOff,
// does the SVG resize? (SVG size = CSS width/height, not viewBox —
// so RO should NOT fire for viewBox changes.) But what about
// writing to SVGLength width/height attributes via TearOff?
//
// And IntersectionObserver: if we write a child's cx/cy to move it
// completely off-screen, does IO fire? If IO fires → TearOff write
// triggers layout. If IO doesn't fire → TearOff write is below
// the layout observer threshold.
//
// The goal: map exactly which observer APIs see TearOff writes.
// ═══════════════════════════════════════════════════════════════
suites['ADR136']=function(){
  L('ADR136: TearOff bypass — ResizeObserver + IntersectionObserver','info');
  var container=document.createElement('div');
  document.body.appendChild(container);

  // === ResizeObserver test ===
  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('width','200');svg.setAttribute('height','200');
  svg.setAttribute('viewBox','0 0 1000 1000');
  container.appendChild(svg);

  var roFires=0,roLastSize=null;
  var ro=new ResizeObserver(function(entries){
    roFires++;
    for(var e of entries){roLastSize={w:e.contentRect.width,h:e.contentRect.height};}
  });
  ro.observe(svg);

  // Wait for initial RO fire, then do TearOff writes
  setTimeout(function(){
    var roBaseline=roFires;
    L('ADR136[RO]: baseline fires='+roBaseline,'info');

    // Write viewBox via TearOff (not setAttribute)
    var VB=svg.viewBox.baseVal;
    for(var i=0;i<10;i++){VB.width=500+i*10;VB.height=500+i*10;}
    L('ADR136[RO]: wrote viewBox 10x via TearOff','info');

    // Write SVG CSS width via TearOff
    var W=svg.width.baseVal;
    for(var i=0;i<10;i++){W.value=200+i*10;}
    L('ADR136[RO]: wrote svg.width 10x via TearOff. final='+W.value,'info');

    setTimeout(function(){
      L('ADR136[RO]: total RO fires='+roFires+' (baseline was '+roBaseline+')','info');
      if(roFires>roBaseline){
        L('★★★ ADR136[RO]: ResizeObserver FIRED on TearOff writes!','hit');
      }else{
        L('ADR136[RO]: ResizeObserver did NOT fire — TearOff bypasses RO','info');
      }
      ro.disconnect();

      // Compare: setAttribute triggers RO?
      var ro2Fires=0;
      var ro2=new ResizeObserver(function(){ro2Fires++;});
      ro2.observe(svg);
      setTimeout(function(){
        var ro2Base=ro2Fires;
        for(var i=0;i<10;i++) svg.setAttribute('width',String(200+i*10));
        setTimeout(function(){
          L('ADR136[RO2]: setAttribute fires RO: '+(ro2Fires-ro2Base),'info');
          ro2.disconnect();

          // === IntersectionObserver test ===
          var target=document.createElementNS(SVG_NS,'circle');
          target.setAttribute('cx','100');target.setAttribute('cy','100');target.setAttribute('r','50');
          svg.appendChild(target);

          var ioFires=0;
          var io=new IntersectionObserver(function(entries){
            ioFires+=entries.length;
            L('ADR136[IO]: IO fired! intersecting='+entries[0].isIntersecting,'info');
          });
          io.observe(target);

          setTimeout(function(){
            var ioBase=ioFires;
            // Move circle off-screen via TearOff
            var CX=target.cx.baseVal;
            CX.value=100000;// way off screen
            L('ADR136[IO]: moved circle to cx=100000 via TearOff','info');

            setTimeout(function(){
              L('ADR136[IO]: IO fires after TearOff move: '+(ioFires-ioBase),'info');
              if(ioFires>ioBase){
                L('★★★ ADR136[IO]: IntersectionObserver FIRED on TearOff write!','hit');
              }else{
                L('ADR136[IO]: IO did NOT fire — TearOff below IO threshold','info');
              }
              io.disconnect();
              container.remove();
            },200);
          },100);
        },100);
      },100);
    },100);
  },50);
};

// ═══════════════════════════════════════════════════════════════
// ADR137 — TearOff bypass: attributeChangedCallback on custom element
//
// Custom elements can observe attribute changes via:
//   static get observedAttributes() { return ['cx']; }
//   attributeChangedCallback(name, oldValue, newValue) { ... }
//
// SVG custom elements are built by extending SVGElement:
//   class MySVGEl extends HTMLElement { ... }
//   customElements.define('my-svg-el', MySVGEl)
//
// BUT — SVGCircleElement etc. are NOT customizable via customElements.
// You can't extend SVGCircleElement directly in the current spec.
//
// However: you CAN create a custom element that WRAPS an SVG element,
// or use a custom element as a CHILD of an svg element.
//
// The real test: if we make a custom element inside <svg>,
// grab its SVGAnimatedLength (wait — custom elements don't get SVGAnimatedLength).
//
// Alternative: MutationObserver watching specific attribute names.
// From ADR133 we know TearOff writes don't fire MO for viewBox.
// Does this hold for ALL SVGAnimatedLength attributes?
// Test: watch rect.getAttribute('width') changes with MO.
// TearOff writes to rect.width.baseVal updated getAttribute in v79.
// Do those updates also fire MO for 'width'?
// ═══════════════════════════════════════════════════════════════
suites['ADR137']=function(){
  L('ADR137: TearOff bypass — MO attribute watch per-attribute + custom element probe','info');

  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('width','400');svg.setAttribute('height','400');
  svg.setAttribute('viewBox','0 0 1000 1000');
  document.body.appendChild(svg);

  var rect=document.createElementNS(SVG_NS,'rect');
  rect.setAttribute('width','300');rect.setAttribute('height','200');
  rect.setAttribute('x','0');rect.setAttribute('y','0');
  svg.appendChild(rect);

  // MO watching rect for 'width' attribute changes
  var moWidthFires=0;
  var moWidth=new MutationObserver(function(muts){moWidthFires+=muts.length;});
  moWidth.observe(rect,{attributes:true,attributeFilter:['width']});

  var moViewBoxFires=0;
  var moViewBox=new MutationObserver(function(muts){moViewBoxFires+=muts.length;});
  moViewBox.observe(svg,{attributes:true,attributeFilter:['viewBox']});

  // TearOff writes to rect.width
  var RW=rect.width.baseVal;
  for(var i=0;i<10;i++) RW.value=400+i*10;
  L('ADR137: wrote rect.width TearOff 10x. value='+RW.value,'info');
  L('ADR137: getAttribute(width)='+rect.getAttribute('width'),'info');

  // TearOff writes to viewBox
  var VB=svg.viewBox.baseVal;
  for(var i=0;i<10;i++){VB.width=800+i;VB.height=800+i;}
  L('ADR137: wrote viewBox TearOff 10x','info');

  // Compare: setAttribute for same attrs
  for(var i=0;i<10;i++) rect.setAttribute('width',String(500+i));
  for(var i=0;i<10;i++) svg.setAttribute('viewBox','0 0 '+(900+i)+' '+(900+i));

  setTimeout(function(){
    L('ADR137: moWidth fires — TearOff path: (checked before setTimeout)','info');
    L('ADR137: moWidth total fires='+moWidthFires,'info');
    L('ADR137: moViewBox total fires='+moViewBoxFires,'info');
    // The 10 TearOff + 10 setAttribute = should be 10 if TearOff bypasses, 20 if not
    if(moWidthFires===10){
      L('★★★ ADR137: TearOff BYPASSES MO for rect.width! (only 10/20 fired)','hit');
    }else if(moWidthFires===20){
      L('ADR137: MO fires for BOTH TearOff AND setAttribute (20/20)','info');
    }else{
      L('ADR137: unexpected MO count='+moWidthFires,'warn');
    }
    if(moViewBoxFires===10){
      L('★★★ ADR137: TearOff BYPASSES MO for viewBox too! (10/20)','hit');
    }else if(moViewBoxFires===20){
      L('ADR137: viewBox MO fires for both paths (20/20)','info');
    }
    moWidth.disconnect();moViewBox.disconnect();
    svg.remove();
  },100);
};

// ═══════════════════════════════════════════════════════════════
// ADR138 — TearOff bypass: CSS attribute selector response
//
// CSS attribute selectors like [width="500"] or [viewBox*="500"]
// update styling based on attribute values.
//
// If TearOff writes update getAttribute() output, they SHOULD
// also update CSS attribute selector matching — because CSS
// selector matching reads the DOM attribute value.
//
// Test: style a rect as red when [width="500"]. Write width=500
// via TearOff. Does the color change? If yes → TearOff triggers
// CSS re-evaluation (= real DOM attribute update). If no →
// TearOff updates getAttribute() but NOT the CSS selector tree.
//
// Also: :attr() (CSS property access to HTML attributes) — not
// widely supported yet but worth probing.
//
// More importantly: CSS animations using attr() — does a TearOff
// write to 'x' attribute feed into a CSS animation via attr(x)?
// ═══════════════════════════════════════════════════════════════
suites['ADR138']=function(){
  L('ADR138: TearOff bypass — CSS attribute selector response','info');
  var style=document.createElement('style');
  style.textContent=
    'rect[data-test][width="500"]{fill:red!important}'+
    'rect[data-test].baseline{fill:blue}';
  document.head.appendChild(style);

  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('width','400');svg.setAttribute('height','400');
  document.body.appendChild(svg);
  var rect=document.createElementNS(SVG_NS,'rect');
  rect.setAttribute('width','300');rect.setAttribute('height','100');
  rect.setAttribute('x','0');rect.setAttribute('y','0');
  rect.setAttribute('data-test','1');
  rect.classList.add('baseline');
  svg.appendChild(rect);

  var cs0=window.getComputedStyle(rect);
  L('ADR138: initial fill='+cs0.fill,'info');// should be blue

  // TearOff write: width = "500"
  var RW=rect.width.baseVal;
  RW.value=500;
  L('ADR138: after TearOff write(500): getAttribute='+rect.getAttribute('width'),'info');

  // Check CSS selector match after TearOff write
  var cs1=window.getComputedStyle(rect);
  L('ADR138: fill after TearOff write(500)='+cs1.fill,'info');
  if(cs1.fill==='rgb(255, 0, 0)'||cs1.fill==='red'){
    L('★★★ ADR138: CSS [width="500"] MATCHED after TearOff write! CSS sees the change!','hit');
  }else{
    L('ADR138: CSS did not match [width="500"] — TearOff may not update CSS selector tree','info');
  }

  // Compare: setAttribute("width","500") — should definitely match
  rect.setAttribute('width','300');// reset
  rect.setAttribute('width','500');
  var cs2=window.getComputedStyle(rect);
  L('ADR138: fill after setAttribute(500)='+cs2.fill,'info');

  // Reset and try forcing a style recalc
  rect.setAttribute('width','300');
  RW.value=500;
  // Force style recalc by reading offsetWidth
  var dummy=svg.getBoundingClientRect();
  var cs3=window.getComputedStyle(rect);
  L('ADR138: fill after TearOff + getBoundingClientRect()='+cs3.fill,'info');

  style.remove();
  svg.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR139 — huge-child float32 clamping — 33554432 boundary probe
//
// ADR129 showed: child with x=1e10 → getBBox().x = 33554428
// That's suspicious — 33554432 = 2^25.
//
// float32 can represent integers exactly up to 2^24 = 16777216.
// Beyond that, float32 loses precision at 2-unit granularity (2^25=33554432 is exact).
// Beyond 2^25, float32 loses at 4-unit granularity. Max exact int = 2^24.
//
// What WebKit seems to be doing: storing geometry in float32, and
// 1e10 as float32 = 10000000000 rounds to nearest float32 = 10000000000?
// Wait — 1e10 fits in float32 (max is 3.4e38). But it loses precision.
// float32(1e10) = 9999999488 (nearest float32 to 1e10).
// getBBox returned 33554428 — that's much smaller than 1e10.
// This suggests WebKit is NOT using float32 for coordinates. Instead,
// it's clamping to a max coordinate value.
//
// Let's probe the exact clamping value:
// Binary search between 1e7 and 1e10 for the exact clamp point.
//
// Also: what happens when BOTH x AND width are huge?
// x = 3e7, width = 3e7 → right edge = 6e7 → does this overflow the union rect?
// ═══════════════════════════════════════════════════════════════
suites['ADR139']=function(){
  L('ADR139: float32/geometry clamping — coordinate boundary probe','info');
  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('width','200');svg.setAttribute('height','200');
  svg.setAttribute('viewBox','0 0 1000 1000');
  document.body.appendChild(svg);

  function bbX(x){
    var r=document.createElementNS(SVG_NS,'rect');
    r.setAttribute('x',String(x));r.setAttribute('y','0');
    r.setAttribute('width','100');r.setAttribute('height','100');
    svg.appendChild(r);
    var bb;try{bb=r.getBBox();}catch(e){bb={x:null};}
    svg.removeChild(r);
    return bb.x;
  }

  // Probe powers of 2
  var pow2=[1e3,1e4,1e5,1e6,1e7,2e7,3e7,4e7,5e7,1e8,1e9,1e10];
  for(var i=0;i<pow2.length;i++){
    var bx=bbX(pow2[i]);
    L('ADR139: x='+pow2[i]+' → getBBox().x='+bx+(bx!==pow2[i]?'  ←CLAMPED':''),'info');
  }

  // Binary search for exact clamp
  var lo=1e7,hi=1e8;
  for(var iter=0;iter<20;iter++){
    var mid=Math.floor((lo+hi)/2);
    var bx=bbX(mid);
    if(bx===mid) lo=mid;
    else hi=mid;
    if(hi-lo<=1) break;
  }
  L('ADR139: clamp boundary ≈ '+lo+' to '+hi,'info');
  L('ADR139: exact clamp point: bbX('+lo+')='+bbX(lo)+' bbX('+hi+')='+bbX(hi),'info');

  // Both x and width huge
  var r2=document.createElementNS(SVG_NS,'rect');
  r2.setAttribute('x','30000000');r2.setAttribute('y','0');
  r2.setAttribute('width','30000000');r2.setAttribute('height','100');
  svg.appendChild(r2);
  try{
    var bb2=r2.getBBox();
    L('ADR139: x=3e7 w=3e7 getBBox: x='+bb2.x+' w='+bb2.width+' right='+(bb2.x+bb2.width),'info');
    if(!isFinite(bb2.x+bb2.width)||isNaN(bb2.x+bb2.width)){
      L('★★★ ADR139: NaN/Inf in bbox right edge!','hit');
    }
  }catch(e){L('ADR139: dual-huge getBBox threw: '+e.message,'warn');}
  svg.removeChild(r2);

  // Write huge x via TearOff
  var r3=document.createElementNS(SVG_NS,'rect');
  r3.setAttribute('x','0');r3.setAttribute('y','0');
  r3.setAttribute('width','100');r3.setAttribute('height','100');
  svg.appendChild(r3);
  var RX=r3.x.baseVal;
  RX.value=1e10;// write huge value via TearOff
  L('ADR139: TearOff x=1e10 → attr='+r3.getAttribute('x'),'info');
  try{
    var bb3=r3.getBBox();
    L('ADR139: after TearOff x=1e10: getBBox().x='+bb3.x,'info');
    if(bb3.x!==bbX(1e10)){L('★★★ ADR139: TearOff gives DIFFERENT clamp than setAttribute!','hit');}
  }catch(e){L('ADR139: after TearOff x write getBBox threw: '+e.message,'warn');}

  svg.remove();
};

// ═══════════════════════════════════════════════════════════════
// ADR140 — Full alive map of ALL SVGAnimatedLength TearOffs (5000 iters)
//
// v79 ADR130 showed that some "0ms" results at 500 iters were
// actually alive (0.20µs) at 5000 iters. Now test EVERYTHING.
//
// Test attributes not yet covered:
// - rect.x, rect.y (position — are these alive?)
// - circle.cy, circle.r (cy alive? r?)
// - ellipse.ry (was rx alive, what about ry?)
// - ellipse.cx, ellipse.cy
// - line.x1, line.y1, line.x2, line.y2
// - svg.y.baseVal (was x alive, what about y?)
// - <image>.x, .y, .width, .height
// - <foreignObject>.x, .y, .width, .height
// - <filter>.x, .y, .width, .height (if SVGFilterElement)
// - <pattern>.x, .y, .width, .height, .patternUnits
// - <rect> rx, ry (border radius)
//
// Each: 5000 iters detached, check attr update.
// ═══════════════════════════════════════════════════════════════
suites['ADR140']=function(){
  L('ADR140: full SVGAnimatedLength TearOff alive map — 5000 iters','info');
  var svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('width','200');svg.setAttribute('height','200');
  svg.setAttribute('viewBox','0 0 1000 1000');
  document.body.appendChild(svg);

  function testTearOff(label,el,getTF,attrName,writeVal){
    svg.appendChild(el);
    var tf=getTF(el);
    if(!tf){L('ADR140['+label+']: no TearOff','warn');el.remove();return;}
    svg.removeChild(el);
    var ITER=5000,errors=0;
    var t0=performance.now();
    for(var i=0;i<ITER;i++){try{tf.value=writeVal+i;}catch(e){errors++;break;}}
    var t1=performance.now();
    var ms=t1-t0;
    var us=(ms/ITER*1000).toFixed(2);
    var attrV=attrName?el.getAttribute(attrName):'n/a';
    var alive=ms>0.1;
    var attrUpdated=attrName&&(attrV==String(writeVal+ITER-1-errors)||parseFloat(attrV)>writeVal);
    L('ADR140['+label+']: '+(ms).toFixed(2)+'ms ('+us+'µs/write)'+(alive?' ★ALIVE':'')+
      (errors?' [err='+errors+']':'')+
      (attrName?' attr='+attrV+(attrUpdated?' ★ATTR':''):''),
      (alive||attrUpdated)?'hit':'info');
    el.remove();
  }

  // rect family
  var mkRect=function(){var r=document.createElementNS(SVG_NS,'rect');r.setAttribute('x','10');r.setAttribute('y','20');r.setAttribute('width','300');r.setAttribute('height','200');r.setAttribute('rx','5');r.setAttribute('ry','5');return r;};
  testTearOff('rect.x',     mkRect(),function(e){return e.x.baseVal;},'x',11111);
  testTearOff('rect.y',     mkRect(),function(e){return e.y.baseVal;},'y',22222);
  testTearOff('rect.width', mkRect(),function(e){return e.width.baseVal;},'width',33333);
  testTearOff('rect.height',mkRect(),function(e){return e.height.baseVal;},'height',44444);
  testTearOff('rect.rx',    mkRect(),function(e){return e.rx.baseVal;},'rx',55555);
  testTearOff('rect.ry',    mkRect(),function(e){return e.ry.baseVal;},'ry',66666);

  // circle family
  var mkCircle=function(){var c=document.createElementNS(SVG_NS,'circle');c.setAttribute('cx','100');c.setAttribute('cy','100');c.setAttribute('r','50');return c;};
  testTearOff('circle.cx', mkCircle(),function(e){return e.cx.baseVal;},'cx',11111);
  testTearOff('circle.cy', mkCircle(),function(e){return e.cy.baseVal;},'cy',22222);
  testTearOff('circle.r',  mkCircle(),function(e){return e.r.baseVal;},'r',33333);

  // ellipse family
  var mkEllipse=function(){var e=document.createElementNS(SVG_NS,'ellipse');e.setAttribute('cx','100');e.setAttribute('cy','100');e.setAttribute('rx','80');e.setAttribute('ry','40');return e;};
  testTearOff('ellipse.cx', mkEllipse(),function(e){return e.cx.baseVal;},'cx',11111);
  testTearOff('ellipse.cy', mkEllipse(),function(e){return e.cy.baseVal;},'cy',22222);
  testTearOff('ellipse.rx', mkEllipse(),function(e){return e.rx.baseVal;},'rx',33333);
  testTearOff('ellipse.ry', mkEllipse(),function(e){return e.ry.baseVal;},'ry',44444);

  // line family
  var mkLine=function(){var l=document.createElementNS(SVG_NS,'line');l.setAttribute('x1','0');l.setAttribute('y1','0');l.setAttribute('x2','500');l.setAttribute('y2','500');return l;};
  testTearOff('line.x1', mkLine(),function(e){return e.x1.baseVal;},'x1',11111);
  testTearOff('line.y1', mkLine(),function(e){return e.y1.baseVal;},'y1',22222);
  testTearOff('line.x2', mkLine(),function(e){return e.x2.baseVal;},'x2',33333);
  testTearOff('line.y2', mkLine(),function(e){return e.y2.baseVal;},'y2',44444);

  // svg own dimensions
  var mkSvg=function(){
    var s=document.createElementNS(SVG_NS,'svg');
    s.setAttribute('x','0');s.setAttribute('y','0');
    s.setAttribute('width','200');s.setAttribute('height','200');
    return s;
  };
  // For nested svg — append to outer svg first
  (function(){
    var inner=mkSvg();
    svg.appendChild(inner);
    var WB=inner.width.baseVal;
    var HB=inner.height.baseVal;
    var XB=inner.x.baseVal;
    var YB=inner.y.baseVal;
    svg.removeChild(inner);
    var t0=performance.now();for(var i=0;i<5000;i++)WB.value=100+i;var t1=performance.now();
    L('ADR140[inner.width]: '+(t1-t0).toFixed(2)+'ms attr='+inner.getAttribute('width'),(t1-t0>0.1)?'hit':'info');
    t0=performance.now();for(var i=0;i<5000;i++)HB.value=100+i;t1=performance.now();
    L('ADR140[inner.height]: '+(t1-t0).toFixed(2)+'ms attr='+inner.getAttribute('height'),(t1-t0>0.1)?'hit':'info');
    t0=performance.now();for(var i=0;i<5000;i++)XB.value=100+i;t1=performance.now();
    L('ADR140[inner.x]: '+(t1-t0).toFixed(2)+'ms attr='+inner.getAttribute('x'),(t1-t0>0.1)?'hit':'info');
    t0=performance.now();for(var i=0;i<5000;i++)YB.value=100+i;t1=performance.now();
    L('ADR140[inner.y]: '+(t1-t0).toFixed(2)+'ms attr='+inner.getAttribute('y'),(t1-t0>0.1)?'hit':'info');
    inner.remove();
  })();

  // image
  (function(){
    var img=document.createElementNS(SVG_NS,'image');
    img.setAttribute('x','0');img.setAttribute('y','0');
    img.setAttribute('width','100');img.setAttribute('height','100');
    svg.appendChild(img);
    var WB=img.width.baseVal;svg.removeChild(img);
    var t0=performance.now();for(var i=0;i<5000;i++)WB.value=100+i;var t1=performance.now();
    L('ADR140[image.width]: '+(t1-t0).toFixed(2)+'ms attr='+img.getAttribute('width'),(t1-t0>0.1)?'hit':'info');
    img.remove();
  })();

  // foreignObject
  (function(){
    var fo=document.createElementNS(SVG_NS,'foreignObject');
    fo.setAttribute('x','0');fo.setAttribute('y','0');
    fo.setAttribute('width','100');fo.setAttribute('height','100');
    svg.appendChild(fo);
    var WB=fo.width.baseVal;svg.removeChild(fo);
    var t0=performance.now();for(var i=0;i<5000;i++)WB.value=100+i;var t1=performance.now();
    L('ADR140[foreignObject.width]: '+(t1-t0).toFixed(2)+'ms attr='+fo.getAttribute('width'),(t1-t0>0.1)?'hit':'info');
    fo.remove();
  })();

  svg.remove();
};
